{"pg":41,"k":"law","t":"Abs. 3). Klar: Wessen Grundflächen nichts für das Wild tun, der soll auch nichts für sie erhalten."},{"pg":42,"k":"p","t":"Stehende oder fließende Gewässer bieten für sich allein keine jagdliche Nutzbarkeit. Enten jagern allein ist halt zu wenig... (Draustau Völkermarkt bei Brenndorf)"},{"pg":42,"k":"p","t":"J 6 Abs. 1: Die in einer Flächen sind der"},{"pg":42,"k":"li","t":"... von mindestens 115 Hektar..."},{"pg":42,"k":"p","t":"Warum ausgerechnet diese ungerade Zahl, wird so mancher murmeln. Im Burgenland sind es sogar 300 ha! Das ist eine Folge der Umrechnung. Im Jagdpatent 1849 waren es 200 Joch, daraus sind eben diese 115 Hektar geworden."},{"pg":42,"k":"p","t":"Ein wenn auch seltener, so doch denkbarer Fall der Eigenjagdbildung verdient gesondert erwähnt zu werden: 50 Hektar besitze ich in Kärnten, 100 Hektar in der Steiermark In beiden Fällen nach dem alten Spruch zum Leben zu wenig, zum Sterben zu viel. Das Gesetz findet tröstende Worte: Wenn alle sonstigen Voraussetzungen erfüllt sind, ist das nach §§"},{"pg":42,"k":"law","t":"Abs. 2 möglich, und zwar betreffend die Bundesländer Salzburg, Steiermark und Tirol."},{"pg":42,"k":"q","t":"Ist letztere Möglichkeit der Eigenjagdbildung auch anzuwenden, wenn man die oben erwähnten 100 Hektar in Niederösterreich hat? Wenn ja, warum? Falls nein, warum nicht?"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":9,"title":"Die Gemeindejagd","pg":43,"blocks":[{"pg":43,"k":"law","t":"§ 6 Abs. 1: Die in einer Gemeinde liegenden, zusammenhängenden, jagdlich nutzbaren Grundstücke, welche nicht zu einem Eigenjagdgebiet gehören und ein Mindestausmaß von 500 ha erreichen, bilden das Gemeindejagdgebiet."},{"pg":43,"k":"law","t":"Abs. 2: Auf begründeten Antrag der Gemeinde können mebrere Gemeindejagdgebiete gebildet werden (§ 9 Abs. 5), wenn für jedes Jagdgebiet die Voraussetzungen des Absatz 1 zutreffen und wenn nicht die Interessen an einer großflächigen jagdlichen Bewirtschaftung zur Vermeidung von waldgefährdenden Wildschäden entgegenstehen."},{"pg":43,"k":"p","t":"Das ist jetzt etwas leichter zu erklären, weil die Begriffe „zusammenhängend\" und „jaglich nutzbar\" schon bekannt sind. Ganz grob gesagt: Man stelle sich auf einer Landkarte die nunmehr festgestellten Eigenjagden vor, sinnigerweise in Form von natürlich grünen Flecken. Man wird dann feststellen, dass so mancher Teil Kärntens nicht bekleckst worden ist, sondern weiß geblieben ist. Was soll jagdgebietsmäßig damit geschehen? Ganz einfach: Das wird dann zur Gemeindejagd, sofern... in einer Gemeinde liegend. Gemeindeübergreifende Gemeindejagden kann es vom Begriff her nicht geben. Sonst müsste es ja „Bezirksjagd\" oder so heißen."},{"pg":43,"k":"p","t":"... Mindestgröße 500 Hektar. Was darunter liegt, kann nicht Gemeindejagd werden, solche Flächen sind den benachbarten Jagdgebieten anzuschließen (siehe § 10). Ausnahme Seite 44.... und mehrere Gemeindejagdgebiete in einer Gemeinde?"},{"pg":43,"k":"p","t":"Siehe obigen Absatz 2: Wenn das potentielle Gemeindejagdgebiet groß genug ist, ist allerdings noch nicht gesagt, dass es nur eine Gemeindejagd geben kann. Sehr oft werden sich etliche Jagdgesellschaften gebildet haben und der Bürgermeister wird nicht wissen, ob er der Jagdgesellschaft St. Hubertus, dem Jagdverein vom Grünen Bruch oder der Jagdgesellschaft vom Letzten Bissen den Vorzug geben soll In solchen Fällen erweist es sich als zweckmäßig, mehrere Gemeindejagdgebiete zu bilden und sich auf diese Art das Wählerpotential zu erhalten. Zum Beispiel. Selbstverständlich müssen all diese Gebiete die geforderte Mindestgröße haben, es wird jedoch zusätzlich noch zu prüfen sein, ob nicht wegen der Gefahr allfälliger Wildschäden es gescheiter wäre, sie zusammen zu lassen."},{"pg":43,"k":"p","t":"Aber nochmals: Nicht der Bürgermeister entscheidet darüber, sondern die BH im Zuge der Jagdgebietsfeststellung. Und wie immer im Verwaltungsverfahren geht nichts ohne Antrag - in diesem Fall der Gemeinde, und weil eine derartige Aufsplitterung nicht die Regel sein sollte, sieht das Gesetz vor, dass sie diesen Antrag zu begründen hat."},{"pg":44,"k":"p","t":"Die Gemeindejad:.. in einer Gemeinde liegend, zusammenhängend, jagdlich nutzbar, zumindest 500 Hektar... (Hochfestib) Eine politisch aktuelle Ausnahme vom genannten Mindestmaß bietet dann noch"},{"pg":44,"k":"law","t":"Abs. 3: Auf Antrag der Gemeinde kann von der Landesregierung nach Anhören des Landesjagdbeirates und der Kärntner Jägerschaft in Fällen, in denen das Mindestausmaß von 500 ha (Abs. 1) nicht erreicht wird, ein Gemeindejagdgebiet dann festgestellt werden (§ 9), wenn die in der Gemeinde liegenden, jagalich nutzbaren Grundstücke ein Ausmaß von mindestens 115 ha erreichen, zusammenhängen und einen geordneten Jagdbetrieb ermöglichen."},{"pg":44,"k":"p","t":"Man beachte allerdings den Unterschied:"},{"pg":44,"k":"li","t":"Es entscheidet in diesem Fall nicht wie ansonsten bei der Jagdgebietsfeststellung die BH, sondern die Landesregierung."},{"pg":44,"k":"li","t":"Unter 115 Hektar geht gar nichts."},{"pg":44,"k":"li","t":"Landesjagdbeirat und Kärntner Jägerschaft sind anzuhören."},{"pg":44,"k":"li","t":"Es muss noch zusätzlich geprüft werden, ob ein geordneter Jagdbetrieb (siehe nochmals, falls man es noch nicht auswendig kann, § 3 Abs. 2!) möglich ist. Bei 500 Hektar bedarf es dieser weiteren Prüfung nicht, da wird er als selbstverständlich vorausgesetzt."},{"pg":44,"k":"li","t":"Das ganze Gebilde nennt sich Sonderjagdgebiet. Jetzt wissen Sie, warum."},{"pg":44,"k":"law","t":"§ 4a : Die Bestimmur J 8 Abs. 1: Gehege Gibt es eine Landesgrenzen überschreitende Gemeindejagd?"},{"pg":44,"k":"p","t":"Nennen Sie ein Beispiel!"},{"pg":45,"k":"p","t":"BH,"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":10,"title":"Das Gehege","pg":45,"blocks":[{"pg":45,"k":"p","t":"Vorweg eine vorhin beim Thema „Wild\" aus Gründen der Übersicht verschwiegene Ergänzung zu § 4 :"},{"pg":45,"k":"p","t":"/ 4a: Die Bestimmungen dieses Gesetzes finden - soweit nicht ausdrücklich anderes bestimmt ist - keine Anwendung auf Wild, das in Gehegen ([ 8) gehalten wird."},{"pg":45,"k":"p","t":"Ein Gehege ist gelinde gesagt jagdrechtlich uninteressant. Die Gehegefläche ist jagdlich nicht nutzbar und wird bei der Jagdgebietsfeststellung nicht miteinbezogen. Wir müssen also etwas lernen, um genau zu wissen, was uns in weiterer Folge nicht zu interessieren hat... Nun denn:"},{"pg":45,"k":"p","t":"1 8 Abs. 1: Gehege im Sinne dieses Gesetzes sind eingefriedete Grundflächen, auf denen Wild (§ 4) entweder zur Schau, zur Zucht, zur ausschließlichen Gewinnung von Fleisch im Rahmen eines landwirtschaftlichen Betriebes, zu Forschungszwecken oder zu vergleichbaren Zwecken gehalten wird."},{"pg":45,"k":"p","t":"Man benötigt also"},{"pg":45,"k":"li","t":"eingefriedete Grundflächen. Das wird der Betreiber im eigenen Interesse so handhaben. Nicht zu verwechseln mit dem Jagdgatter, das nicht unter diesen Begriff fällt. Dort ist das erklärte Ziel ja zu jagen. Gehege müssen so gegen das Nachbargrundstück abgeschlossen sein, dass Wild (mit Ausnahme von Federwild) weder ein- noch auswechseln kann. Das leuchtet ein, warum soll der Nachbar gegen seinen Willen mit dem Gehegeinhalt, etwa mit Sauen, konfrontiert werden. Und wenn er es will, wird er ohnehin geeignete Mittel (große Blechschere)"},{"pg":45,"k":"p","t":"finden. Sagt man."},{"pg":45,"k":"li","t":"auf denen Wild... Im Gehege muss Wild im Sinne des $ 4 KJG gehalten werden. Wer Zebras züchten möchte, braucht nicht das Verfahren nach § 8 in Anspruch zu nehmen."},{"pg":45,"k":"p","t":"Das Gehege: eingefriedete Grundflächen, auf denen..."},{"pg":46,"k":"li","t":"zu Schauzwecken. Das nächstliegende Beispiel wäre der Tierpark Rosegg."},{"pg":46,"k":"li","t":"zu Zuchtzwecken"},{"pg":46,"k":"li","t":"zur ausschließlichen Gewinnung von schaftlichen Betriebes. Letzteres ist wichtig. Der zivilisationsmüde Großstädter, der auf seinen zwei Hektar einige Damhirsche hält, wird dadurch noch nicht zum Gehegebesitzer."},{"pg":46,"k":"li","t":"zu Forschungszwecken oder zu vergleichbaren Zwecken."},{"pg":46,"k":"p","t":"Was fällt dem Gesetzgeber beim Stichwort Gehege sonst noch alles ein?"},{"pg":46,"k":"li","t":"Es dürfen nur solche Wildarten gehalten werden, für die das Gehege das... Wild entweder zur Schau, Zucht..."},{"pg":46,"k":"p","t":"entsprechende Biotop aufweist."},{"pg":46,"k":"li","t":"Es müssen ausreichende natürliche Asungsmöglichkeiten und Fütterungsmöglichkeiten vorhanden sein."},{"pg":46,"k":"li","t":"Wild darf nur vom Eigentümer oder von Personen getötet werden, die vom Eigentümer hiez beauftragt worden sind. Der Verkauf von Abschüssen ist verboten. (Hubertus, schau oba!)"},{"pg":46,"k":"li","t":"Es gelten keine Schonzeiten"},{"pg":46,"k":"li","t":"Man benötigt zur „Erlegung\" auch keine Jagdkarte"},{"pg":46,"k":"li","t":"Man braucht sich auch keine Gedanken zu machen über Abschussplanung, Abschussme: dung, Trophäenvorlage, Wildschadensverhütung."},{"pg":46,"k":"p","t":"So, und jetzt zu einer weiteren rechtlichen Problematik. Die Person der Handlung - Hanst"},{"pg":46,"k":"p","t":"- ist frei erfunden, um Ehrenbeleidigungsklagen vorzubeugen, betone ich, dass jede Ahnlichkeit mit noch lebenden oder schon toten Hirschen rein zufällig wäre."},{"pg":46,"k":"p","t":"Hansi also har den Höhepunkt seines Lebens erreicht, es ist ein reifer Kronenzwölfer aus ihm geworden. Ja, es hat sich ausgezahlt, ihn im Gehege zu belassen, etliche „Jäger\" haben schon manches für ihn geboten. Der Gehegeinhaber hat immer abgelehnt. Erstens is Der artiges verboten und zweitens war der Hirsch noch zu jung, da stimmt das Preis/Leistung* dürfte eine Frage der Höhe des Honorars sein."},{"pg":46,"k":"p","t":"derte nis noch nicht. Heuer wird das zweite Argument wegfallen, der Entfall des estern. Doch dann kam der Sturm, noch dazu des nachts. Der alte Grenzbaum hat das nicht aushalten, seine morschen Knochen - pardon, Äste - fielen auf den zaun und drückten chos Geflecht nieder; Hansi nützte die Jahrhundertchance und empfahl sich."},{"pg":46,"k":"p","t":"Stelle, wo man es r Das bedeutet in 1"},{"pg":47,"k":"p","t":"... zur ausschließlichen Gewinnung von Fleisch im Rahmen eines landwirtschaftlichen Betriebes gehalten wird. Wir wollen sein unentrinnbares Schicksal nicht weiterverfolgen, sondern zwischenzeitig etwas in den Gesetzestexten schmökern. Einen Lösungsbeitrag finden wir zunächst an einer Stelle, wo man es nicht erwarten würde, weit weg vom Jagdgesetz, im Allgemeinen Bürgerlichen Gesetzbuch (ABGB). $ 384 ABGB bestimmt, dass der Eigentümer von zahmen oder zahm gemachten Tieren das Recht hat, sie auf fremden Grund zu verfolgen, dies durch 42 Tage, solange sind sie also „kein Gegenstand des freien Tierfanges\""},{"pg":47,"k":"p","t":"Das bedeutet in unserem Fall, dass Hansi durch 42 Tage dem Aneignungsrecht des Gehegehalters unterliegt. Der Fall ist klar, wenn er etwa ein rotes Bändchen oder eine Glocke um hätte. Dann weiß ein jeder, es kann sich nur um Gatterwild handeln. Hansi ist ein stolzer Hirsch, so etwas würde er nicht tragen. Aber da gibt es noch etwas:"},{"pg":47,"k":"p","t":"18 Abs. 8: Bricht Wild aus einem Gehege aus, so ist der Anleger verpflichtet, unverzüglich die Landesregierung, die Jagdausübungsberechtigten der umliegenden Jagdgebiete und die Kärntner Jägerschaft zu verständigen..."},{"pg":47,"k":"p","t":"Diese Verständigung ist nicht nur eine Verpflichtung, sondern reinste Selbsterhaltung. Jetzt wissen die Nachbarn, dass Gatterwild - zahmes Wild - ausgebrochen ist, und dass die 42-Tage-Uhr zu ticken begonnen hat."},{"pg":47,"k":"p","t":"Alles weitere ist eine Frage der Örtlichkeit. In der hochwildfreien Zone sind die Kronenhirsche bekanntlich dünn gesät, da wird Hansi stets wiederzuerkennen sein. In Rotwildkern-"},{"pg":48,"k":"p","t":"gehen wid der Gateria enth wie an trum voren auen e gesagt, nach 42 Tagen löst sich das Problem von selbst."},{"pg":48,"k":"p","t":"sher iden as ich - nier wie on selbst n vorgeschoben win e darauch regenel st denkbar De landen it hegeinhal oder sur de voten reederich Nah selbst zu überassen. Bei Schalenwild amen vit ich das cun zu Problemen kommen könnte. Daher:"},{"pg":48,"k":"law","t":"§ 8 Abs diter Satz Die Entassung von Schalenwild in die freie wildbahn beamp der Genehmigung der Landesregierung."},{"pg":48,"k":"p","t":"Diese wird die Genehmigung logischerweise nur dann erteilen, wenn"},{"pg":48,"k":"li","t":"keine nachteiligen Auswirkungen auf ein ausgeglichenes Geschlechterverhaltnis und. Altersaufbau dieser Wildart zu erwarten sind"},{"pg":48,"k":"li","t":"und wenn weder ein zahlenmäßig für die Land- und Forstwirtschaft abträglicher Vi. stand entsteht"},{"pg":48,"k":"li","t":"noch eine Zunahme von Wildschäden zu erwarten ist."},{"pg":48,"k":"li","t":"Bei Rotwild darf die Entlassung nur in Rotwildkernzonen oder in Rotwildrandzonen e. folgen."},{"pg":48,"k":"p","t":"Das Verfahren Vorweg: Wer ein Gehege errichten möchte, muss sich ohnehin insbesondere mit § 8 KJG eingehend auseinandersetzen. Wir wollen an dieser Stelle nur das unbedingt Notwendige festhalten."},{"pg":48,"k":"p","t":"Etwa: Wie komme ich jetzt zu einem Gehege?"},{"pg":48,"k":"p","t":"Vorweg: Zuständig ist die Landesregierung und es handelt sich um ein Anzeigeverfahren"},{"pg":48,"k":"p","t":"- siehe Kapitel 8 „die Entscheidung\". Man benötigt also zunächst"},{"pg":48,"k":"li","t":"eine schriftliche Anzeige an die Landesregierung. Ohne Schriftlichkeit geht gar nichts, ik Behörde braucht ein Papier, auf das sie den Einlaufstempel geben kann. Darin schein au wie der Betreffende sich das vorstellt (Angabe der Wildart, der Höchstzahl des zu halter den Wildes, der Grundstücke oder Grundstücksteile, der geplanten Einfriedung), einco mehr oder weniger gut gezeichneten Lageplan wird er beilegen."},{"pg":48,"k":"li","t":"Die Zustimmung des Grundeigentümers ist angeschlossen. Wenn man glücklichence eben die Tatsache des Eigentums."},{"pg":48,"k":"p","t":"selbst Grundeigentümer ist, muss man nicht seine eigene Zustimmung bestätigen sondin."},{"pg":48,"k":"li","t":"Fürden Fal der Haltung von Schalenwild ist die Rodungsbewilligung in Sine des Nonk. gesetzes anzuschließen, außer es wäre aus im Forstgesetz aufgezählten Gründen kits Die Landesregierur"},{"pg":48,"k":"li","t":"ob die Größe c"},{"pg":49,"k":"p","t":"Aber, wie Idhaltung solche erforderlich (Größe unter 1.000 Quadratmeter...). Roden muss man also noch nicht, das Gesetz geht davon aus, dass das schon das Wild selbst machen wird."},{"pg":49,"k":"p","t":"Die Landesregierung hat sodann zu prüfen"},{"pg":49,"k":"li","t":"ob Wild (außer Federwild natürlich) wegen allenfalls schlampiger Zäunung wohl nicht ein- oder auswechseln könnte,"},{"pg":49,"k":"li","t":"ob der Biotop der Wildart entspricht, die dort gehalten werden soll,"},{"pg":49,"k":"li","t":"ob die Größe des Geheges für die angegebenen Höchstzahlen der Wildarten ausreicht,"},{"pg":49,"k":"li","t":"ob alles den Anforderungen des Tierschutzes entspricht,"},{"pg":49,"k":"li","t":"ob nicht die Jagdausübung in den umliegenden Jagdgebieten wesentlich beeinträchtig ist. Wenn eines dieser Erfordernisse nicht vorhanden ist, hat sie das Vorhaben zu untersagen. Ansonsten kann sie feststellen, dass nicht untersagt wird - oder sie rührt sich einfach nicht. Wenn man 8 Wochen (nach Einlangen der Anzeige) nichts hört, kann man mit der Errichtung beginnen."},{"pg":49,"k":"p","t":"Die einzige noch offene Frage ist: Ja, was sagt denn der Jäger dazu, dass auf einmal ein Teil seines womöglich besten Jagdgebietes eingezäunt ist, er zwar einen Bombenanblick hat, das allerdings nur durch einen Zaun, wie er einstens Ost und West trennte?"},{"pg":49,"k":"p","t":"Deswegen gibt es auch die Bestimmung:"},{"pg":49,"k":"li","t":"In seinem Eigenjagdgebiet kann der Grundeigentümer sofort - nach diesen 8 Wochen"},{"pg":49,"k":"p","t":"- beginnen, wenn die verbleibende Fläche so groß ist, dass die Eigenschaft als Eigenjagdgebiet erhalten bleibt."},{"pg":49,"k":"li","t":"Im Gemeindejagdgebiet allerdings erst nach Ablauf der Pachtzeit, außer der Pächter ist damit einverstanden und die festgestellte Eigenschaft als Gemeindejagdgebiet geht nicht verloren. Die Halterhaftung: Wollte ich schon längst einmal erwähnen. Wie Sie wissen haften Sie für die Untaten ihres Hundes, weil Sie sein Halter sind. Auch den Halter eines Tierparks trifft diese Haftung. So muss er etwa in der Brunftzeit der Hirsche diese so verwahren, dass sie in ihrer zu diesem Zeitpunkt jedenfalls vorhandenen Aggressivität die körperliche Sicherheit der Besucher nicht gefährden."},{"pg":49,"k":"p","t":"Und jetzt die gute Nachricht: Der Jagdausübungsberechtigte ist nicht Halter seines Wildes. Ihn kann die Halterhaftung somit nicht treffen."},{"pg":49,"k":"q","t":"Aus dem Schaugehege ist ein Wolf ausgebrochen. Kann ich ihn - nach Ablauf der 42-Tagesfrist - erlegen? Wenn ja, warum? Falls nein, warum nicht?"},{"pg":50,"k":"p","t":"Netter Anblick. Aber jagen kann ich hier erst, wenn das Jagdgebiet durch die Behörde als solches festgestellt ist."}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":11,"title":"Die Jagdgebietsfeststellung","pg":50,"blocks":[{"pg":50,"k":"p","t":"Wie bereits angedeutet: So ein Jagdgebiet ist auf der einen Seite zwar etwas Handgreiflichs zum Anfassen: Ich kann auf ihm gehen, ich kann tun, was ich will, von frischer - Luft - Holen für Hund, Herrl und Büchse bis zum Erlegen von Wild; und dessen ungeachtet ist 6 (auch) ein juristisches Gebilde, ähnlich einem Kartenhaus immer existenzbedrohenden Gefahren ausgesetzt und mit einem deutlichen Ablaufdatum versehen:"},{"pg":50,"k":"law","t":"§ 9 Abs. 1: Die Jagdgebiete werden durch die Bezirksverwaltungsbehörde auf die Dauer der Pachtzeit der Gemeindejagd (§ 17 Abs. 1) festgestellt."},{"pg":50,"k":"li","t":"Es bedarf zunächst einer Feststellung durch die BH. Diese äußert sich mit Beschein (das wissen wir schon), in diesem steht, ob es sich um eine Eigenjagd (Fläche... Jagdausübungsberechtigter...) oder um eine Gemeindejagd handelt."},{"pg":50,"k":"li","t":"Dieses nunmehr von der BH geschaffene Gebilde hält, wenn nichts dazwischen komm. durch zehn Jahre (nichts anderes bedeutet die Formulierung, auf die Dauer der Pact: zeit der Gemeindejagd\"), und zwar vom 1.1.2011 bis Ende 2020. Dann beginnt alle wieder von vorne, Hatbarkeit vom 1.1.2021 bis Ende 2030 und so weiter: Der Feste lungsbescheid wird also in jedem Fall lle zehn Jahre neu erlassen, es gibt somit ers. „gebrauchte Eigenjagd\""},{"pg":50,"k":"p","t":"18. ate vor der ominösen Endatierung (also vor Ablauf der Pachteit der emicale 2) hặt die BH eine Kundmachung zu erlassen, mit welcher die Grundeigentüme d. il nun die Fingd anspruchen aufgefordert werden, dies binnen 6 Wochen bild."},{"pg":50,"k":"p","t":"Eigenjagd heißt jec Falls Sie laut hir"},{"pg":51,"k":"p","t":"genjagd und es hat sich am Flächenausmaß nichts geändert, dann kann man sich zumindest diesen Weg ersparen, der Antrag gilt sozusagen automatisch als eingebracht."},{"pg":51,"k":"p","t":"Diese Kundmachung wird"},{"pg":51,"k":"p","t":"a) erlassen und somit angeschlagen am Amtssitz der BH und an der Gemeinde"},{"pg":51,"k":"p","t":"b) zugestellt den Grundeigentümern, die das Eigenjagdrecht auf Grundstücken ausüben, die an das Gemeindejagdgebiet angrenzen."},{"pg":51,"k":"p","t":"Ein (noch) nicht festgestelltes Jagdgebiet ist ein rechtliches Nichts, es ist noch nicht existent, man kann also nicht nur nicht darauf jagen, sondern es ist dies sogar verboten. Man muss sich das so vorstellen wie mit dem neuen, noch nicht gelieferten Geländewagen. Er ist noch in der Fabrik oder sonst wo, aber ich würde mich jedenfalls lächerlich machen so zu tun, als ob ich damit schon fahren könnte. Die „Lieferung\" der Eigenjagd erfolgt erst mit dem Bescheid der BH."},{"pg":51,"k":"p","t":"Ein rechtlich sehr interessanter Begriff sei hier nur am Rande erwähnt: Die Nichtigkeit (§ 9 Abs. 8). Obwohl ein Bescheid über die Feststellung einer Eigenjagd schon rechtskräftig ist"},{"pg":51,"k":"p","t":"- da fährt der Zug drüber, würde man normalerweise sagen -, kann die Landesregierung ihn innerhalb eines Jahres (ab Rechtskraft) aufheben, wenn die Begriffe „zusammenhängend\" und „jagdlich nutzbar\" falsch interpretiert worden sind. Das Sektglas zu heben empfiehlt sich also erst nach Ablauf dieser Jahresfrist."},{"pg":51,"k":"p","t":"Eigenjagd heißt jedoch noch nicht automatisch, nur auf eigenem Grund zu jagen. Es gibt da auch im Zusammenhang mit einer Eigenjagd zwei Möglichkeiten, die mir das Tor zum fremden Grund hin öffnen. Es sind dies:"},{"pg":51,"k":"li","t":"Der Anschluss"},{"pg":51,"k":"li","t":"Die Abrundung a. Der Anschluss Falls Sie laut hinausposaunen, dass Sie für einen Anschluss sind, müssen Sie nicht unbedingt mit dem Wiederbetätigungsgesetz in Konflikt kommen. Es muss nur der jagdrechtliche Zusammenhang klar ersichtlich bleiben. Denn:"},{"pg":51,"k":"law","t":"§ 10 Abs. 1: Benachbarten Jagdgebieten sind von der Bezirksverwaltungsbehörde unter Bedachtnahme auf einen geordneten Jagdbetrieb anzuschließen:..."},{"pg":51,"k":"p","t":"Das bedeutet also: Die BH entscheidet (wieder einmal) mit Bescheid, dass unter gewissen Voraussetzungen eine genau bezeichnete Grundfläche einer Eigenjagd angeschlossen wird, obwohl sie gemäß Grundbuchstand nicht dem Eigentümer dieser Eigenjagd gehört. Und Vorsicht: Eine rein private Vereinbarung zwischen den beiden Grundeigentümern schafft noch keinen Anschluss, sie kann bestenfalls die Voraussetzung dafür sein. Entscheiden muss immer die BH!"},{"pg":52,"k":"p","t":"command:"},{"pg":52,"k":"p","t":"Flicht zu einem Jagdgebiet gehörende jagdlich nurbare Ggundsto ke, die (zusammen) Folgende Grundflächen können dem Nachbarn angeschlossen werden:"},{"pg":52,"k":"p","t":"Nicht zu endeing digröße nicht schaffen. Nach dem Motto: Irgendwo muss man ja dazu die remein einsame sagen wir 100 ha von Eigenjagden umgeben sind, kann ihr Schick: siren der Anschluss sein. Welchem Nachbarn anzuschließen ist, haben wie immer dlic St nut dte nes geordneten Jagdbetriebes zu entscheiden. Es können auch mehrere Nachbarn unter diesem Gesichtspunkt beglückt werden."},{"pg":52,"k":"li","t":"Jagdlich nicht nutzbare Grundstücke - siehe dazu die Meditationen Zu § 7 Abs. 3 - der berühmte See."},{"pg":52,"k":"li","t":"Eigenjagdgebiete, hinsichtlich derer auf die Ausübung des Eigenjagdrechtes verzichtet worden ist. Das kennen wir schon - siehe § 2 Abs.6."},{"pg":52,"k":"li","t":"Grundflächen im Sinne des § 7 Abs. 2 (bitte gegebenenfalls dort noch einmal nachschauen!). Nehmen wir als Beispiel eine Straße, und zwar nicht eine solche, die durch das Revier führt, da gibt es das Problem ja nicht, sie gehört selbstverständlich zum Revier. Aber was ist, wenn sie sich exakt an der Grenze zwischen Revier A und Revier B befindet? Sie interessiert in Wahrheit jagdlich niemanden, der Bock kommt ja selten genug auf dieser zu geeigneter Ansitzzeit daherspaziert. Man hat in Wahrheit nur Scherereien mit dem Straßenfallwild, sollte immer rufbereit sein und hat dann doch nur die meistens nicht einmal mehr als Hundefutter tauglichen traurigen Folgen eines Anpralls Auto gegen Wild aufzuklauben. Hier bestimmt die BH dann den Anschluss, mit anderen Worten, sie befiehlt, wer nach einem derartigen Verkehrsunfall in der Nacht geweckt werden soll."},{"pg":52,"k":"li","t":"Eigenjagd gemäß § 9 Abs. 6: Wer es geschafft hat, bei laufender Pachtperiode Grundflächen in der Größe einer Eigenjagd zusammenzuklauben: Gratuliere! Wer aber dann die Anmeldefrist - siehe eingangs zu diesem Kapitel - versäumt: Mein Beileid! Die Grundfläche bleibt bei der Gemeindejagd bzw. ist, wenn von Eigenjagdgebieten umschlossen, einem (oder mehreren) benachbarten Jagdgebieten anzuschließen."},{"pg":52,"k":"li","t":"Grundflächen gemäß § 14 Abs. 1: Diese Gesetzesbestimmung behandelt die (teilweise) Veräußerung von Grundstücken und ihr jagdrechtliches Schicksal. Siehe später:"},{"pg":52,"k":"p","t":"Gekauft während der Pachtperiode. Hoffentlich wurde die Anmeldefrist nicht versäumt. Sonst ist (bleibt) es ein Fall für einen Anschluss."},{"pg":52,"k":"p","t":"net!), = 64.000 Scl"},{"pg":53,"k":"p","t":"ie, die (zusammen)"},{"pg":53,"k":"p","t":"luss man ja dazuged, kann ihr Schicken wie immer die u § 7 Abs. 3 - der Ten Worten, sie lie (teilweise)"},{"pg":53,"k":"p","t":"päter."},{"pg":53,"k":"p","t":"Sons 56 Ein Anschluss - egal aus welchen der aufgezählten Gründen - gilt als Pachtverhältnis. Die Vereinbarung über die Höhe des Pachtzinses muss, wie alles im Jagdgesetz, schriftlich gemacht werden. (Der Gesetzgeber hat ein tiefes Misstrauen gegen mündliche Biertischvereinbarungen und hat gar nicht so unrecht damit.) Falls man sich nicht einigt, entscheidet (wieder einmal) die BH."},{"pg":53,"k":"p","t":"In früheren Zeiten hat es nun eine interessante Variante gegeben, als Verpächter zu noch mehr Geld zu kommen. Ein Beispiel: 160 Hektar Eigenjagd, davon 40 Hektar Anschluss. Verpachtet wurde um 400 Schilling pro Hektar (damals hat man noch in Schillingen gerechnet!), = 64.000 Schilling, und etwas aufrunden wird man wohl auch noch dürfen. Die 40 Hektar Anschlussfläche betreffend wurde vom Verpächter jedoch der ortsübliche Pachtzins"},{"pg":53,"k":"p","t":"- im fraglichen Gebiet vielleicht § 36 - an den Eigentümer dieser Fläche weitergeleitet. Das war bis zur Novelle 1991, diese hat dieser gängigen Praxis ein Ende gesetzt:"},{"pg":53,"k":"law","t":"§ 10 Abs. 2 Satz 2:... Kommt eine Einigung über den Pachtzins nicht zustande, so ist er von der Bezirksverwaltungsbehörde festzusetzen;"},{"pg":53,"k":"p","t":"bei Gemeindejagden und nicht verpachteten Eigenjagden sind biebei die Pachtzinse zu berücksichtigen, die für Jagden erzielt werden, die in der Nähe liegen und im wesentlichen gleiche oder ähnliche jagdliche Verhältnisse aufweisen;"},{"pg":53,"k":"p","t":"bei verpachteten Eigenjagden ist der für die Eigenjagd vereinbarte Pachtzins festzusetzen."},{"pg":53,"k":"p","t":"Das heißt, dass nunmehr die § 400 pro Hektar ohne Abzug weiterzuleiten wären. b. Die Abrundung, der Flächentausch Der Unterschied zum Anschluss vorweg: Es kommt nichts (oder nur wenig) dazu, das ursprüngliche Flächenausmaß soll nach Möglichkeit erhalten bleiben."},{"pg":53,"k":"p","t":"{ 11 Abs. 1: Jagdgebiete können im Interesse eines geordneten Jagdbetriebes auf Antrag der Gemeinde, der Eigenjagdberechtigten oder von Amts wegen durch die Bezirksverwaltungsbehörde abgerundet werden. Hiebei können Grundflächen von einem Jagdgebiet abgetrennt oder einem benachbarten angeschlossen Flächen aneinandergrenzender Jagdgebiete getauscht werden; soweit möglich, ist dem Flächentausch der Vorzug zu geben..."},{"pg":53,"k":"p","t":"(2): Außer der Abrundung nach Abs. 1 kann aus Gründen eines geordneten Jagdbetriebes auf Antrag der Gemeinde oder der Eigenjagdberechtigten oder von Amts wegen von der Bezirksverwaltungsbehörde ein Austausch von Flächen größeren Ausmaßes verfügt werden, wobei das ursprüngliche Flächenausmaß eines Jagdgebietes nach Möglichkeit erhalten bleiben soll."},{"pg":54,"k":"p","t":"einige Hektar auf der anderen Seite von Fluss oder Straße widersprechen zumeist den Grundsätzen eines geordneten Jagdbetriebes und sind ein Fall für Abrundung oder Flächentausch. (Blick vom Lilienberg auf die Drau mit Hoch- und Kleinobir im Hintergrund)"},{"pg":54,"k":"li","t":"Die Abrundung: Das typische Beispiel, das nach einer solchen schreit, ist der (möglichst breite) Fluss und ein paar zerquetschte Hektar auf der anderen Seite. Selbstverständlich ist es im Interesse eines geordneten Jagdbetriebes, wenn diese der Revierinhaber bejagt, der ansonsten „für drüben\" zuständig ist."},{"pg":54,"k":"li","t":"Der Flächentausch: Wenn es diesem gegengleich so geht, er also ebenfalls einige Streuparzellen diesseits der Drau (der Name ist auswechselbar) hat, ist das ein Flächentausch, den jede BH zugestehen müsste."},{"pg":54,"k":"li","t":"Beim Flächentausch größeren Ausmaßes (obiger Absatz 2) ist nach Möglichkeit darauf zu achten, dass das ursprüngliche Flächenausmaß erhalten bleibt."},{"pg":54,"k":"p","t":"In allen Fällen zu prüfen ist, ob dies wohl im Interesse eines geordneten Jagdbetriebes ist. Zweckmäßigerweise wird die Behörde bei einer derartigen Beurteilung einen Sachverständigen beiziehen."},{"pg":54,"k":"p","t":"Falls die Grundfächen in verschiedenen Bezirken liegen, ist, wie es so schön heißt, die Entscheidung von den zuständigen Bezirksverwaltungsbehörden einvernehmlich zu treffen Fals diese es - aus welchen Gründen immer - nicht schaffen, entscheidet die Landesregierung. Betreffend Entgelt gilt das Gleiche wie beim Anschluss."},{"pg":54,"k":"p","t":"Zeitliche Reihenfolge der Entscheidung der Behörde also:"},{"pg":54,"k":"h","t":"aa) Feststellung der Eigenjagden"},{"pg":54,"k":"p","t":"bb) Was nicht darunter fällt: Feststellung der Gemeindejagden Cc) Dann erst: Anschlussverfahren, Abrundung..."},{"pg":54,"k":"law","t":"§ 12 : Die Bezirksv Wie eingangs al"},{"pg":55,"k":"p","t":"Noch einen Begriff bietet uns der Gesetzgeber in diesem Zusammenhang:"},{"pg":55,"k":"p","t":"c. Die Zerlegung Bei der Gemeindejagd haben wir schon über diese Möglichkeit gesprochen. Bei der Eigenjagd besteht sie auch. Für drei Reviere zu je 300 Hektar bekommt man bekanntlich mehr Pacht als für ein Revier zu 900 ha. Die Jagdausübungsberechtigten tendieren daher sehr erfreut zu dieser ihnen vom Gesetzgeber offerierten Möglichkeit."},{"pg":55,"k":"law","t":"§ 12 : Die Bezirksverwaltungsbehörde darf auf Antrag des Jagdausübungsberechtigten die Zerlegung von Eigenjagdgebieten in mehrere selbständige Jagdgebiete genehmigen, wenn die Flächenausdehnung jedes Teilgebietes im Zusammenbang das für das betreffende Jagdgebiet erforderliche Mindestausmaß aufweist..."},{"pg":55,"k":"p","t":"Geprüft wird (wie nicht anders zu erwarten)"},{"pg":55,"k":"li","t":"ob die Zerlegung aus Gründen eines geordneten Jagdbetriebes gerechtfertigt ist"},{"pg":55,"k":"li","t":"ob es zur Vermeidung von waldgefährdenden Wildschäden nicht doch besser bei der großflächigen jagdlichen Bewirtschaftung bleiben sollte."},{"pg":55,"k":"p","t":"Wie eingangs ausgeführt werden alle diese Maßnahmen für die Dauer der Pachtzeit der Gemeindejagd getroffen. Aber: Alles kann sich ändern, und plötzlich ist ein dickes fettes Asphaltband nahe der Reviergrenze, womöglich mit Wildzaun, und das alles würde dringend nach einem Flächentausch schreien. Da muss jetzt nicht gewartet werden, bis die zehn Jahre vorbei sind. Die Behörde kann vielmehr über Anschluss, Abrundung, Flächentausch und Zerlegung auch unter der Zeit neu entscheiden. Natürlich nicht nach dem Motto, dass sie sich ihre einstige Entscheidung noch einmal neu überlegen soll, sondern nur dann, wenn sich etwas Gravierendes geändert hat."},{"pg":55,"k":"p","t":"Wie in allen Fällen ist aber auch hier die Wirksamkeit der Entscheidung nur für die (restliche) Dauer der Pachtzeit der Gemeindejagd gegeben."},{"pg":55,"k":"p","t":"Bei der Zerlegung bedarf es u. U. einer kleinen Wartefrist; sie wird erst mit dem Zeitpunkt wirksam, zu dem die im Zeitpunkt des Eintrittes der Rechtskraft laufende Geltungsdauer des Abschussplanes endet. Diese Bestimmung war in Hinblick auf den zweijährigen Abschussplan notwendig geworden."},{"pg":55,"k":"q","t":"Jagdgebiete werden also durch die BH festgestellt. Ist da eine Ausnahme denkbar?"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":12,"title":"Die Veräußerung des Jagdgebietes","pg":56,"blocks":[{"pg":56,"k":"p","t":"ben Eigentümer gehörend\", wie es $ 5 so streng fordert?"},{"pg":56,"k":"p","t":"v2 etieh, em Grundfichen verkauf engsten - dann sind sie ja nicht mehr dent Gehören se zu ciner Gemeindeigd selt ich das Problem sa hiterandich nich de Fieres met envir uns allerdings etwas überlegen brav. hat dies der Gesetzgeber für tan getan:"},{"pg":56,"k":"p","t":"514 Abs : Ton einer Veräußerung eines Eigenjagdsebietes oder von teilen davon bal der Grundeigentümer die Bezirksverwaltungsbehörde und die Kärntner Jägerschaft zu verständigen. Wird ein Eigenjagdgebiet teilweise veräußert, so bleibt das Eigenjagdrecht binsichtlich jener Grundfläche aufrecht, welche den Erfordernissen für eine Eigenjagd entspricht. Grundfächen, die den Erfordernissen für ein Eigenjagdgebiet nicht mebr entsprechen, sind von der Bezirksverwaltungsbehörde unter Bedachtnabme auf einen geordneten Jagdbetrieb Jagdgebieten anzuschließen."},{"pg":56,"k":"p","t":"Zwei Möglichkeiten werden jetzt angesprochen:"},{"pg":56,"k":"li","t":"Von einer z. B. 150 Hektar großen Eigenjagd werden 30 Hektar verkauft. Die Eigenjagd bleibt, 120 Hektar reichen ja bekanntlich dafür: Die 30 Hektar jedoch werden angeschlos sen - benachbarten Jagdgebieten, wie es so schön heißt, siehe § 10 Abs. 1 lit. e. Das kann die einstige Heimatjagd sein, muss es aber nicht."},{"pg":56,"k":"li","t":"Von den 150 Hektar werden 70 Hektar verkauft. 80 Hektar verbleiben, die Fläche liegt deutlich unter der Eigenjagdgrenze. Die gesamte Eigenjagd zerfällt, und zwar sofort - mit der grundbücherlichen Eintragung des Eigentümerwechsels sind beide Flächen benachbarten Jagdgebieten anzuschließen."},{"pg":56,"k":"p","t":"Das Beispiel ist plakativ, aber es gibt auch schmerzhafte Grenzfälle. Wenn etwa von exakt 115 Hektar auch nur einer davon (oder ein Bruchteil davon, etwa um im Erbgang die weichende Tochter durch einen Baugrund zufriedenzustellen) wegfällt, ist auch die Eigenjagd In allen Fällen einer Veräußerung (ob zur Gänze oder teilweise) sind Bezirksverwaltungs behörde und Kärntner Jägerschaft zu verständigen!"},{"pg":56,"k":"p","t":"Das Gegenteil, nämlich zu einer Eigenjagd zu kommen, ist schon schwieriger:"},{"pg":56,"k":"law","t":"§ 14 Abs. 2: Entsteht im Laufe der Pachtdauer der Gemeindejagd ein Eigenjagdgebiet, so tritt die Befugnis zur Ausübung der Eigenjagd auf diesem Gebiet erst nach Ablauj Feststellung dieses Jagdgebietes (§ 9) ein..."},{"pg":56,"k":"p","t":"der Pachtdauer unter der Voraussetzung der ordnungsgemäßen Anmeldung und und „sechs Wochen\"."},{"pg":56,"k":"p","t":"Sinne hier das vorige Kapitel Jagdgebietsfestellung\" und die Zeiträume „18 Monate\" Falls nein, warum r liegen. Dort „П"},{"pg":57,"k":"p","t":"Wer also seine Eigenjagdgröße geschafft hat, muss warten können. Bei der Eigenjagd ist es also wie beim neuen Geländewagen: Man spart eine Ewigkeit, um ihn sich leisten zu können; im Falle eines Unfalls kann der Wertverlust in Richtung Null sich jedoch in Sekundenschnelle abspielen."},{"pg":57,"k":"p","t":"(An dieser Stelle hatte ich eigentlich eine Werbeeinschaltung einer Kaskoversicherung vorgesehen, habe jedoch kein lukratives Angebot erhalten)."},{"pg":57,"k":"q","t":"Von 120 Hektar werden 20 Hektar zwar nicht verkauft, jedoch verschenkt. Gilt dann obige Regelung auch? Wenn ja, warum? Falls nein, warum nicht?"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":13,"title":"Ruhen der Jagd","pg":57,"blocks":[{"pg":57,"k":"p","t":"Treibjagd über den Hauptplatz in St. Veit? Schuss auf den Rehbock vom Kirchturmstüberl aus? Selbst dem unbedarftesten Jäger wird schwanen, dass da etwas nicht stimmen kann. Richtig: An gewissen Orten kann und darf man nicht jagen, obwohl sie im eigenen Jagdgebiet liegen. Dort „ruht die Jagd\""},{"pg":57,"k":"p","t":"\". Genauer gesagt sind es folgende:"},{"pg":57,"k":"law","t":"§ 15 Abs. 1: Auf Friedhöfen, in Häusern und Gehöften samt den dazugebörigen, durch Umfriedung vollständig abgeschlossenen Höfen und Hausgärten, in unmittelbarer Nähe von nicht derart abgeschlossenen Gebäuden sowie auf öffentlichen Anlagen und industriellen oder gewerblichen Zwecken dienenden Werksanlagen rubt die Jagd."},{"pg":57,"k":"p","t":"a)... auf Friedhöfen..."},{"pg":57,"k":"p","t":"Beliebte Prüfungsfrage: Erzählen Sie etwas über „Ruhen der Jagd\"! Stereotype Antwort von 98 Prozent aller Prüfungskandidaten:Auf Friedhöfen ruht die Jagd. Sicherlich richtig, dort ruht bekanntlich alles außer (zunächst) der Friedhofsgärtner und allfällige Trauernde. In der Praxis nicht sonderlich aktuell, nicht jedes Jagdgebiet verfügt über eine derartige Örtlichkeit. Wenn sich tatsächlich eine Bejagung als erforderlich erweisen würde, wie etwa der ansonsten überhand nehmenden Hasen am Wiener Zentralfriedhof, müsste man bei der Behörde um eine Ausnahmegenehmigung vorstellig werden (und sich für Friedhofsbesucher eine larnkappe anschaffen)."},{"pg":57,"k":"p","t":"Auf Friedhöfen ruht die Jagd ebenso wie"},{"pg":58,"k":"p","t":"b)... in Häusern und Gehöften..."},{"pg":58,"k":"p","t":"Ds ischeint so logisch, dass man es oft gar nicht erwälen. icte ist klar dass man dơn als erstechten und in das Schlafrimmer des Huberbaus is tes ernen Pasan nicht nưết. schgeschewche Das Gegenteil wird leicht verdrängt: Was ist C) denn, wenn ich ron dòt Jgießer aus am gegenüberliegenden Hang das Bcklein bringe en ettolster au cit Fensterbristung lege, die Büchse dann ordentich in Anschlag bringe und abdrücke? Gemit. lieh, sicherlich, und ohne Stress für Wild, Jäger und Hund. Aber wo war denn die Jagilaus übung - In der Hitte und somit an einem Ort, wo die Jagd ruht Außer es erklärt mieta jemand überzeugend, dass das Abziehen des Abzuges nichts mit Jagdausübung zu tun hatel An dieser Stelle Können Sie übrigens auch Ihre neu erworbenen Kenntnisse zum Begrif der Weidgerechtigkeit anbringen..."},{"pg":58,"k":"p","t":"c)... durch Umfriedung vollständig abgeschlossene Höfe..."},{"pg":58,"k":"p","t":"Die Betonung liegt auf vollständig. Spätestens wenn diverse Kletterkünste gefordert werden, um über den Zaun zu gelangen, müsste einem auffallen, dass hier die Jagd ruhen könte (worauf ja im übrigen schon das Wort umfriedet hindeutet)."},{"pg":58,"k":"p","t":"d)... und Hausgärten..."},{"pg":58,"k":"p","t":"Auch diese müssen vollständig umfriedet sein. Ein Hausgarten kann naturgemäß nur ein solcher beim Haus sein, also im räumlichen Zusammenhang. Es wird hier immer auf den Einzelfall ankommen - zwei Meter Abstand vom Haus sind noch selbstverständlich, bei 100 Meter wird man nicht mehr von einem „Hausgarten\" sprechen können. Rein vom Begriff her versteht man darunter weiters eine Fläche, auf der die emsige Hausfrau oder wer auch immer Gemüse und/oder Blumen anbaut. Ein Obstgarten ist etwas ganz anderes und mit dieser Regelung nicht gemeint, mag er auch noch so schön umzäunt sein."},{"pg":58,"k":"p","t":"e)... in unmittelbarer Nähe von nicht derart abgeschlossenen Gebäuden..."},{"pg":58,"k":"p","t":"Das ist jetzt eine Sicherheitsfrage, und nur so kann der an und für sich äußerst unbestimm- „in unmittelbarer Nähe\" interpretiert werden. Auch hier wird es immer auf den Einzelfall ankommen, spätestens dann, wenn sich der Hauseigentümer darüber beschwen, dass ihm die Kugeln um die Ohren gepfffen sind (... alles schon gehabt..), wissen wir chas wir hier etwas unrichtig ausgelegt haben."},{"pg":58,"k":"p","t":"f)... sowie auf öffentlichen Anlagen..."},{"pg":58,"k":"p","t":"Hier verschwimmt die Vorstellung bei den meisten Lesern, um was es sich überhaups handein könnte, zumal sicherlich nicht (oder nicht ausschließlich) die öffentlichen VC Anlagen damit gemeint sind. Gedacht ist hier vielmehr an öffentliche Parkanlagen und hauptsächlich öffentliche Verkehrsanlagen wie Eisenbahnstrecken und Straßen. der Zugstrecke V miterlebt hat, v"},{"pg":59,"k":"p","t":"... in unmittelbarer Nähe von nicht abgeschlossenen Gebäuden..."},{"pg":59,"k":"p","t":"Nun wird sicherlich niemand auf die Idee kommen, die Schützen bei einer Treibjagd auf der Zugstrecke Wien-Rom aufzustellen. Ein jeder von uns weiß jedoch, wie oft eine solche Aufstellung am Straßenrand erfolgt! Mit dem Gekeife der Autofahrer wird man bei Verwendung von Ohrenstöpsel ja noch fertig, aber Gnade Gott und Hubertus hilf, wenn der geflügelte Fasan nichts besseres weiß als sich mitten auf die Fahrbahn niederzulassen! Und wer miterlebt hat, wie ein Auto aus diesem Grund verrissen wird und von der Straße abkommt, dem wird schlagartig bewusst, dass der Gesetzgeber hier nicht zu Unrecht Ruhen der Jagd verfügt hat!"},{"pg":59,"k":"p","t":"g)... und industriellen oder gewerblichen Zwecken dienenden Werksanlagen..."},{"pg":59,"k":"p","t":"Wiederum eine Sicherheitsfrage, dieses Mal nicht im Zusammenhang mit der unmittelbaren Nähe zu Häusern, sondern im größeren Umfang zu sehen. Umfriedung ist nicht erforderlich, wird in der Mehrzahl der Fälle aber ohnehin vorhanden sein."},{"pg":59,"k":"p","t":"h)... Verfügung der BH..."},{"pg":59,"k":"p","t":"Die vorhin bezeichneten Örtlichkeiten sind solche, auf denen die Jagd kraft Gesetzes ruht. Aber es gibt noch eine andere Möglichkeit, zu einem Ruhen der Jagd zu kommen:"},{"pg":59,"k":"law","t":"§ 15 Abs. 2: Auf Antrag des Eigentümers oder des Jagdausübungsberechtigten bat die Bezirksverwaltungsbehörde das Ruhen der Jagd auf Grundstücken zu verfügen, die durch eine feste Umfriedung dauernd umschlossen sind."},{"pg":59,"k":"p","t":"Was ist nun mit den vorhin erwähnten Obstgärten? Oder mit den vom Haus zu sehr entfernten Gemüsegärten? Wenn der Grundeigentümer will, dass hier nicht gejagt wird, muss er zunächst für eine „feste Umfriedung\" sorgen und kann dann bei der BH diesbezüglich Ruhen der Jagd beantragen. Derartiges geht immer, also auch unter der Pachtperiode. Diese Gesetzesstelle bezieht sich nicht nur auf die erwähnten Gärtchen, sondern auf alle durch eine feste Umfriedung dauernd umschlossenen Grundstücke."},{"pg":60,"k":"p","t":"... auf öffentlichen Anlagen wie Eisenbahnen und Straßen..."},{"pg":60,"k":"p","t":"Nun ist es vorgekommen, dass die Grundeigentümer zwar Flächen eingezäunt haben, sei es aus Gründen der Schafzucht, sei es aus Schutz vor Verbiss, und keine Anstalten gemacht haben, hier Ruhen der Jagd zu beantragen. Warum auch, sie hatten ja kein Interesse diesbezüglich. Darum wurde richtigerweise verfügt, dass auch dem Jagdausübungsberechtigten hier ein Antragsrecht zusteht. Es ist ja in seinem Interesse zu fixieren, wo man nicht jagen kann und wo es als Folge dessen unlogisch ist, „Jagd\"-Pachtzins zu bezahlen."},{"pg":60,"k":"p","t":"i)... Weidezäune..."},{"pg":60,"k":"law","t":"§ 15 Abs. 3: Auf Grundflächen, die durch landesübliche Weidezäune verhagt sind, findet die Bestimmung des Abs. 2 keine Anwendung."},{"pg":60,"k":"p","t":"Wir reden immer von „fester Umfriedung\". Es erscheint also nur folgerichtig, wenn präzisen wird, dass ein landesüblicher Weidezaun nichts Derartiges darstellt. Ein fester Stromschne vermag also eine feste Umfriedung nicht zu ersetzen."},{"pg":60,"k":"p","t":"Was heißt jetzt „Ruhen der Jagd\"? Eine schlummernde Diana? Ein schnarchender Hubs tus? Betrachten wir es so; Was darf ich tun und was darf ich nicht tun?"},{"pg":60,"k":"li","t":"Wenn wir uns bildlich vorstellen, was mit dem Ablauf einer Jagd im engeren Sim tint Cherweise verbunden ist, wissen wir bereits, was verboten ist: Aufsuchen des Wildes Treiben, Erlegen, Fangen."},{"pg":60,"k":"p","t":"1 63 Abs. 1 letz"},{"pg":61,"k":"p","t":",er-"},{"pg":61,"k":"li","t":"Verboten ist - wichtig für das Jagdschutzorgan - aber auch jede Maßnahme des Wildschutzes nach § 49, ganz allgemein gesagt die Tötung von wildernden Hunden und Katzen (sofern nicht sowieso an anderer Stelle verboten), doch davon später."},{"pg":61,"k":"li","t":"Verboten sind - angesprochen ist jetzt der Grundeigentümer - Vorrichtungen, die einwechselndes Wild hindern, wieder auszuwechseln Einsprünge). Das idente Verbot für den Jagdausübungsberechtigten finden wir in § 63 Abs. 1 letzter Satz. Und weil wir fast alle Jagdausübungsberechtigte sind oder es zumindest werden wollen, merken wir uns das jetzt gleich:"},{"pg":61,"k":"law","t":"§ 63 Abs. 1 letzter Satz: Es ist verboten, in einem Jagdgebiet Vorrichtungen anzubringen oder aufrecht zu erhalten, welche dem Wild das Einwechseln ermöglichen, es jedoch bindern, wieder aus dem betreffenden Jagdgebiet auszuwechseln (Einsprünge)."},{"pg":61,"k":"p","t":"... nicht jedoch auf Grundflächen, die durch"},{"pg":61,"k":"li","t":"Es ist verboten, Wild auf solche Grundlandesübliche Weidezäune verhagt sind."},{"pg":61,"k":"p","t":"flächen zu locken. Dieses Ankirrverbot ist für den Grundeigentümer und ohne Ausnahme gemeint, mag die Rehwildfütterung in Hausnähe auch noch so zur Schaffung einer Vorweihnachtsstimmung beitragen. Das Ankirrverbot für den Jagdausübungsberechtigten finden wir in § 61c. Doch auch davon später zur Genüge."},{"pg":61,"k":"p","t":"Soweit zu den Verboten. Betrachten wir jetzt, was es allenfalls an Erlaubtem gibt:"},{"pg":61,"k":"li","t":"Nachsuche: Ist erlaubt (muss auch schon aus Tierschutzgedanken - schnelle Erlösung des Wildes von seinen Qualen - sein)."},{"pg":61,"k":"law","t":"§ 65 Abs. 5: Wildfolge ist ohne Vereinbarung in Gebieten zulässig, auf denen die Jagd rubt."},{"pg":61,"k":"p","t":"Wildfolge ist, wie wir später noch ausführlich besprechen werden, die Verfolgung eines (vermeintlich) angeschossenen Wildes in fremdes Jagdgebiet."},{"pg":61,"k":"p","t":"Im § 65 Abs. 5 steht nun etwas ganz Selbstverständliches, nämlich, dass der Haus- oder Grundeigentümer zuvor zu benachrichtigen ist. Wir dürfen nicht vergessen, dass wir uns"},{"pg":62,"k":"p","t":"jedenfall auf fremdem Grund befinden, dessen Eigentime in der we nichts zu tun hat, nidentalmal in der Form, dass ihm ein anteiliger Pachtzins zukommen würde. Wer hier nicht dishi ciemehmen mit ihm sucht, hat mit einer saftigen Besitzstörungsklage zu rechnen, die alts he was die Gerichtskostenmarken betrifft den Wildbreterlos nicht wettmachen kann. Ahgeschen davon, dass Derartiges unhöfich und nicht dazu geeignet wäre, das Ansehen der Jagd sonderlich zu heben."},{"pg":62,"k":"li","t":"Frage des allfälligen Fangschusses: Äußerste Vorsicht ist selbstverständlich angesagt, Det Einsatz der Büchse wird oft problematisch sein Aus diesem Grund findet sich in s 68 Abs. Ziffer 2 auch die Bestimmung, dass im besiedelten Gebiet (und nur dort) der Fangschuss mit Schrot erlaubt ist. Sehr oft wird sich lediglich der Fangschuss mit der Faustfeuerwaffe empfehlen. Und wenn man umgeben ist von Polizisten, Polizeiauto und neugierigen Autofahrern, wird man um das Knicken nicht herumkommen."},{"pg":62,"k":"li","t":"Das Wild gehört nach wie vor dem Jagdausübungsberechtigten:"},{"pg":62,"k":"law","t":"§ 15 Abs. 5: Dem Jagdausübungsberechtigten steht die Befugnis zu, sich das Wild, das sich auf den in Abs. 1 und 2 bezeichneten Grundstücken gefangen bat oder dort verendet ist, sowie etwa dort aufgefundene Abwurfstangen und Eier des Federwildes anzueignen."},{"pg":62,"k":"p","t":"Dies gilt nicht für Wild in einem Gehege zur Gewinnung von Fleisch (§ 8 Abs. 1), das derselben Art angehört wie das im Gehege gehaltene Wild."},{"pg":62,"k":"p","t":"Die Ausnahme beim Gehege musste kommen, es wäre zu einfach, wenn der Jagdausübungsberechtigte in einem Gehege mit 100 Rehen auf eines zeigt und Eigentumsansprüche geltend macht."},{"pg":62,"k":"p","t":"Dem Eigentümer der Flächen, wo die Jagd ruht, steht jedoch das Recht zu, zum Schutz der Haustiere Fuchs, Dachs...."},{"pg":63,"k":"p","t":"Zum Thema „Bier des Federwildes\" siehe nochmals § 52 Abs. 3!"},{"pg":63,"k":"li","t":"Eine Erlaubnis besonderer Art bietet noch § 15 Abs. 6 für den Grundeigentümer: 5 15 Abs. 6: Die Eigentrimer der in Abs. 1 und 2 genannten Grundstücke oder die von ihnen beauftragten Personen durfen auf diesen, wenn dies zur Verhütung ernster Schäden in der Tierhaltung, insbesondere zum Schutz der Haustiere, unbedingt erforderlich ist, Füchse, Dachse, Edel- und Steinmarder und Iltisse fangen und töten...... Das gefangene oder getötete Raubwild ist dem Jagdausübungsberechtigten, der zu verständigen ist, auf sein Verlangen zur Verfügung zu stellen."},{"pg":63,"k":"p","t":"Wichtig ist, dass sich diese Bestimmung nur auf Fuchs, Dachs, Marder und Iltis bezieht. Und man muss jetzt nicht unbedingt an Pfeil und Bogen denken oder die Karikatur vor Augen haben, wie die Bäuerin im Nachthemd mit der Heugabel sich auf den in den Hühnerstall eingedrungenen Fuchs stürzt; es ist jede Art der Bewaffnung (Maschinengewehr ausgenommen) erlaubt, da das Verbot, dass eine Schusswaffe (ausgenommen eine Faustfeuerwaffe) nicht verwendet werden darf, mit der Novelle 2001 gefallen ist."},{"pg":63,"k":"p","t":"Wenn dem Landwirt das ewige Warten auf den Fuchs zu dumm wird, kann er natürlich auch den Jäger mit der Erlegung beauftragen. Um Büchse oder Flinte zu verwenden bedarf es dann für diesen aber einer behördlichen Bewilligung, ebenso, wenn es um anderes Raubwild als um das aufgezählte geht."},{"pg":63,"k":"p","t":"Betreffend Iltis und Edelmarder (man beachte: nicht Steinmarder!) findet sich im Gesetz übrigens eine interessante Formulierung:"},{"pg":63,"k":"law","t":"§ 15 Abs. 6 zweiter Satz: Der Fang und die Tötung von Iltissen und Edelmardern ist überdies nur so lange zulässig, als diese ohne Beeinträchtigung in einem günstigen Erhaltungszustand verweilen;"},{"pg":63,"k":"p","t":"liegen diese Voraussetzungen nicht mehr vor, hat die Landesregierung den Fang und die Tötung von Iltissen und Edelmardern durch Verordnung zu verbieten."},{"pg":63,"k":"p","t":"Es ist dies eine Konzession an die FFH-Richtlinie unter Berücksichtigung des Umstandes, dass man den Landwirt ja wohl nicht wird anhalten können, sich zuerst wegen einer allfälligen Schonzeit Gedanken zu machen. Eine derartige Verordnung ist noch nicht in Sicht. Und jetzt die gute Nachricht:"},{"pg":63,"k":"li","t":"Für Gebiete, wo die Jagd ruht, ist, wie bereits angedeutet, kein Pachtschilling zu bezahlen"},{"pg":63,"k":"law","t":"(§ 35 Abs. 2)."},{"pg":63,"k":"li","t":"Es ist auch kein Wildschaden zu ersetzen, außer er wäre verschuldet. § 75 Abs. 6 formuliert so: Pür den Schaden an Grundstücken, auf denen die Jagd rubt (§ 15), ist unbeschadet der Bestimmungen der Abs. 3 und 3a Ersatz nach Maßgabe der Bestimmungen des Allgemeinen Bürgerlichen Gesetzbuches zu leisten."},{"pg":64,"k":"p","t":"Di€ B."},{"pg":64,"k":"p","t":"... Marder und Iltis zu fangen und zu töten."},{"pg":64,"k":"p","t":"Das Jammern des Landwirtes, „der Geier\" hätte schon wieder die beste Legehenne aus dem Hof geholt, werden wir uns also nur anhören, weil wir gutmütig sind und weil wir es uns mit ihm nicht verderben wollen. Ersatzpflicht besteht nämlich keine, uns trifft beim besten Willen kein Verschulden am Hunger der Raubvögel. Abgesehen davon, dass die Greifvögel nach § 51 Abs. 1 geschont sind und schon aus diesen Gründen keine Schadenersatzverpflichtung besteht. Mehr zu dieser für den Standpunkt der Jagd erfreulichen Aussage siehe später unter § 74 Abs. 2 Z 1!"},{"pg":64,"k":"p","t":"Aber zurück zum Verschulden: Beim Fuchs im Hühnerstall kann es schon problematischer sein, ich kann mir vorstellen, dass man einen Bau in Hofnähe populationsmäßig sehr unter Kontrolle haben muss, damit einem nicht vorgeworfen wird, „verschuldeterweise\" nichts gegen eine Überzahl von Hühneranwärtern getan zu haben."},{"pg":64,"k":"q","t":"Kann der Jagdausübungsberechtigte über Ersuchen des Landwirtes ohne weiteres ein Abzugeisen im Hühnerstall aufstellen oder bedarf er hiezu einer Bewilligung? Wenn ja, welcher? Wenn nein, warum nicht?"},{"pg":65,"k":"p","t":"1er 1ts"}]},{"part":"B","partTitle":"Die Verpachtung","nr":1,"title":"Der Jagdpachtvertrag","pg":65,"blocks":[{"pg":65,"k":"p","t":"Zunächst ganz allgemein und unabhängig davon, ob eine Eigenjagd oder eine Gemeindejagd gepachtet werden soll:"},{"pg":65,"k":"law","t":"§ 16 Abs. 1: Das Jagdausübungsrecht darf nur in seiner Gesamtheit Gegenstand eines Pachtvertrages sein."},{"pg":65,"k":"p","t":"Was das Jagdausübungsrecht ist, haben wir in § 2 durchdiskutiert. Ich muss es nicht selbst ausüben, ich kann es verpachten. Aber nur als Ganzes. Der Verpächter begibt sich dadurch jeglichen Rechtes, der Pächter erhält dieses zur Gänze. Man muss sich das so vorstellen wie wenn man ein Auto ausleiht: Man kann dann auch nicht nur mit dem Vordersitz oder mit dem Kofferraum weiterfahren; alles oder nichts."},{"pg":65,"k":"p","t":"In der Praxis gibt es allerdings Grauzonen, die unter Umständen (zumindest nach Meinung der Finanz) sehr schnell zu Schwarz(geld)zonen werden können: Was ist denn das, wenn ich den ler-Hirsch verkaufe? Ein Wildabschussvertrag, mit einer Jagdpacht hat das noch lange nichts zu tun. Und wenn ich den ganzen Hochwildabschuss verschleudere - noch immer nicht. Und dazu den Rehwildabschuss... oder vielleicht den ganzen Abschuss...Und füttern und die Jagdaufsicht machen soll der Abschussnehmer vielleicht auch noch... Ja was bleibt denn dann noch übrig vom Jagdausübungsrecht? Nichts bis gar nichts! Vom Ergebnis her ist es ein Jagdpachtvertrag, getauft (aus Steuerersparnis- oder sonstigen Gründen) als Wildabschussvertrag. So wird jedenfalls zumindest das Finanzamt argumentieren."},{"pg":65,"k":"p","t":"Diese Gesamtheit ist auch örtlich zu sehen: Es geht nicht an, dass die Hälfte eines Jagdgebietes oder was für ein Anteil immer, vielleicht nur der Böswandgraben oder die Jungfernsprungschlucht, verpachtet wird. Die gesamte Fläche, die als Jagdgebiet festgestellt ist, ist zu verpachten."},{"pg":65,"k":"p","t":"Nichts damit zu tun hat die Einteilung in Pirschbezirke, also in Gebiete, zu denen nur eine oder mehrere be- Nur diesen Revierteil allein kann man nicht pachten. Gepachtet werden kann ein Revier nur in seiner Gesamtheit."},{"pg":66,"k":"p","t":"Auch zeitlich gibt es da keine Kompromisse:"},{"pg":66,"k":"law","t":"§ 17 Abs. 1: Die Pachtdauer beträgt zehn Jahre."},{"pg":66,"k":"p","t":"Wird das Jagapachterhältnis vorzeitig aufselöst oder gekündigt oder erlischt es vor. zeitig oder soll ein auf Grund des 5 12 während der Pachtzeit der Gemeindejagd en standenes Jagdgebiet verpachtet werden, so darf das Jagdausübungsrecht nur auf den Rest der Pachtdauer verpachtet werden, soferne diese noch mindestens 12 Monale beträgt; beträgt die Pachtdauer nicht mindestens 12 Monate, darf eine neuerliche Verpachtung erst nach dem Ablauf dieser Frist erfolgen."},{"pg":66,"k":"p","t":"Man kann keine Jagd auf fünf Jahre pachten, das ist so unsinnig wie wenn man zum Standesbeamten sagen würde, man wolle die Frau/den Mann nur für fünf Jahre heiraten. Eine Ausnahme (gemeint jetzt bei der Jagdpacht, nicht beim Partner) gibt es allerdings: Bin aufrechtes Pachtverhältnis hört auf zu existieren - aus welchen Gründen immer (Aufkündigung wegen Nichtzahlung des Pachtzinses, einverständliche Auflösung, Auflösung durch die Behörde, Tod des Pächters...siehe zu diesen unerfreulichen Themen §§ 22, 23 KJG). Dann kann ein neuer Pachtvertrag nur für den Rest der Pachtperiode (wiederum gemeint: der Gemeindejagd) abgeschlossen werden, seien es noch neun, fünf, zwei Jahre. Die Grenze ist bei zwölf Monaten; klarerweise: In dem noch verbleibenden einem Jahr könnte kein geordneter Jagdbetrieb möglich sein. Der Sinn ist, dass die gesamten Verpachtungen immer nur zum Jahrzehntewechsel durchgeführt werden."},{"pg":66,"k":"p","t":"Und was soll die Zitierung des § 12? Nachdem die Zerlegung des Eigenjagdgebietes auch unter der Zeit möglich ist, bedarf es hier, falls eine Verpachtung gewünscht wird, derselben Regelung."},{"pg":66,"k":"p","t":"Unter dieser Frist von zwölf Monaten wäre es ein Fall für den Bevollmächtigten bei einer Eigenjage (§ 2 Abs. 3) bzw. für einen Jagdverwalter bei einer Gemeindejagd (§ 22). seine Gültigkeit hat?"},{"pg":66,"k":"p","t":"Und was gibt es sonst noch für Erfordernisse, damit der ersehnte Jagdpachtvertrag endlich 1.) Er muss schriftlich gemacht werden, und zwar nach dem Muster wie im Anhang zut Durchführungsverordnung zum KJG festgelegt. Ein mündlicher Pachtvertrag hat zvr seine zivilrechtiche Gültigkeit, mehr aber nicht: Man muss sich vorstellen, wie die Be horde über seine Rechtswirksamkeit entscheiden soll, wenn sie kein Schriftstück or sicultat, sondern nur womöglich durcheinander und anein ste vorbei redende ges tikulierend den Pachtvorgang erklärende Parteien!"},{"pg":66,"k":"p","t":"2) Gewisse Mindesterfordernisse müssen zu Papier gebracht werden. Es muslogischerweise - ausgeführt werden"},{"pg":67,"k":"li","t":"wer pachtet (... Name des Pächters)"},{"pg":67,"k":"li","t":"von wem (... Name des Verpächters)"},{"pg":67,"k":"li","t":"was (... Bezeichnung des Jagdgebietes, Größe)"},{"pg":67,"k":"li","t":"wie lange (... die Pachtdauer)"},{"pg":67,"k":"li","t":"um wie viel (... den Pachtzins, Zeitpunkt seines Erlages)"},{"pg":67,"k":"p","t":"Ansonsten kann in einer derartigen schriftlichen Vereinbarung alles aufscheinen, was Gott und das Jagdgesetz nicht verboten haben, wir haben auch gegenständlich die Vertragsfreiheit. Es muss nur mit der Jagd zusammenhängen. Sehr oft wird man eine Regelung über den Ersatz von Wild- und Jagdschäden finden. Die Bestimmung, die ich in einem allerdings uralten Pachtvertrag einer bekannten Jagdgesellschaft gefunden habe, dass der Pächter sich verpflichtet, den Platz vor dem Gemeindeamt schneefrei zu halten, ist im Lichte der heutigen Gesetzgebung nicht mehr denkbar:"},{"pg":67,"k":"p","t":"Bei Gemeindejagden kommt allerdings zwar nicht diese, aber doch die Verpflichtung hinzu, mindestens die Hälfte der jährlich auszugebenden Jagderlaubnisscheine für in der Gemeinde ansässige Jäger auszustellen (§ 16 Abs. 2)."},{"pg":67,"k":"p","t":"3.) Er bedarf der Bewilligung der Bezirksverwaltungsbehörde:"},{"pg":67,"k":"law","t":"§ 16 Abs. 3: Jagdpachtverträge bedürfen zu ihrer Wirksamkeit der Genehmigung der Bezirksverwaltungsbehörde."},{"pg":67,"k":"p","t":"Sie sind vom Pächter binnen acht Tagen nach ihrem Abschluss der Bezirksverwaltungsbehörde vorzulegen."},{"pg":67,"k":"p","t":"Die Genehmigung ist zu erteilen, wenn der Vertrag den Bestimmungen dieses Gesetzes über die Verpachtung entspricht und der Pächter die erforderliche Eignung (§ 18) bat."},{"pg":67,"k":"p","t":"Die Versagung der Genehmigung hat die Nichtigkeit des Rechtsgeschäftes zur Folge... Das sind gewaltige Worte, vor allem ist das mögliche Ergebnis gewaltig: Obwohl sich X. und Y als Verpächter und Pächter über das Zustandekommen des Pachtvertrages einig sind, kann die Behörde „nein\" sagen und alles ist so, als ob die Zwei nie darüber gesprochen hätten! Ähnliches kennt man von der Grundverkehrskommission beim Erwerb von Liegenschaften. Auch dort sind die Rechtsfolgen gleich: Ein von der Grundverkehrskommission nicht genehmigter Vertrag ist so, als ob es ihn nie gegeben hätte."},{"pg":67,"k":"p","t":"Und was ist, wenn die BH absolut nicht entscheiden will? Der Referent hat andere Sorgen, ist überlastet, sieht sich mit dem Problem nicht aus?"},{"pg":67,"k":"law","t":"§ 16 Abs. 3 letzter Satz: Entscheidet die Bezirksverwaltungsbehörde nicht innerhalb von zwei Monaten nach Einlangen des vollständigen Antrages, so gilt der Pachtvertrag als genehmigt,"},{"pg":68,"k":"p","t":"Er halo ne Mont Zeit die Verner dazu hal die Fit nicht entscheidet weil cr b đn nato he: e sonatengepissen nich diu kor, ng ist eit er keinen Grund für cine Cre to intere tung sich, weil sowieso ales in Ordnung ist, git der Vertrag al genehmige. Abschließend dann noch eine Selbstverständlichkeit:"},{"pg":68,"k":"law","t":"§ 17 Abs. 2: Das Pachtjahr dauert vom 1. Jänner bis 31. Dezember."},{"pg":68,"k":"p","t":"Leicht zu merken, weil es sich um das Kalenderjahr handelt. Ähnlich auch das Jagdjahr siehe 9 36 Abs. 6. Wenn die Silvesterkorken knallen, wird so manchem Pächter also schmerz. lich bewusst, dass wieder ein Jahr Jagdpacht vorbei und der jährliche Pachtzins bald wieder Und ganz abschließend zu diesem Thema:"},{"pg":68,"k":"law","t":"§ 16 Abs. 4: Die Bestimmungen des Abs. 3 gelten für Jagdpachtverträge betreffend das Jagdausübungsrecht in Gemeindejagden nur insoweit, als § 29 nicht anderes bestimmt."},{"pg":68,"k":"p","t":"Jetzt habe ich Sie neugierig gemacht. Gut so. Alles weitere wird im Kapitel „Verwertung der Gemeindejagd\" zu besprechen sein."},{"pg":68,"k":"q","t":"Ist es möglich, eine Jagd nur für drei Jahre zu pachten? Wenn nein, warum nicht? Falls ja, nennen Sie ein Beispiel hiefür!"}]},{"part":"B","partTitle":"Die Verpachtung","nr":2,"title":"Der Jagdpächter","pg":68,"blocks":[{"pg":68,"k":"p","t":"Wer kann eine Jagd pachten? Jeder Anfänger weiß, so leicht ist es auch wieder nicht, es kann nicht jeder x-beliebig Dahergelaufene mithalten, und die Jagdkarte allein ist bei weiten zu wenig. Die Erfordernisse sind im Einzelnen:"},{"pg":68,"k":"li","t":"Der notwendige finanzielle Hintergrund. Spaß beiseite, das steht selbstverständlich nicht im Jagdgesetz, wenngleich es für mache sinnvoll wäre, in möglichst großen Buchstaben in redese, ve erich es für nache simil wäre, Prüfung also nicht erwartet, ic folgenden schon:"},{"pg":68,"k":"li","t":"Es darf kein Grund vorliegen, eine Jagdkarte zu verweigern. Siehe dazu später beig 38. notes nur: Man muss seine Jagdkarte dem BH-Referenten jetzt nicht unter die Nase haien. Man darf nur nicht von der Möglichkeit ausgeschlossen sein, sie zu erhalten. As Beispiel vorweg: Wer beim Disziplinarrat einen Jagdscheinentzug auf zwei Jahre\" ausge fasst hat, hat dar also, dass die pc"},{"pg":69,"k":"p","t":"scheidet, weil er bei nen Grund für eine rtrag als genehmigt."},{"pg":69,"k":"p","t":"ich das Jagdjahr nter also schmerzfasst hat, hat damit automatisch für diese Zeit seine Pächtereigenschaft verloren. Logisch also, dass die potentiellen Kandidaten eine derartige Strafe mehr fürchten als der Teufel das Weihwasser."},{"pg":69,"k":"li","t":"Man muss drei Jagdkarten vorweisen können, seien es österreichische oder mit diesen vergleichbare aus EU- oder EWR- Raum. Diese Jagdkarten müssen allerdings ununterbrochen gelöst worden sein, ein Zusammenklauben da ein Jahr, dort ein Jahr gilt nicht. Nicht gefordert ist, dass sich das „ununterbrochen\" bis zur Gegenwart hinzieht. Der Sinn dieser Bestimmung ist, dass an den Jagdpächter doch große Anforderungen gestellt werden, die man (u.a.) in durchgehender Praxis eher erwirbt."},{"pg":69,"k":"li","t":"Der potentielle Jagdpächter muss das 21. Lebensjahr vollendet haben. Hart in Zeiten wie diesen, da man mit 18 Jahren volljährig ist und teilweise mit 16 schon wählen kann."},{"pg":69,"k":"li","t":"Man muss österreichischer Staatsbürger oder solcher aus EU- oder EWR- Raum sein. Man wird also ohne weiteres als Spanier Jagdpächter in Kärnten, der Verwandte aus Bolivien tut sich da schon schwerer Auch ein Schweizer hat Schwierigkeiten (die Schweiz ist weder bei EU noch bei EWR). Er bedarf hiezu einer Ausnahmegenehmigung, die die Landesregierung (allenfalls) erteilt."},{"pg":69,"k":"li","t":"Thema Gemeindejagd: Da gibt es noch eine kleine Besonderheit:"},{"pg":69,"k":"law","t":"§ 18 Abs. 1a: Das Jagdausübungsrecht in einer Gemeindejagd darf über die Bestimmungen des Abs. 1 hinaus überdies nur an Personen verpachtet werden, deren Hauptwohnsitz - bei juristischen Personen der Hauptwohnsitz des Bevollmächtigten (Abs. 3) und im Falle des Abs. 4 der Hauptwohnsitz der überwiegenden Zabl der Vereinsmitglieder - so gelegen ist, dass im Falle einer Pachtung durch natürliche Personen diese, durch juristische Personen der Bevollmächtigte und im Falle des Abs. 4 die Vereinsmitglieder persönlich die Jagd so ausüben können, dass eine ordnungsgemäße Jagdausübung und damit auch ein ordnungsgemäßer Jagdbetrieb gewährleistet ist."},{"pg":69,"k":"p","t":"Man beachte: Es ist von Hauptwohnsitz die Rede. Das Wochenendhäuschen bzw. in diesem Fall die Jagdhütte in lauschiger Reviernähe reicht nicht aus. Hauptwohnsitz definiert man am besten als ständigen Mittelpunkt seines Lebensinteresses. Man muss jedoch nicht direkt am Hochsitz bzw. im Jagdrevier wohnen, aber die Entfernung hievon sollte doch so sein, „dass eine ordnungsgemäße Jagdausübung und damit ein ordnungsgemäßer Jagdbetrieb\" gewährleistet ist. Ich hoffe, Sie wollen jetzt keine exakte Kilometer-Angabe. Die genaue zulässige Streckenlänge ist immer eine Frage des Einzelfalls."},{"pg":69,"k":"li","t":"Bei juristischen Personen müssen natürlich nicht der gesamte Vorstand oder die Herren Generaldirektoren diese Voraussetzungen erfüllen. Eine juristische Person hat jedoch einen Bevollmächtigten namhaft zu machen, der all dem entspricht. Bei Jagdgesellschaften muss auch der Jagdleiter diesen hohen Anforderungen gerecht werden. Nicht der Obmann außer er stellt sich für die Funktion Bevollmächtigter oder Jagdleiter zur Verfügung."},{"pg":70,"k":"p","t":"Die Jagdhütte: Sie schafft keinen Hauptwohnsitz, auch wenn man sich noch so oft in ihr aufhält. Was ist, wenn zwei drei vier...) Freunde gemeinsam eine Jagd pachten - ohne einen Verein zu gründen? Das nennt man dann eine Gesellschaft nach Bürgerlichem Recht, alle haben die Pächtereigenschaft zu haben."},{"pg":70,"k":"li","t":"Die Sicherstellung: Zum besseren Verständnis dieses Problems ein kleines modernes Märchen - d.h. schön wär's, eigentlich ist der Hintergrund ein geschichtlicher Rückblick bzw. traurige Zusammenfassung aus einem Gerichtsakt:"},{"pg":70,"k":"p","t":"Es war einmal eine Jagdgesellschaft in den Kärntner Bergen, die brav und emsig jagte, Gott und den Mitbürgern zum Wohlgefallen."},{"pg":70,"k":"p","t":"Doch ach, da nahm das böse Hochwild überhand und schälte und schälte, die Bäume verloren die Rinde und die Jäger ihre gesunde Gesichtsfarbe. Der Wildschaden stieg in die Hunderttausende (gemeint sind Schillinge, die Uralten von euch werden sich vielleicht noch an diese Währung erinnern können), und man fragte sich, wie man das bezahlen werde, rief eine außerordentliche Generalversammlung ein und diskutierte und diskutierte, kam jedoch zu keinem Ergebnis, bis einer resigniert seinen Bierkrug zum x-ten Mal leerte und meinte: „Um aus diesem Schlamassel herauszukommen müsste man mit dem Teufel im Bunde sein!\""},{"pg":70,"k":"p","t":"Das hätte er nicht sagen sollen. Ein Donnerschlag plötzlich, es stank nach Pech und Schwefel, Nebel durchzog den Raum, und als sich dieser lichtete, sahen sie einen weiteren Jager an ihrem Stammtisch sitzen, den mit dem keck aufgesetzten Hütchen und der Hahnenfeder Zu Diensten, meine Herren! Ir habt mich gerufen! Und ich kann euch auch gleich einen teuflischen Rat geben: Ihr haftet ja nicht persönlich! Jagdausübungs berechtigt - und somit für die Begleichung des Wildschadens zuständig - seid nicht ihr. sondern die Jagdgesellschaft! Mit ihren paar zerquetschten Kröten in der Kasse. Am besten ist, ihr löst sie auf und gründet eine neue, die für die Schulden ihrer Vorgängerin natürlich nicht haftbar gemacht werden kann!\""},{"pg":70,"k":"p","t":"Gesag, getan, und jetzt jagen sie wieder zufrieden und voller Freude. Der Waldeigentimer jedoch hat nie eine Entschädigung erhalten."},{"pg":70,"k":"law","t":"§ 18 Abs. 4: Das Jagda 2002, BGB1. Nr. 66/2"},{"pg":70,"k":"p","t":"a)...für den Fall de begleichung? Der I"},{"pg":71,"k":"p","t":"Soweit die Vorgeschichte und die Erklärung, wie nachstehender Absatz zustande gekommen ist:"},{"pg":71,"k":"law","t":"§ 18 Abs. 4: Das Jagdausübungsrecht darf an einen Verein im Sinne des Vereinsgesetzes 2002, BGB1. Nr: 66/2002, nur verpachtet wera)... für den Fall der Kündigung des Pachtvertrages oder der Auflösung des Vereins sichergestellt ist, dass alle Verpflichtungen aus dem Pachtverhältnis erfüllt werden können..."},{"pg":71,"k":"p","t":"Ja, wer haftet für die Verpflichtungen aus dem Pachtvertrag, sei es Pachtzins, sei es Wildschadensbegleichung? Der Pächter selbstverständlich, das sagt sich leicht heraus, aber wir wissen spätestens seit der Lektüre zu § 2, das nicht nur natürliche, sondern auch juristische Personen Jagdausübungsberechtigte sein können, und nunmehr auch, dass Dafür könnte die Sicherstellung benötigt werden..."},{"pg":71,"k":"p","t":"auch sie Jagdpächter sein können."},{"pg":71,"k":"p","t":"Bei einer natürlichen Person gibt es kein Problem: Sie haftet ohne Einschränkung mit ihrem gesamten Vermögen, und wenn das Haus draufgeht und Frau und Kinder auf der Straße stehen."},{"pg":71,"k":"p","t":"Die juristische Person - nehmen wir jetzt als Beispiel unsere Jagdgesellschaft mit ihrer gruseligen Erfahrung - haftet auch, auch mit ihrem gesamten Vermögen.Nur: Sie hat womöglich keins bis gar keins. Und bevor man in Befolgung irgendwelcher womöglich vorhandener Satzungsbestimmungen nachschusspflichtig wird, löst man sie auf und gründet eine neue. Das System ist ja nicht so absurd wie es auf den ersten Blick scheint - siehe die jeweils aktuellen Wirtschaftsnachrichten: Überschuldung, Konkurseröffnung, die alte Gesellschaft mit beschränkter Haftung verschwindet und schwupps kommt eine neue, die sich nur dem Namen nach (und eben, zunächst noch, mit ihrer Schuldenfreiheit) von der alten unterscheidet. Das ist ja das Satanische: Die Gläubiger bleiben immer auf der Strecke. Nicht so jedoch laut Jagdgesetz. Um Derartiges zu verhindern, hat die Jagdgesellschaft (und jede juristische Person - § 18 Abs. 3) folgende denkbare Möglichkeiten der Sicherstellung: Abgabe von Verpflichtungserklärungen der Mitglieder oder Beibringung einer Bankgarantie in (dem Jagdgebiet) entsprechender Höhe oder Erlag einer entsprechenden Kaution (nicht zu verwechseln mit der bescheidenen und immer notwendig gewesenen des § 32), oder Abschluss einer Versicherung"},{"pg":72,"k":"p","t":"Sie mus alko zigen, das sie es wie eine natürliche Person mit ihren Verpflichtungen te"},{"pg":72,"k":"li","t":"Eberhaupt nicht pachtfähig sind Gemeinden Aber das wissen Sie ja schon: Sie düren „den Fall danach\" ernst nimmt."},{"pg":72,"k":"p","t":"also nicht pachten, müssen hingegen verpachten."},{"pg":72,"k":"q","t":"Sie wohnen in Klagenfurt, wollen jedoch im oberen Mölltal eine Eigenjagd pachten. Haben Sie im Hinblick auf die räumliche Entfernung die Pächtereigenschaft? Wenn ja, warum? Falls nein, warum nicht?"}]},{"part":"B","partTitle":"Die Verpachtung","nr":3,"title":"Die Jagdgesellschaft","pg":72,"blocks":[{"pg":72,"k":"p","t":"Weil wir schon so beim Thema sind und auf die Gefahr hin, dass Altbekanntes wiederholt wird, sollen einmal die rechtlichen Hintergründe jener Jagdgesellschaft, in der ein Großteil von uns seine jagdliche und stammtischmäßige Heimat hat, beleuchtet werden:"},{"pg":72,"k":"li","t":"Wenn ein Verein eine Jagd pachten will, kann es nur eine Jagdgesellschaft sein. Aus ihrer Satzung muss der Zweck hervorgehen, eine Jagd zu pachten. Weder ein Briefmarkensammlerverein noch die Gesellschaft zur Beobachtung des Liebeslebens der Maikäfer können also gleichsam so nebenbei Jagdpächter sein."},{"pg":72,"k":"li","t":"Der Verein muss sich als solcher im Sinne des Vereinsgesetzes konstituieren."},{"pg":72,"k":"li","t":"Die Bezeichnung der Jagdgesellschaft tut nichts zur Sache, sie findet ihre Grenzen nur in dem, was nach allgemeiner Anschauung den guten Sitten widerspricht. Als Beispiel: Ich kann mir vorstellen, dass die Behörde bei der Bezeichnung „Jagdverein zum Feuchtblatt\" ihre Mitarbeit verweigern würde."},{"pg":72,"k":"li","t":"Wie gesagt und siehe vorhin: Es muss vorweg schon sichergestellt sein, dass für den Fall des verfrühten Ablebens der Jagdgesellschaft - sprich Auflösung des Vereins - oder für den Fall der Kündigung des Pachtvertrages genügend finanzielles Potential vorhanden ist, um die Gläubiger zu befriedigen."},{"pg":72,"k":"li","t":"Der Verein hat einen Bevollmächtigten namhaft zu machen (§ 18 Abs. 4 lit. b), der die Pächtereigenschaft haben muss. Zur Erinnerung: Das ist nicht der Bevollmächtigte nach"},{"pg":72,"k":"law","t":"§ 2 Abs. 3 KJG, weil sich diese Gesetzesstelle nur auf den Fall bezieht, dass die Jagd nicht verpachtet ist."},{"pg":72,"k":"li","t":"Der Verein hat einen Jagdlleiter zu bestellen, der ebenfalls die Pächtereigenschaft haben. nuss (§ 18 Abs. 4 it e). Es geht hier nicht so sehr um die reibungslose Gestaltung des Schüsseltriebes, sondern, um,eine den Bestimmungen des Gesetzes entsprechende Ausübung der Jagd unter einheitlicher Leitung zu gewährleisten. Das klingt zwar ein-"},{"pg":73,"k":"p","t":"Großteil eispiel:"},{"pg":73,"k":"p","t":"germaßen unverfänglich, sollte aber jedenfalls ein Grund sein, sich nicht so sehr um das mit diesem Titel geschmückte Amt zu reißen. Insbesondere der Strafrichter braucht eine Ansprechperson, an die er sich halten kann. Denken wir an die zahlreichen Beispiele: Treibjagd, ein Kind unter 14 treibt mit und stellt etwas an, ein Hund treibt ein Reh auf die Fahrbahn und es passiert etwas, ein Unbefugter besteigt einen desolaten Hochsitz und verletzt sich... es kann ja nicht der ganze Jagdverein „sitzen gehen\". Da muss dann, wenn sich sozusagen kein anderer freiwillig meldet, der Jagdleiter herhalten."},{"pg":73,"k":"li","t":"Und dann wird noch ein Obmann benötigt. Das ist derjenige, der für die Jagdgesellschaft"},{"pg":73,"k":"p","t":"- sie kann ja selbst nicht reden - das Sprachrohr nach außen darstellt, nicht nur in Form von schönen Reden bei Begräbnissen von Mitgliedern, sondern auch als Repräsentant vor Gericht, Behörde und überhaupt. Für diese Funktion braucht er die Pächtereigenschaft nicht - außer er würde gleichzeitig, was zumeist der Fall ist, den Bevollmächtigten oder den Jagdleiter machen."},{"pg":73,"k":"li","t":"Willensbildung im Verein: Bei einer natürlichen Person gibt es da keine Schwierigkeiten, ich bilde mir meine Meinung und sage sie dann, dass ich dazu vorerst meine Frau fragen muss ist eine böswillige Unterstellung. Nicht so bei einem Verein: Hier reden bekanntlich mehrere, und man fragt sich, wessen Meinung jetzt gilt. Siehe Satzung, in der das Abstimmungsverhalten ( einfache Mehrheit, Zweidrittelmehrheit, Einstimmigkeit) vorgegeben ist. Für den Betroffenen traurige Folge: Als Überstimmter kann man „hoch und nieder hupfen\", man muss sich an das Stimmergebnis halten."},{"pg":73,"k":"li","t":"Auf die Zahl der Jäger ist Bedacht zu nehmen"},{"pg":73,"k":"p","t":"- siehe nächstes Kapitel. Die Zahl der Mitglieder der Jagdgesellschaft, die gleichzeitig Inha-... ohne Jagdleitung geht hier nichts. Und wer haftet?"},{"pg":73,"k":"p","t":"ber der Jagdkarte sind, muss dieser Zahl entsprechen. Der Grund ist, weil die Ausstellung von Jagderlaubnisscheinen an Mitglieder der Jagdgesellschaft keiner Genehmigung bedarf."},{"pg":73,"k":"p","t":"Die erfolgte Ausstellung des Jagderlaubnisscheines ist lediglich dem Bezirksjägermeister zu melden (§ 41 Abs. 2, 3)."},{"pg":73,"k":"p","t":"In diesem Zusammenhang soll auf die oft diskutierte Frage eingegangen werden: Kann denn jemand Mitglied einer Jagdgesellschaft sein, der nicht Inhaber einer Jagdkarte ist? Die Tochter des Obmanns zum Beispiel. Erstens ist ihr Anblick eine Augenweide und zweitens ist sie"},{"pg":74,"k":"p","t":"Bankangestellte und würde sich hervorragend als Kassier eignen! Kein Problem, meine Herren"},{"pg":74,"k":"p","t":"- zumindest nicht von Seiten des Jagd- und des Vereinsrechtes aus gesehen."},{"pg":74,"k":"li","t":"Wer darf den Jagdgast anführen - gemeint ist, ohne dass dieser einen Jagderlaubnisschein benötigt - siehe § 41? Normalerweise (neben dem Jagdschutzorgan) der Jagdausübungsberechtigte. Im Falle der Jagdgesellschaft ist sie der Jagdausübungsberechtigte. Sie hat intern zu Den Jagdgast ohne Jagderlaubnisschein darf nur der regeln, wer diese verantwortungsvolle Tätigkeit Jagdausübungsberechtigte oder sein Jagdschutz."},{"pg":74,"k":"p","t":"machen darf, mit anderen Worten wiederum organ anführen."},{"pg":74,"k":"p","t":"siehe Satzung oder satzungsgemäß zustande gekommene Vorstands- oder Vollversammlungsbeschlüsse."},{"pg":74,"k":"li","t":"In der Praxis bedauerlicherweise äußerst wichtig geworden sind die Überlegungen betreffend den Ausschluss eines Mitgliedes aus der Jagdgesellschaft. Was tun mit dem Jagdfreund, der jedes Jahr konsequent seinen sechsjährigen Kronenhirsch schießt, oder, weniger dramatisch, der seinen Beitrag nicht bezahlt oder sich weigert, sich an der allgemein anfallenden Arbeit zu beteiligen? „Ausschluss\", heißt das Zauberwort. Bitte jetzt aber genau darauf achten, dass die formellen Voraussetzungen laut Satzung eingehalten werden, angefangen von der Einberufung der Vollversammlung (oder Vorstandssitzung, je nachdem, wer laut Satzung für die Ahndung dieser Untaten zuständig ist), genaue Bekanntgabe des Tagesordnungspunktes, nachweisliche Zustellung der Ladung an den Betroffenen bis zur exakten Protokollierung der jeweiligen Wortmeldungen und des Ausschließungs. beschlusses. Ein einfaches und bierseliges „Verschwind, wir wollen dich nie wieder sehen!\" bringt nichts, denn:"},{"pg":74,"k":"p","t":"Der Ausgeschlossene hat eine Anfechtungsmöglichkeit. Zunächst wird er den vereinsinternen Instanzenzug - falls vorgesehen - ausschöpfen (müssen). Dann geht er Zu Gericht und bringt eine Klage „auf Feststellung der Rechtsunwirksamkeit des Ausschlusses\" ein. Das Gericht hat dann in einem aufwendigen Verfahren zu prüfen, ob alle formellen Voraussetzungen für den Ausschluss gegeben waren und ob das Verhalten des Delinquen: Tertist ht heißt er Kläger) auch wirklich so arg war dass es einen Ausschluss gerecht- Es soll nicht verschwiegen werden, dass derartige Prozesse die Vereinskasse mehr belas ten können als „Schälschaden total\" auf 20 ha."},{"pg":74,"k":"p","t":"Daher Vorsicht: Der Ausschluss des Mitglieds von der Gesellschaft kommt nach der Recht: sprechung der Gerichte nur als letztes Mittel zum Schutz der Rechte der übrigen Geselschafer in Betracht. Eine Vereinsmitgliedschaft soll nur aus wichtigen, das Mitglied be lasenden Gründen gegen dessen Willen verloren gehen, es kommt darauf an, invieren vereinsintern Uni"},{"pg":75,"k":"p","t":"aufgrund der vorgefallenen Auflligkeiten eine weitere Mitgliedschaft dem Verein noch weiter zumutbar ist."},{"pg":75,"k":"li","t":"Eine logische Folge des Umstandes, dass die Gesellschaft - und nicht die einzelnen Mitgesellschafter - Jagdausübungsberechtigter ist: Wenn ein Mitglied verstirbt, mag das vereinsintern Unruhe, Hoffnungen, Befürchtungen hervorrufen; am Pachtverhältnis ändert dies nichts. Zum Unterschied vom Tod des Einzel- oder Mitpächters, siehe § 22 KJG)."},{"pg":75,"k":"q","t":"Kann eine in Ferlach wohnhafte Person Obmann einer Jagdgesellschaft sein, die eine Gemeindejagd im Lesachtal gepachtet hat? Wenn ja: Unter welchen Bedingungen? Falls nein: Warum nicht? sein Jagdschutz-"}]},{"part":"B","partTitle":"Die Verpachtung","nr":4,"title":"Zahl der Jäger","pg":75,"blocks":[{"pg":75,"k":"p","t":"Zehn Hochsitze auf 100 Hektar, auf jedem vier Jäger, die mit ihren Gewehren in die vier Himmelsrichtungen im Anschlag sind... So werden wir in diversen Karikaturen oft dargestellt. Geht sich allerdings weder örtlich noch - und das soll hier erörtert werden - rechtlich aus. Denn, und wir sprechen jetzt von der Jägerdichte:"},{"pg":75,"k":"p","t":"J 19 (1): In einem Jagdgebiet dürfen nur so viele Personen die Jagd ständig ausüben, dass auf je 50 ha - bei einem überwiegenden Bestand von Rotwild oder Gamswild auf je 100 ha - eine Person entfällt."},{"pg":75,"k":"p","t":"(2): Bei aneinandergrenzenden Jagdgebieten desselben Jagdausübungsberechtigten darf die sich für die aneinandergrenzenden Jagdgebiete nach Abs. 1 ergebende zulässige Höchstzahl von Personen, die die Jagd ständig ausüben dürfen, unter Zugrundelegung des Flächenausmaßes der aneinandergrenzenden Jagdgebiete ermittelt werden."},{"pg":75,"k":"p","t":"Die Gesetzesterminologie ist hier relativ klar, der Fragen sind wenige. Ständige Ausübung der Jagd bedeutet natürlich nicht fortwährendes Ansitzen. Ständig übt die Jagd der aus, der die Möglichkeit hat, nach Belieben im Revier (jagend) zu kommen und zu gehen. Das ist selbstverständlich der Jagdausübungsberechtigte, und das sind die Mitglieder der Jagdgesellschaft. Und das sind die Inhaber von Jagderlaubnisscheinen (siehe Seite 127). Nun leuchtet ein, dass ein auf sagen wir einen Tag ausgestellter Jagderlaubnisschein nicht dazu zählen kann, ansonsten wären ja Jagdeinladungen größeren Stils nicht denkbar. Man wird davon ausgehen müssen, dass Jagderlaubnisscheine mit einer Gültigkeitsdauer von über einem halben Jahr dazu führen, dass sich der Inhaber als einer bezeichnen kann, der die Jagd in diesem Revier ständig ausübt - wobei man bei dieser zeitlichen Abschätzung aber immer das gesamte Umfeld vor Augen haben muss, schließlich geht es in allen Fällen - Sie haben es etraten - um die Aufrechterhaltung eines
