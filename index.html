 geordneten Jagdbetriebes."},{"pg":76,"k":"p","t":"was hier nicht der Fall sein dürfte."},{"pg":76,"k":"p","t":"im Hochwildgebier In Ihrem Revier v... bei überwiegendem Bestand von Rotwild oder Gamswild..."},{"pg":76,"k":"p","t":"Erwähnenswert ist noch, dass von Rotwild oder Gamswild (und nicht Rotwild und Gamswild, wie man bei Prüfungen oft hört) die Rede ist. Es gentigt also das überwiegende Vorkommen eines von beiden. Überwiegend ist auch klar zu definieren: Mehr als die Hälfte. Siehe diesbezüglich den Abschussplan und insbesondere die noch aussagekräftigere Abschussliste. Und wozu hat man den WÖRP? (Siehe wiederum später)."},{"pg":76,"k":"p","t":"Der Sinn dieser Bestimmung ist, die Anzahl der „Raubtiere Jäger\" dem vorhandenen Biotop anzupassen. So wie zu viele Köche den Brei verderben ist es für ein Revier nicht gut, wenn es von Jägern überbesetzt ist. Gerade heute kommen diesen Überlegungen, wie sie sinngemäß in der Regierungsvorlage zum KJG aufscheinen, große Bedeutung zu, da die Wissenschaftler den durch den einzelnen Jäger verursachten Stress schon so weit interpretieren, dass man sich bald für jeden Pirschgang genieren muss."},{"pg":76,"k":"p","t":"Grenzen Jagdgebiete (natürlich nur desselben Jagdausübungsberechtigten) aneinander, kann die Gesamtfläche für die Berechnung herangezogen werden. Wie in vergleichbaren Fallen geht der Gesetzgeber davon aus, dass die (zweckmäßigere) jagdliche Bewirtschaftung gro- Berer Flächen gesetzlich nicht erschwert, sondern nach Möglichkeit begünstigt werden sol. Bine of gestelte Prüfungsfrage in diesem Zusammenhang: 1000 Hektar Niederwildrevier, davon 400 Hektar jagdlich nicht nutzbar. Wie viele Jäger dürfen die Jagd ständig ausüben? Bevor Sie jetzt den Taschenrechner hernehmen, die 400 Hektar von den 1.000 Hektar abziehen und das Ganze durch 50 dividieren, verate ich Ihnen gleich das Ergebnis: 20 (in Worten zwanzig) Jäger! Nach dem klaren Gesetzeswortlaut ist nämlich die Gesamtfläche des Jagdgebietes und nicht etwa nur die jagdlich nutzbare Fläche der Berechnung zugrundezulegen. dauptfrage für dic Jagdaufscher jedoch: Wie wird das Jagdschutzorgan hier mitgezählt. Hier"},{"pg":76,"k":"law","t":"§ 19 Abs 3: Auf die zulässige Höcbstzaht ist je angefangene 1500 ha eines Jagdgebieles ein für dieses Jagdgebiet besteltes und angelobtes Jagdschuzongan nicht anzurechnen."},{"pg":77,"k":"p","t":"Anders geht es auch nicht: Man stelle sich eine kleine Eigenjagd von sagen wir 120 Hektar im Hochwildgebiet vor: Hier kann im Sinne der Jägerdichte nur einer, nämlich der Jagdausübungsberechtigte selbst, die Jagd ausüben. In der Praxis ist es aber oft auch Aufgabe des Jagdschutzorgans, den Abschuss beim weiblichen Wild und beim Jungwild zu erledigen. Dazu braucht er gemäß § 41 Abs. 1 einen Jagderlaubnisschein, also die vom Jagdchef ausgestellte schriftliche Erlaubnis, in diesem Revier - ständig - die Jagd auszuüben. Ginge sich bei dieser Reviergröße nicht aus, daher diese Ausnahme."},{"pg":77,"k":"q","t":"In Ihrem Revier werden überwiegend Enten erlegt. Gilt die 50- oder die 100-Hektar-Beschränkung? Hälfte. Biotop Vissen- Fällen n soll. iben? gen. Hier"}]},{"part":"B","partTitle":"Die Verpachtung","nr":5,"title":"Die Unterverpachtung","pg":77,"blocks":[{"pg":77,"k":"p","t":"Was Untermiete ist, ist jedem klar: Man ist zwar selbst (nur) Mieter einer zweckmäßigerweise größeren Wohnung, kann aber ein Zimmerchen davon entbehren, das man dann zu einem vermutlich horrenden Preis an einen Studenten vermietet."},{"pg":77,"k":"p","t":"Unterverpachtung ist fast dasselbe, bevor ich jetzt jedoch von einem Rechtsgelehrten gewürgt werde, muss ich freiwillig betonen: Der Vergleich hinkt, wie es Vergleiche nun mal zu tun pflegen. Es kann nämlich nur das gesamte Jagdgebiet weiter verpachtet werden - um bei unserem Beispiel zu bleiben: Besagter Student müsste die gesamte Wohnung mieten. Es sind weder zeitliche Einschränkungen (Unterverpachtung auf drei Jahre...) noch örtliche (nur ein Revierteil...) und schon gar nicht sachliche (lediglich der Rotwildabschuss...) möglich. Wer etwa Letzteres will, schließt einen Wildabschussvertrag, der bekanntlich noch lange nichts mit einem Pachtverhältnis zu tun hat."},{"pg":77,"k":"p","t":"Wenn man dem Volksmund Glauben schenken darf, müsste diese Konstruktion also „Weiterverpachtung\" heißen."},{"pg":77,"k":"p","t":"Im Übrigen siehe den Gesetzestext dazu:"},{"pg":77,"k":"law","t":"§ 20 : Die Unterverpachtung eines Jagdausübungsrechtes ist nur mit Bewilligung der Bezirksverwaltungsbehörde zulässig. Die Bewilligung ist zu erteilen, wenn"},{"pg":77,"k":"p","t":"a) die Unterverpachtung im Pachtvertrag vorgesehen ist;"},{"pg":77,"k":"p","t":"b) die Unterpächter die Voraussetzungen des § 18 erfüllen;"},{"pg":77,"k":"p","t":"c) die Unterverpachtung den Grundsätzen eines geordneten Jagdbetriebes nicht widerspricht und"},{"pg":77,"k":"p","t":"d) die Zahl der Unterpächter den Bestimmungen des § 19 entspricht..."},{"pg":78,"k":"p","t":"Das die Niglichkeit der Untere pachtung in Pachten ag Vorrate ein mus, it ine denkhe sie in inweg ther die inversachtung dem Verpächter ein Pachterhaltns Tunes geschicht mit dem Vertag, ven die Bei nara tinache hürde cic enchmigung zu unterjubeln, mit welchem er nie einverstanden wäre."},{"pg":78,"k":"p","t":"verwer oder wenn sie inerhalb von zwei Monaten einfach nicht entscheider? 5 20 schließt diesbezüglich schlicht und einfach mit dem Hinweis:"},{"pg":78,"k":"law","t":"§ 16 Abs. 3 vorletzter und letzter Satz gelten sinngemäß."},{"pg":78,"k":"p","t":"Aber das ahnten Sie ja ohnehin schon."}]},{"part":"B","partTitle":"Die Verpachtung","nr":6,"title":"Der Pachtzins","pg":78,"blocks":[{"pg":78,"k":"p","t":"Wer jetzt erwartet, im Gesetz irgendwelche Reglementierung zu treffen, der wird enttäuscht"},{"pg":78,"k":"p","t":"- oder erfreut - sein. Da gibt es nichts zu regeln, alles ist eine Frage der freien Vereinbarung, der Markt bestimmt den Preis. Es ist ähnlich wie bei einem Hauskauf: Da ist die Bude 100.000 Euro wert, und plötzlich zahlt jemand 200.000 Euro - nur, weil er in der Nähe (oder Ferne) seiner Schwiegermutter wohnen möchte! Man kann nichts dagegen tun, wenn seine eigenen Pachtzinsvorstellungen um das X-fache überboten werden."},{"pg":78,"k":"p","t":"Auch eine Wertsicherungsvereinbarung ist kein selbstverständliches Muss, wer als Verpächter darauf vergessen hat, kann sich nicht später darauf berufen, dass dies eigentlich von Gesetzes wegen so vorgesehen wäre."},{"pg":78,"k":"p","t":"All das bedeutet aber nicht, dass man jetzt als Jagdpächter dem Verpächter - oder gegengleich - schutzlos ausgeliefert ist. Alle Regulative, die zivilrechtlich bei der Auslegung/ Gestaltung/ Aufhebung von Verträgen gelten, sind selbstverständlich auch für den Jagdpachtvertrag und die Zinsbildung anzuwenden. Stichworte List, Irreführung."},{"pg":78,"k":"p","t":"lichkeit:"},{"pg":78,"k":"p","t":"So betrachtet ist folgende Gesetzesbestimmung eigentlich nur juristische Selbstverständ- 5 21: Andert sich die Größe des Jagdgebietes während der Pachtdauer; so erhöht oder vermindert sich der Pachtzins entsprechend dem Flächenausmaß."},{"pg":78,"k":"p","t":"Trotzdem nett, dass es gesagt wird. Wenn von 200 Hektar sagen wir 50 Hektar verkauf Werben oder im Wege einer Anschlussfläche dazukommen, kann der Pachtzins nicht gleich bleiben Als weitere ist eine Rechenaufgabe; bei einer +/- Veränderung von über einem Satz).Aber darauf kommen wir noch zurück."},{"pg":78,"k":"p","t":"Rünfiel gibt es im übrigen eine Kündigungsmöglichkeit für den Pächter (8 23 Abs. 6 letzter"},{"pg":78,"k":"q","t":"Von einem 150 Hekar Revier werden 50 Hektar verkauft. Berechnen Sie die Pachtzinsminderung. c. Auflösung di"},{"pg":79,"k":"p","t":"ein muss, ist eine uht. Es soll nicht Pachtverhältnis e Genehmigung tscheidet? § 20"}]},{"part":"B","partTitle":"Die Verpachtung","nr":7,"title":"Die Beendigung des Pachtverhältnisses","pg":79,"blocks":[{"pg":79,"k":"p","t":"Die schönen Stunden vergehen so schnell, und alles hat einmal ein Ende - soweit die alten Volksweisheiten, die uns allerdings nicht weiterhelfen, wenn es um die Beendigung einer Jagdpacht geht. Da schlagen wir lieber das Jagdgesetz auf und entdecken dort folgende Moglichkeiten, wie es dazu kommen kann, dass ein Revier auf einmal pächerlos ist: a. Ablauf der Pachtzeit b. Tod des Pächters C. Auflösung durch die BH d. Kündigung durch den Verpächter e. Kündigung durch den Pächter wegen persönlicher Verhältnisse f. Kündigung durch den Pächter wegen Änderung der Pachtfläche g. Einverständliche Auflösung"},{"pg":79,"k":"h","t":"a) Ablauf der Pachtzeit"},{"pg":79,"k":"p","t":"Selbstverständlich, darüber braucht man nicht zu reden. Das Gesetz macht sich lediglich Gedanken darüber, was mit den vorhandenen Reviereinrichtungen zu geschehen hat - siehe"},{"pg":79,"k":"law","t":"§ 63 Abs. 3."},{"pg":79,"k":"h","t":"b) Tod des Pächters"},{"pg":79,"k":"p","t":"Vorweg: Der Tod des Verpächters schafft weniger Probleme, ob der Erbe in das bestehende Pachtverhältnis eintritt, ist zivilrechtlich zu beurteilen. Auch wenn ein Mitglied einer Jagdgesellschaft stirbt, ist das zwar bedauerlich, aber rechtlich nicht bemerkenswert, weil Jagdpächter ja die Gesellschaft an sich - und nicht die dortige Ansammlung von Einzelpersonen"},{"pg":79,"k":"p","t":"- ist (siehe dazu unter „Die Jagdgesellschaft\")."},{"pg":79,"k":"p","t":"Die Probleme entstehen, wenn der Pächter Einzelpächter, Mitpächter) stirbt; er ist es ja gewesen, der für alles (mit-)verantwortlich gewesen ist."},{"pg":79,"k":"p","t":"Zunächst dazu für die Schnelldenker der reine Gesetzestext:"},{"pg":79,"k":"law","t":"§ 22 : Nach dem Tod des Pächters kann der Pachtvertrag von seinen Rechtsnachfol gern oder dem Verpächter unter Einhaltung einer halbjährigen Kündigungsfrist für das Ende des Pachtjahres gekündigt werden."},{"pg":79,"k":"p","t":"Ist keiner der Rechtsnachfolger als Pächter geeignet, so erlischt der Vertrag mit Ende des Jabres, in dem der Erbfall eingetreten ist."},{"pg":79,"k":"p","t":"Für die Zeit walter zu bestellen. Wenn sie das nicht tun, macht es die BH ersatzweise und auf ihre Kosten."},{"pg":80,"k":"li","t":"Einer von mehreren Pächtern stirbt. Das Pachtverhältnis kann fortgesetzt werden, allerdings nur, wenn der Verpächter damit einverstanden ist - wer weiß, vielleicht hat er gerade auf den nunmeht Verstorbenen größten Wert gelegt und die anderen nur als Mitãuer betrachtet und mit dieser seiner Vermutung womöglich gar nicht so Unrecht gehabt? Falls die Fortsetzung gewünscht wird, ist das der BH und der KJ schriftlich mitzuteilen. c. Auflösung durch die BH Genauso wie die BH zu prüfen hat, ob beim Zustandekommen eines Pachtvertrages alles seinen geordneten Weg gegangen ist, muss ihr auch zugebilligt werden, in weiterer Folge als solches zu existieren aufgehört hat."},{"pg":80,"k":"p","t":"dazwischen Zu funken, fall einer diesen Weg zu verlassen gedenkt oder, falls das Jagdgebiet Die Pachtvertragsauflösung durch die BH ist also aus zwei Gründen möglich:"},{"pg":80,"k":"p","t":"1. Gründe, die in der Beschaffenheit des Jagdgebietes liegen;"},{"pg":80,"k":"p","t":"2. Gründe, die in der Person des Pächters liegen;"},{"pg":81,"k":"p","t":"... wenn Grundflächen ihre jagdliche Nutzbarkeit verlieren... (Zweikirchen)"},{"pg":81,"k":"p","t":"Zu 1)... die in der Beschaffenheit des Jagdgebietes liegen."},{"pg":81,"k":"law","t":"§ 23 Abs. 1 Z 1: Die Bezirksverwaltungsbehörde bat den Jagdpachtvertrag aufzulösen, wenn das Jagdgebiet aufbört, ein selbständiges Jagdgebiet zu sein, weil Grundflächen ihre jagdliche Nutzbarkeit verlieren..."},{"pg":81,"k":"p","t":"Eine Bestimmung, die in den Siedlungsrandzonen immer mehr an Aktualität gewinnt. Sagen wir 200 Hektar in Stadtnähe, so schnell kann man gar nicht schauen und über 100 ha davon sind verbaut. Alles weitere siehe § 7 Abs.3 unseres Breviers. Das Jagdgebiet ist nicht mehr existent, der Rest ist benachbarten Jagdgebieten anzuschließen. Was nicht mehr vorhanden ist, kann naturgemäß auch nicht mehr verpachtet sein. Keiner e Chance, sich auf die Unwahrscheinlichkeit dieses Ereignisses zu berufen, wenn der Justizirrtum sozusagen greifbar in der Luft liegt."},{"pg":82,"k":"p","t":"hat den Pachtvertrag aufzulösen, wenn der Pächter."},{"pg":82,"k":"p","t":"b) die Fähigkeit zur Erlangung einer Jagdpachtung verloren hat (§ 18);"},{"pg":82,"k":"p","t":"Welche Erfordernisse man zusammenklauben muss, um die Pachtfähigkeit zu haben, wissen Sie seit dem Studium des hier höflicherweise zitierten § 18. Fallt das Raulwild zum Schutz."},{"pg":82,"k":"p","t":"nur eines davon weg, sagt die gesamte Pächtereigen:"},{"pg":82,"k":"p","t":"schaft Ade."},{"pg":82,"k":"p","t":"Als praktisches Beispiel fällt mir ein, wenn der Pächter die österreichische Staatsbürgerschaft verliert (und keine Ausnahmegenehmigung ethält), oder wenn der Pächter einer Gemeindejagd mit seinem Wohnsitz das Revier weiträumig verlässt."},{"pg":82,"k":"p","t":"wenn der Pächter..."},{"pg":82,"k":"law","t":"§ 23 Abs. 1 7 2: Die Bezirksverwaltungsbehörde bat den Pachtvertrag aufzulösen, °) die Kaution oder deren Ergänzung (8 32) trotz zweimaliger Aufforderung dureb die Bezirksverwaltungsbehörde nicht oder nicht vollständig erlegt bat;"},{"pg":82,"k":"p","t":"a) den Vorschriften über die Bestellung der Jagdschutzorgane (SS 43 bis 45) ungeachte der Aufforderung durch die Bezirksverwaltungsbehörde nicht entsprochen."},{"pg":82,"k":"p","t":"Siehe später"},{"pg":82,"k":"law","t":"§ 23 Abs. 1 Z 2 muss also gar 1"},{"pg":83,"k":"law","t":"§ 23 Abs 1 Z 2: Die Bezirksverwaltungsbehörde hat den Pachtvertrag aufzulosen,"},{"pg":83,"k":"p","t":"e) sich wiederholt einer sonstigen übertretung dieses Gesetzes schuldig gemacht bat; „Wiederholt\" bedeutet hier wie in allen anderen Fällen mehr als einmal. Diese Übertretung muss also gar nicht so gewichtig sein, sie muss nur wiederholt gemacht werden. Und sie bezieht sich ausdrücklich nur auf das KJG (,dieses Gesetzes\")."},{"pg":83,"k":"p","t":"Wer zum Beispiel ständig fremdgeht, übertritt nicht das KJG, sondern das Ehegesetz, er bekommt vielleicht Schwierigkeiten mit seinem Ehepartner, nicht jedoch - in diesem Sinn - mit der BH."},{"pg":83,"k":"law","t":"§ 23 Abs. 1 Z 2: Die Bezirksverwaltungsbehörde hat den Pachtvertrag aufzulösen, wenn der Pächter..."},{"pg":83,"k":"p","t":"1 in der abgelaufenen Abschussplanperiode den Abschussplan nicht bloß geringfügig nicht erfüllt hat oder er den im Abschussplan festgelegten Abschuss eigenmächtig überschreitet oder das Raubwild zum Schutz der Haustiere nicht kurzhält;"},{"pg":83,"k":"p","t":"Das Thema „Abschussplan\" wird uns noch hinreichend beschäftigen. Vorweg jedoch bereits jetzt und zum besseren Verständnis: Beim Abschussplan handelt es sich um einen Bescheid des Bezirksjägermeisters. Bescheide sind nicht dazu da, flüchtig gelesen und dann archiviert zu werden, sondern sie müssen auch eingehalten werden. Und zwar exakt."},{"pg":83,"k":"p","t":"Nun ist es eine Erfahrungstatsache, dass man sich bei der Erfüllung des Abschusses manchmal schwer tun kann; wer von neun freigegebenen Geißen eine nicht erlegt, hat den Abschuss lediglich „geringfügig nicht erfüllt\""},{"pg":83,"k":"p","t":"\". Ein Extrembeispiel zum leichteren merken: Wer keine davon erlegt und dann womöglich noch öffentlich erklärt, er denke nicht daran, Geißen zu schießen (eine zu früheren Zeiten sehr häufige Äußerung), der kann sich im Lichte dieser Gesetzesstelle von der Jagdpacht eigentlich auch schon verabschieden."},{"pg":83,"k":"law","t":"§ 23 Abs. 1 Z 2: Die Bezirksverwaltungsbehörde hat den Pachtvertrag aufzulösen, wenn der Pächter..."},{"pg":83,"k":"p","t":"Anmerkung für Aufmerksame: Suchen Sie g) nicht. Dieser Absatz wurde mit der letzten Novelle ersatzlos gestrichen."},{"pg":83,"k":"law","t":"§ 23 Abs. 1 Z 2: Die Bezirksverwaltungsbehörde hat den Pachtvertrag aufzulösen, wenn der Pächter..."},{"pg":83,"k":"p","t":"b.) wiederbolt den Vorschriften über die Ausstellung von Jagderlaubnisscheinen an in der Gemeinde ansässige Jäger nicht entspricht."},{"pg":83,"k":"p","t":"Das hatten wir schon unter Jagdpachtvertrag\". Falls Ihre Erinnerung sich gerade dienstfrei genommen hat, statt vieler Worte der reine Gesetzestext:"},{"pg":84,"k":"law","t":"§ 16 Abs. 2 vorletzter Satz: Jagdpachwerträge für die Verpachtung von Gemeindejagden baben zusätzlich die Bestimmung zu enthalten, dass sich der Pächter ver- Dichtet, mindestens die Hälfte der jährlich ausgegebenen Jagderlaubnisscheine (§ 41) für in der Gemeinde ansässige Jäger auszustellen."},{"pg":84,"k":"p","t":"in allen Fällen dieses Abschnitts 2) gilt: Bei mehreren Mitpächtern, bei denen nur einer jagdlich fremdgeht, ist dieselbe Regel wie beim Tod eines von mehreren Mitpächtern anzuwenden: Im Falle der Auflösung des Pachtvertrages Kann das Pachtethältnis von den übrigen Mitpächten fortgesetzt werden, so der Verpächter damit einverstanden ist. Auch hier wiederum: Anzeige der Fortsetzung an BH und KJ."},{"pg":84,"k":"p","t":"Und weiters: Hat der Pächter die Auflösung des Jagdpachtvertrages verschuldet, so hat er die Kosten der neuerlichen Verpachtung zu tragen. Das ist eine logische Folge des zivilrechtlichen Schadenersatzprinzips."},{"pg":84,"k":"p","t":"d. Kündigung durch den Verpächter"},{"pg":84,"k":"law","t":"$ 23 (4): Der Verpächter kann den Pachtvertrag unter Einhaltung einer halbjährigen Kündigungsfrist für das Ende des Pachtjahres kündigen, wenn der Pächter trotz zweimaliger schriftlicher Mahnung mit der Bezahlung des rechtskräftig festgestellten Wildschadens oder des Pachtzinses länger als drei Monate im Verzug ist."},{"pg":84,"k":"p","t":"Der Pächter hat die Kosten der neuerlichen Verpachtung zu tragen."},{"pg":84,"k":"p","t":"Man sieht, das Kündigungsrecht des Verpächters beruht auf rein finanziellen Gegebenheiten, er erhält seine Silberlinge nicht; gemeint einerseits der Pachtzins, andererseits der (rechtskräftig festgestellte)"},{"pg":84,"k":"p","t":"Wildschaden. Und dann ist - ähnlich wie bei einer alleinerziehenden Wohnungsmieterin mit drei oder mehr Kindern - die Kündigung äußerst schwierig. Es muss (gemeint jetzt bei der Jagdpacht) Nachstehendes gegeben sein:"},{"pg":84,"k":"p","t":"... der Haustiere nicht kurzhält..."},{"pg":84,"k":"li","t":"Halbjährige I"},{"pg":85,"k":"li","t":"Halbjährige Kündigungsfrist"},{"pg":85,"k":"li","t":"Kündigung nur zum Ende des Fachtjahres"},{"pg":85,"k":"li","t":"zweimalige schriftliche Mahnung"},{"pg":85,"k":"li","t":"Verzug mit der Bezahlung länger als drei Monate."},{"pg":85,"k":"p","t":"Keit es furt diebereich eine in antien et, die face lit der Verpicher demm ihn die sprichwörtlichen Grausbirnen aufsteigen? Jein. Er hat zwar primär kein Kündigungsnet denen wird de de hertal aber der Behörde elsen die vodam cron Amis e. Kündigung durch den Pächter wegen persönlicher Verhältnisse"},{"pg":85,"k":"law","t":"§ 23 Abs. 5: Der Pächter kann den Pachtvertrag unter Einhaltung einer weist dasser Kündigungsfrist für das Ende des Pachtjahres kündigen, wenn er nachweist, dass er wegen körperlicher oder geistiger Gebrechen unfähig geworden ist, die Jagd auszuüben oder wirtschaftliche Gründe, etwa wegen Erschwernissen bei der jagdlichen Bewirtschaftung, die Aufrechterhaltung des Pachtverhältnisses unzumutbar machen."},{"pg":85,"k":"li","t":"... wegen körperlicher oder geistiger Gebrechen... Den Nachweis wird jeder ungern erbringen, aber manchmal muss es sein; ein plötzlicher Unfall mit Querschnittlähmung ohne Besserungschance, jeder sieht ein, dass der Mann als Jagdpächter nicht mehr geeignet ist. Weitere Beispiele: Parkinson, Demenz im höheren Stadium (... habe ich das jetzt schon geschrieben?)"},{"pg":85,"k":"li","t":"...wirtschaftliche Gründe... In der Praxis der häufigere Fall: Weichender Sohn in der elterlichen Landwirtschaft, erfolgreicher Handelsvertreter mit großer (hauptsächlich für Geschäftsanbahnungen vorgesehener) Pachtjagd, plötzlich stirbt der große Bruder, es heißt Hofübernahme mit Reduzierung des Lebensinteresses auf körperliche Arbeit und Schuldenzahlen..."},{"pg":85,"k":"li","t":"... „die Erschwernisse bei der jagdlichen Bewirtschaftung\" scheinen zwar beispielhaft, aber gesondert auf. Aber Vorsicht: In allen Fällen muss die weitere Aufrechterhaltung des Pachtverhältnisses unzumutbar sein! Das ist immer eine Frage des Einzelfalls. Die übliche Holzentnahme wird wohl nicht darunter fallen, wohl aber wahrscheinlich eine neu angelegte und viel befahrene Lifttrasse, die das Revier in zwei Teile teilt. f. Kündigung durch den Pächter wegen Änderung der Pachtfläche 523 (): Falls der Pachtvertrag keine gegenteilige Bestimmung enthält, kann der Pächter den Vertrag unter Einhaltung einer balbjährigen Kündigungsfrist für das Ende des Pachtjahres kündigen, wenn sich das Jagdgebiet um mehr als ein Fünftel vergrößert oder verkleinert bat."},{"pg":86,"k":"p","t":"Kan ja pasien Keiner verkauf, und das beste Binsideobie et est Bruine Par was auch immer ist auf einmal wes. Oder des vendes merce dess man den Pachino nder verschnut, und jert hat sich das Jagdgebiet en des ahren ise vergrößer. Wer cinen Merch der gekauft hat, sl nicht auf einmal mit eine mkint laren missen, und geneich sil daselbe. Wesentlich ist, dass das Jagdgesetz die Einfünfel rente hervorhebt, eine Ande rung darunter also als geringfügig und somit zumutbar abtut. Im Übrigen wiederum:"},{"pg":86,"k":"li","t":"Einhaltung der halbjährigen Kündigungsfrist;"},{"pg":86,"k":"li","t":"Kündigung nur zum Ende des Pachtjahres, und:"},{"pg":86,"k":"li","t":"Im Pachtvertrag kann (wie so vieles) diese Möglichkeit der Kündigung ausgeschlossen werden!"},{"pg":86,"k":"p","t":"Und nicht verwechseln: Änderung des Pachtzinses bei Änderung der Jagdgebietsfläche egal in welchem Ausmaß - siehe den bereits besprochenen $ 21!"},{"pg":86,"k":"p","t":"g. Einverständliche Auflösung Wenn sogar eine Ehe, die angeblich auf Lebenszeit abgeschlossen wurde, einverständlich aufgelöst werden kann, muss dies umso mehr bei einem „nur\" auf zehn Jahre abgeschlossenen Pachtvertrag gelten. Daher:"},{"pg":86,"k":"p","t":"1 23 Abs. 7: Der Verpächter und der Pächter dürfen den Pachtvertrag zum Ende des Pachtjahres im letzten Jahr der Geltungsdauer des Abschussplans einvernehmlich auflösen."},{"pg":86,"k":"p","t":"Konsequenterweise geht auch das also nur"},{"pg":86,"k":"li","t":"zum Ende des Pachtjahres"},{"pg":86,"k":"li","t":"im zweiten Jahr der Geltungsdauer des Abschussplans."},{"pg":86,"k":"p","t":"Zu erinnern ist auch daran, dass das Revier dann nur noch für den Rest der Jagdpachtperiode verpachtet werden kann, sofern dieser mehr als 12 Monate ist - § 17 Abs. 1."},{"pg":86,"k":"q","t":"Sie wollen als Eigenjagdbesitzer Ihren Jagdpächter loswerden. Sie stellen einen Treberhaufen im Revier fest, auf diesem befindet sich Schweiß. Wie gehen Sie zweckmäßigerweise vor?"},{"pg":86,"k":"p","t":"Gemeinde Alterssch „Aber Nein, t treuh:"},{"pg":86,"k":"p","t":"1. Л Wie 5 2 На"}]}]}</script>

// Handgeschriebene Prüfungsfragen – Kärntner Jagdgesetz 2000 (K-JG) + Prüfungsrecht
// Felder: q = Frage, o = Optionen (4), a = Index der richtigen Antwort, ref = Fundstelle, e = Erklärung, s = Abschnitt-Nr, t = Thema
const CURATED = [
// --- 1. Abschnitt: Ziele, Jagdrecht ---
{s:1,t:"Jagdrecht",q:"Woraus fließt das Jagdrecht nach dem K-JG?",o:["Aus dem Grundeigentum","Aus der Jagdkarte","Aus dem Jagdpachtvertrag","Aus der Mitgliedschaft bei der Kärntner Jägerschaft"],a:0,ref:"§ 1a Abs. 2",e:"Das Jagdrecht ist mit dem Grundeigentum verbunden und kann als selbständiges Recht nicht begründet werden."},
{s:1,t:"Jagdrecht",q:"Welche Befugnisse umfasst das Jagdrecht?",o:["Wild zu hegen, ihm nachzustellen, es zu fangen, zu erlegen und sich anzueignen sowie Fallwild, Abwurfstangen und Eier des Federwildes anzueignen","Nur das Erlegen und Aneignen von Wild","Das Betreten fremder Grundstücke mit Waffe zu jeder Zeit","Den Handel mit Wild jeder Art"],a:0,ref:"§ 1a Abs. 1",e:"Das Jagdrecht umfasst Hege, Nachstellen, Fangen, Erlegen, Aneignen – inklusive Fallwild, Abwurfstangen und Eier des Federwildes."},
{s:1,t:"Jagdausübung",q:"Wie groß muss eine zusammenhängende, jagdlich nutzbare Grundfläche desselben Eigentümers mindestens sein, um ein Eigenjagdgebiet zu bilden?",o:["115 ha","100 ha","200 ha","300 ha"],a:0,ref:"§ 5 Abs. 1",e:"Eigenjagdgebiet: mindestens 115 ha zusammenhängend und jagdlich nutzbar."},
{s:1,t:"Jagdausübung",q:"Wer ist in Gemeindejagdgebieten jagdausübungsberechtigt?",o:["Die Gemeinde","Der Bezirksjägermeister","Die Bezirksverwaltungsbehörde","Die Kärntner Jägerschaft"],a:0,ref:"§ 2 Abs. 2 lit. b",e:"In Eigenjagdgebieten die Grundeigentümer, in Gemeindejagdgebieten die Gemeinde. Gemeinden müssen ihr Jagdausübungsrecht verpachten."},
{s:1,t:"Wild",q:"Welche Tierart zählt nach § 4 K-JG NICHT zum Schalenwild?",o:["Der Feldhase","Das Muffelwild","Das Gamswild","Das Schwarzwild"],a:0,ref:"§ 4 lit. a",e:"Schalenwild: Rot-, Dam-, Reh-, Gams-, Stein-, Muffel- und Schwarzwild. Der Feldhase ist Haarwild, aber kein Schalenwild."},
{s:1,t:"Wild",q:"Welche der folgenden Arten gehört nach § 4 K-JG zum Raubwild?",o:["Der Goldschakal","Das Murmeltier","Der Biber","Der Alpenschneehase"],a:0,ref:"§ 4 lit. a",e:"Raubwild u.a.: Bär, Waschbär, Wolf, Fuchs, Dachs, Marder, Marderhund, Iltis, Wiesel, Fischotter, Luchs, Wildkatze, Goldschakal."},
{s:1,t:"Hege",q:"Was ist bei der Hege ausdrücklich verboten?",o:["Eine Wildart so zu überhegen, dass die natürliche Äsung außerhalb der Vegetationsruhe nicht mehr ausreicht","Die Anlage von Daueräsungsflächen","Die Anlage von Hecken und Remisen","Die Förderung der Umweltbedingungen durch Reviergestaltung"],a:0,ref:"§ 3 Abs. 3",e:"Hege ist Recht und Pflicht; Überhegen über die natürliche Äsung hinaus ist verboten."},
{s:1,t:"Geordneter Jagdbetrieb",q:"Was umfasst der geordnete Jagdbetrieb laut § 3 Abs. 2 ausdrücklich auch?",o:["Eine ordnungsgemäße Ausübung des Jagdschutzes","Die Pflicht zur Wildfütterung ganzjährig","Die Abhaltung von Gesellschaftsjagden","Den Abschuss aller Raubwildarten"],a:0,ref:"§ 3 Abs. 2",e:"Der geordnete Jagdbetrieb umfasst auch eine ordnungsgemäße Ausübung des Jagdschutzes."},
// --- 5. Abschnitt: Jagdkarten ---
{s:5,t:"Jagdkarte",q:"Von wann bis wann läuft das Jagdjahr in Kärnten?",o:["1. Jänner bis 31. Dezember","1. April bis 31. März","1. Mai bis 30. April","1. Juli bis 30. Juni"],a:0,ref:"§ 36 Abs. 6",e:"Das Jagdjahr ist in Kärnten das Kalenderjahr."},
{s:5,t:"Jagdkarte",q:"Wem ist die Jagdkarte auf Verlangen vorzuweisen?",o:["Organen des öffentlichen Sicherheitsdienstes, Jagdschutzorganen und dem Jagdausübungsberechtigten","Nur der Polizei","Nur dem Bezirksjägermeister","Jedem Grundeigentümer"],a:0,ref:"§ 36 Abs. 4",e:"Wer jagt, hat die gültige Jagdkarte mitzuführen und diesen Personen vorzuweisen."},
{s:5,t:"Jagdkarte",q:"Wer ist für die Ausstellung der Jagdkarte zuständig?",o:["Der Bezirksjägermeister der Bezirksgruppe des Hauptwohnsitzes","Die Bezirksverwaltungsbehörde","Die Landesregierung","Der Landesjägermeister"],a:0,ref:"§ 37 Abs. 2",e:"Zuständig ist der Bezirksjägermeister jener Bezirksgruppe, in deren Sprengel der Bewerber den Hauptwohnsitz hat."},
{s:5,t:"Jagdkarte",q:"Minderjährige unter welchem Alter sind von der Erlangung einer Jagdkarte jedenfalls ausgeschlossen?",o:["Unter 16 Jahren","Unter 14 Jahren","Unter 18 Jahren","Unter 15 Jahren"],a:0,ref:"§ 38 Abs. 1 lit. b",e:"Unter 16: ausgeschlossen. 16–18: nur mit Zustimmung des gesetzlichen Vertreters. Unter 18 darf nur in Begleitung gejagt werden, nicht bei Treib-/Riegeljagden."},
{s:5,t:"Jagdkarte",q:"Wann ist eine Jagdkarte nach § 38a gültig?",o:["Nur mit Nachweis der Einzahlung des Jagdkartenbeitrages, des Mitgliedsbeitrages zur Kärntner Jägerschaft und der Jagdhaftpflichtprämie","Sofort nach Ausstellung unbefristet","Nur mit Stempel der Bezirksverwaltungsbehörde","Nur in Verbindung mit einem Jagderlaubnisschein"],a:0,ref:"§ 38a Abs. 1",e:"Drei Nachweise: Jagdkartenbeitrag für das laufende Kalenderjahr, Mitgliedsbeitrag und Haftpflichtprämie."},
{s:5,t:"Jagdkarte",q:"Wer entzieht die Jagdkarte, wenn eine Voraussetzung nachträglich wegfällt?",o:["Der Bezirksjägermeister","Die Bezirksverwaltungsbehörde","Der Landesjägermeister","Das Landesverwaltungsgericht"],a:0,ref:"§ 39",e:"Der Bezirksjägermeister entzieht; kein Anspruch auf Erstattung des Jagdkartenbeitrages."},
{s:5,t:"Jagdgastkarte",q:"Für welche Dauer gelten Jagdgastkarten?",o:["Drei Tage oder zwei Wochen","Eine Woche oder ein Monat","Ein Tag oder drei Tage","Einen Monat oder ein Jahr"],a:0,ref:"§ 40 Abs. 2",e:"Jagdgastkarten gelten für das gesamte Landesgebiet für drei Tage oder zwei Wochen ab Weitergabe an den Jagdgast."},
{s:5,t:"Jagdgastkarte",q:"Bis wann ist dem Bezirksjägermeister das Verzeichnis der ausgegebenen Jagdgastkarten vorzulegen?",o:["Innerhalb von zwei Wochen nach Ablauf des Jagdjahres","Bis 1. März","Innerhalb eines Monats nach jeder Ausgabe","Bis 15. Jänner"],a:0,ref:"§ 40 Abs. 4",e:"Verzeichnis mit Name und Wohnsitz der Jagdgäste binnen zwei Wochen nach Jagdjahresende."},
{s:5,t:"Jagdgastkarte",q:"Für wie lange kann der Bezirksjägermeister die Ausstellung von Jagdgastkarten untersagen, wenn der Jagdausübungsberechtigte wegen Übertretung der Jagdgastkarten-Vorschriften bestraft wurde?",o:["Bis zu drei Jahren","Bis zu einem Jahr","Bis zu fünf Jahren","Dauerhaft"],a:0,ref:"§ 40 Abs. 6",e:"Untersagung bis zu drei Jahren ab Rechtskraft des Straferkenntnisses."},
{s:5,t:"Jagderlaubnis",q:"Wann braucht man einen Jagderlaubnisschein?",o:["Wenn man ohne Begleitung des Jagdausübungsberechtigten (oder seines Jagdschutzorgans) jagt","Immer, auch bei Gesellschaftsjagden","Nur als Ausländer","Nur für die Beizjagd"],a:0,ref:"§ 41 Abs. 1",e:"Wer nicht in Begleitung jagt, braucht neben Jagdkarte eine schriftliche, auf seinen Namen lautende Bewilligung. Für Gesellschaftsjagden nicht erforderlich."},
{s:5,t:"Jagderlaubnis",q:"Ab welcher Gültigkeitsdauer eines Jagderlaubnisscheins ist die Genehmigung des Bezirksjägermeisters erforderlich?",o:["Bei mehr als einer Woche","Bei mehr als einem Tag","Bei mehr als einem Monat","Bei mehr als einem Jahr"],a:0,ref:"§ 41 Abs. 2",e:"Mehr als eine Woche: Genehmigung des BJM nötig – nicht aber für Jagdschutzorgane oder Mitglieder einer Jagdgesellschaft."},
{s:5,t:"Jagderlaubnis",q:"Braucht ein Jagdschutzorgan, das nicht Aufgaben nach § 43 erfüllt, sondern allein jagt, einen Jagderlaubnisschein?",o:["Ja, sofern es nicht selbst jagdausübungsberechtigt ist","Nein, nie","Nur bei Gesellschaftsjagden","Nur außerhalb des Aufsichtsgebietes"],a:0,ref:"§ 41 Abs. 1",e:"Jagt das Jagdschutzorgan ohne Begleitung und nicht im Jagdschutzdienst, braucht es einen Jagderlaubnisschein."},
// --- 6. Abschnitt: Jagd- und Wildschutz ---
{s:6,t:"Jagdschutz",q:"Wer hat für einen regelmäßigen, dauernden und ausreichenden Jagdschutz zu sorgen?",o:["Der Jagdausübungsberechtigte","Die Bezirksverwaltungsbehörde","Der Hegeringleiter","Die Gemeinde"],a:0,ref:"§ 43 Abs. 1",e:"Verpflichtung zum Jagdschutz trifft den Jagdausübungsberechtigten."},
{s:6,t:"Jagdschutz",q:"Was umfasst der Jagdschutz nach § 43 Abs. 2?",o:["Überwachung der Einhaltung des K-JG, der Verordnungen und Anordnungen sowie der Tier- und Pflanzenschutzbestimmungen, Schutz des Wildes vor Futternot und Wilderern","Nur die Bekämpfung von Wilderern","Nur die Kontrolle der Jagdkarten","Die Abschussplanung"],a:0,ref:"§ 43 Abs. 2",e:"Jagdschutz = Überwachung gesetzlicher Bestimmungen im Jagdgebiet + Schutz des Wildes (§ 4) vor Futternot und Wilderern."},
{s:6,t:"Jagdschutzorgane",q:"Wer sind Jagdschutzorgane im Sinne des K-JG?",o:["Berufsjäger und Jagdaufseher nach dem K-BJPG","Alle Inhaber einer Jagdkarte","Hegeringleiter und Bezirksjägermeister","Forstorgane"],a:0,ref:"§ 44 Abs. 1",e:"Jagdschutzorgane sind Berufsjäger und Jagdaufseher. Hauptberufliche Jagdschutzorgane dürfen nur Berufsjäger sein."},
{s:6,t:"Jagdschutzorgane",q:"Wie viel Fläche darf ein nebenberufliches Jagdschutzorgan höchstens betreuen?",o:["1500 ha","1000 ha","2000 ha","3000 ha"],a:0,ref:"§ 44 Abs. 5",e:"Nebenberufliches Jagdschutzorgan: höchstens 1500 ha (eines oder – bei Genehmigung – mehrerer Jagdgebiete)."},
{s:6,t:"Jagdschutzorgane",q:"Ab welcher Größe ist mindestens ein hauptberufliches Jagdschutzorgan zu bestellen?",o:["Über 2000 ha bei vorwiegend Wald, über 3000 ha für alle Jagdgebiete","Über 1500 ha für alle Jagdgebiete","Über 1000 ha bei Wald, über 2000 ha sonst","Über 5000 ha"],a:0,ref:"§ 44 Abs. 6",e:"Über 2000 ha (vorwiegend Waldungen) bzw. über 3000 ha (alle Jagdgebiete): mindestens ein hauptberufliches Jagdschutzorgan."},
{s:6,t:"Jagdschutzorgane",q:"Wer bestellt die Jagdschutzorgane?",o:["Die Bezirksverwaltungsbehörde auf Vorschlag des Jagdausübungsberechtigten","Der Bezirksjägermeister","Der Landesjägermeister","Die Landesregierung"],a:0,ref:"§ 44 Abs. 2, § 45 Abs. 2",e:"Jagdausübungsberechtigte machen Vorschläge, die BVB bestellt."},
{s:6,t:"Jagdschutzorgane",q:"Auf welche Dauer erfolgt die Bestellung eines Jagdschutzorgans?",o:["Fünf Jahre, mit automatischer Verlängerung um jeweils fünf Jahre","Drei Jahre","Zehn Jahre","Unbefristet"],a:0,ref:"§ 45 Abs. 2",e:"Fünf Jahre; gilt als um fünf Jahre verlängert, wenn nicht im drittletzten oder vorletzten Monat vor Ablauf ein anderer Vorschlag gemacht wird."},
{s:6,t:"Jagdschutzorgane",q:"Wann endet die Bestellung eines Jagdschutzorgans vorzeitig?",o:["Bei Wechsel des Jagdausübungsberechtigten, bei Verzicht gegenüber der BVB oder bei Widerruf durch die BVB","Nur bei Tod","Nur bei Verurteilung","Bei Austritt aus der Jägerschaft"],a:0,ref:"§ 45 Abs. 2",e:"Vorzeitiges Ende: Wechsel des Jagdausübungsberechtigten (bei Gemeindejagd Ende des Pachtverhältnisses), Verzicht, Widerruf."},
{s:6,t:"Jagdschutzorgane",q:"Was erhält ein erstmals bestelltes Jagdschutzorgan nach der Angelobung?",o:["Dienstausweis und Dienstabzeichen von der Bezirksverwaltungsbehörde","Eine Dienstwaffe","Eine Jagdkarte für Jagdschutzorgane vom Landesjägermeister","Ein Dienstfahrzeug"],a:0,ref:"§ 45 Abs. 3",e:"Angelobung durch die BVB, dann Dienstausweis (mit Gebiet und Aufgaben) und Dienstabzeichen."},
{s:6,t:"Jagdschutzorgane",q:"Was muss das Dienstabzeichen enthalten?",o:["Das Landeswappen und einen Hinweis auf die Eigenschaft des Trägers","Das Bundeswappen","Den Namen des Jagdausübungsberechtigten","Die Nummer der Jagdkarte"],a:0,ref:"§ 45 Abs. 4",e:"Landeswappen + Hinweis auf die Eigenschaft als Jagdschutzorgan; Näheres durch Verordnung der Landesregierung."},
{s:6,t:"Jagdschutzorgane",q:"Wie ist das Dienstabzeichen im Dienst zu tragen?",o:["Sichtbar; der Dienstausweis ist mitzuführen und auf Verlangen vorzuweisen","Verdeckt in der Tasche","Nur bei Kontrollen hervorzuholen","Gar nicht, es reicht der Ausweis"],a:0,ref:"§ 45 Abs. 5",e:"Dienstabzeichen sichtbar tragen, Dienstausweis mitführen; bei Gefahr im Verzug erst nach deren Beseitigung vorweisen."},
{s:6,t:"Jagdschutzorgane",q:"Welche Voraussetzung gilt NICHT für die Bestellung als Jagdschutzorgan nach § 46?",o:["Mindestalter 25 Jahre","Österreichische Staatsbürgerschaft","Gültige Jagdkarte","Eigenberechtigung"],a:0,ref:"§ 46",e:"Voraussetzungen: eigenberechtigt, österreichische Staatsbürgerschaft, Eignung und Verlässlichkeit, gültige Jagdkarte, Berufsjäger/Jagdaufseher nach K-BJPG, Gewähr für regelmäßigen Jagdschutz durch Wohnsitz und Beruf."},
{s:6,t:"Jagdschutzorgane",q:"Welchen besonderen Schutz genießen Jagdschutzorgane?",o:["Den Schutz, den das StGB Beamten einräumt (§ 74 Z 4 StGB), wenn sie im Dienst das Dienstabzeichen sichtbar tragen","Immunität vor Verwaltungsstrafen","Den Schutz als Organe des öffentlichen Sicherheitsdienstes","Keinen besonderen Schutz"],a:0,ref:"§ 47",e:"Beamtenschutz nach StGB – aber nur im Dienst, im Aufsichtsgebiet und mit sichtbarem Dienstabzeichen."},
{s:6,t:"Befugnisse",q:"Wen darf ein Jagdschutzorgan im Aufsichtsgebiet anhalten und auf die Identität überprüfen?",o:["Personen, die auf frischer Tat betreten werden oder in dringendem Verdacht einer Verwaltungsübertretung nach dem K-JG stehen","Jede Person, die das Jagdgebiet betritt","Nur Jäger mit Jagdkarte","Nur Personen mit Waffe"],a:0,ref:"§ 48 Abs. 1",e:"Anhalten, Identität prüfen, zum Sachverhalt befragen – bei frischer Tat oder dringendem Verdacht."},
{s:6,t:"Befugnisse",q:"Dürfen Jagdschutzorgane Fahrzeuge und Gepäckstücke durchsuchen?",o:["Ja, in den Fällen des § 48 Abs. 1 (frische Tat oder dringender Verdacht)","Nein, niemals","Nur mit richterlichem Befehl","Nur in Anwesenheit der Polizei"],a:0,ref:"§ 48 Abs. 2",e:"Durchsuchung von Fahrzeugen und Gepäckstücken in den Fällen des Abs. 1 erlaubt."},
{s:6,t:"Befugnisse",q:"Was ist mit abgenommenen Sachen zu tun?",o:["Unverzüglich der zuständigen Behörde übergeben; zurückgeben, wenn der Grund vor Übergabe entfällt","Beim Jagdschutzorgan verwahren","Dem Jagdausübungsberechtigten übergeben","Vernichten"],a:0,ref:"§ 48 Abs. 5",e:"Abgenommene Sachen sind unverzüglich der berufenen Behörde zu übergeben."},
{s:6,t:"Befugnisse",q:"Wann darf ein Jagdschutzorgan von einer Anzeige absehen?",o:["Bei geringfügigem Verschulden und unbedeutenden Folgen – dann Ermahnung und Information an den Bezirksjägermeister","Nie, es besteht immer Anzeigepflicht","Wenn der Täter ein Jäger ist","Wenn der Jagdausübungsberechtigte zustimmt"],a:0,ref:"§ 48 Abs. 6",e:"Anzeigepflicht an die BVB; Absehen bei Geringfügigkeit, dann Hinweis auf Rechtswidrigkeit und Mitteilung an den BJM."},
{s:6,t:"Wildschutz",q:"Welche Hunde darf ein Jagdschutzorgan nach § 49 töten?",o:["Hunde, die Wild hetzen oder bei fluchtbehindernder Schneelage offensichtlich ohne Aufsicht umherstreifen","Alle Hunde im Jagdgebiet ohne Leine","Nur Jagdhunde fremder Jäger","Hunde, die bellen"],a:0,ref:"§ 49 Abs. 1 lit. c",e:"Zwei Fälle: wildhetzend, oder bei die Flucht behindernder Schneelage offensichtlich ohne Aufsicht umherstreifend."},
{s:6,t:"Wildschutz",q:"Gegenüber welchen Hunden besteht das Tötungsrecht NICHT?",o:["Jagd-, Blinden-, Polizeihunde, Hunde der Finanzbehörden und des Bundesheeres, Hirtenhunde, Fährten- und Lawinensuchhunde, wenn erkennbar","Gegenüber Hunden unter 1 Jahr","Gegenüber Hunden mit Chip","Gegenüber Hunden von Landwirten"],a:0,ref:"§ 49 Abs. 3",e:"Ausnahmen gelten, wenn die Hunde als solche gekennzeichnet oder sonst erkennbar sind."},
{s:6,t:"Wildschutz",q:"Unter welcher Bedingung darf ein Jagdschutzorgan Katzen töten?",o:["Wenn sie in einem Wald umherstreifen, in dem Niederwild vorkommt","Immer, wenn sie außerhalb des Hauses sind","Nur im Winter","Nur mit Zustimmung des Besitzers"],a:0,ref:"§ 49 Abs. 1 lit. b",e:"Katzen, die in einem Wald umherstreifen, in dem Niederwild vorkommt."},
{s:6,t:"Wildschutz",q:"Wen muss das Jagdschutzorgan nach der Tötung eines Hundes oder einer Katze verständigen?",o:["Den Eigentümer (soweit bekannt) unverzüglich und den zuständigen Hegeringleiter","Nur die Polizei","Den Bürgermeister","Niemanden"],a:0,ref:"§ 49 Abs. 4",e:"Eigentümer unverzüglich verständigen; Mitteilung mit näheren Umständen an den Hegeringleiter."},
{s:6,t:"Wildschutz",q:"Wo sind Maßnahmen nach § 49 Abs. 1 (Fangen/Töten von Raubwild, Katzen, Hunden) unzulässig?",o:["Auf Flächen, auf denen die Jagd ruht","In Eigenjagdgebieten","In Gemeindejagdgebieten","In Wäldern über 1000 m Seehöhe"],a:0,ref:"§ 49 Abs. 2",e:"Auf Flächen, auf denen die Jagd ruht (§ 15), sind diese Maßnahmen unzulässig."},
{s:6,t:"Waffengebrauch",q:"Welche Waffen darf ein Jagdschutzorgan in Ausübung des Dienstes tragen?",o:["Ein Jagdgewehr und eine Faustfeuerwaffe","Nur ein Jagdgewehr","Nur eine Faustfeuerwaffe","Jede Waffe inklusive Kriegsmaterial"],a:0,ref:"§ 50 Abs. 1",e:"Jagdgewehr und Faustfeuerwaffe – unbeschadet der waffenrechtlichen Vorschriften."},
{s:6,t:"Waffengebrauch",q:"Wann darf ein Jagdschutzorgan von der Waffe Gebrauch machen?",o:["Zur Abwehr eines gegenwärtigen oder unmittelbar drohenden rechtswidrigen Angriffs auf sein Leben oder das Leben einer anderen Person","Zur Festnahme eines flüchtenden Wilderers","Zum Schutz von Sachen","Bei jedem Widerstand gegen die Anhaltung"],a:0,ref:"§ 50 Abs. 2",e:"Nur Lebensnotwehr/Nothilfe und nur in dem Maß, das zur Abwehr notwendig ist."},
{s:6,t:"Fütterungsüberwachung",q:"Als was überwacht das Jagdschutzorgan die Einhaltung der Fütterungsbestimmungen (§§ 61–61d, 63 Abs. 5 und 6)?",o:["Als Hilfsorgan der Bezirksverwaltungsbehörde","Als Organ der Kärntner Jägerschaft","Als Privatperson","Als Organ der Landesregierung"],a:0,ref:"§ 50a Abs. 1",e:"Jagdschutzorgan, Hegeringleiter und Stellvertreter sind Hilfsorgane der BVB; Verdacht ist der BVB und dem BJM zu berichten."},
{s:6,t:"Fütterungsüberwachung",q:"Was ist beim Durchstreifen fremder Jagdgebiete zur Fütterungsüberwachung verboten?",o:["Beizvögel, Frettchen, ein Gewehr oder Fanggeräte mitzuführen","Den Dienstausweis mitzuführen","Fotos zu machen","Wege zu verlassen"],a:0,ref:"§ 50a Abs. 2",e:"Durchstreifen auch abseits der Wege erlaubt, aber ohne Gewehr, Beizvögel, Frettchen oder Fang-/Tötungsgeräte."},
// --- 7. Abschnitt: Schonvorschriften ---
{s:7,t:"Schonzeiten",q:"Welche Wildart ist nach § 51 Abs. 1 K-JG ganzjährig geschont?",o:["Das Steinwild","Das Gamswild","Das Muffelwild","Der Feldhase"],a:0,ref:"§ 51 Abs. 1",e:"Ganzjährig geschont u.a.: Steinwild, Bär, Wolf, kleines Wiesel, Fischotter, Luchs, Wildkatze, Biber, Auer-/Birk-/Haselhenne, Alpenschneehuhn, Steinhuhn, Wachtel, Graureiher, Taggreifvögel, Eulen."},
{s:7,t:"Schonzeiten",q:"Wer legt die Schonzeiten für das nicht ganzjährig geschonte Wild fest?",o:["Die Landesregierung durch Verordnung","Der Landesjägermeister","Der Bezirksjägermeister","Der Landtag durch Gesetz"],a:0,ref:"§ 51 Abs. 2",e:"Die Landesregierung legt mit Verordnung Schonzeiten fest; für Alpenschneehase, Steinbock, Goldschakal, Gams, Edelmarder und Iltis jedenfalls."},
{s:7,t:"Schonzeiten",q:"Für welche Dauer dürfen Verordnungen zur Verlängerung, Aufhebung oder Verkürzung von Schonzeiten nach § 51 Abs. 4 jeweils erlassen werden?",o:["Fünf Jahre","Ein Jahr","Zwei Jahre","Zehn Jahre"],a:0,ref:"§ 51 Abs. 4",e:"Jeweils nur für die Dauer von fünf Jahren."},
{s:7,t:"Schonzeiten",q:"Was gilt für krankes, seuchenverdächtiges oder schwer verletztes Wild während der Schonzeit?",o:["Es ist auch während der Schonzeit und über den Abschussplan hinaus zu erlegen; Anzeige an BVB und BJM","Es darf nicht erlegt werden","Es darf nur mit Bewilligung der Landesregierung erlegt werden","Es ist dem Tierarzt zu übergeben"],a:0,ref:"§ 52 Abs. 4",e:"Pflicht zur Erlegung; unverzügliche Anzeige an BVB und BJM; Vorlage in der Decke beim Hegeringleiter; nicht auf den Abschussplan anzurechnen, aber in der Abschussliste gesondert auszuweisen."},
{s:7,t:"Schonzeiten",q:"Wem ist ein während der Schonzeit erlegtes krankes Stück in der Decke vorzulegen?",o:["Dem Hegeringleiter","Dem Bezirksjägermeister","Dem Amtstierarzt","Dem Landesjägermeister"],a:0,ref:"§ 52 Abs. 4",e:"Vorlage in der Decke beim Hegeringleiter; dieser verständigt bei Verdacht die BVB."},
{s:7,t:"Abschussbeschränkung",q:"Wer schränkt den Abschuss ein, wenn der Bestand einer Wildart bedeutend unter das Mindestausmaß sinkt?",o:["Der Bezirksjägermeister nach Anhörung des Bezirksjagdbeirates","Die Landesregierung","Der Jagdausübungsberechtigte selbst","Der Hegeringleiter"],a:0,ref:"§ 53",e:"BJM nach Anhörung des Bezirksjagdbeirates, auf angemessene Dauer, sofern keine Verordnung nach § 51 Abs. 3 vorliegt."},
{s:7,t:"Handel mit Wild",q:"Welches Federwild darf ohne besondere Bewilligung verkauft werden, wenn es rechtmäßig erlegt wurde?",o:["Rebhühner, Fasane, Stockenten und Ringeltauben","Auerhahn und Birkhahn","Waldschnepfe und Wachtel","Taggreifvögel und Eulen"],a:0,ref:"§ 54",e:"Rebhühner, Fasane, Stockenten, Ringeltauben – bei rechtmäßigem Erwerb. Sonstiges Federwild nur mit Bewilligung."},
// --- 8. Abschnitt: Jagdbetriebsführung ---
{s:8,t:"Abschussplanung",q:"Welches Wild unterliegt der Abschussplanung?",o:["Schalenwild außer Schwarz- und Damwild sowie Auer- und Birkhahnen","Alles Schalenwild inklusive Schwarzwild","Nur Rotwild und Rehwild","Alles Wild nach § 4"],a:0,ref:"§ 55",e:"Schalenwild (ohne Schwarzwild und Damwild) sowie Auerhahnen und Birkhahnen; die Landesregierung kann weitere Arten per Verordnung einbeziehen."},
{s:8,t:"Abschussplanung",q:"Bis wann ist der beantragte Abschussplan dem Hegeringleiter bekannt zu geben?",o:["Bis spätestens 1. März","Bis spätestens 15. März","Bis spätestens 1. Mai","Bis spätestens 1. April"],a:0,ref:"§ 57 Abs. 1",e:"1. März: Antrag an HRL. 15. März: HRL mit Stellungnahme an BJM. 1. Mai: BJM setzt den Abschussplan mit Bescheid fest."},
{s:8,t:"Abschussplanung",q:"Wer setzt den Abschussplan mit Bescheid fest?",o:["Der Bezirksjägermeister","Die Bezirksverwaltungsbehörde","Der Hegeringleiter","Die Landesregierung"],a:0,ref:"§ 57 Abs. 2",e:"Der BJM nach Anhörung des Bezirksjagdbeirates bis spätestens 1. Mai."},
{s:8,t:"Abschussplanung",q:"Für welche Dauer wird ein Abschussplan erlassen?",o:["Zwei Jahre","Ein Jahr","Drei Jahre","Fünf Jahre"],a:0,ref:"§ 57 Abs. 3",e:"Geltungsdauer des Abschussplanes: zwei Jahre."},
{s:8,t:"Abschussplanung",q:"Wem muss der Jagdausübungsberechtigte den Inhalt des Abschussplanes zur Kenntnis bringen?",o:["Seinen Jagdschutzorganen","Dem Grundeigentümer","Allen Jagdgästen","Der Gemeinde"],a:0,ref:"§ 57 Abs. 10",e:"Pflicht zur Information der Jagdschutzorgane; Verstoß ist strafbar (§ 98 Abs. 1 Z 19a)."},
{s:8,t:"Abschussmeldung",q:"Binnen welcher Frist ist der Abschuss von abschussplanpflichtigem Wild, Schwarzwild oder Damwild zu melden?",o:["Binnen einer Woche","Binnen 24 Stunden","Binnen zwei Wochen","Binnen eines Monats"],a:0,ref:"§ 58 Abs. 1",e:"Abschuss, Fang und Auffinden von Fallwild: binnen einer Woche über das elektronische Jagdinformationssystem."},
{s:8,t:"Abschussmeldung",q:"Wie hat die Abschussmeldung zu erfolgen?",o:["Über das elektronische Jagdinformationssystem der Kärntner Jägerschaft","Schriftlich per Post an die BVB","Telefonisch beim Hegeringleiter","Per Fax an die Landesregierung"],a:0,ref:"§ 58 Abs. 3",e:"Elektronisch; bei technischem Ausfall an den Hegeringleiter, der binnen einer Woche an den BJM weiterleitet."},
{s:8,t:"Abschussliste",q:"Bis wann ist die Abschussliste nach Ablauf des Jagdjahres dem Hegeringleiter zu übermitteln?",o:["Bis 15. Jänner","Bis 31. Dezember","Bis 1. März","Bis 31. Jänner"],a:0,ref:"§ 59 Abs. 4",e:"Abschluss mit Jagdjahresende, Übermittlung bis 15. Jänner an den HRL zur Weiterleitung an den BJM."},
{s:8,t:"Abschussliste",q:"Wo ist die Abschussliste aufzulegen, wenn der Jagdausübungsberechtigte außerhalb des Verwaltungsbezirkes wohnt?",o:["Beim für das Jagdgebiet bestellten Jagdschutzorgan","Bei der Gemeinde","Beim Hegeringleiter","Bei der BVB"],a:0,ref:"§ 59 Abs. 3",e:"Normal beim Jagdausübungsberechtigten; bei Wohnsitz außerhalb des Bezirks beim Jagdschutzorgan."},
{s:8,t:"Fütterung",q:"Womit darf Rotwild ohne bescheidmäßigen Auftrag gefüttert werden?",o:["Nur mit Raufutter","Mit Kraftfutter","Mit Silage","Mit Rüben und Mais"],a:0,ref:"§ 61a Abs. 1",e:"Rotwild: anderes Futter als Raufutter nur aufgrund eines Bescheides der Landesregierung (nur in Rotwildkernzonen)."},
{s:8,t:"Fütterung",q:"In welchem Umkreis um eine beschickte Rotwildfütterung ist Unbefugten das Betreten abseits der Wege untersagt?",o:["400 m","200 m","100 m","1 km"],a:0,ref:"§ 63 Abs. 7",e:"400 m um eine beschickte Rotwildfütterungsanlage – abseits von Straßen, Wegen, Pisten, Loipen."},
{s:8,t:"Fütterung",q:"In welchem Umkreis um eine Fütterung ist das Erlegen von Schalenwild verboten (§ 68)?",o:["200 m","400 m","100 m","300 m"],a:0,ref:"§ 68 Abs. 1 Z 13",e:"200 m um beschickte Fütterungen (Ausnahme § 61a Abs. 3: 400 m bei bescheidmäßigen Rotwildfütterungen vor dem 1. Jänner)."},
{s:8,t:"Fütterung",q:"Wessen Zustimmung ist zur Errichtung einer Rotwildfütterungsanlage zusätzlich erforderlich?",o:["Der Grundeigentümer und Jagdausübungsberechtigten im Umkreis von 2,8 km","Der Nachbargemeinde","Des Landesjägermeisters","Nur des eigenen Grundeigentümers"],a:0,ref:"§ 63 Abs. 1",e:"Schriftliche Zustimmung des Grundeigentümers plus der Eigentümer und Jagdausübungsberechtigten im Umkreis von 2,8 km."},
{s:8,t:"Fütterung",q:"Wem ist die Errichtung einer Rehwild-, Muffelwild- oder Rotwildfütterungsanlage anzuzeigen?",o:["Dem Bezirksjägermeister","Der Bezirksverwaltungsbehörde","Der Landesregierung","Dem Hegeringleiter"],a:0,ref:"§ 63 Abs. 5",e:"Anzeige an den BJM; Untersagung binnen acht Wochen nach Anhörung des Bezirksjagdbeirates möglich."},
{s:8,t:"Jagdeinrichtungen",q:"Was sind Einsprünge und wie sind sie geregelt?",o:["Vorrichtungen, die dem Wild das Einwechseln ermöglichen, aber das Auswechseln verhindern – verboten","Hochsitze an der Reviergrenze – bewilligungspflichtig","Wildzäune – erlaubt","Wechsel über Forststraßen – geduldet"],a:0,ref:"§ 63 Abs. 1",e:"Einsprünge sind verboten; Verstoß strafbar nach § 98 Abs. 1 Z 21."},
{s:8,t:"Jägernotweg",q:"Wie dürfen Waffen, Hunde und Beizvögel auf dem Jägernotweg mitgeführt werden?",o:["Schusswaffen ungeladen bzw. gebrochen, Hunde an der Leine, Beizvögel gesichert","Waffen geladen, Hunde frei","Nur ohne Waffen","Nur ohne Hunde"],a:0,ref:"§ 64 Abs. 1",e:"Jägernotweg wird von der BVB bestimmt; Waffen ungeladen/gebrochen, Hunde an der Leine, Beizvögel gesichert."},
{s:8,t:"Wildfolge",q:"Wem steht die Trophäe zu, wenn krankgeschossenes Schalenwild bei der Nachsuche im fremden Revier zustande gebracht wird?",o:["Dem Schützen; das Wildbret dem Jagdausübungsberechtigten des Gebietes, in dem es gefallen ist","Dem Jagdausübungsberechtigten des fremden Reviers","Dem Nachsuchenführer","Der Kärntner Jägerschaft"],a:0,ref:"§ 65 Abs. 3",e:"Wildbret: Revier, in dem das Stück gefallen ist. Trophäe: Schütze – außer die Nachsuche wird aufgegeben."},
{s:8,t:"Wildfolge",q:"Was hat der Schütze zu tun, wenn krankgeschossenes Wild in ein fremdes Jagdgebiet wechselt?",o:["Anschussstelle, Fluchtrichtung und Grenzübertritt kenntlich machen, Jagdnachbarn ehest verständigen, sich für die Nachsuche zur Verfügung stellen","Dem Wild sofort nachsetzen und es erlegen","Nichts, das Stück ist verloren","Die Polizei verständigen"],a:0,ref:"§ 65 Abs. 2",e:"Nicht weiter bejagen; Markieren, Verständigen, Bereitstehen."},
{s:8,t:"Wildfolge",q:"Wann ist Wildfolge ohne Vereinbarung zulässig?",o:["In Gebieten, auf denen die Jagd ruht (nach Benachrichtigung des Eigentümers)","Immer bei Schalenwild","Nie","Bei Nacht"],a:0,ref:"§ 65 Abs. 5",e:"Wildfolge sonst nur aufgrund schriftlicher Vereinbarung; ohne Vereinbarung nur auf Flächen, wo die Jagd ruht."},
{s:8,t:"Wildfolge",q:"Darf beim Überschreiten der Reviergrenze im Rahmen einer vereinbarten Wildfolge die Schusswaffe mitgeführt werden?",o:["Nein","Ja, geladen","Ja, ungeladen","Nur eine Faustfeuerwaffe"],a:0,ref:"§ 65 Abs. 4 lit. d",e:"Beim Überschreiten der Grenze darf die Schusswaffe nicht mitgeführt werden; Verstoß führt zum Verfall der Waffe (§ 99 Abs. 2)."},
{s:8,t:"Wildseuchen",q:"Wem sind Wahrnehmungen über Wildseuchen zu melden?",o:["Unverzüglich der Bezirksverwaltungsbehörde und dem Bezirksjägermeister","Nur dem Tierarzt","Der Landesregierung","Dem Hegeringleiter"],a:0,ref:"§ 66",e:"Der Jagdausübungsberechtigte meldet unverzüglich an BVB und BJM."},
{s:8,t:"Jagdhunde",q:"Ab welcher Jagdgebietsgröße muss ein geprüfter Schweißhund oder ein auf der Schweißfährte geprüfter Gebrauchshund gehalten werden?",o:["Über 2000 ha","Über 1000 ha","Über 1500 ha","Über 3000 ha"],a:0,ref:"§ 67 Abs. 2",e:"Für jedes Jagdgebiet ein brauchbarer Jagdhund; über 2000 ha ein geprüfter Schweißhund."},
{s:8,t:"Jagdhunde",q:"Wie ist die jagdliche Brauchbarkeit eines Jagdhundes nachzuweisen?",o:["Durch eine Leistungsprüfung nach der Prüfungsordnung eines vom ÖJGV anerkannten Vereins","Durch den Stammbaum","Durch Bestätigung des Hegeringleiters","Durch tierärztliches Attest"],a:0,ref:"§ 67 Abs. 3",e:"Jagdliche Leistungsprüfung nach Prüfungsordnung eines vom Österreichischen Jagdgebrauchshundeverband anerkannten Zucht- oder Prüfungsvereins."},
{s:8,t:"Verbotene Jagdmethoden",q:"Was gilt für halbautomatische Jagdwaffen bei der Jagdausübung?",o:["Verboten, wenn das Magazin mehr als zwei Patronen aufnehmen kann","Generell verboten","Generell erlaubt","Nur für Schrot erlaubt"],a:0,ref:"§ 68 Abs. 1 Z 1",e:"Halbautomaten mit Magazin über zwei Patronen, Vollautomaten, Luftdruckwaffen, Zimmerstutzen, Faustfeuerwaffen etc. sind zur Jagd verboten."},
{s:8,t:"Verbotene Jagdmethoden",q:"Auf welches Wild ist der Schrotschuss verboten?",o:["Auf Schalenwild und Murmeltiere","Auf Federwild","Auf Hasen","Auf Raubwild"],a:0,ref:"§ 68 Abs. 1 Z 2",e:"Schrotschuss auf Schalenwild und Murmeltiere verboten; Fangschuss mit Faustfeuerwaffe und Fangschuss mit Schrot im besiedelten Gebiet erlaubt."},
