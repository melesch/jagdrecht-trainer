 Bezirksverwaltungsbehörde unverzüglich bekanntzugeben."},{"lvl":0,"sym":"(3)","t":"Bei Gefahr im Verzug sind die zur Abwendung von Gefahren notwendigen Vorkehrungen an Naturdenkmalen unter möglichster Schonung ihres Bestandes zu treffen. Derartige Maßnahmen sind der Bezirksverwaltungsbehörde anzuzeigen."}]},{"id":"32","title":"","body":[{"lvl":0,"sym":"","t":"Die Erklärung eines Naturgebildes oder Kleinbiotops zum Naturdenkmal ist nach Anhören des Naturschutzbeirates durch Bescheid zu widerrufen, wenn"},{"lvl":1,"sym":"a)","t":"die Voraussetzungen für die Erklärung zum Naturdenkmal weggefallen sind oder"},{"lvl":1,"sym":"b)","t":"das öffentliche Interesse an der Erhaltung des Naturgebildes oder Kleinbiotops als Naturdenkmal unter dem Gesichtspunkt des Gemeinwohles geringer zu bewerten ist als das öffentliche Interesse an einer Maßnahme, die eine weitere Aufrechterhaltung des Naturdenkmalschutzes ausschließt."}]},{"id":"32a","title":"","body":[{"lvl":0,"sym":"(1)","t":"Naturgebilde und Kleinbiotope im Sinne von § 28 Abs. 1, denen vor allem örtliche Bedeutung zukommt, wie insbesondere Bäume, Baum- oder Gehölzgruppen, Oberflächengewässer, Wasserfälle, erdgeschichtliche Aufschlüsse oder Felsformationen, dürfen von der Gemeinde durch Bescheid zu örtlichen Naturdenkmalen erklärt werden. § 28 Abs. 2 und 3 gelten sinngemäß."},{"lvl":0,"sym":"(2)","t":"Im Verfahren vor Erlassung eines Bescheides im Sinne von Abs. 1 ist das Land zu hören."},{"lvl":0,"sym":"(3)","t":"Die Schutzbestimmungen für Naturdenkmale (§ 29) und die Regelungen über die Kundmachung einer Naturdenkmalerklärung (§ 30) gelten auch für örtliche Naturdenkmale."},{"lvl":0,"sym":"(4)","t":"Die Regelungen über die Genehmigung von Eingriffen in Naturdenkmale (§ 31 Abs. 1), die Bekanntgabepflichten nach § 31 Abs. 2, die Vorkehrungsverpflichtungen nach § 31 Abs. 3 und einem allfälligen Widerruf einer Naturdenkmalerklärung (§ 32) gelten für örtliche Naturdenkmale mit der Maßgabe, dass die Aufgaben der Bezirksverwaltungsbehörde jeweils die Gemeinde wahrzunehmen hat."}]}]},{"nr":5,"title":"VII. Abschnitt | Schutz von Naturhöhlen","paras":[{"id":"33","title":"","body":[{"lvl":0,"sym":"","t":"Unterirdische Hohlformen, die durch Naturvorgänge gebildet wurden, ganz oder überwiegend vom anstehenden Gestein umschlossen sind und für Menschen zugänglich gemacht werden können (Naturhöhlen), sind nach Maßgabe der Bestimmungen dieses Abschnittes geschützt."},{"lvl":0,"sym":"","t":"§ 34"},{"lvl":0,"sym":"","t":"Allgemeine Schutzbestimmungen"},{"lvl":0,"sym":"(1)","t":"Jede Maßnahme, die zur Beeinträchtigung oder Zerstörung einer Naturhöhle führt, bedarf unbeschadet strengerer Vorschriften auf Grund des § 36 vor ihrer Ausführung der Bewilligung der Bezirksverwaltungsbehörde."},{"lvl":0,"sym":"(2)","t":"Einer Bewilligung im Sinne des Abs 1 bedarf auch jede Beeinträchtigung der mit einer Naturhöhle in Zusammenhang stehenden Erscheinungen (Eingänge, Karstgebilde und ähnliches) sowie jede Beeinträchtigung oder Beseitigung des Inhaltes von Naturhöhlen."},{"lvl":0,"sym":"(3)","t":"Jeder, der Naturhöhlen oder Teile von solchen entdeckt, hat dies der Bezirksverwaltungsbehörde zu melden."},{"lvl":0,"sym":"","t":"§ 35"},{"lvl":0,"sym":"","t":"Ausnahmebewilligungen"},{"lvl":0,"sym":"(1)","t":"Eine Bewilligung für Maßnahmen nach § 34 darf nur erteilt werden, wenn"},{"lvl":1,"sym":"a)","t":"das mit der beantragten Maßnahme verfolgte Ziel auf andere, technisch mögliche oder wirtschaftlich vertretbare Weise, welche eine geringere Beeinträchtigung der Naturhöhle zur Folge hätte, nicht oder nur mit unzumutbaren Erschwernissen erreicht werden kann und"},{"lvl":1,"sym":"b)","t":"das öffentliche Interesse an der beantragten Maßnahme unter dem Gesichtspunkt des Gemeinwohles höher zu bewerten ist als jenes an der unbeeinträchtigten Erhaltung der Naturhöhle."},{"lvl":0,"sym":"(2)","t":"Bei der Erteilung von Bewilligungen im Sinne des Abs 1 gilt § 9 Abs 8 sinngemäß."},{"lvl":0,"sym":"(3)","t":"Werden Naturhöhlen im Zuge von Baumaßnahmen entdeckt, gilt eine Bewilligung nach Abs 1 als erteilt, wenn die Bezirksverwaltungsbehörde nicht binnen zwei Wochen nach Einlangen des Antrages entscheidet."},{"lvl":0,"sym":"","t":"§ 36"},{"lvl":0,"sym":"","t":"Besonderer Höhlenschutz"},{"lvl":0,"sym":"(1)","t":"Naturhöhlen oder Teile von solchen, die wegen ihres besonderen Gepräges, ihrer wissenschaftlichen oder kulturellen Bedeutung, ihrer Seltenheit, ihres Inhaltes oder aus ökologischen Gründen erhaltungswürdig sind, können durch Verordnung der Landesregierung zu besonders geschützten Naturhöhlen erklärt werden. § 27 Abs 3 gilt sinngemäß."},{"lvl":0,"sym":"(2)","t":"Soweit oberirdische Erscheinungen (Karsterscheinungen, Höhleneingänge) oder Naturgebilde im Inneren einer Naturhöhle für deren Erhaltung mitbestimmende Bedeutung haben, können diese in den Naturhöhlenschutz einbezogen werden."}]},{"id":"37","title":"","body":[{"lvl":0,"sym":"(1)","t":"In einer Verordnung nach § 36 kann, insoweit es zur Erreichung des Schutzzweckes erforderlich ist, jeder menschliche Eingriff in eine Naturhöhle und auch deren Betreten verboten werden."},{"lvl":0,"sym":"(2)","t":"Die Landesregierung kann in den Schutzbestimmungen Ausnahmen vom Verbot nach Abs. 1 vorsehen oder als bewilligungspflichtig festlegen, wenn es"},{"lvl":1,"sym":"a)","t":"zur Sicherung des Bestandes der Höhle beiträgt,"},{"lvl":1,"sym":"b)","t":"der wissenschaftlichen Erforschung dient oder"},{"lvl":1,"sym":"c)","t":"zur Erkundung der Erschließungswürdigkeit als Schauhöhle vertretbar ist."},{"lvl":0,"sym":"","t":"§ 38"},{"lvl":0,"sym":"","t":"Höhleninhalt"},{"lvl":0,"sym":"(1)","t":"Das Aufsammeln des Inhaltes von Naturhöhlen und das Graben nach Einschlüssen in Naturhöhlen ist, unbeschadet strenger Bestimmungen nach § 37, nur mit Bewilligung der Bezirksverwaltungsbehörde zulässig. Gegenstände, die dem Denkmalschutz unterliegen, bleiben hievon unberührt."},{"lvl":0,"sym":"(2)","t":"Eine Genehmigung nach Abs 1 darf nur erteilt werden, wenn"},{"lvl":1,"sym":"a)","t":"der Inhalt der Naturhöhle oder der Einschluss ohne besondere wissenschaftliche Bedeutung ist oder"},{"lvl":1,"sym":"b)","t":"das Aufsammeln oder Graben zu wissenschaftlichen Zwecken erfolgt und das Interesse an der Bergung des Inhaltes unter dem Gesichtspunkt des Gemeinwohls höher zu bewerten ist als das Interesse an der unberührten Erhaltung der Naturhöhle."},{"lvl":0,"sym":"(3)","t":"Die Bestimmungen der §§ 43 und 44 gelten für den Inhalt von Naturhöhlen mit besonderer wissenschaftlicher Bedeutung sinngemäß."},{"lvl":0,"sym":"","t":"§ 39"},{"lvl":0,"sym":"","t":"Schauhöhlen"},{"lvl":0,"sym":"(1)","t":"Naturhöhlen oder Teile von solchen dürfen nur mit Bewilligung der Bezirksverwaltungsbehörde als Schauhöhlen ausgestaltet und der Allgemeinheit zugänglich gemacht werden."},{"lvl":0,"sym":"(2)","t":"Anträgen auf Erteilung einer Bewilligung nach Abs 1 sind die erforderlichen Pläne, ein entsprechendes Betriebskonzept und die Zustimmung des Grundeigentümers anzuschließen."},{"lvl":0,"sym":"(3)","t":"Eine Bewilligung nach Abs 1 darf nur erteilt werden, wenn"},{"lvl":1,"sym":"a)","t":"ein öffentliches Interesse daran besteht, eine Naturhöhle für Zwecke der Volksbildung oder des Tourismus der Öffentlichkeit zugänglich zu machen,"},{"lvl":1,"sym":"b)","t":"sichergestellt ist, dass durch die Erklärung zur Schauhöhle keine nachhaltige Beeinträchtigung des erhaltungswürdigen Charakters der Naturhöhle eintreten wird und"},{"lvl":1,"sym":"c)","t":"die Naturhöhle die für die Errichtung als Schauhöhle erforderlichen Voraussetzungen (Begehbarkeit, Belüftung) aufweist oder diese ohne nachhaltige Beeinträchtigung ihres erhaltungswürdigen Charakters herstellbar sind."},{"lvl":0,"sym":"(4)","t":"In Bescheiden nach Abs 1 sind diejenigen Vorkehrungen aufzutragen, die zum Schutze der Höhle oder zum Schutze der Besucher einer Höhle erforderlich sind. Es ist auch festzulegen, ob und inwieweit der Zugang der Allgemeinheit nur unter der Führung von Höhlenführern (§ 40) zugelassen werden darf."},{"lvl":0,"sym":"(5)","t":"Der Betreiber einer Schauhöhle hat den Besuch durch eine Betriebsordnung zu regeln, durch die insbesondere die Einhaltung der nach Abs 4 aufzutragenden Schutzvorkehrungen zu sichern ist."},{"lvl":0,"sym":"(6)","t":"Der Betrieb einer Schauhöhle darf erst aufgenommen werden, nachdem die Bezirksverwaltungsbehörde die Betriebsordnung genehmigt hat. Ebenso bedarf jede Änderung der Betriebsordnung der vorherigen Genehmigung durch die Bezirksverwaltungsbehörde."},{"lvl":0,"sym":"","t":"§ 40"},{"lvl":0,"sym":"","t":"Höhlenführer"},{"lvl":0,"sym":"(1)","t":"Zur Führung von Personen in Naturhöhlen sind - soweit die Behörde im Bewilligungsbescheid nicht anderes festgelegt hat - nur behördlich anerkannte Höhlenführer berechtigt."},{"lvl":0,"sym":"(2)","t":"Als Höhlenführer sind von der Landesregierung Personen anzuerkennen, die die Höhlenführerprüfung abgelegt haben, verlässlich sind und die erforderliche körperliche Eignung besitzen."},{"lvl":0,"sym":"(2a)","t":"Für die Anerkennung der Berufsqualifikationen der Höhlenführer im Sinne des § 1 Abs. 2 bis 3 des Kärntner Berufsqualifikationen-Anerkennungsgesetzes (K-BQAG) gelten die Bestimmungen des K-BQAG. Die Höhlenführerprüfung im Sinne dieses Gesetzes ist ein Befähigungsnachweis gemäß § 3 Abs. 1 lit. a K-BQAG."},{"lvl":0,"sym":"(3)","t":"Die Anerkennung als Höhlenführer ist zu widerrufen, wenn die Verlässlichkeit oder die körperliche Eignung nicht mehr gegeben ist."}]},{"id":"41","title":"","body":[{"lvl":0,"sym":"(1)","t":"Zur Höhlenführerprüfung dürfen von der Landesregierung nur eigenberechtigte und verlässliche Personen zugelassen werden, die die erforderliche körperliche Eignung aufweisen."},{"lvl":0,"sym":"(2)","t":"Im Rahmen der Höhlenführerprüfung ist die fachliche Eignung eines Kandidaten für die Tätigkeit eines Höhlenführers zu prüfen. Es sind hiebei ausreichende Kenntnisse auf folgenden Gebieten nachzuweisen:"},{"lvl":1,"sym":"a)","t":"Karst- und Höhlenkunde;"},{"lvl":1,"sym":"b)","t":"Naturschutz und Höhlenrecht;"},{"lvl":1,"sym":"c)","t":"Höhlenbefahrungstechnik und Handhabung der Befahrungsgeräte;"},{"lvl":1,"sym":"d)","t":"Orientierung im Gelände, Gebrauch von Kompass, Karten und Höhlenplänen;"},{"lvl":1,"sym":"e)","t":"Kenntnisse über die bedeutendsten Höhlen Österreichs, besonders der Schauhöhlen;"},{"lvl":1,"sym":"f)","t":"Erste Hilfe unter besonderer Berücksichtigung von Unfällen in Höhlen und den Grundsätzen der Höhlenrettungstechnik."},{"lvl":0,"sym":"(3)","t":"Die Höhlenführerprüfung ist vor einer Prüfungskommission abzulegen, die aus einem rechtskundigen Vorsitzenden und drei Beisitzern, davon zwei auf dem Gebiet der theoretischen und praktischen Speläologie fachkundige Personen, und einem Arzt, zu bestehen hat. Der Vorsitzende und die übrigen Mitglieder der Prüfungskommission werden von der Landesregierung auf die Dauer von fünf Jahren bestellt. Für jedes der Mitglieder ist gleichzeitig ein Ersatzmitglied zu bestellen, das in Fällen der Verhinderung des Mitgliedes dessen Aufgaben wahrzunehmen hat."},{"lvl":0,"sym":"(4)","t":"Über das Ergebnis einer Höhlenführerprüfung hat die Prüfungskommission in nichtöffentlicher Beratung mit Stimmenmehrheit zu beschließen; bei Stimmengleichheit entscheidet der Vorsitzende. Der Beschluss hat auf “Bestanden” oder “Nichtbestanden” zu lauten; über die bestandene Prüfung ist ein Zeugnis auszustellen."}]}]},{"nr":6,"title":"VIII. Abschnitt | Schutz von Mineralien und Fossilien","paras":[{"id":"42","title":"","body":[{"lvl":0,"sym":"","t":"Mineralien oder Fossilien dürfen nicht mutwillig zerstört oder beschädigt werden."}]},{"id":"43","title":"","body":[{"lvl":0,"sym":"(1)","t":"Das Sammeln von Mineralien und Fossilien ist, unbeschadet allfälliger strengerer Bestimmungen für Naturdenkmale oder Naturschutzgebiete, unter Verwendung maschineller Einrichtungen, Spreng- oder Treibmittel oder sonstiger chemischer oder mechanischer Hilfsmittel verboten."},{"lvl":0,"sym":"(2)","t":"Ausnahmen vom Verbot des Abs. 1 dürfen, unbeschadet der Regelung in Abs. 3, nur für wissenschaftliche Zwecke und für Zwecke der Lehre bewilligt werden."},{"lvl":0,"sym":"(3)","t":"Das Sammeln von Mineralien und Fossilien unter Verwendung von Handwerkzeugen (Hammer, Meißel, Strahlstock) ist außerhalb der Kernzonen von Nationalparks, der Naturzonen von Biosphärenparks und von Grundflächen, auf denen vom Grundeigentümer ein Sammelverbot ersichtlich gemacht wurde, Personen vorbehalten, die über einen von einer Bezirksverwaltungsbehörde ausgestellten Mineraliensammelausweis – im Folgenden kurz „Ausweis“ genannt – verfügen. Aus dem Ausweis muss in Verbindung mit einem amtlichen Lichtbildausweis die Identität seines Inhabers ermittelbar sein."},{"lvl":0,"sym":"(4)","t":"Personen, die wegen Übertretungen der Bestimmungen dieses Abschnittes rechtskräftig bestraft wurden, darf ein Ausweis nicht ausgestellt werden; an solche Personen bereits ausgestellte Ausweise hat jene Bezirksverwaltungsbehörde, die die Strafe erlassen hat, einzuziehen."},{"lvl":0,"sym":"","t":"§ 44"},{"lvl":0,"sym":"","t":"Meldepflichten"},{"lvl":0,"sym":"(1)","t":"Mineralien- und Fossilienfunde, die auf Grund ihres Ausmaßes, ihrer Seltenheit, ihrer Zusammensetzung oder sonstiger Fundumstände von besonderer wissenschaftlicher Bedeutung sind, sind vom Finder der Landesregierung anzuzeigen."},{"lvl":0,"sym":"(2)","t":"Vor der Weitergabe von Mineralien- oder Fossilienfunden im Sinne des Abs 1 oder von Teilen davon an Dritte hat der Finder diese dem Land zum allfälligen Erwerb anzubieten."}]}]},{"nr":7,"title":"IX. Abschnitt | Erhebung, Entwicklung und Pflege von | Natur- und Landschaftsräumen","paras":[{"id":"45","title":"","body":[{"lvl":0,"sym":"(1)","t":"Die Landesregierung hat für Naturschutzgebiete (§ 23) und Europaschutzgebiete (§ 24a) eine Naturraumerhebung zur Sicherung des jeweiligen Schutzzweckes zu erstellen (Naturinventar). Das Naturinventar dient auch der Überwachung des günstigen Erhaltungszustandes der natürlichen Lebensräume sowie der wildlebenden Tier- und Pflanzenarten von gemeinschaftlichem Interesse."},{"lvl":0,"sym":"(2)","t":"Das Naturinventar hat die für den Schutzzweck des betreffenden Schutzgebietes bedeutsamen Umstände zu enthalten. Im Naturinventar sind als naturschutzfachlich bedeutsame Umstände insbesondere darzustellen:"},{"lvl":1,"sym":"a)","t":"die Art und Bedeutung der Natur- und Landschaftsräume,"},{"lvl":1,"sym":"b)","t":"mögliche Gefährdungen der Natur- und Landschaftsräume sowie die zur Abwehr dieser Gefährdungen zu treffenden Maßnahmen und"},{"lvl":1,"sym":"c)","t":"naturschutzrechtlich bewilligte Vorhaben."},{"lvl":0,"sym":"(3)","t":"Im Naturinventar dürfen auch Aussagen über die zweckmäßige Pflege und Nutzung oder die Verbesserung des Zustandes von Natur- und Landschaftsräumen getroffen werden und Veränderungen ersichtlich gemacht werden."},{"lvl":0,"sym":"(4)","t":"Jedermann hat das Recht, in das Naturinventar während der für den Parteienverkehr bestimmten Zeit Einsicht zu nehmen. Die Behörden und Dienststellen des Landes haben die Informationen, die im Naturinventar aufgezeichnet sind, bei ihren Entscheidungen zu berücksichtigen."},{"lvl":0,"sym":"(5)","t":"Unbeschadet des § 12 Abs. 3 hat die Landesregierung auch für Ersatzlebensräume gemäß § 12 Abs. 1 Naturinventare zu erstellen. Für sonstige nach diesem Gesetz eingerichtete Schutzgebiete oder ökologisch wertvolle Landschaftsräume kann die Landesregierung nach Maßgabe der im Landesvoranschlag hierfür vorgesehenen Mittel Naturinventare erstellen."}]},{"id":"46","title":"","body":[{"lvl":0,"sym":"","t":"Die Landesregierung darf für Schutzgebiete, die nach diesem Gesetz eingerichtet wurden, Sach-gebietsprogramme nach den Bestimmungen des § 7 Kärntner Raumordnungsgesetz 2021 erlassen, in denen insbesondere unter Bedachtnahme auf die vorhandenen Naturinventare jene Maßnahmen festzulegen sind, die zur Erhaltung und Pflege der Natur in diesen Schutzgebieten im überörtlichen Interesse gelegen sind."}]},{"id":"47","title":"","body":[{"lvl":0,"sym":"(1)","t":"Die Behörde darf zur Überwachung der bewilligungskonformen Ausführung von Vorhaben, wenn die Bewilligung aufgrund einer Interessenabwägung nach § 9 Abs. 7 erteilt wurde oder die Wiederherstellung des rechtmäßigen Zustandes verfügt wurde (§ 57), und dies zur Erfüllung der sich aus diesem Bescheid ergebenden Verpflichtungen erforderlich ist, geeignete Aufsichtsorgane durch Bescheid bestellen (ökologische Bauaufsicht). Wenn dies aufgrund des außergewöhnlichen Umfangs des Vorhabens erforderlich ist, ist eine ökologische Bauaufsicht zu bestellen."},{"lvl":0,"sym":"(2)","t":"Die ökologische Bauaufsicht erstreckt sich auf die fach-, vorschriften- und bewilligungsgemäße Ausführung des Vorhabens und die Einhaltung der einschlägigen Bedingungen der Bewilligung. Sie hat den Zustand vor Beginn der Ausführung zu dokumentieren und einen Zeitplan für die Umsetzung zu erstellen."},{"lvl":0,"sym":"(3)","t":"Die Organe der ökologischen Bauaufsicht sind jederzeit berechtigt, Untersuchungen, Vermessungen und Prüfungen im betroffenen Bereich vorzunehmen, Einsicht in Behelfe, Unterlagen u. dgl. zu verlangen und erforderlichenfalls Baustoffe, Bauteile und bautechnische Maßnahmen zu kontrollieren und zu beanstanden. Werden Beanstandungen nicht berücksichtigt, ist die Behörde davon zu informieren."},{"lvl":0,"sym":"(4)","t":"Die Organe der ökologischen Bauaufsicht sind zur Wahrung der ihnen zur Kenntnis gelangenden Betriebs- und Geschäftsgeheimnisse verpflichtet. Sie sind der Behörde gegenüber verpflichtet, auf deren Ersuchen Auskünfte zu erteilen."},{"lvl":0,"sym":"(5)","t":"Die Kosten der ökologischen Bauaufsicht sind, wenn die Bewilligung aufgrund einer Interessenabwägung nach § 9 Abs. 7 erteilt wurde oder die Bestellung der Bauaufsicht aufgrund des Umfangs des Vorhabens erforderlich ist, vom Antragsteller oder im Falle der Wiederherstellung von dem zur Wiederherstellung gemäß § 57 Verpflichteten zu tragen. Dessen Verantwortlichkeit wird durch die Bestellung der ökologischen Bauaufsicht nicht eingeschränkt."},{"lvl":0,"sym":"","t":"§ 48"},{"lvl":0,"sym":"","t":"(entfällt)"}]}]},{"nr":8,"title":"X. Abschnitt | Entschädigung, Sicherheitsleistung","paras":[{"id":"49","title":"","body":[{"lvl":0,"sym":"(1)","t":"Treten"},{"lvl":1,"sym":"1.","t":"infolge Erklärung von Gebieten zu Naturschutzgebieten, Europaschutzgebieten, von Naturgebilden oder Kleinbiotopen zu Naturdenkmalen – ausgenommen örtliche Naturdenkmale – sowie von Naturhöhlen zu besonders geschützten Naturhöhlen oder"},{"lvl":1,"sym":"2.","t":"durch Anordnungen im Sinne der §§ 18 Abs. 4 und 5 und 19 Abs. 5 und 6 oder"},{"lvl":1,"sym":"3.","t":"infolge der Übermittlung von Vorschlägen für Gebiete im Sinne des § 24a Abs. 1 an die Kommission der Europäischen Union (§ 24b Abs. 5) oder der Aufnahme von Gebieten in die Liste der Gebiete von gemeinschaftlicher Bedeutung (§ 24b Abs. 5),"},{"lvl":0,"sym":"","t":"für den Eigentümer oder sonstigen Berechtigten im betroffenen Gebiet vermögensrechtliche Nachteile oder Wirtschaftserschwernisse ein, die nicht gemäß § 2a abgegolten wurden, so haben diese vom Land nach Maßgabe der folgenden Absätze Anspruch auf Entschädigung. Entsteht durch einen Bescheid gemäß § 24b für den Eigentümer oder sonstigen Berechtigten nachträglich eine noch nicht durch eine Entschädigung gemäß Z 1 oder 3 abgegoltene Beeinträchtigung der bisherigen ortsüblichen und zeitgemäßen Wirtschaftsführung, so haben diese vom Land nach Maßgabe der folgenden Absätze Anspruch auf Entschädigung."},{"lvl":0,"sym":"(2)","t":"Der Anspruch auf eine Entschädigung gemäß Abs. 1 ist, soweit eine Einigung über deren Höhe oder über die Schadloshaltung durch die Bereitstellung von Ersatzgrundstücken nicht zustande kommt,"},{"lvl":1,"sym":"1.","t":"in den Fällen des Abs. 1 erster Satz innerhalb von drei Jahren ab dem Inkrafttreten der Verordnung, der Rechtskraft des Bescheides oder der Übermittlung des Vorschlags an die Europäische Kommission bzw. der Aufnahme in die Liste von Gebieten von gemeinschaftlicher Bedeutung und"},{"lvl":1,"sym":"2.","t":"in den Fällen des Abs. 1 zweiter Satz innerhalb eines Jahres nach Rechtskraft des Bescheides"},{"lvl":0,"sym":"","t":"bei der Landesregierung geltend zu machen."},{"lvl":0,"sym":"(3)","t":"Die Landesregierung hat die Entschädigung nach Anhören eines unparteiischen Sachverständigen mit Bescheid festzusetzen. Bei der Festsetzung der Entschädigung hat der Wert der besonderen Vorliebe außer Betracht zu bleiben. Über den Antrag auf Leistung einer Entschädigung ist möglichst unverzüglich zu entscheiden. Die Entschädigung ist in Geld zu leisten."},{"lvl":0,"sym":"(4)","t":"Auf die Festsetzung der Entschädigung findet, sofern in diesem Gesetz nicht anderes bestimmt ist, das Eisenbahn-Enteignungsentschädigungsgesetz, BGBl Nr 71/1954, sinngemäß Anwendung."},{"lvl":0,"sym":"(5)","t":"Der Entschädigungswerber kann binnen zwei Monaten nach Zustellung des Bescheides, mit dem die Entschädigung festgelegt wird, die Neufestsetzung der Entschädigung beim Landesgericht Klagenfurt beantragen. Mit dem Einlangen des Antrages beim Landesgericht tritt der Bescheid der Landesregierung außer Kraft. Zieht der Entschädigungswerber den an das Landesgericht gerichteten Antrag wieder zurück, so gilt der im Entschädigungsbescheid festgesetzte Betrag als vereinbart. Auf das Verfahren vor dem Landesgericht finden die Bestimmungen des Eisenbahn-Enteignungsentschädigungsgesetzes, BGBl Nr 71/1954, sinngemäß Anwendung."}]},{"id":"50","title":"","body":[{"lvl":0,"sym":"(1)","t":"In Bewilligungen nach diesem Gesetz oder einer auf Grund dieses Gesetzes erlassenen Verordnung, die unter Auflagen oder befristet erteilt wurden, kann soweit dies aus den besonderen Gründen des Einzelfalls erforderlich erscheint, eine Sicherheitsleistung bis zur Höhe der voraussichtlichen Kosten der Ausführung der Auflagen bzw. der Maßnahmen vorgeschrieben werden."},{"lvl":0,"sym":"(2)","t":"Bar erlegte Sicherheitsleistungen sind zur Deckung der Kosten einer allfälligen Ersatzvornahme im Verwaltungsvollstreckungsverfahren zu verwenden. Fällt der Zweck der Sicherstellung weg, ist die Sicherheitsleistung samt aufgelaufener Zinserträge zurückzuerstatten."}]}]},{"nr":9,"title":"Xa. Abschnitt | Abgabe für die Inanspruchnahme der Natur","paras":[{"id":"50a","title":"","body":[{"lvl":0,"sym":"(1)","t":"Für die Inanspruchnahme der Natur durch"},{"lvl":1,"sym":"a)","t":"die Gewinnung von Bodenschätzen aus einer bewilligungspflichtigen Anlage nach § 4 lit. b und"},{"lvl":1,"sym":"b)","t":"die Gewinnung von in festem Zustand vorkommenden mineralischen Rohstoffen, die dem Mineralrohstoffgesetz, BGBl I Nr 38/1999, unterliegt, ist eine Abgabe zu entrichten (Naturschutzabgabe)."},{"lvl":0,"sym":"","t":"Als Gewinnung im Sinne der lit. a und b gilt auch die Entnahme aus Gewässern. Die Abgabepflicht entfällt, wenn die Entnahme als Maßnahme gemäß § 3 lit. a erforderlich ist oder im Zusammenhang mit dem Hochwasserschutz bzw. dem Schutz vor Naturgefahren vom Bund oder Land gefördert wird."},{"lvl":0,"sym":"(2)","t":"Bodenschätze im Sinne des Abs. 1 lit. a sind Erze, sonstige in festem Zustand vorkommende mineralische Rohstoffe, Steine, Schotter, Kiese, Sand, Lehm, Torf, mineralische Erden und Abbaumaterial aus fossilen Lagerstätten."},{"lvl":0,"sym":"(3)","t":"Die Abgabe im Sinne des Abs. 1 ist eine ausschließliche Landesabgabe gemäß § 6 Abs. 1 Z 3 des Finanz-Verfassungsgesetzes 1948, BGBl Nr 45."},{"lvl":0,"sym":"(4)","t":"Der Ertrag der Abgabe ist von der Landesregierung zweckgewidmet für Maßnahmen zum Schutz und zur Pflege der Natur (§ 2 Abs. 2 lit. b) zu verwenden."},{"lvl":0,"sym":"(5)","t":"Stellt eine Gemeinde, in deren Gebiet Maßnahmen nach Abs. 1 lit. a erfolgen, ein Ansuchen auf Förderung von Maßnahmen zum Schutz und zur Pflege der Natur, so hat die Landesregierung dieser Gemeinde für diese Maßnahmen mindestens 20 v. H. des Ertrages der Abgabe zur Verfügung zu stellen, der in diesem Gemeindegebiet aufgebracht wird."}]},{"id":"50b","title":"","body":[{"lvl":0,"sym":"(1)","t":"Zur Entrichtung der Abgabe ist verpflichtet, wer Maßnahmen nach § 50a Abs. 1 durchführt."},{"lvl":0,"sym":"(2)","t":"Macht der Inhaber einer Bewilligung nach § 4 lit. b oder einer Berechtigung nach dem Mineralrohstoffgesetz hievon nicht selbst Gebrauch, hat er die Landesregierung unverzüglich zu informieren, wer Maßnahmen nach § 50a Abs. 1 durchführt."},{"lvl":0,"sym":"(3)","t":"Erteilt die Behörde eine Bewilligung nach § 4 lit. b, hat sie die Landesregierung hievon in Kenntnis zu setzen. Wer Bodenschätze (§ 50a Abs. 1) gewinnt, deren Gewinnung dem Mineralrohstoffgesetz unterliegt, hat die Landesregierung hievon unverzüglich in Kenntnis zu setzen."}]},{"id":"50c","title":"","body":[{"lvl":0,"sym":"(1)","t":"Die Naturschutzabgabe beträgt:"},{"lvl":1,"sym":"1.","t":"11 Cent/Tonne des aus Gewässern entnommenen Materials,"},{"lvl":1,"sym":"2.","t":"40 Cent/Tonne abgebauten Torfes und"},{"lvl":1,"sym":"3.","t":"21 Cent/Tonne sonstiger abgebauter Bodenschätze."},{"lvl":0,"sym":"(2)","t":"Die Landesregierung hat die in Abs. 1 genannten Abgabensätze durch Verordnung entsprechend den Änderungen des von der Bundesanstalt Statistik Austria verlautbarten Verbraucherpreisindexes 2000 oder eines jeweils an seine Stelle tretenden Indexes neu festzusetzen, wenn die Änderung dieses Indexes seit der letzten Festsetzung mindestens 10 v. H. beträgt; diese Verordnungen sind jeweils mit dem Beginn des der Indexänderung folgenden Kalenderjahres in Kraft zu setzen. Die Abgabensätze sind auf einen vollen Cent-Betrag zu runden, wobei ab 0,5 Cent aufzurunden ist."}]},{"id":"50d","title":"","body":[{"lvl":0,"sym":"(1)","t":"Die Abgabepflichtigen haben den Beginn und das Ende von Maßnahmen nach § 50a Abs. 1 binnen zwei Wochen der Landesregierung anzuzeigen."},{"lvl":0,"sym":"(2)","t":"Die Abgabepflichtigen haben der Landesregierung jeweils bis 31. März eines Jahres die im Vorjahr entstandene und von ihnen selbst auf Grund geeigneter Unterlagen ermittelte Abgabenschuld zu erklären und die Abgabe bis zum selben Termin an die von der Landesregierung bestimmte Zahlstelle zu überweisen. Die Überweisungspflicht besteht nicht, wenn die jeweilige Abgabensumme eines Jahres 20 Euro nicht übersteigt (Bagatellgrenze)."},{"lvl":0,"sym":"(3)","t":"Die Abgabepflichtigen haben Unterlagen über die Menge der gewonnenen Bodenschätze oder Rohstoffe und der gewonnenen in festem Zustand vorkommenden mineralischen Rohstoffe sowie des veräußerten oder sonst verwerteten Materials dieser Bodenschätze zu führen."},{"lvl":0,"sym":"(4)","t":"Kommt der Inhaber einer Bewilligung nach § 4 lit. b oder einer Berechtigung nach dem Mineralrohstoffgesetz seiner Verpflichtung nach § 50b Abs. 2 nicht oder nicht unverzüglich nach, so haftet er für die im Zeitraum bis zur Information der Landesregierung anfallenden Abgaben mit dem Abgabepflichtigen zur ungeteilten Hand."}]}]},{"nr":10,"title":"XI. Abschnitt | Verfahren","paras":[{"id":"51","title":"","body":[{"lvl":0,"sym":"(1)","t":"Die Erteilung von Bewilligungen nach diesem Gesetz ist schriftlich zu beantragen."},{"lvl":0,"sym":"(2)","t":"In einem Antrag sind Art, Lage, Umfang und Verwendung des Vorhabens anzugeben. Das Eigentum am betroffenen Grundstück ist glaubhaft zu machen. Ist der Antragsteller nicht Grundeigentümer, ist die Zustimmung des Eigentümers zu beantragten Bewilligungen nach §§ 4, 5 Abs. 1 und 6 Abs. 1 sowie Anträgen auf Erteilung von Ausnahmegenehmigungen von den Verboten nach den §§ 6 Abs. 2, 7 und 8 schriftlich nachzuweisen, es sei denn, dass aufgrund anderer gesetzlicher Regelungen für die beantragte Maßnahme eine Enteignung oder eine Einräumung von Zwangsrechten möglich ist."},{"lvl":0,"sym":"(3)","t":"Dem Antrag sind die zur Beurteilung des Vorhabens erforderlichen Unterlagen, insbesondere Pläne, Beschreibungen, Skizzen u. dgl. in zweifacher Ausfertigung anzuschließen. Die Landesregierung darf durch Verordnung nähere Bestimmungen über Inhalt und Ausstattung von Bewilligungsanträgen sowie Form und Inhalt der zur Beurteilung von Vorhaben erforderlichen Pläne und Beschreibungen erlassen."},{"lvl":0,"sym":"(4)","t":"Die Behörde kann die Vorlage von Unterlagen verlangen, die zur Beurteilung der voraussichtlichen Auswirkungen eines Vorhabens auf die Umwelt sowie zur Bewertung des öffentlichen Interesses an der beantragten Maßnahme unter dem Gesichtspunkt des Gemeinwohles erforderlich sind."},{"lvl":0,"sym":"(5)","t":"Werden Angaben oder Unterlagen im Sinne der Abs. 2 bis 4 nicht oder nicht vollständig beigebracht, ist nach § 13 Abs. 3 AVG vorzugehen."},{"lvl":0,"sym":"(6)","t":"Wenn über einen Antrag eine mündliche Verhandlung durchgeführt wird, ist diese nach Möglichkeit mit nach anderen Gesetzen erforderlichen mündlichen Verhandlungen zu verbinden."}]},{"id":"51a","title":"","body":[{"lvl":0,"sym":"(1)","t":"Für bewilligungspflichtige Vorhaben im Sinne von § 4 und § 5 Abs. 1 darf anstelle eines Antrages nach § 51 Abs. 1 nach Maßgabe von Abs. 2 eine schriftliche Anzeige an die Behörde erstattet werden."},{"lvl":0,"sym":"(2)","t":"In einer Anzeige nach Abs. 1 sind Art, Lage, Umfang und Verwendung des Vorhabens anzugeben und die zur Beurteilung des Vorhabens erforderlichen Pläne und Beschreibungen sowie eine Darstellung anzuschließen, warum das Vorhaben nicht gegen die in § 9 Abs. 1 bis 3 umschriebenen Interessen verstößt (Landschaftsverträglichkeitserklärung). § 51 Abs. 3 zweiter Satz ist anzuwenden. Die Pläne, Beschreibungen und die Landschaftsverträglichkeitserklärung müssen von einem zur Erstellung solcher Unterlagen Berechtigten erstellt und von diesem und vom Bewilligungswerber unterfertigt sein; sie sind in zweifacher Ausfertigung vorzulegen. Ein Lageplan, eine Kurzbeschreibung des Vorhabens und vereinfachte Pläne sind in zehnfacher Ausfertigung vorzulegen. Die Haftung des Verfassers der Pläne, Beschreibungen und der Landschaftsverträglichkeitserklärung für die richtige und fachgerechte Erstellung der Unterlagen wird weder durch behördliche Überprüfungen noch durch die Erteilung einer Bewilligung nach diesem Gesetz berührt."},{"lvl":0,"sym":"(3)","t":"Die Behörde hat von der Anzeige unverzüglich die Gemeinde zu verständigen, in deren Gemeindegebiet das Vorhaben geplant ist. Bei Vorhaben im Sinne von § 54 Abs. 1 sind davon auch die Mitglieder des Naturschutzbeirates zu verständigen. Die Gemeinde und die Mitglieder des Naturschutzbeirates können bis vier Wochen nach dem Einlangen der Verständigung bei der Behörde verlangen, über das Vorhaben ein Bewilligungsverfahren durchzuführen."},{"lvl":0,"sym":"(4)","t":"Wenn die Behörde nicht innerhalb von drei Monaten nach Einlangen der Anzeige der Partei unter Angabe von Gründen mitteilt, dass über das Vorhaben ein Bewilligungsverfahren durchzuführen ist und die Anzeige als Ansuchen nach § 51 gewertet wird, darf es im Sinne der eingereichten Unterlagen ausgeführt werden. Die Behörde hat der Partei eine Bescheinigung auszustellen, dass kein Bewilligungsverfahren durchzuführen ist. Die örtlich in Betracht kommenden Einsatzleiter der Kärntner Bergwacht sind davon zu informieren."},{"lvl":0,"sym":"(5)","t":"Das Recht zur Ausführung des Vorhabens erlischt zwei Jahre nach Erstattung der Anzeige."},{"lvl":0,"sym":"","t":"§ 52"},{"lvl":0,"sym":"","t":"Auflagen, Befristungen, Bedingungen"},{"lvl":0,"sym":"(1)","t":"Eine Bewilligung nach diesem Gesetz ist zu befristen oder an Auflagen oder Bedingungen zu binden, wenn dies nach dem Zweck, der Art der Ausführung oder der Beschaffenheit des Vorhabens oder der Maßnahme erforderlich und möglich ist. Im Falle der Befristung sind dem Antragsteller durch Auflagen die Maßnahmen, die im Interesse des Schutzes und der Pflege der Natur nach Ablauf der Frist zu treffen sind, aufzutragen. Ist die Erfüllung dieser Auflagen gegenüber dem Antragsteller oder dessen Rechtsnachfolger nicht durchsetzbar, so ist sie dem Grundeigentümer aufzutragen."},{"lvl":0,"sym":"(2)","t":"Eine Versagung einer Bewilligung nach diesem Gesetz darf nicht erfolgen, wenn sich die Gründe dafür durch Auflagen beseitigen lassen. Hiedurch darf ein Vorhaben in seinem Wesen nicht"},{"lvl":0,"sym":"","t":"verändert werden."},{"lvl":0,"sym":"(3)","t":"Umfasst ein bewilligungspflichtiges Vorhaben mehr als eine bauliche Anlage und besteht nur hinsichtlich der Gesamtheit der baulichen Anlagen kein Versagungsgrund, so hat die Behörde festzulegen, in welcher Reihenfolge die baulichen Anlagen ausgeführt werden müssen, falls nicht eine gleichzeitige Ausführung"},{"lvl":0,"sym":"","t":"erfolgt."}]},{"id":"53","title":"","body":[{"lvl":0,"sym":"","t":"Gemeinden, in deren Gemeindegebiet eine Maßnahme oder ein Vorhaben, das nach den §§ 4, 5 Abs. 1 oder 6 Abs. 1 einer Bewilligung bedarf, ausgeführt werden soll, haben einen Rechtsanspruch darauf, dass die im § 9 umschriebenen Interessen bei der Entscheidung gewahrt werden. Sie dürfen zur Wahrung dieser Interessen gegen einen Bescheid, mit dem eine Bewilligung erteilt wird, Beschwerde an das Landesverwaltungsgericht und Revision an den Verwaltungsgerichtshof gemäß Art. 133 Abs. 8 B-VG erheben."}]},{"id":"54","title":"","body":[{"lvl":0,"sym":"(1)","t":"Vor der Erlassung von Bescheiden, mit denen"},{"lvl":1,"sym":"1.","t":"Bewilligungen nach § 4 lit. b oder c, § 5 Abs. 1 lit. a, e oder f, erteilt werden;"},{"lvl":1,"sym":"2.","t":"Bewilligungen nach § 6 Abs. 1 erteilt werden, soweit dies nicht Maßnahmen betrifft, die der zeitgemäßen, auf die naturräumlichen Voraussetzungen abgestimmten land- und forstwirtschaftlichen Nutzung zuzurechnen sind oder soweit es sich nicht um Hochsitze (Hochstände), Wildzäune und Futterstellen im Sinne des § 63 Abs. 1 Kärntner Jagdgesetz 2000 oder soweit es sich nicht um geringfügige Änderungen von bestehenden Kraftwerksanlagen handelt;"},{"lvl":1,"sym":"3.","t":"Ausnahmebewilligungen nach den §§ 10 und 31 Abs. 1 erteilt werden;"},{"lvl":1,"sym":"4.","t":"Ausnahmebewilligungen nach den Verordnungen gemäß § 23 Abs. 1 erteilt werden, sofern eine nachhaltige Beeinträchtigung der mit der Unterschutzstellung verfolgten Ziele zu erwarten ist;"},{"lvl":1,"sym":"5.","t":"Maßnahmen in Kernzonen von Nationalparks oder Naturzonen von Biosphärenparks nach den Bestimmungen dieses Gesetzes bewilligt oder von den Verboten ausgenommen werden,"},{"lvl":0,"sym":"","t":"sind die Mitglieder des Naturschutzbeirates anzuhören."},{"lvl":0,"sym":"(2)","t":"Bescheide, mit denen Bewilligungen in den in Abs. 1 genannten Angelegenheiten erteilt werden, sind unverzüglich, längstens aber binnen einer Woche nach deren Erlassung den Mitgliedern des Naturschutzbeirates zuzustellen, sofern die Mitglieder des Naturschutzbeirates im Rahmen der Anhörung nach Abs. 1 Einwendungen vorgebracht haben. Wurde diesen Einwendungen im Bescheid nicht Rechnung getragen, kann der Naturschutzbeirat gegen derartige Bescheide Beschwerde an das Landesverwaltungsgericht erheben. Hat die Behörde die aufschiebende Wirkung der Beschwerde ausgeschlossen, gilt Abs. 3 und 4 sinngemäß."},{"lvl":0,"sym":"(3)","t":"Der durch eine Entscheidung im Sinne des Abs. 1 Berechtigte darf, sofern anlässlich der Anhörung nach Abs. 1 von den Mitgliedern des Naturschutzbeirates Einwendungen vorgebracht wurden, denen auch in der Entscheidung des Landesverwaltungsgerichts nicht Rechnung getragen wurde, diese Berechtigung solange nicht ausüben, als dem Naturschutzbeirat nach § 61 Abs. 3 das Revisionsrecht an den Verwaltungsgerichtshof offen steht. Darauf ist in der Entscheidung hinzuweisen. Hat der Naturschutzbeirat eine Revision nach § 61 Abs. 3 erhoben und den Antrag gestellt, das Landesverwaltungsgericht oder der Verwaltungsgerichtshof möge der Revision aufschiebende Wirkung zuerkennen, dann ist die Ausübung der Berechtigung bis zur Entscheidung über diesen Antrag unzulässig."},{"lvl":0,"sym":"(4)","t":"Liegt eine schriftliche Erklärung des Naturschutzbeirates vor, auf die Erhebung der Revision nach § 61 Abs. 3 zu verzichten, kann die Berechtigung sofort ausgeübt werden."}]},{"id":"54a","title":"Beteiligung von Umweltorganisationen an Verfahren","body":[{"lvl":0,"sym":"(1)","t":"Anerkannte Umweltorganisationen gemäß § 19 Abs. 7 UVP-G 2000, deren örtliche Anerkennung auch das Land Kärnten umfasst, haben das Recht"},{"lvl":1,"sym":"1.","t":"gegen Bewilligungen gemäß § 24b Abs. 2 bis 5 oder"},{"lvl":1,"sym":"2.","t":"gegen"},{"lvl":2,"sym":"a)","t":"Bewilligungen gemäß § 9 und § 24 Abs. 3,"},{"lvl":2,"sym":"b)","t":"Ausnahmen von den Verboten gemäß § 10 und"},{"lvl":2,"sym":"c)","t":"Genehmigungen gemäß § 22 Abs. 2,"},{"lvl":0,"sym":"","t":"sofern geschützte Arten, die im Anhang IV der FFH-Richtlinie (§ 67a Abs. 3 lit. b) oder in Anhang I der Vogelschutz-Richtlinie (§ 67a Abs. 3 lit. a) genannt oder in Art. 1 bis 5 der Vogelschutz-Richtlinie angesprochen sind, betroffen sind,"},{"lvl":0,"sym":"","t":"wegen der Verletzung von Vorschriften dieses Gesetzes, soweit sie Bestimmungen der FFH-Richtlinie und der Vogelschutz-Richtlinie umsetzen, Beschwerde an das Landesverwaltungsgericht zu erheben."},{"lvl":0,"sym":"(1a)","t":"Anerkannte Umweltorganisationen gemäß Abs. 1 sind Beteiligte in einem Verfahren im Sinne des Abs. 1, wenn erheblich nachteilige Auswirkungen in Bezug auf die Erreichung oder Beibehaltung des günstigen Erhaltungszustandes der Lebensräume oder Arten im Sinne der FFH- oder Vogelschutzrichtlinie zu erwarten sind. § 24b Abs. 1b bis 1c sind anzuwenden."},{"lvl":0,"sym":"(2)","t":"Die Landesregierung hat eine elektronische Plattform zur Verfügung zu stellen, die nur den Behörden und den anerkannten Umweltorganisationen offensteht, und der Bereitstellung verfahrens-relevanter Anträge und Bescheide zur Ermöglichung der Ausübung der Beteiligungsrechte gemäß Abs. 1a und § 24b Abs. 1b und 1c und des Beschwerderechts gemäß Abs. 1 dient. Die Landesregierung hat den anerkannten Umweltorganisationen im Sinne des Abs. 1 auf Antrag eine Zugangsberechtigung zu dieser Plattform sowie die erforderlichen Informationen für die Ausübung der Zugriffsberechtigung zur Verfügung zu stellen."},{"lvl":0,"sym":"(3)","t":"Alle Bewilligungen in den in Abs. 1 Z 1 und 2 lit. a bis c genannten Angelegenheiten sind, ohne die Einschränkung gemäß Z 2 letzter Halbsatz auf unionsrechtlich geschützte Arten, auf der elektronischen Plattform gemäß Abs. 2 bereitzustellen. Mit Ablauf von zwei Wochen ab dem Tag der Bereitstellung gilt der Bescheid den Umweltorganisationen gemäß Abs. 1 als zugestellt. Ab dem Tag der Bereitstellung ist ihnen Einsicht in den Verwaltungsakt zu gewähren. Die Anträge und Bescheide dürfen frühestens sechs Wochen nach der Bereitstellung von der elektronischen Plattform entfernt werden."},{"lvl":0,"sym":"(4)","t":"Beschwerden von Umweltorganisationen gemäß Abs. 1 sind binnen vier Wochen ab der Zustellung (Abs. 3) schriftlich bei der Behörde einzubringen."},{"lvl":0,"sym":"(5)","t":"Beschwerden einer Umweltorganisation gemäß Abs. 1 gegen"},{"lvl":1,"sym":"1.","t":"(entfällt)"},{"lvl":1,"sym":"2.","t":"Bescheide, die der Umweltorganisation gemäß Abs. 3 als zugestellt gelten, sind nach Ablauf der Frist des Abs. 4"},{"lvl":0,"sym":"","t":"als unzulässig zurückzuweisen, wenn der Umweltorganisation bereits vor Beginn der Frist des § 24b | Abs. 1b erster Satz (Z 1) oder § 54a Abs. 3 zweiter Satz (Z 2) eine Zugriffsberechtigung gemäß Abs. 2 zur Verfügung stand."},{"lvl":0,"sym":"(6)","t":"Abweichend von Abs. 5 sind Beschwerden einer Umweltorganisation gemäß Abs. 1 Z 1 – soweit dies Angelegenheiten gemäß § 24b Abs. 1 erster Satz betrifft – und gemäß Abs. 1a nur dann als unzulässig zurückzuweisen, wenn in der Beschwerde Einwände oder Gründe erstmals vorgebracht werden und dieses erstmalige Vorbringen missbräuchlich oder unredlich ist."}]},{"id":"55","title":"","body":[{"lvl":0,"sym":"(1)","t":"Eine nach den Bestimmungen dieses Gesetzes oder einer nach diesem Gesetz erlassenen Verordnung erteilte Bewilligung erlischt durch"},{"lvl":1,"sym":"a)","t":"den der Behörde zur Kenntnis gebrachten Verzicht des Berechtigten;"},{"lvl":1,"sym":"b)","t":"Unterlassung der tatsächlichen Inangriffnahme des Vorhabens innerhalb der in der Bewilligung bestimmten Frist; ist eine derartige Frist nicht bestimmt, innerhalb von zwei Jahren ab Rechtskraft der Bewilligung;"},{"lvl":1,"sym":"c)","t":"Unterlassung der der Entscheidung entsprechenden Fertigstellung des Vorhabens innerhalb der in der Bewilligung bestimmten Frist; ist eine derartige Frist nicht bestimmt, innerhalb von fünf Jahren ab Rechtskraft der Bewilligung."},{"lvl":0,"sym":"(2)","t":"Die in Abs. 1 genannten Fristen sowie gemäß § 52 Abs. 1 befristet erteilte Bewilligungen können aus triftigen Gründen verlängert werden, wenn dies mit den Interessen des Schutzes und der Pflege der Natur vereinbar ist. Der Antrag auf Verlängerung ist rechtzeitig, spätestens aber vier Wochen vor Ablauf der Frist bzw. der Bewilligungsdauer bei der Behörde in schriftlicher Form einzubringen. Der Ablauf der Frist bzw. der Bewilligungsdauer ist bis zur Entscheidung über den Verlängerungsantrag gehemmt. Eine wiederholte Verlängerung der Bewilligungsdauer ist zulässig. Aus Anlass der Verlängerung der Frist oder der Bewilligung können zum Schutz und zur Pflege der Natur andere oder zusätzliche Auflagen vorgeschrieben werden."}]},{"id":"56","title":"","body":[{"lvl":0,"sym":"(1)","t":"Werden Handlungen oder Maßnahmen, die nach diesem Gesetz oder einer auf Grund dieses Gesetzes erlassenen Verordnung verboten oder bewilligungspflichtig sind, entgegen dem Verbot, ohne Bewilligung oder abweichend von der Bewilligung ausgeführt, so hat die Bezirksverwaltungsbehörde die Einstellung gegenüber dem nach § 57 Abs. 2 zur allfälligen Wiederherstellung Verpflichteten zu verfügen."},{"lvl":0,"sym":"(2)","t":"Stellen von der Bezirksverwaltungsbehörde hiezu besonders ermächtigte Organe an Ort und Stelle fest, dass die Voraussetzungen des Abs. 1 gegeben sind, haben sie sofort und ohne weiteres Verfahren die Weiterführung der Arbeiten zu untersagen (vorläufige Arbeitseinstellung). Diese Anordnung tritt außer Kraft, wenn die Bezirksverwaltungsbehörde nicht binnen zwei Wochen die Einstellung nach Abs. 1 verfügt."},{"lvl":0,"sym":"(3)","t":"Beschwerden gegen Bescheide nach Abs. 1 haben keine aufschiebende Wirkung."},{"lvl":0,"sym":"(4)","t":"Werden Handlungen oder Maßnahmen im Sinne von Abs. 1 trotz verfügter Einstellung fortgesetzt, darf die Behörde den betreffenden Bereich versiegeln oder absperren."},{"lvl":0,"sym":"","t":"§ 57"},{"lvl":0,"sym":"","t":"Wiederherstellung"},{"lvl":0,"sym":"(1)","t":"Wurden Maßnahmen, die nach diesem Gesetz oder einer auf Grund dieses Gesetzes erlassenen Verordnung verboten oder bewilligungspflichtig sind, entgegen dem Verbot, ohne Bewilligung oder abweichend von der Bewilligung ausgeführt, ist die Wiederherstellung des rechtmäßigen Zustandes binnen angemessen festzusetzender Frist aufzutragen. Ist die Wiederherstellung des rechtmäßigen Zustandes nicht möglich oder würde dies den Zielsetzungen dieses Gesetzes widersprechen, können entsprechende Maßnahmen zur Herbeiführung eines den Interessen des Schutzes und der Pflege der Natur möglichst weitgehend Rechnung tragenden Zustandes vorgeschrieben werden."},{"lvl":0,"sym":"(2)","t":"Die Wiederherstellung oder sonstige nach Abs 1 zu setzende Maßnahmen obliegen in den Fällen, in denen Maßnahmen abweichend von einer Bewilligung ausgeführt werden, dem Antragsteller oder dessen Rechtsnachfolger, im übrigen primär demjenigen, der die Maßnahmen veranlasst oder gesetzt hat, kann dieser nicht herangezogen werden, dem Grundstückseigentümer oder dem sonst über ein Grundstück Verfügungsberechtigten."},{"lvl":0,"sym":"(3)","t":"Ohne Bewilligung oder abweichend von einer Bewilligung angebrachte Anlagen im Sinne des § 5 Abs 1 lit k sowie in Widerspruch zu § 13 lit a abgelagerte Gegenstände (Müll, Unrat, Autowracks oder ähnliche Abfälle) und Plakate, die in der freien Landschaft außerhalb von hiefür vorgesehenen Anlagen angebracht sind, sind von der Gemeinde sofort zu entfernen. Die Gemeinde hat den Eigentümer des entfernten Gegenstandes oder sonst darüber Verfügungsberechtigten unverzüglich mit Bescheid aufzufordern, diesen zu übernehmen. Dies gilt nicht für Müll, Unrat sowie Plakate und ähnliche Gegenstände mit geringem Sachwert."},{"lvl":0,"sym":"(4)","t":"Die Kosten der Entfernung und Aufbewahrung eines Gegenstandes im Sinne des Abs 3 sind vom Eigentümer oder Verfügungsberechtigten der Gemeinde zu ersetzen. Eine Nichtübernahme eines entfernten Gegenstandes durch den Eigentümer oder Verfügungsberechtigten binnen einem Monat nach Aufforderung bewirkt dessen Verfall zugunsten der Gemeinde. Für Schäden, die bei der Entfernung von Gegenständen unvermeidbar eintreten, besteht kein Anspruch auf Entschädigung."},{"lvl":0,"sym":"(5)","t":"Die Bezirksverwaltungsbehörde hat Maßnahmen, die nach diesem Gesetz verboten sind, oder bewilligungspflichtige Maßnahmen, wenn sie entgegen dem Verbot, ohne Bewilligung oder abweichend von der Bewilligung ausgeführt werden und mit ihnen schwere Schädigungen des Gefüges des Haushaltes der Natur im betroffenen Lebensraum verbunden sind, sofort zu beseitigen oder soweit als möglich rückgängig zu machen. Die Kosten sind von demjenigen, der die Maßnahmen veranlasst hat, kann dieser nicht herangezogen werden, vom Grundeigentümer oder sonst über ein Grundstück Verfügungsberechtigten, zu tragen."}]}]},{"nr":11,"title":"XIa. Abschnitt | Vermeidung und Sanierung | von Umweltschäden","paras":[{"id":"57a","title":"","body":[{"lvl":0,"sym":"","t":"Dieser Abschnitt regelt auf der Grundlage des Verursacherprinzips Maßnahmen zur Vermeidung und Sanierung von Schädigungen geschützter Arten und natürlicher Lebensräume."}]},{"id":"57b","title":"","body":[{"lvl":0,"sym":"(1)","t":"Dieser Abschnitt gilt für Schädigungen geschützter Arten und natürlicher Lebensräume und für jede unmittelbare Gefahr solcher Schädigungen"},{"lvl":1,"sym":"a)","t":"durch die Ausübung einer der im Anhang II angeführten beruflichen Tätigkeiten und"},{"lvl":1,"sym":"b)","t":"durch die Ausübung einer anderen als der im Anhang II angeführten beruflichen Tätigkeiten, sofern der Betreiber vorsätzlich oder fahrlässig gehandelt hat."},{"lvl":0,"sym":"(2)","t":"Wird die Schädigung geschützter Arten und natürlicher Lebensräume oder eine unmittelbare Gefahr einer solchen durch eine nicht klar abgegrenzte Verschmutzung verursacht, ist dieser Abschnitt nur dann anzuwenden, wenn ein ursächlicher Zusammenhang zwischen dem Schaden und den Tätigkeiten einzelner Betreiber festgestellt werden kann."},{"lvl":0,"sym":"(3)","t":"Weitergehende Verpflichtungen aufgrund von unmittelbar anwendbaren unionsrechtlichen Vorschriften sowie von Gesetzen und auf deren Grundlage erlassenen Verordnungen und Entscheidungen, die die Vermeidung oder Sanierung von Umweltschäden regeln, bleiben durch die Bestimmungen dieses Abschnittes unberührt."},{"lvl":0,"sym":"(4)","t":"Die Bestimmungen des bürgerlichen Rechtes auf dem Gebiet des Schadenersatzes bleiben durch die Bestimmungen dieses Abschnittes unberührt."}]},{"id":"57c","title":"","body":[{"lvl":0,"sym":"","t":"Im Sinne dieses Abschnittes gilt als"},{"lvl":1,"sym":"1.","t":"„Schädigung geschützter Arten und natürlicher Lebensräume“ (Umweltschaden) jeder Schaden, der erhebliche nachteilige Auswirkungen in Bezug auf die Erreichung oder Beibehaltung des günstigen Erhaltungszustands der Lebensräume oder Arten hat. Die Erheblichkeit dieser Auswirkungen ist mit Bezug auf den Ausgangszustand unter Berücksichtigung der Kriterien gemäß Anhang I zu ermitteln."},{"lvl":1,"sym":"2.","t":"„Schaden“ oder „Schädigung“ eine direkt oder indirekt eintretende feststellbare nachteilige Veränderung einer natürlichen Ressource oder Beeinträchtigung der Funktion einer natürlichen Ressource;"},{"lvl":1,"sym":"3.","t":"„geschützte Arten und natürliche Lebensräume“:"},{"lvl":2,"sym":"a)","t":"die Arten, die in Art. 4 Abs. 2 der Vogelschutz-Richtlinie (§ 67a Abs. 3 lit. a) genannt oder in Anhang I dieser Richtlinie aufgelistet sind oder in den Anhängen II und IV der FFH-Richtlinie (§ 67a Abs. 3 lit. b) aufgelistet sind,"},{"lvl":2,"sym":"b)","t":"die Lebensräume der in Art. 4 Abs. 2 der Vogelschutz-Richtlinie genannten oder in Anhang I dieser Richtlinie aufgelisteten oder in Anhang II der FFH-Richtlinie aufgelisteten Arten und die in Anhang I der FFH-Richtlinie aufgelisteten natürlichen Lebensräume sowie die Fortpflanzungs- oder Ruhestätten der in Anhang IV der FFH-Richtlinie aufgelisteten Arten;"},{"lvl":1,"sym":"4.","t":"„Erhaltungszustand“"},{"lvl":2,"sym":"a)","t":"im Hinblick auf einen natürlichen Lebensraum, die Gesamtheit der Einwirkungen, die einen natürlichen Lebensraum und die darin vorkommenden charakteristischen Arten beeinflussen und sich langfristig auf seine natürliche Verbreitung, seine Struktur und seine Funktionen sowie das Überleben seiner charakteristischen Arten,"},{"lvl":2,"sym":"b)","t":"im Hinblick auf eine Art, die Gesamtheit der Einwirkungen, die die betreffende Art beeinflussen und sich langfristig auf die Verbreitung und Größe der Populationen der betreffenden Art im europäischen Gebiet der Mitgliedstaaten der Europäischen Union, innerhalb Österreichs oder innerhalb des natürlichen Verbreitungsgebiets des betreffenden Lebensraums auswirken können;"},{"lvl":1,"sym":"5.","t":"„günstiger“ Erhaltungszustand"},{"lvl":2,"sym":"a)","t":"hinsichtlich eines natürlichen Lebensraums, wenn"},{"lvl":3,"sym":"aa)","t":"das natürliche Verbreitungsgebiet sowie die Flächen, die der Lebensraum in diesem Gebiet einnimmt, beständig sind oder sich ausdehnen,"},{"lvl":3,"sym":"bb)","t":"die für einen langfristigen Fortbestand notwendige Struktur und spezifischen Funktionen bestehen und in absehbarer Zukunft weiter bestehen werden und"},{"lvl":3,"sym":"cc)","t":"der Erhaltungszustand der für den Lebensraum charakteristischen Arten im Sinne der Z 4 lit. b günstig ist;"},{"lvl":2,"sym":"b)","t":"hinsichtlich einer Art, wenn"},{"lvl":3,"sym":"aa)","t":"aufgrund der Daten über die Populationsdynamik der Art anzunehmen ist, dass diese Art ein lebensfähiges Element des natürlichen Lebensraums, dem sie angehört, bildet und langfristig weiterhin bilden wird,"},{"lvl":3,"sym":"bb)","t":"das natürliche Verbreitungsgebiet dieser Art weder abnimmt noch in absehbarer Zeit vermutlich abnehmen wird und"},{"lvl":3,"sym":"cc)","t":"ein genügend großer Lebensraum vorhanden ist und wahrscheinlich weiterhin vorhanden sein wird, um langfristig ein Überleben der Populationen dieser Art zu sichern;"},{"lvl":1,"sym":"6.","t":"„Betreiber“ jede natürliche oder juristische Person des privaten oder öffentlichen Rechts, die die berufliche Tätigkeit – allein oder mittels Gehilfen – ausübt oder bestimmt, einschließlich des Inhabers einer Zulassung oder Genehmigung sowie der Person, die die Anmeldung oder Notifizierung vornimmt. Wird die Tätigkeit nicht mehr ausgeübt und kann der bisherige Betreiber nicht mehr herangezogen werden, tritt an seine Stelle der Eigentümer (jeder Miteigentümer) der Liegenschaft, von der die Schädigung ausgeht, sofern er den Anlagen oder Maßnahmen von denen die Schädigung ausgeht zugestimmt oder sie freiwillig geduldet und ihm zumutbare Abwehrmaßnahmen unterlassen hat;"},{"lvl":1,"sym":"7.","t":"„berufliche Tätigkeit“ jede Tätigkeit, die im Rahmen einer wirtschaftlichen Tätigkeit, einer Geschäftstätigkeit oder eines Unternehmens mit oder ohne Erwerbszweck ausgeübt wird, unabhängig davon, ob diese Tätigkeit privat- oder öffentlichrechtlichen Vorschriften unterliegt;"},{"lvl":1,"sym":"8.","t":"„Emission“ die Freisetzung von Stoffen, Zubereitungen, Organismen oder Mikroorganismen in die Umwelt infolge menschlicher Tätigkeiten;"},{"lvl":1,"sym":"9.","t":"„unmittelbare Gefahr eines Schadens“ die hinreichende Wahrscheinlichkeit, dass eine Schädigung geschützter Arten und natürlicher Lebensräume in naher Zukunft eintreten wird;"},{"lvl":1,"sym":"10.","t":"„Vermeidungsmaßnahme“ jede Maßnahme, die nach Ereignissen, Handlungen oder Unterlassungen, die eine unmittelbare Gefahr eines Umweltschadens verursacht haben, getroffen wird, um diesen Schaden zu vermeiden oder zu minimieren;"},{"lvl":1,"sym":"11.","t":"„Sanierungsmaßnahme“ jede Tätigkeit oder Kombination von Tätigkeiten einschließlich mildernder und einstweiliger Maßnahmen im Sinne des Anhangs III mit dem Ziel, geschädigte natürliche Ressourcen oder beeinträchtigte Funktionen wiederherzustellen, zu sanieren oder zu ersetzen oder eine gleichwertige Alternative zu diesen Ressourcen oder Funktionen zu schaffen;"},{"lvl":1,"sym":"12.","t":"„natürliche Ressource“ geschützte Arten und natürliche Lebensräume;"},{"lvl":1,"sym":"13.","t":"„Funktionen“ und „Funktionen einer natürlichen Ressource“, die Funktionen, die eine natürliche Ressource zum Nutzen einer anderen natürlichen Ressource oder der Öffentlichkeit erfüllt;"},{"lvl":1,"sym":"14.","t":"„Ausgangszustand“ der im Zeitpunkt des Schadenseintritts bestehende Zustand der natürlichen Ressourcen und Funktionen, der bestanden hätte, wenn der Umweltschaden nicht eingetreten wäre, und der anhand der besten verfügbaren Informationen ermittelt wird;"},{"lvl":1,"sym":"15.","t":"„Wiederherstellung“ einschließlich „natürlicher Wiederherstellung“ im Falle von geschützten Arten und natürlichen Lebensräumen die Rückführung von geschädigten natürlichen Ressourcen oder beeinträchtigten Funktionen in den Ausgangszustand;"},{"lvl":1,"sym":"16.","t":"„Kosten“ im Sinne dieses Abschnittes, die durch die Notwendigkeit einer ordnungsgemäßen und wirksamen Durchführung dieses Abschnittes gerechtfertigten Kosten, einschließlich der Kosten für die Prüfung der Schädigung geschützter Arten und natürlicher Lebensräume, einer unmittelbaren Gefahr eines solchen Schadens, von alternativen Maßnahmen sowie der Verwaltungs- und Verfahrenskosten und der Kosten für die Durchsetzung der Maßnahmen, der Kosten für die Datensammlung, sonstiger anteiliger Gemeinkosten, Finanzierungskosten sowie der Kosten für Aufsicht und Überwachung."},{"lvl":0,"sym":"","t":"§ 57d"},{"lvl":0,"sym":"","t":"Ausnahmen"},{"lvl":0,"sym":"(1)","t":"Schädigungen geschützter Arten und natürlicher Lebensräume sowie die unmittelbare Gefahr solcher Schäden fallen nicht unter diesen Abschnitt, wenn sie verursacht werden durch"},{"lvl":1,"sym":"a)","t":"bewaffnete Konflikte, Feindseligkeiten, Bürgerkrieg, Aufstände oder terroristische Angriffe,"},{"lvl":1,"sym":"b)","t":"ein außergewöhnliches, unabwendbares und nicht beeinflussbares Naturereignis oder"},{"lvl":1,"sym":"c)","t":"gemäß § 57c Z 1 ermittelte nachteilige Auswirkungen, die aufgrund von Tätigkeiten eines Betreibers entstehen, die von der Behörde gemäß §§ 22 Abs. 2 oder 24b Abs. 1 bis 3 ausdrücklich genehmigt wurden."},{"lvl":0,"sym":"(2)","t":"Dieser Abschnitt gilt nicht für Schädigungen geschützter Arten und natürlicher Lebensräume und nicht für die unmittelbare Gefahr solcher Schäden, soweit diese in den Anwendungsbereich des Atomhaftungsgesetzes 1999, BGBl. I Nr. 170/1998, fallen."},{"lvl":0,"sym":"(3)","t":"Dieser Abschnitt gilt nicht für Tätigkeiten, deren Hauptzweck die Landesverteidigung oder die internationale Sicherheit ist oder für Tätigkeiten, deren alleiniger Zweck der Schutz vor Naturkatastrophen ist."},{"lvl":0,"sym":"(4)","t":"Dieser Abschnitt ist nicht auf Umweltschäden anzuwenden, wenn seit den schadensverursachenden Emissionen, Ereignissen oder Vorfällen mehr als dreißig Jahre vergangen sind."},{"lvl":0,"sym":"","t":"§ 57e"},{"lvl":0,"sym":"","t":"Vermeidungstätigkeit"},{"lvl":0,"sym":"(1)","t":"Ist eine Schädigung geschützter Arten und natürlicher Lebensräume (Umweltschaden) noch nicht eingetreten, besteht aber die unmittelbare Gefahr eines solchen Schadens, hat der Betreiber unverzüglich die erforderlichen Vermeidungsmaßnahmen zu ergreifen."},{"lvl":0,"sym":"(2)","t":"Kann eine unmittelbare Gefahr eines Umweltschadens trotz der Ergreifung der nach Abs. 1 gebotenen Vermeidungsmaßnahmen nicht abgewendet werden, hat der Betreiber unverzüglich die Behörde über alle bedeutsamen Aspekte des Sachverhalts zu verständigen."},{"lvl":0,"sym":"(3)","t":"Bestehen für die Behörde Anhaltspunkte für die Annahme, dass die unmittelbare Gefahr eines Umweltschadens bestehen könnte, ist sie berechtigt, von jedem als Verursacher in Betracht kommenden Betreiber Auskünfte über alle bedeutsamen Aspekte des Sachverhalts zu verlangen und zu diesem Zweck auch Liegenschaften und Anlagen durch ihre Organe zu betreten, zu untersuchen und Proben zu entnehmen. Die Aufsichts-, Kontroll- und Untersuchungsbefugnisse nach anderen Verwaltungsvorschriften bleiben unberührt."},{"lvl":0,"sym":"(4)","t":"Wenn die zur Abwendung der unmittelbaren Gefahr eines Umweltschadens erforderlichen Maßnahmen nicht, nicht ausreichend oder nicht rechtzeitig getroffen werden, so hat die Behörde dem Betreiber die entsprechenden Maßnahmen aufzutragen oder bei Gefahr im Verzug unmittelbar anzuordnen und gegen Ersatz der Kosten durch den Betreiber nötigenfalls unverzüglich durchführen zu lassen."},{"lvl":0,"sym":"(5)","t":"Maßnahmen, die Gegenstand einer behördlichen Anordnung oder eines behördlichen Auftrages gemäß Abs. 4 sind, bedürfen keiner Bewilligung nach anderen landesrechtlichen Vorschriften. § 60 findet sinngemäß Anwendung."},{"lvl":0,"sym":"(6)","t":"Fällt die unmittelbare Gefahr eines Umweltschadens in den Anwendungsbereich dieses Abschnittes, gelten die vorerst nach anderen Umweltvorschriften des Landes ergriffenen behördlichen Maßnahmen zur Vermeidung der Gefahr als Maßnahmen im Sinne dieser Bestimmung."},{"lvl":0,"sym":"","t":"§ 57f"},{"lvl":0,"sym":"","t":"Sanierungstätigkeit"},{"lvl":0,"sym":"(1)","t":"Ist eine Schädigung geschützter Arten und natürlicher Lebensräume eingetreten, so hat der Betreiber, ungeachtet einer allenfalls nach § 57e Abs. 2 erfolgten Verständigung, unverzüglich"},{"lvl":1,"sym":"a)","t":"die zuständige Behörde über alle bedeutsamen Aspekte des Sachverhalts zu informieren,"},{"lvl":1,"sym":"b)","t":"alle erforderlichen Vorkehrungen zu treffen, um die betreffenden Schadstoffe und ihre Schadfaktoren unverzüglich zu kontrollieren, einzudämmen, zu beseitigen oder auf sonstige Weise zu behandeln, um weitere Schädigungen geschützter Arten und natürlicher Lebensräume und weitere Beeinträchtigungen von Funktionen hintanzuhalten, und"},{"lvl":1,"sym":"c)","t":"die erforderlichen Sanierungsmaßnahmen gemäß § 57g zu ergreifen."},{"lvl":0,"sym":"(2)","t":"Bestehen für die Behörde Anhaltspunkte für die Annahme, dass eine Schädigung geschützter Arten und natürlicher Lebensräume eingetreten sein könnte, kann sie, von jedem als Verursacher in Betracht kommenden Betreiber alle zur Beurteilung der Situation erforderlichen Auskünfte verlangen und zu diesem Zweck auch Liegenschaften und Anlagen durch ihre Organe betreten, untersuchen und Proben entnehmen. Die Aufsichts-, Kontroll- und Untersuchungsbefugnisse nach anderen Verwaltungsvorschriften bleiben unberührt."},{"lvl":0,"sym":"(3)","t":"Ist eine Schädigung geschützter Arten und natürlicher Lebensräume eingetreten und werden Vorkehrungen gemäß Abs. 1 lit. b oder Sanierungsmaßnahmen gemäß Abs. 1 lit. c nicht, nicht ausreichend oder nicht rechtzeitig getroffen, so hat die Behörde dem Betreiber die entsprechenden Vorkehrungen oder Maßnahmen aufzutragen oder bei Gefahr im Verzug unmittelbar anzuordnen und gegen Ersatz der Kosten durch den Betreiber nötigenfalls unverzüglich durchführen zu lassen."},{"lvl":0,"sym":"(4)","t":"§ 57e Abs. 5 ist auf Abs. 3 anzuwenden."},{"lvl":0,"sym":"","t":"§ 57g"},{"lvl":0,"sym":"","t":"Bestimmung von Sanierungsmaßnahmen"},{"lvl":0,"sym":"(1)","t":"Ist eine Schädigung geschützter Arten und natürlicher Lebensräume (Umweltschaden) eingetreten, hat der Betreiber mögliche Sanierungsmaßnahmen gemäß Anhang III zu ermitteln. Der Betreiber hat der Behörde die vorgesehenen Sanierungsmaßnahmen anzuzeigen, es sei denn, die Behörde ist bereits gemäß § 57f Abs. 3 tätig geworden."},{"lvl":0,"sym":"(2)","t":"Sind die gemäß Abs. 1 zweiter Satz angezeigten Maßnahmen nach Auffassung der Behörde nicht ausreichend, um die betreffenden Schadstoffe oder ihre Schadfaktoren unverzüglich zu kontrollieren, einzudämmen, zu beseitigen oder auf sonstige Weise zu behandeln und um weitere Umweltschäden oder eine weitere Beeinträchtigung von Funktionen hintanzuhalten, so hat die Behörde dem Betreiber die gemäß Anhang III erforderlichen Maßnahmen aufzutragen. Solche Maßnahmen können auch über die von der Behörde nach § 57e Abs. 4 oder nach § 57f Abs. 3 getroffenen Anordnungen hinausgehen, wenn dies zur Erreichung der in Anhang III festgelegten Ziele erforderlich ist."},{"lvl":0,"sym":"(3)","t":"Die Behörde hat den wesentlichen Inhalt der angezeigten und der von ihr angeordneten Sanierungsmaßnahmen entsprechend zu veröffentlichen. Sie hat bekannte Beteiligte (Betroffene) tunlichst persönlich zu informieren und rechtzeitig eingelangte Stellungnahmen zu berücksichtigen."},{"lvl":0,"sym":"(4)","t":"§ 57e Abs. 5 ist auf Abs. 2 anzuwenden."},{"lvl":0,"sym":"(5)","t":"Sind mehrere Schädigungen geschützter Arten und natürlicher Lebensräume in der Weise eingetreten, dass die Behörde nicht gewährleisten kann, dass die erforderlichen Sanierungsmaßnahmen gleichzeitig ergriffen werden, so hat die Behörde zu entscheiden, welcher Schaden zuerst zu sanieren ist. Dabei hat sie insbesondere Art, Ausmaß und Schwere der einzelnen Schadensfälle und Risiken sowie die Möglichkeit der Rückführung natürlicher Lebensräume und geschützter Arten in den jeweiligen Ausgangszustand durch den natürlichen Lauf der Dinge zu berücksichtigen."},{"lvl":0,"sym":"(6)","t":"Fällt ein Umweltschaden in den Anwendungsbereich dieses Abschnittes, gelten die vorerst nach anderen Umweltvorschriften des Landes ergriffenen behördlichen Maßnahmen zur Verringerung oder Vermeidung der Gefahr als Maßnahmen im Sinne dieser Bestimmung."}]},{"id":"57h","title":"","body":[{"lvl":0,"sym":"(1)","t":"Soweit in den folgenden Abs. nichts anderes bestimmt wird, hat der Betreiber sämtliche sich aus § 57c Z 16 ergebenden Kosten der nach diesem Abschnitt durchgeführten Vermeidungs- und Sanierungstätigkeiten zu tragen, unter Einschluss der Kosten von Verfahren vor dem Landesverwaltungsgericht, in denen er unterlegen ist. Die Landesregierung darf, im Interesse der Vereinfachung der Ermittlung und unter Berücksichtigung der entsprechenden bundesrechtlichen Bestimmungen, mit Verordnung nähere Bestimmungen für die zu erstattenden Verwaltungs- und Verfahrenskosten, Kosten für die Durchsetzung der Maßnahmen und sonstigen Gemeinkosten festlegen."},{"lvl":0,"sym":"(2)","t":"Sind von der Behörde Vermeidungs- und Sanierungsmaßnahmen gegen Ersatz der Kosten durch den Betreiber durchführen zu lassen, hat die Behörde dem Betreiber zugleich die Stellung einer dinglichen Sicherheit oder anderer geeigneter Garantien in der Höhe des geschätzten Aufwands vorzuschreiben, der bei der Behörde voraussichtlich anfallen wird. Die Vorschreibung ist aufzuheben, wenn der Verpflichtete einen Nachweis im Sinne des Abs. 3 erbringt. Ansonsten ist die Sicherheit mit dem Wirksamwerden der Kostentragung beim Land gegen die Kostenvorschreibung zu verrechnen."},{"lvl":0,"sym":"(3)","t":"Der Betreiber hat die Kosten der Vermeidungs- und Sanierungstätigkeit nicht zu tragen, wenn er nachweist, dass der Umweltschaden oder die unmittelbare Gefahr des Schadens"},{"lvl":1,"sym":"a)","t":"durch einen Dritten (das sind Personen, die weder im Auftrag des Betreibers tätig sind noch die Einrichtungen, mit denen die Tätigkeit ausgeübt wird, entsprechend ihrer Bestimmung in Anspruch nehmen) verursacht wurden und eingetreten sind, obwohl geeignete Sicherheitsvorkehrungen getroffen wurden und er weiters nachweist, dass bei Nichtvorliegen sämtlicher Voraussetzungen für die Anwendung dieses Abschnittes im Sinne des § 57b Abs. 1 auch kein Fall der Wiederherstellung gemäß § 57 vorliegt, oder"},{"lvl":1,"sym":"b)","t":"auf die Befolgung von Aufträgen oder Anordnungen einer Behörde zurückzuführen sind, sofern es sich nicht um Aufträge oder Anordnungen infolge von Emissionen oder Vorfällen handelt, die durch die eigene Tätigkeit des Betreibers verursacht wurden."},{"lvl":0,"sym":"","t":"Der Betreiber hat unter denselben Voraussetzungen Anspruch auf Ersatz der ihm für die erforderlichen Vermeidungs- und Sanierungsmaßnahmen erwachsenen Kosten. Über Ansprüche nach diesem Absatz entscheidet die Behörde mit Bescheid."},{"lvl":0,"sym":"(4)","t":"Kostentragungspflichten nach den Absätzen 1 bis 3 gehen in Fällen gesellschaftlicher Gesamtrechtsnachfolge auf den Rechtsnachfolger über."},{"lvl":0,"sym":"(5)","t":"Können die Kosten nach den Absätzen 1 bis 4 bei dem zur Kostentragung Verpflichteten nicht hereingebracht werden, dann kann zur Kostentragung der Eigentümer (jeder Miteigentümer) der Liegenschaft, von der die Schädigung ausgeht, verpflichtet werden, sofern er den Anlagen oder Maßnahmen von denen die Schädigung ausgeht, zugestimmt oder sie freiwillig geduldet und ihm zumutbare Abwehrmaßnahmen unterlassen hat. Dies gilt auch für Rechtsnachfolger des Liegenschaftseigentümers, wenn sie von den Anlagen oder Maßnahmen, von denen die Schädigung ausgeht, Kenntnis hatten oder bei gehöriger Aufmerksamkeit Kenntnis haben mussten."},{"lvl":0,"sym":"(6)","t":"Die Befugnis einer nach den Absätzen 1 bis 5 zur Kostentragung herangezogenen Person, ihren eigenen Aufwand gegenüber Dritten vor den ordentlichen Gerichten geltend zu machen, bleibt unberührt."},{"lvl":0,"sym":"(7)","t":"Das Land hat in verwaltungsbehördlichen Verfahren betreffend Kosten und Ersätze nach den Absätzen 1 bis 6 Parteistellung."}]},{"id":"57i","title":"","body":[{"lvl":0,"sym":"(1)","t":"Für die in diesem Abschnitt vorgesehenen Maßnahmen ist die Bezirksverwaltungsbehörde zuständig, in deren örtlichem Wirkungsbereich die Vermeidungs- oder Sanierungsmaßnahmen zu ergreifen waren oder zu ergreifen gewesen wären."},{"lvl":0,"sym":"(2)","t":"Der zuständigen Behörde obliegt es"},{"lvl":1,"sym":"a)","t":"festzustellen, welcher Betreiber den Umweltschaden oder die unmittelbare Gefahr eines Schadens verursacht hat,"},{"lvl":1,"sym":"b)","t":"die Erheblichkeit des Schadens zu ermitteln und"},{"lvl":1,"sym":"c)","t":"zu bestimmen, welche Sanierungsmaßnahmen gemäß Anhang III zu treffen sind."},{"lvl":0,"sym":"","t":"Zu diesen Zwecken ist die zuständige Behörde befugt, von dem betreffenden Betreiber die Durchführung einer eigenen Bewertung und die Bereitstellung aller erforderlichen Informationen und personenbezogenen Daten zu verlangen."},{"lvl":0,"sym":"(3)","t":"Soweit behördliche Entscheidungen über Vermeidungs- oder Sanierungsmaßnahmen nicht mit Bescheid ergehen, ist der Betreiber, auf dessen Kosten die Maßnahmen ergriffen werden, auf Verlangen über die Gründe und die offen stehenden Rechtsbehelfe zu belehren."}]},{"id":"57j","title":"","body":[{"lvl":0,"sym":"(1)","t":"Natürliche und juristische Personen, die durch eine Schädigung geschützter Arten oder natürlicher Lebensräume (Umweltschaden)"},{"lvl":1,"sym":"1.","t":"in ihrer Gesundheit geschädigt oder in ihrem Eigentum oder sonstigen Rechten an einer betroffenen Liegenschaft – nicht jedoch durch bloße Minderung des Verkehrswertes – verletzt werden können, oder"},{"lvl":1,"sym":"2.","t":"dadurch betroffen sind, dass sie in der Nutzung der natürlichen Ressource oder in der Nutzung der Funktion der betreffenden natürlichen Ressource erheblich eingeschränkt werden können, oder"},{"lvl":1,"sym":"3.","t":"ein ausreichendes Interesse an einem Verfahren gemäß § 57f und § 57g Abs. 2 haben,"},{"lvl":0,"sym":"","t":"können die Bezirksverwaltungsbehörde, in deren örtlichem Wirkungsbereich der behauptete Umweltschaden eingetreten ist, in einer schriftlichen Beschwerde dazu auffordern, im Sinne der §§ 57f und 57g Abs. 2 tätig zu werden."},{"lvl":0,"sym":"(2)","t":"Ein ausreichendes Interesse im Sinne des Abs. 1 Z 3 haben:"},{"lvl":1,"sym":"1.","t":"Personen, die eine Rechtverletzung geltend machen;"},{"lvl":1,"sym":"2.","t":"Personen, die durch einen Umweltschaden unmittelbar betroffen sind;"},{"lvl":1,"sym":"3.","t":"der Naturschutzbeirat als Umweltanwalt (§ 61 Abs. 4);"},{"lvl":1,"sym":"4.","t":"Umweltorganisationen gemäß § 54a Abs. 1."},{"lvl":0,"sym":"(3)","t":"In der Umweltbeschwerde ist unter Beifügung der sachlichen Informationen und personenbezogenen Daten das Vorliegen der Voraussetzungen gemäß Abs. 1 oder 2 glaubhaft zu machen. Sofern sie nicht selbst zuständig ist, hat die angerufene Bezirksverwaltungsbehörde diese Beschwerde unverzüglich an die nach § 57i zuständige Bezirksverwaltungsbehörde weiterzuleiten und den Beschwerdeführer davon zu unterrichten."},{"lvl":0,"sym":"(4)","t":"Gelangt die Behörde zur Auffassung, dass"},{"lvl":1,"sym":"a)","t":"keine Beschwerdeberechtigung im Sinne der Abs. 1 und 2 gegeben ist,"},{"lvl":1,"sym":"b)","t":"kein Umweltschaden vorliegt, oder"},{"lvl":1,"sym":"c)","t":"alle erforderlichen Vorkehrungen oder Sanierungsmaßnahmen bereits getroffen wurden,"},{"lvl":0,"sym":"","t":"so ist hierüber ein Bescheid zu erlassen."}]},{"id":"57k","title":"","body":[{"lvl":0,"sym":"","t":"In den Verfahren gemäß § 57f und § 57g Abs. 2 haben - neben dem Betreiber – Parteistellung:"},{"lvl":1,"sym":"a)","t":"Personen gemäß § 57j Abs. 1 und Organisationen gemäß § 57j Abs. 2, die eine Umweltbeschwerde eingebracht haben;"},{"lvl":1,"sym":"b)","t":"jene in § 57j Abs. 1 genannten Personen und jene im § 57j Abs. 2 genannten Organisationen, die innerhalb von zwei Wochen nach Veröffentlichung gemäß § 57g Abs. 3 schriftlich erklärt haben, dass sie am Verfahren als Partei teilnehmen wollen."}]},{"id":"57l","title":"","body":[{"lvl":0,"sym":"(1)","t":"Gegen Bescheide, die in Anwendung dieses Abschnittes erlassen werden, steht den Parteien des verwaltungsbehördlichen Verfahrens das Recht zur Erhebung der Beschwerde an das Landesverwaltungsgericht zu."},{"lvl":0,"sym":"(2)","t":"Das Land ist berechtigt, gegen behördliche Entscheidungen über Kosten und Ersätze nach diesem Abschnitt Beschwerde an das Landesverwaltungsgericht zu erheben."},{"lvl":0,"sym":"","t":"§ 57m"},{"lvl":0,"sym":"","t":"Grenzüberschreitende Umweltschäden"},{"lvl":0,"sym":"(1)","t":"Ist eine Schädigung geschützter Arten und natürlicher Lebensräume eingetreten, die Auswirkungen auf das Gebiet eines anderen Bundeslandes oder eines anderen Mitgliedstaats der Europäischen Union haben kann, hat die Behörde die zuständige Behörde des anderen Bundeslandes oder den anderen Mitgliedstaat zu unterrichten."},{"lvl":0,"sym":"(2)","t":"Stellt die Behörde eine Schädigung geschützter Arten oder natürlicher Lebensräume fest, die außerhalb von Kärnten verursacht wurde, kann sie dies gegenüber der zuständigen Behörde des in Betracht kommenden Bundeslandes oder der Europäischen Kommission und den in Betracht kommenden anderen Mitgliedstaaten der Europäischen Union melden und gegenüber den in Betracht kommenden Bundesländern oder gegenüber diesen Mitgliedstaaten im Wege des Bundes die beim Land Kärnten anfallenden Kosten für Vermeidungs- und Sanierungsmaßnahmen geltend machen."},{"lvl":0,"sym":"(3)","t":"Bei grenzüberschreitenden Umweltschäden haben die Behörden, in deren Amtssprengel die Schädigung geschützter Arten und natürlicher Lebensräume oder die unmittelbare Gefahr eines solchen Schadens in Kärnten wirksam geworden ist, mit den zuständigen Behörden des in Betracht kommenden Bundeslandes oder der in Betracht kommenden anderen Mitgliedstaaten der Europäischen Union – einschließlich in Form eines angemessenen Informationsaustausches – zusammenzuarbeiten, um zu gewährleisten, dass Vermeidungs- und erforderlichenfalls Sanierungstätigkeiten hinsichtlich eines solchen Schadens durchgeführt werden."},{"lvl":0,"sym":"(4)","t":"Besondere staatsvertragliche Regelungen bleiben unberührt."}]}]},{"nr":12,"title":"XII. Abschnitt | Organisation","paras":[{"id":"58","title":"","body":[{"lvl":0,"sym":"(1)","t":"Sofern in diesem Gesetz nichts anderes bestimmt wird, obliegt die Besorgung der behördlichen Aufgaben nach diesem Gesetz der Bezirksverwaltungsbehörde."},{"lvl":0,"sym":"(2)","t":"Der Landesregierung obliegt die Wahrnehmung"},{"lvl":1,"sym":"1.","t":"der Aufgaben der wissenschaftlichen Behörde gemäß der Verordnung (EG) Nr. 338/1997 und"},{"lvl":1,"sym":"2.","t":"der Nichtigkeitsgründe gemäß § 8 Abs. 2 Kärntner Raumordnungsgesetz 2021."}]},{"id":"59","title":"","body":[{"lvl":0,"sym":"(1)","t":"Die Landesregierung hat durch entsprechende Hinweistafeln für die Kennzeichnung von Naturschutzgebieten, Europaschutzgebieten, Landschaftsschutzgebieten, Naturparks oder besonders geschützten Naturhöhlen an geeigneten Stellen, insbesondere an öffentlichen Zugängen, zu sorgen. Ist eine Kennzeichnung durch Hinweistafeln nicht tunlich oder möglich, hat die Kennzeichnung in anderer zweckmäßiger Weise zu erfolgen."},{"lvl":0,"sym":"(1a)","t":"Abs. 1 gilt für Naturdenkmale oder Gebiete, in denen das Baden verboten ist, mit der Maßgabe, dass an die Stelle der Landesregierung die Bezirksverwaltungsbehörde tritt."},{"lvl":0,"sym":"(2)","t":"Die Hinweistafeln oder anderen Kennzeichnungsmaßnahmen im Sinne der Abs. 1 und 1a können die Bezeichnung des geschützten Objekts und eine Darstellung des Kärntner Landeswappens enthalten. Weiters können auf diesen Tafeln auch nähere Hinweise auf die Schutzbestimmungen gegeben werden. Nähere Bestimmungen über das Aussehen von Hinweistafeln kann die Landesregierung durch Verordnung verfügen."}]},{"id":"60","title":"","body":[{"lvl":0,"sym":"(1)","t":"Den mit den Aufgaben des Schutzes und der Pflege der Natur oder mit der Vornahme von Erhebungen in der Natur betrauten behördlichen Organen sowie damit behördlich beauftragten Organen und den Mitgliedern des Naturschutzbeirates ist zur Wahrnehmung der Vollziehung dieses Gesetzes und der auf Grund dieses Gesetzes erlassenen Verordnungen ungehinderter Zutritt zu den in Betracht kommenden Grundstücken, ausgenommen Wohnungen sowie sonstige zum Hauswesen gehörige Räumlichkeiten, zu gewähren. Organe in behördlicher Vollziehung sind überdies befugt, Wege, sofern sie zur Benützung geeignet sind, auch durch Befahrung zu benützen. Sie haben dabei allenfalls bestehende Sicherheitsvorschriften für das betreffende Grundstück oder die betreffende Anlage zu beachten."},{"lvl":0,"sym":"(2)","t":"Die nach Abs. 1 berechtigten Organe sind verpflichtet, sich auf Verlangen gegenüber dem Grundstückseigentümer oder sonstigen über ein Grundstück Verfügungsberechtigten auszuweisen, und sie sind zur Wahrung von Betriebs- und Geschäftsgeheimnissen verpflichtet."},{"lvl":0,"sym":"(3)","t":"Jedermann ist verpflichtet, den im Abs. 1 genannten Organen auf deren Verlangen Auskünfte im Rahmen amtlicher Erhebungen in Vollziehung dieses Gesetzes oder der auf Grund dieses Gesetzes erlassenen Verordnungen zu erteilen."}]},{"id":"61","title":"","body":[{"lvl":0,"sym":"(1)","t":"Zur Beratung der Landesregierung in grundsätzlichen Fragen des Schutzes und der Pflege der Natur wird beim Amt der Landesregierung ein Naturschutzbeirat eingerichtet."},{"lvl":0,"sym":"(2)","t":"Der Beirat ist von der Landesregierung jedenfalls vor der Erlassung von von ihr zu beschließenden Verordnungen nach diesem Gesetz zu hören."},{"lvl":0,"sym":"(2a)","t":"Die Organe des Landes, der Gemeinden und der Gemeindeverbände haben den Naturschutzbeirat im Rahmen seiner Tätigkeit als Umweltanwalt bei der Erfüllung seiner Aufgaben durch Gewährung der erforderlichen Auskünfte und der erforderlichen Einsicht in Akten zu unterstützen. Der Naturschutzbeirat kann, soweit dies zur Erfüllung seiner Aufgaben erforderlich ist, andere Personen oder Einrichtungen sowie die Organe des Bundes um schriftliche oder mündliche Stellungnahme ersuchen."},{"lvl":0,"sym":"(3)","t":"Der Naturschutzbeirat darf gegen Bescheide, vor deren Erlassung seine Mitglieder gemäß § 54 Abs. 1 zu hören sind, Beschwerde an das Landesverwaltungsgericht und gegen die Entscheidung des Landesverwaltungsgerichtes Revision an den Verwaltungsgerichtshof gemäß Art. 133 Abs. 8 B-VG erheben, insoweit diese im Rahmen der Anhörung Einwendungen vorgebracht haben, denen im Bescheid der Behörde oder in der Entscheidung des Landesverwaltungsgerichtes nicht Rechnung getragen wurde. Die Frist für die Erhebung der Beschwerde bzw. Revision beginnt an dem Tag zu laufen, an dem alle Mitglieder Kenntnis vom Inhalt des Bescheides bzw. der Entscheidung erlangt haben."},{"lvl":0,"sym":"(4)","t":"Der Naturschutzbeirat ist dazu berufen, die in Bundesgesetzen dem Umweltanwalt eingeräumten Rechte wahrzunehmen."},{"lvl":0,"sym":"(5)","t":"Die Landesregierung hat nach Anhörung des Naturschutzbeirats einen hauptamtlichen Leiter der Geschäftsstelle des Naturschutzbeirats (Geschäftsstellenleiter) auf die Dauer von fünf Jahren zu bestellen. Er bleibt bis zur Bestellung eines Nachfolgers bzw. Wiederbestellung im Amt. Eine Wiederbestellung ist zulässig. Die Landesregierung hat den Geschäftsstellenleiter längstens innerhalb von sechs Monaten nach Ablauf der Funktionsperiode neu zu bestellen. Der Geschäftsstellenleiter muss rechtskundig sein. Er ist bei der Wahrnehmung seiner Aufgaben als Geschäftsstellenleiter nur an die Weisungen des Naturschutzbeirats (Umweltanwalts) gebunden. Er wird durch den Leiter der für die rechtlichen Angelegenheiten des Naturschutzes zuständigen Organisationseinheit des Amtes der Landesregierung vertreten. Im Falle der Stellvertretung gilt der vierte Satz auch für den Stellvertreter."},{"lvl":0,"sym":"(6)","t":"Der Geschäftsstellenleiter des Naturschutzbeirats ist durch die Landesregierung von seiner Funktion abzuberufen, wenn er seine Pflichten grob verletzt oder vernachlässigt oder die geistige oder körperliche Eignung nicht mehr gegeben ist."},{"lvl":0,"sym":"(7)","t":"Der Geschäftsstellenleiter des Naturschutzbeirats unterliegt der Aufsicht der Landesregierung. Die Landesregierung hat das Recht, sich über alle Gegenstände der Tätigkeit des Geschäftsstellenleiters zu unterrichten. Der Geschäftsstellenleiter ist verpflichtet, der Landesregierung die im Rahmen dieses Aufsichtsrechts verlangten Auskünfte zu erteilen."}]},{"id":"62","title":"","body":[{"lvl":0,"sym":"(1)","t":"Dem Naturschutzbeirat gehören an:"},{"lvl":1,"sym":"a)","t":"das mit den Angelegenheiten des Naturschutzes betraute Mitglied der Landesregierung oder ein von ihm bestellter Vertreter als Vorsitzender;"},{"lvl":1,"sym":"b)","t":"fünf von der Landesregierung auf Grund von Vorschlägen von Naturschutzorganisationen im Land zu bestellende Mitglieder, die über ein entsprechendes Fachwissen auf dem Gebiet des Schutzes und der Pflege der Natur und Umwelt verfügen; ein Mitglied muss eine selbstständige land- und forstwirtschaftliche Erwerbstätigkeit hauptberuflich ausüben."},{"lvl":0,"sym":"(1a)","t":"Als Naturschutzorganisationen im Sinne des Abs. 1 lit. b gelten gemeinnützige Vereinigungen,"},{"lvl":1,"sym":"1.","t":"zu deren satzungsgemäßen Aufgaben der Natur- und Umweltschutz gehört;"},{"lvl":1,"sym":"2.","t":"die ihren Sitz im Land Kärnten haben oder hier eine eigene Landesorganisation besitzen;"},{"lvl":1,"sym":"3.","t":"deren Tätigkeit sich jedenfalls auf das ganze Gebiet des Landes erstreckt und"},{"lvl":1,"sym":"4.","t":"die in Kärnten mindestens einen Stand von 200 Mitgliedern aufweisen."},{"lvl":0,"sym":"(2)","t":"Die Bestellung der Mitglieder im Sinne des Abs. 1 lit. b erfolgt jeweils auf die Dauer von fünf Jahren. Sie bleiben bis zur Bestellung eines Nachfolgers bzw. Wiederbestellung im Amt. Die Landesregierung hat die Mitglieder längstens innerhalb von sechs Monaten nach Ablauf der Funktionsperiode neu zu bestellen. Für jedes dieser Mitglieder ist ein Ersatzmitglied zu bestellen, das für den Fall der Verhinderung des Mitgliedes dessen Aufgaben wahrzunehmen hat. Für den Fall der dauernden Verhinderung eines Mitgliedes (Ersatzmitgliedes) ist für die restliche Dauer der fünfjährigen Funktionsperiode der nach Abs. 1 lit. b bestellten Mitglieder ein neues Mitglied (Ersatzmitglied) zu bestellen."},{"lvl":0,"sym":"(3)","t":"Der Naturschutzbeirat kann
