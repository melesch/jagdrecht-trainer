dernisses nach Abs. 1 und 2 – begonnen werden."},{"lvl":0,"sym":"(6)","t":"Der Bezirksjägermeister hat die Beseitigung einer Rehwild-, Muffelwild- oder Rotwildfütterungsanlage dem Jagdausübungsberechtigten binnen angemessen festzusetzender Frist aufzutragen, wenn sie vor Wirksamkeit der Anzeige oder abweichend von der Anzeige errichtet wurden oder wenn nachträglich Untersagungsgründe (Abs. 5) eintreten."},{"lvl":0,"sym":"(7)","t":"Abseits von den zur allgemeinen Benützung bestimmten Straßen und Wegen, einschließlich der örtlich üblichen Wanderwege, sowie abseits von zur allgemeinen Benützung bestimmten Schipisten, Schitourenrouten und Loipen ist Unbefugten das Betreten eines Bereiches im Umkreis von 400 m um eine beschickte Rotwildfütterungsanlage untersagt. § 70 Abs. 3 gilt sinngemäß."}]},{"id":"64","title":"Jägernotweg","body":[{"lvl":0,"sym":"(1)","t":"Wenn der Jagdausübungsberechtigte und die von ihm in seinem Jagdbetrieb verwendeten Personen ein Jagdgebiet nicht auf einem öffentlichen oder zum allgemeinen Gebrauch bestimmten Weg oder nur auf einem unverhältnismäßig langen oder beschwerlichen Umweg erreichen können, so hat die Bezirksverwaltungsbehörde nach Anhörung des Bezirksjägermeisters - mangels eines Übereinkommens der beteiligten Jagdausübungsberechtigten - einen Weg (Jägernotweg) zu bestimmen, auf welchem diesen Personen sowie deren Jagdgästen das Durchqueren des fremden Jagdgebietes gestattet ist. Bei Benützung des Jägernotweges dürfen Schußwaffen nur ungeladen bzw. gebrochen, Hunde nur an der Leine und Beizvögel nur gesichert mitgeführt werden."},{"lvl":0,"sym":"(1a)","t":"Anläßlich der Feststellung der Jagdgebiete (§ 9) hat die Bezirksverwaltungsbehörde nach Anhörung des Bezirksjägermeisters auf Antrag des begünstigten Jagdausübungsberechtigten festzustellen, ob die Voraussetzungen des Abs. 1 für diese Einräumung eines Jägernotweges weiterhin gegeben sind, und bejahendenfalls auszusprechen, daß der Jägernotweg bis zur nächsten Jagdgebietsfeststellung weiterhin als eingeräumt gilt."},{"lvl":0,"sym":"(2)","t":"Der Eigentümer des Grundstückes, über das der Jägernotweg führt, kann eine angemessene Entschädigung beanspruchen. Kommt über das Ausmaß der Entschädigung zwischen dem Jagdausübungsberechtigten und dem Grundeigentümer keine Einigung zustande, so gelten für die Ermittlung und Festsetzung der Entschädigung die Bestimmungen der §§ 46 bis 48 der Kärntner Gefahrenpolizei- und Feuerpolizeiordnung 2000, LGBl. Nr. 67/2000, in der geltenden Fassung, mit der Maßgabe, dass für das Verwaltungsverfahren die Bezirksverwaltungsbehörde zuständig ist."}]},{"id":"65","title":"Krankgeschossenes Wild, Wildfolge","body":[{"lvl":0,"sym":"(1)","t":"Krankgeschossenes oder auch nur vermutlich getroffenes Wild, das in ein fremdes Jagdgebiet überwechselt, oder Federwild, das dorthin abstreicht, darf dort vom Schützen nicht weiter bejagt werden; seine Verfolgung, Erlegung und Besitznahme bleibt vielmehr dem Jagdausübungsberechtigten des Gebietes, in dem sich das Wild befindet, vorbehalten."},{"lvl":0,"sym":"(2)","t":"Der Schütze hat die Anschußstelle, die Fluchtrichtung und nach Möglichkeit auch die Stelle, an der das Wild über die Grenze geflüchtet ist, kenntlich zu machen; er ist verpflichtet, für die eheste Verständigung der verfügungsberechtigten Jagdnachbarn Sorge zu tragen und sich selbst oder eine mit den Vorgängen vertraute Person für die Nachsuche zur Verfügung zu stellen."},{"lvl":0,"sym":"(3)","t":"Wird bei der Nachsuche auf Schalenwild das Wild zustandegebracht, so bleibt zwar dem Jagdausübungsberechtigten des Gebietes, in dem das Wild gefallen ist, der Anspruch auf das Wildbret gewahrt, das Recht auf die Trophäe steht jedoch dem Schützen zu. Wird die Nachsuche aufgegeben, so fällt die Trophäe dem Jagdausübungsberechtigten des Gebietes zu, in dem das Wild gefallen ist. Die Nachsuche gilt nicht als aufgegeben, wenn sie wegen Dunkelheit oder aus anderen wichtigen Gründen abgebrochen, jedoch am folgenden Morgen ohne Verzug wieder aufgenommen wird."},{"lvl":0,"sym":"(4)","t":"Die Verfolgung krankgeschossenen oder auch nur vermutlich getroffenen Wildes auf fremden Jagdgebieten (Wildfolge) ist nur auf Grund einer besonderen schriftlichen Vereinbarung zulässig, in welcher festgelegt wird, welche Befugnisse sich die Jagdausübungsberechtigten benachbarter Jagdgebiete im Falle des Überwechselns von krankgeschossenem oder vermutlich getroffenem Wild gegenseitig einräumen. Wurde lediglich Wildfolge vereinbart, ohne daß die Befugnisse der Jagdausübungsberechtigten im einzelnen festgelegt wurden, so gelten nachstehende Vorschriften:"},{"lvl":1,"sym":"a)","t":"Verendet krankgeschossenes Wild nicht in Sichtweite des Schützen über der Grenze, so hat dieser nach den Vorschriften des Abs. 2 vorzugehen;"},{"lvl":1,"sym":"b)","t":"verendet Schalenwild in Sichtweite über der Grenze, so hat der Erleger das Wild auf der Stelle aufzubrechen und zu versorgen und ist verpflichtet, den Verfügungsberechtigten ohne Verzug zu benachrichtigen;"},{"lvl":1,"sym":"c)","t":"anderes als in lit. b angeführtes in Sichtweite verendetes Wild kann der Schütze fortschaffen;"},{"lvl":1,"sym":"d)","t":"beim Überschreiten der Grenze darf die Schußwaffe nicht mitgeführt werden."},{"lvl":0,"sym":"(5)","t":"Wildfolge ist ohne Vereinbarung in Gebieten zulässig, auf denen die Jagd ruht. Der Eigentümer oder dessen Bevollmächtigter ist vorher zu benachrichtigen."}]},{"id":"66","title":"Wildseuchen","body":[{"lvl":0,"sym":"","t":"Der Jagdausübungsberechtigte ist verpflichtet, Wahrnehmungen über das Auftreten und den Verdacht von Wildseuchen unverzüglich der Bezirksverwaltungsbehörde und dem Bezirksjägermeister zu melden."}]},{"id":"67","title":"Jagdhunde","body":[{"lvl":0,"sym":"(1)","t":"Für jedes Jagdgebiet hat der Jagdausübungsberechtigte oder sein Jagdschutzorgan einen nachweislich brauchbaren Jagdhund zu halten oder nachzuweisen, dass ihm ein solcher jederzeit zur Verfügung steht."},{"lvl":0,"sym":"(2)","t":"Für jedes Jagdgebiet über 2000 ha muß vom Jagdausübungsberechtigten oder dessen Jagdschutzorgan ein geprüfter Schweißhund oder ein auf der Schweißfährte geprüfter Gebrauchshund gehalten werden. Sind mehrere benachbarte Jagdgebiete in einer Hand vereinigt, so ist das gesamte Flächenausmaß dieser Jagdgebiete für das Halten eines solchen Hundes entscheidend."},{"lvl":0,"sym":"(3)","t":"Jagdhunde müssen jene Eigenschaften besitzen, die erforderlich sind, um einen geordneten Jagdbetrieb, soweit ein solcher nur unter Heranziehung von Jagdhunden gewährleistet ist, sicherzustellen. Der Nachweis der jagdlichen Brauchbarkeit ist durch eine jagdliche Leistungsprüfung nach der Prüfungsordnung eines vom österreichischen Jagdgebrauchshundeverbandes (ÖJGV) anerkannten Zucht- oder Prüfungsvereines zu erbringen."}]},{"id":"68","title":"Verbotene Jagdmethoden, Beschränkungen der Jagdausübung","body":[{"lvl":0,"sym":"(1)","t":"Es ist verboten:"},{"lvl":1,"sym":"1.","t":"bei der Jagdausübung Schußwaffen und Munition zu benützen, die nicht für die Verwendung bei der Jagd auf Wild bestimmt sind und sich nicht in einwandfreiem, dem Zweck entsprechendem Zustand befinden; halbautomatische Kugel- oder Schrotjagdwaffen, deren Magazin mehr als zwei Patronen aufnehmen kann, vollautomatische Waffen, Luftdruckwaffen, Zimmerstutzen, ferner Schußwaffen, die über das für Jagdzwecke übliche Maß hinaus zum Zusammenklappen, Zusammenschieben, Verkürzen oder schleunigen Zerlegen eingerichtet sind, Faustfeuerwaffen und Gewehre, deren Aussehen mit der Absicht, sie als Gewehr unkenntlich zu machen, verändert ist, dürfen zur Jagdausübung jedenfalls nicht verwendet werden;"},{"lvl":1,"sym":"2.","t":"mit Posten, gehacktem Blei, Bolzen oder Pfeilen auf Wild zu schießen; auf Schalenwild und Murmeltiere ist darüber hinaus auch der Schrotschuß verboten; der Fangschuß mit der Faustfeuerwaffe und der Fangschuß mit Schrot im besiedelten Gebiet sind erlaubt;"},{"lvl":1,"sym":"3.","t":"auf Schalenwild mit Patronen zu schießen, die keine der Stärke des Wildes entsprechende, ausreichende, schnell tötende Wirkung erwarten lassen;"},{"lvl":1,"sym":"4.","t":"in Jagdgebieten Selbstschüsse, Abzugeisen - soweit Abs. 3 nicht anderes bestimmt - und Fanggeräte, die nicht unversehrt fangen oder nicht sofort töten – sofern Abs. 1b nicht anderes bestimmt –, zu verwenden oder erlaubte Fanggeräte zu verwenden, die sich nicht in einem einwandfreien, funktionsfähigen Zustand befinden;"},{"lvl":1,"sym":"5.","t":"Fanggeräte so aufzustellen, daß eine Gefährdung von Menschen oder Nutztieren, einschließlich der Haustiere, eintreten kann;"},{"lvl":1,"sym":"6.","t":"Schlingen jeder Art, in denen sich Wild fangen kann, herzustellen, feilzubieten, zu erwerben oder aufzustellen;"},{"lvl":1,"sym":"7.","t":"Wild zu vergiften;"},{"lvl":1,"sym":"8.","t":"die Jagd unter Verwendung von Infrarot- oder elektronischen Zielgeräten, Drohnen (außer zur Kitzrettung), Sprengstoffen, Gasen, elektrischem Strom oder von Betäubungs- und Lähmungsmitteln auszuüben; dies gilt nicht für die Verwendung von Wärmebildkameras in Gestalt eines Handgerätes;"},{"lvl":1,"sym":"8a.","t":"die Jagd unter Verwendung von Leimruten, von Haken, von als Lockvögel benützten, geblendeten oder verstümmelten lebenden Vögeln, von Tonbandgeräten, von Spiegeln oder von sonstigen Vorrichtungen zum Blenden, von Vorrichtungen zur Beleuchtung der Ziele, von Visiereinrichtungen für das Schießen bei Nacht mit Bildumwandler oder elektronischem Bildverstärker sowie von elektrischen oder elektronischen Vorrichtungen, die töten oder betäuben können, soweit nach Abs. 1b oder Abs. 1c nicht anderes vorgesehen ist;"},{"lvl":1,"sym":"9.","t":"künstliche Lichtquellen beim Fangen oder Erlegen von Wild zu verwenden;"},{"lvl":1,"sym":"10.","t":"(entfällt)"},{"lvl":1,"sym":"11.","t":"aus Kraftfahrzeugen, Luftfahrzeugen, Motorbooten und Seilbahnen sowie aus anderen Fahrzeugen, die mit Maschinenkraft betrieben werden, auf Wild zu schießen;"},{"lvl":1,"sym":"12.","t":"die Lappjagd innerhalb einer Zone von 300 m von der Jagdgebietsgrenze, die Jagd durch Abklingeln der Felder und die Treibjagd bei Mondschein auszuüben;"},{"lvl":1,"sym":"13.","t":"Schalenwild in einem Umkreis von 200 m von beschickten Fütterungen zu erlegen, sofern nicht § 61a Abs. 3 anzuwenden ist."},{"lvl":1,"sym":"14.","t":"an Orten zu jagen, wo durch die Jagd die öffentliche Ruhe und Ordnung gestört oder das Leben und die Sicherheit von Menschen gefährdet würde;"},{"lvl":1,"sym":"15.","t":"in der nächsten Umgebung von Stätten, die der Heilung oder der Erholung dienen, Wild mit Schußwaffen zu bejagen;"},{"lvl":1,"sym":"16.","t":"die Jagd auf Schalenwild und Federwild zur Nachtzeit - das ist die Zeit von einer Stunde nach Sonnenuntergang bis eine Stunde vor Sonnenaufgang - auszuüben; ausgenommen von diesem Verbot ist die Jagd auf Schwarzwild, Auer-, Birk- und Rackelhahnen, Wildgänse, Wildenten und Waldschnepfen;"},{"lvl":1,"sym":"17.","t":"in den Setz- und Brutzeiten bis zum Selbständigwerden der Jungtiere die für die Aufzucht notwendigen Elterntiere zu bejagen;"},{"lvl":0,"sym":"","t":"dies gilt nicht für seuchenkranke oder seuchenverdächtige Stücke;"},{"lvl":1,"sym":"18.","t":"die Brackenjagd in der Zeit vom 1. Jänner bis 30. September auszuüben;"},{"lvl":1,"sym":"19.","t":"Nester und Gelege von Federwild zu zerstören oder die Eier ohne Bewilligung (§ 52 Abs. 3) zu sammeln sowie die Brutstätten des Federwildes während der Brutzeit und der Aufzucht der Jungtiere zu beunruhigen;"},{"lvl":1,"sym":"20.","t":"durch die Jagd, insbesondere durch die Jagd mit Hunden sowie durch Treibjagden, die Sicherheit des Weideviehs zu gefährden;"},{"lvl":1,"sym":"21.","t":"Personen unter 14 Jahren als Treiber zu verwenden;"},{"lvl":1,"sym":"22.","t":"Wild innerhalb von vier Wochen vor Beginn der für dieses Wild festgesetzten Jagdzeit auszusetzen;"},{"lvl":1,"sym":"23.","t":"innerhalb einer Zone von 100 m entlang der Jagdgebietsgrenze ohne schriftliche Zustimmung des Jagdausübungsberechtigten des benachbarten Jagdgebietes Ansitzeinrichtungen zu errichten oder aufrechtzuerhalten;"},{"lvl":1,"sym":"24.","t":"Hochstände oder Hochsitze zu errichten und zu verwenden, die"},{"lvl":2,"sym":"a)","t":"nicht wenigstens an einer Seite mindestens zur Hälfte offen sind, wobei diese Öffnung zum Zweck des Wetterschutzes verschließbar sein darf, oder"},{"lvl":2,"sym":"b)","t":"eine Bodenfläche von mehr als 2 m2 haben, wobei bei rechteckigen Formen die Längsseite 1,60 m nicht überschreiten darf, und"},{"lvl":2,"sym":"c)","t":"beheizbar sind;"},{"lvl":1,"sym":"25.","t":"für die Errichtung von Hochständen oder Hochsitzen sowie für die Errichtung von Fütterungsanlagen, die keine Gebäude sind - ausgenommen jeweils für die Abdeckung und allfällige Fensterverglasungen -, andere als natürliche, der Umgebung angepasste, Baustoffe zu verwenden; dies gilt nicht für die vorübergehende Aufstellung von Ansitzleitern sowie von Vorrichtungen zum Ziehen und Aufstellen von beweglichen Ansitzeinrichtungen aus anderen Materialien;"},{"lvl":1,"sym":"26.","t":"Schüsse auf Wild so abzugeben, dass die Geschossflugbahn zum Ziel auch über fremdes Jagdgebiet verläuft."},{"lvl":0,"sym":"(1a)","t":"Die Verbote der Z 22, 23 und - hinsichtlich der Errichtung von Hochständen und Hochsitzen - auch Z 24 sowie Z 25 gelten für jedermann."},{"lvl":0,"sym":"(1b)","t":"Zur Bejagung von Schwarzwild dürfen abweichend von § 68 Abs. 1 Z 4, 8 und 8a Infrarot- oder elektronische Zielgeräte, Fanggeräte zum Lebendfang, Vorrichtungen zur Beleuchtung der Ziele sowie Visiereinrichtungen für das Schießen bei Nacht mit Bildumwandler oder mit elektronischem Bildverstärker verwendet werden, sofern dies"},{"lvl":1,"sym":"1.","t":"zur Verhinderung der Verbreitung einer Tierseuche erforderlich ist und"},{"lvl":1,"sym":"2.","t":"durch den Inhaber einer gültigen Jagdkarte erfolgt, der die für die Verwendung der besonderen Jagdmethode erforderlichen Kenntnisse und Fähigkeiten nachweislich erworben hat."},{"lvl":0,"sym":"","t":"Auf die Verwendung von Fanggeräten zum Lebendfang ist durch das Anbringen von für jedermann erkennbaren Warnzeichen hinzuweisen. Die Landesregierung kann unter Bedachtnahme auf Erfordernisse der Sicherheit von Menschen und der Weidgerechtigkeit mit Verordnung nähere Vorschriften über die Beschaffenheit, Größe, Ausstattung und Funktion der Fanggeräte, die nach dem ersten Satz verwendet werden dürfen, erlassen."},{"lvl":0,"sym":"(1c)","t":"Zur Bejagung von Bibern, Fischottern, Goldschakalen und Wölfen kann die Landesregierung"},{"lvl":1,"sym":"1.","t":"mit Verordnung Ausnahmen vom Verbot der Verwendung von Infrarot- oder elektronischen Zielgeräten (Abs. 1 Z 8), von Vorrichtungen zur Beleuchtung der Ziele sowie von Visiereinrichtungen für das Schießen bei Nacht mit Bildumwandler oder mit elektronischem Bildverstärker (Abs. 1 Z 8a) vorsehen,"},{"lvl":1,"sym":"2.","t":"auf Antrag eines Jagdausübungsberechtigten, eines Jagdschutzorgans oder eines Inhabers eines Jagderlaubnisscheines mit Bescheid Ausnahmen vom Verbot der Verwendung von Infrarot- oder elektronischen Zielgeräten (Abs. 1 Z 8) bewilligen,"},{"lvl":0,"sym":"","t":"sofern dies zum Schutz einer der in § 51 Abs. 4a angeführten Interessen erfolgt, es hiefür keine andere zufriedenstellende Lösung gibt und unter der Voraussetzung, dass die Population der Wildart Wolf in ihrem natürlichen Verbreitungsgebiet trotz der Ausnahmeregelung ohne Beeinträchtigung in einem günstigen Erhaltungszustand verweilt. Ausnahmen gemäß Z 1 und 2 dürfen höchstens für die Dauer von zwei Jahren vorgesehen werden."},{"lvl":0,"sym":"(2)","t":"Die Bezirksverwaltungsbehörde hat in begründeten Fällen und sofern es keine andere zufriedenstellende Lösung gibt, Ausnahmen vom Verbot der Verwendung von Betäubungs- und Lähmungsmitteln (Abs. 1 Z 8) zuzulassen."},{"lvl":0,"sym":"(3)","t":"Der Landesjägermeister darf auf Antrag für einen zeitlich und örtlich beschränkten Bereich die Verwendung von Abzugeisen abweichend vom Verbot des Abs. 1 Z 4 - beschränkt auf höchstens fünf Jahre - bewilligen, wenn die öffentlichen Interessen an der Bekämpfung der Tierseuchen, der Räude und des Fuchsbandwurmes, an der Abwehr ernster Schäden für die Landwirtschaft sowie am Schutz von Tierarten durch das Aufstellen von Abzugeisen höher zu bewerten sind als die öffentlichen Interessen des Naturschutzes, sofern es keine andere zufriedenstellende Lösung gibt, und im übrigen die Voraussetzungen des Abs. 3a vorliegen. Der Antrag auf Bewilligung hat jene Bereiche des Jagdgebietes, für die die Aufstellung von Abzugeisen beantragt wird, einzugrenzen; im Antrag ist anzugeben, welches Raubwild durch Abzugeisen gefangen werden soll und welche Kennzeichen die Abzugeisen, für die die Bewilligung beantragt wird, haben. Ist der Antragsteller nicht zugleich Jagdausübungsberechtigter, so ist dem Antrag die schriftliche Zustimmung des Jagdausübungsberechtigten anzuschließen. Inhabern von Jagdgastkarten darf keine Bewilligung zur Verwendung von Abzugeisen erteilt werden. Die Bewilligung darf nur unter der Auflage erteilt werden, daß der Bewilligungsinhaber dem Landesjägermeister bis zum 31. März jeden Jahres die Fänge unter Bezeichnung der gefangenen Tiere und, wenn ein Verdacht auf Räude vorliegt, auch diesen, bekanntgibt."},{"lvl":0,"sym":"(3a)","t":"Weitere Voraussetzungen für die Erteilung einer Bewilligung nach Abs. 3 sind"},{"lvl":1,"sym":"a)","t":"die Gewährleistung der Kontrolle der Abzugeisen, und zwar jedenfalls in den frühen Morgenstunden und vor Einbruch der Dämmerung - werden diese Abzugeisen in Fangbunkern aufgestellt, jedenfalls in den frühen Morgenstunden -, insbesondere im Hinblick auf den Aufstellungsort, den Beruf und den Wohnsitz des Bewilligungswerbers;"},{"lvl":1,"sym":"b)","t":"eine Bestätigung des Bezirksjägermeisters, daß die zur Verwendung erforderlichen Kenntnisse und Fähigkeiten in einem von der Kärntner Jägerschaft abgehaltenen Kurs erworben wurden, und"},{"lvl":1,"sym":"c)","t":"ein Nachweis, daß die Abzugeisen des Bewilligungswerbers durch die Kärntner Jägerschaft mit einer Kennzahl (Abs. 3b) versehen worden sind;"},{"lvl":1,"sym":"d)","t":"wenn Füchse durch Abzugeisen gefangen werden sollen, auch, daß in den Bereichen, für die der Antrag gestellt wird, eine systematische Bejagung des Fuchses ohne Verwendung von Abzugeisen nicht möglich ist."},{"lvl":0,"sym":"(3b)","t":"Die Kärntner Jägerschaft hat die Abzugeisen durch Einstanzen einer Kennzahl zu kennzeichnen. Der Besitzer des Abzugeisens muß über die Kennzahl feststellbar sein. Die Kennzahl darf nur eingestanzt werden, wenn die Kärntner Jägerschaft die Funktionsfähigkeit des Abzugeisens überprüft und festgestellt hat. Die Kärntner Jägerschaft hat die Namen und Anschriften der Besitzer von gekennzeichneten Abzugeisen und die Kennzahlen der Landesregierung und der Bezirksverwaltungsbehörde, in deren Sprengel das Abzugeisen verwendet werden soll, mitzuteilen."},{"lvl":0,"sym":"(3c)","t":"Auf das Vorhandensein von Fallen ist durch Anbringung von Warnzeichen aufmerksam zu machen. Diese Warnzeichen müssen von jedermann unschwer wahrgenommen und als solche erkannt werden können."},{"lvl":0,"sym":"(3d)","t":"Die Landesregierung hat mit Verordnung nähere Bestimmungen über die Art der zu verwendenden Abzugeisen, die Ausbildung des Bewilligungswerbers sowie über die Kennzeichnung und die Überprüfung der Abzugeisen festzulegen."},{"lvl":0,"sym":"(3e)","t":"(entfällt)"},{"lvl":0,"sym":"(3f)","t":"Der Landesjägermeister hat die Bewilligung zur Verwendung von Abzugeisen zu widerrufen, wenn in einem Abzugeisen ein anderes Tier als Raubwild oder umherstreifende Katzen (§ 49 Abs. 1 lit. b und Abs. 5) gefangen wird oder wenn ein gefangenes Tier nicht sofort getötet wurde oder wenn Menschen oder Nutztiere einschließlich der Haustiere gefährdet wurden."},{"lvl":0,"sym":"(3g)","t":"Der Landesjägermeister hat für eine stichprobenweise Überwachung der Einhaltung des Bewilligungsbescheides nach Abs. 3 zu sorgen."},{"lvl":0,"sym":"(4)","t":"Das Jagen in Naturschutzgebieten und Nationalparks kann durch Verordnung der Landesregierung gesondert geregelt werden. Auf die im Kärntner Naturschutzgesetz, LGBl Nr 54/1986, sowie in Nationalparkgesetzen aufgestellten Grundsätze ist Bedacht zu nehmen."},{"lvl":0,"sym":"(5)","t":"Der Landesvorstand der Kärntner Jägerschaft kann mit Verordnung die der Bestimmung des Abs. 1 Z 3 entsprechenden Mindestenergiewerte unter Bedachtnahme auf den Stand der Schießtechnik festlegen."},{"lvl":0,"sym":"(6)","t":"Die Landesregierung hat mit Verordnung festzulegen, welche Fanggeräte den Bestimmungen des Abs. 1 Z 4 entsprechen und wie deren Aufstellung (Abs. 1 Z 5) zu erfolgen hat. Die Landesregierung hat mit Verordnung Fanggeräte, die grundsätzlich oder nach ihren Anwendungsbedingungen nicht selektiv sind, zu verbieten, sofern die Verwendung dieser Fallen nicht zum Schutz einer der in § 51 Abs. 4a angeführten Interessen weiterhin geboten erscheint, und sofern es keine andere zufriedenstellende Lösung gibt. Sie hat weiters durch Verordnung Fanggeräte, die grundsätzlich oder nach ihren Anwendungsbedingungen nicht selektiv sind, zu verbieten, wenn durch ihre Verwendung das örtliche Verschwinden des Edelmarders oder des Iltisses hervorgerufen werden könnte oder deren Populationen schwer gestört werden könnten, sofern die weitere Verwendung dieser Fallen nicht zum Schutz einer der in § 51 Abs. 4a angeführten Interessen weiterhin geboten erscheint und sofern es keine andere zufriedenstellende Lösung gibt."},{"lvl":0,"sym":"(7)","t":"Werden Ansitzeinrichtungen entgegen den Bestimmungen des Abs. 1 Z 23 errichtet oder aufrechterhalten, so hat die Bezirksverwaltungsbehörde dem Jagdausübungsberechtigten mit Bescheid aufzutragen, entweder innerhalb einer angemessen festzusetzenden Frist die Zustimmung des Jagdausübungsberechtigten des benachbarten Jagdgebietes vorzulegen oder innerhalb einer weiters festzusetzenden angemessenen Frist den rechtmäßigen Zustand wiederherzustellen. Die Anordnung der Herstellung des rechtmäßigen Zustandes gilt in gleicher Weise für Ansitzeinrichtungen und Fütterungsanlagen, die entgegen der Bestimmung des Abs. 1 Z 24 oder 25 errichtet oder aufrechterhalten werden."}]},{"id":"69","title":"Verhalten im Jagdgebiet","body":[{"lvl":0,"sym":"(1)","t":"Es ist jedermann verboten, ein Jagdgebiet außerhalb der öffentlichen Straßen und Wege und solcher Wege, die allgemein als Verbindung zwischen Ortschaften und Gehöften benützt werden, ohne schriftliche Bewilligung des Jagdausübungsberechtigten mit einem Gewehr, mit Gegenständen, die zum Fangen und Töten von Wild jeder Art bestimmt sind oder es erleichtern, sowie mit Frettchen oder mit Beizvögeln zu durchstreifen, es läge denn seine Berechtigung oder Verpflichtung hiezu in seiner amtlichen Stellung oder amtlichen Ermächtigung. Die schriftliche Bewilligung des Jagdausübungsberechtigten ist auch für den Transport von erlegtem oder gefallenem Schalenwild durch ein fremdes Jagdgebiet außerhalb der öffentlichen Straßen und Wege und außerhalb sonstiger Wege, die allgemein als Verbindung zwischen Ortschaften oder Gehöften benützt werden, erforderlich."},{"lvl":0,"sym":"(2)","t":"Nichtberechtigten Personen ist das Ankirren von Wild, das Berühren oder Aufnehmen von Jungwild, ferner, unbeschadet der Bestimmungen des § 71, jede vorsätzliche Beunruhigung von Wild sowie jede Verfolgung von Wild verboten. Kommt lebendes oder verendetes Wild durch wie immer geartete Umstände in den Besitz nichtberechtigter Personen, so haben sie es unverzüglich dem Jagdausübungsberechtigten, seinem Jagdschutzorgan oder der nächsten Sicherheitsdienststelle abzuliefern. Diese hat das Wild dem Jagdausübungsberechtigten oder seinem Jagdschutzorgan ehestens zur Verfügung zu stellen."},{"lvl":0,"sym":"(3)","t":"Wird Wild von Fahrzeugen verletzt oder getötet, so hat der Lenker des Fahrzeuges dies der nächsten Polizeiinspektion, dem Jagdausübungsberechtigten oder dessen Jagdschutzorgan zu melden. Der Jagdausübungsberechtigte oder dessen Jagdschutzorgan hat nach Erhalt einer Meldung unverzüglich für die Bergung des Wildes zu sorgen, sofern dies ohne Gefährdung seiner körperlichen Sicherheit möglich ist, und erforderlichenfalls eine Nachsuche durchzuführen. Um die Erfüllung dieser Verpflichtungen sicherzustellen, hat der Landesjägermeister auf Ersuchen einer Polizeiinspektion die Namen und Erreichbarkeitsdaten von Jagdausübungsberechtigten und Jagdschutzorganen, die Jagdgebiete oder deren Teile innerhalb des örtlichen Wirkungsbereichs der Polizeiinspektion betreffen, bekanntzugeben."},{"lvl":0,"sym":"(4)","t":"Soweit dies zum Schutz des Wildes erforderlich ist, insbesondere während der Brut- und Setzzeit des Wildes oder bei einer Schneelage, die eine Flucht des Wildes erschwert, kann die Landesregierung nach Anhörung der Landwirtschaftskammer und des Landesjägermeisters mit Verordnung für das gesamte Landesgebiet oder für Teile davon Hundehaltern auftragen, dass Hunde an der Leine zu führen oder sonst tierschutzgerecht zu verwahren sind."},{"lvl":0,"sym":"(5)","t":"Unbefugten ist das Besteigen von Hochsitzen und Hochständen verboten."}]},{"id":"70","title":"Zeitlich und örtlich beschränkte Sperren","body":[{"lvl":0,"sym":"(1)","t":"Zur Vornahme von Abschüssen, die aus außerordentlichen Gründen, wie der Häufung von Wildschadensfällen, Seuchen und dgl., notwendig sind, kann vom Jagdausübungsberechtigten und, wenn der Abschuß abgesehen vom Abschußplan behördlich bewilligt oder durch die Behörde angeordnet wird, von dieser eine Sperre von Teilen des Jagdgebietes im örtlich und zeitlich unbedingt erforderlichen Ausmaß verfügt werden, wenn dies die besonderen Umstände, insbesondere Sicherheitsgründe, bedingen. Der Jagdausübungsberechtigte kann solche Sperren auch verfügen, wenn außerordentliche Verhältnisse den Bestand einer Wildart gefährden und dies das Erfordernis der Winterruhe dieser Wildart oder sonstige besondere Umstände bedingen. Der Jagdausübungsberechtigte hat die Sperre der Bezirksverwaltungsbehörde unverzüglich anzuzeigen, die diese bei Fehlen der Voraussetzungen aufzuheben hat. Soll die Sperre länger als eine Woche dauern oder mehr als zwanzig Hektar zusammenhängender Fläche umfassen oder für die Festlegung eines Wildschutzgebietes (Abs. 1b) dienen, so darf sie nur durch die Bezirksverwaltungsbehörde verfügt werden. Das gleiche gilt auch für die Verlängerung der Sperre oder ihre Wiederholung im selben Jagdjahr. Vor der Verfügung, der Verlängerung oder der Wiederholung einer Sperre durch die Bezirksverwaltungsbehörde sind der Bezirksjagdbeirat, die Gemeinden, in denen die Sperrgebiete liegen, und die durch die Sperre betroffenen Vereine, deren Vereinsziel die Förderung der Belange einer kultur- und landschaftsverbundenen Freizeitgestaltung oder der Erholung der Menschen ist, zu hören."},{"lvl":0,"sym":"(1a)","t":"Soweit eine Sperre nur durch die Bezirksverwaltungsbehörde verfügt werden darf, darf die forstrechtliche Wegefreiheit nicht unverhältnismäßig eingeschränkt werden; darüber hinaus ist die Zustimmung des Grundeigentümers erforderlich. Bei der Festlegung einer Sperre, die für die Festlegung eines Wildschutzgebietes dient, darf ein Ausmaß von 10 v. H. der Fläche des Jagdgebietes nicht überschritten werden. Sperren, die für die Festlegung eines Wildschutzgebietes dienen, dürfen überdies nur im Einklang mit dem wildökologischen Raumplan festgelegt werden."},{"lvl":0,"sym":"(1b)","t":"Wildschutzgebiete sind Flächen, die als besonders bevorzugte Einstandsgebiete Ruhezonen für das Wild sind, oder Flächen, die zum Brüten oder Setzen bevorzugt angenommen werden. In Wildschutzgebieten darf nur Wild erlegt oder gefangen werden, das infolge einer Verletzung großen Qualen oder einem Siechtum ausgesetzt oder krank oder seuchenverdächtig ist."},{"lvl":0,"sym":"(2)","t":"Die Sperre bewirkt, daß mit Ausnahme des Grundeigentümers, sonstiger Nutzungsberechtigter und deren Beauftragter sowie Personen in amtlicher Stellung jagdfremde Personen das gesperrte Gebiet abseits von den zur allgemeinen Benutzung bestimmten Straßen und Wegen einschließlich der örtlich üblichen Wanderwege sowie abseits von zur allgemeinen Benützung bestimmten Schipisten, Schitourenrouten und Loipen nicht betreten dürfen."},{"lvl":0,"sym":"(3)","t":"Das gesperrte Gebiet ist vom Jagdausübungsberechtigten mittels Hinweistafeln an jenen Stellen zu kennzeichnen, wo öffentliche Straßen und Wege, zur allgemeinen Benutzung bestimmte Straßen und Wege einschließlich der örtlich üblichen Wanderwege, zur allgemeinen Benutzung bestimmte Schipisten, Schitourenrouten und Loipen sowie Forststraßen in die gesperrte Fläche führen. Die Hinweistafeln sind nach Beendigung der Sperre unverzüglich zu beseitigen. Form und Gestaltung einschließlich des Wortlautes der Hinweistafeln werden durch Verordnung der Landesregierung festgelegt, wobei zum Ausdruck zu bringen ist, dass die Sperre nur abseits von den zur allgemeinen Benutzung bestimmten Straßen und Wegen einschließlich der örtlich üblichen Wanderwege, sowie abseits von zur allgemeinen Benutzung bestimmten Schipisten, Schitourenrouten und Loipen gilt."}]}]},{"nr":9,"title":"Wild- und Jagdschaden","paras":[{"id":"71","title":"Wildschadensverhütung","body":[{"lvl":0,"sym":"(1)","t":"Sofern nicht anderes vereinbart ist, sind der Grundeigentümer und auch der Jagdausübungsberechtigte befugt, das Wild von den Kulturen durch geeignete Schutzmaßnahmen abzuhalten und zu diesem Zweck Wildscheuchen, Wildzäune u. ä. zu errichten (Flächenschutz) oder einen Einzelpflanzenschutz durch geeignete Schutzmittel durchzuführen. Die Verwendung freilaufender Hunde zur Abhaltung des Wildes ist jedoch untersagt. Die Bestimmungen des § 63 werden hiedurch nicht berührt."},{"lvl":0,"sym":"(2)","t":"Liegt eine Gefährdung des Waldes durch Wild vor (Abs. 3), so hat die Bezirksverwaltungsbehörde den Jagdausübungsberechtigten von Jagdgebieten, die zum Einzugsbereich des den Wildschaden hauptsächlich verursachenden Wildes gehören, die erforderlichen Maßnahmen (Abs. 4) vorzuschreiben. Dabei ist der Grundsatz der Verhältnismäßigkeit der anzuwendenden Mittel zu wahren, insbesondere das jeweils gelindeste zielführende Mittel zu wählen und darauf Bedacht zu nehmen, daß die widmungsgemäße Bewirtschaftung und Benützung der Grundstücke nicht unmöglich gemacht wird. Grundeigentümer des betroffenen Jagdgebietes sowie Gemeinden, in denen das betroffene Jagdgebiet liegt, sind von der Einleitung und vom Ergebnis eines Verfahrens gemäß dem ersten Satz nachweislich zu verständigen; ferner sind sie im Verfahren anzuhören."},{"lvl":0,"sym":"(2a)","t":"Dem Leiter der nach der Geschäftseinteilung des Amtes der Landesregierung mit den Angelegenheiten des Forstaufsichtsdienstes betrauten Abteilung kommt gemäß § 16 Abs. 5 des Forstgesetzes 1975, in der Fassung des Gesetzes BGBl Nr 576/1987, als Leiter des Forstaufsichtsdienstes beim Amt der Landesregierung das Antragsrecht auf Einleitung der landesgesetzlich vorgesehenen Verfahren zum Schutz des Waldes gegen waldgefährdende Wildschäden, insbesondere auf Einleitung eines Verfahrens nach Abs. 2, und Parteistellung zu."},{"lvl":0,"sym":"(3)","t":"Eine Gefährdung des Waldes im Sinne des Abs. 2 liegt vor, wenn die Einwirkungen des Wildes durch Verbiß, Verfegen oder Schälen"},{"lvl":1,"sym":"a)","t":"in den Beständen ausgedehnte Blößen verursachen oder auf größerer Fläche die gesunde Bestandesentwicklung unmöglich machen oder wesentlich verschlechtern oder eine standortgemäße Baumartenmischung (Abs. 3) gefährden;"},{"lvl":1,"sym":"b)","t":"die Aufforstung oder Naturverjüngung auf aufforstungsbedürftigen Flächen innerhalb der aus den forstrechtlichen Bestimmungen sich ergebenden Fristen oder die Aufforstung bei Neubewaldungen innerhalb einer nach den standortlichen Gegebenheiten angemessenen Frist gefährden;"},{"lvl":1,"sym":"c)","t":"Naturverjüngungen in Naturverjüngungsbeständen nicht aufkommen lassen."},{"lvl":0,"sym":"(3a)","t":"Eine standortgemäße Baumartenmischung ist jedenfalls gefährdet, wenn auf größeren Flächen sich die im Umkreis vorhandene Baumartenmischung nicht mehr entwickeln oder überhaupt nicht mehr aufkommen kann."},{"lvl":0,"sym":"(4)","t":"Als Schutzmaßnahmen im Sinne des Abs. 2 kommen in Betracht:"},{"lvl":1,"sym":"a)","t":"die Austreibung des zu Schaden gehenden Wildes aus dem Schadensgebiet;"},{"lvl":1,"sym":"b)","t":"Maßnahmen nach § 72;"},{"lvl":1,"sym":"c)","t":"Maßnahmen der Äsungsverbesserung und Reviergestaltung nach § 3 Abs. 3, Maßnahmen nach § 61 Abs. 1, § 61a Abs. 2 und § 63 Abs. 6, wobei Maßnahmen nach § 63 Abs. 6 von der Landesregierung zu treffen sind;"},{"lvl":1,"sym":"d)","t":"technische Maßnahmen zum Schutz von Waldflächen oder Einzelpflanzungen vor Wildeinwirkungen, wie die Anbringung eines geeigneten Verbiß- oder Schälschutzes oder die Errichtung von Wildzäunen u. ä."},{"lvl":0,"sym":"(5)","t":"Die Bestimmungen des § 63 Abs. 2 bis 4 gelten sinngemäß für die Errichtung und Überlassung von Einrichtungen gemäß Abs. 4 lit. c und d."},{"lvl":0,"sym":"(6)","t":"Die vom Jagdausübungsberechtigten zur Abhaltung des Wildes getroffenen Vorkehrungen ( Abs. 1) müssen so beschaffen sein, daß die Bewirtschaftung und Benutzung der Grundstücke durch den Grundeigentümer nicht unnötig und unzumutbar behindert wird."}]},{"id":"72","title":"Abschußauftrag zum Schutz von Kulturen","body":[{"lvl":0,"sym":"(1)","t":"Wenn sich in einem Jagdgebiet die Verminderung von Schalenwild im Interesse der Land- und Forstwirtschaft als notwendig herausstellt, so hat die Bezirksverwaltungsbehörde von Amts wegen oder auf Antrag des Jagdausübungsberechtigten, der Landwirtschaftskammer, des Leiters des Forstaufsichtsdienstes beim Amt der Landesregierung, der Kärntner Jägerschaft oder der Gemeinde eine ziffernmäßig zu begrenzende und zu befristende Verminderung des Schalenwildes dem Jagdausübungsberechtigten aufzutragen. Eine solche Verminderung darf auch während der Schonzeit durchgeführt werden."},{"lvl":0,"sym":"(1a)","t":"Bezieht sich ein Auftrag nach Abs. 1 auf Schwarzwild in Gebieten, in denen Rotwild vorkommt, darf die Bezirksverwaltungsbehörde auf Antrag des Jagdausübungsberechtigten auch Ausnahmen vom Verbot des § 61c Abs. 2 im erforderlichen örtlichen und zeitlichen Rahmen bewilligen. In diesem Auftrag ist unter Bedachtnahme auf den wildökologischen Raumplan auch festzulegen, welches Futter für die Kirrung zu verwenden und wie es vorzulegen ist."},{"lvl":0,"sym":"(2)","t":"Kommt der Jagdausübungsberechtigte einem Abschußauftrag nach Abs. 1 nicht nach, so hat die Bezirksverwaltungsbehörde vorerst den Jagdausübungsberechtigten der benachbarten Jagdgebiete die Möglichkeit zu geben, den von einem Abschußauftrag nach Abs. 1 erfaßten Abschuß während einer angemessenen Frist - jedoch nicht in der Schonzeit - jeweils in ihrem Jagdgebiet zu erfüllen. Der Abschußauftrag ist erfüllt, sobald das Wild in diesen benachbarten Jagdgebieten erlegt wurde. Die Bezirksverwaltungsbehörde hat den Jagdausübungsberechtigten den Namen der Jagdausübungsberechtigten mitzuteilen, die im Fall der Erlegung eines vom Abschußauftrag erfaßten Wildes unverzüglich zu verständigen sind. Der Jagdausübungsberechtigte, der einen derartigen Abschuß durchführt, hat davon überdies unverzüglich die Bezirksverwaltungsbehörde zu verständigen."},{"lvl":0,"sym":"(3)","t":"In den Fällen des Abs. 1 und 2 kann die Bezirksverwaltungsbehörde verlangen, dass das Wild in der Decke dem Hegeringleiter vorgelegt wird. Besteht die Vermutung, dass die Bestimmungen der Abs. 1 und 2 nicht eingehalten wurden, hat der Hegeringleiter die Bezirksverwaltungsbehörde zu verständigen."},{"lvl":0,"sym":"(4)","t":"Haben Maßnahmen nach Abs. 2 nicht zu einer Erfüllung des Abschußauftrages geführt, so hat die Bezirksverwaltungsbehörde die Durchführung des Abschusses auf Kosten des verpflichteten Jagdausübungsberechtigten nach Abs. 1 zu veranlassen. Unbeschadet des Abs. 5 ist das erlegte Wild dem Jagdausübungsberechtigten zu überlassen."},{"lvl":0,"sym":"(5)","t":"Ist der Abschuss von Rot- oder Rehwild nach Abs. 1 aufgetragen worden, hat die Bezirksverwaltungsbehörde die Trophäen der erlegten Rotwildstücke der Klasse I und II für verfallen zu erklären. Solche Trophäen sind der Kärntner Jägerschaft zur Verfügung zu stellen."}]},{"id":"72a","title":"Freihaltezone","body":[{"lvl":0,"sym":"(1)","t":"Die Landesregierung hat die Freihaltung eines Gebietes von Schalenwild gegenüber dem Jagdausübungsberechtigten mit Bescheid befristet unter Bezeichnung einer Freihaltungszone anzuordnen, wenn forstlicher Bewuchs durch Schalenwild in seinem Bestand gefährdet wird und ein wirksamer Schutz des Waldes durch ein Vorgehen nach § 57 Abs. 12 sowie nach § 71 Abs. 2 und 4 nicht erwartet werden kann. Die Freihaltung ist insbesondere dann anzuordnen, wenn dieser forstliche Bewuchs mit Mitteln der öffentlichen Hand gefördert wird oder gefördert wurde oder eine solche Förderung geplant ist. Die Freihaltung ist von Amts wegen oder auf Antrag der Landwirtschaftskammer, des Leiters des Forstaufsichtsdienstes beim Amt der Landesregierung, der zuständigen Sektion des Forsttechnischen Dienstes für Wildbach- und Lawinenverbauung, der Kärntner Jägerschaft oder der Gemeinde anzuordnen. § 71 Abs. 2 letzter Satz gilt sinngemäß."},{"lvl":0,"sym":"(2)","t":"Die Anordnung zur Freihaltung ist örtlich und zeitlich auf das zum Schutz des gefährdeten Bewuchses erforderliche Maß zu beschränken. Sie hat sich auf alle Arten des Schalenwildes zu erstrecken, es sei denn, dass der Schutzzweck durch Beschränkung der Anordnung auf einzelne Arten des Schalenwildes oder durch Unterscheidung nach Geschlecht und Altersklassen erreicht werden kann."},{"lvl":0,"sym":"(3)","t":"Die Anordnung zur Freihaltung verpflichtet dazu, jedes Stück des betreffenden Wildes, das sich in der Freihaltezone einstellt, unverzüglich zu erlegen. Die Freihaltung darf auch während der Schonzeit, ausgenommen für tragende Tiere, und in Abweichung vom Abschussplan durchgeführt werden."},{"lvl":0,"sym":"(4)","t":"Die Landesregierung hat die Freihaltung eines Gebietes von ansteckungsverdächtigem Schalenwild von Amts wegen anzuordnen, wenn dies zur Verhinderung einer Seuchenausbreitung erforderlich ist. Abs. 1 erster und letzter Satz sowie Abs. 2 und 3 sind auf diesen Fall sinngemäß anzuwenden."}]},{"id":"73","title":"Beschränkung der Wildhege","body":[{"lvl":0,"sym":"(1)","t":"Schwarzwild darf nur ausgesetzt werden, wenn der Jagdausübungsberechtigte durch eine zureichende Einfriedung ein Ausbrechen desselben verhindert."},{"lvl":0,"sym":"(2)","t":"Das Aussetzen von Wildkaninchen ist verboten."},{"lvl":0,"sym":"(3)","t":"Das Aussetzen von Wild in Gebieten, in denen es nicht heimisch ist, bedarf der Genehmigung der Landesregierung. Die Landesregierung hat vor ihrer Entscheidung die Landwirtschaftskammer, die Kärntner Jägerschaft und die Gemeinde zu hören. Die Genehmigung darf nur erteilt werden, wenn durch das Aussetzen keine Beeinträchtigung der bestehenden Tier- und Pflanzengemeinschaft und keine Schädigung der Interessen der Land- und Forstwirtschaft zu erwarten ist. In Nationalparks darf die Genehmigung überdies nur erteilt werden, wenn sie mit den Zielen des § 2 Abs. 1 lit. b des Kärntner Nationalparkgesetzes, LGBl Nr 55/1983, im Einklang steht."},{"lvl":0,"sym":"(4)","t":"Abs. 3 gilt nicht für Maßnahmen gemäß der IAS-Verordnung (EU) Nr. 1143/2014 nach den Bestimmungen des Kärntner EU-Verordnungen-Begleitgesetzes."}]},{"id":"74","title":"Schadenersatzpflicht","body":[{"lvl":0,"sym":"(1)","t":"Der Ersatz von Wild- und Jagdschaden richtet sich nach den folgenden Bestimmungen, soweit nicht zwischen dem Jagdausübungsberechtigten und dem Anspruchsberechtigten anderweitige Vereinbarungen getroffen wurden."},{"lvl":0,"sym":"(2)","t":"Die Schadenersatzpflicht umfasst nach Maßgabe der §§ 75 und 76:"},{"lvl":1,"sym":"1.","t":"den innerhalb des Jagdgebietes vom Wild an Grund und Boden und dessen noch nicht eingebrachten Erzeugnissen sowie an Haustieren, Nutztieren und Fischen verursachten Schaden, soweit dieser nicht Grundstücke betrifft oder auf Grundstücken eingetreten ist, auf denen die Jagd ruht (Wildschaden);"},{"lvl":1,"sym":"2.","t":"den bei der Ausübung der Jagd vom Jagdausübungsberechtigten, von seinem Jagdhilfspersonal, seinen Jagdgästen sowie von Jagdhunden dieser Personen an Grund und Boden und an dessen noch nicht eingebrachten Erzeugnissen verursachten Schaden (Jagdschaden)."},{"lvl":0,"sym":"(3)","t":"Bei Grundstücken, die zu einem Eigenjagdgebiet gehören, richtet sich die Verpflichtung zum Ersatz von Schäden nach dem zwischen dem Geschädigten und dem Jagdausübungsberechtigten bestehenden Rechtsverhältnis. Sofern nicht anderes bestimmt ist, tritt die Ersatzpflicht des Jagdausübungsberechtigten ein, wenn er den Schaden durch unzureichenden Abschuß verschuldet hat. Schäden an Grundstücken, die einem Eigenjagdgebiet angeschlossen sind, hat der Jagdausübungsberechtigte zu ersetzen. Für Schäden an Grundstücken, die zu einem Gemeindejagdgebiet gehören oder diesem angeschlossen sind, haftet der Pächter, im Falle der Ausübung der Gemeindejagd durch einen Jagdverwalter die Gemeinde."},{"lvl":0,"sym":"(4)","t":"Die gesetzliche Ersatzpflicht gemäß Abs. 2 Z 1 und Abs. 3 gilt nicht, falls ein Wildschaden"},{"lvl":2,"sym":"1.","t":"durch Bär, Luchs, Wolf, Biber oder Fischotter oder"},{"lvl":2,"sym":"2.","t":"durch sonstiges ganzjährig geschontes Wild, soweit nicht dessen Bejagung zugelassen ist,"}]},{"id":"75","title":"Umfang der Schadenersatzpflicht","body":[{"lvl":0,"sym":"(1)","t":"Wenn Wild- oder Jagdschäden an noch nicht erntereifen Bodenerzeugnissen verursacht werden, ist der Schaden nach dem Wert zu ersetzen, den die Erzeugnisse zur Zeit der Ernte gehabt hätten. Der Aufwand, der dem Geschädigten bis zur Einbringung der Ernte erwachsen wäre, ist dabei in Abzug zu bringen. Gleichzeitig ist auch darauf Rücksicht zu nehmen, ob die Erzeugnisse bis zur Ernte noch durch andere Einwirkungen, insbesondere Witterungseinflüsse, zu Schaden gekommen wären und ob der Schaden bei ordentlicher Wirtschaftsführung durch Wiederanbau im selben Jahr hätte ausgeglichen oder vermindert werden können."},{"lvl":0,"sym":"(2)","t":"Erreichen die Wild- und Jagdschäden ein solches Ausmaß, daß ohne Umbruch und ohne neuerlichen Anbau ein entsprechender Ernteertrag nicht mehr zu erwarten ist, so hat der Jagdausübungsberechtigte die Kosten der für den Anbau erforderlichen Arbeit und das hiefür aufzuwendende Saatgut sowie den sich allfällig ergebenden Minderertrag des zweiten Anbaues zu ersetzen."},{"lvl":0,"sym":"(3)","t":"Wildschäden, die in Obst-, Gemüse- und Ziergärten, in Baumschulen, Weinbergen, Alleen, an einzelstehenden jungen Bäumen, nicht heimischen Forstkulturen, Freilandpflanzungen von Garten- oder hochwertigen Handelsgewächsen, wie Beerenkulturen, Arznei-, Farb- und Gewürzpflanzen, Hopfen, Tabak, Weingärten, Holunderpflanzungen u. ä. sowie sonstigen wertvollen Anpflanzungen und Kulturen angerichtet werden, sind nur dann zu ersetzen, wenn dargetan ist, daß der Schaden erfolgte, obgleich alle Vorkehrungen vom Geschädigten getroffen wurden, womit diese Anpflanzungen im allgemeinen geschützt werden. Bei Baumschulen und Niederpflanzungen besteht ein Anspruch auf Schadenersatz nur dann, wenn die Anlagen durch eine mindestens 1,50 m hohe Einfriedung entsprechend geschützt sind."},{"lvl":0,"sym":"(3a)","t":"Wildschäden an Haustieren, Nutztieren oder Fischen sind nur dann zu ersetzen, wenn dargetan ist, dass der Schaden eingetreten ist, obgleich alle wirtschaftlich zumutbaren Vorkehrungen gegen Wildschäden, mit denen ein ordentlicher Tierhalter seine Haustiere, Nutztiere oder Fische zu schützen pflegt, vom Geschädigten getroffen wurden. Dies gilt im Anwendungsbereich des Kärntner Alm- und Weideschutzgesetzes nicht in Almschutzgebieten sowie auf Weiden, sofern keine andere zufriedenstellende Lösung zur Verhütung ernster Schäden durch den Wolf besteht."},{"lvl":0,"sym":"(4)","t":"Wild- und Jagdschäden an Waldkulturen sind nach den Grundsätzen der Waldwertrechnung zu ermitteln. Hiebei ist zwischen Verbiß-, Schäl- und Fegeschäden zu unterscheiden und zu berücksichtigen, ob nur Einzelstammschädigungen, Bestandsschädigungen oder betriebswirtschaftliche Schädigungen eingetreten sind."},{"lvl":0,"sym":"(5)","t":"Wenn der Geschädigte die vom Jagdausübungsberechtigten zur Abwehr von Wildschäden getroffenen Maßnahmen (§ 71 Abs. 1) unwirksam macht oder den Jagdausübungsberechtigten an geeigneten Schutzmaßnahmen (§ 71 Abs. 1) hindert oder diese untersagt, geht der Anspruch auf Ersatz des Wildschadens verloren. Der Anspruch auf Ersatz des Wildschadens geht auch in dem Umfang verloren, in dem Maßnahmen oder Unterlassungen des Geschädigten für die Entstehung oder Vergrößerung von Wildschäden verursachend sind, wie etwa durch eine nicht auf die Vermeidung von Wildschäden Bedacht nehmende Lagerung von Futter - ausgenommen Raufutter - im Freien."},{"lvl":0,"sym":"(6)","t":"Für den Schaden an Grundstücken, auf denen die Jagd ruht (§ 15), ist unbeschadet der Bestimmungen der Abs. 3 und 3a Ersatz nach Maßgabe der Bestimmungen des Allgemeinen Bürgerlichen Gesetzbuches zu leisten."}]},{"id":"76","title":"Erlöschen des Schadenersatzanspruches","body":[{"lvl":0,"sym":"","t":"Der Anspruch auf Ersatz des Wild- und Jagdschadens erlischt, wenn der Berechtigte ihn nicht binnen 14 Tagen, bei Wildschäden an Wald nicht innerhalb von sechs Monaten, nachdem er von dem Schaden Kenntnis erhalten hat oder bei Anwendung gehöriger Sorgfalt hätte erhalten können, dem Jagdausübungsberechtigten anzeigt oder bei der Gemeinde zur Weiterleitung an die Schlichtungsstelle für Wildschadensangelegenheiten anmeldet, sofern er nicht nachzuweisen vermag, daß er durch ein unvorhergesehenes oder unabwendbares Ereignis ohne sein Verschulden an der rechtzeitigen Anmeldung gehindert war. Der Jagdausübungsberechtigte oder sein Bevollmächtigter (§ 79) hat den Wild- und Jagdschaden binnen einer Woche nach Erhalt der Verständigung mit dem Geschädigten zu besichtigen."}]},{"id":"77","title":"Schlichtungsstelle für Wildschadensangelegenheiten","body":[{"lvl":0,"sym":"(1)","t":"In jeder Gemeinde ist eine Schlichtungsstelle für Wildschadensangelegenheiten (Schlichtungsstelle) einzurichten."},{"lvl":0,"sym":"(2)","t":"Die Schlichtungsstelle hat über Ansprüche auf Ersatz von Jagd- und Wildschaden zu entscheiden, sofern ein Übereinkommen zwischen dem Geschädigten und dem Jagdausübungsberechtigten nicht zustande kommt."},{"lvl":0,"sym":"(3)","t":"Die Schlichtungsstelle besteht aus drei Mitgliedern, die vom Bürgermeister für die Dauer des Wahlabschnittes des Gemeinderates zu bestellen sind; für ein Mitglied kommt der Kärntner Jägerschaft das Vorschlagsrecht zu; ein Mitglied ist aus dem Kreis der Mitglieder des Gemeinderates und ein Mitglied aus dem Kreis der Personen, die weitere Mitglieder eines Jagdverwaltungsbeirates (§ 94 Abs. 1) sind, zu bestellen. Bei der Bestellung ist darauf Bedacht zu nehmen, daß jedenfalls ein Mitglied nicht das Recht zu jagen haben darf. Anläßlich der Bestellung hat der Bürgermeister eines der Mitglieder zum Obmann zu bestellen. Als Mitglieder der Schlichtungsstelle dürfen nur verläßliche Personen, die mit den Verhältnissen der Land- und Forstwirtschaft und der Jagd vertraut sind und die in dem Gemeindegebiet nicht jagdausübungsberechtigt sind, bestellt werden. Für die Mitglieder ist in gleicher Weise je ein Ersatzmitglied zu bestellen."},{"lvl":0,"sym":"(4)","t":"Wenn der Obmann oder die Beisitzer ihre Obliegenheiten nicht in einer den Bestimmungen dieses Gesetzes entsprechenden Weise versehen, so hat sie der Bürgermeister ihres Amtes zu entheben und an ihrer Stelle eine andere Person zu bestellen (Abs. 3). Gleiches gilt, wenn der Obmann oder die Beisitzer um ihre Enthebung ersuchen."},{"lvl":0,"sym":"(5)","t":"Die Mitgliedschaft in der Schlichtungsstelle ist ein Ehrenamt. Der Obmann und die Beisitzer haben jedoch Anspruch auf Ersatz der mit der Ausübung ihres Amtes verbundenen Kosten."}]},{"id":"78","title":"Verfahren","body":[{"lvl":0,"sym":"(1)","t":"Wenn eine Einigung zwischen dem Geschädigten und dem Jagdausübungsberechtigten nicht zustande kommt, sind Anträge auf Festsetzung des Wild- oder Jagdschadens an die Gemeinde zu richten, in der sich das Jagdgebiet befindet, in dem der Schaden entstanden ist. Die Gemeinde hat den Antrag auf Schadensfestsetzung an die Schlichtungsstelle weiterzuleiten."},{"lvl":0,"sym":"(2)","t":"Das Verfahren vor der Schlichtungsstelle richtet sich nach den Bestimmungen des Allgemeinen Verwaltungsverfahrensgesetzes. Vor der Durchführung des Verfahrens hat die Schlichtungsstelle auf eine gütliche Einigung zwischen den Beteiligten hinzuwirken."},{"lvl":0,"sym":"(3)","t":"Im Verfahren vor der Schlichtungsstelle sind jedenfalls die Grundeigentümer und die Jagdausübungsberechtigten zu hören."},{"lvl":0,"sym":"(4)","t":"Zur Entscheidung der Schlichtungsstelle ist die Mehrheit der Stimmen erforderlich."},{"lvl":0,"sym":"(5)","t":"Die Entscheidung der Schlichtungsstelle bedarf der Schriftform und ist von den Mitgliedern der Schlichtungsstelle zu unterfertigen. Die Entscheidung ist an die Gemeinde weiterzuleiten, die sie den Parteien nachweislich zuzustellen hat."},{"lvl":0,"sym":"(6)","t":"Wird keine Beschwerde beim Landesverwaltungsgericht erhoben, so bildet die Entscheidung der Schlichtungsstelle einen Exekutionstitel im Sinne des § 1 der Exekutionsordnung."}]},{"id":"79","title":"Bestellung eines Bevollmächtigten","body":[{"lvl":0,"sym":"(1)","t":"Zur Empfangnahme von Zustellungen und zu seiner sonstigen Vertretung im Verfahren vor der Schlichtungsstelle hat der Jagdausübungsberechtigte, dessen Wohnsitz sich nicht innerhalb der Gemeinde befindet, für die die Schlichtungsstelle bestimmt ist, einen in dieser Gemeinde wohnhaften Bevollmächtigten zu bestellen und dessen Namen und Wohnort der Gemeinde bekanntzugeben, die hievon den Obmann der Schlichtungsstelle zu verständigen hat."},{"lvl":0,"sym":"(2)","t":"Unterläßt es der Jagdausübungsberechtigte innerhalb einer auf Antrag des Obmannes der Schlichtungsstelle von der Gemeinde festzusetzenden achttägigen Frist, den Bevollmächtigten der Gemeinde bekanntzugeben, so bestimmt diese den Bevollmächtigten und gibt ihn dem Obmann der Schlichtungsstelle sowie dem Jagdausübungsberechtigten bekannt. Dieser Bevollmächtigte ist befugt, den Jagdausübungsberechtigten im Verfahren vor der Schlichtungsstelle solange rechtswirksam zu vertreten, als dieser nicht einen anderen Bevollmächtigten bestellt und der Gemeinde zwecks Verständigung des Obmannes der Schlichtungsstelle bekanntgegeben hat."}]}]},{"nr":10,"title":"Interessenvertretung der Jäger","paras":[{"id":"80","title":"Kärntner Jägerschaft","body":[{"lvl":0,"sym":"(1)","t":"Zur Vertretung der Interessen der in Kärnten die Jagd ausübenden Personen und der Jagdschutzorgane, zur Förderung der Jagd und der Jagdwirtschaft, zur Pflege der Weidgerechtigkeit und zur Erhaltung und Förderung der bodenständigen jagdlichen Sitten und Gebräuche wird die Kärntner Jägerschaft eingerichtet."},{"lvl":0,"sym":"(2)","t":"Die Kärntner Jägerschaft ist eine Körperschaft öffentlichen Rechts; sie hat das Recht zur Führung des Kärntner Landeswappens."},{"lvl":0,"sym":"(3)","t":"Vor der Erlassung von Gesetzen und Verordnungen, die die Jagd berühren, ist die Kärntner Jägerschaft zu hören."}]},{"id":"81","title":"Aufgaben im eigenen Wirkungsbereich","body":[{"lvl":0,"sym":"(1)","t":"Zur Erfüllung der im § 80 Abs. 1 angeführten Ziele obliegt der Kärntner Jägerschaft neben den in diesem Gesetz ausdrücklich angeführten Aufgaben - soweit § 81a nicht anderes bestimmt - im eigenen Wirkungsbereich insbesondere:"},{"lvl":1,"sym":"a)","t":"für die sachgemäße Ausübung der Jagd in Kärnten zu sorgen,"},{"lvl":1,"sym":"b)","t":"ihre Mitglieder in allen jagdlichen und jagdrechtlichen Fragen zu beraten, sie zu weidgerechten Jägern zu erziehen und anzustreben, daß sie nicht gegen die Weidgerechtigkeit und gegen die Standespflichten verstoßen;"},{"lvl":1,"sym":"c)","t":"zu allen die Jagd berührenden Gesetzen und Verordnungen Stellung zu nehmen und diesbezüglich Vorschläge zu unterbreiten, in Fragen der Jagd Gutachten zu erstellen und erfahrene Mitglieder als Jagdsachverständige namhaft zu machen;"},{"lvl":1,"sym":"d)","t":"(entfällt)"},{"lvl":1,"sym":"e)","t":"die Interessen der Jagdschutzorgane wahrzunehmen sowie diese und ihre Hinterbliebenen fallweise zu unterstützen,"},{"lvl":1,"sym":"f)","t":"Einrichtungen zu schaffen und zu betreiben, die der Jagd, der Jagdwissenschaft, der Aus- und Fortbildung von Jungjägern und Jagdschutzorganen dienen, ferner Maßnahmen zur Förderung des jagdlichen Schießwesens sowie Maßnahmen zu treffen, die zur wirksamen Bekämpfung des Wildererunwesens geeignet sind, und die Verhütung von Wildschäden zu fördern;"},{"lvl":1,"sym":"g)","t":"die Jagdhundezucht und Jagdhundeführung zu fördern;"},{"lvl":1,"sym":"h)","t":"Hegeschauen, jagdkulturelle Veranstaltungen, Jägertage, Jagdausstellungen, Jägerschießen u. ä. durchzuführen sowie das jagdliche Brauchtum zu pflegen;"},{"lvl":1,"sym":"i)","t":"für die Mitglieder eine ausreichende Jagdhaftpflichtversicherung gegen Personen- und Sachschäden, sowie eine Unfallversicherung gegen Unfälle, die einem Mitglied zustoßen, abzuschließen;"},{"lvl":1,"sym":"j)","t":"eine Jagdstatistik zu führen;"},{"lvl":1,"sym":"k)","t":"Personen, die sich um die Jagd in Kärnten oder bei Bekämpfung des Wildererunwesens besondere Verdienste erworben haben, zu ehren."},{"lvl":0,"sym":"(1a)","t":"Die sich aus den §§ 38a bis 42 ergebenden Aufgaben der Kärntner Jägerschaft fallen in deren eigenen Wirkungsbereich."},{"lvl":0,"sym":"(2)","t":"Die Kärntner Jägerschaft kann sich mit den Landesjagdverbänden der übrigen Bundesländer zu einem gemeinsamen Jagdverband vereinigen."}]},{"id":"81a","title":"Aufgaben im übertragenen Wirkungsbereich","body":[{"lvl":0,"sym":"","t":"Die Aufgaben, die sich aus den §§ 37, 38, 53, 55a, 55b, 56 bis 61, 63 Abs. 5 und 6, 68 Abs. 3 bis 3b, 3f, 3g und 5, § 69 Abs. 3 letzter Satz, § 95 und § 95a Abs. 2 und 4 letzter Satz ergeben, hat die Kärntner Jägerschaft im übertragenen Wirkungsbereich zu besorgen."}]},{"id":"82","title":"Organisation und Gliederung","body":[{"lvl":0,"sym":"(1)","t":"Die Kärntner Jägerschaft hat ihren Sitz in Klagenfurt."},{"lvl":0,"sym":"(2)","t":"Die Mitglieder der Kärntner Jägerschaft sind die Inhaber der Jagdkarten. Die Mitgliedschaft beginnt mit der Ausfolgung der Jagdkarte und endet drei Monate nach Ablauf ihrer Gültigkeit, mit dem Entzug der Jagdkarte oder durch Ausschluß aus der Kärntner Jägerschaft."},{"lvl":0,"sym":"(3)","t":"Die Kärntner Jägerschaft erfüllt ihre Aufgaben im Landesgebiet, das in Bezirksgruppen (Jagdbezirke) und Hegeringe gegliedert wird."},{"lvl":0,"sym":"(4)","t":"Die Bezirksgruppen (Jagdbezirke) umfassen jeweils das Gebiet eines politischen Bezirkes, wobei die Städte Klagenfurt und Villach den politischen Bezirken Klagenfurt-Land bzw. Villach-Land zugeordnet sind."},{"lvl":0,"sym":"(5)","t":"Die Bezirksgruppen (Jagdbezirke) gliedern sich in Hegeringe. Der Bereich der Hegeringe ist unter Bedachtnahme auf die jagdwirtschaftlichen Erfordernisse und auf die ordnungsgemäße Erfüllung der den Hegeringen übertragenen Aufgaben festzulegen."}]},{"id":"83","title":"Organe der Kärntner Jägerschaft","body":[{"lvl":0,"sym":"(1)","t":"Die Organe der Kärntner Jägerschaft sind die Vollversammlung (der Kärntner Landesjägertag), der Landesvorstand, der Landesausschuß, der Landesjägermeister, die Rechnungsprüfer, der Disziplinarrat und der Disziplinaranwalt."},{"lvl":0,"sym":"(2)","t":"Die Vollversammlung besteht aus den Bezirksjägermeistern und den Delegierten der Bezirksgruppen. Jede Bezirksgruppe entsendet für die ersten 100 Mitglieder und für je 50 weitere Mitglieder einen Delegierten in die Vollversammlung. Besteht nach Errechnung der Delegiertenanzahl ein Mitgliederrest von mehr als 25, so ist ein weiterer Delegierter zu entsenden."},{"lvl":0,"sym":"(3)","t":"Der Vollversammlung obliegen:"},{"lvl":1,"sym":"a)","t":"die Genehmigung des Voranschlages und des Rechnungsabschlusses,"},{"lvl":1,"sym":"b)","t":"die Erlassung einer Satzung,"},{"lvl":1,"sym":"c)","t":"die Festsetzung des Mitgliedsbeitrages auf Vorschlag des Landesvorstandes,"},{"lvl":1,"sym":"d)","t":"die Wahl des Landesjägermeisters und der sonstigen Mitglieder des Landesvorstandes, der Sachbearbeiter (der Referenten) und ihrer Stellvertreter, der Rechnungsprüfer und ihrer Stellvertreter, des Disziplinarrates und des Diziplinaranwaltes und seines Stellvertreters,"},{"lvl":1,"sym":"e)","t":"die Beschlußfassung über Fragen, die der Landesausschuß zur Entscheidung der Vollversammlung vorlegt,"},{"lvl":1,"sym":"f)","t":"die Festsetzung der Versicherungssummen und Prämien für die Jagdhaftpflichtversicherung der Mitglieder sowie die Genehmigung des Abschlusses allfälliger sonstiger Versicherungen für die Mitglieder auf Vorschlag des Landesvorstandes."},{"lvl":0,"sym":"(3a)","t":"Zum Rechnungsprüfer (Stellvertreter), zum Vorsitzenden des Disziplinarrates, zu seinen Stellvertretern und zu sonstigen Mitgliedern des Disziplinarrates sowie zum Disziplinaranwalt (Stellvertreter) ist nur wählbar, wer nicht als sonstiges Organ oder als Mitglied eines Kollegialorgans der Kärntner Jägerschaft gewählt worden ist."},{"lvl":0,"sym":"(4)","t":"Der Landesausschuß setzt sich aus dem Landesvorstand, den Sachbearbeitern und aus den Bezirksjägermeistern zusammen. Der Landesjägermeister und die sonstigen Mitglieder des Landesvorstandes, die Sachbearbeiter und ihre Stellvertreter werden von der Vollversammlung aus den Mitgliedern der Kärntner Jägerschaft auf die Dauer von fünf Jahren gewählt."},{"lvl":0,"sym":"(5)","t":"Dem Landesausschuß obliegen alle der Kärntner Jägerschaft übertragenen Aufgaben, soweit sie durch dieses Gesetz nicht ausdrücklich einem anderen Organ zugewiesen sind. Der Landesausschuß hat das Recht, Angelegenheiten von grundsätzlicher Bedeutung, wie Vorschläge für die Änderung der Jagd- und Schonzeiten, der Vollversammlung zur Entscheidung zu überweisen. Dem Landesausschuß obliegt ferner die Zuerkennung von Aufwandsentschädigungen für Mitglieder von Organen der Kärntner Jägerschaft. Er hat ferner festzulegen, welche seiner Aufgaben den Bezirksausschüssen und den Hegeringleitern zur Besorgung obliegen. Der Landesausschuß kann einzelne seiner Aufgaben einzelnen Sachbearbeitern (Referenten) zur Vorberatung übertragen."},{"lvl":0,"sym":"(6)","t":"Der Landesvorstand besteht aus dem Vorsitzenden (Landesjägermeister), zwei Stellvertretern und fünf weiteren Mitgliedern, von denen eines aus dem Kreis der Jagdschutzorgane zu wählen ist."},{"lvl":0,"sym":"(7)","t":"Dem Landesvorstand obliegen neben der Besorgung der ihm durch dieses Gesetz ausdrücklich übertragenen Aufgaben alle finanziellen Angelegenheiten der Kärntner Jägerschaft, ausgenommen solche der laufenden Geschäftsführung. Er hat insbesondere:"},{"lvl":1,"sym":"a)","t":"den Voranschlag und den Rechnungsabschluß zu erstellen,"},{"lvl":1,"sym":"b)","t":"das Vorschlagsrecht an die Vollversammlung für die Festsetzung des Mitgliedsbeitrages, der Versicherungssummen und Prämien für die Jagdhaftpflichtversicherung sowie hinsichtlich des Abschlusses sonstiger Versicherungen für die Mitglieder,"},{"lvl":1,"sym":"c)","t":"das Vorschlagsrecht an den Landesausschuß hinsichtlich der Aufwandsentschädigungen für Mitglieder von Organen der Kärntner Jägerschaft,"},{"lvl":1,"sym":"d)","t":"die Prüfungskommissionen für die Jagdprüfung zu bestellen,"},{"lvl":1,"sym":"e)","t":"die Wahrung der nach diesem Gesetz der Kärntner Jägerschaft eingeräumten Anhörungsrechte, sofern die Anhörung durch die Landesregierung erfolgt."},{"lvl":0,"sym":"(7a)","t":"Gehört ein Mitglied der Kärntner Jägerschaft einem Kollegialorgan sowohl auf Grund einer Wahl als auch auf Grund seiner Stellung als Organ einer Bezirksgruppe an, so hat es in diesem Kollegialorgan dennoch nur eine Stimme."},{"lvl":0,"sym":"(8)","t":"Der Landesjägermeister vertritt die Kärntner Jägerschaft nach außen, ihm obliegt die laufende Geschäftsführung der Kärntner Jägerschaft. Rechtsverbindliche Äußerungen der Kärntner Jägerschaft sind vom Landesjägermeister und einem weiteren Mitglied des Vorstandes zu unterfertigen. Der Landesjägermeister führt den Vorsitz in der Vollversammlung, im Landesausschuß sowie im Landesvorstand."},{"lvl":0,"sym":"(9)","t":"Die Rechnungsprüfer und ihre Stellvertreter werden von der Vollversammlung aus den Mitgliedern der Kärntner Jägerschaft auf die Dauer von fünf Jahren gewählt. Sie haben die Gebarung der Kärntner Jägerschaft auf ihre ziffernmäßige Richtigkeit, Zweckmäßigkeit und Sparsamkeit zu prüfen und über das Ergebnis ihrer Prüfung der Vollversammlung zu berichten."}]},{"id":"84","title":"Organe der Bezirksgruppen (Jagdbezirke)","body":[{"lvl":0,"sym":"(1)","t":"Die Organe der Bezirksgruppen (Jagdbezirke) sind die Bezirksversammlung (der Bezirksjägertag), der Bezirksausschuß und der Bezirksjägermeister."},{"lvl":0,"sym":"(2)","t":"Die Bezirksversammlung wird aus den Hegeringleitern und den Delegierten der Hegeringe gebildet. Jeder Hegering entsendet für die ersten 50 Mitglieder und für je 25 weitere Mitglieder einen Delegierten in die Bezirksversammlung. Besteht nach Errechnung der Delegiertenanzahl ein Mitgliederrest von mehr als 12, so ist ein weiterer Delegierter zu entsenden."},{"lvl":0,"sym":"(3)","t":"Der Bezirksversammlung obliegt die Wahl des Bezirksjägermeisters sowie der sonstigen Mitglieder des Bezirksausschusses und der Bezirksdelegierten und ihrer Ersatzmänner für die Vollversammlung der Kärntner Jägerschaft sowie die Entgegennahme von Tätigkeitsberichten des Bezirksausschusses."},{"lvl":0,"sym":"(4)","t":"Der Bezirksausschuß besteht aus dem Vorsitzenden (Bezirksjägermeister), seinem Stellvertreter und drei weiteren Mitgliedern. Der Bezirksjägermeister führt in der Bezirksversammlung und im Bezirksausschuß den Vorsitz."},{"lvl":0,"sym":"(5)","t":"Dem Bezirksausschuß obliegen neben der Besorgung der ihm durch dieses Gesetz ausdrücklich übertragenen Aufgaben die Besorgung der ihm vom Landesausschuß übertragenen Aufgaben, die Festsetzung des Bereiches der Hegeringe, die Koordinierung der Tätigkeit der Hegeringe im Bereiche des Bezirkes und die Erstattung von Tätigkeitsberichten an die Bezirksversammlung sowie die Wahrnehmung der nach diesem Gesetz der Kärntner Jägerschaft eingeräumten Anhörungsrechte, sofern die Anhörung durch die Bezirksverwaltungsbehörde erfolgt. Der Bezirksausschuß kann ferner bestimmte seiner Angelegenheiten den Hegeringleitern zur Besorgung übertragen."},{"lvl":0,"sym":"(6)","t":"Dem Bezirksjägermeister obliegt neben der Besorgung der ihm durch dieses Gesetz ausdrücklich aufgetragenen Aufgaben die laufende Geschäftsführung der Bezirksgruppe."},{"lvl":0,"sym":"(7)","t":"Wenn es im Hinblick auf die Größe des Gebietes einer Bezirksgruppe erforderlich erscheint, kann der Bezirksausschuß mit Genehmigung des Landesausschusses für das Gebiet jeweils mehrerer Hegeringe Talschaftsreferenten bestellen. Die Talschaftsreferenten haben für eine reibungslose Verbindung zwischen dem Bezirksausschuß und den Hegeringen zu sorgen. Stellung und Aufgaben der Hegeringleiter werden hiedurch nicht berührt."}]},{"id":"85","title":"Organe der Hegeringe","body":[{"lvl":0,"sym":"(1)","t":"Die Organe des Hegeringes sind die Hegeringversammlung und der Hegeringleiter. Die Hegeringversammlung besteht aus den Mitgliedern der Kärntner Jägerschaft, die im Bereich des Hegeringes ihren Hauptwohnsitz haben oder dort das Jagdausübungsrecht besitzen oder den Jagdschutz ausüben oder einer Jagdgesellschaft im Bereich des Hegeringes angehören. Ergibt sich auf Grund des zweiten Satzes eine Mitgliedschaft in mehr als einem Hegering oder in keinem Hegering, so hat dieses Mitglied der Kärntner Jägerschaft bis 31. Jänner eines Jahres mitzuteilen, in welchem der Hegeringe es künftig seine Mitgliedschaft ausüben will."},{"lvl":0,"sym":"(2)","t":"Die Aufgaben der Hegeringversammlung sind die Wahl des Hegeringleiters und seines Stellvertreters sowie die Wahl der Delegierten und ihrer Ersatzmänner für die Bezirksversammlung, die Veranstaltung der jährlichen Hegeschauen sowie die Veranstaltung von mindestens einem jährlichen Hegeringschießen und die Entgegennahme von Tätigkeitsberichten des Hegeringleiters."},{"lvl":0,"sym":"(3)","t":"Dem Hegeringleiter obliegt neben der Besorgung der ihm durch dieses Gesetz ausdrücklich übertragenen Aufgaben die Besorgung der ihm vom Landesausschuß oder vom Bezirksausschuß übertragenen Aufgaben, die laufende Geschäftsführung des Hegeringes und die Erstattung von Tätigkeitsberichten in der Hegeringversammlung. Der Hegeringleiter führt in der Hegeringversammlung den Vorsitz."}]},{"id":"86","title":"Beschlüsse","body":[{"lvl":0,"sym":"(1)","t":"Die Kollegialorgane der Kärntner Jägerschaft sind beschlußfähig, wenn mehr als die Hälfte der Mitglieder anwesend ist, die Vollversammlung und die Bezirksversammlung überdies nur dann, wenn durch die anwesenden Delegierten mindestens die Hälfte der Bezirksgruppen bzw. der Hegeringe vertreten ist. Sind diese Voraussetzungen bei der Vollversammlung, bei der Bezirksversammlung und bei der Hegeringversammlung nicht gegeben, so sind diese Organe nach Ablauf einer halben Stunde auch dann beschlußfähig, wenn mindestens 20 v. H. ihrer wahlberechtigten Mitglieder anwesend ist, bei der Vollversammlung und bei der Bezirksversammlung überdies nur dann, wenn mindestens 20 v. H. der Bezirksgruppen bzw. der Hegeringe vertreten ist."},{"lvl":0,"sym":"(2)","t":"Für Beschlüsse ist mehr als die Hälfte der abgegebenen Stimmen erforderlich. Der Vorsitzende stimmt zuletzt ab und gibt bei Stimmengleichheit mit seiner Stimme den Ausschlag."},{"lvl":0,"sym":"(3)","t":"Die Erfordernisse für Beschlüsse gelten auch für Wahlen."}]},{"id":"87","title":"Stellvertreter","body":[{"lvl":0,"sym":"","t":"Die Mitglieder der Kollegialorgane und die Organe der Kärntner Jägerschaft sowie die Delegierten werden im Fall ihrer Verhinderung oder ihres vorzeitigen Ausscheidens jeweils von den gewählten Stellvertretern vertreten. Die Vorschriften für die Vertretenen gelten für die Dauer der Vertretung auch für die Stellvertreter."}]},{"id":"88","title":"Satzung","body":[{"lvl":0,"sym":"(1)","t":"In der Satzung der Kärntner Jägerschaft sind die näheren Bestimmungen über die Aufgaben der Organe der Kärntner Jägerschaft, der Bezirksgruppen und der Hegeringe festzulegen und die Geschäftsführung sowie die Einberufung und der Verlauf der Sitzungen der Kollegialorgane in sinngemäßer Anwendung der diesbezüglichen Bestimmungen der Kärntner Allgemeinen Gemeindeordnung, LGBl. Nr. 66/1998, zu regeln. In der Satzung ist sicherzustellen, daß die Mitglieder der Kärntner Jägerschaft ihr Stimmrecht sowie das aktive und passive Wahlrecht nicht in mehreren Hegeringen ausüben. In der Satzung sind auch die näheren Bestimmungen über die Durchführung von Wahlen unter Bedachtnahme auf die Bestimmungen des § 23a Abs. 3 erster bis dritter Satz der Kärntner Allgemeinen Gemeindeordnung, LGBl. Nr. 66/1998, zu regeln. Die Satzung kann anstelle der für die Sitzungen erforderlichen nachweislichen Zustellung der Einladung einschließlich der Tagesordnung eine andere Art der Verständigung"},{"lvl":0,"sym":"","t":"vorsehen, durch die die Verständigung der in Betracht kommenden Sitzungsteilnehmer gewährleistet erscheint. Die Satzung kann für ehemalige Inhaber von Jagdkarten eine außerordentliche Mitgliedschaft zur Kärntner Jägerschaft ohne die in diesem Gesetz geregelten Rechte und Pflichten der Mitglieder vorsehen."},{"lvl":0,"sym":"(2)","t":"Die Satzung ist im Mitteilungsblatt der Kärntner Jägerschaft zu veröffentlichen."},{"lvl":0,"sym":"(3)","t":"Die Satzung ist in ihrer jeweils geltenden Fassung am Sitz der Kärntner Jägerschaft und an den Sitzen der Bezirksgruppen zur Einsichtnahme durch die Mitglieder der Kärntner Jägerschaft aufzulegen."}]},{"id":"88a","title":"Kundmachung von Verordnungen","body":[{"lvl":0,"sym":"(1)","t":"Verordnungen des Landesvorstandes der Kärntner Jägerschaft und Verordnungen der Vollversammlung der Kärntner Jägerschaft gemäß § 42 Abs. 2 sind im Kundmachungsblatt der Kärntner Jägerschaft kundzumachen."},{"lvl":0,"sym":"(2)","t":"Das Kundmachungsblatt der Kärntner Jägerschaft ist am Sitz der Kärntner Jägerschaft und an den Sitzen der Bezirksgruppen sowie bei jedem Gemeindeamt während der für den Parteienverkehr bestimmten Stunden für jedermann zur Einsicht aufzulegen. Jedermann hat das Recht, bei diesen Stellen gegen Ersatz der Kosten Kopien zu erhalten, wenn geeignete technische Einrichtungen vorhanden sind."},{"lvl":0,"sym":"(3)","t":"Die verbindende Kraft einer im Kundmachungsblatt der Kärntner Jägerschaft verlautbarten Verordnung beginnt, wenn nicht ausdrücklich ein späterer Zeitpunkt bestimmt ist, mit Ablauf des Tages, an dem das Stück des Kundmachungsblattes, das die Kundmachung enthält, herausgegeben wird, und erstreckt sich, wenn nicht ausdrücklich anderes bestimmt ist, auf das gesamte Landesgebiet."},{"lvl":0,"sym":"(4)","t":"Der Tag der Herausgabe des Kundmachungsblattes der Kärntner Jägerschaft ist auf jedem Stück anzugeben; an diesem Tag hat auch die Versendung zu erfolgen."},{"lvl":0,"sym":"(5)","t":"Die einzelnen Stücke des Kundmachungsblattes der Kärntner Jägerschaft sind für jedes Kalenderjahr, beginnend mit der Zahl 1, fortlaufend zu nummerieren. Die in den einzelnen Stücken des Kundmachungsblattes der Kärntner Jägerschaft enthaltenen Kundmachungen sind für jedes Kalenderjahr, beginnend mit der Zahl 1, fortlaufend zu nummerieren."}]},{"id":"88b","title":"Verfahrensrecht","body":[{"lvl":0,"sym":"","t":"In den Verfahren nach den §§ 53, 61a Abs. 4, 63 Abs. 5 und 6, 68 Abs. 3, 68 Abs. 3f und 68 Abs. 3g sind die Verwaltungsverfahrensgesetze und in den Verfahren nach den §§ 37 bis 42 die Verwaltungsverfahrensgesetze, ausgenommen §§ 77 und 78 des Allgemeinen Verwaltungsverfahrensgesetzes 1991, anzuwenden."}]},{"id":"89","title":"Rechte und Pflichten der Mitglieder","body":[{"lvl":0,"sym":"(1)","t":"Die Mitglieder der Kärntner Jägerschaft sind berechtigt, von den Einrichtungen der Kärntner Jägerschaft Gebrauch zu machen. Sie haben das aktive und das passive Wahlrecht hinsichtlich der Organe der Kärntner Jägerschaft im Rahmen der Bestimmungen dieses Gesetzes."},{"lvl":0,"sym":"(2)","t":"Die Mitglieder der Kärntner Jägerschaft sind zur Beitragsleistung an die Kärntner Jägerschaft verpflichtet."},{"lvl":0,"sym":"(3)","t":"Die Höhe des Beitrages wird von der Vollversammlung der Kärntner Jägerschaft auf Vorschlag des Landesvorstandes unter Bedachtnahme auf die der Kärntner Jägerschaft obliegenden Aufgaben festgesetzt."},{"lvl":0,"sym":"(4)","t":"Der Beitrag für die Kärntner Jägerschaft und die Beiträge für die Jagdhaftpflichtversicherung und die Unfallversicherung (§ 81 Abs. 1 lit. i) werden mit dem Jagdkartenbeitrag eingehoben."},{"lvl":0,"sym":"(5)","t":"Die Mitglieder der Kärntner Jägerschaft sind zum verlässlichen und sachgemäßen Umgang mit ihren Jagdwaffen verpflichtet. Sie haben ihre Jagdwaffe regelmäßig auf ihre Sicherheit und Präzision zu überprüfen und ihre Schießfertigkeit regelmäßig so zu üben, daß sie die Jagd sachgemäß und weidgerecht ausüben können. Bei der Ausfolgung einer Jagdgastkarte ist der Jagdausübungsberechtigte verpflichtet, sich davon zu überzeugen, daß die Jagdgäste zum sachgemäßen und weidgerechten Umgang mit einer Jagdwaffe befähigt sind."},{"lvl":0,"sym":"(6)","t":"Die Mitglieder der Kärntner Jägerschaft sind verpflichtet, jährlich einmal an einem Hegeringschießen (§ 85 Abs. 2) teilzunehmen, im Fall der Verhinderung sich einer dem Hegeringschießen vergleichbaren Übung der Schießfertigkeit an einer behördlich genehmigten Schießstätte zu unterziehen und dies vom Betreiber bestätigen zu lassen."}]},{"id":"90","title":"Disziplinarrecht, Disziplinaranwalt, Disziplinarverfahren","body":[{"lvl":0,"sym":"(1)","t":"Vergehen der Mitglieder der Kärntner Jägerschaft gegen die Standespflichten, die nicht länger als fünf Jahre vom Zeitpunkt der ersten Verfolgungshandlung (Ladung, Vernehmung, Ersuchen um Vernehmung) zurückliegen, werden von einem Disziplinarrat der Kärntner Jägerschaft durch Disziplinarstrafen geahndet. In die Frist von fünf Jahren sind Zeiten von bis zu zehn Jahren nicht einzurechnen, in denen keine Mitgliedschaft zur Kärntner Jägerschaft besteht. Der Disziplinarrat hat seinen Sitz in Klagenfurt."},{"lvl":0,"sym":"(2)","t":"Ein Vergehen gegen die Standespflichten liegt vor, wenn ein Mitglied der Kärntner Jägerschaft wiederholt oder gröblich jagdrechtliche Vorschriften übertritt, Grundsätze der Weidgerechtigkeit mißachtet oder die Satzungen und Interessen der Kärntner Jägerschaft verletzt."},{"lvl":0,"sym":"(3)","t":"Der Disziplinaranwalt hat jedes Vergehen gegen die Standespflichten (Abs. 1 und 2), das ihm zur Kenntnis gelangt, auf die Voraussetzungen für ein Disziplinarverfahren zu prüfen und sodann die Unterlagen mit seinen Anträgen dem Disziplinarrat zu übermitteln. Der Disziplinaranwalt ist von der Vollversammlung aus dem Kreis der rechtskundigen Mitglieder der Kärntner Jägerschaft auf die Dauer von fünf Jahren zu wählen."},{"lvl":0,"sym":"(4)","t":"Der Disziplinarrat besteht aus dem Vorsitzenden, seinen Stellvertretern und der erforderlichen Anzahl von Mitgliedern. Diese sind von der Vollversammlung aus dem Kreis der Mitglieder der Kärntner Jägerschaft auf die Dauer von fünf Jahren zu wählen, wobei jedenfalls der Vorsitzende und der Stellvertreter aus dem Kreis der rechtskundigen Mitglieder zu wählen sind. Der Disziplinarrat verhandelt und entscheidet in Senaten, die aus einem Senatsvorsitzenden und zwei weiteren Mitgliedern bestehen. Die Senate sind vom Landesvorstand vor Jahresschluß für die Dauer des ganzen folgenden Jahres bleibend zusammenzusetzen. Zugleich ist die Reihenfolge zu bestimmen, in der die übrigen Mitglieder bei der Verhinderung eines Senatsmitgliedes als Ersatzmänner in die Senate eintreten."},{"lvl":0,"sym":"(5)","t":"Der Disziplinarrat hat über die vom Disziplinaranwalt übermittelten Anzeigen (Abs. 3) das Disziplinarverfahren zu eröffnen und ein Ermittlungsverfahren durchzuführen. Nach Abschluß des Ermittlungsverfahrens hat der Disziplinarrat zu beschließen, ob das Verfahren einzustellen oder weiterzuführen ist. Der Verfolgung durch den Disziplinarrat steht der Umstand nicht entgegen, daß dieselbe Handlung oder Unterlassung auch von einem Gericht oder einer Verwaltungsbehörde zu bestrafen ist. Das Verfahren darf unterbrochen werden, wenn über dieselbe Tathandlung ein Strafverfahren vor einem Gericht anhängig ist."},{"lvl":0,"sym":"(6)","t":"Disziplinarstrafen sind:"},{"lvl":1,"sym":"a)","t":"der einfache Verweis,"},{"lvl":1,"sym":"b)","t":"der strenge Verweis,"},{"lvl":1,"sym":"c)","t":"der Ausschluß aus der Kärntner Jägerschaft auf bestimmte Zeit,"},{"lvl":1,"sym":"d)","t":"der Ausschluß aus der Kärntner Jägerschaft auf Dauer."},{"lvl":0,"sym":"(7)","t":"(entfällt)"},{"lvl":0,"sym":"(8)","t":"Für das Verfahren vor dem Disziplinarrat sind die Bestimmungen des Allgemeinen Verwaltungsverfahrensgesetzes 1991, BGBl Nr 51, zuletzt geändert durch BGBl. I Nr. 88/2023, anzuwenden."}]},{"id":"90a","title":"Verfahren vor dem Landesverwaltungsgericht","body":[{"lvl":0,"sym":"(1)","t":"Über Beschwerden gegen Entscheidungen des Disziplinarrates entscheidet das Landesverwaltungsgericht durch Senat."},{"lvl":0,"sym":"(2)","t":"An der Senatsentscheidung hat ein fachkundiger Laienrichter aus dem Kreis der Mitglieder der Kärntner Jägerschaft mitzuwirken."},{"lvl":0,"sym":"(3)","t":"Zur Vorbereitung der Bestellung des fachkundigen Laienrichters und eines Ersatzmitgliedes hat die Landesregierung Vorschläge der Vollversammlung der Kärntner Jägerschaft einzuholen."},{"lvl":0,"sym":"(4)","t":"Dem Disziplinaranwalt kommt das Recht zu, gegen Entscheidungen des Disziplinarrates Beschwerde an das Landesverwaltungsgericht und Revision an den Verwaltungsgerichtshof zu erheben."}]},{"id":"90b","title":"Informationspflicht","body":[{"lvl":0,"sym":"(1)","t":"Der Disziplinarrat – im Fall einer Entscheidung nach § 90a das Landesverwaltungsgericht – hat rechtskräftige Ausschlüsse von Mitgliedern aus der Kärntner Jägerschaft auf bestimmte Zeit (§ 90 Abs. 6 lit. c) oder auf Dauer (§ 90 Abs. 6 lit. d)"},{"lvl":1,"sym":"1.","t":"der gemäß § 23 dieses Gesetzes sowie der gemäß § 27 Abs. 1 Verwaltungsstrafgesetz 1991 – VStG zuständigen Bezirksverwaltungsbehörde,"},{"lvl":1,"sym":"2.","t":"der Kärntner Jägerschaft und dem gemäß § 37 Abs. 2 zuständigen Bezirksjägermeister,"},{"lvl":1,"sym":"3.","t":"Landesjagdverbänden anderer Bundesländer, auf deren begründetes Ersuchen hin, und"},{"lvl":1,"sym":"4.","t":"dem Jagdausübungsberechtigten sowie dem Verpächter einer Gemeindejagd oder einer Eigenjagd, in der das ausgeschlossene Mitglied in der laufenden Abschussplanperiode einen Jagderlaubnisschein hat oder das Jagdausübungsrecht besitzt,"},{"lvl":0,"sym":"","t":"zum Zwecke der Verhinderung der rechtswidrigen weiteren Jagdausübung unter Einhaltung der datenschutzrechtlichen Vorgaben zu melden. Den Stellen gemäß Z 1 und 2 ist überdies der Wortlaut der rechtskräftigen Entscheidung über den Ausschluss bekannt zu geben."},{"lvl":0,"sym":"(2)","t":"Die Kärntner Jägerschaft hat zu Beginn eines jeden Halbjahres statistische Daten des vorangegangenen Halbjahres betreffend die Anzahl der durchgeführten Disziplinarverfahren sowie über die Anzahl der einzelnen Arten der verhängten Disziplinarstrafen (§ 90 Abs. 6) im Mitteilungsblatt der Kärntner Jägerschaft zu veröffentlichen. Sie hat darin auch regelmäßig ausgewählte Beispiele für Disziplinarverfahren wie auch für verhängte Strafen in anonymisierter Form zu veröffentlichen."}]},{"id":"91","title":"Aufsicht","body":[{"lvl":0,"sym":"(1)","t":"Die Kärntner Jägerschaft untersteht der Aufsicht der Kärntner Landesregierung."},{"lvl":0,"sym":"(2)","t":"In Ausübung ihres Aufsichtsrechtes hinsichtlich des eigenen Wirkungsbereiches der Kärntner Jägerschaft (§ 81 Abs. 1 und Abs. 1a) hat die Landesregierung das Recht,"},{"lvl":1,"sym":"a)","t":"darüber zu wachen, daß die Kärntner Jägerschaft ihre Aufgaben erfüllt,"},{"lvl":1,"sym":"b)","t":"entfällt,"},{"lvl":1,"sym":"c)","t":"Entscheidungen der Organe der Kärntner Jägerschaft aufzuheben, wenn diese ihren Wirkungskreis überschreiten oder sonst gegen Gesetze verstoßen,"},{"lvl":1,"sym":"d)","t":"sich im Wege des Landesjägermeisters über Jagdangelegenheiten der Kärntner Jägerschaft zu unterrichten,"},{"lvl":1,"sym":"e)","t":"bei Verletzung des Gebotes der Sparsamkeit, Wirtschaftlichkeit und Zweckmäßigkeit die zur Abhilfe erforderlichen Maßnahmen zu treffen."},{"lvl":0,"sym":"(3)","t":"In Ausübung ihres Aufsichtsrechtes hinsichtlich der Aufgaben des übertragenen Wirkungsbereiches (§ 81a) hat die Landesregierung"},{"lvl":1,"sym":"a)","t":"die Aufsichtsrechte nach Abs. 2;"},{"lvl":1,"sym":"b)","t":"das Recht, den zuständigen Organen der Kärntner Jägerschaft allgemeine Weisungen oder Weisungen im Einzelfall zu erteilen; dies gilt nicht für die Prüfung der jagdlichen Eignung und der erforderlichen Kenntnisse nach § 37 Abs. 6 bis 8;"},{"lvl":1,"sym":"c)","t":"Auskunftsrechte (Abs. 4), das Recht, die Einberufung von Sitzungen des Landesvorstandes zu verlangen (Abs. 5), Verordnungen aufzuheben (Abs. 6), Bescheide aufzuheben (Abs. 7) und das Recht der Ersatzvornahme (Abs. 8)."},{"lvl":0,"sym":"(4)","t":"Der Landesjägermeister ist verpflichtet, der Landesregierung beschlussreife Entwürfe von Verordnungen - ausgenommen Verordnungen nach § 88 - vor der Beschlussfassung im Landesvorstand zu übermitteln. Die Organe der Kärntner Jägerschaft sind verpflichtet, der Landesregierung im Rahmen der ihnen obliegenden Aufgaben die im Einzelfall verlangten Auskünfte zu erteilen und die bezughabenden Unterlagen vorzulegen."},{"lvl":0,"sym":"(5)","t":"Auf Verlangen der Landesregierung hat der Landesjägermeister den Landesvorstand der Kärntner Jägerschaft zu einer Sitzung einzuberufen, die innerhalb
