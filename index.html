":"Eine gültige Jagdkarte wird ungültig, wenn die Eintragungen, Unterschriften oder Stempel oder die Bestätigungen über die Einzahlung des Jagdkartenbeitrages, des Mitgliedsbeitrages zur Kärntner Jägerschaft und der Prämie für die Jagdhaftpflichtversicherung unkenntlich geworden sind, das Lichtbild fehlt oder den Inhaber nicht mehr einwandfrei erkennen läßt oder Beschädigungen oder Merkmale ihre Vollständigkeit, Einheit oder Echtheit in Frage stellen."},{"lvl":0,"sym":"(3)","t":"Nach Abs. 2 ungültig gewordene Jagdkarten sind unverzüglich dem Bezirksjägermeister vorzulegen und von ihm deutlich als ungültig zu kennzeichnen."}]},{"id":"38b","title":"Jagdkartenbeitrag","body":[{"lvl":0,"sym":"(1)","t":"Der Inhaber einer Jagdkarte, der beabsichtigt, die Jagd auszuüben, ist verpflichtet, an die Kärntner Jägerschaft einen jährlichen Jagdkartenbeitrag zu entrichten."},{"lvl":0,"sym":"(2)","t":"Die Höhe des Jagdkartenbeitrages beträgt"},{"lvl":1,"sym":"a)","t":"bei Inländern und sonstigen Staatsangehörigen eines Mitgliedstaates der Europäischen Union oder eines Vertragsstaates des Abkommens über den Europäischen Wirtschaftsraum 13 Euro;"},{"lvl":1,"sym":"b)","t":"bei einkommensteuerpflichtigen Ausländern, ausgenommen Staatsangehörige eines Mitgliedstaates der Europäischen Union oder eines Vertragsstaates des Abkommens über den Europäischen Wirtschaftsraum, 26 Euro;"},{"lvl":1,"sym":"c)","t":"bei nicht einkommensteuerpflichtigen Ausländern, ausgenommen Staatsangehörige eines Mitgliedstaates der Europäischen Union oder eines Vertragsstaates des Abkommens über den Europäischen Wirtschaftsraum, 37 Euro;"},{"lvl":1,"sym":"d)","t":"bei Jagdschutzorganen und Jagdpraktikanten 8 Euro."},{"lvl":0,"sym":"(3)","t":"Der Landesvorstand der Kärntner Jägerschaft hat die im Abs. 2 festgelegten Beiträge durch Verordnung entsprechend den Änderungen des vom Österreichischen Statistischen Zentralamt vorgelegten Verbraucherpreisindexes 2000 oder eines jeweils an seine Stelle tretenden Indexes neu festzusetzen, wenn die Änderung dieses Indexes seit der letztmaligen Festsetzung mindestens 5 v.H. beträgt; diese Verordnungen sind jeweils mit dem Beginn des der Indexänderung folgenden Kalenderjahres in Kraft zu setzen."},{"lvl":0,"sym":"(4)","t":"Der Jagdkartenbeitrag ist vor dem Zeitpunkt zu entrichten, ab dem der Inhaber der Jagdkarte die Jagd ausübt."}]},{"id":"39","title":"Entziehung der Jagdkarte","body":[{"lvl":0,"sym":"","t":"Wenn beim Inhaber einer Jagdkarte eine der Voraussetzungen des § 37 nachträglich wegfällt, hat der Bezirksjägermeister die Jagdkarte zu entziehen. Ein Anspruch auf Erstattung des Jagdkartenbeitrages besteht nicht. Entzogene Jagdkarten sind unverzüglich dem Bezirksjägermeister vorzulegen und von diesem als ungültig zu kennzeichnen."}]},{"id":"40","title":"Jagdgastkarten","body":[{"lvl":0,"sym":"(1)","t":"Der Jagdausübungsberechtigte darf Jagdgastkarten ausfolgen"},{"lvl":1,"sym":"a)","t":"an Personen, die eine in einem anderen Bundesland mindestens für die Dauer eines Jahres gültige Jagdkarte besitzen, oder"},{"lvl":1,"sym":"b)","t":"an Personen, die ihren Hauptwohnsitz im Ausland haben und den Besitz einer gültigen ausländischen Jagdkarte oder einer Bescheinigung, die gleichartige Rechte vermittelt, nachweisen, wenn sie dem Jagdausübungsberechtigten den Abschluß einer ausreichenden Jagdhaftpflichtversicherung bei einer Versicherungsanstalt, die ihren Sitz in Österreich oder in einem Vertragsstaat des Abkommens über den Europäischen Wirtschaftsraum oder der Europäischen Union oder in der Schweiz hat, nachweisen."},{"lvl":0,"sym":"(2)","t":"Die Jagdgastkarten gelten für das gesamte Landesgebiet, und zwar entweder für die Dauer von drei Tagen oder von zwei Wochen, gerechnet vom Tag der Weitergabe an den Jagdgast."},{"lvl":0,"sym":"(3)","t":"Formulare der Jagdgastkarten sind vom Bezirksjägermeister auf Antrag dem Jagdausübungsberechtigten auszufolgen und haben auf dessen Namen zu lauten. Der Bezirksjägermeister hat den Tag und das Jahr der Ausfolgung des Formulars auf diesem zu vermerken. Der Jagdausübungsberechtigte hat den Name und den Hauptwohnsitz des Jagdgastes sowie den Tag der Ausfolgung der Jagdgastkarte an den Jagdgast in der Jagdgastkarte einzutragen. Der Jagdgast hat seine eigenhändige Unterschrift beizusetzen. Nicht vollständig ausgefüllte Jagdgastkarten, Jagdgastkarten, für die Formulare verwendet werden, die dem § 40 Abs. 8 nicht entsprechen, oder Jagdgastkarten, auf denen die Bestätigung des Jagdausübungsberechtigten gemäß § 40a Abs. 4 fehlt, sind ungültig."},{"lvl":0,"sym":"(4)","t":"Der Jagdausübungsberechtigte hat innerhalb von zwei Wochen nach Ablauf des Jagdjahres dem Bezirksjägermeister ein Verzeichnis über die von ihm im abgelaufenen Jagdjahr ausgegebenen Jagdgastkarten vorzulegen, aus dem Name und Wohnsitz des Jagdgastes ersichtlich sind."},{"lvl":0,"sym":"(5)","t":"An die im § 38 bezeichneten Personen dürfen Jagdgastkarten nicht ausgefolgt werden."},{"lvl":0,"sym":"(6)","t":"Der Bezirksjägermeister kann dem Jagdausübungsberechtigten die Ausstellung von Jagdgastkarten für einen Zeitraum bis zu drei Jahren untersagen oder bereits ausgegebene, jedoch noch nicht an den Jagdgast ausgefolgte Jagdgastkarten vom Jagdausübungsberechtigten einziehen, wenn dieser wegen Übertretung der Vorschriften über die Jagdgastkarten bestraft wurde. Die dreijährige Frist beginnt mit der Rechtskraft des bezüglichen Straferkenntnisses zu laufen."},{"lvl":0,"sym":"(7)","t":"Die Jagdhaftpflichtversicherung hat sich auf alle Schäden zu erstrecken, die vom Inhaber einer Kärntner Jagdkarte durch den Besitz oder Gebrauch von Jagdwaffen und Jagdhunden, durch Verwendung von Fanggeräten und durch die Errichtung und den Bestand von Jagdeinrichtungen verursacht werden."},{"lvl":0,"sym":"(8)","t":"Für die Ausstellung der Jagdgastkarten sind einheitliche Formulare (§ 42 Abs. 1) zu verwenden."}]},{"id":"40a","title":"Jagdgastkartenbeitrag","body":[{"lvl":0,"sym":"(1)","t":"Der Inhaber einer Jagdgastkarte ist verpflichtet, für jede ausgefolgte Jagdgastkarte einen Jagdgastkartenbeitrag an die Kärntner Jägerschaft zu entrichten."},{"lvl":0,"sym":"(2)","t":"Der Jagdgastkartenbeitrag beträgt für Jagdgastkarten mit einer Dauer von drei Tagen 10 Euro und für Jagdgastkarten mit einer Dauer von zwei Wochen 20 Euro. § 38b Abs. 3 gilt sinngemäß."},{"lvl":0,"sym":"(3)","t":"Der Jagdgastkartenbeitrag ist bei Ausfolgung der Jagdgastkarte zu entrichten."},{"lvl":0,"sym":"(4)","t":"Der Jagdausübungsberechtigte hat den Jagdgastkartenbeitrag vom Jagdgast einzuheben und auf der Jagdgastkarte zu bestätigen, daß der Beitrag entrichtet wurde."},{"lvl":0,"sym":"(5)","t":"Der Jagdausübungsberechtigte hat binnen zwei Wochen nach Ausfolgung der Jagdgastkarte an einen Jagdgast die eingehobenen Jagdgastkartenbeiträge an die Kärntner Jägerschaft abzuführen."}]},{"id":"41","title":"Jagderlaubnis","body":[{"lvl":0,"sym":"(1)","t":"Wer nicht in Begleitung des Jagdausübungsberechtigten oder – mit Zustimmung des Jagdausübungsberechtigten – auch in Begleitung dessen Jagdschutzorganes jagt, muß neben einer gültigen Kärntner Jagdkarte oder Jagdgastkarte eine auf seinen Namen lautende, vom Jagdausübungsberechtigten erteilte schriftliche Bewilligung mit sich führen (Jagderlaubnisschein). Auch ein Jagdschutzorgan, das nicht Aufgaben nach § 43 erfüllt, sondern ohne Begleitung des Jagdausübungsberechtigten jagt, muß – soferne es nicht selbst jagdausübungsberechtigt ist – einen Jagderlaubnisschein mit sich führen. Für die Teilnahme an Gesellschaftsjagden ist ein Jagderlaubnisschein nicht erforderlich. § 36 Abs. 4 gilt sinngemäß."},{"lvl":0,"sym":"(2)","t":"Zur Ausstellung von Jagderlaubnisscheinen mit einer Gültigkeit von mehr als einer Woche ist die Genehmigung des Bezirksjägermeisters erforderlich. Dies gilt nicht für die Ausstellung von Jagderlaubnisscheinen an Jagdschutzorgane oder die Mitglieder einer Jagdgesellschaft. Bei der Erteilung der Genehmigung ist auf die Bestimmungen des § 19 Bedacht zu nehmen."},{"lvl":0,"sym":"(3)","t":"Der Jagdausübungsberechtigte hat dem Bezirksjägermeister die erfolgte Ausstellung aller Jagderlaubnisscheine mit einer Gültigkeitsdauer von mehr als einer Woche – ist der Jagdausübungsberechtigte Pächter des Jagdausübungsrechtes in einer Gemeindejagd, die erfolgte Ausstellung aller Jagderlaubnisscheine – zu melden. Die Meldung hat die Berechtigten, ihren Hauptwohnsitz, den Jagdausübungsberechtigten, die Bezeichnung des Jagdgebietes und die Gültigkeitsdauer der Jagderlaubnis zu enthalten."},{"lvl":0,"sym":"(4)","t":"Für Jagdgebiete, für die ein Jagdverwalter (§ 34) zu bestellen ist, dürfen Jagderlaubnisscheine nicht ausgegeben werden."},{"lvl":0,"sym":"(5)","t":"Für die Ausstellung der Jagderlaubnisscheine sind einheitliche, fortlaufend numerierte Formulare zu verwenden (§ 42 Abs. 1)."}]},{"id":"42","title":"Durchführungsbestimmungen","body":[{"lvl":0,"sym":"(1)","t":"Der Landesvorstand der Kärntner Jägerschaft hat Form und Inhalt der Formulare der Jagdkarten, der Jagdgastkarten und der Jagderlaubnisscheine unter Bedachtnahme auf die entsprechenden Bestimmungen dieses Abschnittes mit Verordnung zu regeln. Bei der Gestaltung der Jagdkarten ist darauf Bedacht zu nehmen, daß die Bestätigung für die Bezahlung des Jagdkartenbeitrages, des Mitgliedsbeitrages zur Kärntner Jägerschaft und der Prämie für die Jagdhaftpflichtversicherung (§ 38a Abs. 2) als Voraussetzung für die Gültigkeit der Jagdkarte mitzuführen ist (§ 38a Abs. 1)."},{"lvl":0,"sym":"(2)","t":"Der Landesvorstand der Kärntner Jägerschaft hat durch Verordnung unter Bedachtnahme auf die schutzwürdigen Interessen der durch die Jagdausübung Geschädigten und auf die Eigenart der Jagdausübung die Mindestversicherungssummen für die Jagdhaftpflichtversicherung zu bestimmen."}]}]},{"nr":6,"title":"Jagd- und Wildschutz","paras":[{"id":"43","title":"Verpflichtung zum Jagdschutz","body":[{"lvl":0,"sym":"(1)","t":"Der Jagdausübungsberechtigte hat für einen regelmäßigen, dauernden und ausreichenden Jagdschutz zu sorgen. Hierbei ist auf die für die Überwachung gemäß Abs. 2 maßgeblichen Verhältnisse, insbesondere die Größe und Gestalt des Jagdgebietes, den Wildbestand, die Gefährdungen, denen das Wild ausgesetzt ist, Wildfütterungen sowie die Wildschadensanfälligkeit des Lebensraumes Bedacht zu nehmen."},{"lvl":0,"sym":"(2)","t":"Der Jagdschutz umfaßt die Überwachung der Einhaltung der in einem Jagdgebiet zu beobachtenden Bestimmungen dieses Gesetzes sowie der auf ihrer Grundlage erlassenen Verordnungen und behördlichen Anordnungen sowie die Überwachung der Einhaltung der auch in einem Jagdgebiet zu beobachtenden, zum Schutz von Tieren und von Pflanzen getroffenen landesrechtlichen Bestimmungen, den Schutz des Wildes im Sinne des § 4 und vor Futternot sowie vor Wilderern."},{"lvl":0,"sym":"(3)","t":"Der Jagdschutz ist von Jagdschutzorganen (§ 44) auszuüben."},{"lvl":0,"sym":"(4)","t":"(entfällt)"}]},{"id":"44","title":"Bestellung der Jagdschutzorgane","body":[{"lvl":0,"sym":"(1)","t":"Jagdschutzorgane sind die Berufsjäger und die Jagdaufseher im Sinne des Gesetzes über die Berufsjägerprüfung und die Jagdaufseherprüfung, LGBl Nr 50/1971. Zu hauptberuflichen Jagdschutzorganen dürfen nur Berufsjäger bestellt werden."},{"lvl":0,"sym":"(2)","t":"Die Eigentümer von Eigenjagden, die das Jagdausübungsrecht nicht verpachtet haben, die Pächter von Eigenjagden oder Gemeindejagden sowie die Gemeinde, für deren Gemeindejagd ein Jagdverwalter bestellt wurde, sind verpflichtet, in entsprechender Anzahl (Abs. 5 bis 8) Vorschläge für die Bestellung von Jagdschutzorganen durch die Bezirksverwaltungsbehörde zu machen."},{"lvl":0,"sym":"(3)","t":"Wenn keine Bedenken bestehen, können Jagdverwalter (§ 34) und Jagdausübungsberechtigte, vorausgesetzt, daß auch sie den Erfordernissen des § 46 entsprechen, als Jagdschutzorgane bestellt und angelobt werden. Sie können jedoch nur dann auf den Stand der nach Abs. 2 in entsprechender Zahl für das Jagdgebiet zu bestellenden Jagdschutzorgane angerechnet werden, wenn sie Gewähr dafür bieten, daß sie das Jagdgebiet ausreichend und dauernd beaufsichtigen."},{"lvl":0,"sym":"(4)","t":"Mit Genehmigung der Bezirksverwaltungsbehörde können Jagdgebiete, die in einem räumlichen Naheverhältnis zueinander stehen, durch gemeinsame Jagdschutzorgane beaufsichtigt werden, wenn ein regelmäßiger, dauernder und ausreichender Jagdschutz, insbesondere unter Bedachtnahme auf die Zahl der Jagdschutzorgane und deren Wohnsitz und Beruf, gewährleistet ist. In diesem Fall sind übereinstimmende Vorschläge (Abs. 2) der Jagdausübungsberechtigten Voraussetzung für die Bestellung durch die Bezirksverwaltungsbehörde. Vor der Bestellung ist der nach der Lage der Jagdgebiete in Betracht kommende Bezirksjägermeister zu hören."},{"lvl":0,"sym":"(5)","t":"Ein nebenberufliches Jagdschutzorgan darf höchstens 1500 ha eines Jagdgebietes oder, falls die Voraussetzungen gemäß Abs. 4 vorliegen, mehrerer Jagdgebiete betreuen."},{"lvl":0,"sym":"(6)","t":"Für Jagdgebiete über 2000 ha, die vorwiegend aus Waldungen bestehen, und für alle Jagdgebiete über 3000 ha ist mindestens ein hauptberufliches Jagdschutzorgan zu bestellen."},{"lvl":0,"sym":"(7)","t":"Sind mehrere benachbarte Jagdgebiete in einer Hand vereinigt, oder soll gemäß Abs. 4 für mehrere Jagdgebiete ein gemeinsames Jagdschutzorgan bestellt werden, so ist das gesamte Flächenausmaß dieser Jagdgebiete für die Bestellung eines hauptberuflichen Jagdschutzorganes entscheidend."},{"lvl":0,"sym":"(8)","t":"Forstschutzorgane, die die gleichen fachlichen Voraussetzungen wie Berufsjäger erfüllen, und Forstorgane dürfen, wenn sie im Jagdgebiet neben ihrer hauptberuflichen Tätigkeit auch als Jagdschutzorgan tätig sind, anstelle eines Berufsjägers jeweils höchstens 1500 ha dieses Jagdgebietes – in den Fällen des Abs. 4 auch mehrere Jagdgebiete – betreuen."},{"lvl":0,"sym":"(9)","t":"Die Bezirksverwaltungsbehörde kann in den Fällen der Abs. 5 und 6 die Erstattung von Vorschlägen für die Bestellung weiterer Jagdschutzorgane anordnen, wenn dies im Hinblick auf die Größe, die Art und die Beschaffenheit des Jagdgebietes im Interesse eines geordneten Jagdbetriebes erforderlich erscheint. Sie kann auch Ausnahmen von den Bestimmungen der Abs. 6 und 8 zulassen, wenn und solange hiedurch der geordnete Jagdbetrieb nicht gefährdet ist. Vor Maßnahmen nach dem ersten und zweiten Satz ist die Kärntner Jägerschaft zu hören."},{"lvl":0,"sym":"(10)","t":"Wenn der Jagdausübungsberechtigte trotz einmaliger nachweislicher Aufforderung für einen ausreichenden Jagdschutz nicht dadurch Vorsorge trifft, daß er in ausreichender Anzahl Vorschläge für die Bestellung von Jagdschutzorganen (Abs. 1 und 9) macht, hat die Bezirksverwaltungsbehörde auf seine Rechnung Jagdschutzorgane ohne Bedachtnahme auf Vorschläge zu bestellen."}]},{"id":"45","title":"Bestellungsdauer, Angelobung","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdausübungsberechtigten sind verpflichtet, der Bezirksverwaltungsbehörde, in deren Bereich das Jagdgebiet oder ein Teil davon liegt, Name, Beruf und Anschrift der vorgeschlagenen Jagdschutzorgane, das Gebiet, in dem der Jagdschutzdienst ausgeübt werden soll, und die Art der Ausübung des Jagdschutzdienstes (§ 44 Abs. 1) mitzuteilen."},{"lvl":0,"sym":"(2)","t":"Die Bestellung eines Jagdschutzorganes hat – soweit § 44 Abs. 10 nicht anderes bestimmt – auf der Grundlage der Vorschläge des Jagdausübungsberechtigten durch die Bezirksverwaltungsbehörde zu erfolgen. Die Bestellung darf dann nicht erfolgen, wenn hinsichtlich einer vorgeschlagenen Person eine der im § 46 angeführten Voraussetzungen nicht gegeben ist oder wenn anstelle des in § 44 Abs. 6 und 8 vorgesehenen hauptberuflichen ein nebenberufliches Jagdschutzorgan bestellt werden soll oder wenn im Hinblick auf die Größe und die Beschaffenheit des Jagdgebietes ein regelmäßiger, dauernder und ausreichender Jagdschutz durch angelobte Jagdschutzorgane bereits gewährleistet ist. Die Bestellung hat auf die Dauer von fünf Jahren zu erfolgen; sie gilt als auf jeweils fünf Jahre verlängert, wenn vom Jagdausübungsberechtigten nicht innerhalb des drittletzten oder vorletzten Monats vor Ablauf der Bestellungsdauer ein anderer Vorschlag gemacht wird. Die Bestellung endet vorzeitig mit einem Wechsel des Jagdausübungsberechtigten, im Fall der Gemeindejagd jedoch mit dem Ende des bisherigen Jagdpachtverhältnisses (§ 17 Abs. 1), oder durch einen gegenüber der Bezirksverwaltungsbehörde abgegebenen Verzicht des Jagdschutzorgans oder bei Widerruf durch die Bezirksverwaltungsbehörde. Die Bestellung ist zu widerrufen, wenn nachträglich ein Umstand eintritt, der die Bestellung ausgeschlossen hätte, oder wenn das Jagdschutzorgan wiederholt die Bestimmungen dieses Gesetzes verletzt. Außer im Fall des Widerrufs dauert das Amt des Jagdschutzorgans bis zur rechtskräftigen Bestellung eines neuen Jagdschutzorgans. Die Bezirksverwaltungsbehörde hat das bisherige Jagdschutzorgan über die neue Bestellung zu unterrichten. Mit Ablauf des Amtes oder bei Widerruf der Bestellung sind das Dienstabzeichen und der Dienstausweis (Abs. 3) einzuziehen. Im Fall des vorzeitigen Endes der Bestellung hat die Bezirksverwaltungsbehörde den Jagdausübungsberechtigten aufzufordern, unverzüglich einen neuen Vorschlag (Abs. 1) zu erstatten."},{"lvl":0,"sym":"(3)","t":"Ein erstmals als Jagdschutzorgan Bestellter ist von der Bezirksverwaltungsbehörde auf die gewissenhafte Erfüllung seiner Pflichten anzugeloben. Nach der Angelobung ist ihm von der Bezirksverwaltungsbehörde ein Dienstausweis, aus dem seine Identität und seine Eigenschaft als Jagdschutzorgan sowie die nach § 50a Abs. 1 zusätzlich obliegenden Aufgaben der Überwachung der Wildfütterung hervorgehen, auszustellen sowie ein Dienstabzeichen auszufolgen. In dem Dienstausweis ist auch anzuführen, für welches Gebiet das Jagdschutzorgan bestellt wurde, und daß es berechtigt ist, das Dienstabzeichen zu tragen. Entfällt die Angelobung, sind der Dienstausweis und das Dienstabzeichen nach der Bestellung als Jagdschutzorgan auszustellen."},{"lvl":0,"sym":"(4)","t":"Das Dienstabzeichen hat das Landeswappen und einen Hinweis auf die Eigenschaft des Trägers zu enthalten. Die Landesregierung hat die näheren Bestimmungen über das Dienstabzeichen durch Verordnung zu erlassen."},{"lvl":0,"sym":"(5)","t":"Die bestellten und angelobten Jagdschutzorgane sind verpflichtet, bei der Ausübung ihres Dienstes das Dienstabzeichen sichtbar zu tragen und ihren Dienstausweis mit sich zu führen. Der Dienstausweis ist auf Verlangen – bei Gefahr im Verzug erst nach deren Beseitigung – vorzuweisen."},{"lvl":0,"sym":"(6)","t":"Die Bezirksverwaltungsbehörde hat für alle von ihr bestellten und angelobten Jagdschutzorgane einen Vormerk zu führen."}]},{"id":"46","title":"Voraussetzungen für die Bestellung","body":[{"lvl":0,"sym":"","t":"Als Jagdschutzorgan darf nur eine eigenberechtigte Person bestellt werden, die"},{"lvl":1,"sym":"a)","t":"die österreichische Staatsbürgerschaft besitzt,"},{"lvl":1,"sym":"b)","t":"die geistige und körperliche Eignung für die mit der Ausübung des Jagdschutzes verbundenen Aufgaben und die hiefür erforderliche Verläßlichkeit besitzt,"},{"lvl":1,"sym":"c)","t":"eine gültige Jagdkarte (§ 37) besitzt,"},{"lvl":1,"sym":"d)","t":"nach dem Gesetz über die Berufsjägerprüfung und die Jagdaufseherprüfung, LGBl Nr 50/1971, als Berufsjäger oder als Jagdaufseher gilt oder diesen gleichgestellt ist,"},{"lvl":1,"sym":"e)","t":"auf Grund ihres Wohnsitzes und Berufes die Gewähr für eine regelmäßige, dauernde und ausreichende Ausübung des Jagdschutzes bietet."}]},{"id":"47","title":"Stellung der Jagdschutzorgane","body":[{"lvl":0,"sym":"","t":"Die Jagdschutzorgane genießen, wenn sie in Ausübung ihres Dienstes in ihrem Aufsichtsgebiet das Dienstabzeichen sichtbar tragen, den besonderen Schutz, den das Strafgesetzbuch Beamten (§ 74 Z 4 StGB) einräumt."}]},{"id":"48","title":"Anhaltung und Abnahme von Gegenständen sowie Anzeige","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdschutzorgane sind in Ausübung ihres Dienstes befugt, in ihrem Aufsichtsgebiet Personen, die von ihnen bei einer nach diesem Gesetz strafbaren Handlung auf frischer Tat betreten werden oder sonst in dringendem Verdacht stehen, eine Verwaltungsübertretung nach diesem Gesetz begangen zu haben, anzuhalten, auf ihre Identität zu überprüfen und zum Sachverhalt zu befragen."},{"lvl":0,"sym":"(2)","t":"In den Fällen des Abs. 1 sind die Jagdschutzorgane befugt, Fahrzeuge und Gepäckstücke zu durchsuchen."},{"lvl":0,"sym":"(3)","t":"Den auf frischer Tat betretenen Personen können die von der strafbaren Handlung herrührenden sowie die zur Verübung derselben bestimmten Sachen abgenommen werden."},{"lvl":0,"sym":"(4)","t":"Auch außer dem Falle des Betretens auf frischer Tat ist das Jagdschutzorgan befugt, Personen, die verdächtig erscheinen, eine nach diesem Gesetz strafbare Handlung in dem vom Jagdschutzorgan zu beaufsichtigenden Jagdgebiet verübt zu haben, die Sachen abzunehmen, die allem Anschein nach von der Ausübung einer solchen strafbaren Handlung herrühren oder hiezu bestimmt sind, sofern die Mitnahme solcher Gegenstände nicht gerechtfertigt wird."},{"lvl":0,"sym":"(5)","t":"Die durch die Jagdschutzorgane abgenommenen Sachen sind unverzüglich der zur Übernahme derselben berufenen Behörde zu übergeben. Abgenommene Sachen sind zurückzugeben, wenn der Grund zur Abnahme der Sachen vor deren Übergabe an die Behörde entfällt."},{"lvl":0,"sym":"(6)","t":"Jagdschutzorgane sind verpflichtet, Verwaltungsübertretungen nach diesem Gesetz der Bezirksverwaltungsbehörde anzuzeigen. Von der Erstattung einer Anzeige darf jedoch abgesehen werden, wenn das Verschulden des Beanstandeten geringfügig ist und die Folgen der Übertretung gemessen an der Bedeutung des gesetzlich geschützten Rechtsgutes unbedeutend sind. In einem solchen Fall hat das Jagdschutzorgan den Beanstandeten in geeigneter Weise auf die Rechtswidrigkeit seines Verhaltens aufmerksam zu machen und hiervon den Bezirksjägermeister in Kenntnis zu setzen."}]},{"id":"49","title":"Wildschutz","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdschutzorgane sind in Ausübung ihres Dienstes berechtigt, in ihrem Aufsichtsgebiet"},{"lvl":1,"sym":"a)","t":"Raubwild und Rabenvögel unter Beachtung der durch jagdgesetzliche oder den Naturschutz regelnde Bestimmungen gezogenen Schranken zu fangen und zu töten,"},{"lvl":1,"sym":"b)","t":"Katzen zu töten, die in einem Wald umherstreifen, in dem Niederwild vorkommt,"},{"lvl":1,"sym":"c)","t":"Hunde zu töten, die"},{"lvl":2,"sym":"1.","t":"Wild hetzen oder"},{"lvl":2,"sym":"2.","t":"bei einer die Flucht des Wildes behindernden Schneelage offensichtlich ohne Aufsicht umherstreifen."},{"lvl":0,"sym":"(2)","t":"Maßnahmen nach Abs. 1 sind auf Flächen unzulässig, auf denen die Jagd ruht."},{"lvl":0,"sym":"(3)","t":"Das Recht zur Tötung von Hunden (Abs. 1 lit. c) besteht nicht gegenüber Jagdhunden, Blindenhunden, Polizeihunden, Hunden der Finanzbehörden und des Bundesheeres, Hirtenhunden sowie Fährten- und Lawinensuchhunden, wenn sie als solche gekennzeichnet oder sonst erkennbar sind."},{"lvl":0,"sym":"(4)","t":"Soweit einem Jagdschutzorgan die Eigentümer von nach Abs. 1 lit. b und c getöteten Tieren bekannt sind, hat es diese unverzüglich zu verständigen. Von Maßnahmen nach Abs. 1 lit. b und c hat das Jagdschutzorgan unverzüglich dem für das Jagdgebiet zuständigen Hegeringleiter unter Angabe der näheren Umstände Mitteilung zu machen."},{"lvl":0,"sym":"(5)","t":"Das Recht, wildernde Hunde zu töten, steht nach Maßgabe der Bestimmungen der Abs. 1 bis 4 in Eigenjagdgebieten auch dem Jagdausübungsberechtigten zu."}]},{"id":"50","title":"Waffengebrauch durch Jagdschutzorgane","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdschutzorgane sind – unbeschadet der waffenrechtlichen Vorschriften – befugt, in Ausübung ihres Dienstes ein Jagdgewehr und eine Faustfeuerwaffe zu tragen."},{"lvl":0,"sym":"(2)","t":"Jagdschutzorgane sind berechtigt, zur Abwehr eines gegenwärtigen oder unmittelbar drohenden rechtswidrigen Angriffes auf ihr Leben oder das Leben einer anderen Person von der Waffe Gebrauch zu machen. Der Gebrauch der Waffe ist jedoch nur in der Weise zulässig, die zur Abwehr des unternommenen oder drohenden Angriffes notwendig ist."}]},{"id":"50a","title":"Überwachung der Wildfütterung","body":[{"lvl":0,"sym":"(1)","t":"Das Jagdschutzorgan in dem Jagdgebiet, für welches es bestellt ist, sowie der Hegeringleiter und sein Stellvertreter in den Jagdgebieten ihres Hegeringes, in denen sie weder jagdausübungsberechtigt noch Mitglied einer Jagdgesellschaft sind, haben als Hilfsorgane der Bezirksverwaltungsbehörde die Einhaltung der Bestimmungen der §§ 61 bis 61d und des § 63 Abs. 5 und 6 über die Wildfütterung zu überwachen und der Bezirksverwaltungsbehörde sowie dem Bezirksjägermeister über jeden Verdacht auf das Vorliegen einer diesbezüglichen Verwaltungsübertretung zu berichten. Die Aufgaben der Jagdschutzorgane werden hiedurch nicht berührt. Dies gilt in gleicher Weise für den Bezirksjägermeister und seinen Stellvertreter hinsichtlich der Jagdgebiete ihrer Bezirksgruppe (Jagdbezirke)."},{"lvl":0,"sym":"(2)","t":"Zur Erfüllung der Aufgaben nach Abs. 1 haben die in Abs. 1 angeführten Personen das Recht, im Überwachungsbereich gelegene Jagdgebiete auch außerhalb der im § 69 Abs. 1 bezeichneten Straßen und Wege zur durchstreifen; hiebei ist es verboten, Beizvögel oder Frettchen sowie ein Gewehr oder Gegenstände mitzuführen, die zum Fangen oder Töten von Wild jeder Art bestimmt sind oder es erleichtern. Der Dienstausweis (Abs.3) ist mitzuführen und auf Verlangen vorzuweisen."},{"lvl":0,"sym":"(3)","t":"Die Bezirksverwaltungsbehörde hat Hegeringleitern und ihren Stellvertretern gemäß Abs. 1 einen Dienstausweis auszustellen, aus dem die Identität und die nach Abs. 1 zustehenden Aufgaben hervorgehen. Im Dienstausweis ist auch anzuführen, für welchen Bereich die Überwachung erfolgen darf. Die Landesregierung hat die näheren Bestimmungen über den Dienstausweis durch Verordnung zu erlassen. Für die Ausstellung eines Dienstausweises an Jagdschutzorgane gilt § 45 Abs. 3."},{"lvl":0,"sym":"(4)","t":"Den in Abs. 1 angeführten Personen gebührt eine Fahrtkostenvergütung nach §§ 190 und 191 des Kärntner Dienstrechtsgesetzes 1994 (K-DRG). Kilometergeld im Sinne des § 194 Abs. 3 K-DRG ist bei Vorliegen der Voraussetzungen des § 194 Abs. 1 K-DRG zu gewähren, ansonsten ist § 194 Abs. 2 zweiter Satz K-DRG anzuwenden. Ansprüche sind bei der Bezirksverwaltungsbehörde geltend zu machen und vom Land zu tragen."}]}]},{"nr":7,"title":"Schonvorschriften","paras":[{"id":"51","title":"Schonzeiten","body":[{"lvl":0,"sym":"(1)","t":"Während des ganzen Jahres sind zu schonen: das Steinwild, der Bär, der Wolf, das kleine Wiesel, der Fischotter, der Luchs, die Wildkatze, der Biber, die Auerhenne, die Birkhenne, die Haselhenne, das Alpenschneehuhn, das Steinhuhn, die Wachtel, die Wacholderdrossel (der Krammetsvogel), der Graureiher, der Haubentaucher, die Bekassine, die Wildenten, ausgenommen die Stockente, die Krickente, die Pfeifente, die Schnatterente, die Spießente, die Löffelente, die Tafelente, die Reiherente und die Knäkente, die Wildgänse, ausgenommen die Graugans, die Saatgans und die Kanadagans, die Hohltaube, der Kolkrabe, die Taggreifvögel und die Eulen sowie die Aaskrähe, der Eichelhäher und die Elster."},{"lvl":0,"sym":"(2)","t":"Die Landesregierung hat hinsichtlich des nicht in Abs. 1 angeführten Wildes mit Verordnung unter Bedachtnahme auf die Grundsätze eines geordneten Jagdbetriebes (§ 3), auf die Erhaltung bedrohter Wildarten sowie unter Berücksichtigung von Alter und Geschlecht und der biologischen Eigenheiten des Wildes festzulegen, welches Wild während des ganzen Jahres oder während bestimmter Zeiträume zu schonen ist (Schonzeiten). Für Alpenschneehasen, Alpensteinböcke, Goldschakale, Gemsen, Edelmarder und Iltisse ist jedenfalls eine Schonzeit festzulegen. In der Verordnung über die Schonzeiten ist auch das Wild anzuführen, das ganzjährig bejagt werden darf."},{"lvl":0,"sym":"(3)","t":"Im Interesse eines geordneten Jagdbetriebes kann die Landesregierung bei schwerer Gefährdung der Wildbestände durch Wildverluste, die durch außergewöhnliche Witterungsverhältnisse, Naturkatastrophen, Wildseuchen u. ä. verursacht werden, im ganzen Land, in einzelnen Verwaltungsbezirken oder in einzelnen Jagdgebieten die Schonzeiten verlängern oder festlegen, daß bestimmte Wildarten während des ganzen Jahres zu schonen sind. Diese Verordnung ist aufzuheben, sobald der Grund für ihre Erlassung weggefallen ist."},{"lvl":0,"sym":"(4)","t":"Die Landesregierung kann für bestimmte Wildarten die nach Abs. 1 oder 2 festgelegten Schonzeiten für alle oder einzelne Jagdgebiete verlängern oder – soweit es sich nicht um Wild nach Abs. 4a handelt – auch aufheben oder verkürzen, wenn dies im Interesse eines geordneten Jagdbetriebes mit Rücksicht auf die örtlichen oder klimatischen Verhältnisse gerechtfertigt erscheint. Diese Verordnungen dürfen jeweils nur für die Dauer von fünf Jahren erlassen werden."},{"lvl":0,"sym":"(4a)","t":"Um selektiv und in geringer Anzahl die Tötung, den Fang oder die Haltung von ganzjährig geschontem Federwild oder von Wölfen, Bären, Fischottern, Bibern, Wildkatzen oder Luchsen zu ermöglichen, kann die Landesregierung – sofern es keine andere zufriedenstellende Lösung gibt – die nach Abs. 1 festgelegte Schonzeit für dieses Wild aufheben oder verkürzen, und zwar im Interesse der Volksgesundheit und der öffentlichen Sicherheit, der Sicherheit der Luftfahrt, zur Abwendung erheblicher Schäden an Kulturen, Viehbeständen, Wäldern, Fischereigebieten und Gewässern, zum Schutz der wildlebenden Tiere und Pflanzen oder zu Forschungszwecken oder zur Aufstockung der Bestände und zur Wiederansiedlung und der für diese Zwecke erforderlichen Aufzucht. Diese Verordnung darf weiters nur unter der Voraussetzung erlassen werden, dass die Populationen der in der Verordnung angeführten Arten trotz der Aufhebung oder Verkürzung der Schonzeit ohne Beeinträchtigung in einem günstigen Erhaltungszustand verweilen. Soweit es sich nicht um ganzjährig geschontes Federwild handelt, darf diese Verordnung bei Vorliegen der sonstigen Voraussetzungen auch erlassen werden zum Schutz von Eigentum im allgemeinen oder zur Erhaltung natürlichen Lebensraumes. Diese Verordnungen dürfen jeweils höchstens für die Dauer von fünf Jahren erlassen werden."},{"lvl":0,"sym":"(5)","t":"Die Landesregierung kann ferner die für eine bestimmte Wildart – ausgenommen eine der in Abs. 4a angeführten Wildarten – geltende Schonzeit in einzelnen oder allen Jagdgebieten eines Verwaltungsbezirkes auf eine angemessene Dauer außer Wirksamkeit setzen, wenn dies im Interesse eines geordneten Jagdbetriebes oder der Land- und Forstwirtschaft geboten ist. Die Schonzeit für in Abs. 4a angeführtes Wild darf jedoch nur dann außer Wirksamkeit gesetzt werden, wenn dies zum Schutz einer der in Abs. 4a angeführten Interessen geboten erscheint, sofern es keine andere zufriedenstellende Lösung gibt und die Voraussetzungen des Abs. 4a zweiter Satz gegeben sind."},{"lvl":0,"sym":"(5a)","t":"Die Landesregierung kann für an Landesgrenzen gelegene Jagdgebiete, die nach § 5 Abs. 2 festgestellt worden sind, durch Verordnung die nach Abs. 2 festgelegten Schonzeiten für Schalenwild auf die Dauer der Feststellung des Jagdgebietes verlängern oder verkürzen, wenn dies im Interesse eines geordneten Jagdbetriebes zur Angleichung der Schonzeiten an die jenseits der Landesgrenze geltenden Bestimmungen erforderlich ist."},{"lvl":0,"sym":"(6)","t":"Wild darf – sofern nicht ein Fall der §§ 52 oder 72 dieses Gesetzes oder §§ 4 oder 5 Kärntner Alm- und Weideschutz-Gesetz, LGBl. Nr. 30/2024, vorliegt – während der Schonzeit weder verfolgt, noch gefangen, noch erlegt werden."},{"lvl":0,"sym":"(7)","t":"Bei Akten der Vollziehung gemäß Absatz 2 bis 5a ist jedenfalls auch auf den wildökologischen Raumplan und auf einen ausgeglichenen Naturhaushalt Bedacht zu nehmen."}]},{"id":"52","title":"Ausnahmen von Schonvorschriften","body":[{"lvl":0,"sym":"(1)","t":"Die Landesregierung kann für Zwecke der Wissenschaft, musealer Sammlungen, des Unterrichts oder der Verpflanzung von Wild in ein anderes Jagdgebiet fallweise Ausnahmen von den Schonvorschriften gestatten, wenn dies im Interesse eines geordneten Jagdbetriebes oder im öffentlichen Interesse liegt und soweit Abs. 2a nicht anderes bestimmt."},{"lvl":0,"sym":"(2)","t":"Die Landesregierung kann Einzelstücke einer Wildart in Abweichung von den Schonvorschriften für einzelne oder alle Jagdgebiete mit Bescheid zum Abschuß oder zum Fang freigeben, wenn dies im Interesse eines geordneten Jagdbetriebes, der Land- und Forstwirtschaft, zur Erhaltung einer bedrohten Wildart oder sonst im öffentlichen Interesse erforderlich erscheint und soweit Abs. 2a nicht anderes bestimmt. Eine selektive Freigabe im Sinne des ersten Satzes darf für den Auerhahn in der Zeit vom 1. März bis 30. September, für den Birkhahn in der Zeit vom 1. April bis 20. September und für die Waldschnepfe in der Zeit vom 20. Februar bis 10. September nur erfolgen, wenn es keine andere zufriedenstellende Lösung gibt und die Populationen der betroffenen Art unter Berücksichtigung der Populationsgröße und der Populationsdynamik (Reproduktions- und Mortalitätsrate) in einem günstigen Erhaltungszustand verbleiben."},{"lvl":0,"sym":"(2a)","t":"Wenn sich eine Maßnahme nach Abs. 1 oder 2 auf ganzjährig geschontes Federwild oder auf Wölfe, Bären, Fischotter, Biber, Wildkatzen oder Luchse bezieht, darf sie nur zum Schutz einer der in § 51 Abs. 4a angeführten Interessen bewilligt werden, sofern es keine andere zufriedenstellende Lösung gibt."},{"lvl":0,"sym":"(3)","t":"Die Bezirksverwaltungsbehörde kann dem Jagdausübungsberechtigten die Bewilligung erteilen, Eier des Federwildes zu sammeln und ausbrüten zu lassen, wenn die künstliche Aufzucht dieser Wildart zu ihrer Erhaltung notwendig oder im Interesse eines geordneten Jagdbetriebes oder der Land- und Forstwirtschaft gelegen ist und der Bewerber die Gewähr für eine sachgemäße Durchführung bietet. Die Bewilligung darf überdies nur zum Schutz einer der in § 51 Abs. 4a angeführten Interessen erteilt werden, sofern es keine andere zufriedenstellende Lösung gibt. Ausgemähte oder durch Naturkatastrophen gefährdete Gelege dürfen durch den Jagdausübungsberechtigten zum Zwecke des Ausbrütens entfernt werden."},{"lvl":0,"sym":"(3a)","t":"Bezieht sich eine Bewilligung nach Abs. 2 oder 3 auf Taggreifvögel oder Eulen, kann die Behörde im Bescheid anordnen, daß von der Bewilligung nur in Begleitung eines Behördenorganes Gebrauch gemacht werden darf. Ist der Inhaber einer Bewilligung nach Abs. 2 nicht mit dem Jagdausübungsberechtigten identisch, so ist er verpflichtet, den Jagd ausübungsberechtigten so rechtzeitig zu verständigen, daß dieser oder sein Jagdschutzorgan bei der Durchführung der bewilligten Maßnahme anwesend sein kann."},{"lvl":0,"sym":"(4)","t":"Wild, das infolge einer Verletzung großen Qualen oder einem Siechtum ausgesetzt, krank oder seuchenverdächtig ist, ist auch während der Schonzeit und über den Abschußplan (§ 57) hinaus zu erlegen. Eine solche Erlegung ist unverzüglich unter Darlegung der Gründe der Bezirksverwaltungsbehörde und dem Bezirksjägermeister anzuzeigen. Wild, das unter diesen Voraussetzungen während der Schonzeit erlegt wurde, ist auf den Abschussplan nicht anzurechnen, aber in der Abschussliste gesondert auszuweisen. Das erlegte Stück ist in der Decke dem Hegeringleiter vorzulegen; dieser hat bei Verdacht auf Vorliegen einer Verwaltungsübertretung unverzüglich die Bezirksverwaltungsbehörde zu verständigen. Diese kann die Vorlage des Wildes verlangen."},{"lvl":0,"sym":"(5)","t":"Bei Akten der Vollziehung gemäß Abs. 1 bis 3 ist jedenfalls auch auf den wildökologischen Raumplan und auf einen ausgeglichenen Naturhaushalt Bedacht zu nehmen."}]},{"id":"53","title":"Beschränkung des Abschusses","body":[{"lvl":0,"sym":"","t":"Sinkt der Bestand einer Wildart bedeutend unter das dem Jagdgebiet entsprechende Mindestausmaß, so hat der Bezirksjägermeister nach Anhörung des Bezirksjagdbeirates den Abschuss dieser Wildart in dem Jagdgebiet auf eine angemessene Dauer einzuschränken, sofern keine Verordnung nach § 51 Abs. 3 erlassen wurde. Dabei ist jedenfalls auf den wildökologischen Raumplan und auf einen ausgeglichenen Naturhaushalt Bedacht zu nehmen. Diese Maßnahmen sind aufzuheben, sobald der Grund für ihre Erlassung weggefallen ist."}]},{"id":"54","title":"Handel mit Wild","body":[{"lvl":0,"sym":"","t":"Federwild – ausgenommen Rebhühner, Fasane, Stockenten und Ringeltauben – sowie Wölfe, Bären, Fischotter, Biber, Wildkatzen und Luchse dürfen nur verkauft sowie für den Verkauf befördert, gehalten und angeboten werden, wenn eine Bewilligung nach § 52 Abs. 2a – jedoch höchstens für die Dauer von sechs Wochen – erteilt wurde oder wenn ein Fall nach § 99 Abs. 3 vorliegt. Taggreifvögel und Eulen dürfen überdies auch dann verkauft sowie für den Verkauf befördert, gehalten und angeboten werden, wenn eine Bewilligung nach § 54a erteilt wurde. Dies gilt auch für die Decke, das Fell und sonstige Bestandteile dieser Tiere. Im übrigen darf ganzjährig geschontes Wild nur verkauft sowie für den Verkauf befördert, gehalten und angeboten werden, wenn der Nachweis erbracht wird, daß es aus einem Gehege stammt oder wenn eine Genehmigung nach § 52 Abs. 2 – jedoch höchstens für die Dauer von sechs Wochen – erteilt wurde oder wenn ein Fall nach § 99 Abs. 3 vorliegt. Rebhühner, Fasane, Stockenten und Ringeltauben dürfen jedoch nur verkauft sowie zum Verkauf befördert, gehalten oder angeboten werden, wenn sie rechtmäßig getötet oder gefangen oder sonst rechtmäßig erworben worden sind."}]},{"id":"54a","title":"Halten von Taggreifvögeln und Eulen","body":[{"lvl":0,"sym":"(1)","t":"Das Halten von Taggreifvögeln und Eulen ist verboten."},{"lvl":0,"sym":"(2)","t":"Die Landesregierung darf – sofern es keine andere zufriedenstellende Lösung gibt – auf Antrag vom Verbot des Abs. 1 Ausnahmen bewilligen, wenn der Antragsteller die für eine Haltung erforderliche Verläßlichkeit nachweist, die Haltung einem gesunden Wildstand dieses ganzjährig geschonten Federwildes nicht abträglich ist und einer der Fälle des Abs. 3 vorliegt."},{"lvl":0,"sym":"(3)","t":"Die Bewilligung nach Abs. 2 darf nur erteilt werden"},{"lvl":1,"sym":"a)","t":"für Zwecke der wissenschaftlichen Forschung oder Lehre,"},{"lvl":1,"sym":"b)","t":"zur Ausübung der Falknerei durch eine hiezu berechtigte Person (§ 36 Abs. 2),"},{"lvl":1,"sym":"c)","t":"zur Zucht für einen der Zwecke nach lit. a, b oder d oder zur Zucht für die Auswilderung zur Erhaltung gefährdeter Arten,"},{"lvl":1,"sym":"d)","t":"zur Schau, wenn sie mit fachlichen Informationen der Besucher über die gehaltenen Tiere, insbesondere über ihre Art, ihren Lebensraum, ihre Lebensgewohnheiten und ihre Schutzbedürftigkeit verbunden sind und besondere öffentliche Interessen, wie insbesondere des Fremdenverkehrs, an einer derartigen Veranstaltung gegeben sind,"},{"lvl":1,"sym":"e)","t":"für die Pflege kranker oder verletzter Tiere (Pflegestation)."},{"lvl":0,"sym":"(4)","t":"Verläßlichkeit liegt keinesfalls vor, wenn die Voraussetzungen des § 37 Abs. 4 und 5 gegeben sind oder wenn eine erteilte Ausnahmebewilligung bereits einmal widerrufen oder entzogen wurde."},{"lvl":0,"sym":"(5)","t":"Bei der Erteilung der Bewilligung nach Abs. 2 sind unter Bedachtnahme auf den Zweck der Haltung (Abs. 3) die Art und die Zahl der Taggreifvögel und Eulen festzulegen."},{"lvl":0,"sym":"(6)","t":"Die Inhaber einer Bewilligung nach Abs. 2 sind verpflichtet, der Landesregierung unverzüglich jede Veränderung im Zusammenhang mit den von ihnen gehaltenen Tieren einschließlich allfälliger Veränderungen des Ortes der Haltung mitzuteilen."},{"lvl":0,"sym":"(7)","t":"Der Inhaber einer Zuchtbewilligung (Abs. 3 lit. c) ist weiters verpflichtet, der Landesregierung die erste Eiablage eines Geleges oder eines Nachgeleges binnen drei Tagen anzuzeigen; unverzüglich nach dem Ausschlüpfen hat er der Landesregierung die Zahl der Vögel und die Nummer des Zuchtringes mitzuteilen; im Falle einer Weitergabe eines nachgezüchteten Tieres sind der Name und die Anschrift des neuen Besitzers der Landesregierung mitzuteilen. Der Inhaber einer Zuchtbewilligung darf die nachgezüchteten Tiere ohne zusätzliche Bewilligung längstens sechs Monate halten."},{"lvl":0,"sym":"(8)","t":"Wenn bei einem Inhaber einer Bewilligung nach Abs. 2 eine der Bewilligungsvoraussetzungen nachträglich wegfällt, hat die Landesregierung die Bewilligung zu entziehen."},{"lvl":0,"sym":"(9)","t":"Für den Antrag auf Bewilligung nach Abs. 3 lit. a bis d sowie für die erforderlichen Mitteilungen an die Landesregierung sind die durch Verordnung der Landesregierung festgelegten Vordrucke zu verwenden. Bei der Erlassung der Verordnung ist auf den Inhalt und den Zweck des Antrages und der Mitteilungen Bedacht zu nehmen."}]},{"id":"54b","title":"Beringen von Taggreifvögeln und Eulen","body":[{"lvl":0,"sym":"","t":"Taggreifvögel und Eulen, für die gemäß § 54a Abs. 2 eine Bewilligung zum Halten erteilt wurde, sind anläßlich der Erteilung dieser Bewilligung – in den Fällen des § 54a Abs. 3 lit. c sechs Wochen nach dem Ausschlüpfen eines nachgezüchteten Tieres – durch Organe des Landes zu beringen."}]},{"id":"54c","title":"Beteiligung von Umweltorganisationen","body":[{"lvl":0,"sym":"(1)","t":"Anerkannte Umweltorganisationen gemäß § 19 Abs. 7 Umweltverträglichkeitsprüfungsgesetz 2000 – UVP-G 2000, deren örtliche Anerkennung auch das Land Kärnten umfasst, haben das Recht, gegen Bewilligungen gemäß"},{"lvl":1,"sym":"1.","t":"§ 52 Abs. 1 und 2 erster Satz – soweit dies unionsrechtlich geschützte Arten betrifft, das sind Arten, die in Anhang IV lit. a der FFH-Richtlinie (§ 100a Z 1) oder in Anhang I der Vogelschutz-Richtlinie (§ 100a Z 2) genannt oder auf die in den Art. 1 bis 5 der Vogelschutz-Richtlinie Bezug genommen wird;"},{"lvl":1,"sym":"2.","t":"§ 52 Abs. 2 letzter Satz, Abs. 2a und 3 sowie § 54a Abs. 2 und"},{"lvl":1,"sym":"3.","t":"§ 68 Abs. 2 und 3, soweit dies die in Anhang IV der FFH-Richtlinie bzw. Anhang IV der Vogelschutzrichtlinie genannten Fang- und Tötungsmittel betrifft,"},{"lvl":0,"sym":"","t":"Beschwerde an das Landesverwaltungsgericht zu erheben."},{"lvl":0,"sym":"(2)","t":"Bescheide gemäß Abs. 1 sind auf der elektronischen Plattform gemäß § 54a Abs. 2 Kärntner Naturschutzgesetz 2002 bereitzustellen. Mit Ablauf von zwei Wochen ab dem Tag der Bereitstellung gilt der Bescheid den Umweltorganisationen gemäß Abs. 1 als zugestellt. Ab dem Tag der Bereitstellung ist ihnen Einsicht in den Verwaltungsakt zu gewähren. Die Bescheide dürfen frühestens sechs Wochen nach der Bereitstellung von der elektronischen Plattform entfernt werden."},{"lvl":0,"sym":"(3)","t":"Beschwerden von Umweltorganisationen gemäß Abs. 1 sind binnen vier Wochen ab der Zustellung (Abs. 2) schriftlich bei der Behörde einzubringen. Beschwerden gegen Bescheide, die aus den in Art. 16 Abs. 1 lit. b der FFH-Richtlinie 92/43/EWG oder Art. 9 Abs. 1 lit. a dritter Spiegelstrich der Vogelschutz-Richtlinie 2009/147/EG genannten Gründen erlassen wurden, haben keine aufschiebende Wirkung. § 22 Abs. 1 Verwaltungsgerichtsverfahrensgesetz –VwGVG gilt sinngemäß."}]}]},{"nr":8,"title":"Vorschriften für die Jagdbetriebsführung","paras":[{"id":"55","title":"Abschußplanung","body":[{"lvl":0,"sym":"","t":"Das Erlegen und Fangen von Schalenwild – mit Ausnahme von Schwarzwild und Damwild – sowie von Auerhahnen und Birkhahnen unterliegt der Abschußplanung. Die Landesregierung kann, wenn dies unter Berücksichtigung der für die Erlassung der Abschußrichtlinien maßgebenden Grundsätze erforderlich ist, durch Verordnung festlegen, daß auch andere Wildarten der Abschußplanung unterliegen."}]},{"id":"55a","title":"Wildökologischer Raumplan","body":[{"lvl":0,"sym":"(1)","t":"Der Landesvorstand der Kärntner Jägerschaft hat durch Verordnung für die der Abschussplanung unterliegenden Wildarten für das gesamte Landesgebiet einen wildökologischen Raumplan zu erlassen. Hiebei ist auf das zwischen dem Wild und seiner Umwelt vorherrschende Verhältnis zur Sicherung des Lebensraumes des Wildes einerseits und zur nachhaltigen Vermeidung von Wildschäden und anderen Schäden in der Vegetation andererseits Bedacht zu nehmen."},{"lvl":0,"sym":"(2)","t":"Im wildökologischen Raumplan sind insbesondere festzulegen:"},{"lvl":1,"sym":"a)","t":"die Wildräume, gesondert für jede Wildart, wobei insbesondere auf die natürlichen und künstlichen Begrenzungen des Lebensraumes der einzelnen Wildpopulationen Bedacht zu nehmen ist;"},{"lvl":1,"sym":"b)","t":"die Wildregionen für die Wildarten, wobei insbesondere Bedacht zu nehmen ist auf"},{"lvl":2,"sym":"1.","t":"die Grenzen der Wildräume und der Lebensräume der Wildarten;"},{"lvl":2,"sym":"2.","t":"die Ermöglichung einer zweckmäßigen jagdbetrieblichen Zusammenarbeit von Jagdausübungsberechtigten im Rahmen von Hegegemeinschaften;"},{"lvl":2,"sym":"3.","t":"die Grenzen der Hegeringe und der Bezirksgruppen der Kärntner Jägerschaft;"},{"lvl":2,"sym":"4.","t":"die anzustrebende Zuteilung eines Jagdgebietes zu nur einer Wildregion."},{"lvl":0,"sym":"(3)","t":"Für jede Wildregion ist für jede Wildart jeweils ein Abschussrahmen festzulegen, der bei der Festsetzung der Zahl der Abschüsse in allen Abschussplänen dieser Wildregion jeweils einzuhalten ist. Dies gilt nicht für Rotwild, falls hiezu in den Abschussrichtlinien (§ 56) Abweichendes geregelt wird."},{"lvl":0,"sym":"(4)","t":"Im wildökologischen Raumplan muss weiters jede Wildregion, entsprechend der unterschiedlichen Eignung der einzelnen Teile der Wildregion als Lebensraum für das Rotwild, in Kernzonen, Randzonen und Freizonen gegliedert sein. Als Kernzonen sind jeweils jene Teile einer Wildregion auszuweisen, die zu etwa 80 v. H. ein dem Rotwild entsprechendes Biotop aufweisen; in den Kernzonen soll das Rotwild in gesunden Beständen so erhalten bleiben, dass keine waldgefährdenden Wildschäden zu erwarten sind. In den Randzonen soll das Rotwild entweder nur vorübergehend oder nur in geringen Beständen vorhanden sein. Als Freizonen sind jeweils jene Teile einer Wildregion auszuweisen, die ein für das Rotwild überwiegend ungeeignetes Biotop aufweisen und in denen die Wahrscheinlichkeit von Wildschäden besonders groß ist. Freizonen sollen von Rotwild möglichst frei gehalten werden."},{"lvl":0,"sym":"(5)","t":"Im wildökologischen Raumplan ist auch festzulegen, in welchen Bereichen von Rotwildkernzonen unter Bedachtnahme auf die Zielsetzungen des Abs. 1 die Errichtung von Rotwildfütterungsanlagen (§ 63 Abs. 5) und von Fütterungsanlagen für die Fütterung mit Futter, das nicht Raufutter ist (§ 61 Abs. 2), zulässig ist. Im wildökologischen Raumplan sind ferner jene Bereiche zu bezeichnen, die für die Festlegung von Wildschutzgebieten (§ 70 Abs. 1b) besonders geeignet sind. Ebenso sind im wildökologischen Raumplan die Methoden der Wildbestandserhebungen durch Zählung oder Berechnung, unter Bedachtnahme auf die Wildbestandsverhältnisse benachbarter Jagdgebiete, festzulegen."},{"lvl":0,"sym":"(6)","t":"Der wildökologische Raumplan ist regelmäßig, längstens jedoch alle fünf Jahre, auf seine Übereinstimmung mit den Zielen nach Abs. 1 zu überprüfen und erforderlichenfalls zu ändern."},{"lvl":0,"sym":"(7)","t":"Vor der Erlassung des wildökologischen Raumplanes sind der Landesjagdbeirat, die Landesregierung, der Leiter des Forstaufsichtsdienstes beim Amt der Kärntner Landesregierung, die Landwirtschaftskammer, die Arbeiterkammer und die Wirtschaftskammer"},{"lvl":0,"sym":"","t":"Kärnten zu hören."},{"lvl":0,"sym":"(8)","t":"Abweichend von § 88a, ist der wildökologische Raumplan durch Auflage zur öffentlichen Einsicht während der für den Parteienverkehr bestimmten Stunden bei der Geschäftsstelle des Landesjägermeisters und den Geschäftsstellen der Bezirksjägermeister kundzumachen. Auf diese Art der Kundmachung ist sowohl im wildökologischen Raumplan selbst als auch in dem für die Kundmachung von Verordnungen der Kärntner Jägerschaft vorgesehenen Kundmachungsblatt hinzuweisen. Jedermann hat das Recht, bei den Stellen, bei denen der wildökologische Raumplan zur öffentlichen Einsicht aufliegt, gegen Ersatz der Herstellungskosten Ausfertigungen, wie Kopien, zu erhalten, wenn geeignete technische Einrichtungen vorhanden sind."}]},{"id":"55b","title":"Amtliches Monitoring","body":[{"lvl":0,"sym":"(1)","t":"Soweit es für die Erhebung des Wildbestandes und zur Überwachung von Wildarten gesetzlich oder durch Verordnung der Landesregierung angeordnet ist, hat die Kärntner Jägerschaft ein amtliches Monitoring im notwendigen Ausmaß durchzuführen. Die Landesregierung darf sich jedoch das amtliche Monitoring für bestimmte Wildarten vorbehalten, sofern zu dessen Durchführung besondere Fachkenntnisse erforderlich sind und hiefür sonstige geeignete Einrichtungen oder Personen herangezogen werden."},{"lvl":0,"sym":"(2)","t":"Das amtliche Monitoring hat die für die Erhebungen nach Abs. 1 erforderlichen Maßnahmen zu umfassen, wie insbesondere die koordinierte Begehung und Probennahme, die koordinierte Wildbestandszählung und die Aufstellung von Wildkameras."},{"lvl":0,"sym":"(3)","t":"Der Jagdausübungsberechtigte, der Grundeigentümer und der sonst in seinen Rechten betroffene Nutzungsberechtigte hat die Maßnahmen des amtlichen Monitorings zu dulden."},{"lvl":0,"sym":"(4)","t":"Jagdausübungsberechtigte und Jagdschutzorgane haben die zur Durchführung des amtlichen Monitorings erforderlichen Auskünfte zu erteilen."},{"lvl":0,"sym":"(5)","t":"Die für das amtliche Monitoring tätigen Personen haben eine schriftliche Ermächtigung mit sich zu führen und auf Verlangen eines Jagdausübungsberechtigten, Grundeigentümers sowie sonst betroffenen Nutzungsberechtigten vorzuweisen."}]},{"id":"56","title":"Abschußrichtlinien","body":[{"lvl":0,"sym":"","t":"Der Landesvorstand der Kärntner Jägerschaft hat mit Verordnung Richtlinien für die Abschußplanung (Abschußrichtlinien) sowie Grundsätze, die bei der Erfüllung des Abschußplanes einzuhalten sind, zu erlassen. Bei der Erlassung der Verordnung ist auf den wildökologischen Raumplan sowie die Entwicklung und Erhaltung eines gesunden, der Größe und den natürlichen Äsungsverhältnissen des Jagdgebietes entsprechenden Wildstandes, ein ausgeglichenes Geschlechterverhältnis, einen richtigen Altersaufbau des Wildstandes, auf die Vermeidung eines zahlenmäßig für die Land- und Forstwirtschaft abträglichen Wildstandes und die Erfordernisse eines ausgeglichenen Naturhaushaltes Bedacht zu nehmen. Zur Erzielung einer Anreizwirkung für die Erfüllung des Abschussplans in der jeweiligen Wildklasse ist in den Abschussrichtlinien ferner festzulegen, welche der Abschussplanung unterliegenden Schalenwildarten, beschrieben nach Geschlecht, Wildklassen und Altersklassen, und in welcher Reihenfolge – jeweils unter Bedachtnahme auf die Wildschadensanfälligkeit sowie den Wildstand – für die Erlaubnis zum zusätzlichen Abschuss (§ 57b) in Betracht kommen. Unter Bedachtnahme auf vorgenannte Zielsetzungen dürfen in den Abschussrichtlinien für die Erlegung oder den Fang von Rotwild besondere Bedingungen festgelegt werden (§ 55a Abs. 3 letzter Satz). Vor der Erlassung der Abschussrichtlinien sind der Landesjagdbeirat und die Landwirtschaftskammer zu hören."}]},{"id":"57","title":"Abschußplan","body":[{"lvl":0,"sym":"(1)","t":"Der Jagdausübungsberechtigte hat bis spätestens 1. März des Jagdjahres, mit dem die Geltungsdauer des Abschussplanes beginnt, den beantragten vollständigen Abschussplan (Abs. 4) dem Hegeringleiter bekannt zu geben. Der Hegeringleiter hat den beantragten Abschussplan mit seiner Stellungnahme bis spätestens 15. März dem Bezirksjägermeister zu übermitteln."},{"lvl":0,"sym":"(2)","t":"Der Bezirksjägermeister hat auf der Grundlage des Abschussrahmens im wildökologischen Raumplan (§ 55a Abs. 3) und auf Grund der Abschussrichtlinien für jedes Jagdgebiet, das im Bereich seiner Bezirksgruppe liegt, nach Anhörung des Bezirksjagdbeirates und, wenn das Jagdgebiet zu einer Hegegemeinschaft gemäß § 62 gehört, des von dieser Hegegemeinschaft namhaft gemachten Vertreters bis spätestens 1. Mai den Abschussplan mit Bescheid festzusetzen. Dabei ist auf den jeweiligen Bestand und den sich über die Grenze eines Jagdgebietes hinaus erstreckenden Lebensraum des der Abschussplanung unterliegenden Wildes Bedacht zu nehmen. Ferner ist die zahlenmäßige Festlegung des Abschusses gemäß Abs. 4 lit. b jedenfalls auf die Herstellung eines dem Biotop angemessenen Wildstandes und auf die Vermeidung von waldgefährdenden Wildständen auszurichten. Für aneinandergrenzende Jagdgebiete desselben Jagdausübungsberechtigten ist nur ein Abschussplan zu erlassen. Wurde kein Antrag nach Abs. 1 gestellt, ist der Abschussplan von Amtswegen festzusetzen. Abschusspläne sind gemäß §§ 22, 23 und 24 des Zustellgesetzes, BGBl Nr 100/1982, zuletzt in der Fassung BGBl. I Nr. 205/2022, zuzustellen. Eine Nachsendung hat nicht zu erfolgen."},{"lvl":0,"sym":"(3)","t":"Ein Abschussplan ist für die Dauer von zwei Jahren zu erlassen (Geltungsdauer des Abschussplanes)."},{"lvl":0,"sym":"(4)","t":"Der Abschussplan hat jedenfalls zu enthalten:"},{"lvl":1,"sym":"a)","t":"die Gesamtfläche des Jagdgebietes (der aneinandergrenzenden Jagdgebiete) desselben Jagdausübungsberechtigten;"},{"lvl":1,"sym":"b)","t":"den während der Geltungsdauer des Abschussplanes durchzuführenden Abschuss;"},{"lvl":1,"sym":"c)","t":"eine Aufgliederung des zu erlegenden Schalenwildes in männliche und weibliche Stücke, ausgenommen die im Lauf der Geltungsdauer des Abschussplanes gesetzten Kälber, Kitze und Lämmer (Nachwuchsstücke);"},{"lvl":1,"sym":"d)","t":"eine Unterteilung der zu erlegenden trophäentragenden Wildstücke, mit Ausnahme der Muffelschafe, in Altersklassen."},{"lvl":0,"sym":"(5)","t":"Bei verpachteten Eigenjagden hat der Jagdausübungsberechtigte dem Antrag (Abs. 4) eine Stellungnahme des Verpächters anzuschließen oder mitzuteilen, dass der Verpächter auf die Abgabe der Stellungnahme verzichtet hat. Bei einer verpachteten Gemeindejagd hat der Hegeringleiter bis längstens 15. März dem Jagdverwaltungsbeirat"},{"lvl":1,"sym":"1.","t":"den beantragten Abschussplan,"},{"lvl":1,"sym":"2.","t":"eine Darstellung der festgesetzten Abschusszahlen des bisher geltenden Abschussplans und"},{"lvl":1,"sym":"3.","t":"eine Darstellung der Abschuss-, Fang- und Auffindungszahlen der der Abschussplanung unterliegenden Wildarten für die dem Jahr der Erlassung des Abschussplans vorausgehenden zwei Jagdjahre"},{"lvl":0,"sym":"","t":"zu übermitteln. Hiezu hat der Jagdverwaltungsbeirat unter Beiziehung des oder der Jagdausübungsberechtigten zu einer Sitzung zusammenzutreten. Dem Jagdverwaltungsbeirat obliegt sodann die Abgabe einer Stellungnahme gegenüber dem Bezirksjägermeister, die bei diesem bis spätestens 1. April einzulangen hat; langt bis zu diesem Zeitpunkt keine Stellungnahme ein, gilt dies als Zustimmung des Jagdverwaltungsbeirates. Der Bezirksjägermeister hat die eingelangte Stellungnahme des Jagdverwaltungsbeirates dem Bezirksjagdbeirat zur Kenntnis zu bringen."},{"lvl":0,"sym":"(6)","t":"Der Bezirksjägermeister darf von der Erlassung eines Abschussplanes für einzelne Jagdgebiete – ist für aneinandergrenzende Jagdgebiete nur ein Abschussplan zu erlassen, nur dann, wenn alle Jagdgebietsflächen denselben Grundeigentümer haben – absehen, wenn"},{"lvl":1,"sym":"a)","t":"der Antrag des Jagdausübungsberechtigten (Abs. 1) vollständig ist und"},{"lvl":1,"sym":"b)","t":"gegen die im Antrag enthaltenen Angaben keine Einwendungen des Bezirksjagdbeirates oder des Verpächters einer Eigenjagd vorliegen und"},{"lvl":1,"sym":"c)","t":"keine Verfügungen nach Abs. 8 getroffen werden."},{"lvl":0,"sym":"(7)","t":"Trägt der Zustellnachweis, mit dem der festgesetzte Abschussplan (Abs. 2) zugestellt werden soll, nicht ein Aufgabedatum bis einschließlich 28. April, so gilt nach dem 1. Mai der vom Jagdausübungsberechtigten beantragte Abschuss als durchzuführender Abschuss (Abs. 4 lit. b). Der Bezirksjägermeister hat ab dem 28. April durch Anschlag in der Geschäftsstelle des Landesjägermeisters und in seiner Geschäftsstelle unter Angabe des Jagdausübungsberechtigten des Jagdgebietes kundzumachen, hinsichtlich welcher festgesetzten Abschusspläne die Zustellung gemäß §§ 22 oder 24 des Zustellgesetzes bis einschließlich 28. April eingeleitet worden ist."},{"lvl":0,"sym":"(8)","t":"Bei Schalenwild kann der Bezirksjägermeister einzelne oder alle Stücke einer Schalenwildart in mehr als einem Abschussplan unter der Auflage zum Abschuss freigeben, dass alle Abschusspläne hinsichtlich dieser Stücke erfüllt sind, sobald diese in einem dieser Jagdgebiete gefangen oder erlegt werden. Im Abschussplan sind die Namen und die Anschriften der Jagdausübungsberechtigten anzuführen, die im Falle der Erlegung oder des Fangens eines dieser Stücke jeweils unverzüglich zu verständigen sind."},{"lvl":0,"sym":"(9)","t":"Wurde gegen den Bescheid des Bezirksjägermeisters Beschwerde beim Landesverwaltungsgericht erhoben, hat der Jagdausübungsberechtigte bis zur rechtskräftigen Entscheidung hierüber das Recht und die Pflicht, Wild im Rahmen des angefochtenen Bescheides zu erlegen oder zu fangen."},{"lvl":0,"sym":"(9a)","t":"Hat sich während der Geltungsdauer des Abschussplanes ein Jagdgebiet in seiner Größe nicht nur unwesentlich verändert, so hat der Bezirksjägermeister von Amts wegen für die verbleibende Dauer der Abschussplanperiode (Abs. 3) den Abschussplan für ein betroffenes geändertes Jagdgebiet unter sinngemäßer Anwendung von Abs. 2 und 4 neu festzusetzen."},{"lvl":0,"sym":"(10)","t":"Der Jagdausübungsberechtigte ist verpflichtet, den Inhalt des Abschussplanes seinen Jagdschutzorganen zur Kenntnis zu bringen."},{"lvl":0,"sym":"(11)","t":"Der Landesvorstand der Kärntner Jägerschaft hat durch Verordnung Vordrucke für den Abschussplan unter Bedachtnahme auf dessen Inhalt festzulegen."},{"lvl":0,"sym":"(12)","t":"Ist der durchzuführende Abschuss ungenügend, um eine Gefährdung des Waldes durch Wild (§ 71 Abs. 3) zu vermeiden, hat die Landesregierung in Abänderung des Abschussplans, im Fall des Abs. 6 in Ergänzung des Antrags des Jagdausübungsberechtigten, von Amts wegen oder auf Antrag des Leiters des Forstaufsichtsdienstes beim Amt der Landesregierung den durchzuführenden Abschuss im erforderlichen Ausmaß mit Bescheid festsetzen. Abs. 2, mit Ausnahme des vorvorletzten Satzes, sowie Abs. 9 und 10 sind sinngemäß anzuwenden."}]},{"id":"57a","title":"Rechtswirkungen von Abschussplänen und Freizonen","body":[{"lvl":0,"sym":"(1)","t":"Das der Abschussplanung unterliegende Wild darf – soweit Abs. 2 oder 3 oder § 57b nicht anderes bestimmen – nur im Rahmen eines Abschussplanes erlegt oder gefangen werden."},{"lvl":0,"sym":"(2)","t":"Stellt der Bezirksjägermeister fest, dass im Zuge der Abschussplanerfüllung im ersten Jahr deutlich in unverhältnismäßiger Zahl bestimmte Stücke einer Wildart (ältere Stücke, Trophäenträger etc.) erlegt oder gefangen wurden, hat er im Interesse einer möglichst gleichmäßigen Erfüllung des Abschussplanes dem Jagdausübungsberechtigten mit Bescheid aufzutragen, weitere solche Stücke erst zu erlegen oder zu fangen, nachdem eine bestimmte Anzahl anderer Tiere der betreffenden Wildart erlegt oder gefangen wurden. Beschwerden an das Landesverwaltungsgericht, die gegen solche Bescheide erhoben werden, haben keine aufschiebende Wirkung."},{"lvl":0,"sym":"(3)","t":"In Freizonen (§ 55a Abs. 4) ist jedes Stück Rotwild unter Beachtung der festgelegten Schonzeiten zu erlegen oder zu fangen."}]},{"id":"57b","title":"Erlaubnis zum zusätzlichen Abschuss","body":[{"lvl":0,"sym":"(1)","t":"Nach Maßgabe des Wildökologischen Raumplans und der Abschussrichtlinien hat der Bezirksjägermeister nach Tunlichkeit im Abschussplan, ansonsten in einem gesonderten Bescheid, von Amts wegen bis zum Ablauf der Geltungsdauer des jeweiligen Abschussplans die Erlaubnis zum zusätzlichen Abschuss weiterer Stücke von der Abschussplanung unterliegendem Schalenwild im Einzugsbereich eines oder mehrerer Jagdgebiete des Jagdbezirks zu erteilen, deren Inanspruchnahme an die Bedingung der Erfüllung des Abschussplans in der betreffenden Wildklasse zu knüpfen ist. Eine solche Erlaubnis darf nur erteilt werden, soweit der zusätzliche Abschuss dem Zweck der Wildschadensverhütung oder der Erhaltung eines angemessenen Wildstandes dient; § 57 Abs. 2 gilt sinngemäß. Die Erlaubnis ist erforderlichenfalls unter Auflagen, Bedingungen und Befristungen zu erteilen, wenn deren Erfüllung oder Einhaltung zur Wahrung der Voraussetzungen gemäß dem vorherigen Satz geboten ist."},{"lvl":0,"sym":"(2)","t":"Der Jagdausübungsberechtigte darf eine für den Einzugsbereich mehrerer Jagdgebiete erteilte Erlaubnis zum zusätzlichen Abschuss jeweils nur im eigenen Jagdgebiet und nur unter der Voraussetzung in Anspruch nehmen, dass er zu seinem Vorhaben mit dem Bezirksjägermeister Rücksprache nimmt und kein Hinweis vorliegt, dass die Erlaubnis zum zusätzlichen Abschuss schon ausgeschöpft worden ist."},{"lvl":0,"sym":"(3)","t":"Sofern nach § 57 Abs. 8 erster Satz der Abschuss von Schalenwild in mehr als einem Abschussplan freigegeben wird, darf ein Jagdausübungsberechtigter die Erlaubnis zum zusätzlichen Abschuss nur dann in Anspruch nehmen, wenn er den Abschussplan im eigenen Jagdgebiet erfüllt hat. Für die Verständigung der anderen Jagdausübungsberechtigten gilt § 57 Abs. 8 letzter Satz sinngemäß."}]},{"id":"58","title":"Abschußmeldung","body":[{"lvl":0,"sym":"(1)","t":"Der Jagdausübungsberechtigte hat den Abschuss und den Fang eines Wildstückes sowie das Auffinden eines gefallenen Wildstückes unter Angabe des Erlegers oder Finders binnen einer Woche nach Maßgabe der Abs. 3 und 4 bekanntzugeben, sofern es sich um Wild, das der Abschussplanung unterliegt, oder um Schwarzwild oder Damwild handelt (Abschussmeldung)."},{"lvl":0,"sym":"(2)","t":"Liegt ein zusätzlicher Abschuss aufgrund einer für den Einzugsbereich mehrerer Jagdgebiete erteilten Erlaubnis vor (§ 57b), gilt Abs. 1 mit der Maßgabe, dass die Abschussmeldung unverzüglich zu erfolgen hat. Ist die Erlaubnis zum zusätzlichen Abschuss ausgeschöpft, hat der Bezirksjägermeister die Hegeringleiter der betroffenen Hegeringe hierüber unverzüglich zu verständigen."},{"lvl":0,"sym":"(3)","t":"Die Abschussmeldung hat im Wege des elektronischen Jagdinformationssystems der Kärntner Jägerschaft zu erfolgen. Im Rahmen dieses Systems hat die Kärntner Jägerschaft den Hegeringleiter sowie den Bezirksjägermeister über die erfolgte Abschussmeldung in Kenntnis zu setzen."},{"lvl":0,"sym":"(4)","t":"Bei technischem Ausfall des elektronischen Jagdinformationssystems (Abs. 3) hat der Jagdausübungsberechtigte die Abschussmeldung an den Hegeringleiter zu erstatten. Dieser ist verpflichtet, eine Meldung gemäß Abs. 1 binnen einer Woche nach ihrem Einlangen, eine Meldung gemäß Abs. 2 jedoch unverzüglich an den Bezirksjägermeister weiterzuleiten."}]},{"id":"59","title":"Abschussliste und Wildnachweisung","body":[{"lvl":0,"sym":"(1)","t":"Der Jagdausübungsberechtigte ist verpflichtet, das während des Jagdjahres in seinem Jagdgebiet erlegte, gefangene oder sonstwie verendete Wild in einer für jedes Jagdgebiet gesondert geführten Abschußliste zu verzeichnen; für aneinandergrenzende Jagdgebiete, für die nur ein Abschußplan erlassen wurde, hat die Verzeichnung in einer Abschußliste zu erfolgen. Angeschossenes Wild, das in einem fremden Jagdgebiet zur Strecke gekommen ist, ist in der Abschußliste für jenes Jagdgebiet zu verzeichnen, dessen Jagdausübungsberechtigtem das Wildstück, bei Trophäenträgern die Trophäe, zufällt. Die Verzeichnung ist, wenn es sich um Wild, das der Abschußplanung unterliegt, oder um Schwarzwild oder Damwild handelt, unverzüglich nach dem Abschuß oder Fang bzw. nach Auffindung des Wildstückes, bei dem übrigen Wild am Ende des Jagdjahres vorzunehmen; bei jedem Wildstück, das der Abschußplanung unterliegt, und bei Schwarzwild oder Damwild ist ferner der Name des Erlegers zu vermerken."},{"lvl":0,"sym":"(2)","t":"Nach Maßgabe vorhandener technischer Möglichkeiten kann die Abschussliste in elektronischer Form geführt werden. Sofern die Abschussliste in Papierform geführt wird, ist der durch Verordnung des Landesvorstandes der Kärntner Jägerschaft festgelegte Vordruck zu verwenden. Bei der Erlassung der Verordnung ist auf den Inhalt und den Zweck der Abschussliste Bedacht zu nehmen."},{"lvl":0,"sym":"(3)","t":"Die Abschußliste ist während des Jagdjahres bei dem Jagdausübungsberechtigten, falls sich dessen Wohnsitz aber außerhalb des Verwaltungsbezirkes befindet, in dem das Jagdgebiet gelegen ist, bei dem für dieses Jagdgebiet bestellten Jagdschutzorgan aufzulegen. Die Landesregierung, der Bezirksjägermeister, der Talschaftsreferent, die Hegeringleiter, die Bezirksverwaltungsbehörde und die Leiter der Bezirksforstinspektion des Gebietes, in dem das Jagdgebiet liegt, sowie die Jagdschutzorgane des Jagdausübungsberechtigten sind zur Einsicht in die Abschussliste berechtigt. Nach Maßgabe vorhandener technischer Möglichkeiten können die Auflage der Abschussliste und die Einsichtnahme in elektronischer Form erfolgen."},{"lvl":0,"sym":"(4)","t":"Die Abschußliste ist mit dem Ablauf des Jagdjahres abzuschließen und bis zum 15. Jänner des folgenden Jahres dem Hegeringleiter zur Weiterleitung an den Bezirksjägermeister zu übermitteln."},{"lvl":0,"sym":"(5)","t":"Der Bezirksjägermeister hat auf Grund der übermittelten Abschusslisten für den Bereich seiner Bezirksgruppe eine Wildnachweisung, getrennt nach Wildarten, Geschlecht und Wildklassen zu erstellen, die den festgesetzten Abschuß, das erlegte oder gefangene Wild und das Fallwild zu enthalten hat. Für die Wildnachweisung ist der durch Verordnung des Landesvorstandes der Kärntner Jägerschaft unter Bedachtnahme auf ihren Zweck und Inhalt festgelegte Vordruck zu verwenden."},{"lvl":0,"sym":"(6)","t":"Die in den Abschußlisten gemachten Angaben dürfen außer in Verfahren vor Behörden nur für jagdwirtschaftliche und statistische Zwecke verwendet werden."}]},{"id":"60","title":"Nachweis des Abschusses von Wildstücken","body":[{"lvl":0,"sym":"(1)","t":"Durch Verordnung des Landesvorstandes der Kärntner Jägerschaft ist im Interesse einer geordneten Jagdwirtschaft und der wirksamen Überwachung der Erfüllung des Abschussplanes unter Bedachtnahme auf die Grundsätze der Sparsamkeit, Wirtschaftlichkeit und Zweckmäßigkeit der Verwaltung zu bestimmen, dass Jagdausübungsberechtigte den Abschuss von Schalenwild von bestimmter Art insbesondere durch Vorlage von Trophäen und Unterkiefern, des Hauptes in der Decke oder in grünem Zustand gegenüber Organen der Kärntner Jägerschaft oder ihren Beauftragten nachzuweisen haben; überdies dürfen Jagdausübungsberechtigte zur Ausstellung von Trophäen sowie Unterkiefern bestimmter Wildstücke bei der jährlichen Hegeschau verpflichtet werden. In der Verordnung sind insbesondere nähere Bestimmungen über die Art der Vorlage, die Vorlagefrist, die Kennzeichnung der Wildstücke und die Anforderung der Vorlage zu erlassen."},{"lvl":0,"sym":"(2)","t":"Der Hegeringleiter hat durch hiezu fachlich befähigte Personen nach den vorgelegten Trophäen und Unterkiefern (Abs. 1) die Einhaltung des Abschußplanes der Zahl und der Art nach zu überprüfen und die Trophäen und die Unterkiefer nach der Überprüfung dauerhaft zu kennzeichnen, ohne die Trophäen zu entwerten. Das Ergebnis der Prüfung der Einhaltung des Abschußplanes ist der Bezirksverwaltungsbehörde bekanntzugeben."},{"lvl":0,"sym":"(3)","t":"Der Bezirksausschuß hat zur Überprüfung und Kennzeichnung im Sinne des Abs. 2 die erforderliche Anzahl von fachlich hiezu befähigten Personen zu bestellen."},{"lvl":0,"sym":"(4)","t":"Ferner ist der Jagdausübungsberechtigte auf begründete Anordnung des Hegeringleiters verpflichtet, diesem einen erbeuteten Auerhahn oder Birkhahn im grünen Zustand vorzulegen. Der Hegeringleiter hat den Bezirksjägermeister von dieser Anordnung zu verständigen."},{"lvl":0,"sym":"(5)","t":"Für verfallen erklärte und vorläufig beschlagnahmte Trophäen (§ 99) oder Trophäen gemäß § 72 Abs. 5 sind von der Kärntner Jägerschaft auf den jährlichen Hegeschauen auszustellen."}]},{"id":"61","title":"Allgemeines zur Fütterung","body":[{"lvl":0,"sym":"(1)","t":"Soweit die natürliche Äsung und Maßnahmen nach § 3 Abs. 3 nicht ausreichen, ist es dem Jagdausübungsberechtigten – unbeschadet der Erfüllung eines bescheidmäßigen Auftrages nach § 61a Abs. 2 und unbeschadet des § 61c – gestattet, nach Maßgabe des § 61a Abs. 1 und 4, § 61b und der Verordnung gemäß Abs. 2 während der Zeit der Vegetationsruhe für die ausreichende und regelmäßige Fütterung des Wildes zu sorgen."},{"lvl":0,"sym":"(2)","t":"Der Landesvorstand der Kärntner Jägerschaft hat unter Bedachtnahme auf die fachlichen Erkenntnisse durch Verordnung festzulegen, welches Futter"},{"lvl":1,"sym":"1.","t":"als artgerechtes Ergänzungsfutter für die Fütterung von Rehwild und"},{"lvl":1,"sym":"2.","t":"als Raufutter"},{"lvl":0,"sym":"","t":"gilt."},{"lvl":0,"sym":"(3)","t":"Ferner hat der Landesvorstand der Kärntner Jägerschaft durch Verordnung"},{"lvl":1,"sym":"1.","t":"unter Bedachtnahme auf die fachlichen Erkenntnisse Bestimmungen über die Kirrung für Schwarzwild zu erlassen und"},{"lvl":1,"sym":"2.","t":"Richtlinien für die Errichtung von Fütterungsanlagen (§ 63) unter Bedachtnahme auf deren hygienische, betreuungsrelevante und wildökologische Eignung festzulegen."}]},{"id":"61a","title":"Rotwildfütterung","body":[{"lvl":0,"sym":"(1)","t":"Rotwild darf mit anderem Futter als Raufutter nur auf Grund eines bescheidmäßigen Auftrages nach Abs. 2 gefüttert werden."},{"lvl":0,"sym":"(2)","t":"Soweit es zum Schutz der Land- und Forstwirtschaft notwendig ist, Rotwild in bestimmten Zonen, insbesondere auch in bestimmten Höhenlagen, zu konzentrieren oder zurückzuhalten oder in bestimmte Zonen zu lenken, hat die Landesregierung unter Bedachtnahme auf den wildökologischen Raumplan dem Jagdausübungsberechtigten von Amts wegen mit Bescheid aufzutragen, welche anderen Arten von Futter als Raufutter an welchem Standort für Rotwild zu verwenden sind. Derartige Aufträge dürfen nur in Rotwildkernzonen erteilt werden. In diesen Aufträgen ist auch der Zeitraum festzulegen, in dem die Fütterung zu erfolgen hat, wobei der Beginn nicht vor dem 31. Oktober und das Ende nicht vor dem 15. April liegen soll. Bei der Erlassung dieser Bescheide sind auf den Einzugsbereich der Fütterung und auf ein vom Jagdausübungsberechtigten allenfalls vorgelegtes Fütterungskonzept und im Falle der räumlichen Nähe zur Landesgrenze auch auf die jenseits der Landesgrenze für Fütterungen geltenden Bestimmungen Bedacht zu nehmen. Vor der Erlassung dieser Bescheide sind der Landesjagdbeirat, die Kärntner Jägerschaft, der Leiter der mit den Angelegenheiten des Forstaufsichtsdienstes betrauten Abteilung des Amtes der Landesregierung, die Landwirtschaftskammer und ein Sachverständiger für Wildbiologie zu hören; sofern Auswirkungen auf angrenzende Jagdgebiete zu erwarten sind, sind auch die Jagdausübungsberechtigten dieser Jagdgebiete anzuhören. Diese Bescheide sind im Mitteilungsblatt der Kärntner Jägerschaft zu veröffentlichen. Jeder Jagdausübungsberechtigte hat das Recht, bei der Landesregierung unter Vorlage eines Fütterungskonzeptes eine Prüfung dahingehend anzuregen, ob in seinem Jagdgebiet die Voraussetzungen für die Erlassung eines amtswegigen Bescheides im Sinne des ersten Satzes vorliegen. Die Landesregierung hat zu diesen Anregungen die im fünften Satz angeführten Stellen zu hören und, sofern die Voraussetzungen für die Erlassung eines amtswegigen Bescheides nicht vorliegen, die Stellungnahmen der angehörten Stellen dem Jagdausübungsberechtigten, der die Überprüfung angeregt hat, zur Kenntnis zu bringen."},{"lvl":0,"sym":"(3)","t":"Werden in Bescheiden nach Abs. 2 Fütterungsaufträge für einen vor dem 1. Jänner liegenden Zeitraum erteilt, darf – unabhängig von Jagdgebietsgrenzen – im Umkreis von 400 m um die Rotwildfütterung nur Wild erlegt oder gefangen werden, das infolge einer Verletzung großen Qualen oder Siechtum ausgesetzt oder krank oder seuchenverdächtig ist. Liegen andere Jagdgebiete als das, für das der Auftrag nach Abs. 2 erteilt wurde, in diesem 400-m-Umkreis, so haben die Jagdausübungsberechtigten dieser Jagdgebiete im Verfahren nach Abs. 2 Parteistellung."},{"lvl":0,"sym":"(4)","t":"Die Fütterung von Rotwild – ausgenommen die Streckenfütterung (Kettenfütterung) – darf nur in Fütterungsanlagen nach § 63 Abs. 5 erfolgen. Tritt während der Zeit der Vegetationsruhe durch außerordentliche Witterungsverhältnisse eine Gefährdung von Rotwild ein, so darf der Bezirksjägermeister nach Anhörung des Bezirksjagdbeirates in dem zur Abwehr dieser Gefährdung erforderlichen Rahmen Ausnahmen von diesem Verbot bewilligen. Der Jagdausübungsberechtigte hat eine Streckenfütterung (Kettenfütterung) dem Bezirksjägermeister anzuzeigen.."}]},{"id":"61b","title":"Fütterung von anderem Wild","body":[{"lvl":0,"sym":"(1)","t":"Die Fütterung von Gamswild und – unbeschadet des § 61c – von Schwarzwild ist verboten. Sonstiges Schalenwild darf, unbeschadet Abs. 3, nur mit Raufutter, Rehwild zusätzlich mit Ergänzungsfutter und in Gebieten nach Abs. 2 mit Obsttrester, gefüttert werden."},{"lvl":0,"sym":"(2)","t":"Wenn und soweit es im Interesse der Land- und Forstwirtschaft oder zur Abhaltung des Rehwildes von Verkehrsflächen erforderlich ist, kann der Landesvorstand der Kärntner Jägerschaft unter Bedachtnahme auf den wildökologischen Raumplan durch Verordnung Gebiete festlegen, in denen Rehwild auch mit Obsttrester gefüttert werden darf. Gebiete, in denen auch Rotwild vorkommt, sind von einer derartigen Festlegung ausgeschlossen."},{"lvl":0,"sym":"(3)","t":"Die Fütterung"},{"lvl":2,"sym":"1.","t":"von anderem Wild als Rot-, Muffel- und Damwild mit anderem Futter als Raufutter und"},{"lvl":2,"sym":"2.","t":"von Rehwild"},{"lvl":0,"sym":"","t":"darf in Gebieten, in denen auch Rotwild vorkommt, nur in rotwilddicht eingezäunten Fütterungsanlagen erfolgen."},{"lvl":0,"sym":"(4)","t":"Die Fütterung von Rehwild und Muffelwild darf nur in Fütterungsanlagen nach § 63 Abs. 5 erfolgen."}]},{"id":"61c","title":"Lockfütterungen","body":[{"lvl":0,"sym":"(1)","t":"Lockfütterungen (Kirrungen) sind jedermann verboten. Lockfütterungen für Raubwild und Schwarzwild dürfen nur von Jagdausübungsberechtigten und ihren Jagdschutzorganen durchgeführt werden."},{"lvl":0,"sym":"(2)","t":"Überdies darf Schwarzwild nur in Gebieten, in denen Rotwild nicht vorkommt, unter Beachtung einer Verordnung gemäß § 61 Abs. 3 Z 1 gekirrt werden."}]},{"id":"61d","title":"Lagerung von Futter","body":[{"lvl":0,"sym":"(1)","t":"Jagdausübungsberechtigte und ihre Jagdschutzorgane dürfen Futter nur zur Erfüllung eines bescheidmäßigen Auftrages nach § 61a Abs. 2 und nur so lagern, dass eine Futteraufnahme oder die Aufnahme einer Witterung durch Rotwild nicht möglich ist. Darüber hinaus darf anderes Futter als Raufutter nur im Rahmen einer ordnungsgemäßen Betriebsführung eines landwirtschaftlichen Betriebes oder für zulässige Kirrungen für Schwarzwild (§ 61c Abs. 2) im Freien gelagert werden."},{"lvl":0,"sym":"(2)","t":"Erhalten Jagdausübungsberechtigte oder deren Jagdschutzorgane davon Kenntnis, dass in ihrem Jagdgebiet anderes Futter als Raufutter im Freien gelagert wird, ohne dass dies im Rahmen der ordnungsgemäßen Betriebsführung eines landwirtschaftlichen Betriebes oder für zulässige Kirrungen für Schwarzwild erfolgt, haben sie hievon die Bezirksverwaltungsbehörde und den Bezirksjägermeister zu verständigen."}]},{"id":"61e","title":"Fütterungsgemeinschaften","body":[{"lvl":0,"sym":"","t":"Die Jagdausübungsberechtigten von benachbarten Jagdgebieten können sich im Interesse der Wildfütterung und zur Verhinderung von Wildschäden zu Fütterungsgemeinschaften zusammenschließen. Die Bildung von Fütterungsgemeinschaften ist der Kärntner Jägerschaft unter Vorlage der Gründungsvereinbarung anzuzeigen. Aus der Gründungsvereinbarung müssen jedenfalls die Mitglieder, die Vertretungsbefugnis und die Kostenaufteilung ersichtlich sein."}]},{"id":"62","title":"Hegegemeinschaften","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdausübungsberechtigten von benachbarten Jagdgebieten können sich im Interesse der großräumigen Hege einer oder mehrerer Wildarten, insbesondere zur Erzielung und Erhaltung einer tragbaren Wilddichte, eines der Wildart nach biologischen Erkenntnissen entsprechenden Geschlechterverhältnisses und Altersklassenaufbaues, zu einer Hegegemeinschaft zusammenschließen."},{"lvl":0,"sym":"(2)","t":"Die Bildung von Hegegemeinschaften im Sinne des Abs. 1 ist dem Bezirksjägermeister unter Vorlage ihrer Satzungen anzuzeigen."}]},{"id":"63","title":"Jagdeinrichtungen und Fütterungsanlagen","body":[{"lvl":0,"sym":"(1)","t":"Unbeschadet der Erfüllung des Erfordernisses nach Abs. 5 ist dem Jagdausübungsberechtigten die Errichtung von Anlagen für den Jagdbetrieb, wie von Jagdhütten, Hochständen, Hochsitzen, Fütterungsanlagen, Jagdsteigen, Wildzäunen u. dgl. sowie von Anlagen gemäß § 3 Abs. 3 nur mit schriftlicher Zustimmung des Grundeigentümers gestattet. Zur Errichtung einer Rotwildfütterungsanlage ist ferner die schriftliche Zustimmung der Eigentümer der Grundstücke und der Jagdausübungsberechtigten von Jagdgebieten, die jeweils innerhalb eines Umkreises von 2,8 km um die Anlage gelegen sind, erforderlich. Es ist verboten, in einem Jagdgebiet Vorrichtungen anzubringen oder aufrecht zu erhalten, welche dem Wild das Einwechseln ermöglichen, es jedoch hindern, wieder aus dem betreffenden Jagdgebiet auszuwechseln (Einsprünge)."},{"lvl":0,"sym":"(2)","t":"Die Zustimmung des Grundeigentümers ist für die Errichtung von Wildzäunen und für die Anlage von Fütterungsanlagen, Hochständen und Hochsitzen sowie Anlagen nach § 3 Abs. 3 nicht erforderlich, wenn die Bezirksverwaltungsbehörde auf Antrag des Jagdausübungsberechtigten feststellt, daß dem Grundeigentümer die Duldung dieser Anlage zugemutet werden kann. Dies gilt für die Zustimmung im Sinn des Abs. 1 zweiter Satz sinngemäß."},{"lvl":0,"sym":"(3)","t":"Anlagen nach Abs. 1 und 2 sind dem Jagdnachfolger auf sein Verlangen zu überlassen. Der Jagdausübungsberechtigte oder sein Rechtsnachfolger haben jedoch Anspruch auf eine angemessene Entschädigung."},{"lvl":0,"sym":"(4)","t":"Bezüglich des Gegenstandes, des Umfanges und der Festsetzung der Entschädigung an den Grundeigentümer für die Duldung der Jagdeinrichtungen (Abs. 2) und für die Überlassung der Jagdeinrichtungen an den Jagdnachfolger (Abs. 3) gelten die Bestimmungen der §§ 46 bis 48 der Kärntner Gefahrenpolizei- und Feuerpolizeiordnung 2000, LGBl. Nr. 67/2000, in der geltenden Fassung, mit der Maßgabe, dass für das Verwaltungsverfahren die Bezirksverwaltungsbehörde zuständig ist."},{"lvl":0,"sym":"(5)","t":"Die beabsichtigte Errichtung einer Rehwild-, Muffelwild- oder Rotwildfütterungsanlage ist dem Bezirksjägermeister unter genauer Umschreibung der Örtlichkeit vom Jagdausübungsberechtigten anzuzeigen. Der Bezirksjägermeister hat die Errichtung nach Anhörung des Bezirksjagdbeirates zu untersagen, wenn"},{"lvl":1,"sym":"1.","t":"die Anlage dem wildökologischen Raumplan oder den Richtlinien gemäß § 61 Abs. 3 Z 2 widerspricht oder"},{"lvl":1,"sym":"2.","t":"im Zusammenhang mit der Wildfütterung eine Gefährdung des Waldes durch Wild im Sinne des § 71 Abs. 3 zu erwarten ist oder bestehende Wildschäden noch verstärkt würden."},{"lvl":0,"sym":"","t":"Erfolgt eine Untersagung binnen acht Wochen nach Einlangen der vollständigen Anzeige nicht oder stellt der Bezirksjägermeister vor Ablauf dieser Frist nach Anhörung des Bezirksjagdbeirates fest, dass der Errichtung der Rehwild-, Muffelwild- oder Rotwildfütterungsanlage keine Untersagungsgründe entgegenstehen, darf mit ihrer Errichtung – unbeschadet der Erfüllung des Erfor
