*{box-sizing:border-box}

  .bottom button{flex:1;padding:8px 2px 6px;font-family:var(--display);font-weight:600;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}

@media (prefers-reduced-motion:no-preference){.opt,.item{transition:border-color .15s}}

<script id="law-data" type="application/json">{"kjg":[{"nr":1,"title":"Ziele, Jagdrecht und Jagdausübung","paras":[{"id":"1","title":"Ziele","body":[{"lvl":0,"sym":"","t":"Ziele dieses Gesetzes sind:"},{"lvl":1,"sym":"1.","t":"eine geordnete und planmäßige Jagdwirtschaft im öffentlichen Interesse sicherzustellen, um einen artenreichen, gesunden, geschlechtlich ausgewogenen und den Lebensraumverhältnissen angemessenen Wildbestand in Kärnten zu erzielen und zu erhalten, insbesondere zur Wildschadensverhütung in der Land- und Forstwirtschaft;"},{"lvl":1,"sym":"2.","t":"Erfordernissen der Weidgerechtigkeit umfassend Rechnung zu tragen;"},{"lvl":1,"sym":"3.","t":"einen angemessenen Ausgleich zwischen den Interessen von Grundeigentümern und den Jagdausübungsberechtigten sowie den öffentlichen Interessen zu erreichen;"},{"lvl":1,"sym":"4.","t":"die Verwaltung im Bereich des Jagdwesens wirksam zu organisieren."}]},{"id":"1a","title":"Begriff des Jagdrechtes","body":[{"lvl":0,"sym":"(1)","t":"Das Jagdrecht besteht in der Befugnis, innerhalb von Jagdgebieten das Wild zu hegen, ihm nachzustellen, es zu fangen, zu erlegen und sich anzueignen; es umfaßt ferner die Befugnis, sich Fallwild, Abwurfstangen und die Eier des Federwildes anzueignen."},{"lvl":0,"sym":"(2)","t":"Das Jagdrecht fließt aus dem Grundeigentum; es ist mit diesem verbunden und kann als selbständiges Recht nicht begründet werden."}]},{"id":"2","title":"Jagdausübungsberechtigte","body":[{"lvl":0,"sym":"(1)","t":"Das Jagdrecht wird entweder als Eigenjagd oder als Gemeindejagd ausgeübt (Jagdausübungsrecht)."},{"lvl":0,"sym":"(2)","t":"Jagdausübungsberechtigt im Sinne dieses Gesetzes sind"},{"lvl":1,"sym":"a)","t":"in Eigenjagdgebieten (§ 5) die Grundeigentümer (Eigenjagdberechtigten),"},{"lvl":1,"sym":"b)","t":"in Gemeindejagdgebieten (§ 6) die Gemeinde."},{"lvl":0,"sym":"(3)","t":"Wenn das Eigentum an der Grundfläche, mit dem ein Eigenjagdrecht verbunden ist, einer einzelnen physischen Person, die nicht das Recht zu jagen hat (§ 36 Abs. 1) oder die Jagd nicht selbst ausüben will, oder im übrigen mehreren physischen Personen, einer Personenvereinigung oder einer juristischen Person zusteht, und die Jagd nicht verpachtet ist, steht das Jagdausübungsrecht jener Person zu, die vom einzelnen Jagdausübungsberechtigten oder vom Vertretungsbefugten der sonstigen angeführten Jagdausübungsberechtigten der Bezirksverwaltungsbehörde namhaft gemacht wird (Bevollmächtigter). Wird ein Pachtvertrag vor Ablauf der Pachtdauer aufgelöst oder gekündigt oder erlischt er im Falle des Todes des Pächters und beträgt die noch verbleibende Pachtzeit weniger als ein Jahr, so hat der Jagdausübungsberechtigte des Eigenjagdgebietes für die noch verbleibende Zeitdauer einen Bevollmächtigten zu bestellen, sofern er nicht selbst das Recht zu jagen hat. Ein vom Jagdausübungsberechtigten bestellter Bevollmächtigter bedarf der Bestätigung durch die Bezirksverwaltungsbehörde. Die Bestätigung ist zu erteilen, wenn der Bevollmächtigte als Pächter (§ 18) in Frage käme. Wird trotz Aufforderung durch die Bezirksverwaltungsbehörde kein geeigneter Bevollmächtigter namhaft gemacht, so hat die Bezirksverwaltungsbehörde bis zur Bestätigung des Bevollmächtigten einen Jagdverwalter (§ 34) zu bestellen. Die mit der Verwaltung verbundenen Kosten hat der Grundeigentümer zu tragen."},{"lvl":0,"sym":"(4)","t":"Das Jagdausübungsrecht kann nach Maßgabe dieses Gesetzes im Wege der Verpachtung (§§ 16 ff.), der Bestellung von Bevollmächtigten (Abs. 3) oder der Bestellung von Jagdverwaltern (§ 34) auf dritte Personen übertragen werden."},{"lvl":0,"sym":"(5)","t":"Gemeinden haben ihr Jagdausübungsrecht zu verpachten; falls die Verpachtung nicht möglich ist, ist zur Ausübung der Jagd ein Jagdverwalter zu bestellen (§ 34)."},{"lvl":0,"sym":"(6)","t":"Verzichtet ein Eigenjagdberechtigter gegenüber der Bezirksverwaltungsbehörde schriftlich auf sein Jagdausübungsrecht, so ist das Eigenjagdgebiet von der Bezirksverwaltungsbehörde benachbarten Jagdgebieten anzuschließen (§ 10 Abs. 1). Ein solcher Verzicht bindet für die Dauer seiner Wirksamkeit auch den Rechtsnachfolger. Ein Verzicht hinsichtlich eines Teiles des Jagdgebietes oder eines Teiles des Jagdausübungsrechtes ist unzulässig. Der Verzicht gilt auf die Dauer der Pachtzeit der Gemeindejagd."}]},{"id":"3","title":"Grundsätze eines geordneten Jagdbetriebes","body":[{"lvl":0,"sym":"(1)","t":"Die Jagd ist sachgemäß und weidgerecht unter Beachtung der Grundsätze eines geordneten Jagdbetriebes auszuüben. Es ist verboten, den Bestand einer Wildart durch eine nicht sachgemäße Jagdausübung zu gefährden. Wildlebende Vogelarten, die im Sinne der Richtlinie des Rates vom 2. April 1979 über die Erhaltung der wildlebenden Vogelarten (79/409/EWG) in Österreich – unbeschadet § 51 Abs. 4a – nicht bejagt werden dürfen – dürfen ungeachtet der angewandten Methode – weder absichtlich getötet noch gefangen werden; solche Vogelarten dürfen – unbeschadet §§ 54 und 54a – auch nicht gehalten werden. Darüber hinaus ist die Jagd so auszuüben, daß die im öffentlichen Interesse gelegenen günstigen Wirkungen des Waldes nicht geschmälert und insbesondere waldgefährdende Wildschäden (§ 71 Abs. 3) vermieden werden."},{"lvl":0,"sym":"(2)","t":"Ein geordneter Jagdbetrieb ist gegeben, wenn durch die Jagdausübung einschließlich der Hege ein der Größe und Beschaffenheit des Jagdgebietes und der Tragfähigkeit des Biotops angepasster artenreicher und gesunder Wildstand sowie ein Waldzustand, der die im öffentlichen Interesse gelegenen Wirkungen des Waldes – insbesondere durch den Schutz vor waldgefährdenden Wildschäden – erfüllt, erzielt und erhalten werden. Dabei sind ein ausgeglichener Naturhaushalt, die Erfordernisse der Land- und Forstwirtschaft und die wildökologische Raumplanung zu berücksichtigen. Der geordnete Jagdbetrieb umfasst auch eine ordnungsgemäße Ausübung des Jagdschutzes."},{"lvl":0,"sym":"(3)","t":"Die Hege umfaßt das Recht und die Pflicht, das Wild zu betreuen, ihm die Lebensgrundlagen zu sichern, seine Entwicklung zu fördern und allen Störungen entgegenzuwirken. Sie umfaßt auch die Förderung der Umweltbedingungen durch Äsungsverbesserung und Reviergestaltung. Hiezu zählen insbesondere die Anlage von Daueräsungsflächen und Deckungsflächen, Verbißgehölzen, Hecken, Remisen u. ä. Es ist jedoch verboten, eine Wildart so zu überhegen, daß die im Jagdgebiet – ausgenommen die Zeit der Vegetationsruhe – vorhandene natürliche Äsung zu ihrer Ernährung nicht mehr ausreicht."}]},{"id":"4","title":"Wild","body":[{"lvl":0,"sym":"","t":"Zum Wild im Sinne dieses Gesetzes gehören:"},{"lvl":1,"sym":"a)","t":"Haarwild:"},{"lvl":0,"sym":"","t":"Rot-, Dam-, Reh-, Gams-, Stein-, Muffel- und Schwarzwild (Schalenwild); der Feldhase und der Alpen- oder Schneehase, das wilde Kaninchen, das Murmeltier, der Biber;"},{"lvl":0,"sym":"","t":"der Bär, der Waschbär, der Wolf, der Fuchs, der Dachs, der Baum- oder Edelmarder, der Stein- oder Hausmarder, der Marderhund, der Iltis, das große Wiesel oder Hermelin, das kleine Wiesel, der Fischotter, der Luchs, die Wildkatze, der Goldschakal (Raubwild);"},{"lvl":1,"sym":"b)","t":"Federwild:"},{"lvl":0,"sym":"","t":"das Auer-, das Birk- und das Rackelhuhn, das Hasel-, das Alpenschnee- und das Steinhuhn, das Rebhuhn, der Fasan, die Wachtel, die Wildtauben, die Wacholderdrossel (der Krammetsvogel), die Wildenten, die Wildgänse, das Bläßhuhn, der Graureiher, der Haubentaucher, die Bekassine, die Waldschnepfe, die Taggreifvögel, die Eulen, der Kolkrabe, die Aaskrähe, der Eichelhäher, die Elster."}]},{"id":"4a","title":"Geltungsbereich","body":[{"lvl":0,"sym":"","t":"Die Bestimmungen dieses Gesetzes finden – soweit nicht ausdrücklich anderes bestimmt ist – keine Anwendung auf Wild, das in Gehegen (§ 8) gehalten wird."}]},{"id":"5","title":"Eigenjagdgebiet","body":[{"lvl":0,"sym":"(1)","t":"Ein Eigenjagdgebiet ist eine demselben Eigentümer gehörende, zusammenhängende, jagdlich nutzbare Grundfläche von mindestens 115 ha."},{"lvl":0,"sym":"(2)","t":"Auf Antrag des Grundeigentümers kann in den Fällen, in denen eine an der Landesgrenze gelegene Grundfläche das nach Abs. 1 erforderliche Mindestausmaß nicht erreicht, ein Eigenjagdgebiet dann festgestellt werden (§ 9), wenn die Grundfläche und eine in den Ländern Salzburg, Steiermark oder Tirol gelegene, demselben Eigentümer gehörende zusammenhängende und jagdlich nutzbare Grundfläche zusammen die Voraussetzungen des Abs. 1 erfüllen und wenn außerdem nach dem Jagdgesetz des Nachbarlandes diese Fläche aus dem gleichen Grund als Eigenjagdgebiet festgestellt wird."}]},{"id":"6","title":"Gemeindejagdgebiet","body":[{"lvl":0,"sym":"(1)","t":"Die in einer Gemeinde liegenden, zusammenhängenden, jagdlich nutzbaren Grundstücke, welche nicht zu einem Eigenjagdgebiet gehören und ein Mindestausmaß von 500 ha erreichen, bilden das Gemeindejagdgebiet."},{"lvl":0,"sym":"(2)","t":"Auf begründeten Antrag der Gemeinde können mehrere Gemeindejagdgebiete gebildet werden (§ 9 Abs. 5), wenn für jedes Jagdgebiet die Voraussetzungen des Abs. 1 zutreffen und wenn nicht die Interessen an einer großflächigen jagdlichen Bewirtschaftung zur Vermeidung von waldgefährdenden Wildschäden entgegenstehen."},{"lvl":0,"sym":"(3)","t":"Auf Antrag der Gemeinde kann von der Landesregierung nach Anhören des Landesjagdbeirates und der Kärntner Jägerschaft in Fällen, in denen das Mindestausmaß von 500 ha (Abs. 1) nicht erreicht wird, ein Gemeindejagdgebiet dann festgestellt werden (§ 9), wenn die in der Gemeinde liegenden jagdlich nutzbaren Grundstücke ein Ausmaß von mindestens 115 ha erreichen, zusammenhängen und einen geordneten Jagdbetrieb ermöglichen."}]},{"id":"7","title":"Zusammenhang und jagdliche Nutzbarkeit von Grundflächen","body":[{"lvl":0,"sym":"(1)","t":"Als zusammenhängend im Sinne der §§ 5 und 6 gelten Grundflächen, wenn man von einem Grundstück zum anderen gelangen kann, ohne fremden Grund zu betreten. Der Zusammenhang von Grundstücken ist auch dann gegeben, wenn sie nur in einem Punkt zusammenstoßen. Inseln gelten als mit den Ufergrundstücken zusammenhängend."},{"lvl":0,"sym":"(2)","t":"Wege, Eisenbahngrundstücke, fließende und stehende Gewässer und Grundflächen von ähnlicher Konfiguration, die nach Umfang oder Gestalt für sich allein einen geordneten Jagdbetrieb nicht gestatten, bilden kein selbständiges Jagdgebiet; sie unterbrechen durch ihre Breite den Zusammenhang eines Jagdgebietes nicht; sie stellen durch ihre Länge den Zusammenhang eines Jagdgebietes (Abs. 1) zwischen getrennt liegenden Grundstücken nicht her. Werden diese Grundflächen nicht von einem Jagdgebiet umschlossen, so hat die Bezirksverwaltungsbehörde unter Bedachtnahme auf das räumliche Naheverhältnis festzustellen, welchem Jagdausübungsberechtigten auf diesen Grundflächen das Recht nach § 15 Abs. 5 zusteht."},{"lvl":0,"sym":"(3)","t":"Jagdliche Nutzbarkeit einer Grundfläche liegt vor, wenn diese wenigstens einer Schalenwildart Einstands- oder Äsungsmöglichkeiten bietet. Bei der Berechnung der Größe eines Jagdgebietes dürfen jedoch Grundstücke, die nicht wenigstens einer Schalenwildart Einstands- oder Äsungsmöglichkeit bieten, nicht mitgerechnet werden, wenn ihr Flächenausmaß zusammengerechnet mehr als die Hälfte der Größe des Jagdgebietes beträgt."}]},{"id":"8","title":"Gehege","body":[{"lvl":0,"sym":"(1)","t":"Gehege im Sinne dieses Gesetzes sind eingefriedete Grundflächen, auf denen Wild (§ 4) entweder zur Schau, zur Zucht, zur ausschließlichen Gewinnung von Fleisch im Rahmen eines landwirtschaftlichen Betriebes, zu Forschungszwecken oder zu vergleichbaren Zwecken gehalten wird."},{"lvl":0,"sym":"(2)","t":"Gehege müssen gegen benachbarte Grundstücke so abgeschlossen sein, dass das Wild – mit Ausnahme des Federwildes – weder ein- noch auswechseln kann."},{"lvl":0,"sym":"(3)","t":"Wer beabsichtigt, ein Gehege anzulegen, hat dies vor der Anlage unter Angabe der Wildarten, der Grundstücke oder Grundstücksteile, auf denen das Gehege angelegt werden soll, und einer Beschreibung der geplanten Einfriedung der Landesregierung anzuzeigen. Der Anzeige sind ein Lageplan und ein Beleg über das Eigentum oder die Zustimmung des Eigentümers anzuschließen. Soll in einem Gehege Schalenwild gehalten werden, ist eine nach dem Forstgesetz 1975 erforderliche Rodungsbewilligung anzuschließen, insoweit sich das Gehege auf Wald im Sinne des Forstgesetzes 1975 erstreckt."},{"lvl":0,"sym":"(4)","t":"Bei der Landesregierung eingelangte Anzeigen sind von dieser unverzüglich der Kärntner Jägerschaft, der Landwirtschaftskammer und den betroffenen Gemeinden zur Stellungnahme innerhalb einer Frist von drei Wochen zu übermitteln. Vor Ablauf dieser Frist darf weder eine Untersagung des Geheges noch eine Feststellung, dass der Errichtung keine Untersagungsgründe entgegenstehen, erfolgen. Die Anhörungsrechte begründen keine Parteistellung."},{"lvl":0,"sym":"(5)","t":"Die Landesregierung hat die Anlage eines Geheges zu untersagen, wenn die Einfriedung nicht so beschaffen ist, dass sie dem Abs. 2 entspricht oder wenn die Jagdausübung in den umliegenden Jagdgebieten dadurch wesentlich beeinträchtigt wäre."},{"lvl":0,"sym":"(6)","t":"Erfolgt eine Untersagung binnen acht Wochen nach Einlangen der vollständigen Anzeige nicht oder stellt die Landesregierung vor Ablauf dieser Frist fest, dass der Anlage des Geheges keine Untersagungsgründe entgegenstehen, darf mit der Errichtung begonnen werden, und zwar"},{"lvl":1,"sym":"a)","t":"bei Gehegen, die in einem Eigenjagdgebiet angelegt werden, sofort, wenn die verbleibende Fläche des Eigenjagdgebietes so groß ist, dass die festgestellte Eigenschaft als Eigenjagdgebiet nicht verloren geht, und"},{"lvl":1,"sym":"b)","t":"bei Gehegen, die in einem Gemeindejagdgebiet angelegt werden, nach Ablauf der Pachtzeit des Gemeindejagdgebietes, es sei denn, dass der Pächter einer vorzeitigen Errichtung zustimmt und die verbleibende Fläche des Gemeindejagdgebietes so groß ist, dass die festgestellte Eigenschaft als Gemeindejagdgebiet nicht verloren geht."},{"lvl":0,"sym":"(7)","t":"Wild in einem Gehege zur ausschließlichen Gewinnung von Fleisch im Rahmen eines landwirtschaftlichen Betriebes darf – unbeschadet tierschutzrechtlicher Anordnungen – nur vom Anleger oder dem jeweiligen Betreiber des Geheges oder von Personen getötet werden, die von diesen hiezu beauftragt wurden. Der Verkauf von Abschüssen ist verboten."},{"lvl":0,"sym":"(8)","t":"Bricht Wild aus einem Gehege aus, so ist der Anleger verpflichtet, unverzüglich die Landesregierung, die Jagdausübungsberechtigten der umliegenden Jagdgebiete und die Kärntner Jägerschaft zu verständigen. Soll Wild aus einem Gehege in Gebieten, in denen es nicht heimisch ist, in die freie Wildbahn entlassen werden, gilt § 73 Abs. 3 erster bis dritter Satz. Die Entlassung von Schalenwild in die freie Wildbahn bedarf der Genehmigung der Landesregierung. Die Genehmigung darf nur erteilt werden, wenn dadurch keine nachteiligen Auswirkungen auf ein ausgeglichenes Geschlechterverhältnis und den Altersaufbau dieser Wildart zu erwarten sind und wenn weder ein zahlenmäßig für die Land- und Forstwirtschaft abträglicher Wildstand entsteht noch eine Zunahme von Wildschäden zu erwarten ist. Bei Rotwild darf die Genehmigung überdies nur erteilt werden, wenn die Entlassung in Rotwildkernzonen oder in Rotwildrandzonen erfolgt. Die Landesregierung hat vor ihrer Entscheidung den Landesjagdbeirat und die Landwirtschaftskammer zu hören."},{"lvl":0,"sym":"(9)","t":"Die Landesregierung hat die Auflassung eines Geheges binnen angemessen festzusetzender Frist zu verfügen, wenn es vor Wirksamkeit einer Anzeige oder abweichend von einer Anzeige betrieben wird oder wenn nachträglich ein Untersagungsgrund nach Abs. 5 eintritt. Die Auflassung ist primär demjenigen, der die Anzeige eingebracht hat, oder dessen Rechtsnachfolger aufzutragen, bei konsenslos errichteten Gehegen demjenigen, der die Anlage veranlasst hat; können diese nicht herangezogen werden, dem Grundeigentümer oder dem sonst über das Grundstück Verfügungsberechtigten. Die Landesregierung hat vor ihrer Entscheidung den Landesjagdbeirat und die Landwirtschaftskammer zu hören."}]}]},{"nr":2,"title":"Gestaltung der Jagdgebiete","paras":[{"id":"9","title":"Feststellung der Jagdgebiete","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdgebiete werden durch die Bezirksverwaltungsbehörde auf die Dauer der Pachtzeit der Gemeindejagd (§ 17 Abs. 1) festgestellt."},{"lvl":0,"sym":"(2)","t":"18 Monate vor Ablauf der Pachtzeit der Gemeindejagd hat die Bezirksverwaltungsbehörde an ihrem Amtssitz und in der Gemeinde eine Kundmachung zu erlassen, mit welcher die Grundeigentümer, die für die kommende Pachtzeit die Befugnis zur Eigenjagd (§ 5) beanspruchen, aufgefordert werden, diesen Anspruch – ausgenommen die Fälle nach Abs. 4 – binnen sechs Wochen bei der Bezirksverwaltungsbehörde anzumelden und zu begründen."},{"lvl":0,"sym":"(3)","t":"Die Bezirksverwaltungsbehörde hat die Kundmachung im Sinne des Abs. 2 jenen Grundeigentümern zuzustellen, die in der laufenden Jagdpachtzeit das Eigenjagdrecht auf Grundstücken ausüben, die an das Gemeindejagdgebiet angrenzen. Die Frist zur Abgabe einer Erklärung im Sinne des Abs. 2 ist für diese Grundeigentümer mit mindestens sechs Wochen nach der Zustellung der Kundmachung festzusetzen."},{"lvl":0,"sym":"(4)","t":"War das Eigenjagdgebiet bereits anerkannt, so ist für die kommende Pachtzeit der Gemeindejagd eine neuerliche Anmeldung nicht erforderlich, sofern keine Veränderungen am Eigenjagdgebiet eingetreten sind."},{"lvl":0,"sym":"(5)","t":"Nach Ablauf der in den Abs. 2 und 3 festgelegten Fristen hat die Bezirksverwaltungsbehörde festzustellen,"},{"lvl":1,"sym":"a)","t":"welche Grundstücke als Eigenjagdgebiete anerkannt werden, welches Flächenausmaß die einzelnen Gebiete aufweisen und wem die Befugnis zur Eigenjagd darauf zusteht (Eigenjagdberechtigter),"},{"lvl":1,"sym":"b)","t":"daß die verbleibenden Grundstücke mit ihrer ziffernmäßig anzugebenden Gesamtfläche unter den Voraussetzungen des § 6 ein Gemeindejagdgebiet oder mehrere Gemeindejagdgebiete bilden."},{"lvl":0,"sym":"(6)","t":"Eigenjagden, die nicht innerhalb der in den Abs. 2 und 3 festgelegten Fristen zur Ausscheidung aus dem Gemeindejagdgebiet angemeldet werden, gehören – falls nicht Abs. 4 Platz greift – für die nächste Pachtzeit der Gemeindejagd zum Gemeindejagdgebiet. Wird eine solche Eigenjagd, die das Mindestflächenausmaß einer Gemeindejagd (§ 6 Abs. 1)nicht erreicht, nur von Eigenjagdgebieten umschlossen, so ist sie einem oder mehreren benachbarten Eigenjagdgebieten anzuschließen (§ 10)."},{"lvl":0,"sym":"(7)","t":"Die Bestimmungen der Abs. 1 bis 6 sind von der Bezirksverwaltungsbehörde im Falle der vorzeitigen Beendigung des Pachtverhältnisses über die Gemeindejagd (§§ 22 und 23) oder im Falle der Nichtigerklärung einer Jagdgebietsfeststellung sinngemäß anzuwenden, sobald die vorzeitige Beendigung des Pachtvertrages feststeht."},{"lvl":0,"sym":"(8)","t":"Entgegen den Bestimmungen des § 5, in Verbindung mit § 7 und § 9, erlassene Bescheide über die Feststellung von Eigenjagdgebieten und entgegen den Bestimmungen des § 6 Abs. 1 und 2, in Verbindung mit § 7, erlassene Bescheide über die Feststellung von Gemeindejagdgebieten sind mit Nichtigkeit bedroht. Der Landesregierung obliegt die Aufhebung der nach diesem Gesetz mit Nichtigkeit bedrohten Bescheide. Nach Ablauf eines Jahres nach der Rechtskraft des Bescheides ist eine Nichtigerklärung nicht mehr zulässig."},{"lvl":0,"sym":"(9)","t":"Von einer Nichtigerklärung einer Jagdgebietsfeststellung sind auch allfällige Verfügungen nach §§ 10 bis 12, die dieses Jagdgebiet betreffen, erfaßt."},{"lvl":0,"sym":"(10)","t":"Ist ein Jagdgebiet im Zeitpunkt der Nichtigerklärung der Jagdgebietsfeststellung (Abs. 8) bereits verpachtet, so bleibt derjenige, dem die Jagd verpachtet wurde, Pächter der Jagd (einstweiliger Pächter), und zwar bis zum Eintritt der Rechtskraft der endgültigen Entscheidung über die Nichtigerklärung. Diese Entscheidung hat die Nichtigkeit des Rechtsgeschäftes über die Verpachtung zur Folge."},{"lvl":0,"sym":"(11)","t":"Ist ein Jagdgebiet im Zeitpunkt der Nichtigerklärung der Jagdgebietsfeststellung (Abs. 8) noch nicht verpachtet, so bleibt das Jagdausübungsrecht beim Grundeigentümer, und zwar bis zum Ablauf der Beschwerdefrist an das Landesverwaltungsgericht, wurde Beschwerde an das Landesverwaltungsgericht erhoben, bis zum Eintritt der Rechtskraft der endgültigen Entscheidung über die Nichtigerklärung; bei Nichtigerklärung einer Gemeindejagdgebietsfeststellung hat die Gemeinde für den angeführten Zeitraum einen Jagdverwalter (§ 34) zu bestellen."}]},{"id":"10","title":"Anschluß von Grundflächen an Jagdgebiete","body":[{"lvl":0,"sym":"(1)","t":"Benachbarten Jagdgebieten sind von der Bezirksverwaltungsbehörde unter Bedachtnahme auf einen geordneten Jagdbetrieb anzuschließen:"},{"lvl":1,"sym":"a)","t":"nicht zu einem Jagdgebiet gehörende jagdlich nutzbare Grundstücke, die nicht die Mindestgröße einer Gemeindejagd aufweisen, sowie Grundflächen, die jagdlich nicht nutzbar sind, weil sie nicht wenigstens einer Schalenwildart Einstands- oder Äsungsmöglichkeiten bieten, sofern die Bestimmungen des § 7 Abs. 3 zweiter Satz nicht verletzt werden;"},{"lvl":1,"sym":"b)","t":"Eigenjagdgebiete, hinsichtlich derer auf die Ausübung des Eigenjagdrechtes gemäß § 2 Abs. 6 verzichtet worden ist;"},{"lvl":1,"sym":"c)","t":"Grundflächen im Sinne des § 7 Abs. 2;"},{"lvl":1,"sym":"d)","t":"Eigenjagden gemäß § 9 Abs. 6;"},{"lvl":1,"sym":"e)","t":"Grundflächen gemäß § 14 Abs. 1."},{"lvl":0,"sym":"(2)","t":"Der Anschluß von im Abs. 1 angeführten Grundstücken bzw. Grundflächen an ein Jagdgebiet gilt als Pachtverhältnis. Die Vereinbarung über die Höhe des Pachtzinses bedarf der Schriftform. Kommt eine Einigung über den Pachtzins nicht zustande, so ist er von der Bezirksverwaltungsbehörde festzusetzen; bei Gemeindejagden und nicht verpachteten Eigenjagden sind hiebei die Pachtzinse zu berücksichtigen, die für Jagden erzielt werden, die in der Nähe liegen und im wesentlichen gleiche oder ähnliche jagdliche Verhältnisse aufweisen; bei verpachteten Eigenjagden ist der für die Eigenjagd vereinbarte Pachtzins festzusetzen."}]},{"id":"11","title":"Abrundung der Jagdgebiete","body":[{"lvl":0,"sym":"(1)","t":"Jagdgebiete können im Interesse eines geordneten Jagdbetriebes auf Antrag der Gemeinde, der Eigenjagdberechtigten oder von Amts wegen durch die Bezirksverwaltungsbehörde abgerundet werden. Hiebei können Grundflächen von einem Jagdgebiet abgetrennt oder einem benachbarten angeschlossen oder Flächen aneinandergrenzender Jagdgebiete getauscht werden; soweit möglich, ist dem Flächentausch der Vorzug zu geben. Durch die Abrundung oder den Flächentausch darf die Größe der Jagdgebiete möglichst wenig geändert werden. Die Abrundung von Jagdgebieten wird durch die Grenzen der politischen Bezirke nicht gehindert. Liegen die Jagdgebiete in verschiedenen Bezirken, so ist die Entscheidung von den zuständigen Bezirksverwaltungsbehörden einvernehmlich zu treffen. Kommt eine einvernehmliche Entscheidung nicht zustande, so entscheidet die Landesregierung."},{"lvl":0,"sym":"(2)","t":"Außer der Abrundung nach Abs. 1 kann aus Gründen eines geordneten Jagdbetriebes auf Antrag der Gemeinde oder der Eigenjagdberechtigten oder von Amts wegen von der Bezirksverwaltungsbehörde ein Austausch von Flächen größeren Ausmaßes verfügt werden, wobei das ursprüngliche Flächenausmaß eines Jagdgebietes nach Möglichkeit erhalten bleiben soll."},{"lvl":0,"sym":"(2a)","t":"Vor Entscheidungen nach Abs. 1 oder 2 haben die Bezirksverwaltungsbehörden und die Landesregierung den Bezirksjagdbeirat und die Jagdverwaltungsbeiräte der betroffenen oder berührten Gemeindejagdgebiete zu hören."},{"lvl":0,"sym":"(3)","t":"Für die Ausübung des Jagdrechtes auf Grundstücken, die von einem Jagdgebiet abgetrennt und einem anderen Jagdgebiet angeschlossen werden, ist ein Entgelt zu entrichten, das in Ermangelung eines Übereinkommens der Beteiligten durch die Bezirksverwaltungsbehörde nach den Grundsätzen des § 10 Abs. 2 vorletzter und letzter Satz festzusetzen ist. Die Vereinbarung über die Höhe des Entgeltes bedarf der Schriftform."}]},{"id":"12","title":"Zerlegung von Eigenjagdgebieten","body":[{"lvl":0,"sym":"","t":"Die Bezirksverwaltungsbehörde darf auf Antrag des Jagdausübungsberechtigten die Zerlegung von Eigenjagdgebieten in mehrere selbständige Jagdgebiete genehmigen, wenn die Flächenausdehnung jedes Teilgebietes im Zusammenhang das für das betreffende Jagdgebiet erforderliche Mindestausmaß aufweist, die Zerlegung aus Gründen eines geordneten Jagdbetriebes gerechtfertigt ist und nicht die Interessen an einer großflächigen jagdlichen Bewirtschaftung zur Vermeidung von waldgefährdenden Wildschäden entgegenstehen. Die Zerlegung wird mit dem Zeitpunkt wirksam, zu dem die im Zeitpunkt des Eintrittes der Rechtskraft laufende Geltungsdauer des Abschussplanes (§ 57 Abs. 3) endet."}]},{"id":"13","title":"Dauer der Wirksamkeit der Flächengestaltung","body":[{"lvl":0,"sym":"","t":"Die sich aus den §§ 10 bis 12 ergebenden Verfügungen sind für die Dauer der Pachtzeit der Gemeindejagd, und zwar hinsichtlich der sich aus § 10 Abs. 1 lit. b und e ergebenden Verfügungen im jeweils erforderlichen Zeitpunkt und hinsichtlich der sich aus § 10 Abs. 1 lit. a, c und d ergebenden Verfügungen anläßlich der Feststellung der Jagdgebiete – im Falle der Nichtigerklärung einer Jagdgebietsfeststellung (§ 9 Abs. 8) im frühestmöglichen Zeitpunkt – zu treffen; innerhalb dieser Zeit bleiben sie solange aufrecht, als sie von der Bezirksverwaltungsbehörde nicht aufgehoben oder abgeändert werden. Die Aufhebung oder Abänderung erfolgt nach Anhörung der beteiligten Gemeinden oder Eigenjagdberechtigten von Amts wegen, wenn die Voraussetzungen für den Anschluß, die Zerlegung, die Abrundung oder den Austausch der Jagdgebiete weggefallen sind oder sich wesentlich geändert haben."}]},{"id":"14","title":"Veränderung des Jagdgebietes","body":[{"lvl":0,"sym":"(1)","t":"Von einer Veräußerung eines Eigenjagdgebietes oder von Teilen davon hat der Grundeigentümer die Bezirksverwaltungsbehörde und die Kärntner Jägerschaft zu verständigen. Wird ein Eigenjagdgebiet teilweise veräußert, hat die Bezirksverwaltungsbehörde von Amts wegen mit Bescheid festzustellen, ob das Eigenjagdrecht hinsichtlich jener Grundfläche aufrecht bleibt, welche den Erfordernissen für eine Eigenjagd entspricht. Grundflächen, die den Erfordernissen für ein Eigenjagdgebiet nicht mehr entsprechen, sind von der Bezirksverwaltungsbehörde unter Bedachtnahme auf einen geordneten Jagdbetrieb Jagdgebieten anzuschließen."},{"lvl":0,"sym":"(2)","t":"Entsteht im Laufe der Pachtdauer der Gemeindejagd ein Eigenjagdgebiet, so tritt die Befugnis zur Ausübung der Eigenjagd auf diesem Gebiet erst nach Ablauf der Pachtdauer unter der Voraussetzung der ordnungsgemäßen Anmeldung und Feststellung dieses Jagdgebietes (§ 9) ein. Die Eigenjagd kann jedoch erst dann ausgeübt werden, wenn die Pachtdauer für die Gemeindejagdgebiete, denen Teile solcher Eigenjagdgebiete angehören, abgelaufen ist. Bis dahin bleiben die einzelnen Teile dieses neu entstandenen Eigenjagdgebietes Bestandteile des Gemeindejagdgebietes."}]},{"id":"15","title":"Ruhen der Jagd","body":[{"lvl":0,"sym":"(1)","t":"Auf Friedhöfen, in Häusern und Gehöften samt den dazugehörigen, durch Umfriedung vollständig abgeschlossenen Höfen und Hausgärten, in unmittelbarer Nähe von nicht derart abgeschlossenen Gebäuden sowie auf öffentlichen Anlagen, Sportanlagen (ausgenommen Skipisten und -loipen) und industriellen oder gewerblichen Zwecken dienenden Werksanlagen ruht die Jagd."},{"lvl":0,"sym":"(1a)","t":"Abweichend von Abs. 1 sind zulässig:"},{"lvl":1,"sym":"1.","t":"die Beizjagd (§ 36 Abs. 2) zum Zweck der Vergrämung von Wild, wenn deren Ausübung durch die Eigentümer oder sonst Nutzungsberechtigten der betroffenen Grundstücke zugestimmt wird;"},{"lvl":1,"sym":"2.","t":"die Durchführung von Maßnahmen zur Entnahme im Sinne des § 51 Abs. 4a oder § 52 Abs. 2a."},{"lvl":0,"sym":"(2)","t":"Auf Antrag des Eigentümers oder des Jagdausübungsberechtigten hat die Bezirksverwaltungsbehörde"},{"lvl":1,"sym":"1.","t":"nicht umfriedete Sportflächen vom Ruhen der Jagd auszunehmen, sofern dies zur Vermeidung von Wildschäden erforderlich ist;"},{"lvl":1,"sym":"2.","t":"das Ruhen der Jagd auf Grundstücken zu verfügen, die durch eine feste Umfriedung dauernd umschlossen sind; § 5 Abs. 3 des Kärntner Alm- und Weideschutzgesetzes, LGBl. Nr. 30/2024, bleibt unberührt."},{"lvl":0,"sym":"(3)","t":"Auf Grundflächen, die durch landesübliche Weidezäune verhagt sind, findet die Bestimmung des Abs. 2 keine Anwendung."},{"lvl":0,"sym":"(4)","t":"Auf den in Abs. 1 und 2 bezeichneten Grundstücken dürfen keine Vorrichtungen angebracht oder aufrecht erhalten werden, die einwechselndes Wild hindern, wieder auszuwechseln. Es ist verboten, Wild auf die in Abs.1 und 2 bezeichneten Grundstücke zu locken (anzukirren)."},{"lvl":0,"sym":"(5)","t":"Dem Jagdausübungsberechtigten steht die Befugnis zu, sich das Wild, das sich auf den in Abs. 1 und 2 bezeichneten Grundstücken gefangen hat oder dort verendet ist, sowie etwa dort aufgefundene Abwurfstangen und Eier des Federwildes anzueignen. Dies gilt nicht für Wild in einem Gehege zur Gewinnung von Fleisch (§ 8 Abs. 1), das derselben Art angehört wie das im Gehege gehaltene Wild."},{"lvl":0,"sym":"(6)","t":"Unbeschadet weitergehender Befugnisse dürfen die Eigentümer der in Abs. 1 und 2 genannten Grundstücke oder die von ihnen beauftragten Personen auf diesen,"},{"lvl":1,"sym":"1.","t":"wenn dies zur Verhütung ernster Schäden in der Tierhaltung, insbesondere zum Schutz der Haustiere, unbedingt erforderlich ist, Goldschakale, Füchse, Dachse, Edel- und Steinmarder, Iltisse, Waschbären, und"},{"lvl":1,"sym":"2.","t":"wenn dies zur Verhütung oder Bekämpfung einer Seuche unbedingt erforderlich ist, Ringel- und Türkentauben"},{"lvl":0,"sym":"","t":"fangen und töten. Der Fang und die Tötung von Goldschakalen, Iltissen und Edelmardern sowie Ringel- und Türkentauben ist überdies nur so lange zulässig, als diese ohne Beeinträchtigung in einem günstigen Erhaltungszustand verweilen; liegen diese Voraussetzungen bei einer der genannten Wildarten nicht mehr vor, hat die Landesregierung deren Fang und Tötung durch Verordnung zu verbieten. Das gefangene oder getötete Raubwild ist dem Jagdausübungsberechtigten, der zu verständigen ist, auf sein Verlangen zur Verfügung zu stellen."}]}]},{"nr":3,"title":"Jagdpachtung","paras":[{"id":"16","title":"Jagdpachtvertrag","body":[{"lvl":0,"sym":"(1)","t":"Das Jagdausübungsrecht darf nur in seiner Gesamtheit Gegenstand eines Pachtvertrages sein."},{"lvl":0,"sym":"(2)","t":"Jagdpachtverträge bedürfen der Schriftform; sie haben jedenfalls die Namen des Pächters, des Verpächters, die Bezeichnung des Jagdgebietes, die Größe des Jagdgebietes, die Pachtdauer, den Pachtzins und den Zeitpunkt seiner Erlegung zu enthalten; im Jagdpachtvertrag können weiters eine Regelung über die Zahl der Jagderlaubnisscheine, die zu bestellenden Jagdschutzorgane, die Hundehaltung und den Ersatz für Wild- und Jagdschäden sowie sonstige mit der Jagd zusammenhängende und den Bestimmungen dieses Gesetzes nicht widersprechende Regelungen aufgenommen werden. Jagdpachtverträge für die Verpachtung von Gemeindejagden haben zusätzlich die Bestimmung zu enthalten, daß sich der Pächter verpflichtet, mindestens die Hälfte der jährlich ausgegebenen Jagderlaubnisscheine (§ 41) für in der Gemeinde ansässige Jäger auszustellen. Jagdpachtverträge sind nach dem Muster eines Jagdpachtvertrages (Abs. 5) abzufassen."},{"lvl":0,"sym":"(3)","t":"Jagdpachtverträge bedürfen zu ihrer Wirksamkeit der Genehmigung der Bezirksverwaltungsbehörde. Sie sind vom Pächter binnen acht Tagen nach ihrem Abschluß der Bezirksverwaltungsbehörde vorzulegen. Die Genehmigung ist zu erteilen, wenn der Vertrag den Bestimmungen dieses Gesetzes über die Verpachtung entspricht und der Pächter die erforderliche Eignung (§ 18) hat. Die Versagung der Genehmigung hat die Nichtigkeit des Rechtsgeschäftes zur Folge. Entscheidet die Bezirksverwaltungsbehörde nicht innerhalb von zwei Monaten nach Einlangen des vollständigen Antrages, so gilt der Pachtvertrag als genehmigt."},{"lvl":0,"sym":"(4)","t":"Die Bestimmungen des Abs. 3 gelten für Jagdpachtverträge betreffend das Jagdausübungsrecht in Gemeindejagden nur insoweit, als § 29 nicht anderes bestimmt."},{"lvl":0,"sym":"(5)","t":"Die Landesregierung hat unter Bedachtnahme auf die Bestimmungen des Abs. 2 und auf die Erfordernisse eines geordneten Jagdbetriebes durch Verordnung Muster für Pachtverträge für die Verpachtung von Gemeindejagden und Eigenjagden zu erlassen. Vor Erlassung einer solchen Verordnung sind die Kärntner Jägerschaft, die Landwirtschaftskammer und der Kärntner Gemeindebund anzuhören."}]},{"id":"17","title":"Pachtdauer und Pachtjahr","body":[{"lvl":0,"sym":"(1)","t":"Die Pachtdauer beträgt zehn Jahre. Wird das Jagdpachtverhältnis vorzeitig aufgelöst oder gekündigt oder erlischt es vorzeitig oder soll ein auf Grund des § 12 während der Pachtzeit der Gemeindejagd entstandenes Jagdgebiet verpachtet werden, so darf das Jagdausübungsrecht nur auf den Rest der Pachtdauer verpachtet werden, soferne diese noch mindestens zwölf Monate beträgt; beträgt die Pachtdauer nicht mindestens zwölf Monate, darf eine neuerliche Verpachtung erst nach dem Ablauf dieser Frist erfolgen."},{"lvl":0,"sym":"(2)","t":"Das Pachtjahr dauert vom 1. Jänner bis 31. Dezember."}]},{"id":"18","title":"Jagdpächter","body":[{"lvl":0,"sym":"(1)","t":"Das Jagdausübungsrecht darf nur an Personen verpachtet werden,"},{"lvl":1,"sym":"a)","t":"denen die Ausstellung einer Jagdkarte nicht zu verweigern ist (§ 38);"},{"lvl":1,"sym":"b)","t":"die bereits mindestens während dreier voller Jahre ununterbrochen im Besitz einer gültigen Jagdkarte eines österreichischen Bundeslandes oder die mindestens während dreier voller Jahre ununterbrochen im Besitz einer Jagdkarte (einer sonstigen Bescheinigung), die gleichartige Rechte vermittelt, eines Vertragsstaates des Europäischen Wirtschaftsraumes oder der Europäischen Union waren;"},{"lvl":1,"sym":"c)","t":"die das 21. Lebensjahr vollendet haben;"},{"lvl":1,"sym":"d)","t":"die gemäß Abs. 2 von der Pachtung eines Jagdausübungsrechtes nicht ausgeschlossen sind;"},{"lvl":1,"sym":"e)","t":"die österreichische Staatsbürger oder sonstige Staatsangehörige von Vertragsstaaten des Abkommens über den Europäischen Wirtschaftsraum oder der Europäischen Union sind, es sei denn, daß sie eine Genehmigung nach Abs. 2 haben."},{"lvl":0,"sym":"(1a)","t":"Das Jagdausübungsrecht in einer Gemeindejagd darf über die Bestimmungen des Abs. 1 hinaus überdies nur an Personen verpachtet werden, deren Hauptwohnsitz – bei juristischen Personen der Hauptwohnsitz des Bevollmächtigten (Abs. 3) und im Falle des Abs. 4 der Hauptwohnsitz der überwiegenden Zahl der Vereinsmitglieder – so gelegen ist, daß im Falle einer Pachtung durch natürliche Personen diese, durch juristische Personen der Bevollmächtigte und im Falle des Abs. 4 die Vereinsmitglieder persönlich die Jagd so ausüben können, daß eine ordnungsgemäße Jagdausübung und damit auch ein ordnungsgemäßer Jagdbetrieb gewährleistet ist."},{"lvl":0,"sym":"(2)","t":"Personen nicht österreichischer Staatsbürgerschaft – ausgenommen Staatsangehörige von Vertragsstaaten des Europäischen Wirtschaftsraumes oder der Europäischen Union – bedürfen zum Abschluß eines Jagdpachtvertrages der Genehmigung der Landesregierung. Die Genehmigung ist zu versagen, wenn die Voraussetzungen des Abs. 1 lit. a bis c, bei Gemeindejagden auch des Abs. 1a, nicht vorliegen oder die Verpachtung öffentlichen Interessen zuwiderläuft. Diese Personen haben zusätzlich zum Erfordernis nach Abs. 1 lit. b den Nachweis der jagdlichen Eignung gemäß § 37 Abs. 7 lit. a oder c zu erbringen."},{"lvl":0,"sym":"(3)","t":"Das Jagdausübungsrecht darf an eine juristische Person nur verpachtet werden, wenn der von ihr namhaft gemachte Bevollmächtigte die Voraussetzungen nach Absatz 1 erfüllt und wenn sichergestellt ist, daß für den Fall der Kündigung des Pachtvertrages oder des Unterganges der juristischen Person alle Verpflichtungen aus dem Pachtverhältnis erfüllt werden können. Für juristische Personen, die ihre Hauptniederlassung im Ausland, ausgenommen in einem Vertragsstaat des Europäischen Wirtschaftsraumes und der Europäischen Union haben, gelten überdies die Bestimmungen des Abs. 2 sinngemäß."},{"lvl":0,"sym":"(4)","t":"Das Jagdausübungsrecht darf an einen Verein im Sinne des Vereinsgesetzes 2002, BGBl.I Nr 66/2002, zuletzt in der Fassung BGBl. I Nr. 211/2021, nur verpachtet werden, wenn"},{"lvl":1,"sym":"a)","t":"dessen satzungsgemäßer Zweck die Pachtung eines Jagdausübungsrechtes ist (Jagdgesellschaft), und wenn für den Fall der Kündigung des Pachtvertrages oder der Auflösung des Vereins sichergestellt ist, daß alle Verpflichtungen aus dem Pachtverhältnis erfüllt werden können,"},{"lvl":1,"sym":"b)","t":"ein von ihm namhaft gemachter Bevollmächtigter die Voraussetzungen nach Abs. 1 erfüllt,"},{"lvl":1,"sym":"c)","t":"nach den Statuten eine den Bestimmungen dieses Gesetzes entsprechende Ausübung der Jagd unter einheitlicher Leitung gewährleistet ist, wobei dieser Jagdleiter die Voraussetzungen nach Abs. 1 erfüllen muß, und"},{"lvl":1,"sym":"d)","t":"die Zahl der Mitglieder der Jagdgesellschaft, die gleichzeitig Inhaber von Jagdkarten sind, den Bestimmungen des § 19 entspricht."},{"lvl":0,"sym":"(5)","t":"Soll das Jagdausübungsrecht an mehr als eine Person verpachtet werden (Mitpächter), so muß jede Person die Voraussetzungen nach Abs. 1 erfüllen. Die Zahl der Pächter darf die nach § 19 zulässige Zahl von Jagdausübungsberechtigten nicht übersteigen. Mehrere Mitpächter haften für die aus dem Pachtvertrag entstehenden Verbindlichkeiten zur ungeteilten Hand."},{"lvl":0,"sym":"(6)","t":"Gemeinden sind von der Pachtung eines Jagdausübungsrechtes ausgeschlossen. Eine Pachtung im Sinne des § 10 bleibt unberührt."}]},{"id":"19","title":"Zahl der Jäger","body":[{"lvl":0,"sym":"(1)","t":"In einem Jagdgebiet dürfen nur so viele Personen die Jagd ständig ausüben, daß auf je 50 ha – bei einem überwiegenden Bestand von Rotwild oder Gamswild auf je 100 ha – eine Person entfällt."},{"lvl":0,"sym":"(2)","t":"Bei aneinandergrenzenden Jagdgebieten desselben Jagdausübungsberechtigten darf die sich für die aneinandergrenzenden Jagdgebiete nach Abs. 1 ergebende zulässige Höchstzahl von Personen, die die Jagd ständig ausüben dürfen, unter Zugrundelegung des Flächenausmaßes der aneinandergrenzenden Jagdgebiete ermittelt werden."},{"lvl":0,"sym":"(3)","t":"Auf die zulässige Höchstzahl ist je angefangene 1500 ha eines Jagdgebietes ein für dieses Jagdgebiet bestelltes und angelobtes Jagdschutzorgan nicht anzurechnen."}]},{"id":"20","title":"Unterverpachtung","body":[{"lvl":0,"sym":"","t":"Die Unterverpachtung eines Jagdausübungsrechtes ist nur mit Bewilligung der Bezirksverwaltungsbehörde zulässig. Die Bewilligung ist zu erteilen, wenn"},{"lvl":1,"sym":"a)","t":"die Unterverpachtung im Pachtvertrag vorgesehen ist;"},{"lvl":1,"sym":"b)","t":"die Unterpächter die Voraussetzungen des § 18 erfüllen;"},{"lvl":1,"sym":"c)","t":"die Unterverpachtung den Grundsätzen eines geordneten Jagdbetriebes nicht widerspricht und"},{"lvl":1,"sym":"d)","t":"die Zahl der Unterpächter den Bestimmungen des § 19 entspricht. § 16 Abs. 3 vorletzter und letzter Satz gelten sinngemäß."}]},{"id":"21","title":"Pachtzins","body":[{"lvl":0,"sym":"","t":"Ändert sich die Größe des Jagdgebietes während der Pachtdauer, so erhöht oder vermindert sich der Pachtzins entsprechend dem Flächenausmaß."}]},{"id":"22","title":"Tod des Pächters","body":[{"lvl":0,"sym":"","t":"Nach dem Tod des Pächters kann der Pachtvertrag von seinen Rechtsnachfolgern oder dem Verpächter unter Einhaltung einer halbjährigen Kündigungsfrist für das Ende des Pachtjahres gekündigt werden. Ist keiner der Rechtsnachfolger als Pächter geeignet, so erlischt der Vertrag mit Ende des Jahres, in dem der Erbfall eingetreten ist. Für die Zeit bis zum Erlöschen des Vertrages haben die nicht als Pächter geeigneten Rechtsnachfolger einen Jagdverwalter (§ 34) zu bestellen. Unterlassen sie dies, so hat die Bezirksverwaltungsbehörde auf Kosten der Rechtsnachfolger einen Jagdverwalter zu bestellen. Im Falle eines Mitpachtverhältnisses kann beim Tod von Mitpächtern das Pachtverhältnis mit Zustimmung des Verpächters von den überlebenden Mitpächtern fortgesetzt werden."},{"lvl":0,"sym":"","t":"Diese Fortsetzung ist der Bezirksverwaltungsbehörde und der Kärntner Jägerschaft vom Verpächter schriftlich anzuzeigen."}]},{"id":"23","title":"Auflösung und Kündigung des Jagdpachtvertrages","body":[{"lvl":0,"sym":"(1)","t":"Die Bezirksverwaltungsbehörde hat den Jagdpachtvertrag aufzulösen, wenn"},{"lvl":1,"sym":"1.","t":"das Jagdgebiet aufhört, ein selbständiges Jagdgebiet zu sein, weil Grundflächen ihre jagdliche Nutzbarkeit verlieren, oder"},{"lvl":1,"sym":"2.","t":"der Pächter"},{"lvl":2,"sym":"a)","t":"die Fähigkeit zur Erlangung einer Jagdkarte verloren hat (§ 38) oder nicht innerhalb von drei Monaten nach Ablauf des Jagdjahres eine neue Jagdkarte löst, es sei denn, daß er durch ein unvorhergesehenes oder unabwendbares Ereignis ohne sein Verschulden daran gehindert war;"},{"lvl":2,"sym":"b)","t":"die Fähigkeit zur Erlangung einer Jagdpachtung verloren hat (§ 18);"},{"lvl":2,"sym":"c)","t":"die Kaution oder deren Ergänzung (§ 32) trotz zweimaliger Aufforderung durch die Bezirksverwaltungsbehörde nicht oder nicht vollständig erlegt hat;"},{"lvl":2,"sym":"d)","t":"den Vorschriften über die Bestellung der Jagdschutzorgane (§§ 43 bis 45) ungeachtet der Aufforderung durch die Bezirksverwaltungsbehörde nicht entsprochen hat;"},{"lvl":2,"sym":"e)","t":"sich wiederholt einer sonstigen Übertretung dieses Gesetzes schuldig gemacht hat;"},{"lvl":2,"sym":"f)","t":"in der abgelaufenen Abschussplanperiode den Abschussplan nicht bloß geringfügig nicht erfüllt hat oder er den im Abschussplan festgelegten Abschuss eigenmächtig überschreitet oder das Raubwild zum Schutz der Haustiere nicht kurzhält;"},{"lvl":2,"sym":"g)","t":"wiederholt den Vorschriften über die Ausstellung von Jagderlaubnisscheinen an in der Gemeinde ansässige Jäger nicht entspricht."},{"lvl":0,"sym":"(2)","t":"Hat der Pächter die Auflösung des Jagdpachtvertrages verschuldet, so hat er die Kosten der neuerlichen Verpachtung zu tragen."},{"lvl":0,"sym":"(3)","t":"Sind mehrere Mitpächter vorhanden und treffen die im Abs. 1 angeführten Voraussetzungen für die Auflösung des Jagdpachtvertrages nicht für alle Mitpächter zu, so kann im Falle einer Auflösung des Jagdpachtvertrages nach Abs. 1 das Jagdpachtverhältnis mit Zustimmung des Verpächters von den übrigen Mitpächtern fortgesetzt werden. Diese Fortsetzung ist der Bezirksverwaltungsbehörde und der Kärntner Jägerschaft schriftlich anzuzeigen."},{"lvl":0,"sym":"(4)","t":"Der Verpächter kann den Pachtvertrag unter Einhaltung einer halbjährigen Kündigungsfrist für das Ende des Pachtjahres kündigen, wenn der Pächter trotz zweimaliger schriftlicher Mahnung mit der Bezahlung des rechtskräftig festgestellten Wildschadens oder des Pachtzinses länger als drei Monate im Verzug ist oder trotz nachweislichem Hinweis einen schwerwiegenden Verstoß gegen die im Jagdpachtvertrag festgeschriebenen Vereinbarungen begangen hat. Im Fall eines Gemeindejagdgebietes darf die Kündigung gemäß dem vorherigen Satz nur nach Anhörung des Jagdverwaltungsbeirates erfolgen. Der Pächter hat die Kosten der neuerlichen Verpachtung zu tragen."},{"lvl":0,"sym":"(5)","t":"Der Pächter kann den Pachtvertrag unter Einhaltung einer halbjährigen Kündigungsfrist für das Ende des Pachtjahres kündigen, wenn er nachweist, daß er wegen körperlicher oder geistiger Gebrechen unfähig geworden ist, die Jagd auszuüben oder wirtschaftliche Gründe, etwa wegen Erschwernissen bei der jagdlichen Bewirtschaftung, die Aufrechterhaltung des Pachtverhältnisses unzumutbar machen."},{"lvl":0,"sym":"(6)","t":"Falls der Pachtvertrag keine gegenteilige Bestimmung enthält, kann der Pächter den Vertrag unter Einhaltung einer halbjährigen Kündigungsfrist für das Ende des Pachtjahres kündigen, wenn sich das Jagdgebiet um mehr als ein Fünftel vergrößert oder verkleinert hat."},{"lvl":0,"sym":"(7)","t":"Der Verpächter und der Pächter dürfen den Pachtvertrag zum Ende des Pachtjahres im letzten Jahr der Geltungsdauer des Abschussplans einvernehmlich auflösen."}]}]},{"nr":4,"title":"Verwertung der Gemeindejagd","paras":[{"id":"24","title":"Art der Verwertung","body":[{"lvl":0,"sym":"(1)","t":"Die Gemeinde hat das Jagdausübungsrecht in Gemeindejagdgebieten zu verpachten. Dies kann im Wege der Verpachtung aus freier Hand (§ 33) oder - wenn auf diesem Weg eine Verpachtung nicht zustande kommt, unzulässig ist oder nicht genehmigt wird - im Wege der öffentlichen Versteigerung an den Meistbieter erfolgen."},{"lvl":0,"sym":"(2)","t":"Der Gemeinderat hat zum ehestmöglichen Zeitpunkt nach der Feststellung der Jagdgebiete über die Art der Verwertung entsprechend den Bestimmungen dieses Abschnittes zu beschließen."}]},{"id":"25","title":"Versteigerungs- und Pachtbedingungen","body":[{"lvl":0,"sym":"(1)","t":"Für den Fall, daß eine öffentliche Versteigerung des Jagdausübungsrechtes in einer Gemeindejagd erforderlich ist, hat der Bürgermeister unverzüglich nach der Feststellung des Gemeindejagdgebietes Versteigerungs- und Pachtbedingungen entsprechend dem Muster (§ 28 Abs. 10) festzulegen. Die Versteigerungs- und Pachtbedingungen haben insbesondere zu enthalten: die Bezeichnung des Jagdgebietes, seine Beschreibung und Größe, Regelungen über den Pachtzins, über die Personen, die als Bewerber und Pächter in Frage kommen, den Ausrufungspreis, das Vadium, die Kaution, die Anzahl der zu bestellenden Jagdschutzorgane, die Jagderlaubnisscheine, die Hundehaltung und den Ersatz für Wild- und Jagdschäden."},{"lvl":0,"sym":"(2)","t":"Die Versteigerungs- und Pachtbedingungen bedürfen der Genehmigung der Bezirksverwaltungsbehörde; die Genehmigung ist zu erteilen, wenn sie den Bestimmungen dieses Gesetzes entsprechen. Entscheidet die Bezirksverwaltungsbehörde nicht innerhalb von sechs Wochen nach Einlangen des vollständigen Antrages, so gelten die Versteigerungs- und Pachtbedingungen als genehmigt."},{"lvl":0,"sym":"(3)","t":"Die genehmigten Versteigerungs- und Pachtbedingungen sind vom Tag der Kundmachung der Versteigerung (§ 26) bis zum Versteigerungstermin im Gemeindeamt zur öffentlichen Einsichtnahme aufzulegen; gleichzeitig sind sie der Bezirksgruppe der Kärntner Jägerschaft zu übermitteln."}]},{"id":"26","title":"Kundmachung der Versteigerung","body":[{"lvl":0,"sym":"(1)","t":"Ist das Jagdausübungsrecht im Wege der öffentlichen Versteigerung an den Meistbieter zu versteigern, hat der Bürgermeister nach der Genehmigung der Versteigerungs- und Pachtbedingungen den Versteigerungstermin festzusetzen und die Versteigerung auszuschreiben. Die Ausschreibung ist mindestens sechs Wochen vor dem festgesetzten Versteigerungstermin in der Kärntner Landeszeitung und durch Anschlag an den Amtstafeln der Gemeinden, in denen das Gemeindejagdgebiet liegt, und der Bezirksverwaltungsbehörde kundzumachen. Die Bezirksgruppe der Kärntner Jägerschaft ist von der Kundmachung zu verständigen. Die Ausschreibung der Versteigerung hat nach dem Muster (§ 28 Abs. 10) zu erfolgen."},{"lvl":0,"sym":"(2)","t":"Die Kundmachung der öffentlichen Versteigerung hat die Bezeichnung des Gemeindejagdgebietes, seine Größe, die Pachtdauer, den Ort und die Zeit der Versteigerung, den im letzten Jahr im Abschußplan festgelegten Abschuß, den Ausrufungspreis und das zu erlegende Vadium zu enthalten."}]},{"id":"27","title":"Vadium","body":[{"lvl":0,"sym":"","t":"Das Vadium haftet für den fristgerechten Ersatz der Kosten der Versteigerung sowie für den rechtzeitigen Erlag des ersten Pachtzinses. Es ist mindestens in der Höhe des Ausrufungspreises festzusetzen und darf das Doppelte desselben nicht übersteigen."}]},{"id":"28","title":"Durchführung der Versteigerung","body":[{"lvl":0,"sym":"(1)","t":"Die Versteigerung des Jagdausübungsrechtes in einer Gemeindejagd ist vom Bürgermeister unter Beiziehung eines Schriftführers und eines Ausrufers durchzuführen."},{"lvl":0,"sym":"(2)","t":"Als Bieter ist nur zuzulassen, wer das Vadium ordnungsgemäß erlegt hat und nachweist, daß er entweder die Voraussetzungen des § 18 Abs. 1 lit. b und Abs. 1a oder des § 18 Abs. 2 letzter Satz erfüllt."},{"lvl":0,"sym":"","t":"Jagdgesellschaften haben nachzuweisen, daß sie auch die Voraussetzungen des § 18 Abs. 4 lit. a bis d erfüllen; sonstige juristische Personen haben auch nachzuweisen, daß sie auch die Voraussetzungen des § 18 Abs. 3 erfüllen."},{"lvl":0,"sym":"(3)","t":"Der Schriftführer hat zunächst die von der Bezirksverwaltungsbehörde genehmigten Versteigerungs- und Pachtbedingungen zu verlesen und die Namen der nach Abs. 2 zugelassenen Bieter in die Versteigerungsniederschrift einzutragen."},{"lvl":0,"sym":"(4)","t":"Hierauf ist ohne Verzug mit der Versteigerung zu beginnen. Wird nach dem Ausruf des in den Pachtbedingungen bestimmten Ausrufungspreises ein Anbot gemacht, das dem Ausrufungspreis entspricht, bzw. werden in der Folge höhere Anbote gestellt, so hat der Ausrufer jedes dieser Anbote zu wiederholen. Die Versteigerung ist zu schließen, wenn ungeachtet einer zweimaligen Aufforderung innerhalb von fünf Minuten nach der zweiten Aufforderung ein höheres Anbot nicht mehr abgegeben wird. Darauf sind die Anwesenden vom Ausrufer unmittelbar vor der zweiten Aufforderung aufmerksam zu machen. Vor dem Schluß der Versteigerung hat der Ausrufer das letzte Anbot bekannt zu machen und den Schluß der Versteigerung zu verkünden."},{"lvl":0,"sym":"(5)","t":"Wenn ein Anbot von mehreren Bietern gleichzeitig derart gestellt wird, daß der erste Bieter nicht festgestellt werden kann, und dieses Anbot nicht mehr übersteigert wird, ist bei Bietern mit verschiedener Staatsangehörigkeit dem Bieter mit österreichischer Staatsangehörigkeit (mit Hauptniederlassung in Österreich) der Vorzug zu geben, wobei Staatsangehörige von Vertragsstaaten des Europäischen Wirtschaftsraumes oder der Europäischen Union (juristische Personen mit Hauptniederlassung in diesem Bereich) österreichischen Staatsbürgern (juristischen Personen mit Hauptniederlassung in Österreich) gleichgestellt sind; ansonsten entscheidet das Los darüber, welcher von jenen Bietern, die gleichzeitig dasselbe Anbot gestellt haben, als Ersteher zu gelten hat."},{"lvl":0,"sym":"(6)","t":"Wird das in den Pachtbedingungen festgelegte Mindestanbot (Ausrufungspreis) nicht erreicht und meldet sich trotz dreimaligen Ausrufes desselben kein Bieter, so ist die Versteigerung als ergebnislos abzubrechen."},{"lvl":0,"sym":"(7)","t":"Der Schriftführer hat das Ergebnis der Versteigerung in die Versteigerungsniederschrift einzutragen und sämtliche Anbote und die Namen der Bieter, von denen sie gestellt werden, vorzumerken."},{"lvl":0,"sym":"(8)","t":"Nach Abschluß des Versteigerungsverfahrens gemäß den vorstehenden Bestimmungen sind die erlegten Vadien jenen Bietern, die nicht zum Zug gekommen sind, gegen Bestätigung in der Versteigerungsniederschrift zurückzustellen. Die Versteigerungsniederschrift ist sodann vom Schriftführer zu verlesen und von sämtlichen Bietern, vom Bürgermeister und vom Schriftführer zu unterfertigen."},{"lvl":0,"sym":"(9)","t":"Der Ersteher erhält das von ihm erlegte Vadium nach fristgerechtem Ersatz der der Gemeinde durch die Versteigerung erwachsenen Kosten und nach fristgerechtem Erlag des ersten Pachtzinses zurück, soferne es nicht mit seiner Zustimmung auf diese Kosten angerechnet wird."},{"lvl":0,"sym":"(10)","t":"Die Landesregierung hat durch Verordnung Muster für die Versteigerungs- und Pachtbedingungen, für die Kundmachung der Versteigerung und für die Versteigerungsniederschrift festzusetzen."}]},{"id":"29","title":"Entscheidung der Bezirksverwaltungsbehörde","body":[{"lvl":0,"sym":"(1)","t":"Unverzüglich nach der Versteigerung hat der Bürgermeister den Pachtvertrag unter Anschluß der Versteigerungsniederschrift, der Versteigerungs- und Pachtbedingungen und des Nachweises der Kundmachung der Versteigerung in der Kärntner Landeszeitung der Bezirksverwaltungsbehörde zur Genehmigung vorzulegen (§ 16 Abs. 3)."},{"lvl":0,"sym":"(2)","t":"Die Bezirksverwaltungsbehörde hat zu prüfen, ob bei der Versteigerung und im Pachtvertrag die gesetzlichen Bestimmungen eingehalten worden sind und ob der Pächter die erforderliche Eignung (§ 18) besitzt."},{"lvl":0,"sym":"(3)","t":"Genehmigt die Bezirksverwaltungsbehörde die Verpachtung an den Ersteher nicht, so hat sie den Zuschlag aufzuheben und die übrigen Bieter zu befragen, ob sie ihr Anbot auf das Meistbot ergänzen. Tun dies mehrere Bieter, so gebührt demjenigen der Vorrang, der bei der Versteigerung das höhere Anbot gestellt hat. Haben zwei Personen verschiedener Staatsangehörigkeit ein gleich hohes Anbot gestellt, so gebührt dem Bieter mit österreichischer Staatsangehörigkeit (mit Hauptniederlassung in Österreich) der Vorzug, wobei Staatsangehörige von Vertragsstaaten des Europäischen Wirtschaftsraumes oder der Europäischen Union (juristische Personen mit Hauptniederlassung in diesem Bereich) österreichischen Staatsbürgern (juristischen Personen mit Hauptniederlassung in Österreich) gleichgestellt sind;"},{"lvl":0,"sym":"","t":"in den übrigen Fällen hat bei gleich hohen Anboten das Los zu entscheiden. Findet die Bezirksverwaltungsbehörde, daß keinem dieser Bieter der Zuschlag zu erteilen ist, da die erforderliche Eignung (§ 18) fehlt, so ist eine neuerliche Versteigerung anzuordnen."},{"lvl":0,"sym":"(4)","t":"Hat die Bezirksverwaltungsbehörde den Pachtvertrag genehmigt (§ 16 Abs. 3) oder den Zuschlag einem anderen Bieter erteilt (Abs. 3) und wurde dagegen Beschwerde beim Landesverwaltungsgericht erhoben, dann bleibt der von der Bezirksverwaltungsbehörde genehmigte Ersteher bis zur rechtskräftigen Entscheidung über die Beschwerde Pächter der Gemeindejagd (einstweiliger Pächter)."},{"lvl":0,"sym":"(5)","t":"Hat die Bezirksverwaltungsbehörde dem Pachtvertrag die Genehmigung versagt und wird dagegen Beschwerde beim Landesverwaltungsgericht erhoben, so ist bis zur rechtskräftigen Genehmigung eines Pachtvertrages ein Jagdverwalter (§ 34) mit der Ausübung des Jagdrechtes in der Gemeindejagd zu betrauen."}]},{"id":"30","title":"Ergebnislosigkeit der Versteigerung","body":[{"lvl":0,"sym":"","t":"Wird bei der Versteigerung der Ausrufungspreis nicht erreicht (§ 28 Abs. 6) oder ist überhaupt kein Bieter erschienen, so hat der Gemeinderat längstens binnen zwei Wochen nach erfolgloser Versteigerung darüber zu beschließen, ob eine neuerliche Versteigerung unter Neufestsetzung des Ausrufungspreises oder die Verpachtung aus freier Hand gemäß § 33 stattfinden soll."}]},{"id":"31","title":"Ersatz der Verpachtungskosten","body":[{"lvl":0,"sym":"","t":"Der Pächter hat der Gemeinde binnen zwei Wochen nach Rechtskraft der Genehmigung des Pachtvertrages die ihr durch die Verpachtung erwachsenen Kosten zu ersetzen."}]},{"id":"32","title":"Kaution","body":[{"lvl":0,"sym":"(1)","t":"Wenn der Pachtvertrag innerhalb der Pachtdauer (§ 17 Abs. 1) genehmigt wird, so hat der Pächter binnen zwei Wochen nach der Genehmigung eine Kaution bei der Gemeinde zu erlegen. Wird der Pachtvertrag vor Beginn der Pachtdauer genehmigt, so ist die Kaution binnen zwei Wochen nach ihrem Beginn zu erlegen. Die Kaution ist in Gestalt eines Sparbuches oder einer Bankgarantie eines zum Geschäftsbetrieb in Österreich berechtigten Kreditinstitutes zur Leistung eines Betrages in Höhe des Jagdpachtzinses und mit einer Laufzeit von zumindest drei Monaten über das Vertragsende hinaus zugunsten des Verpächters zu erlegen. Der Bürgermeister hat die Kaution zu verwahren und im Umfang der Inanspruchnahme gemäß Abs. 3 an die Gemeinde, ansonsten nach Ende der Laufzeit an den Pächter auszufolgen."},{"lvl":0,"sym":"(2)","t":"Die Kaution dient der Sicherung der Erfüllung aller Verpflichtungen, die dem Pächter aus dem Pachtvertrag oder aus diesem Gesetz erwachsen."},{"lvl":0,"sym":"(3)","t":"Soweit nicht über Ansprüche aus Verpflichtungen gemäß Abs. 2 ein ordentliches Gericht oder die Schlichtungsstelle (§ 77) zu entscheiden hat oder soferne der Erleger der Inanspruchnahme der Kaution nicht zustimmt, hat die Bezirksverwaltungsbehörde über die Inanspruchnahme der Kaution mit Bescheid zu verfügen."},{"lvl":0,"sym":"(4)","t":"Sinkt die Kaution infolge ihrer Verwendung unter den Betrag des jährlichen Pachtzinses, so hat sie der Pächter binnen zwei Wochen nach Aufforderung durch die Bezirksverwaltungsbehörde auf die ursprüngliche Höhe zu ergänzen."},{"lvl":0,"sym":"(5)","t":"Die Kaution ist dem Pächter vier Wochen nach Ablauf der Pachtzeit zurückzustellen, wenn er seine Verpflichtungen (Abs. 2) erfüllt hat."}]},{"id":"33","title":"Verpachtung aus freier Hand","body":[{"lvl":0,"sym":"(1)","t":"Die Verpachtung des Jagdausübungsrechtes in einer Gemeindejagd aus freier Hand ist nur zulässig, wenn sie im Interesse eines geordneten Jagdbetriebes liegt und den Interessen der Land- und Forstwirtschaft nicht widerspricht und wenn"},{"lvl":1,"sym":"a)","t":"die Jagd an den bisherigen Pächter vergeben wird, oder"},{"lvl":1,"sym":"b)","t":"die Jagd an einen Pächter vergeben wird, der die Voraussetzungen des § 18 Abs. 1a erfüllt, oder"},{"lvl":1,"sym":"c)","t":"mindestens zwei Drittel der Eigentümer (Abs. 9) der die Gemeindejagd bildenden jagdlich nutzbaren Grundstücke, die zusammen Eigentümer (Abs. 9) von mindestens zwei Drittel der im Gemeindegebiet gelegenen jagdlich nutzbaren Grundflächen sind, der freihändigen Vergabe an einen bestimmten Bewerber zustimmen, und zwar unabhängig davon, ob es sich um den bisherigen Pächter (lit a) oder einen Pächter nach lit. b handelt."},{"lvl":0,"sym":"(1a)","t":"Ein Widerspruch zu den Interessen der Land- und Forstwirtschaft (Abs. 1) liegt insbesondere dann vor, wenn der gebotene Pachtzins im Vergleich mit den Pachtzinsen vergleichbarer Gemeindejagden im politischen Bezirk - gibt es im politischen Bezirk nichts Vergleichbares, in den benachbarten politischen Bezirken - unverhältnismäßig niedrig bemessen wird."},{"lvl":0,"sym":"(2)","t":"Zur Verpachtung des Jagdausübungsrechtes in einer Gemeinde aus freier Hand ist in den Fällen des Abs. 1 lit. a oder b auch die Zustimmung des Jagdverwaltungsbeirates (§ 94) erforderlich. Die Beschlußfassung über die Verpachtung des Jagdausübungsrechtes in einer Gemeinde obliegt dem Gemeinderat. Hat sich der Jagdverwaltungsbeirat für eine Verpachtung aus freier Hand ausgesprochen oder liegt ein Fall des Abs. 1 lit. c vor, ist für einen Beschluß des Gemeinderates, daß eine Verpachtung aus freier Hand nicht erfolgen soll, eine Mehrheit von zwei Dritteln der abgegebenen Stimmen erforderlich."},{"lvl":0,"sym":"(3)","t":"In den Fällen des Abs. 1 lit. c hat der Gemeinderat die Eigentümer (Abs. 9) von der beabsichtigten freihändigen Verpachtung des Jagdausübungsrechtes in der Gemeindejagd unter Angabe des Pachtwerbers, des Pachtzinses und der Pachtdauer nachweislich unter Setzen einer angemessenen Frist mit dem Bemerken zu verständigen, daß die Zustimmung zur freihändigen Verpachtung an den namhaft gemachten Pachtwerber angenommen wird, wenn sich der Eigentümer nicht mündlich vor dem Gemeindeamt persönlich dagegen ausspricht."},{"lvl":0,"sym":"(4)","t":"Mit Ausnahme des im Abs. 1 lit. a angeführten Falles ist die Verpachtung des Jagdausübungsrechtes in einer Gemeindejagd aus freier Hand nur an österreichische Staatsbürger, sonstige Staatsangehörige von Vertragsstaaten des Europäischen Wirtschaftsraumes oder der Europäischen Union oder an juristische Personen zulässig, die ihre Hauptniederlassung in Österreich oder in einem sonstigen Vertragsstaat des Europäischen Wirtschaftsraumes und der Europäischen Union haben."},{"lvl":0,"sym":"(5)","t":"Der Beschluß auf freihändige Verpachtung nach Abs. 1 lit. a und b ist unter Angabe des Pachtwerbers, des Pachtzinses, einschließlich eines allfälligen Hinweises auf seine Wertsicherung, der Pachtdauer und des Jagdgebietes durch Anschlag an der Amtstafel mit dem Beifügen öffentlich zu verlautbaren, daß von den Eigentümern (Abs. 9) der die Gemeindejagd bildenden Grundstücke innerhalb von zwei Wochen nach Anschlag an der Amtstafel beim Gemeindeamt schriftlich jene Einwendungen vorgebracht werden können, die gegen die beschlossene Verpachtung aus freier Hand sprechen. Der Beschluß auf freihändige Verpachtung ist der Bezirksverwaltungsbehörde nach Ablauf der zweiwöchigen Einspruchsfrist mit den allenfalls eingelangten Einwendungen zur Genehmigung vorzulegen. Gegen die Genehmigung der freihändigen Verpachtung steht nur jenen Eigentümern das Recht der Beschwerde zu, die innerhalb der Einspruchsfrist Einwendungen gegen die freihändige Verpachtung erhoben haben."},{"lvl":0,"sym":"(6)","t":"Wird die freihändige Verpachtung von der Bezirksverwaltungsbehörde aus Gründen nicht genehmigt, die ihre Ursache nicht in einer unterschiedlichen Beurteilung der Voraussetzungen nach § 18 Abs. 1a haben, oder die nicht ausschließlich in Verfahrensmängeln liegen, so ist die öffentliche Versteigerung anzuordnen."},{"lvl":0,"sym":"(7)","t":"Wird gegen die Genehmigung einer Verpachtung aus freier Hand Beschwerde erhoben, so bleibt derjenige, dem die Jagd verpachtet wurde, bis zur rechtskräftigen Entscheidung über die Verpachtung Pächter der Jagd (einstweiliger Pächter)."},{"lvl":0,"sym":"(8)","t":"Der einstweilige Pächter hat den auf die Zeit der einstweiligen Jagdpachtung entfallenden Pachtzins binnen zwei Wochen nach Rechtskraft des die freihändige Verpachtung nicht genehmigenden Bescheides zu erlegen."},{"lvl":0,"sym":"(9)","t":"Eigentümer im Sinne der Abs. 1 lit. c, 3 und 5 sind nur die Eigentümer jener die Gemeindejagd bildenden Grundstücke (Grundflächen), die jagdlich nutzbar sind und auf denen die Jagd nicht ruht."}]},{"id":"34","title":"Ausübung des Jagdrechtes durch Jagdverwalter","body":[{"lvl":0,"sym":"(1)","t":"Wenn eine Verpachtung des Jagdausübungsrechtes in einer Gemeindejagd nicht erzielt werden kann, so hat der Gemeinderat einen Jagdverwalter zu bestellen, bis eine Verpachtung durchgeführt wird. Maßnahmen zur Verpachtung sind binnen drei Monaten nach der Bestellung des Jagdverwalters einzuleiten. Der Gemeinderat hat weiters einen Jagdverwalter zu bestellen, wenn ein Pachtvertrag vor Ablauf der Pachtdauer aufgelöst oder gekündigt wird oder der Pachtvertrag erlischt und wenn die verbleibende Pachtdauer nicht mindestens zwölf Monate beträgt."},{"lvl":0,"sym":"(2)","t":"Der Jagdverwalter ist von der Bezirksverwaltungsbehörde zu bestätigen. Die Bestätigung ist zu erteilen, wenn die Voraussetzungen des Abs. 3 gegeben sind."},{"lvl":0,"sym":"(3)","t":"Als Jagdverwalter dürfen nur solche Personen bestellt werden, die zur Pachtung eines Jagdausübungsrechtes in einer Gemeindejagd gemäß § 18 zugelassen sind und nach ihrer bisherigen jagdlichen Betätigung die Gewähr für eine den Interessen eines geordneten Jagdbetriebes und den Bestimmungen dieses Gesetzes entsprechende Jagdausübung bieten."},{"lvl":0,"sym":"(4)","t":"Die mit der Verwaltung verbundenen Kosten sind von der Gemeinde zu tragen."},{"lvl":0,"sym":"(5)","t":"Die Bestimmungen der Abs. 2 und 3 gelten sinngemäß im Falle des § 22."}]},{"id":"35","title":"Erstellung der Jahresrechnung","body":[{"lvl":0,"sym":"(1)","t":"Am Schluß jedes Jagdjahres (§ 36 Abs. 6) hat der Bürgermeister die Abrechnung zu erstellen."},{"lvl":0,"sym":"(2)","t":"Der Pachtzins und allfällige sonstige Erträge sind nach Abzug eines Verwaltungskostenbeitrages für die Gemeinde in der Höhe von 5 v. H. des Pachtzinses auf die Eigentümer der das Gemeindejagdgebiet bildenden Grundstücke nach dem Flächenausmaß aufzuteilen, wobei jene Grundstücke außer Betracht zu bleiben haben, auf denen die Jagd ruht oder die jagdlich nicht nutzbar sind. Der zur Deckung eines Abganges erforderliche Betrag ist vom Bürgermeister in gleicher Weise wie der Pachtzins auf die einzelnen Grundeigentümer aufzuteilen."},{"lvl":0,"sym":"(3)","t":"Innerhalb von zwei Monaten nach Abschluß des Jagdjahres hat der Bürgermeister die Abrechnung und ein Verzeichnis der auf die einzelnen Grundeigentümer nach Abs. 2 entfallenden Beträge durch zwei Wochen im Gemeindeamt zur Einsicht aufzulegen. Dies ist mit dem Beifügen kundzumachen, daß Beschwerden gegen die Abrechnung oder gegen die Feststellung der Anteile innerhalb von zwei Wochen, vom Tag der Kundmachung gerechnet, beim Bürgermeister schriftlich einzubringen sind."},{"lvl":0,"sym":"(4)","t":"Rechtskräftig festgestellte Anteile am Pachtzins sind den Berechtigten auszuzahlen. Davon ausgenommen sind Anteile, deren Betrag 10,-- Euro nicht übersteigt; diese verfallen zugunsten der Gemeinde."},{"lvl":0,"sym":"(5)","t":"Die rechtskräftig bestimmten, zur Deckung des Gebarungsabganges erforderlichen Beträge sind binnen zwei Wochen, gerechnet von der Mitteilung an, beim Bürgermeister einzuzahlen."},{"lvl":0,"sym":"(6)","t":"Wenn die Jagd nicht verpachtet ist, kann der Gemeinderat von den Eigentümern der die Gemeindejagd bildenden Grundstücke zur Deckung der im Jagdjahr anfallenden Aufwendungen einen Beitrag einheben. Dieser ist nach den Grundsätzen des Abs. 2 aufzuteilen und mit einer zweiwöchigen Leistungsfrist zur Zahlung vorzuschreiben."},{"lvl":0,"sym":"(7)","t":"Rückständige Beträge sind im Verwaltungsweg einzubringen."}]}]},{"nr":5,"title":"Jagdkarten","paras":[{"id":"36","title":"Allgemeine Bestimmungen","body":[{"lvl":0,"sym":"(1)","t":"Niemand darf jagen, ohne im Besitz einer gültigen Kärntner Jagdkarte (Jagdkarte, Jagdgastkarte) zu sein."},{"lvl":0,"sym":"(2)","t":"Die Jagdkarte berechtigt nur dann auch zur Jagd mit nach Falknerart abgetragenen und beflogenen Greifvögeln (Beizjagd), wenn eine solche Berechtigung darin vermerkt ist."},{"lvl":0,"sym":"(3)","t":"Die Kärntner Jagdkarte ist nicht übertragbar; sie gibt keine Berechtigung, ohne Erlaubnis des Jagdausübungsberechtigten zu jagen. Die einem Minderjährigen unter 18 Jahren erteilte Kärntner Jagdkarte berechtigt nur zum Jagen in Begleitung des Erziehungsberechtigten oder einer von diesem beauftragten Person, jedoch nicht zur Teilnahme an Jagden, bei denen Wild den Schützen zugetrieben oder zugedrückt wird (Treibjagden, Riegeljagden). Die Begleitperson muß Inhaber einer gültigen Kärntner Jagdkarte sein."},{"lvl":0,"sym":"(4)","t":"Wer jagt, hat die gültige Kärntner Jagdkarte mit sich zu führen und auf Verlangen den Organen des öffentlichen Sicherheitsdienstes und den Jagdschutzorganen sowie dem Jagdausübungsberechtigten vorzuweisen."},{"lvl":0,"sym":"(5)","t":"Für Maßnahmen nach § 15 Abs. 6 ist eine Kärntner Jagdkarte nicht erforderlich."},{"lvl":0,"sym":"(6)","t":"Das Jagdjahr läuft vom 1. Jänner bis 31. Dezember."}]},{"id":"37","title":"Jagdkarten","body":[{"lvl":0,"sym":"(1)","t":"Personen, die die für die Jagdausübung erforderliche Verläßlichkeit und die jagdliche Eignung sowie ausreichende Kenntnisse des Kärntner Jagdrechtes und des Kärntner Naturschutzrechtes und Grundkenntnisse der Ersten Hilfe nachweisen und bei denen kein Ausschließungsgrund nach § 38 vorliegt, ist auf Antrag eine Jagdkarte auszustellen."},{"lvl":0,"sym":"(2)","t":"Zur Ausstellung von Jagdkarten ist der Bezirksjägermeister jener Bezirksgruppe zuständig, in deren Sprengel der Bewerber seinen Hauptwohnsitz hat. Hat der Bewerber in Kärnten keinen Hauptwohnsitz, so ist der Bezirksjägermeister jener Bezirksgruppe zuständig, in deren Bereich der Bewerber zunächst jagen will."},{"lvl":0,"sym":"(3)","t":"Die Jagdkarten sind auszustellen als"},{"lvl":1,"sym":"a)","t":"Jagdkarten für Inländer, wobei sonstige Staatsangehörige von Vertragsstaaten des Europäischen Wirtschaftsraumes oder der Europäischen Union Inländern oder der Schweiz gleichgestellt sind;"},{"lvl":1,"sym":"b)","t":"Jagdkarten für Ausländer (§ 18 Abs. 2), die im Bundesgebiet einkommensteuerpflichtig sind,"},{"lvl":1,"sym":"c)","t":"Jagdkarten für Ausländer (§ 18 Abs. 2), die im Bundesgebiet nicht einkommensteuerpflichtig sind,"},{"lvl":1,"sym":"d)","t":"Jagdkarten für Jagdschutzorgane und Jagdpraktikanten."},{"lvl":0,"sym":"(4)","t":"Eine Person ist keinesfalls als verläßlich anzusehen, wenn sie"},{"lvl":1,"sym":"a)","t":"wegen eines Verbrechens gegen Leib und Leben oder gegen fremdes Vermögen, wegen eines Verbrechens nach dem Suchtmittelgesetz oder eines Verbrechens nach vergleichbaren Bestimmungen eines anderen Staates, wegen eines Vergehens gegen Leib und Leben durch unvorsichtige Handhabung von Schußwaffen, Munition oder anderen Explosivstoffen oder wegen des Vergehens des Eingriffes oder des schweren Eingriffes in ein fremdes Jagd- oder Fischereirecht, des Verbrechens der Gewaltanwendung als Wilderer oder eines sonstigen Vergehens gegen fremdes Vermögen rechtskräftig verurteilt worden ist, solange die Verurteilung nicht getilgt ist und nach der Eigenart der strafbaren Handlung und der Persönlichkeit des Verurteilten die Begehung der gleichen oder einer ähnlichen Straftat zu befürchten ist;"},{"lvl":1,"sym":"b)","t":"wegen einer Übertretung jagdgesetzlicher Bestimmungen, einer Naturschutzbestimmung oder einer Tierschutzbestimmung bestraft worden ist, wenn durch diese Übertretung gegen die Weidgerechtigkeit verstoßen wurde oder die Tat sonst in verabscheuungswürdiger Weise begangen wurde, oder des Waffengesetzes bzw. vergleichbarer gesetzlicher Bestimmungen eines anderen Staates oder wiederholt wegen anderer Übertretungen des Jagdgesetzes oder vergleichbarer gesetzlicher Bestimmungen eines andern Landes oder Staates, einer Naturschutzbestimmung oder einer Tierschutzbestimmung bestraft worden ist, wenn nach der Eigenart der strafbaren Handlung und nach der Persönlichkeit des Bestraften die Begehung der gleichen oder einer ähnlichen Verwaltungsübertretung zu befürchten ist."},{"lvl":0,"sym":"(5)","t":"(entfällt)"},{"lvl":0,"sym":"(5a)","t":"Der Nachweis nach Abs. 4 ist bezogen auf Österreich und, wenn der Bewerber um eine Jagdkarte seinen Hauptwohnsitz nicht in Österreich hat, auch bezogen auf jenen Staat zu erbringen, in dem der Bewerber sonst seinen Hauptwohnsitz hat."},{"lvl":0,"sym":"(6)","t":"Bei erstmaliger Bewerbung um eine Jagdkarte hat der Bewerber den Nachweis der jagdlichen Eignung sowie der ausreichenden Kenntnisse des Kärntner Jagdgesetzes und des Kärntner Naturschutzrechtes durch die erfolgreiche Ablegung einer Prüfung vor der vom Landesvorstand der Kärntner Jägerschaft bestellten Prüfungskommission zu erbringen (Jagdprüfung). Der Bewerber hat bei der Prüfung nachzuweisen, daß er die zur Ausübung der Jagd unerläßlichen Kenntnisse insbesondere über das Jagdrecht, das Waffen- und Schießwesen, den Jagdbetrieb, die Wildkunde, die Hege, die Verhütung von Wildschäden und das Kärntner Naturschutzrecht sowie eine ausreichende Vertrautheit mit der Handhabung von Jagdwaffen besitzt. Vor der Ablegung der Prüfung hat der Prüfungswerber der Prüfungskommission auf geeignete Weise nachzuweisen, daß er über Grundkenntnisse der Ersten Hilfe verfügt."},{"lvl":0,"sym":"(7)","t":"Der Nachweis im Sinne des Abs. 6 erster Satz gilt auch als erbracht, wenn"},{"lvl":1,"sym":"a)","t":"der Bewerber einer Forstfachschule, eine landwirtschaftliche Fachschule oder eine land- und forstwirtschaftliche Fachschule, deren Lehrplan eine im Hinblick auf die Kenntnisse nach Abs. 6 zumindest vergleichbare Ausbildung vorsieht, oder an einer Höheren Lehranstalt für Forstwirtschaft die Pflichtgegenstände “Angewandte Biologie”, “Waldökologie und Waldbau”, “Jagdwesen und Fischerei”, “Forstliches Praktikum” und den Freigegenstand “Jagdliches Schießen” zumindest während der ersten drei Jahrgänge erfolgreich besucht und durch eine von einem für das Prüfungsfach „praktische Schießprüfung“ zuständigen Mitglied der Prüfungskommission im Sinne des § 37 Abs. 6 erster Satz ausgestellte Bestätigung ein Mindestmaß an Schießfertigkeit nachgewiesen hat,"},{"lvl":1,"sym":"b)","t":"der Bewerber Prüfungen an der Universität für Bodenkultur Wien über Prüfungsgegenstände erfolgreich abgelegt hat, die im Hinblick auf die Kenntnisse nach Abs. 6 zumindest eine vergleichbare Ausbildung vermitteln, der Landesjägermeister die Gleichwertigkeit der Prüfung anerkannt hat und der Bewerber dem Bezirksjägermeister schriftlich bestätigt, dass er über ausreichende Kenntnisse des Kärntner Jagd- und Naturschutzrechtes sowie über Grundkenntnisse der Ersten Hilfe verfügt,"},{"lvl":1,"sym":"c)","t":"der Bewerber in einem anderen Bundesland oder in einem Vertragsstaat des Europäischen Wirtschaftsraumes oder der Europäischen Union oder in der Schweiz eine mindestens gleichwertige Prüfung zum Nachweis der jagdlichen Eignung abgelegt hat, deren Gleichwertigkeit vom Landesjägermeister anerkannt worden ist, und der Bewerber dem Bezirksjägermeister schriftlich bestätigt, dass er über ausreichende Kenntnisse des Kärntner Jagd- und Naturschutzrechtes sowie über Grundkenntnisse der Ersten Hilfe verfügt."},{"lvl":0,"sym":"(8)","t":"Voraussetzung für die Ausstellung einer Jagdkarte, die auch zur Beizjagd (§ 36 Abs. 2) berechtigt, ist überdies der Nachweis der Eignung zu dieser Jagd durch die Ablegung einer Prüfung vor einer vom Landesvorstand der Kärntner Jägerschaft bestellten Prüfungskommission. Eine in einem anderen Bundesland oder in einem Vertragsstaat des Europäischen Wirtschaftsraumes oder der Europäischen Union oder in der Schweiz mit Erfolg abgelegte und durch Vorlage eines Zeugnisses nachgewiesene Prüfung hat der Landesjägermeister auf Antrag als Prüfung im Sinne des ersten Satzes anzuerkennen, wenn die Gleichwertigkeit des Prüfungsstoffes gegeben ist."},{"lvl":0,"sym":"(9)","t":"Bewerber, die das 15. Lebensjahr noch nicht vollendet haben oder bei denen ein Verweigerungsgrund nach § 38 Abs. 1 lit. a oder d bis j vorliegt, sind von der Ablegung der Jagdprüfung einschließlich der Prüfung nach Abs. 8 für die Dauer des Grundes der Verweigerung ausgeschlossen."},{"lvl":0,"sym":"(10)","t":"Der Landesvorstand der Kärntner Jägerschaft hat durch Verordnung in Ausführung der Bestimmungen der Abs. 6 bis 8 die näheren Bestimmungen über die Prüfungsvoraussetzungen, die Bestellung und Zusammensetzung der Prüfungskommission, die Prüfungsgegenstände und die Abhaltung der Prüfung zu regeln. Die Bewerber um Zulassung zur Prüfung haben an die Kärntner Jägerschaft eine Prüfungsgebühr und eine Manipulationsgebühr zu entrichten, deren Höhe durch Verordnung des Landesvorstandes der Kärntner Jägerschaft festzusetzen ist. Hiebei ist von den durchschnittlichen Kosten, die durch die Abhaltung der Prüfung entstehen (Entschädigung der Prüfer, Reisekosten, Personal- und Sachaufwand u. ä.), auszugehen. Die Prüfungsgebühr und die Manipulationsgebühr werden bei Zurücktreten von oder bei Nichtbestehen der Prüfung nicht erstattet."}]},{"id":"38","title":"Verweigerung der Jagdkarten","body":[{"lvl":0,"sym":"(1)","t":"Von der Möglichkeit des Erlangens einer Jagdkarte sind ausgeschlossen:"},{"lvl":1,"sym":"a)","t":"Personen, denen eine der im § 37 Abs. 1 geforderten Voraussetzungen fehlt,"},{"lvl":1,"sym":"b)","t":"Minderjährige unter 16 Jahren,"},{"lvl":1,"sym":"c)","t":"Minderjährige vom vollendeten 16. Lebensjahr bis zum vollendeten 18. Lebensjahr, die ohne Zustimmung ihres gesetzlichen Vertreters um die Ausstellung einer Jagdkarte ansuchen,"},{"lvl":1,"sym":"d)","t":"Personen, für die ein Erwachsenenvertreter bestellt ist,"},{"lvl":1,"sym":"e)","t":"Personen, die wegen geistiger oder körperlicher Mängel unfähig sind, ein Jagdgewehr sicher zu führen,"},{"lvl":1,"sym":"f)","t":"Personen, deren bisheriges Verhalten besorgen läßt, daß sie die öffentliche Sicherheit gefährden werden,"},{"lvl":1,"sym":"g)","t":"Personen, die aus der Kärntner Jägerschaft ausgeschlossen wurden oder gegen die in einem anderen Land oder Staat eine gleichartige Maßnahme verhängt wurde, auf die Dauer des Ausschlusses,"},{"lvl":1,"sym":"h)","t":"Personen, denen durch ein rechtskräftiges Straferkenntnis die Fähigkeit zum Besitz einer Jagdkarte abgesprochen oder gegen die auf Verlust der Jagdkarte erkannt (§ 98) oder denen die Kärntner Jagdkarte entzogen (§ 39) wurde oder gegen die in einem anderen Land oder Staat eine vergleichbare Anordnung hinsichtlich der Jagdkarte dieses Landes oder Staates getroffen wurde, für die ausgesprochene Dauer,"},{"lvl":1,"sym":"i)","t":"Personen, gegen die ein rechtskräftiges Waffenverbot gemäß § 12 des Waffengesetzes 1996, BGBl Nr 12/1997, zuletzt in der Fassung BGBl. I Nr. 2011/2021, ausgesprochen wurde,"},{"lvl":1,"sym":"j)","t":"Personen, denen eine waffenrechtliche Urkunde im Sinne von § 25 Abs. 3 des Waffengesetzes 1996 rechtskräftig entzogen wurde."},{"lvl":0,"sym":"(2)","t":"Antragsteller (§ 37 Abs. 1) haben eine schriftliche eidesstattliche Erklärung abzugeben, dass bei ihnen"},{"lvl":1,"sym":"1.","t":"keine rechtskräftige Verurteilung gemäß § 37 Abs. 4 lit. a oder Bestrafung gemäß § 37 Abs. 4 lit. b und"},{"lvl":1,"sym":"2.","t":"auf Grund von Maßnahmen oder Anordnungen eines anderen Landes oder Staates kein Versagungsgrund nach Abs. 1 lit. g oder h"},{"lvl":0,"sym":"","t":"vorliegt. Soweit Z 1 nicht zutrifft, sind Antragsteller verpflichtet, eine schriftliche Ausfertigung der betreffenden Entscheidung sowie gegebenenfalls Informationen über die Tilgung der Strafe beizubringen."},{"lvl":0,"sym":"(3)","t":"Über die Verweigerung der Erlangung einer Jagdkarte nach Abs. 1 entscheidet der Bezirksjägermeister."}]},{"id":"38a","title":"Gültigkeit der Jagdkarte","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdkarte ist nur in Verbindung mit dem Nachweis über die Einzahlung des Jagdkartenbeitrages für das laufende Kalenderjahr sowie mit dem Nachweis über die Einzahlung des Mitgliedsbeitrages zur Kärntner Jägerschaft und der Prämie für die Jagdhaftpflichtversicherung gültig."},{"lvl":0,"sym":"(2)","t
