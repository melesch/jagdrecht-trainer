ge, die vom Landesausschuss, vom Bezirksausschuss oder vom Hegeringleiter eingebracht werden."},{"lvl":0,"sym":"(5)","t":"Wahlvorschläge, die den Bestimmungen der Abs 1 und 3 nicht entsprechen, von nichtwahlberechtigten Personen eingebracht wurden oder Kandidaten enthalten, die nicht wählbar sind, sind vom Wahlleiter für ungültig zu erklären."},{"lvl":0,"sym":"(6)","t":"Wahlvorschläge können für alle Mitglieder eines zu wählenden Organs, aber auch für einzelne Mitglieder eingebracht werden. Die Stellvertreter des Landesjägermeisters, der Stellvertreter des Bezirksjägermeisters, der Finanzreferent, die Vertreter der Jagdschutzorgane, die Vertreter der Land- und Forstwirtschaft, die Referenten (Sachbearbeiter) und ihre Stellvertreter, die Vorsitzenden der Senate des Disziplinarrates, der Disziplinaranwalt und sein Stellvertreter sowie die Rechnungsprüfer und ihre Stellvertreter müssen mit ihren Funktionen bezeichnet sein."},{"lvl":0,"sym":"(7)","t":"Enthält ein Wahlvorschlag mehr als die erforderliche Anzahl von Kandidaten, so sind die angeführten überzähligen Kandidaten (in der im Wahlvorschlag angeführten Reihenfolge ab dem letzten noch wahlbe- rechtigten) vom Wahlleiter zu streichen."}]},{"id":"51","title":"Wahlleiter; Wahlkommission","body":[{"lvl":0,"sym":"","t":"Der Kärntner Landesjägertag, der Bezirksjägertag und die Hegeringversammlung haben aus dem Kreis der anwesenden Mitglieder der Kärntner Jägerschaft einen Wahlleiter und eine aus vier Personen bestehende Wahlkommission zu wählen, die bei geheimen Wahlen die Stimmzettel austeilt und entgegennimmt und die Stimmenzählung vornimmt."}]},{"id":"52","title":"Wahlvorgang","body":[{"lvl":0,"sym":"(1)","t":"Der Wahlleiter gibt bekannt, welche Wahlvorschläge eingelangt sind. Er hat wahlwerbenden Gruppen Gelegenheit zu geben, die Wahlvorschläge zu begründen."},{"lvl":0,"sym":"(2)","t":"Über alle für eine Funktion eingebrachten Wahlvorschläge ist bei geheimer Wahl in einem Wahlgang (auf einem Stimmzettel) abzustimmen."},{"lvl":0,"sym":"(3)","t":"Die Wahl erfolgt mit Stimmzetteln (geheime Wahl). Durch Handerheben kann nur dann abgestimmt werden (offene Wahl), wenn nur ein einziger Wahlvorschlag vorliegt."},{"lvl":0,"sym":"(4)","t":"Ob und inwieweit Organe in ihrer Gesamtheit (en bloc) oder einzeln gewählt werden sollen, beschließen die Wahlberechtigten. Wird Abstimmung en bloc beschlossen, kann sie nur durch Handerheben erfolgen."},{"lvl":0,"sym":"(5)","t":"Bei der geheimen Wahl sind von der Wahlkommission ausgeteilte Stimmzettel zu verwenden, die das Siegel der Kärntner Jägerschaft tragen müssen."},{"lvl":0,"sym":"(6)","t":"Stimmzettel, die nicht einwandfrei erkennen lassen, wen der Wahlberechtigte wählen wollte, oder die Namen nicht wählbarer Personen enthalten, sind von der Wahlkommission für ungültig zu erklären."}]},{"id":"53","title":"Stimmenzählung","body":[{"lvl":0,"sym":"","t":"Nach Abschluss des Wahlvorganges zählt die Wahlkommission die Stimmen und stellt fest:"},{"lvl":1,"sym":"a)","t":"die Zahl der anwesenden Wahlberechtigten,"},{"lvl":1,"sym":"b)","t":"die Zahl der abgegebenen Stimmen,"},{"lvl":1,"sym":"c)","t":"die Zahl der gültigen Stimmen,"},{"lvl":1,"sym":"d)","t":"die Zahl der auf jeden Kandidaten entfallenden Stimmen."}]},{"id":"54","title":"Wahlergebnis","body":[{"lvl":0,"sym":"(1)","t":"Als gewählt gilt, wer mehr als die Hälfte der abgegebenen Stimmen auf sich vereinigt."},{"lvl":0,"sym":"(2)","t":"Enthält von mehreren Kandidaten keiner die erforderliche Mehrheit, findet zwischen den beiden Kandidaten, die die meisten Stimmen erhalten haben, die engere Wahl statt. Kommen mehr als zwei Personen in Betracht, entscheidet zwischen jenen Kandidaten, auf die die gleiche Stimmenzahl entfallen ist, das Los darüber, wer in die engere Wahl kommt. Bei dieser gilt als gewählt, wer die meisten Stimmen auf sich vereinigt. Bleibt die engere Wahl ergebnislos, entscheidet das Los."},{"lvl":0,"sym":"(3)","t":"Liegt nur ein Wahlvorschlag vor, und findet dieser nicht die erforderliche Mehrheit (Abs. 1), so ist von der Versammlung ein weiterer Wahlvorschlag einzubringen. § 55 Niederschrift Die Wahlkommission hat über die Wahlhandlung eine Niederschrift aufzunehmen, die vor allem die in § 53 erwähnten Angaben zu enthalten hat. Sie kann sich hiezu des bestellten Schriftführers bedienen. Die Niederschrift ist von allen Mitgliedern der Wahlkommission zu unterfertigen. Sie bildet zusammen mit der Wahlausschreibung und den Wahlvorschlägen den Wahlakt. Dieser ist unverzüglich der Landesgeschäftsstelle zu übermitteln und von dieser bis zum Abschluss der nächstfolgenden Wahlen aufzubewahren."}]},{"id":"56","title":"Wahlanfechtung","body":[{"lvl":0,"sym":"","t":"Die zu einer bestimmten Wahl jeweils Wahlberechtigten können diese Wahl binnen einem Monat nach Abschluss des Wahlvorganges anfechten. Über die Anfechtung entscheidet die Aufsichtsbehörde (§ 91 K-JG). Der Anfechtung ist stattzugeben, wenn Bestimmungen dieser Satzung verletzt wurden und diese Verletzung auf das Ergebnis der Wahl von Einfluss sein konnte."}]},{"id":"57","title":"Geschäftsstellen","body":[{"lvl":0,"sym":"","t":"Die Geschäfte der Kärntner Jägerschaft werden von der Landesgeschäftsstelle besorgt, die dem Landesjä- germeister untersteht, die Geschäfte der Bezirksgruppen von den Bezirksgeschäftsstellen, die den Bezirksjägermeistern unterstehen."}]},{"id":"58","title":"Mitteilungsblatt","body":[{"lvl":0,"sym":"","t":"Die Kärntner Jägerschaft hat in regelmäßigen Abständen ein Mitteilungsblatt herauszugeben, das jedem Mitglied kostenlos zuzustellen ist. Jedenfalls ist vor dem Kärntner Landesjägertag (§ 6) und vor Bezirksjägertagen (§ 19) so rechtzeitig ein Mitteilungsblatt herauszugeben, dass die Frist für Anträge (§ 35) gewahrt bleibt."}]},{"id":"59","title":"Kundmachungsblatt","body":[{"lvl":0,"sym":"","t":"Verordnungen des Landesvorstandes und Verordnungen der Vollversammlung (des Kärntner Landesjägertages) gemäss § 42 Abs. 2 K-JG sind im Kundmachungsblatt kundzumachen. Das Kundmachungsblatt ist in der Landesgeschäftsstelle sowie in den Bezirksgeschäftsstellen der Kärntner Jägerschaft sowie bei jedem Gemeindeamt während der für den Parteienverkehr bestimmten Stunden für jedermann zur Einsicht aufzulegen. Jedermann hat das Recht, bei diesen Stellen gegen Ersatz der Kosten Kopien zu erhalten, wenn geeignete technische Einrichtungen vorhanden sind."}]}]}],"jagdzeiten":[{"g":"Schalenwild","rows":[["Rotwild – Hirsche Klasse III (einjährig, Schmalspießer), nichtführende Tiere","1.5. – 31.12.","nur im Rahmen des Abschussplans"],["Rotwild – führende Tiere und Kälber","1.7. – 31.12.","nur im Rahmen des Abschussplans"],["Rotwild – Hirsche Klasse I, II und III","1.8. – 31.12.","nur im Rahmen des Abschussplans"],["Damwild","1.8. – 31.12.",""],["Gamswild","1.8. – 31.12.","nur im Rahmen des Abschussplans"],["Muffelwild","1.7. – 31.12.","nur im Rahmen des Abschussplans"],["Rehwild – Böcke Klasse B","1.5. – 31.10.","nur im Rahmen des Abschussplans"],["Rehwild – Böcke Klasse A","1.6. – 31.10.","nur im Rahmen des Abschussplans"],["Rehwild – nichtführende, nichttragende Geißen","1.5. – 31.12.","nur im Rahmen des Abschussplans"],["Rehwild – führende Geißen und Kitze","1.8. – 31.12.","nur im Rahmen des Abschussplans"],["Schwarzwild – führende Bachen","1.8. – 31.1.","übriges Schwarzwild ganzjährig"],["Steinwild","ganzjährig geschont","§ 51 Abs. 1 K-JG"]]},{"g":"Sonstiges Haarwild","rows":[["Murmeltiere","1.8. – 15.10.",""],["Feldhasen, Alpen-/Schneehasen","1.10. – 31.12.",""],["Dachse","1.6. – 31.1.",""],["Edelmarder","1.11. – 28.2.",""],["Steinmarder","1.7. – 31.3.",""],["Großes Wiesel (Hermelin)","1.11. – 31.1.",""],["Goldschakal","1.10. – 15.3.",""],["Iltisse","1.7. – 31.3.",""],["Fuchs, Marderhund, Waschbär","ganzjährig bejagbar","(Elterntierschutz § 68 Abs. 1 Z 17 beachten)"],["Bär, Wolf, Luchs, Wildkatze, Fischotter, Biber, kleines Wiesel","ganzjährig geschont","Ausnahmen nur per Verordnung/Bescheid (Wolf: Risikowolfsverordnung; Fischotter, Biber: Entnahmekontingente)"]]},{"g":"Federwild","rows":[["Auerhahnen, Birkhahnen","ganzjährig geschont","Ausnahmen lt. Verordnung der Landesregierung (Auer- und Birkhahn-VO)"],["Haselhahnen","16.9. – 15.11.",""],["Rebhühner","1.10. – 31.10.",""],["Fasanhahnen","16.10. – 31.12.",""],["Stock-, Krick-, Pfeif-, Schnatter-, Spieß-, Löffel-, Tafel-, Reiher-, Knäkenten","1.9. – 31.12.",""],["Grau-, Saat-, Kanadagänse","1.9. – 31.1.",""],["Blässhühner","21.9. – 10.3.",""],["Waldschnepfen","11.9. – 19.2.",""],["Ringeltauben (Schwarmvögel)","1.8. – 31.12.",""],["Ringeltauben (Einzeltiere)","1.9. – 31.1.",""],["Türkentauben","21.10. – 20.2.",""],["Aaskrähen, Eichelhäher, Elstern","ganzjährig geschont","Ausnahmen lt. Verordnungen LGBl Nr 6/2025 und 7/2025"],["Kolkraben, Taggreifvögel, Eulen, Graureiher, Hennen (Auer, Birk, Hasel), Alpenschneehuhn, Steinhuhn, Wachtel","ganzjährig geschont","§ 51 Abs. 1 K-JG"]]}],"buch":[{"part":"","partTitle":"","nr":0,"title":"Vorwort des Autors","pg":12,"blocks":[{"pg":12,"k":"p","t":"Produktinformation Irgendwie komme ich mir vor wie ein Wiederholungstäter, der es trotz mehrfacher gegenteiliger Versicherungen und glaubwürdiger Schwüre nicht lassen kann, seine Untat zu wiederholen. Nie wieder werde ich ein Jagdrechtslehrbuch schreiben, soviel war klar: Das sollen jetzt die Jüngeren machen. Doch dann kam der Obmann mit der Frage, ob ich mir eine dritte Auflage des „Das Kärntner Jagdgesetz in Wort und Bild\" vorstellen könne. Ich solle es mir jedenfalls überlegen. Und wie ich überlegte! Zwei Sekunden und eine Kaffeeschlucklänge später war mir bereits klar: Ich werde es tun."},{"pg":12,"k":"p","t":"Wie gesagt, Wiederholungstäter."},{"pg":12,"k":"p","t":"Die Angelegenheit ist aber auch zu verlockend. Nach diversen kleinen und nahezu zu vernachlässigenden Novellchen hat die KJG-Novelle 2017 einen ordentlichen Einschlag in den bisherigen Bestand gemacht, um beim Vergleich zu bleiben: Im bisherigen Gesetzestext wurden riesige Kahlschläge angelegt, und es wurde gleich neu aufgeforstet. Mit der alten Textierung kommt man in der Praxis nicht mehr weiter, zumal es sich um wesentliche Neuerungen gerade in gesellschaftsrelevanten Bereichen wie Wildschäden und Fütterung handelt."},{"pg":12,"k":"p","t":"Geschweige, dass man mit dem alten Wissen zu einer Jagd- oder Jagdaufseherprüfung geben könnte. Das heißt, hingehen kann man schon, aber..."},{"pg":12,"k":"p","t":"Das bedeutet aber auch, dass die bisherigen Auflagen dieses Buches nur noch musealen Wert haben. In der Neuauflage wurde jeder Paragraph einer gründlichen Revision unterzogen. Um den Unterschied weiter zu unterstreichen, wurden auch die Lichtbilder erneuert, die „Prüfungsfragen\" erweitert und mehrfachen Anregungen folgend - mit einem Auflösungsteil verseben."},{"pg":12,"k":"p","t":"Der bisherige - und offensichtlich bei den Lesern angekommene - Schreibstil wurde beibehalten, so dass ich mit ruhigem Gewissen sagen kann:"},{"pg":12,"k":"p","t":"Viel Lernerfolg und - zum Unterschied von einem normalen Lehrbuch viel Vergnügen!"},{"pg":12,"k":"p","t":"PS: Wer es juristisch genauer wissen will, wird um den auch heute noch altbewährten „Anderluh-Havranek\" nicht herumkommen. Soweit er noch seine Gültigkeit hat. Topaktuell und genau ist die von Burgstaller-Gradenegger verfasste Textausgabe samt Erläuterungen hinsichtlich der Novelle 2017."},{"pg":12,"k":"p","t":"Helmut Arbeiter"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":1,"title":"Die Zielbestimmung","pg":13,"blocks":[{"pg":13,"k":"p","t":"So wie (fast) jeder Mensch sich seine Ziele setzt, die nach Möglichkeit über die Aussicht auf das abendliche Bier hinausgehen, versucht auch der Gesetzgeber, sich zu Beginn eines Gesetzeswerkes sozusagen programmatisch festzulegen und sein Ziel bekanntzugeben. Was halten Sie also so betrachtet von nachstehender Formulierung: „Ziel dieses Gesetzes ist es, möglichst gute Trophäen zu erzielen, dabei auf Wildschäden keine Rücksicht zu nehmen und Nichtjäger von der Betretung der Reviere abzuhalten\"? Jetzt muss ich Sie enttäuschen, Derartiges könnte man bestenfalls als archaisches Wunschdenken bezeichnen, das sich in der heutigen Gesellschaft auch nicht andeutungsweise durchsetzen ließe. Im Landtag wäre wohl kein einziger Abgeordneter bereit, dafür auch nur einen Finger, geschweige denn die ganze Hand zu heben."},{"pg":13,"k":"p","t":"Nächster Versuch daher:"},{"pg":13,"k":"p","t":"In modernen Gesetzen wird zumeist eingangs das Ziel formuliert, das dem Gesetzgeber vorschwebt."},{"pg":13,"k":"law","t":"§ 1 : Ziele dieses Gesetzes sind:"},{"pg":13,"k":"p","t":"1. eine geordnete und planmäßige Jagdwirtschaft im öffentlichen Interesse sicherzustellen, um einen artenreichen, gesunden, geschlechtlich ausgewogenen und den Lebensraumverhältnissen angemessenen Wildbestand in Kärnten zu erzielen und zu erhalten, insbesondere zur Wildschadensverhütung in der Land- und Forstwirtschaft;"},{"pg":13,"k":"p","t":"2. Erfordernissen der Weidgerechtigkeit umfassend Rechnung zu tragen;"},{"pg":13,"k":"p","t":"3. einen angemessenen Ausgleich zwischen den Interessen von Grundeigentümern und den Jagdausübungsberechtigten sowie den öffentlichen Interessen zu erreichen; 4, die Verwaltung im Bereich des Jagdwesens wirksam zu organisieren."},{"pg":14,"k":"p","t":"Jetzt haben Sie allerdings schon den gültigen Gesetzestext gelesen Wir merken uns daraus nicht nư für die Prüfung, sondern auch für allfällige nicht vermeidbare Diskussionen mit Nichtjägern, worauf es uns hauptsächlich ankommt:"},{"pg":14,"k":"p","t":"1. Schaffung und Erhaltung eines (artenreichen, gesunden, geschlechtlich ausgewogenen und den Lebensraumverhältnissen angepassten) Wildbestandes, soweit dies im öffentlichen Interesse ist, wobei hier das übergeordnete Ziel der Wildschadensverhütung besonders betont wird."},{"pg":14,"k":"p","t":"2. Berücksichtigung der Erfordernisse der Weidgerechtigkeit (Begriff siehe später), die also ebenfalls programmatisch über dem Gesetzestext schwebt und den Jager daran erinnert, dass es sich um eine Selbstverständlichkeit handeln sollte."},{"pg":14,"k":"p","t":"3. Ein Ausgleich der Interessen der Grundeigentümer, der Jäger und der Öffentlichkeit. Ein schwieriger Kompromiss, aber immerhin eines Versuches wert."},{"pg":14,"k":"p","t":"4. Eine „geordnete und planmäßige Jagdwirtschaft\" bedarf naturgemäß auch einer Verwaltungsstruktur. Diese gilt es, wirksam zu organisieren. Wobei im Visier des Gesetzgebers nicht nur die Kärntner Jägerschaft, sondern auch das Land Kärnten aufscheint."}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":2,"title":"Begriff des Jagdrechtes","pg":14,"blocks":[{"pg":14,"k":"p","t":"Juristen suchen immer nach Begriffsbestimmungen. Das ist im Strafrecht so, bei Eherecht und beim Erbrecht, warum soll es beim Jagdrecht anders sein. Der einzige Unterschied ist"},{"pg":14,"k":"p","t":"- bedauerlicherweise -, dass man sich die Definition des Jagdrechtes partout nicht merken will. Versuchen Sie es einmal am Beispiel Eherecht:.. Kinder zu zeugen, sie zu erziehen und sich gegenseitig Beistand zu leisten...\" Das geht ins Ohr! Einmal gelesen, gemerkt! So, und jetzt die Definition des Jagdrechtes - bitte nur einmal lesen, dann auswendig wiederholen! Ich wette, der Erfolg bleibt aus!"},{"pg":14,"k":"p","t":"I la Abs. 1: Das Jagdrecht besteht in der Befugnis, innerhalb von Jagdgebieten das Wild zu begen, ihm nachzustellen, es zu fangen, zu erlegen und sich anzueignen; es umfasst ferner die Befugnis, sich Fallwild, Abwurfstangen und die Eier des Federwildes anzueignen."},{"pg":14,"k":"p","t":"Jedenfalls werden hier große Worte gelassen ausgesprochen, und wir können es uns nicht ersparen, diese im Einzelnen unter die Lupe zu nehmen. Außerdem kann man sich dann unter obiger Definition etwas vorstellen und sie zwanglos merken."},{"pg":14,"k":"p","t":"a.)... in der Befugnis..."},{"pg":14,"k":"p","t":"Was heißt das schon wieder? Das Wort deutet auf „dürfen\" hin, auf „können\", auf, ja eben auf „berechtigt sein\". Hier wiegt uns der Gesetzgeber allerdings in trügerischer Sicherheit"},{"pg":15,"k":"p","t":"1 einer Verwal- Hochwild - Wild im Sinne des § 4 KJG (Haarwild, Schalenwild). Das Jagdrecht bezieht sich nur auf Wild im Sinne dieses § 4 und nicht auch auf andere Tiere."},{"pg":15,"k":"p","t":"und säuselt uns etwas vor, das nicht stimmt. Wie ist es denn etwa mit der Erfüllung des Abschussplanes oder mit der Hege? Das ist doch kein Dürfen mehr, sondern ein unter Umständen hartes Müssen! „Befugnis\" im Sinne des $ 1 KJG ist also in Wahrheit nur programmatisch zu sehen und kann im Einzelfall ganz schön umgekehrt werden."},{"pg":15,"k":"p","t":"b.)... innerhalb von Jagdgebieten..."},{"pg":15,"k":"p","t":"Jagdgebiet ist für mich das, was die Bezirksverwaltungsbehörde (BH) mit Bescheid als Eigenjagdgebiet oder Gemeindejagdgebiet festgestellt hat, unter Berücksichtigung aller Anschlüsse und Einschlüsse. Da gibt es kein Wenn und Aber, keinen Grenzverlauf, der allenfalls anders sein könnte, es zählen nur sozusagen die papierenen Fakten. In diesem meinem Jagdgebiet bin ich alles, Jagdchef, Jagdaufseher oder was immer. Daneben bin ich nichts, nur Privatmann. Am besten ist, man stellt sich die Grenze als zehn Meter hohen Maschendrahtzaun vor. Oder wie die einstige „Berliner Mauer\" - falls Ihnen das noch etwas sagt. Dann kann nichts passieren und man wird nie mit dem „Wildererparagraphen\" in Konflikt kommen. Denn ab der Grenze ist so ziemlich alles verboten (von geringen Ausnahmen bei vereinbarter Wildfolge abgesehen, wie wir noch sehen werden). Das einzige wirklich erlaubte jagdliche Tun über die Grenze hinweg ist, mehr oder weniger neidlos den Anblick dort zu genießen."},{"pg":15,"k":"p","t":"C.)... das Wild..."},{"pg":15,"k":"p","t":"Das Jagdrecht bezieht sich nur auf Wild. Deshalb ist es auch so wichtig, den $ 4 KJG zu kennen; dort werden die Tiergattungen angeführt, die unter „Wild\" fallen. Der eine Aspekt"},{"pg":16,"k":"p","t":"i Wari beachter: Meine Hegeverpfichtung bezieht sich = mit desnime - auch aur vid un coi aus das gesamte Wid des 4 KIG Aso hin ghit de avid enten Vorstehung det rauen Bambitutterung? Auch die Greifvögel etwa gen (natirlich til Was ist in klient Kalter, schneereichen Wintern? Habe ich ihnen jetzt etwa (naturich tierschutz gerecht be taute, Zuchtmäuse vorzulegen? Ich will diese provokante Frage nicht beantworten, veil ich den biologischen Zusammenhang zuwenig beurteilen kann. Ich wollte nur kurz aufzeigen, dass nicht im Gesetz steht, dass ausschließlich Reh, Hirsch und Fasan zu hegen sind d.)... zu hegen..."},{"pg":16,"k":"p","t":"siehe später den „Hegebegriff\""},{"pg":16,"k":"p","t":"e.)... nachzustellen..."},{"pg":16,"k":"p","t":"Was ist das schon wieder, das „Nachstellen\"? Nicht jeder, der Anblick haben will, stellt dem Wild auch nach. Es kommt auf das an, was der Betreffende will: Ein Pirschen mit schussbereiter Büchse fällt sicherlich darunter, ebenso der bewaffnete Anstand oder Ansitz. Aber auch wer fröhlich pfeifend durch das Nachbarrevier geht, um das Wild ins eigene Revier und dem Jagdfreund vor die Büchse zu drücken, stellt dem Wild nach. Abgelehnt wurde die Anwendung des Nachstellbegriffes von der Rechtsprechung beispielsweise in dem Fall, da jemand sein Frettchen im fremden Revier im Kaninchenbau suchte und es auf die Art zum Springen bringen wollte, dass er auf dem Bau herumtrampelte. Klarerweise, er hat ja nicht (fremdem) Wild nachgestellt."},{"pg":16,"k":"p","t":"f.)... zu fangen..."},{"pg":16,"k":"p","t":"Alles klar, auch die Fangjagd ist eine Art der Jagdausübung und darf, sofern sie überhaupt noch erlaubt ist, nur vom Jagdausübungsberechtigten und seinen Beauftragten ausgeübt werden. (Die Frage, was denn mit Großmutters Mäusefallen wäre, werden wir versiert dahingehend beantworten, dass Mäuse bekanntlich nicht im $ 4 KJG aufgezählt sind.) Aber etwas der nichtjagenden Bevölkerung weithin Unbekanntes erscheint unter diesem Punkt erwäh- Auch die Fangjagd - soferne noch erlaubt (Foto Abzugeisen) nenswert: Das (angeblich) verwaiste Kitz, ist eine Möglichkeit der Jagdausübung und ausschließlich eine irgendwo gefunden, gefangen und hochge- Folge des Jagdausübungsrechtes."},{"pg":16,"k":"p","t":"päppelt - ach, wie niedlich anzusehen -, und plötzlich wird es, zwischenzeitig größer ge worden oder auch nicht, vom bösen Jäger, der keinen Respekt vor fremdem Eigentum hat, erschossen! „Ich habe es doch gefunden und aufgezogen, also gehört es mir!\" berechtigten. Streng ger den Kofferraum packt ur auf die Tränendrüsen di Teilnehmer der Har"},{"pg":16,"k":"law","t":"§ 1 der Verordnur"},{"pg":17,"k":"p","t":"1."},{"pg":17,"k":"p","t":"1t, Mitnichten! Das Recht zu fangen ist wie gesagt ausschließliches Recht des Jagdausübungsberechtigten. Streng genommen begeht derjenige, der das ach so arme, hilflose Wesen in den Kofferraum packt und heimfährt, sogar Wilderei (ich weiß schon, es heißt exakt „Eingriff in fremdes Jagdrecht\")! Derartige Gedanken kommen mir in den Sinn, wenn ich dann die auf die Tränendrüsen drückenden, jedoch von Gesetzesunkenntnis strotzenden Berichte in den Tageszeitungen lese."},{"pg":17,"k":"p","t":"g.... erlegen...."},{"pg":17,"k":"p","t":"Ein Begriff, auf den wir noch öfter zurückkommen werden. Vielleicht an dieser Stelle (solange Ihre Aufmerksamkeit noch ungetrübt ist) jedoch ein Vorgriff auf die Mindestenergiewerte: Es erscheint nachvollziehbar, dass man den Ier-Hirsch nicht mit dem Schonzeitpatronerl bejagen kann. Das wäre nicht tödlich, schafft aber eine Verletzung, auf die beide Teilnehmer der Handlung (Hirsch und Jäger) schon aus Tierschutzgründen verzichten können. Daher sehr wichtig:"},{"pg":17,"k":"law","t":"§ 1 der Verordnung des Landesvorstandes der Kärntner Jägerschaft über die Festlegung der Mindestenergiewerte:"},{"pg":17,"k":"p","t":"Für die Bejagung des Schalenwildes werden folgende Mindestenergiewerte festgesetzt:"},{"pg":17,"k":"p","t":"1. für Schalenwild mit einem Lebendgewicht bis zu ca. 25 kg eine Auftreffenergie auf 100 m (E 100) von 1000J Joule),"},{"pg":17,"k":"p","t":"2. für Schalenwild mit einem Lebendgewicht über ca. 25 kg eine Auftreffenergie auf 100 m (E 100) von 2000J Joule)."},{"pg":17,"k":"p","t":"Wie schon der Name sagt, handelt es sich um rechtlich vorgegebene Mindestenergiewerte. Wenn Sie mehr hinauspulvern wollen, ist das ausschließlich Ihre Sache. Und was Köchin/ Koch oder Wildbrethändler dazu sagen."},{"pg":17,"k":"p","t":"h.)... sich anzueignen..."},{"pg":17,"k":"p","t":"Wild gehört niemandem. Es gibt keinen „mein Bock\", „dein Bock\", solange das Stück noch äst und sich nur anschauen lässt. Manch nachbarlicher Zwist ließe sich verhindern, wenn man sich von Haus aus dessen bewusst wäre, dass auch eine Winterfütterung von „Hansi\" durch zehn Jahre keinen Rechtsanspruch erzeugt, dass der Hirsch dann wirklich von einem selbst und im eigenen Revier erlegt wird."},{"pg":17,"k":"p","t":"Wild ist also herrenlos, wie es so schön heißt (korrekt gegendert müsste es selbstverständlich „herren- bzw. frauenlos\" heißen, aber die alten Germanen, von denen der Ausdruck stammt, hatten da eine andere Vorstellung) - bis zu dem Augenblick, da es erlegt wird. Ab diesem Zeitpunkt, da das Stück also auf der Decke liegt, ist der Jagdausübungsberechtigte Eigentümer, egal ob er selbst es erlegt hat, sein Jagdgast oder sein Jagdaufseher, egal ob in seinem Beisein und egal ob mit seinem Willen. Auch der Wilderer erwirbt zu diesem Zeit-"},{"pg":18,"k":"p","t":"Das Stück liegt. Jetzt hat der Jagdausübungsberechtigte (und nur er!) Eigentum erworben. punkt Eigentum, allerdings nicht für sich, sondern eben auch nur für den Jagdausübungsberechtigten, mag er damit einverstanden sein oder nicht! Auch beim Autofahrer ist es nicht anders. Der Bock, der ihm ins Auto springt, gehört noch niemandem. Der, den er letztlich dann mit seiner fahrbaren Tatwaffe erlegt hat, ist schon im Eigentum des Jagdausübungsberechtigten. Das ist ja auch der Grund, dass er das Wildbret nicht als Entschädigung für den Blechsalat mitnehmen darf, sondern die Polizei oder im Bekanntheitsfall den Jagdaufseher oder den Jagdausübungsberechtigten zu verständigen hat ($ 69/3 KJG)."},{"pg":18,"k":"p","t":"Und das Straßenfallwild? Hier greift der Autofahrer (wie das Ergebnis zeigt vehement) in dieses Aneignungsrecht ein. Er wird schadenersatzpflichtig für den Fall, dass ihn ein Verschulden trifft, was etwa dann der Fall sein wird, wenn er trotz des Gefahrenzeichens „Achtung Wildwechsel\" mit überhöhter Geschwindigkeit gefahren ist."},{"pg":18,"k":"p","t":"i.)... Aneignung von Fallwild..."},{"pg":18,"k":"p","t":"Nicht sonderlich aktuell, da die meisten, insbesondere wenn es trophäenlos und /oder be reits zart duftend, ungeachtet der Meldepflicht des § 58 Abs. 1 KJG (= „Abschussmeldung\", die sich aber auch auf Fallwild bezieht) einen weiten Bogen darum machen und plötzlich ihre Fürsorgepflicht für das Wohlergehen Reinekes entdecken. An und für sich ist Fall wild alles, was nicht im Rahmen der Jagdausübung zur Strecke gebracht worden ist, von dem man also weiß, dass es nicht von einer bestimmten Jagd stammen kann."},{"pg":18,"k":"p","t":"Nachbarn, der sec derjenige, der 1"},{"pg":19,"k":"p","t":"1gs- Dieses Aneignungsrecht bezieht sich nach dem klaren Gesetzestext auf sämtliches Wild, somit auch auf ganzjährig geschontes.Aus diesem Grund war es auch unbestritten, dass der 2017 im Gailtal von einem Auto „erlegte\" Bär in die Verfügungsgewalt der dortigen Jagdgesellschaft gekommen ist (siehe Foto Seite 181)."},{"pg":19,"k":"p","t":"j.)... Abwurfstangen..."},{"pg":19,"k":"p","t":"Wichtig und wohltuend, das zu hören: Abwurfstangen unterliegen dem Jagdrecht! Sagen Sie es ruhig dem Nachbarn, der seelenruhig immer im Frühjahr um Ihre Hirschenfütterung herumschleicht, oder dem Schwammerlklauber, der auf diese Art beutebeladen sich verdrücken will! Auch die Abwurfstangen gehören dem Jagdausübungsberechtigten, wer dies missachtet, begeht einen (zugegebermaßen geringfügigen) Eingriff in fremdes Jagdrecht - übrigens auch derjenige, der unberechtigterweise sich Fallwild aneignet - oder, siehe unten, Eier des Federwildes, Gelege von Raubvögel und dergleichen."},{"pg":19,"k":"p","t":"k.)... Eier des Federwildes..."},{"pg":19,"k":"p","t":"Wie wäre es mit Eierspeise aus einem Fasangelege?"},{"pg":19,"k":"p","t":"Schon gekostet - kein Vergleich zu den Eiern der Auerhenne. Auch von den Falken schmecken sie köstlich, eher abzuraten sind die von Elster und Eichelhäher... Spaß beiseite. Wir finden hier wieder einmal eines dieser Rechte, mit denen man nichts anfangen kann. Unter § 68 Abs. 1 Z. 19 KJG wird nämlich ausgeführt:"},{"pg":19,"k":"p","t":"Es ist verboten... Nester und Gelege von Federwild zu zerstören oder die Eier obne Bewilligung (§ 52 Abs. 3) zu sammeln sowie die Brutstätten des Federwildes während der Brutzeit und der Aufzucht der Jungtiere zu beunruhigen."},{"pg":19,"k":"p","t":"... sich die Eier des Federwildes (Foto Auerhuhngelege) anzueignen..."},{"pg":19,"k":"p","t":"Wieder ein Recht, von dem man sich im wahrsten Sinn des Wortes nichts herunterbeißen kann."},{"pg":19,"k":"p","t":"Das Fallwild unterliegt ausschließlich dem Jagdrecht."},{"pg":19,"k":"p","t":"Es hat seinen Platz (zumeist) zwar nicht in der Tiefkühltruhe, wohl aber auf der „Abschuss\"-meldung (§ 58 KJG) und auf der Abschussliste (§ 59 KJG)."},{"pg":19,"k":"p","t":"Auch Abwurfstangen sind vom Jagdrecht beinhaltet, sie dürfen nicht von jedermann gesammelt und behalten werden."},{"pg":20,"k":"p","t":"In § 52 Abs. 3 finden man die Einzelheiten für diese Ausnahmet nichtaung, dazu - siche dof Nur Vorweg: Die Verwendung als Nahrungsmittel scheint dort nicht auf, die Bratphane und den Speck können Sie also vergessen."},{"pg":20,"k":"p","t":"Aber bevor wir uns verplaudern, weiter im Gesetzestext:"},{"pg":20,"k":"p","t":"§ 1a Abs. 2: Das Jagdrecht fließt aus dem Grundeigentum; es ist mit diesem verbunden und kann als selbständiges Recht nicht begründet werden."},{"pg":20,"k":"p","t":"Das Jagdrecht ist eine Folge des Eigentums an Grund und Boden. Das ist zumindest bei uns so, beim sogenannten Reviersystem. Anders wäre es beim Lizenzsystem wie etwa in Teilen der USA oder der Schweiz, wo Jagdrecht unabhängig vom Grundeigentum begründet wird: Das Jagdrecht hat der Staat, er erteilt (entgeltlich selbstverständlich) persönliche und nicht übertragbare Jagdlizenzen Jagdpatente), wonach die Jagd in bestimmten Jagdgebieten in einer bestimmten Zeit auf eine bestimmte Wildart ausgeübt werden kann."},{"pg":20,"k":"p","t":"Die Frage, wem das Jagdrecht zusteht, ist also korrekterweise zu beantworten mit „dem Grundeigentümer\"!"},{"pg":20,"k":"p","t":"Nun wird jeder, der zufälligerweise einige Quadratmeter oder Hektar Land sein eigen nennt, einwerfen, dass man darauf noch nicht jagen könne. Richtig. Um dieses Jagdrecht auch ausüben zu können, bedarf es weiterer Erfordernisse - siehe § 2."},{"pg":20,"k":"p","t":"Man muss also unterscheiden zwischen Jagdrecht und Jagdausübungsrecht."},{"pg":20,"k":"p","t":"Dem Grundeigentümer, der nicht Jagdausübungsberechtigter ist, verbleibt von diesem Jagdrecht ein sozusagen fast „nacktes Recht\", das sich nur wie folgt bemerkbar macht:"},{"pg":20,"k":"li","t":"Er erhält den anteiligen Pachtzins für das Gemeindejagdgebiet, falls die Grundfläche nicht in einem Bereich liegt, wo die Jagd ruht oder der jagdlich nicht nutzbar ist. Gegengleich kann es allerdings durchaus vorkommen, dass er im Falle eines Abganges in der Gemeindekasse aus dem Titel Jagd genauso verhältnismäßig zur Kasse gebeten wird. (§ 35 Abs. 2)."},{"pg":20,"k":"li","t":"Er kann bei der Verwertung der Gemeindejagd mitwirken - Zustimmung zur freihändigen Verpachtung."},{"pg":20,"k":"li","t":"Mitwirkung bei der Wahl des Jagdverwaltungsbeirates (§ 94)."},{"pg":20,"k":"q","t":"Sie haben in Ihrem Revier ein Gelege gefunden und richtigerweise als das eines Rebhuhns angesprochen. Dürfen Sie sich aus den Eiern eine Eierspeise machen? Wenn ja, schicken Sie mir bitte das Rezept. Falls nein, warum nicht? geübt Jagdausübu Jagdverwalter 1"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":3,"title":"Das Jagdausübungsrecht","pg":21,"blocks":[{"pg":21,"k":"p","t":"Nunmehr gibt es mehrere - genauer gesagt fünf - Möglichkeiten, dieses Jagdrecht wie eben beschrieben auch auszuüben. Schauen wir uns zunächst die beiden Hauptakteure genauer an:"},{"pg":21,"k":"law","t":"§ 2 Abs. 1: Das Jagdrecht wird entweder als Eigenjagd oder als Gemeindejagd ausgeübt (Jagdausübungsrecht)."},{"pg":21,"k":"law","t":"Abs. 2 Jagdausübungsberechtigt im Sinne dieses Gesetzes sind"},{"pg":21,"k":"p","t":"a) in Eigenjagdgebieten (§ 5) die Grundeigentümer (Eigenjagdberechtigten),"},{"pg":21,"k":"p","t":"b) in Gemeindejagdgebieten (§ 6) die Gemeinde."},{"pg":21,"k":"h","t":"a) Der Eigenjagdberechtigte"},{"pg":21,"k":"p","t":"Wenn die Eigenjagd festgestellt ist, ist es der Grundeigentümer, so er selbst jagen kann und auch will."},{"pg":21,"k":"h","t":"b) Die Gemeinde"},{"pg":21,"k":"p","t":"Bei Feststellung als Gemeindejagdgebiet. Die Betonung liegt auf die Gemeinde. Diese (als juristische Person) ist Inhaberin des Jagdausübungsrechtes, nicht der Bürgermeister und nicht der Gemeinderat. Lange kann sich die Gemeinde eines derartigen Rechtes aber ohnehin nicht erfreuen. Sie muss es nämlich verpachten oder, wenn dies nicht möglich ist, einen Jagdverwalter bestellen (siehe Absatz 5). Unterschwelliger Sinn des Gesetzes wohl: Niemand soll die Möglichkeit haben, umsonst oder zu kostengünstig zu jagern."},{"pg":21,"k":"p","t":"Wir halten aus dem eben Gesagten allerdings zunächst auch fest, dass Eigenjagden und Gemeindejagden nicht so herumliegen, sondern erst als solche festgestellt werden müssen. Als gelernte Österreicher wissen wir schon, dass das nicht so einfach ist. Es bedarf hiezu eines gesonderten Verfahrens, das später (Kapitel 11) noch zu besprechen sein wird. Mit der obigen Aufzählung ist - Sie haben es geahnt - die Anzahl der Jagdausübungsberechtigten aber noch nicht erschöpft. Denn:"},{"pg":21,"k":"law","t":"Abs. 4: Das Jagdausübungsrecht kann nach Maßgabe dieses Gesetzes im Wege der Verpachtung (§§ 16 ff), der Bestellung von Bevollmächtigten (Abs. 3) oder der Bestellung von Jagdverwaltern (§ 34) auf dritte Personen übertragen werden."},{"pg":21,"k":"p","t":"Ganz kleine Anmerkung für den, der dieser juristischen Abkürzung das erste Mal begegnet: §§ 16 ff bedeutet ganz einfach: Paragraphe 16 folgende, es wird also der § 16 und seine Folgeparagraphen - ohne nähere Präzisierung - zitiert."},{"pg":21,"k":"h","t":"c) Der Pächter"},{"pg":21,"k":"p","t":"Sowohl das Eigenjagdgebiet als auch das Gemeindejagdgebiet können verpachtet werden. Der Pächter leitet (ebenso wie der Bevollmächtigte und der Jagdverwalter) sein Jagdrecht zwar (vom Verpächter) ab, ist aber dessen ungeachtet Jagdausübungsberechtigter im vollen Umfang, der Verpächter hat sich seines Rechtes zur Gänze begeben, er ist (natürlich nur"},{"pg":22,"k":"p","t":"diesbezüglich) ein rechtliches Nichts Nachdem er in der Mehrzahl der ale sich dat aà bezahlen lässt, hält sich unser Mitleid in Grenzen."},{"pg":22,"k":"h","t":"d) Der Bevollmächtigte"},{"pg":22,"k":"law","t":"Abs. 3: Wenn das Eigentum an der Grundfläche, mit dem ein Eigenjagdrecht verbunden ist, einer einzelnen physischen Person, die nicht das Recht zu jagen bat (§ 36 Abs. 1) oder die Jagd nicht selbst ausüben will, oder im übrigen mehreren physischen Personen, einer Personenvereinigung oder einer juristischen Person zusteht, und die Jagd nicht verpachtet ist, steht das Jagdausübungsrecht jener Person zu, die vom einzelnen Jagdausübungsberechtigten oder vom Vertretungsbefugten der sonstigen angeführten Jagdausübungsberechtigten der Bezirksverwaltungsbebörde namhaft gemacht wird (Bevollmächtigter)."},{"pg":22,"k":"p","t":"Wird ein Pachtvertrag vor Ablauf der Pachtdauer aufgelöst oder gekündigt oder er: lischt er im Falle des Todes des Pächters und beträgt die noch verbleibende Pachtzeit weniger als ein Jahr, so hat der Jagdausübungsberechtigte des Eigenjagdgebietes für die noch verbleibende Zeitdauer einen Bevollmächtigten zu bestellen, sofern er nicht selbst das Recht zu jagen hat."},{"pg":22,"k":"p","t":"Gründe, einen Bevollmächtigten zu bestellen, sind somit mehrfach denkbar:"},{"pg":22,"k":"p","t":"aa) Jemand verfügt zwar über ein Eigenjagdgebiet, kann aber nicht jagen, er hat keine Jagdkarte. Oder: Er will nicht jagen, Verbot durch den Ehepartner, Zipperlein oder aus welchen Gründen immer. Er will aber auch nicht verpachten."},{"pg":22,"k":"p","t":"bb) Das (nicht verpachtete) Eigenjagdgebiet gehört mehreren Personen „zur ungeteilten Hand\" - „Ideelles Miteigentum\" nennt das Bürgerliche Recht Derartiges. Zwei oder mehr Personen sind gemeinsam für eine gewisse Grundfläche als Eigentümer im Grundbuch eingetragen. Häufigster Fall: Erbgang. Franz X war Jagdausübungsberechtigter, er ist verstorben. Erben sind sein Sohn Wolfgang und seine Tochter Susanne. Sie teilen nicht auf, sondern sind jeweils zur Hälfte Miteigentümer der gesamten Eigenjagd. Dasselbe ist natürlich auch für eine größere Anzahl von Personen denkbar."},{"pg":22,"k":"p","t":"CC) Eigentümer des (wiederum nicht verpachteten) Eigenjagdgebietes ist eine Personen: vereinigung oder eine juristische Person - sagen wir eine Aktiengesellschaft oder eine Gesellschaft mit beschränkter Haftung All diesen Fällen ist eigen, dass der Behörde sozusagen kein unmittelbarer Ansprechpartner gegenüber steht. Wer soll etwa bei einem internationalen Konzern für den Abschuss von Geißen verantwortlich sein?"},{"pg":22,"k":"p","t":"Wenn derartige Jagden nicht verpachtet sind, hat der betreffende (zivilrechtlich) Ver: tretungsbefugte einen Bevollmächtigten zu bestellen und der Bezirksverwaltungsbehörde (BH) namhaft zu machen. Sinnvollerweise kann dies nur jemand sein, der auch als Pächter fungieren könnte, was die BH auch zu überprüfen hat. Erst dann kann sie berechtigten wird."},{"pg":22,"k":"p","t":"den Bevollmächtigten bestätigen, wodurch er ebenfalls zu einem der Jagdausübungs®"},{"pg":23,"k":"p","t":"Das Alpenschneehuhn - Wild im Sinne des § 4 KJG (Federwild) und somit auch vom Jagdrecht umfasst. Jedoch ganzjährig geschont nach § 51 Abs. 1 KJG."},{"pg":23,"k":"p","t":"dd) Noch eine Möglichkeit des Bevollmächtigten:Vorzeitiges Ende eines Pachtvertrages, eine Eigenjagd betreffend, aus welchem Grund immer, weniger als ein Jahr hätte das Pachtverhältnis noch gedauert. Wenn der Verpächter selbst keine Jagdkarte hat, muss er für diesen Zeitraum auch einen Bevollmächtigten bestellen. Bekanntlich darf eine Verpachtung ja erst nach Ablauf dieser Frist erfolgen (§ 17 Abs. 1). Bei Gemeindejagden wird in einem solchen Fall ein Jagdverwalter bestellt (§ 34 Abs. 1)."},{"pg":23,"k":"p","t":"Die Benennung des Bevollmächtigten ist Pflicht der genannten (physischen oder juristischen) Person. Wenn dies (nach Aufforderung durch die BH allerdings erst) nicht geschieht, kann diese (die BH) - auf Kosten des Grundeigentümers - einen Jagdverwalter bestellen. Und selbstverständlich ist es so, dass nicht jeder „Dahergelaufene\" Bevollmächtigter werden kann. Man benötigt dazu"},{"pg":23,"k":"li","t":"die eigentliche Vollmachtserteilung. Das kann formlos geschehen, weder Notar noch rituelle Schwüre sind notwendig. Schriftlichkeit empfiehlt sich jedoch bereits aus dem Grund, weil man die Vollmachterteilung im Zuge des erforderlichen Bestätigungsverfahrens bei der Behörde nachweisen muss."},{"pg":23,"k":"li","t":"der Bevollmächtige muss die Pächtereigenschaft aufweisen - siehe § 18"},{"pg":23,"k":"li","t":"die BH muss wie gerade angedeutet das alles bestätigen."},{"pg":23,"k":"h","t":"e) Der Jagdverwalter"},{"pg":23,"k":"p","t":"(5) Gemeinden haben ihr Jagdausübungsrecht zu verpachten; falls die Verpachtung nicht möglich ist, ist zur Ausübung der Jagd ein Jagdverwalter zu bestellen (§ 34). Springt dann ein, wenn sonst kein Jagdausübungsberechtigter weit und breit ersichtlich ist: Wenn bei der Gemeindejagd die Verpachtung nicht klappt oder (siehe oben) das Pachtver-"},{"pg":24,"k":"p","t":"hatis vorzeig aufgelist wird und rente besil wird im ton c n Wen ein sero machtigter wie vorgesehen bestel Wiesent 2e Pathon ne Kein ein Bachiger als Pachter geeignet ist, bis zum Jahresende (9 22/Abs. D, east siehe bei $ 34 KJG."},{"pg":24,"k":"p","t":"rechtigter sein\" lässt sich mit fünf Möglichkeiten beantworten:"},{"pg":24,"k":"p","t":"zusammenfassend also und weil es so wichtig ist; Die vore, ver kann Jagdausübungste"},{"pg":24,"k":"h","t":"a) Der Eigenjagdberechtigte"},{"pg":24,"k":"h","t":"b) Die Gemeinde"},{"pg":24,"k":"h","t":"c) Der Pächter"},{"pg":24,"k":"h","t":"d) Der Bevollmächtigte"},{"pg":24,"k":"h","t":"e) Der Jagdverwalter"},{"pg":24,"k":"p","t":"Zu dieser Aufzählung noch eine kleine Feinheit am Rande: Die Übertragung des Jagdaus übungsrechtes an Bevollmächtigten und Jagdverwalter erfolgt nur eingeschränkt. So haben die Vorschläge für die Bestellung von Jagdschutzorganen (§ 44 Abs. 2) vom Eigentümer der Eigenjagd bzw. von der Gemeinde zu kommen, und für Jagdgebiete, für die ein Jagdverwalter zu bestellen ist, dürfen Jagderlaubnisscheine nicht ausgegeben werden (§ 41 Abs. 4). Aber das nur aus Gründen der Systematik, wir kommen später noch darauf zurück."},{"pg":24,"k":"p","t":"Doch nochmals zum Begriff „Jagdausübungsrecht\": Aber was ist mit mir, wird jetzt mancher fragen. Ich bin Inhaber eines Jagderlaubnisscheines und darf bei meinem Jagdchef die Jagd ausüben - da bin ich doch auch Jagd-ausübungs-berechtigt? Schön wär' s! Wir müssen hier unterscheiden zwischen dem Recht die Jagd auszuüben im Sinne von „Jagern dürfen\" und dem Jagdausübungsrecht im Sinne des Gesetzes. Dieses ist das umfassende Recht, wie wir es in $ la durchgekaut haben und wie es eben - als Eigenjagd oder Gemeindejagd bzw. der Weitergabe an Pächter Bevollmächtigten und Jagdverwalter - ausgeübt wird. Durch den Jagderlaubnisschein allein wird man also noch lange nicht Jagdausübungsberechtigter im technischen Sinn, schon gar nicht durch die Erlangung der Jagdkarte und auch nicht durch die Bestellung zum Jagdschutzorgan."},{"pg":24,"k":"p","t":"Und der Obmann der Jagdgesellschaft, der allgewaltige Jagdchef, wie er gerne genannt wird? Nun, auch ihn müssen wir enttäuschen. Jagdausübungsberechtigter ist die „Jagdgesellschatt nach außen."},{"pg":24,"k":"p","t":"Hubertus Hilf\" oder wie immer sie genannt wird. Der Obmann ist lediglich ihr Vertreter Der Verzicht auf das Jagdausübungsrecht"},{"pg":24,"k":"law","t":"§ 2 Abs. 6: Verzichtet ein Eigenjagdberechtigter gegenüber der Bezirksverwaltungsbehörde schriftlich auf sein Jagdausübungsrecht, so ist das Eigenjagdgebiet von der Bezirksverwaltungsbehörde benachbarten Jagdgebieten anzuschließen folger. Ein Verzicht I"},{"pg":25,"k":"p","t":"ei der Eigenjagd, Pächters, wenn s. 1). Genaueres Ein solcher Verzicht bindet für die Dauer seiner Wirksamkeit auch den Rechtsnachfolger: Ein Verzicht hinsichtlich eines Teiles des Jagdgebietes oder eines Teiles des Jagdausübungsrechtes ist unzulässig. Der Verzicht gilt auf die Dauer der Pachtzeit der Gemeindejagd."},{"pg":25,"k":"p","t":"... nur, damit man weiß, dass es zumindest theoretisch so etwas gibt. Ich persönlich warte schon seit Jahrzehnten darauf, dass mein Jagdnachbar von dieser ihm vom Gesetz so schön offerierten Möglichkeit Gebrauch macht; er denkt aber offensichtlich nicht daran."},{"pg":25,"k":"q","t":"Ist der Inhaber einer Jagdgastkarte Jagdausübungsberechtigter? Wenn ja: Warum? Falls nein: Warum nicht?"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":4,"title":"Grundsätze eines geordneten Jagdbetriebes","pg":25,"blocks":[{"pg":25,"k":"p","t":"Das Zentralthema überhaupt. Wer bei der Prüfung gefragt wird, wie die Jagd auszuüben ist, antworte nicht mit „nüchtern\""},{"pg":25,"k":"p","t":"\", „begeistert\" oder „berufsmäßig\""},{"pg":25,"k":"p","t":"', sondern mit der Zitierung des § 3 Abs. 1 KJG. Spaß beiseite: In dieser Gesetzesstelle finden wir unsere jagdpolitischen Leitlinien in Kurzfassung. Deshalb ist ihr auch besonderes Augenmerk zu schenken:"},{"pg":25,"k":"law","t":"§ 3 Abs. 1: Die Jagd ist sachgemäß und weidgerecht unter Beachtung der Grundsätze eines geordneten Jagdbetriebes auszuüben."},{"pg":25,"k":"p","t":"Es ist verboten, den Bestand einer Wildart durch eine nicht sachgemäße Jagdausübung zu gefährden."},{"pg":25,"k":"p","t":"Wildlebende Vogelarten, die im Sinne der Richtlinie des Rates vom 2. April 1979 über die Erhaltung der wildlebenden Vogelarten (79/409/EWG) in Österreich - unbeschadet § 51 Abs. 4a - nicht bejagt werden dürfen - dürfen ungeachtet der angewandten Methode - weder absichtlich getötet noch gefangen werden; solche Vogelarten dürfen"},{"pg":25,"k":"p","t":"- unbeschadet ff 54 und 54a - auch nicht gehalten werden."},{"pg":25,"k":"p","t":"Darüber hinaus ist die Jagd so auszuüben, dass die im öffentlichen Interesse gelegenen günstigen Wirkungen des Waldes nicht geschmälert und insbesondere waldgefährdende Wildschäden (§ 71 Abs. 3) vermieden werden."},{"pg":25,"k":"p","t":"Was bedeuten diese - an und für sich gängigen - Begriffe in unserem Fall?"},{"pg":25,"k":"p","t":"Der Jäger hat sich auf den neuesten Stand des Wissens zu halten und dieses auch im Revier anzuwenden. Man kann heute etwa nicht mehr ernsthaft die Meinung vertreten, dass es unsinnig wäre, Geißen zu erlegen (wo de Dirndlan san, san de Buam...), und auch die"},{"pg":26,"k":"p","t":"Peterng von Hochwid wir schiteckchs nabilien lin schon echt ei ma regente Retent ab trie mit Vit tring auschen Mindene Bei die un ans, von, enchgemis bietet auch die bereits besprochene Mindestenergieverordnung."},{"pg":26,"k":"h","t":"b) Weidgerecht"},{"pg":26,"k":"p","t":"Schwer zu defhieren, weil dem Zeigeist angepast Rahe piay ich, wie heutzutage übich. ein grundeutsches Wort zu verwenden, kommt der Sache vielleicht am nächsten. Venn der Verwaltungsgerichtshof 1974 definiert hat, Weidgerechtigkeit wäre das, was dem herkomm.lichen Jagdbrauch entsprechen würde, kann man das heute sicher nicht mehr so einfach sehen. Die Grundsätze des Tierschutzes spielen - richtigerweise - mehr denn je mit. So ist es einfach nicht weidgerecht, einen (in den meisten Fällen ohnehin nur vermeintlichen) Fehlschuss mit einem Achselzucken abzutun, statt mit dem Hund nachzusuchen, um allenfalls krank geschossenes Wild dann schneller von seinen Qualen erlösen zu können. (Dass damit auch der Tatbestand der Tierquälerei gesetzt werden kann und man mit einer strafgerichtichen Verurteilung rechnen muss, sei nur am Rande erwähnt.) Althergebrachtes Beispiel für mangelnde Weidgerechtigkeit sind der Schuss auf den Infanteristen oder auf die Ente am Spiegel. Bei letzterem kommen mir allerdings schon Zweifel. Wenn ich die diversen Flintenschießkünste so mancher Jäger (einschließlich meine eigenen) betrachte, frage ich mich gerade in Hinblick auf den aufgezeigten Tierschutzgedanken, ob ein exakter Schuss auf die schwimmende Ente nicht weidgerechter wäre als das x-fache Stochern in die Luft, bis rein zufällig und manchmal gar nicht mehr überblickbar doch etwas Schrot hängen bleibt. Wenn wir die beiden Begriffe „sachgemäß\" und „weidgerecht\" vergleichen, stellen wir fest. dass sie auf einer gänzlich anderen Beurteilungsebene liegen. Manchmal decken sie sich zwar, es ist aber doch nicht gesagt, dass alles, was sachgemäß ist, auch weidgerecht sein muss. Der 400-Meter Schuss auf den Gams kann bei entsprechender Laborierung und bei entsprechendem Können durchaus sachgemäß sein; weidgerecht ist die Sache (net g'schossn is a g'fahlt!) aber sicher nicht."},{"pg":26,"k":"p","t":"Wer die Jagd nicht sachgemäß ausübt, muss mit einer Bestrafung durch die BH rechnen, sofern sein Vorgehen, was zumeist der Fall sein wird, gegen das Der Schuss auf die Ente am Spiegel. Nach Weidgerechtigkeit."},{"pg":26,"k":"p","t":"herrschender Ansicht ein Beispiel für mangelnde"},{"pg":27,"k":"p","t":"Sung Jagdgesetz verstößt. Auch der Disziplinarrat der KJ wird seine mahnende Stimme erheben. Beispiel: Zwei Jahre Jagdkartenentzug für jemanden, der mit dem Kleinkaliber einen Bock beschossen hat. Aber auch für die nicht weidgerechte Jagdausübung sind sowohl BH als auch Disziplinarrat zuständig."},{"pg":27,"k":"p","t":"Weiteres Beispiel: Statt des vorgesehenen Hasen beschießt der Schütze den noch im Wald befindlichen Treiber. Ihm (dem Schützen natürlich) wurde u.a. auch mangelnde Weidgerechtigkeit vorgeworfen. Das klingt nur vorweg lustig; bei genauerem Nachdenken ahnt man, worauf es ankommt: Bewusste Rücksichtnahme auf Mensch und Tier und Beherrschung des eigenen Beutetriebes, wenn auch nur ein Mindestmaß an Risiko besteht, andere zu gefährden. Oder: Der Schuss am Treberhaufen. Das meines Erachtens typischste Beispiel der mangelnden Weidgerechtigkeit (von wegen fair play...). Wer hiebei erwischt wird, sollte am besten die Jagdkarte gleich für zwei Jahre freiwillig abgeben. Er erspart sich Rechtsanwaltskosten und ein jämmerliches Auftreten vor dem Disziplinarrat."},{"pg":27,"k":"p","t":"Am schönsten, weil dem eingangs erwähnten Zeitgeist wohl am meisten wiedergebend, scheint eine Definition der Weidgerechtigkeit im Übrigen im Leitbild der Kärntner Jäger auf, dessen Studium ohnehin wärmstens empfohlen wird."},{"pg":27,"k":"p","t":"An dieser Stelle soll daraus nur zusammenfassend wiederholt werden, dass Weidgerechtigkeit mit jagdlicher Ethik gleichgesetzt werden kann und folgendes beinhaltet (Zitat):"},{"pg":27,"k":"li","t":"sich laufend Wissen über die Natur und ihre Zusammenhänge anzueignen - sich weiterzubilden - und den jeweiligen Stand des Wissens bestmöglich umzusetzen"},{"pg":27,"k":"li","t":"Nutzung jagdbarer Tier auf Basis der Bestandes- Erhaltung"},{"pg":27,"k":"li","t":"Definition des Hegebegriffes in Richtung Lebensraumgestaltung bzw. -verbesserung"},{"pg":27,"k":"li","t":"dass die Pflanzenwelt durch Überbege von Wild nicht gefährdet werden darf - Fütterung grundsätzlich nur in"},{"pg":27,"k":"li","t":"die fachgerechte und gesetzeskonforme Verwertung des Wildbrets JAGD IST VERANTWORTUNG - JAGD IST FREUDE!"},{"pg":27,"k":"li","t":"die regelmäßige Überprüfung der eigenen Schießfertigkeit, der technischen Funktionstüchtigkeit der Jagdwaffen und Das Leitbild der Kärntner Jages deren sichere Handhabung"},{"pg":27,"k":"li","t":"das Bewusstsein um die Leidensfähigkeit des Tieres und die Verantwortung, diesem unnötige Qualen zu ersparen"},{"pg":27,"k":"li","t":"die Verfügbarkeit ausgebildeter Jagdhunde"},{"pg":27,"k":"p","t":"die Beachtung aller jagdlich relevanter Vorschriften und Gesetze"},{"pg":27,"k":"li","t":"Höflichkeit, Toleranz und Respekt gegenüber den Mitjagenden und Jagdnachbarn"},{"pg":28,"k":"p","t":"c) geordneter Jagdbetrieb 5 3 Abs. 2: Ein geordneter Jagdbetrieb ist gegeben, wenn durch die Jagdausübung einschließlich der Hege ein der Größe und Beschaffenheit des Jagasebietes und der Tragfübigkeit des Biotops angepasster artenreicher und gesunder Wildstand sowie ein Waldzustand, der die im öffentlichen Interesse gelegenen Wirkungen des Waldes - insbesondere durch den Schutz vor waldgefährdenden Wildschäden - erfüllt, erzielt und erhalten werden."},{"pg":28,"k":"p","t":"Dabei sind ein ausgeglichener Naturhaushalt, die Erfordernisse der Land- und Forstwirtschaft und die wildökologische Raumplanung zu berücksichtigen."},{"pg":28,"k":"p","t":"Der geordnete Jagdbetrieb umfasst auch eine ordnungsgemäße Ausübung des Jagd. schutzes."},{"pg":28,"k":"p","t":"Gefürchtete Prüfungsfrage bei der Jagd(aufseher)prüfung: „Was ist ein geordneter Jagdbe® trieb?\" Hat zur Folge meist hilfloses Stottern unzusammenhängender Phrasen beim Prüfling und tiefe Resignation beim Prüfer. Dabei ist die Erklärung so einfach und sollte eigentlich ohnehin jedem geläufig sein, der sich mit dem Thema Jagd beschäftigt:"},{"pg":28,"k":"p","t":"Gewünscht wird ein artenreicher und gesunder Wildstand, angepasst den Erfordernissen seiner spezifischen Umwelt, die da resultiert aus"},{"pg":28,"k":"li","t":"Jagdgebietsgröße (auf 115 Hektar haben halt nicht 20 „Hornate\" Platz...)"},{"pg":28,"k":"li","t":"Jagdgebietsbeschaffenheit (im Hochgebirge gibt Fasanenhege wenig Sinn...)"},{"pg":28,"k":"li","t":"Tragfähigkeit des Biotops"},{"pg":28,"k":"li","t":"Erzielung und Erhaltung eines Waldzustandes, der die im öffentlichen Interesse gelegenen Wirkungen des Waldes erfüllt. (Wie waren diese doch gleich? Nutzfunktion, Schutzfunktion, Wohlfahrtsfunktion... die vierte Wirkung bitte ich aus Gründen der Aufmerksamkeit selbst einzusetzen)"},{"pg":28,"k":"li","t":"insbesondere zählt dazu jedoch der Schutz vor waldgefährdenden Wildschäden"},{"pg":28,"k":"li","t":"ausgeglichener Naturhaushalt"},{"pg":28,"k":"li","t":"Erfordernisse der Land- und Forstwirtschaft"},{"pg":28,"k":"li","t":"Ergebnisse der wildökologischen Raumplanung."},{"pg":28,"k":"p","t":"Und, wichtig jetzt für den Jagdaufseher: Die ordnungsgemäße Ausübung des Jagdschutzes ist ebenfalls Bestandteil des „geordneten Jagdbetriebes\""},{"pg":28,"k":"p","t":"Jedoch: Wir lernen schließlich nicht nur für die Prüfung. Der „geordnete Jagdbetrieb\" wird wie Sie sehen werden in einer Vielzahl der Fälle im Jagdgesetz gefordert werden."},{"pg":28,"k":"h","t":"d) Wildschadensverhütung"},{"pg":28,"k":"p","t":"ist etwas derartig Wichtiges, dass es der Gesetzgeber sowohl in § 3 Abs. 1 ebenso erwähnt wie in § 3 Abs. 2. In nahezu identen Worten weist er auf die im öffentlichen Interesse gele- J 3 Abs. 3 erst"},{"pg":29,"k":"p","t":"- ins- It und Forstgenen günstigen Wirkungen des Waldes hin und dass waldgefährdende Wildschäden zu verhindern sind."},{"pg":29,"k":"p","t":"Dem Schreckgespenst der Gefährdung des Waldes durch Wild begegnen wir hier zum ersten Mal. Wer mehr Sehnsucht nach diesem gruseligen Thema hat, wird bei $ 71/3 (Gefährdung des Waldes durch Wild) voll auf seine Rechnung kommen."},{"pg":29,"k":"q","t":"Tier und Kalb mit einem Schuss erlegt. Nicht sachgemäß? Nicht weidgerecht? Dumm und verantwortungslos?"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":5,"title":"Die Hege","pg":29,"blocks":[{"pg":29,"k":"law","t":"§ 3 Abs. 3 erster Satz: Die Hege umfasst das Recht und die Pflicht, das Wild zu betreuen, ihm die Lebensgrundlagen zu sichern, seine Entwicklung zu fördern und allen Störungen entgegenzuwirken."},{"pg":29,"k":"p","t":"Sie umfasst auch die Förderung der Umweltbedingungen durch Äsungsverbesserung und Reviergestaltung."},{"pg":29,"k":"p","t":"Hiezu zählen insbesondere die Anlage von Daueräsungsflächen und Deckungsflächen, Verbissgehölzen, Hecken, Remisen u. ä."},{"pg":29,"k":"p","t":"Der Begriff „Hege mit der Büchse\" - uns allen zumindest noch aus der alten Literatur geläufig"},{"pg":29,"k":"p","t":"- lockt allerdings heute bestenfalls den Jagdhund hinter dem Ofen hervor. Biotophege heißt das Schlagwort heute und meint ganz einfach Förderung der Umweltbedingungen. Wildäcker, Hecken, Ökoflächen, alles fällt darunter. Der Gesetzgeber erachtet dies alles für so wichtig, dass er für den Fall, dass der Grundeigentümer solchen Plänen nicht aufgeschlossen gegenüber steht, sogar eine Art Enteignungsverfahren zulässt, d.h. die BH kann erforderlichenfalls die Zustimmung des Grundeigentümers mit Bescheid ersetzen (§ 63 Abs. 2)."},{"pg":29,"k":"law","t":"§ 3 Abs. 3 KJG spricht primär den Jagdausübungsberechtigten an und die Betonung liegt nicht auf „Recht\" - dazu bedarf es ja keines Gesetzes -, sondern auf „Pflicht\". Eine Bestimmung, die man vielleicht jedem Pächter vor Vertragsunterfertigung vorlesen müsste."},{"pg":29,"k":"p","t":"Ohne Förderung der Umweltbedingungen ist eine Fasanhege nicht denkbar."},{"pg":30,"k":"p","t":"Die Hegeverpflichtung stellt im üb rigen einen weturtichen Beitrags zum aktiven Naturschutz dar; dies umsomehr, als nach den Bestimmun gen des Naturschutzrechtes nie."},{"pg":30,"k":"p","t":"mand im besonderen verpflichtet ist, Maßnahmen zu setzen, die die Le bensgrundlagen von lieren sichem."},{"pg":30,"k":"p","t":"Die Lebensgrundlagen von Tieren, die dem Jagdrecht unterstehen, sind daher wesentlich besser abgesicher als die der ausschließlich dem Natur- Die Anlage von Hecken, Wildäcker und Remisen ist eine der wichtigsten schutz unterstehenden Tiere. Dies Bestandteile der jägerischen Hegeverpflichtung insbesondere dann, wenn man die Regelungen über die ganzjährige Schonung in diese Überlegungen miteinbezieht (RV). Auch das sollte man den Leuten sagen, die mit uns über den Sinn der Jagd diskutieren wollen. Vom Gesetzestext her ist allerdings nicht nur der Jagdausübungsberechtigte, sondern auch der Jagdaufseher gefordert. Wer genau gelesen hat, dem wird es aufgefallen sein: Allen Störungen des Wildes ist entgegenzuwirken. Hier ist eine breite Palette von Möglichkeiten denkbar. In § 69 Abs. 2 finden wir etwa, dass nichtberechtigten Personen u.a. jede vorsätzliche Beunruhigung und jede Verfolgung von Wild verboten ist. Hier könnte der Jagdaufseher zwanglos einschreiten. Nur: Einem Biker oder Schwammerlklauber wird man einen derartigen Vorsatz schwer nachweisen. Dem Wild ist es wiederum aber egal, ob der Störenfried stören will oder nicht, es möchte seine Ruhe, Störung bleibt Störung. Hier wird das Jagdschutzorgan viel Fingerspitzengefühl benötigen, um dem Gesetzesauftrag gerecht zu werden - das Gesetz selbst gibt ihm, wie wir noch sehen werden, relativ wenig Handwerkszeug dazu. Aber schließlich ist ja nicht vorgesehen, dass Jagdschutz Erholung bedeutet. Und die Überhege? Wenn von einer Wildart so viel Stück vorhanden sind, dass das natürliche Angebot an Äsung nicht ausreicht?"},{"pg":30,"k":"p","t":"Fütterung über das ganze Jahr also, weil es sich sonst nicht ausgeht. Wer das macht, führt das jagdliche Verständnis ad absurdum. Daher:"},{"pg":30,"k":"law","t":"§ 3 Abs. 3 letzter Satz: Es ist jedoch verboten, eine Wildart so zu überbegen, dass die im Jagdgebiet - ausgenommen die Zeit der Vegetationsruhe - vorhandene natürliche Ásung zu ihrer Ernährung nicht mehr ausreicht."},{"pg":30,"k":"q","t":"Muss der Fuchs gehegt werden? Wenn ja, warum und wie? Falls nein, warum nicht?"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":6,"title":"Wild","pg":30,"blocks":[{"pg":31,"k":"law","t":"§ 4 : Zum Wild im Sinne dieses Gesetzes gehören:"},{"pg":31,"k":"p","t":"a) Haarwild: Rot-, Dam-, Reh-, Gams, Stein-, Muffel- und Schwarzwild (Schalenwild); der Feldhase und der Alpen- oder Schneehase, das wilde Kaninchen, das Murmeltier, der Biber;"},{"pg":31,"k":"p","t":"der Bär, der Waschbär, der Wolf, der Fuchs, der Dachs, der Baum- oder Edelmarder, der Stein- oder Hausmarder, der Marderhund, der Iltis, das große Wiesel oder Hermelin, das kleine Wiesel, der Fischotter, der Luchs, die Wildkatze, der Goldschakal, (Raubwild);"},{"pg":31,"k":"p","t":"b) Federwild: das Auer, das Birk- und das Rackelhuhn, das Hasel, das Alpenschnee- und das Steinhuhn, das Rebhuhn, der Fasan, die Wachtel, die Wildtauben, die Wacholderdrossel (der Krammetsvogel), die Wildenten, die Wildgänse, das Blässhuhn, der Graureiher, der Haubentaucher, die Bekassine, die Waldschnepfe, die Taggreifvögel, die Eulen, der Kolkrabe, die Aaskrähe, der Eichelhäher, die Elster: Muss ich das wirklich alles so genau wissen, werden Sie jetzt fragen. Die Antwort ist ein unbedingtes und gnadenloses „Ja!\", und zwar aus folgenden Gründen:"},{"pg":31,"k":"p","t":"a. Das Tötungsverbot Eigentlich habe ich im Zusammenhang mit der Erörterung des Begriffes „erlegen\" (siehe „2. Das Jagdrecht\") etwas verschwiegen. Nämlich dass die Berechtigung Wild zu erlegen nichts Selbstverständliches ist."},{"pg":31,"k":"p","t":"Siehe zunächst J 6 Abs. 1 Tierschutzgesetz: Es ist verboten, Tiere ohne vernünftigen Grund zu töten. An und für sich normiert das Tierschutzgesetz also ein Tötungsverbot. Jedoch mit einer Ausnahme:"},{"pg":31,"k":"law","t":"§ 3 Abs. 4: Dieses Bundesgesetz gilt nicht für die Ausübung der Jagd und der Fischerei."},{"pg":31,"k":"p","t":"Das allgemeine Tötungsverbot betrifft also in unserem Fall nicht die Ausübung der Jagd diese streng in der Definition des § 1 in Verbindung mit § 4. Der Jäger darf Wild töten, ohne nach dem Tierschutzgesetz belangt zu werden. Aber er darf nur Wild im Sinne des § 4 töten, weil sich nur darauf die Ausnahme bezieht. Daher ist es so wichtig zu wissen, was unter § 4 fällt."},{"pg":31,"k":"p","t":"Beliebte Prüfungsfrage: „Sie kriegen einen Sikahirsch in Anblick. Dürfen Sie schießen?\" Vermutlich werden Sie verneinen. Der Prüfer wird womöglich nachsetzen: „Aber der Sikahirsch gehört doch zu Schalenwild! Schalenwild darf man erlegen!\". Aber Sie bleiben - richtigerweise - bei ihrem Nein und begründen dies damit, dass er zwar zu Schalenwild gehört,"},{"pg":32,"k":"p","t":"Nicht nur der Fuchs zählt zum Wild im Sinne... sondern auch der Stein- oder Hausmarder..."},{"pg":32,"k":"p","t":"des § 4 KJG..."},{"pg":32,"k":"p","t":"nicht jedoch explizit in § 4 aufgezählt ist. Er zählt also nicht zu Schalenwild nach $ 4 KJG. Eine Sonderstellung hat allerdings der nicht zu Wild zählende Kormoran. Er darf trotzdem erlegt werden, die Tierartenschutzverordnung erlaubt es unter gewissen peinlich genau aufgezählten Umständen - alles Weitere siehe dort."},{"pg":32,"k":"p","t":"b. Die Hegeverpflichtung Siehe voriges Kapitel mit dem nochmaligen Hinweis, dass sich die Hegeverpflichtung auf Wild - eben im Sinne des § 4 KJG - bezieht."},{"pg":32,"k":"p","t":"c. Wildschadenersatz... wird noch genügend durchgekaut werden. Aber jetzt können wir uns schon merken, dass, wie schon der Name sagt, eine Schadenersatzverpflichtung nur dann entstehen kann, wenn der Schaden durch Wild verursacht worden ist. Den Schaden, den die allenfalls schälende Kuh des Landwirts verursacht, zahlt nur der, der das Jagdgesetz nicht kennt. Jetzt etwas anderes: Haben Sie schon nachgezählt, um wie viele Gattungen es sich hier handelt? Ich habe es für Sie getan (gerne geschehen): 51 Gattungen finden sich hier (Irrtum vorbehalten). 51-fach sind wir also Herr über Leben und Tod. Klingt doch gut, wenn eine bekannte Tierschutzorganisation dann bekannt gibt, in dem von ihr gepachteten Revier hätte sie das Jagen so eingeschränkt, dass über 20 Stück aus diesem Katalog voll geschont werden! Uns versierten Jagdjuristen fällt aber sofort auf, dass diese Zurückhaltung gar nicht so edel ist wie es zuerst den Anschein haben könnte: Über 25 hievon sind nämlich gemäß"},{"pg":32,"k":"law","t":"§ 51 Abs. 1 ohnehin von Gesetzes wegen zur Gänze geschützt. Schauen wir uns das an:"},{"pg":33,"k":"p","t":"...der Uhu..."},{"pg":33,"k":"p","t":"- Federwild („die Eulen\") - ganzjährig geschont nach § 51 Abs. 1 KJG."},{"pg":33,"k":"p","t":"ganzjährig geschont nach § 51 Abs.1 KJG."},{"pg":33,"k":"law","t":"§ 51 Abs. 1: Während des ganzen Jahres sind zu schonen: das Steinwild, der Bär, der Wolf, das kleine Wiesel, der Fischotter, der Luchs, die Wildkatze, der Biber, die Auerbenne, die Birkhenne, die Haselbenne, das Alpenschneehuhn, das Steinhuhn, die Wachtel, die Wacholderdrossel (der Krammetsvogel), der Graureiber, der Haubentaucher, die Bekassine, die Wildenten, ausgenommen die Stockente, die Krickente, die Pfeifente, die Schnatterente, die Spießente, die Löffelente, die Tafelente, die Reiherente und die Knäkente, die Wildgänse, ausgenommen die Graugans, die Saatgans und die Kanadagans, die Hobltaube, der Kolkrabe, die Taggreifvögel und die Eulen sowie die Aaskräbe, der Eichelhäher und die Elster."},{"pg":33,"k":"p","t":"Zugegeben, die Aufzählung wird immer länger, mit jeder Novelle kuscheln sich ein paar Tierchen mehr dazu. In der Aufzählung des § 4 finden sich aber auch, wie ersichtlich, die Wildenten, die Wildgänse, die Wildtauben. Früher hat das bedeutet, dass man wahllos auf alles Dampf machen konnte, was da diesbezüglich flog, und mancher Jungjäger- und Jagdaufseherkandidat fragte sich verzweifelt, warum er denn ausgerechnet Eiderente und Trauerente kennen und erkennen müsse. So, jetzt weiß er es. Alle Enten und Gänse sind geschont, außer..."},{"pg":33,"k":"p","t":"Viel Erfolg beim Ansprechen beim abendlichen Entenstrich!"},{"pg":33,"k":"p","t":"Aber Genaueres später noch und zur Genüge. Versprochen."},{"pg":33,"k":"p","t":"In manchen Fällen hält sich der Gesetzgeber sehr kurz und vertraut auf die naturwissenschaftlichen Kenntnisse seiner Jäger. So schreibt er etwa nur „die Eulen\". Und erwartet, dass man weiß: Es gibt Echte Eulen (Waldohreule, Sumpfohreule, Zwergohreule, Uhu, Waldkauz,"},{"pg":34,"k":"p","t":"der Steinadler (Federwild die Taggreifvögel\"), ganzjährig geschont...das Gamswild (Schalenwild, Haarwild)"},{"pg":34,"k":"p","t":"Der Tannenhäher. Gehört nicht zu Wild. Hahn in Ruh'!"},{"pg":34,"k":"p","t":"Der Kormoran. Siehe T:"},{"pg":34,"k":"p","t":"artenschutzverordna ', sprach man früher streunende Hunde und F 90 Prozent der Le:"},{"pg":34,"k":"p","t":"Haus bauen\", unc"},{"pg":35,"k":"p","t":"Siehe Tierrordnung."},{"pg":35,"k":"p","t":"Soption Habichtskauz, Steinkauz, Raufußkauz, Sperlingskauz) und Schleiereulen. Auch der Kauz fällt somit unter Wild im Sinne des § 4."},{"pg":35,"k":"p","t":"Eine Bemerkung noch, dann wissen wir wirklich schon sehr viel über dieses Thema: „Raub-, sprach man früher verächtlich und meinte die oben aufgezählten einstens nicht einmal unter Naturschutz stehenden Rabenvögel. Manche zählten auch im Revier umherstreunende Hunde und Katzen dazu. Der Ausdruck wird heute nicht mehr gerne gehört, jedes dieser Tiere ist ein Teil der Natur und verhält sich genau so wie Reh und Hirsch, nämlich naturgerecht, aber eben auf seine Weise. Dass dies mit unseren wie sich immer mehr herausstellt kurzsichtigen menschlichen Vorstellungen nicht immer konform geht, berechtigt uns noch nicht, sie und die anderen erwähnten Rabenvögel sozusagen als Ungeziefer zu betrachten."},{"pg":35,"k":"q","t":"Sie haben bei einer Treibjagd einen Tannenhäher erlegt. Wer ist für das weitere Vorgehen zuständig? a. Der Jagdleiter, der sich über Ihr Weidmannsheil freut? b. Das Jägerehrengericht, das sich über Ihr Weidmannsheil nicht freut?"}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":7,"title":"Die Entscheidung","pg":35,"blocks":[{"pg":35,"k":"p","t":"Ein - versprochen - ganz kleiner Ausflug in die Staatsbürgerschaftskunde, um den jagdlichen Amtsschimmel nicht nur zum Wiehern, sondern auch zum Traben bringen zu können. Über 90 Prozent der Leser werden jetzt nur milde lächeln. Mir ist es trotzdem das Papier wert, damit auch die restlichen zehn Prozent alles verstehen, was damit zu tun hat. Es erhebt sich nämlich die Frage, wie sich das Land/die Bezirksverwaltungsbehörde/die Kärntner Jägerschaft rechtsverbindlich äußert. Der Bürgermeister kann ja nicht sagen: „Hier kannst du dein Haus bauen\", und der Bezirkshauptmann kann nicht sagen: „Du kriegst die Eigenjagd in der von dir beantragten Größe!\" Ich weiß, dass beide es tun, aber das ist noch keine Entscheidung, sondern bestenfalls ein Versprechen, eine solche zu machen oder sich für eine solche einzusetzen.Auch der Bezirksjägermeister wird über den Abschussplan nicht zwischen zwei Bieren am Stammtisch entscheiden. Es braucht alles seinen Weg und seine Form."},{"pg":35,"k":"p","t":"Welche Willensäußerungen der Staatsgewalt kennen wir denn eigentlich - nach dem Stufenbau der Rechtsordnung, wie es so schön heißt? Und was kann der Einzelne dagegen tun? a. Das Gesetz Beschlossen vom Parlament, so es sich um ein Bundesgesetz handelt, wie etwa das Waffengesetz, oder vom Landtag, wenn es um ein Landesgesetz geht. Das Kärntner Jagdgesetz ist wie schon der Name sagt ein Landesgesetz (die anderen Bundesländer haben jeweils eigene Jagdgesetze). Gegen die Erlassung von Gesetzen ist der Einzelne nahezu machtlos, er kann sich bestenfalls vornehmen, sich bei der nächsten Wahl für diesen Blödsinn zu revanchieren."},{"pg":36,"k":"p","t":"b. Die Verordnung Hin Regelung im vom 6 ret vorgesehenen Raine date nur an ino wie de ce"},{"pg":36,"k":"li","t":"Die Verordnungen der Landesregierung Vendes gierung, mpiel die Schomaine unsere Betrachtungen interessant sind:"},{"pg":36,"k":"p","t":"wie regel ein Bescheid richer ich im Gegensatz dazu nur an eine Einzelero a Ore ung, oder überhaupt die Möglichkeit de hanei en Fallen des es eroting co indnung, des «cordneten lagdbetriebes\" (mehr bei den Fallen des 5D in die getit Schonzeitregelung eingreifen zu können."},{"pg":36,"k":"li","t":"Die Verordnungen des Landesvorstandes der K, im Verordnungsweg zu etage sind etwa die Abschussrichtinien, zu erwähnen ist auch die venordnung für die Vorchnce von Abschussmeldung und Abschussliste. Auch die näheren Bestimmungen über die Einrichtung von Jagdkatastern sind mit Verordnung zu regeln. Wichtig auch die Pestegues der Gebiete in denen Rehwild auch mit Obstrester getitert werden darf, die Verordnung betreffend Festlegung der Mindestenergiewerte sowie die Verordnung betreffend Pom und Inhalt der Formulare Jagdkarte, Jagdgastkarte, Jagderlaubnisschein. Und, und, und Einzelheiten siehe später."},{"pg":36,"k":"p","t":"Allen Verordnungen gemeinsam ist, dass man sich als Einzelner ebenfalls sehr schwertu sie anzufechten. „Beschwerden sind beim Salzamt einzureichen\", wie es so schön heißt. c. Die „Beleihung\""},{"pg":36,"k":"p","t":"Da war doch etwas - ein Schreibfehler? Ein Redaktionsversehen? Seit wann erlässt die Jägerschaft eine Verordnung? Das ist doch normalerweise ausschließlich Aufgabe der Landesregierung? Wenn ich von einer derartigen Möglichkeit bei meiner zweiten juristischen Staatsprüfung gefaselt hätte, hätte man mich wohl trotz meines schönen neuen Anzuges höflich ersucht, den Raum zu verlassen und nie mehr wieder zu erscheinen..."},{"pg":36,"k":"p","t":"Nun, seit der Novelle 2003 ist nichts mehr so wie es einmal war. Wir werden bei unserem Gang durch das Kärntner Jagdgesetz (KJG) diesen Umstand mehrfach feststellen. Der Jurist nennt das „Beleihung\" - die Hoheitsgewalt wird an einen ausgegliederten Rechtsträger wie in diesem Fall die Kärntner Jägerschaft übertragen, das immer mit der Einschränkung, cass die Landesregierung ein umfassendes Weisungsrecht erhält, sie die sachlich in Betracht kommende Oberbehörde ist und allenfalls gesetzwidrige Verordnungen auch sofort authe ben kann. Die Kärntner Jägerschaft ist also „im übertragenen Wirkungsbereich\" tätig, wie es juristisch so schön (oder unschön) heißt."},{"pg":36,"k":"p","t":"d. Der Bescheid Er richtet sich an den einzelnen Statsbürger, der da einen Antrag gestellt hat oder der ge straft gehört (wofür er natürlich keinen Antrag gestellt hat, sofern nicht das strafbare Ver. halten an sich als Antrag auf Bestrafung gesehen wird) Jede derartige Entscheidung eriole schriftich. Bei Gericht heißt das Urteil oder Beschluss, die Bezeichnung ist eine andere, die Wirkung ident: I"},{"pg":37,"k":"p","t":"Inung,im"},{"pg":37,"k":"li","t":"geltende eißt."},{"pg":37,"k":"p","t":"Wirkung ident: Der Staatsbürger kann schriftlich nachvollziehen, was sich das Amt da hat einfallen lassen, um ihn zu erfreuen oder zu ärgern, und er hat die Möglichkeit, dagegen ein Rechtsmittel zu erheben."},{"pg":37,"k":"p","t":"Bei jeder Willensäußerung einer Behörde (wobei in diesem Sinn auch die Kärntner Jägerschaft gemeint ist), die jagdrechtlich (und selbstverständlich auch ansonsten) relevant ist, steht also „Bescheid\" oder „Erkenntnis\" als Überschrift; nehmen wir als Beispiel die Jagdgebietsfeststellung, den Abschussplan, die Feststellung eines Jägernotweges. Wenn ein Behördenschreiben mit „Sehr geehrter Herr...\" beginnt, also ohne als Bescheid gekennzeichnet zu sein, mag das mehr oder weniger lieb gemeint sein und u.U. auch Rechtsfolgen haben, ein Bescheid ist es jedoch sicher nicht."},{"pg":37,"k":"p","t":"In allen für unsere Betrachtungen wesentlichen Fällen erhebt man Beschwerde an das Landesverwaltungsgericht mit Sitz in Klagenfurt. Die 2. Instanz wird sich die ganze Sache noch einmal anschauen und sich insbesondere mit der Argumentation des unzufriedenen Staatsbürgers Wort für Wort auseinandersetzen."},{"pg":37,"k":"p","t":"Wer dann noch immer nicht zufrieden ist, kann sich an den Verwaltungsgerichtshof oder an den Verfassungsgerichtshof wenden. Beide sind in Wien ansässig. Das wird dann eine Spur aufwendiger, weil das ein Rechtsanwalt machen muss. Derartiges nennt man ein „außerordentliches Rechtsmittel\", und böse Zungen behaupten, der Name rührt daher, weil es außerordentlich viel Geld kostet."},{"pg":37,"k":"p","t":"Liges 1e- Kleine Lernpause Sie haben es sich verdient."},{"pg":37,"k":"p","t":"(Stengelloses Leimkraut)"},{"pg":38,"k":"p","t":"Die Errichtung von Fütterungsanlagen ist anzeigepflichtig."},{"pg":38,"k":"p","t":"Bescheide nach dem KJG können sowohl von der Landesregierung und der Bezirksverwal.tungsbehörde als auch vom Landesjägermeister bzw. vom Bezirksjägermeister erlassen werden. Was die Jägerschaft betrifft ist der bekannteste der Bescheid, mit dem der Abschussplan festgesetzt wird ($ 57 KJG). Ihn erlässt der Bezirksjägermeister Auch die Beschränkung des Abschusses (/ 53 KJG... sinkt der Bestand einer Wildart bedeutend unter das dem Jagdgebiet entsprechende Mindestausmaß...) ist vom BJM (=Bezirksjägermeister) mit Bescheid festzulegen. Der Nichtuntersagungsbescheid bei einer Rotwildfütterungsanlage (betreffend Raufutter) fällt ebenfalls in die Zuständigkeit des BJM, ebenso deren Beseitigung. Die Ausnahmegenehmigungen bei der Verwendung von Abzugeisen fallen zur Gänze und mit allen Folgewirkungen (Entzug, Überwachung...) in die Zuständigkeit des Landesjägermeisters."},{"pg":38,"k":"p","t":"e. Die Anzeigeverpflichtung Normalerweise muss Otto Normalverbraucher nunmehr geduldig warten, bis das hohe Amt zu entscheiden gedenkt. In einigen wenigen Fällen hat er die Sache aber doch im Griff, nämlich dann, wenn etwas nicht genehmigungspflichtig, sondern nur anzeigepflichtig ist. Letzteres heißt, Otto muss sein Vorhaben zwar der Behörde melden, darf aber, wenn sie nicht innerhalb einer gewissen Zeit Niet sagt, im gemeldeten Sinn tätig werden. Ein Beispiel wäre die Errichtung von Fütterungsanlagen: Wenn eine Untersagung nicht binnen 8 Wochen erfolgt, darf mit der Errichtung begonnen werden (siehe später bei § 63 Abs. 5). Ein weiteres Beispiel: Ein Gehege darf, wenn die sonstigen Voraussetzungen gegeben sind. errichtet werden, wenn nicht eine Untersagung (dieses Mal durch die Landestegierung) binnen 8 Wochen erfolgt (siehe unter § 8 Abs. 6)."},{"pg":39,"k":"p","t":"SS- Die Eigenjagd:... demselben Eigentümer gehörend, zusammenhängend, jagdlich nutzbar, Mindestfläche 115 Hektar. Eine Obergrenze ist im Gesetz nicht vorgesehen."}]},{"part":"A","partTitle":"Allgemeiner Teil","nr":8,"title":"Die Eigenjagd","pg":39,"blocks":[{"pg":39,"k":"p","t":"Wie kommt man zu der so begehrten Eigenjagd? Erheiraten oder erben ist zwar auch eine (womöglich die) richtige Antwort, aber wir wollen die Sache ja juristisch betrachten. $ 5 KJG zählt die Erfordernisse auf:"},{"pg":39,"k":"law","t":"§ 5 Abs. 1: Ein Eigenjagdgebiet ist eine demselben Eigentümer gehörende, zusammenhängende, jagdlich nutzbare Grundfläche von mindestens 115 ha."},{"pg":39,"k":"p","t":"Wieder so eine Ansammlung von Schlagworten, bei der jedes einzelne beleuchtet werden muss:"},{"pg":39,"k":"li","t":"Demselben Eigentümer gehörend:"},{"pg":39,"k":"p","t":"Alles klar: Wenn Aloisius Nimmersatt über grundbücherliche Einlagezahlen von zusammen 115 ha (... es darf ruhig auch ein bisserl mehr sein...) verfügt, sind diese „demselben Eigentümer gehörend\", da gibt es keinen anderen. Auch eine juristische Person - eine Aktiengesellschaft etwa oder eine Gesellschaft mit beschränkter Haftung - ist, obwohl vorstellungsmäßig nicht so leicht zu fassen, „derselbe Eigentümer\""},{"pg":39,"k":"p","t":"Aber jetzt verabschiedet sich Alois in die ewigen Jagdgründe und hinterlässt zwei Kinder, Alois jun. und Aloisia. Sagen wir ohne Testament, beide erben jeweils die Hälfte. Wenn jetzt der Besitz räumlich geteilt wird, jeder von zum Beispiel 120 ha somit 60 ha erhält und das jeweilige Eigentum sodann womöglich durch einen Grenzzaun oder Grenzmarkierungen, jedenfalls aber im Grundbuch ersichtlich ist, ist Aloisia zumindest in den Augen manches Jägers gar keine so gute Partie mehr, denn der Traum von der Eigenjagd ist ausgeträumt. Jeder ist ja nur mehr Eigentümer von 60 Hektar."},{"pg":40,"k":"p","t":"Ander verhaltes sich, wenn beide (aber chen ur mehs zu tine eles haben bưchn inders stil es sich, (eralte Grundbuchstand, nus das stauchiere, we altes habe «te alen Girie tum\" nennt das der Jurist sprit dabrigens beliebig atemselben bien. Lidess rend Die Zahl Zwei in diesem Beispiel ist übrigens beleg auswechselbat Aber gehren man Eigentümer? Durch Bezahlung des Kaum eisen müchte man mich iter wiz wie macht zwar frieden, aber noch kein Eigentum. Eigentümer Wird man cout durch die diesbezügliche Grundbuchseintragung."},{"pg":40,"k":"p","t":"Eine Ausnahme ist relevant: Die Ersitzung. Wer behauptet, dass die Vorfahren (30 Jane müssen es schon sein) dieses Grundstück schon als das ihre betrachtet und solcherat go muss haben, hat eine Chance, Eigentum auch gegen den Grundbuchstand zu erwerben Außer die notwendigen Zeugen braucht er dazu eigentlich nur gute Nerven und eine zah. lungswillige Rechtschutzversicherung."},{"pg":40,"k":"li","t":"Zusammenhängend:"},{"pg":40,"k":"p","t":"Jetzt machen wir einen Vorgriff auf § 7 :"},{"pg":40,"k":"law","t":"§ 7 Abs. 1:Als zusammenhängend im Sinne der J$ 5 und 6 gelten Grundflächen, wenn man von einem Grundstück zum anderen gelangen kann, ohne fremden Grund zu betreten."},{"pg":40,"k":"p","t":"Der Zusammenhang von Grundstücken ist auch dann gegeben, wenn sie nur in einem Punkt zusammenstoßen. Inseln gelten als mit den Ufergrundstücken zusammenhängend."},{"pg":40,"k":"law","t":"Abs. 2: Wege, Eisenbahngrundstücke, fließende und stehende Gewässer und Grundflächen von ähnlicher Konfiguration, die nach Umfang oder Gestalt für sich allein einen geordneten Jagdbetrieb nicht gestatten, bilden kein selbständiges Jagdgebiet; sie unterbrechen durch ibre Breite den Zusammenhang eines Jagdgebietes nicht; sie stellen durch ibre Länge den Zusammenhang eines Jagdgebietes (Abs. 1) zwischen getrennt liegenden Grundstücken nicht ber..."},{"pg":40,"k":"p","t":"Der Absatz 1 schafft keine Probleme - wir sind ja alle athletisch gebaut und schaffen es auch in Fällen der sogenannten Punktberührung, das fremde Jagdgebiet nicht zu betreten.Vor allem im Winter mit Gewehr über der Schulter, Hund an der Führerleine und Ansitzack unter den Arm geklemmt."},{"pg":40,"k":"p","t":"Det Absatz 2 schon, vor allem den Politikern, die großartig auf diese Art zu schaffende Jagt.gebiete versprechen und das dann nicht halten können: Wir müssen uns damit abfinden. dass es gewisse Grundfächen in diesem Land gibt, die für sich allein einen geordneten. Jagdbetrich nicht gestatten - siehe § 3/2 und die dort angedeutete Wichtigkeit diess Begriffes. Bin Weg ist das typische Beispiel. Jeder wird davon ausgehen, dass es dort silos ist, einen der Größe und Beschaffenheit des Jagdgebietes angepassten artenreichen und gesunden Wildstand zu erhalten\"."},{"pg":40,"k":"p","t":"Auch See, Teiche, Flüsse, Bäche zählen dazu. In der Breie"},{"pg":41,"k":"p","t":"Es bleiben lles haben."},{"pg":41,"k":"p","t":"hselbar."},{"pg":41,"k":"p","t":"n meinen."},{"pg":41,"k":"p","t":"30 Jahre werben."},{"pg":41,"k":"p","t":"1- Vor gesehen schaden sie nicht, falls in näheren Randbereich befindlich können sie ein willkommener Anlass für eine Abrundung (siehe später bei § 11) sein. In der Länge gesehen stellen sie jedoch keinen (jagdlich relevanten) Zusammenhang her."},{"pg":41,"k":"p","t":"Beispiel: Ich besitze 50 Hektar in der Katastralgemeinde Sowieso und 70 Hektar knapp daneben, jedoch nicht benachbart. Jetzt gelingt es mir, einen zwei Meter breiten und 200 Meter langen Grundstreifen zu kaufen, der diese beiden Grundflächen miteinander verbindet. Das war hinausgeschmissenes Geld, ein derartiger Streifen ist für sich allein für die Jagd nicht geeignet, der Zusammenhang nicht hergestellt, die Eigenjagd kann nicht als solche bewilligt werden."},{"pg":41,"k":"p","t":"Wichtig in Zeiten wie diesen: Durch eine (auch noch so hohe) Einfriedung wird der Zusammenhang nicht unterbrochen. Auch eine Autobahn mit ihrem für sie vorgesehenen Wildzaun schafft das nur faktisch, nicht jedoch rechtlich. (Es kann jedoch zu einer Abrundung oder einem Flächentausch kommen - siehe später.)"},{"pg":41,"k":"li","t":"Die jagdliche Nutzbarkeit:"},{"pg":41,"k":"p","t":"J 7 Abs. 3: Jagdliche Nutzbarkeit einer Grundfläche liegt vor, wenn diese wenigstens einer Schalenwildart Einstands- oder Äsungsmöglichkeiten bietet."},{"pg":41,"k":"p","t":"Bei der Berechnung der Größe eines Jagdgebietes dürfen jedoch Grundstücke, die nicht wenigstens einer Schalenwildart Einstands- oder Äsungsmöglichkeit bieten, nicht mitgerechnet werden, wenn ihr Flächenausmaß zusammengerechnet mehr als die Hälfte der Größe des Jagdgebietes beträgt."},{"pg":41,"k":"p","t":"Man beachte wiederum die Feinheiten:"},{"pg":41,"k":"p","t":"...wenigstens einer Schalenwildart... Ein Blick auf § 4 lehrt uns, was gemeint ist. Im Notfall muss das Reh herhalten, das hat bekanntlich auch noch in Omas Hausgarten zumindest Äsungsmöglichkeit. Ente allein ist also zuwenig, womit die Gewässer sich aus dem Katalog der jagdlich nutzbaren Teile von Kärnten verabschiedet haben. Aber Vorsicht: Schilf kann ein Grenzfall - Einstand! - sein, wobei sich in diesem Fall und auch sonst die jagdliche Nutzbarkeit nicht auf das gesamte Jahr beziehen muss - unsere Hochgebirgsregionen hätten ansonsten ja immense Schwierigkeiten mit dem Begriff."},{"pg":41,"k":"p","t":"Wichtig für die Prüfung ist das „oder\". Es heißt „Einstands- oder Äsungsmöglichkeit\" und nicht „Einstands- und Äsungsmöglichkeit\". Letzteres wäre wohl auch zuviel verlangt. Grundstücke, die weder das eine noch das andere bieten, dürfen bei der Berechnung der Größe eines Jagdgebietes nur bis zu dessen Hälfte mitgerechnet werden. Wer 100 Hektar See und 15 Hektar Wald hat, hat also keine Chance auf eine Eigenjagd, verkehrt ist es selbstverständlich möglich."},{"pg":41,"k":"p","t":"Jagdlich nicht nutzbare Grundstücke sind von der Pachtzinsaufteilung ausgenommen (§ 35"},
