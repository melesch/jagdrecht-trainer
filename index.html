const BOOK=[
{k:'A. Allgemeiner Teil',pg:20,f:"Sie haben in Ihrem Revier ein Gelege gefunden und richtigerweise als das eines Rebhuhns angesprochen. Dürfen Sie sich aus den Eiern eine Eierspeise machen?",b:"Siehe § 68 Abs. 1 Z 19. Eine Ausnahmegenehmigung werden Sie für diesen Zweck nicht erhalten.",h:"Eier sammeln nur mit Bewilligung der BVB zum Ausbrüten (§ 52 Abs. 3)."},
{k:'A. Allgemeiner Teil',pg:25,f:"Ist der Inhaber einer Jagdgastkarte Jagdausübungsberechtigter?",b:"Nein, eine Jagdgastkarte ersetzt lediglich die Jagdkarte.",h:"Jagdausübungsberechtigte: § 2; Jagdgastkarte: § 40."},
{k:'A. Allgemeiner Teil',pg:29,f:"Tier und Kalb mit einem Schuss erlegt. Nicht sachgemäß? Nicht weidgerecht? Dumm und verantwortungslos?",b:"Weder sachgemäß und schon gar nicht weidgerecht, weil zu viel vom Zufall abhängt. Ein klarer Fall für das Disziplinargericht.",h:"§ 3 Abs. 1; Standespflichten Satzung § 46."},
{k:'A. Allgemeiner Teil',pg:30,f:"Muss der Fuchs gehegt werden?",b:"Nach herrschender Ansicht der Wildbiologen ist keine Notwendigkeit dafür vorhanden.",h:"Hege: § 3 Abs. 3; Fuchs ist Raubwild (§ 4) und ganzjährig bejagbar."},
{k:'A. Allgemeiner Teil',pg:35,f:"Sie haben bei einer Treibjagd einen Tannenhäher erlegt. Wer ist für das weitere Vorgehen zuständig: der Jagdleiter, der sich über Ihr Weidmannsheil freut, oder das Jägerehrengericht?",b:"Der Tannenhäher gehört nicht zu Wild im Sinne des § 4, er ist nach der Tierartenschutzverordnung geschützt. Sie hätten nicht schießen dürfen. Zuständig für alles Weitere ist somit der Disziplinarsenat der Kärntner Jägerschaft (volkstümlich „Jägerehrengericht“ genannt).",h:"Dazu Verwaltungsstrafe nach dem Naturschutzrecht (K-NSG § 19)."},
{k:'A. Allgemeiner Teil',pg:42,f:"Ist die Möglichkeit der Eigenjagdbildung über die Landesgrenze auch anzuwenden, wenn man die fehlenden 100 Hektar in Niederösterreich hat?",b:"Das wird wohl an den tatsächlichen Gegebenheiten (kein Zusammenhang) scheitern.",h:"§ 5 Abs. 2 nennt nur Salzburg, Steiermark und Tirol."},
{k:'A. Allgemeiner Teil',pg:44,f:"Gibt es eine Landesgrenzen überschreitende Gemeindejagd? Nennen Sie ein Beispiel!",b:"Nachdem es vom politischen Aufbau her keine Gemeinde gibt, die über die Landesgrenzen geht, kann es auch keine diesbezügliche Gemeindejagd geben.",h:"§ 6 Abs. 1."},
{k:'A. Allgemeiner Teil',pg:49,f:"Aus dem Schaugehege ist ein Wolf ausgebrochen. Kann ich ihn nach Ablauf der 42-Tage-Frist erlegen?",b:"Der Wolf fällt zwar unter Wild, ist aber nach § 51 Abs. 1 ganzjährig geschont. Das hat nichts damit zu tun, dass er sich zuerst allenfalls in einem Gehege befunden hat.",h:"Meldepflicht des Gehegebetreibers: § 8 Abs. 8."},
{k:'A. Allgemeiner Teil',pg:55,f:"Jagdgebiete werden durch die BH festgestellt. Ist da eine Ausnahme denkbar?",b:"Stichwort „Sonderjagdgebiet“ (siehe Buch S. 44).",h:"§ 6 Abs. 3: Feststellung eines kleinen Gemeindejagdgebietes (ab 115 ha) durch die Landesregierung."},
{k:'A. Allgemeiner Teil',pg:57,f:"Von 120 Hektar werden 20 Hektar zwar nicht verkauft, jedoch verschenkt. Gilt dann die Regelung des § 14 auch?",b:"Ob verkauft oder verschenkt, ist unwesentlich. Wichtig ist das Ergebnis, nämlich dass der bisherige Grundeigentümer nicht mehr über eine Fläche von zumindest 115 Hektar verfügt.",h:"§ 14 Abs. 1, § 5 Abs. 1."},
{k:'A. Allgemeiner Teil',pg:64,f:"Kann der Jagdausübungsberechtigte über Ersuchen des Landwirts ohne weiteres ein Abzugeisen im Hühnerstall aufstellen oder bedarf er hiezu einer Bewilligung?",b:"Ein Abzugeisen kann vom Grundeigentümer wegen des an jedermann gerichteten Verbotes nach § 68 Abs. 1 Z 4 und weil sich die Ausnahmegenehmigungen nach § 68 Abs. 3 nur auf Inhaber von Jagdkarten im Zuge der Jagdausübung beziehen, nicht aufgestellt werden. Zu den vom Grundeigentümer „beauftragten Personen“ (§ 15 Abs. 6) kann auch der Jagdausübungsberechtigte zählen; die Beauftragung kann sich aber nur auf das Recht beziehen, das auch der Landwirt ausüben kann: also eine Falle, aber kein Abzugeisen. Mit dem Gewehr kann sie nicht ohne Weiteres vorgehen, weil das Recht des Landwirts ad personam und nicht übertragbar ist; sie müsste eine Ausnahmegenehmigung bei der BH erwirken, um auf der Fläche, auf der die Jagd ruht, jagdlich tätig sein zu können.",h:""},
{k:'B. Die Verpachtung',pg:68,f:"Ist es möglich, eine Jagd nur für drei Jahre zu pachten? Beispiel?",b:"Im Falle der vorzeitigen Auflösung des Pachtvertrages drei volle Jahre vor dem Ende der Pachtzeit der Gemeindejagd; der nächste Termin wäre also das Jahr 2027.",h:"§ 17 Abs. 1: Verpachtung auf den Rest der Pachtdauer, wenn noch mindestens zwölf Monate."},
{k:'B. Die Verpachtung',pg:72,f:"Sie wohnen in Klagenfurt, wollen jedoch im oberen Mölltal eine Eigenjagd pachten. Haben Sie im Hinblick auf die räumliche Entfernung die Pächtereigenschaft?",b:"Ja. Die Bestimmung hinsichtlich des Wohnsitzes findet sich als zusätzliche Pächtereigenschaft lediglich bei der Gemeindejagd.",h:"§ 18 Abs. 1a."},
{k:'B. Die Verpachtung',pg:75,f:"Kann ein Ferlacher Obmann einer Jagdgesellschaft sein, die eine Gemeindejagd im Lesachtal gepachtet hat?",b:"Ja, denn der Obmann braucht nicht die Pächtereigenschaft. Nur wenn er gleichzeitig Jagdleiter oder Bevollmächtigter wäre, kann er es wegen der räumlichen Entfernung seines Wohnsitzes nicht sein.",h:"§ 18 Abs. 4."},
{k:'B. Die Verpachtung',pg:77,f:"In Ihrem Revier werden überwiegend Enten erlegt. Gilt die 50- oder die 100-Hektar-Beschränkung?",b:"„Überwiegend Enten“ deutet darauf hin, dass es sich nur um ein Niederwildrevier handeln kann. Also: 50 Hektar.",h:"§ 19 Abs. 1."},
{k:'B. Die Verpachtung',pg:78,f:"Von einem 150-Hektar-Revier werden 50 Hektar verkauft. Berechnen Sie die Pachtzinsminderung!",b:"Bei restlichen einhundert Hektar gibt es keine Eigenjagd mehr und somit auch keinen Pachtzins.",h:"Mindestausmaß 115 ha (§ 5 Abs. 1); sonst § 21."},
{k:'B. Die Verpachtung',pg:86,f:"Sie wollen als Eigenjagdbesitzer Ihren Jagdpächter loswerden. Sie stellen einen Treberhaufen im Revier fest, auf diesem befindet sich Schweiß. Wie gehen Sie zweckmäßigerweise vor?",b:"Anzeige bei der Kärntner Jägerschaft; wahrscheinlich wird es zu einem Jagdkartenentzug mit dadurch bedingtem Verlust der Pächtereigenschaft kommen, worauf die BH den Pachtvertrag von Amts wegen aufzulösen hat.",h:"§ 39, § 18 Abs. 1 lit. a, § 23 Abs. 1 Z 2 lit. a und b."},
{k:'C. Die Verwertung der Gemeindejagd',pg:88,f:"Gelten die Vorschriften über die Verwertung der Gemeindejagd (Versteigerung, Pachtbedingungen) auch für Eigenjagden?",b:"Nein – jetzt hätten Sie wirklich nicht nachschauen müssen!",h:"4. Abschnitt §§ 24–35 gilt nur für Gemeindejagden; Eigenjagden werden frei verpachtet."},
{k:'C. Die Verwertung der Gemeindejagd',pg:95,f:"Welches Rechtsmittel gibt es gegen einen Bescheid der BH in jagdrechtlichen Angelegenheiten?",b:"Zuständiges Rechtsmittelgericht gegen Bescheide der BH ist – wie in allen jagdrechtlichen Fällen – das Landesverwaltungsgericht, das mit Beschwerde angerufen wird. Der Oberste Gerichtshof ist nur die (oberste) Rechtsmittelinstanz der Gerichte.",h:""},
{k:'C. Die Verwertung der Gemeindejagd',pg:97,f:"Die BH hat entschieden, dass von Ihrer Kaution 1.000 Euro der Gemeinde zukommen, weil Sie nicht den gesamten Pachtzins gezahlt haben. Sie argumentieren, der Gemeindesekretär hätte Ihnen eine Pachtzinsminderung zugesagt. An wen wenden Sie sich jetzt?",b:"Die BH hat mit Bescheid entschieden, der Instanzenzug geht wie immer zum Landesverwaltungsgericht. Erfolg werden Sie keinen haben, weil der Gemeindesekretär nicht befugt ist, rechtsverbindliche Erklärungen abzugeben.",h:"Kaution § 32."},
{k:'C. Die Verwertung der Gemeindejagd',pg:101,f:"Erklären Sie den Begriff der qualifizierten Zweidrittelmehrheit in eigenen Worten!",b:"Doppelte Zweidrittelmehrheit: Zwei Drittel der Grundeigentümer müssen einverstanden sein, diese müssen aber auch zwei Drittel der jagdlich nutzbaren Grundflächen (sowie Grundflächen, auf denen die Jagd nicht ruht) repräsentieren.",h:"§ 24 (Art der Verwertung der Gemeindejagd)."},
{k:'C. Die Verwertung der Gemeindejagd',pg:103,f:"Was geschieht, wenn sich eine Eigenjagd nicht verpachten lässt? Wird dann auch ein Jagdverwalter bestellt?",b:"Nein. Sie muss ja nicht verpachtet werden.",h:"Jagdverwalter nur für Gemeindejagden (§ 2 Abs. 5, § 34) oder wenn kein Bevollmächtigter namhaft gemacht wird (§ 2 Abs. 3)."},
{k:'D. Die Jagddokumente',pg:108,f:"Sie haben beim Reinigen Ihrer Flinte in Ihrer Wohnung den an der Wand hängenden Auerhahn ein zweites Mal erlegt. Zahlt die Jagdhaftpflichtversicherung die neuerlichen Präparatorkosten?",b:"Nein, der Schaden ist in Ihrem eigenen Vermögen eingetreten. Etwas anderes wäre, wenn sich der Vorfall in einer fremden Wohnung mit fremdem Auerhahn ereignet hätte.",h:"Umfang der Jagdhaftpflicht: § 40 Abs. 7."},
{k:'D. Die Jagddokumente',pg:112,f:"Darf ein 17-Jähriger an einer Treibjagd als Schütze teilnehmen, wenn er sich in Begleitung des Erziehungsberechtigten befindet?",b:"Darf er nicht. Die Möglichkeit, in Begleitung zu jagen, bezieht sich nur auf Jagden, die nicht Treib- oder Riegeljagden sind.",h:"§ 36 Abs. 3."},
{k:'D. Die Jagddokumente',pg:116,f:"Sie haben bereits zweimal (noch nicht dreimal) die Steirische Jagdkarte gelöst. Unter welchen Voraussetzungen erhalten Sie die Kärntner Jagdkarte?",b:"Das mehrmalige Lösen einer fremden Jagdkarte hat nichts damit zu tun. Es genügt die „fremde“ Prüfung und sodann die Anerkennung ihrer Gleichwertigkeit, wovon bei der Prüfung in der Steiermark auszugehen ist.",h:"§ 37 Abs. 7 lit. c (Anerkennung durch den LJM, schriftliche Bestätigung der Kenntnisse des Kärntner Jagd- und Naturschutzrechts)."},
{k:'D. Die Jagddokumente',pg:120,f:"Der BJM verweigert Ihnen die Ausstellung der Jagdkarte, weil Sie blaue Augen haben. Wie gehen Sie vor: a) beschimpfen, b) beim Landesjägermeister beschweren, c) Rechtsmittel?",b:"a) und b) sind möglicherweise naheliegend. Zielführend ist c): Der BJM muss seine Entscheidung in Bescheidform erlassen und begründen. Sie haben das Recht, dagegen Beschwerde an das Landesverwaltungsgericht zu erheben. Dieses wird den Bescheid sofort aufheben.",h:"§ 38 Abs. 3."},
{k:'D. Die Jagddokumente',pg:126,f:"Mein Freund hat gerade in Niederösterreich die Jagdprüfung bestanden, dort aber noch keine Jagdkarte gelöst. Darf ich ihm eine Jagdgastkarte ausfolgen?",b:"Grundbedingung für die Ausfolgung der Jagdgastkarte ist nach dem klaren Gesetzestext eine in einem anderen Bundesland mindestens für die Dauer eines Jahres gültige Jagdkarte. Der Freund wird zunächst seine niederösterreichische Jagdkarte lösen müssen, dann steht einer Jagdgastkarte – auch noch im selben Jahr – nichts entgegen.",h:"§ 40 Abs. 1 lit. a."},
{k:'D. Die Jagddokumente',pg:130,f:"Braucht der Obmann einer Jagdgesellschaft einen Jagderlaubnisschein?",b:"Der Obmann ist nicht der Jagdausübungsberechtigte, das ist die Jagdgesellschaft. Also braucht er einen Jagderlaubnisschein.",h:"§ 41 Abs. 1 und 2 (für Mitglieder einer Jagdgesellschaft keine Genehmigung des BJM nötig)."},
{k:'E. Jagd- und Wildschutz',pg:140,f:"4.000 Hektar Jagdgebiet: Wie viele Berufsjäger sind zu bestellen?",b:"Die 2.000 bzw. 3.000 Hektar sind die Untergrenze, eine Obergrenze gibt es nicht. Es genügt also ein Berufsjäger.",h:"§ 44 Abs. 6; die BVB kann weitere Vorschläge anordnen (§ 44 Abs. 9)."},
{k:'E. Jagd- und Wildschutz',pg:143,f:"Kann ein 18-Jähriger zum Jagdschutzorgan bestellt werden?",b:"Das geht sich allein mit den Zulassungserfordernissen zur Jagdaufseherprüfung (Verwendung im Jagddienst durch drei Jahre) nicht aus.",h:"§ 46 lit. d; K-BJPG § 14 Abs. 2 (36 Monate jagdliche Tätigkeit, Jagdkarte frühestens ab 16)."},
{k:'E. Jagd- und Wildschutz',pg:150,f:"Sie haben Ihren Dienstausweis daheim vergessen. Dürfen Sie einschreiten?",b:"Sie sind in diesem Fall nicht als Amtsperson erkennbar. Falls Sie doch einschreiten wollen, dann in einem Ausmaß, dass es nicht zur Konfrontation – und zum Verlangen, den Dienstausweis vorzuweisen – kommen kann.",h:"§ 45 Abs. 5; Beamtenschutz nur mit sichtbarem Dienstabzeichen (§ 47)."},
{k:'E. Jagd- und Wildschutz',pg:156,f:"Der Jagdchef hat einen II-a-Gams erlegt, der nicht frei war. Er weist den Jagdaufseher an, ihn verschwinden zu lassen; das Wildbret könne er behalten. Wie nennt man dieses Verhalten strafrechtlich?",b:"Verleitung zum Missbrauch der Amtsgewalt.",h:"Das Jagdschutzorgan ist im Dienst Amtsperson (§ 47, § 74 Z 4 StGB); Abschussplan § 57a Abs. 1."},
{k:'E. Jagd- und Wildschutz',pg:159,f:"Ein mir völlig Unbekannter hat in meinem Revier einen Bock erlegt. Kann ich ihn nicht vielleicht doch festnehmen?",b:"Nein, die Befugnis zur Festnahme ist ohne Einschränkung weggefallen.",h:"§ 48: nur Anhalten, Identität feststellen, Befragen, Durchsuchen, Sachen abnehmen, Anzeige."},
{k:'E. Jagd- und Wildschutz',pg:162,f:"Der Wilderer erlegt einen II-er-Hirsch. Kann mit einer Ermahnung vorgegangen werden, weil es „nur“ ein II-er ist?",b:"Selbstverständlich nicht. Ein Eingriff in fremdes Jagdrecht ist niemals nur „gering verschuldet“.",h:"§ 48 Abs. 6; Wilderei ist gerichtlich strafbar (§ 137 ff StGB)."},
{k:'E. Jagd- und Wildschutz',pg:167,f:"Eine Katze befindet sich genau am Waldrand. Darf sie erlegt werden?",b:"Nein. Sie ist ja nicht „im Wald“.",h:"§ 49 Abs. 1 lit. b: Katzen, die in einem Wald umherstreifen, in dem Niederwild vorkommt."},
{k:'E. Jagd- und Wildschutz',pg:169,f:"Muss die BH von der Erlegung eines Hundes verständigt werden?",b:"Nein, nur der Eigentümer und der Hegeringleiter.",h:"§ 49 Abs. 4."},
{k:'E. Jagd- und Wildschutz',pg:174,f:"Welche Personen haben die Wildfütterung zu überwachen? (Im Buch war ein Fehler in der Aufzählung versteckt.)",b:"Es gibt keinen Jagdaufseher-Stellvertreter! Richtig: das Jagdschutzorgan, der Hegeringleiter und sein Stellvertreter sowie der Bezirksjägermeister und sein Stellvertreter – als Hilfsorgane der BVB.",h:"§ 50a Abs. 1."},
{k:'F. Schonvorschriften',pg:185,f:"Gilt § 52 Abs. 4 (Erlegen kranken oder schwer verletzten Wildes) auch für den Bären?",b:"Ja. Auf geschonte Tiere ist ebenso wie auf Schonzeiten keine Rücksicht zu nehmen.",h:"Anzeige an BVB und BJM, Vorlage in der Decke beim HRL."},
{k:'F. Schonvorschriften',pg:188,f:"Ein Mauswiesel ist mir gegen das Auto gerannt. Darf ich das Präparat daheim aufbewahren?",b:"Wenn der Vorfall im eigenen Revier war. Sonst wäre es ein Eingriff in fremdes Jagdrecht.",h:"Fallwild gehört zum Jagdrecht (§ 1a Abs. 1); kleines Wiesel ganzjährig geschont (§ 51 Abs. 1)."},
{k:'G. Die Jagdbetriebsführung',pg:192,f:"Unterliegt der Sikahirsch der Abschussplanung?",b:"Der Sikahirsch gehört nicht zu Wild im Sinne des § 4! Er kann also nicht der Abschussplanung unterliegen.",h:"§ 55."},
{k:'G. Die Jagdbetriebsführung',pg:200,f:"Am Kreuzbergl bei Klagenfurt kommt im Mai ein I-er-Hirsch. Darf er erlegt werden?",b:"Nein. Zwar hochwildfreie Zone, jedoch keine Schusszeit!",h:"Hirsche Klasse I–III erst ab 1. August; Freizonen § 57a Abs. 3 nur unter Beachtung der Schonzeiten."},
{k:'G. Die Jagdbetriebsführung',pg:206,f:"Kann der Wilderer wegen Übertretung des Abschussplanes bestraft werden?",b:"Nein, er ist nicht Normadressat. Außerdem wird seine Bestrafung so hoch sein, dass das nicht ins Gewicht fallen würde.",h:"Normadressat des Abschussplans ist der Jagdausübungsberechtigte (§ 57a)."},
{k:'G. Die Jagdbetriebsführung',pg:209,f:"Gibt es einen Turnushahn?",b:"Nein. § 57 Abs. 8 spricht nur von Schalenwild.",h:"Turnusabschuss = Freigabe eines Stücks in mehreren Abschussplänen."},
{k:'G. Die Jagdbetriebsführung',pg:211,f:"Sie haben einen I-er-Hirsch frei, erlegen aber einen lediglich 9-jährigen Hirsch (II-er), der nicht frei war. Haben Sie gegen § 57a Abs. 1 verstoßen?",b:"Prinzipiell schon. Es wird Ihnen jedoch niemand einen Vorwurf machen, weil der Unterschied beim Ansprechen nicht immer auffallen wird.",h:""},
{k:'G. Die Jagdbetriebsführung',pg:217,f:"Wurde die Fischotterverordnung vom Vorstand der Kärntner Jägerschaft oder von der Landesregierung erlassen?",b:"§ 51 Abs. 4a (Ausnahme von den Schonvorschriften) weist darauf hin, dass es sich um eine Verordnung der Landesregierung handeln muss.",h:"Aktuell LGBl Nr 94/2024."},
{k:'G. Die Jagdbetriebsführung',pg:226,f:"Kann man dem Rotwild Äpfel in Form einer Streckenfütterung vorlegen? Wer müsste zustimmen?",b:"Allein die Frage grenzt schon an strafrechtliches Verhalten! Der ganze Abschnitt über die Streckenfütterung bezieht sich nur auf Raufutter.",h:"§ 61a Abs. 1 und 4."},
{k:'G. Die Jagdbetriebsführung',pg:229,f:"Kann ein Fütterungsauftrag nach § 61a Abs. 2 auch für das Rehwild erteilt werden?",b:"Nein. Diese Gesetzesbestimmung bezieht sich ausschließlich auf Rotwild.",h:"Rehwildfütterung: § 61b und Verordnung des Landesvorstandes über artgerechtes Ergänzungsfutter (§ 61 Abs. 2)."},
{k:'G. Die Jagdbetriebsführung',pg:232,f:"Sie wollen den Rehen Obsttrester vorlegen. Muss die Fütterung rotwilddicht eingezäunt sein, weil in Ihrem Revier Hochwild vorkommt?",b:"Falls im Revier Hochwild vorkommt, ist die Vorlage von Obsttrester überhaupt nicht möglich.",h:"§ 61b."},
{k:'G. Die Jagdbetriebsführung',pg:234,f:"Sie wollen Sauen mittels Luderplatz ankirren; der Hirsch interessiert sich dafür nicht. Dürfen Sie das im Hochwildgebiet?",b:"Der Gesetzestext ist eindeutig: Schwarzwild darf nur in Gebieten, in denen Hochwild nicht vorkommt, angekirrt werden – egal, wie man ankirrt.",h:"§ 61c Lockfütterungen."},
{k:'G. Die Jagdbetriebsführung',pg:235,f:"Jemand deponiert das Saftfutter nach dem 1. November neben der Fütterung. Darf er das?",b:"Nein, er muss die vorgesehene Fütterungsanlage dazu verwenden.",h:"§ 61a Abs. 4, § 63 Abs. 5."},
{k:'G. Die Jagdbetriebsführung',pg:236,f:"Die Steinwildhegegemeinschaft erhält Steinböcke zum Abschuss frei. Geht das? Steinwild ist doch ganzjährig geschont.",b:"Die Freigabe erfolgt durch Bescheid der Landesregierung gemäß § 52 Abs. 2.",h:""},
{k:'G. Die Jagdbetriebsführung',pg:242,f:"Brauche ich für eine Ansitzleiter die Zustimmung des Grundeigentümers?",b:"Nein. Eine Ansitzleiter belastet Grund und Boden nicht.",h:"§ 63 Abs. 1 nennt Hochstände und Hochsitze; § 68 Abs. 1 Z 25 nimmt vorübergehend aufgestellte Ansitzleitern aus."},
{k:'G. Die Jagdbetriebsführung',pg:248,f:"Ein beschossener Bock flüchtet über die Grenze, keine Wildfolgevereinbarung. Ein im Nachbarrevier jagender Jagdgast bietet Hilfe bei Bergung und Rücktransport an. Können Sie das annehmen?",b:"Nicht ohne Rücksprache mit dem Jagdausübungsberechtigten des Nachbarreviers. Seine Zustimmung kann durch niemanden ersetzt werden.",h:"§ 65 Abs. 1 und 2."},
{k:'G. Die Jagdbetriebsführung',pg:252,f:"Sie sind Jagdausübungsberechtigter auf 400 Hektar und Halter eines Deutschen Pinschers, der sich auf Schweiß bewährt hat. Das bedeutet?",b:"Der Deutsche Pinscher ist von der Rasse her kein Jagdhund. Wenn Sie sonst keinen weiteren Hund führen wollen, genügt es trotzdem, auf die Bereichshundestationen zu verweisen.",h:"§ 67 Abs. 1: brauchbarer Jagdhund oder Nachweis, dass einer jederzeit zur Verfügung steht."},
{k:'G. Die Jagdbetriebsführung',pg:254,f:"Fällt der Biber unter die Bleischrotmunitionsverordnung?",b:"Diese Verordnung betrifft nur die Wasservögel. Aber die Frage erübrigt sich, weil der Biber ohnehin ganzjährig geschont ist.",h:"§ 51 Abs. 1."},
{k:'G. Die Jagdbetriebsführung',pg:257,f:"Darf ich ein Murmeltier mit Schrot beschießen, wenn es sich verlässlich unter zehn Meter von mir befindet?",b:"Nein, das Verbot ist ein absolutes. Die eigenen (und nicht immer richtigen) Entfernungsschätzungen sollen dadurch vermieden werden.",h:"§ 68 Abs. 1 Z 2."},
{k:'G. Die Jagdbetriebsführung',pg:260,f:"Eine Lebendfangvorrichtung zum Sauenfang: Müssen Sie darin frisches Wasser bereithalten?",b:"Die Frage erübrigt sich, weil die Fanggeräte in der Durchführungsverordnung erschöpfend aufgezählt sind und diese dort nicht aufscheint.",h:"Ausnahme seit der Novelle: § 68 Abs. 1b (Lebendfang von Schwarzwild zur Seuchenverhinderung mit Warnzeichen)."},
{k:'G. Die Jagdbetriebsführung',pg:270,f:"Treibjagd bei Mondschein verboten – Treibjagd ohne Mondschein also erlaubt? Gegenschluss?",b:"Die Frage ist unzulässig, noch niemand ist auf die Idee gekommen, bei absoluter Finsternis ein Treiben zu veranstalten. Der Gegenschluss wäre trotzdem nicht korrekt, weil ohne Beleuchtung alles noch unsicherer wird.",h:"§ 68 Abs. 1 Z 12 und Z 16 (Nachtjagdverbot)."},
{k:'G. Die Jagdbetriebsführung',pg:274,f:"Sie werden als Jagdgast auf einer Kanzel mit sichtbar über drei Quadratmeter Bodenfläche abgelegt. Wie verhalten Sie sich?",b:"§ 68 Abs. 1 Z 24 verbietet nicht nur die Errichtung, sondern auch die Verwendung. Theoretisch dürfen Sie das Ungetüm nicht benützen.",h:"Max. 2 m², Längsseite 1,60 m."},
{k:'G. Die Jagdbetriebsführung',pg:282,f:"Sie haben einen Jägernotweg über eine Forststraße. Dürfen Sie diesen auch mit dem PKW benützen?",b:"Der Jägernotweg kann sich nur auf einen Fußweg beziehen. Wenn Sie mit dem Auto fahren wollen, benötigen Sie zusätzlich die Zustimmung des Grundeigentümers bzw. Wegehalters.",h:"§ 64."},
{k:'G. Die Jagdbetriebsführung',pg:283,f:"Sie verfügen über einen Jägernotweg. Brauchen Sie zusätzlich die Bewilligung für den Schalenwildtransport?",b:"Nicht, wenn das Wild am Notweg getragen wird. Dieser dient schließlich dem Jagdbetrieb und schließt somit den Wildtransport mit ein.",h:"§ 69 Abs. 1 zweiter Satz."},
{k:'G. Die Jagdbetriebsführung',pg:288,f:"Ein Jagdgast fällt vom Hochsitz. Ist eine Haftung gegeben?",b:"Der Jagdausübungsberechtigte haftet, wenn der Hochsitz technisch nicht richtig gebaut und/oder gewartet wird. Den Jagdgast kann Mitverschulden treffen, wenn der Sitz so desolat ist, dass man den Mangel vorweg hätte erkennen können.",h:"Jagdhaftpflicht § 40 Abs. 7 (Jagdeinrichtungen)."},
{k:'G. Die Jagdbetriebsführung',pg:292,f:"Sie wollen in der Hirschbrunft einen Teil des Jagdgebietes sperren, damit die Brunft ungestört verläuft. Geht das?",b:"Nein. Eine ungestörte Hirschbrunft ist in keinem der Fälle des § 70 vorgesehen.",h:"Sperren nur für Abschüsse aus außerordentlichen Gründen, Bestandsgefährdung/Winterruhe, Wildschutzgebiete."},
{k:'H. Jagd- und Wildschaden',pg:302,f:"Sie sind Eigentümer einer nicht verpachteten Eigenjagd mit Wochenendhaus und Rosengarten; die Rehe haben sich bedient. Wen können Sie haftbar machen?",b:"Niemanden. Es haftet (wenn überhaupt – Ruhen der Jagd) der Jagdausübungsberechtigte, und der sind Sie selbst.",h:"§ 74."},
{k:'H. Jagd- und Wildschaden',pg:309,f:"Was kann passieren, wenn Sie Ihre Hunde zur Abhaltung von Wild von Kulturen frei laufen lassen?",b:"Wer das Wild von Kulturen durch freilaufende Hunde oder sonst ungeeignete Maßnahmen abhält, begeht eine Verwaltungsübertretung nach § 98 Abs. 1 Z 25.",h:"§ 71 Abs. 1."},
{k:'H. Jagd- und Wildschaden',pg:315,f:"Bescheid: In einer Freihaltezone in Ihrem Revier sind alle Füchse zu erlegen. Sind dick gehende Fähen ausgenommen?",b:"Die Frage stellt sich nicht, weil sich die Freihaltezone nur auf Schalenwild beziehen kann.",h:"§ 72a."},
{k:'H. Jagd- und Wildschaden',pg:317,f:"Sie wollen Wildkaninchen aussetzen; Biotop passt, Grundeigentümer und Nachbarn sind einverstanden. Müssen Sie trotzdem um eine Bewilligung ansuchen?",b:"Sie brauchen es gar nicht probieren. Das Aussetzen von Wildkaninchen ist unter allen Umständen verboten, egal, wer zustimmt.",h:"§ 73."},
{k:'H. Jagd- und Wildschaden',pg:322,f:"Sie sind mit der Entscheidung der Schlichtungsstelle für Wildschäden nicht zufrieden. Können Sie sich an den Obersten Gerichtshof wenden?",b:"Nein. Obwohl es sich um ein Schadenersatzbegehren handelt, bei dem normalerweise die Zivilgerichte und in letzter Instanz der OGH zuständig wären, hat das K-JG ausdrücklich die Zuständigkeit des Landesverwaltungsgerichtes in zweiter Instanz bestimmt.",h:"§§ 77, 78."},
{k:'I. Beiräte, Jagdkataster, Strafbestimmungen',pg:334,f:"Gibt es bei der Erstellung des Abschussplanes eine Beratung durch den Bezirksjagdbeirat?",b:"Ja, in § 57 Abs. 2 ist ausdrücklich vorgesehen, dass er vom BJM anzuhören ist.",h:""},
{k:'I. Beiräte, Jagdkataster, Strafbestimmungen',pg:335,f:"Jemand zahlt nur den Jagdkartenbeitrag, weil die Kärntner Jägerschaft ohnehin reich genug sei. Kann er jagen gehen?",b:"Nein, es ist der gesamte vorgeschriebene Betrag zu bezahlen. Die Jagdkarte ist sonst nicht gültig.",h:"§ 38a Abs. 1: Jagdkartenbeitrag, Mitgliedsbeitrag und Haftpflichtprämie."},
{k:'J. Die Kärntner Jägerschaft',pg:337,f:"Nennen Sie zumindest eine Aufgabe, die das K-JG dem Hegeringleiter ausdrücklich übertragen hat!",b:"Etwa die Mitwirkung bei der Abschussplanerstellung (Stellungnahme bis 15. März an den BJM).",h:"Weitere: Vorlage kranken Wildes (§ 52 Abs. 4), Trophäenprüfung (§ 60 Abs. 2), Abschussmeldung bei Systemausfall (§ 58 Abs. 4), Fütterungsüberwachung (§ 50a)."},
{k:'J. Die Kärntner Jägerschaft',pg:339,f:"Nennen Sie zumindest eine Aufgabe, die das Jagdgesetz direkt dem Bezirksjägermeister übertragen hat!",b:"Beispiele: Ausstellung, Verweigerung und Entziehung der Jagdkarte (§§ 37–39), Festsetzung des Abschussplans mit Bescheid (§ 57), Genehmigung von Jagderlaubnisscheinen über eine Woche (§ 41), Untersagung von Fütterungsanlagen (§ 63 Abs. 5), Abschussbeschränkung (§ 53).",h:""},
{k:'J. Die Kärntner Jägerschaft',pg:340,f:"In der Aufstellung der Aufgaben des Landesjägertages im Buch ist ein Fehler eingearbeitet. Welcher?",b:"Der BJM wird natürlich nicht vom Landesjägertag gewählt, sondern vom Bezirksjägertag.",h:"Satzung §§ 21, 26."},
{k:'J. Die Kärntner Jägerschaft',pg:341,f:"Nennen Sie eine Aufgabe, die dem Landesvorstand der Kärntner Jägerschaft ausdrücklich durch das K-JG übertragen wurde!",b:"Die diversen Verordnungsermächtigungen: etwa Ergänzungsfutter für Rehwild, Richtlinien für Fütterungsanlagen, Mindestenergiewerte, Gestaltung der Formulare, Abschussrichtlinien („Der Landesvorstand der Kärntner Jägerschaft hat unter Bedachtnahme auf die fachlichen Erkenntnisse durch Verordnung festzulegen …“).",h:"§ 61 Abs. 2 und 3, § 68 Abs. 5, § 42, § 56, § 57 Abs. 11, § 60 Abs. 1."},
{k:'J. Die Kärntner Jägerschaft',pg:343,f:"Nennen Sie zumindest eine Aufgabe, die dem Landesjägermeister durch das K-JG direkt übertragen wurde!",b:"Stichwort: Abzugeisen! (Bewilligung nach § 68 Abs. 3.)",h:"Weitere: Zulassung zur Jagdaufseherprüfung (K-BJPG § 6), Anerkennung fremder Jagdprüfungen (§ 37 Abs. 7), Bekanntgabe der Jagdschutzorgane an die Polizei (§ 69 Abs. 3)."},
{k:'J. Die Kärntner Jägerschaft',pg:346,f:"Ein Jäger baut außerhalb des jagdlichen Geschehens betrunken einen Verkehrsunfall. Wird der Disziplinarrat eine Strafe verhängen?",b:"Es wird zu keiner Anklage kommen, weil er zwar gegen die StVO, aber nicht gegen die Standespflichten verstoßen hat.",h:"Satzung § 46 Abs. 2; aber: Verlässlichkeit für die Jagdkarte (§ 37 Abs. 4) kann bei Verbrechen betroffen sein."}
];
const SECMAP={'A':1,'B':3,'C':4,'D':5,'E':6,'F':7,'G':8,'H':9,'I':11,'J':10};
BOOK.forEach(c=>{c.s=SECMAP[c.k[0]]||0;c.src='Buch S. '+c.pg+' · '+c.k;if(c.h)c.b+=' — Hinweis: '+c.h;CARDS.push(c);});

</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('law-data').textContent);
const DOCS=[
 {key:'kjg',title:'Kärntner Jagdgesetz 2000',short:'K-JG',note:'RIS, Fassung vom 18.10.2026',sections:DATA.kjg.filter(s=>s.nr>=1&&s.nr<=13)},
 {key:'knsg',title:'Kärntner Naturschutzgesetz 2002',short:'K-NSG',note:'RIS, Fassung vom 18.10.2026 – jagdrelevante Teile: §§ 5, 6, 8, 17–24, 28',sections:DATA.knsg.filter(s=>s.paras.length&&!/Übergang|Kriterien|Tätigkeiten|Sanierung|LGBl/.test(s.title)).map((s,i)=>Object.assign(s,{nr:i+1,title:s.title.replace(/^[IVX]+a?\. Abschnitt \| /,'')||'Allgemeine Bestimmungen'}))},
 {key:'satzung',title:'Satzung der Kärntner Jägerschaft',short:'Satzung',note:'Neufassung 2002, Stand 2007 (Jägerschaft-Website)',sections:DATA.satzung}
];
const DOC=Object.fromEntries(DOCS.map(d=>[d.key,d]));
DOCS.forEach(d=>{d.paras=[];d.sections.forEach(s=>s.paras.forEach(p=>{p.doc=d.key;p.sec=s.nr;p.secTitle=s.title;d.paras.push(p);}));d.byId=Object.fromEntries(d.paras.map(p=>[p.id,p]));});
const SECTIONS = DOC.kjg.sections, ALLP = DOC.kjg.paras, byId = DOC.kjg.byId;
const lkey=(doc,id)=>doc==='kjg'?id:doc+':'+id;

// ---------- Speicher ----------
const KEY='kjg-trainer-v1';
let S = {learned:{}, cards:{}, qstats:{}, history:[], view:'start', lastPara:null, me:'', friend:null, book:{}, lastChap:null};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const today=()=>Math.floor(Date.now()/86400000);

// ---------- Fragen-Pool ----------
// Kuratierte Fragen: Antwort steht an Index 0, wird beim Anzeigen gemischt.
CURATED.forEach((q,i)=>{q.id='c'+i;q.kind='kuratiert';});
function autoTitleQ(){ // Welcher § regelt "Titel"?
  const p=ALLP[Math.floor(Math.random()*ALLP.length)];
  const same=shuffle(ALLP.filter(x=>x.sec===p.sec && x.id!==p.id)).slice(0,3);
  if(same.length<3) return null;
  return {id:'t'+p.id,kind:'auto',s:p.sec,t:'Paragraphen',q:`Welcher Paragraph des K-JG trägt die Überschrift „${p.title}“?`,o:[p,...same].map(x=>'§ '+x.id),a:0,ref:'§ '+p.id,e:`§ ${p.id} „${p.title}“ steht im ${p.sec}. Abschnitt (${p.secTitle}).`};
}
function autoSecQ(){
  const p=ALLP[Math.floor(Math.random()*ALLP.length)];
  const others=shuffle(SECTIONS.filter(s=>s.nr!==p.sec)).slice(0,3);
  return {id:'s'+p.id,kind:'auto',s:p.sec,t:'Aufbau des Gesetzes',q:`In welchem Abschnitt des K-JG steht § ${p.id} „${p.title}“?`,o:[SECTIONS.find(s=>s.nr===p.sec),...others].map(s=>s.nr+'. Abschnitt – '+s.title),a:0,ref:'§ '+p.id,e:`§ ${p.id} gehört zum ${p.sec}. Abschnitt „${p.secTitle}“.`};
}
const NUMRE=/\b(\d{1,4}(?:[.,]\d+)?|ein(?:e|er|em)?|zwei|drei|vier|fünf|sechs|sieben|acht|zehn|zwölf|vierzehn|zwanzig|dreißig)\s(ha|m|km|Euro|Jahre|Jahren|Jahr|Tage|Tagen|Wochen|Woche|Monate|Monaten|Monat|v\. H\.|Stunde|Stunden|Patronen|m2|m²)\b/g;
const NUMPOOL={ha:['115','500','1000','1500','2000','3000','20','10'],m:['50','100','200','300','400','500','1,60'],km:['1','2','2,8','5'],Euro:['60','730','1450','2180','3630'],
 Jahre:['zwei','drei','fünf','zehn','zwölf'],Jahren:['zwei','drei','fünf','zehn','zwölf','acht'],Jahr:['ein','einem'],Tage:['drei','acht','vierzehn'],Tagen:['drei','acht','vierzehn','zwei'],
 Wochen:['zwei','vier','sechs','acht','drei'],Woche:['einer','eine'],Monate:['drei','sechs','zwölf'],Monaten:['drei','sechs','zwölf','zwei'],Monat:['einem','eines'],'v. H.':['5','10','20','25'],Stunde:['einer','eine','zwei'],Stunden:['zwei','drei','24'],Patronen:['zwei','drei','fünf'],m2:['2','3','4'],'m²':['2','3','4']};
let NUMBLOCKS=null;
function autoNumQ(){
  if(!NUMBLOCKS){ NUMBLOCKS=[]; ALLP.forEach(p=>p.body.forEach(b=>{ if(b.t.length<420 && NUMRE.test(b.t)) NUMBLOCKS.push({p,b}); NUMRE.lastIndex=0; })); }
  if(!NUMBLOCKS.length) return null;
  const {p,b}=NUMBLOCKS[Math.floor(Math.random()*NUMBLOCKS.length)];
  const ms=[...b.t.matchAll(NUMRE)]; const m=ms[Math.floor(Math.random()*ms.length)];
  const unit=m[2]; const val=m[1]; const pool=(NUMPOOL[unit]||[]).filter(x=>x!==val);
  if(pool.length<3) return null;
  const txt=b.t.slice(0,m.index)+'____ '+unit+b.t.slice(m.index+m[0].length);
  return {id:'n'+p.id+'-'+m.index,kind:'auto',s:p.sec,t:'Zahlen & Fristen',q:`Ergänze den Gesetzestext (§ ${p.id} ${b.sym}):`,ctx:txt,o:[val,...shuffle(pool).slice(0,3)].map(x=>x+' '+unit),a:0,ref:'§ '+p.id+' '+b.sym,e:b.t};
}
function buildQuiz(n,filter){
  const fsel=q=>filter.sec==='all'||(filter.sec==='jz'?q.t==='Jagdzeiten':filter.sec==='satzung'?q.t==='Satzung':filter.sec==='knsg'?q.t==='Naturschutzrecht':(String(q.s)===filter.sec&&!['Jagdzeiten','Satzung','Naturschutzrecht'].includes(q.t)));
  const cur=shuffle(CURATED.filter(fsel));
  if(['jz','satzung','knsg','0'].includes(filter.sec)) filter.auto=false;
  const out=[];
  const wantAuto = filter.auto;
  let i=0;
  while(out.length<n && i<n*4){
    i++;
    let q=null;
    const r=Math.random();
    if(!wantAuto || (r<0.6 && cur.length)) q=cur.pop();
    else if(r<0.75) q=autoTitleQ(); else if(r<0.85) q=autoSecQ(); else q=autoNumQ();
    if(!q) continue;
    if(filter.sec!=='all' && String(q.s)!==filter.sec && q.kind==='auto') continue;
    if(out.some(x=>x.id===q.id)) continue;
    out.push(q);
  }
  if(!out.length) return cur.slice(0,n);
  return out;
}
function present(q){ // mischt Optionen
  const idx=shuffle(q.o.map((_,i)=>i));
  return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)});
}

// ---------- Router ----------
const TABS=[['start','Start'],['gesetz','Texte'],['buch','Buch'],['karten','Karten'],['quiz','Quiz'],['pruefung','Prüfung']];
const ICONS={start:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',gesetz:'M4 3h12l4 4v14H4zM8 11h8M8 15h8',buch:'M12 6c-2-2-5-2-8-2v14c3 0 6 0 8 2 2-2 5-2 8-2V4c-3 0-6 0-8 2zm0 0v14',karten:'M3 7h14v12H3zM7 3h14v12',quiz:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 14v2m0-10a3 3 0 0 1 3 3c0 2-3 2-3 4',pruefung:'M5 3h14v18H5zM9 8h6M9 12h6M9 16h3'};
const V={};
function nav(view,arg){ S.view=view; save(); render(arg); }
function render(arg){
  const tabHtml=TABS.map(([k,l])=>`<button role="tab" aria-selected="${S.view===k}" data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="${ICONS[k]}"/></svg>${l}</button>`).join('');
  document.getElementById('tabs').innerHTML=tabHtml.replace(/<svg.*?<\/svg>/g,'');
  document.getElementById('btabs').innerHTML=tabHtml;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>nav(b.dataset.v));
  const view=document.getElementById('view'); view.innerHTML='';
  (V[S.view]||V.start)(view,arg);
  window.scrollTo(0,0);
}

// ---------- Fortschritt & Vergleich ----------
function summary(){
  const learned=ALLP.filter(p=>S.learned[p.id]).length;
  const boxes=CARDS.map((c,i)=>(S.cards['k'+i]||{box:0}).box); const safe=boxes.filter(b=>b>=3).length;
  const st=Object.values(S.qstats); const asked=st.reduce((a,s)=>a+s.n,0), right=st.reduce((a,s)=>a+s.ok,0);
  const curOk=CURATED.filter(q=>{const s=S.qstats[q.id];return s&&s.n>0&&s.ok/s.n>=0.5;}).length;
  const exams=S.history.filter(h=>h.mode==='exam'); const best=exams.length?Math.max(...exams.map(h=>Math.round(100*h.ok/h.n))):0;
  // Punkte: 30 % Gesetz gelesen, 30 % Karten sicher, 30 % Fragen richtig beantwortet, 10 % beste Prüfungssimulation
  const pct=Math.round(30*learned/ALLP.length+30*safe/CARDS.length+30*curOk/CURATED.length+10*best/100);
  return {n:S.me||'Ich',d:new Date().toISOString().slice(0,10),pct,learned,safe,curOk,asked,right,best,exams:exams.length};
}
function encodeSummary(s){ return 'JK1.'+btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/=+$/,''); }
function decodeSummary(c){ try{ c=c.trim(); if(!c.startsWith('JK1.')) return null; const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4))))); return (typeof o.pct==='number')?o:null; }catch(e){ return null; } }
function barRow(s,me){ return `<div class="cmp ${me?'me':''}"><div class="row" style="justify-content:space-between"><b>${esc(s.n)}</b><span class="num"><b>${s.pct}</b> / 100 Punkte${s.d?` <span class="muted" style="font-size:.8rem">Stand ${esc(s.d)}</span>`:''}</span></div><div class="bar big"><i style="width:${s.pct}%"></i></div><div class="muted num" style="font-size:.85rem">${s.learned} §§ gelesen · ${s.safe} Karten sicher · ${s.curOk} Fragen gekonnt · beste Simulation ${s.best} %</div></div>`; }
function copyText(txt,btn){ const done=()=>{btn.textContent='Kopiert ✓';setTimeout(()=>btn.textContent='Meinen Code kopieren',2000);}; try{ navigator.clipboard.writeText(txt).then(done,()=>{const ta=document.getElementById('mycode');ta.hidden=false;ta.select();}); }catch(e){ const ta=document.getElementById('mycode');ta.hidden=false;ta.select(); } }

// ---------- Start ----------
const EXAM={apply:'2026-10-15',written:'2027-04-22',oral:'2027-05-11'};
function daysTo(d){ return Math.ceil((new Date(d+'T00:00:00')-new Date())/86400000); }
V.start=function(el){
  if(!S.me){
    el.innerHTML=`<div class="stack"><div class="card stack"><h2>Wer lernt hier?</h2><p class="muted" style="margin:0">Der Name steht auf deinem Fortschrittsbalken und im Vergleich mit deinem Lernpartner. Er bleibt nur auf diesem Gerät gespeichert.</p>
      <div class="row"><button class="btn primary" data-me="Matthias">Matthias</button><button class="btn primary" data-me="Michael">Michael</button></div>
      <div class="row"><input type="text" id="mename" placeholder="anderer Name" style="font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)"><button class="btn" id="meok">Weiter</button></div></div></div>`;
    el.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{S.me=b.dataset.me;save();render();});
    el.querySelector('#meok').onclick=()=>{const v=el.querySelector('#mename').value.trim();if(v){S.me=v;save();render();}};
    return;
  }
  const my=summary(); const fr=S.friend;
  const learned=ALLP.filter(p=>S.learned[p.id]).length, total=ALLP.length;
  const cards=Object.values(S.cards); const due=CARDS.filter((c,i)=>{const st=S.cards['k'+i];return !st||st.due<=today();}).length;
  const stats=Object.values(S.qstats); const asked=stats.reduce((a,s)=>a+s.n,0), right=stats.reduce((a,s)=>a+s.ok,0);
  const dw=daysTo(EXAM.written);
  el.innerHTML=`<div class="stack">
  <div class="card stack"><div class="eyebrow">Challenge</div>
    ${barRow(my,true)}
    ${fr?barRow(fr,false):`<p class="muted" style="margin:0">Noch kein Code deines Lernpartners eingetragen.</p>`}
    <details><summary>Fortschritt austauschen</summary>
      <p class="muted" style="font-size:.9rem">Funktioniert ohne Internet: Code kopieren und per Nachricht schicken, der andere fügt ihn hier ein. Punkte: 30 % Gesetz gelesen, 30 % Karten sicher (Fach 3+), 30 % Quizfragen gekonnt, 10 % beste Prüfungssimulation.</p>
      <div class="row"><button class="btn small" id="copycode">Meinen Code kopieren</button><button class="btn small" id="chgname">Name ändern</button></div>
      <textarea id="mycode" hidden readonly style="width:100%;height:60px;margin-top:8px;font:12px monospace">${encodeSummary(my)}</textarea>
      <div class="row" style="margin-top:8px"><input type="text" id="frcode" placeholder="Code des Partners einfügen" style="flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)"><button class="btn small" id="frok">Übernehmen</button></div>
    </details>
  </div>
  <div class="card deadline">
    <div class="eyebrow">Prüfungstermine 2027 (Kundmachung Nr. 288/2026)</div>
    <div class="grid" style="margin-top:8px">
      <div><div class="big num">${dw}</div><div class="muted">Tage bis zur schriftlichen Prüfung<br><b>22./23. April 2027</b></div></div>
      <div><div class="big num">${daysTo(EXAM.oral)}</div><div class="muted">Tage bis zu den mündlichen Prüfungen<br><b>11.–21. Mai 2027</b></div></div>
    </div>
    <p style="margin:12px 0 0"><span class="pill ok">Anmeldung zur Prüfung erledigt</span> Prüfungsgebühr 60 Euro, spätestens vor Prüfungsbeginn einzuzahlen (am Tag der schriftlichen Prüfung nicht möglich). KJAV-Vorbereitungskurs Jänner–April 2027, 16 Tage an Wochenenden, Einladung kommt von der Kärntner Jägerschaft.</p>
  </div>
  <div class="grid">
    <div class="card"><div class="eyebrow">K-JG gelesen</div><div class="big num">${learned}<span class="muted" style="font-size:1rem"> / ${total} §§</span></div><div class="bar"><i style="width:${Math.round(100*learned/total)}%"></i></div></div>
    <div class="card"><div class="eyebrow">Karten fällig</div><div class="big num">${due}</div><div class="muted">von ${CARDS.length} Lernkarten</div></div>
    <div class="card"><div class="eyebrow">Quiz-Trefferquote</div><div class="big num">${asked?Math.round(100*right/asked):0}<span class="muted" style="font-size:1rem"> %</span></div><div class="muted">${asked} Fragen beantwortet</div></div>
  </div>
  <div class="row">
    <button class="btn primary" data-go="karten">Fällige Karten lernen</button>
    <button class="btn" data-go="quiz">Quiz starten</button>
    <button class="btn" data-go="gesetz">Texte lesen</button>
  </div>
  <h2>Prüfungsfächer der Jagdaufseherprüfung</h2>
  <p class="muted" style="margin:0">Nach § 7 der Verordnung des Landesvorstandes der Kärntner Jägerschaft (Prüfungsstoff) und § 4 (Lehrplan). Derzeit ist nur das Jagdrecht mit Inhalten befüllt.</p>

function bookAnswer(b){
  const norm=s=>s.toLowerCase().replace(/[^a-zäöüß0-9]/g,'');
  const cands=BOOK.filter(x=>Math.abs(x.pg-b.pg)<=1);
  const nt=norm(b.t);
  return cands.find(x=>nt.includes(norm(x.f).slice(0,30))||norm(x.f).includes(nt.slice(0,30)))||(cands.length===1?cands[0]:null);
}
function showChap(el,i){

    return `<p>${pg}${linkRefs(b.t,'kjg')}</p>`;

  <div class="row" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px"><button class="btn ${S.book[c.key]?'':'primary'}" id="read">${S.book[c.key]?'✓ Als gelesen markiert':'Als gelesen markieren'}</button></div></article>

  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>render({chap:+b.dataset.c}));

  ${boxHtml(boxes)}</div>`;

  el.querySelector('#flip').onclick=()=>{el.querySelector('#back').hidden=false;el.querySelector('#flip').hidden=true;el.querySelector('#grade').hidden=false;};
  el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const st=S.cards['k'+i]||{box:0}; const g=+b.dataset.g;
    st.box = g===2?Math.min(5,st.box+1): g===1?Math.max(1,st.box):0;
    st.due = today()+INTERVALS[st.box]; S.cards['k'+i]=st; save();
    deck.shift(); if(g===0) deck.push(i); render();
  });
};
function boxHtml(b){ return `<div class="card"><div class="eyebrow">Leitner-Fächer</div><table><tr>${['neu','1 Tag','3 Tage','7 Tage','16 Tage','35 Tage'].map((l,i)=>`<th>${l}</th>`).join('')}</tr><tr>${b.map(n=>`<td class="num">${n}</td>`).join('')}</tr></table></div>`; }

// ---------- Quiz ----------
let quiz=null;
V.quiz=function(el,arg){
  if(arg&&arg.para){ quiz={qs:CURATED.filter(q=>q.ref.startsWith('§ '+arg.para+' ')||q.ref==='§ '+arg.para).map(present),i:0,ok:0,mode:'quiz'}; }
  if(!quiz){
    const weak=Object.entries(S.qstats).filter(([k,s])=>s.n>=1&&s.ok/s.n<0.6).map(([k])=>k);
    el.innerHTML=`<div class="stack"><h2>Quiz</h2><div class="card stack">
      <label>Bereich <select id="sec"><option value="all">Alle Abschnitte</option><option value="0">Prüfungsrecht (K-BJPG, Verordnung)</option><option value="jz">Jagdzeiten</option><option value="satzung">Satzung der Jägerschaft</option><option value="knsg">Naturschutzgesetz</option>${SECTIONS.map(s=>`<option value="${s.nr}">${s.nr}. ${esc(s.title)}</option>`).join('')}</select></label>
      <label><input type="checkbox" id="auto" checked> Auch automatisch erzeugte Fragen (Paragraphen-Titel, Abschnitte, Zahlen aus dem Gesetzestext)</label>
      <label>Anzahl <select id="n"><option>10</option><option selected>15</option><option>25</option><option>40</option></select></label>
      <div class="row"><button class="btn primary" id="go">Starten</button>${weak.length?`<button class="btn" id="weak">Schwache Fragen (${weak.length})</button>`:''}</div>
      <p class="muted" style="margin:0">${CURATED.length} handgeschriebene Fragen mit Fundstelle und Erklärung.</p></div></div>`;
    el.querySelector('#go').onclick=()=>{ const f={sec:el.querySelector('#sec').value,auto:el.querySelector('#auto').checked}; quiz={qs:buildQuiz(+el.querySelector('#n').value,f).map(present),i:0,ok:0,mode:'quiz'}; render(); };
    const w=el.querySelector('#weak'); if(w) w.onclick=()=>{ quiz={qs:shuffle(CURATED.filter(q=>weak.includes(q.id))).map(present),i:0,ok:0,mode:'quiz'}; render(); };
    return;
  }
  runQuestion(el);
};
function runQuestion(el){
  const z=quiz; if(z.i>=z.qs.length) return finish(el);
  const q=z.qs[z.i];
  el.innerHTML=`<div class="stack"><div class="row"><span class="pill num">${z.i+1} / ${z.qs.length}</span><span class="pill">${esc(q.t)}</span>${z.mode==='exam'?`<span class="pill num" id="clock"></span>`:''}<button class="btn small" style="margin-left:auto" id="abort">Abbrechen</button></div>
  <div class="card"><div class="q">${esc(q.q)}</div>${q.ctx?`<p class="muted" style="font-size:.95rem">„${esc(q.ctx)}“</p>`:''}
  ${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
  <div id="after" hidden><div class="expl"><b>${esc(q.ref)}</b> – ${esc(q.e)} ${q.ref.startsWith('§')&&!/Satzung|K-NSG/.test(q.ref)&&byId[q.ref.split(' ')[1]]?`<button class="btn small" id="openp" style="margin-left:6px">Nachlesen</button>`:''}</div>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${z.i+1<z.qs.length?'Weiter':'Auswertung'}</button></div></div></div></div>`;
  el.querySelector('#abort').onclick=()=>{quiz=null;render();};
  if(z.mode==='exam') tick(el);
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===q.a;
    el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true; if(j===q.a) x.classList.add('correct'); else if(j===i) x.classList.add('wrong');});
    if(ok) z.ok++;
    if(q.kind==='kuratiert'){ const st=S.qstats[q.id]||{n:0,ok:0}; st.n++; if(ok) st.ok++; S.qstats[q.id]=st; save(); }
    z.answers=z.answers||[]; z.answers.push({q,ok});
    if(z.mode==='exam'){ z.i++; setTimeout(()=>render(),ok?350:1200); return; }
    el.querySelector('#after').hidden=false;
  });
  el.querySelector('#next').onclick=()=>{z.i++;render();};
  const op=el.querySelector('#openp'); if(op) op.onclick=()=>{ nav('gesetz',{doc:'kjg',para:q.ref.split(' ')[1]}); };
}
function finish(el){
  const z=quiz; const pct=Math.round(100*z.ok/z.qs.length); const passed=pct>=70;
  S.history.push({d:new Date().toISOString().slice(0,10),n:z.qs.length,ok:z.ok,mode:z.mode}); S.history=S.history.slice(-50); save();
  const wrong=(z.answers||[]).filter(a=>!a.ok);
  el.innerHTML=`<div class="stack"><h2>${z.mode==='exam'?'Prüfungssimulation':'Quiz'} – Auswertung</h2>
  <div class="card"><div class="big num" style="color:${passed?'var(--ok)':'var(--bad)'}">${pct} %</div><div class="muted">${z.ok} von ${z.qs.length} richtig${z.mode==='exam'?(passed?' – das entspricht „bestanden“ (Richtwert 70 %)':' – unter dem Richtwert von 70 %'):''}</div></div>
  ${wrong.length?`<h3>Falsch beantwortet</h3><div class="list">${wrong.map(a=>`<div class="item" style="flex-direction:column;gap:4px"><b>${esc(a.q.q)}</b><span>Richtig: ${esc(a.q.o[a.q.a])}</span><span class="muted" style="font-size:.9rem">${esc(a.q.ref)} – ${esc(a.q.e)}</span></div>`).join('')}</div>`:'<p>Alles richtig.</p>'}
  <div class="row"><button class="btn primary" id="again">Nochmal</button><button class="btn" id="home">Zur Übersicht</button></div></div>`;
  el.querySelector('#again').onclick=()=>{quiz=null;render();};
  el.querySelector('#home').onclick=()=>{quiz=null;nav('start');};
}
function tick(el){
  const c=el.querySelector('#clock'); if(!c) return;
  const f=()=>{ if(!quiz||quiz.mode!=='exam') return; const left=Math.max(0,Math.floor((quiz.end-Date.now())/1000)); c.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); if(left<=0){quiz.i=quiz.qs.length;render();return;} if(document.body.contains(c)) setTimeout(f,1000); };
  f();
}

// ---------- Prüfungssimulation ----------
V.pruefung=function(el){
  if(quiz&&quiz.mode==='exam') return runQuestion(el);
  const hist=S.history.filter(h=>h.mode==='exam').slice(-8).reverse();
  el.innerHTML=`<div class="stack"><h2>Prüfungssimulation</h2>
  <div class="card stack"><p style="margin:0">30 Fragen aus allen Bereichen, 25 Minuten, keine Erklärungen zwischendurch. Die Auswertung zeigt Fundstellen zu allen Fehlern. Die echte Prüfung ist schriftlich und mündlich-praktisch; der Richtwert von 70 % ist eine Annahme dieser App, keine amtliche Vorgabe.</p>
  <div class="row"><button class="btn signal" id="go">Simulation starten</button></div></div>
  ${hist.length?`<div class="card"><div class="eyebrow">Bisherige Simulationen</div><table><tr><th>Datum</th><th>Ergebnis</th></tr>${hist.map(h=>`<tr><td>${h.d}</td><td class="num">${h.ok} / ${h.n} (${Math.round(100*h.ok/h.n)} %)</td></tr>`).join('')}</table></div>`:''}
  </div>`;
  el.querySelector('#go').onclick=()=>{ quiz={qs:buildQuiz(30,{sec:'all',auto:true}).map(present),i:0,ok:0,mode:'exam',end:Date.now()+25*60*1000}; render(); };
};

render();
})();
</script>
