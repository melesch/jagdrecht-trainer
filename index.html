 von drei Wochen anzuberaumen ist. Die Landesregierung ist berechtigt, dieses Verlangen zu stellen, wenn ein Missstand durch die Beratung und Beschlussfassung in diesem Kollegialorgan beseitigt werden kann."},{"lvl":0,"sym":"(6)","t":"Die Landesregierung hat gesetzwidrige Verordnungen nach Anhören des Landesvorstandes der Kärntner Jägerschaft durch Verordnung aufzuheben und die Gründe hiefür gleichzeitig mitzuteilen."},{"lvl":0,"sym":"(7)","t":"Die Landesregierung hat rechtskräftige Bescheide, die den Wirkungsbereich der Kärntner Jägerschaft überschreiten oder sonst gegen Gesetze verstoßen, von Amts wegen oder auf Antrag aufzuheben."},{"lvl":0,"sym":"(8)","t":"Erfüllt die Kärntner Jägerschaft eine ihr im übertragenen Wirkungsbereich obliegende Aufgabe oder eine darauf Bezug nehmende Weisung der Landesregierung nicht, so hat die Landesregierung nach vorheriger Ermahnung auf Kosten und Gefahr der Kärntner Jägerschaft die erforderlichen Maßnahmen zu treffen (Ersatzvornahme). Die Landesregierung hat den Kostenersatz mit Bescheid vorzuschreiben. Die der Kärntner Jägerschaft zur Last fallenden Kosten dürfen von den nach dem Kärntner Jagdabgabengesetz zur Verfügung zu stellenden Landesmitteln einbehalten werden."},{"lvl":0,"sym":"(9)","t":"Der Landesvorstand der Kärntner Jägerschaft hat alle zwei Jahre einen Tätigkeitsbericht zu erstatten; dieser Bericht ist dem Kärntner Landtag im Wege der Landesregierung zur Kenntnis zu übermitteln. In diesem Bericht sind jedenfalls Angaben über die Verwendung der nach dem Kärntner Jagdabgabengesetz zur Verfügung gestellten Landesmittel und ein Überblick über den Stand des Jagdwesens in Kärnten aufzunehmen."}]}]},{"nr":11,"title":"Beiräte","paras":[{"id":"92","title":"Landesjagdbeirat, Bezirksjagdbeirat","body":[{"lvl":0,"sym":"(1)","t":"Zur fachlichen Beratung der Verwaltungsbehörden und der Organe der Kärntner Jägerschaft sind Jagdbeiräte einzurichten."},{"lvl":0,"sym":"(2)","t":"Der beim Amt der Landesregierung einzurichtende Beirat (Landesjagdbeirat) besteht aus"},{"lvl":1,"sym":"a)","t":"dem Landesjägermeister oder seinem Stellvertreter als Vorsitzendem,"},{"lvl":1,"sym":"b)","t":"einem weiteren vom Landesvorstand der Kärntner Jägerschaft entsendeten Mitglied des Landesvorstandes der Kärntner Jägerschaft,"},{"lvl":1,"sym":"c)","t":"dem vom Landesvorstand der Kärntner Jägerschaft entsendeten Mitglied des Landesausschusses der Kärntner Jägerschaft, das mit den Angelegenheiten der wildökologischen Raumplanung betraut wurde (§ 83 Abs. 5 letzter Satz),"},{"lvl":1,"sym":"d)","t":"einem von der Landwirtschaftskammer zu bestellendem Forstwirt oder Förster,"},{"lvl":1,"sym":"e)","t":"drei von der Landwirtschaftskammer zu bestellenden Mitgliedern dieser Kammer,"},{"lvl":1,"sym":"f)","t":"dem Leiter der mit den Angelegenheiten des Forstwesens betrauten Abteilung des Amtes der Kärntner Landesregierung oder seinem Stellvertreter und"},{"lvl":1,"sym":"g)","t":"einem vom Landesvorstand des Kärntner Gemeindebundes aus seiner Mitte zu bestellendem Mitglied."},{"lvl":0,"sym":"(3)","t":"Bei jeder Bezirkshauptmannschaft ist ein Beirat zu bestellen (Bezirksjagdbeirat), wobei der bei der Bezirkshauptmannschaft Klagenfurt-Land bestellte Beirat zur Beratung auch in der Landeshauptstadt Klagenfurt und der bei der Bezirkshauptmannschaft Villach-Land bestellte Beirat zur Beratung auch in der Stadt Villach zuständig ist. Die Bezirksjagdbeiräte bestehen aus"},{"lvl":1,"sym":"a)","t":"dem Bezirksjägermeister oder seinem Stellvertreter als Vorsitzendem,"},{"lvl":1,"sym":"b)","t":"einem weiteren vom Bezirksausschuss der Bezirksgruppe der Kärntner Jägerschaft entsendeten Mitglied dieses Bezirksausschusses,"},{"lvl":1,"sym":"c)","t":"einem vom Bezirksausschuss entsendeten Mitglied der Bezirksgruppe aus dem Kreis der Jagdschutzorgane im Bereich der Bezirksgruppe, letzterer für die Dauer seiner Bestellung als Jagdschutzorgan, längstens jedoch für die Dauer der Pachtzeit der Gemeindejagd,"},{"lvl":1,"sym":"d)","t":"einem von der Landwirtschaftskammer zu bestellendem Forstwirt oder Förster,"},{"lvl":1,"sym":"e)","t":"aus drei von der Landwirtschaftskammer zu bestellenden Mitgliedern dieser Kammer,"},{"lvl":1,"sym":"f)","t":"dem Leiter der Bezirksforstinspektion oder einem von ihm bestellten Vertreter und"},{"lvl":1,"sym":"g)","t":"einem vom Landesvorstand des Kärntner Gemeindebundes aus dem Kreis der Bürgermeister seiner Mitglieder im Bereich der Zuständigkeit des Bezirksjagdbeirates zu bestellendem Mitglied."},{"lvl":0,"sym":"(3a)","t":"Für die entsendeten oder bestellten Mitglieder ist in gleicher Weise jeweils ein Ersatzmitglied zu bestellen oder zu entsenden, das im Falle der Verhinderung oder des vorzeitigen Ausscheidens des Mitgliedes zur Vertretung berufen ist. Die Bestellung und die Entsendung der Mitglieder (Ersatzmitglieder) hat - ausgenommen Mitglieder nach Abs. 3 lit. c - für die Dauer der Pachtzeit der Gemeindejagd zu erfolgen. Personen, die als Mitglieder (Ersatzmitglieder) bestellt oder entsendet worden sind, können von der Stelle, die sie bestellt oder entsendet hat, in gleicher Weise abberufen werden. Im Falle des vorzeitigen Ausscheidens eines Mitgliedes (Ersatzmitgliedes) hat für die verbleibende Pachtzeit der Gemeindejagd in gleicher Weise eine Nachbesetzung zu erfolgen. Nach Ablauf der Pachtzeit der Gemeindejagd haben die Beiräte ihre Aufgaben bis zum Zusammentritt der neuen Jagdbeiräte zu erfüllen."},{"lvl":0,"sym":"(4)","t":"Die Jagdbeiräte sind beschlussfähig, wenn mit dem Vorsitzenden mindestens die Hälfte ihrer Mitglieder anwesend ist. Für einen Beschluss ist mehr als die Hälfte der abgegebenen Stimmen erforderlich. Im Fall einer Beratung der Landesregierung oder der Bezirksverwaltungsbehörden stimmt der Vorsitzende zuletzt ab und gibt bei Stimmengleichheit mit seiner Stimme den Ausschlag. Im Fall der Beratung von Organen der Kärntner Jägerschaft gilt Stimmengleichheit als Ablehnung."},{"lvl":0,"sym":"(5)","t":"Die Jagdbeiräte haben bei Maßnahmen nach §§ 9 bis 14 sowie in sonstigen wichtigen Fragen, zu deren Behandlung die Kenntnis der örtlichen Verhältnisse von Wichtigkeit erscheint, zu ihren Beratungen je einen Vertreter der Gemeinden beizuziehen, die von der zu beratenden Angelegenheit berührt sind."},{"lvl":0,"sym":"(6)","t":"Die Mitglieder der Jagdbeiräte üben ihr Amt ehrenamtlich aus. Sie haben Anspruch auf Ersatz der ihnen aus dieser Tätigkeit erwachsenden Barauslagen. Die Landesregierung hat den Mitgliedern ein der Bedeutung dieses Amtes angemessenes Sitzungsgeld zu gewähren."}]},{"id":"93","title":"Aufgaben der Jagdbeiräte","body":[{"lvl":0,"sym":"(1)","t":"Die Jagdbeiräte sind - unbeschadet der in diesem Gesetz ausdrücklich angeführten Fälle - in allen wichtigen Jagdangelegenheiten zu hören."},{"lvl":0,"sym":"(2)","t":"Die Behörde kann für die Abgabe einer Stellungnahme eine Frist setzen, die nicht kürzer als eine Woche sein darf. Zu Fragen betreffend den Abschußauftrag zum Schutz der Kulturen und den Abschuß während der Schonzeit hat der Jagdbeirat Äußerungen innerhalb von drei Tagen abzugeben."}]},{"id":"94","title":"Jagdverwaltungsbeirat","body":[{"lvl":0,"sym":"(1)","t":"Der Jagdverwaltungsbeirat ist für jedes Gemeindejagdgebiet zu bilden. Er besteht aus dem Bürgermeister oder einem von ihm aus der Mitte des Gemeinderates bestellten Vertreter als Vorsitzendem und weiteren Mitgliedern, die aus der Mitte der Eigentümer der die Gemeindejagd bildenden Grundstücke (§ 6 Abs. 1), die zugleich in die Vollversammlung der Landwirtschaftskammer von Kärnten wahlberechtigt sind, zu wählen sind. Die Wahl des Jagdverwaltungsbeirates hat auf die Dauer der jeweiligen Pachtzeit des Gemeindejagdgebietes zu erfolgen."},{"lvl":0,"sym":"(1a)","t":"Die Zahl der zu wählenden weiteren Mitglieder des Jagdverwaltungsbeirates ist vom Gemeinderat unter Bedachtnahme auf die Zahl der Wahlberechtigten für jeden Jagdverwaltungsbeirat gesondert - höchstens jedoch mit sieben - festzulegen. Die Wahl ist auf Grund von Wahlvorschlägen durchzuführen, die jeweils eine der Zahl der zu wählenden weiteren Mitglieder entsprechende Anzahl von Bewerbern und eine gleich hohe Anzahl von Ersatzbewerbern vorsehen müssen. Das Recht auf Einbringung von Wahlvorschlägen hat jeweils ein Zehntel der Mitglieder der Eigentümerversammlung. Wird nur ein gültiger Wahlvorschlag eingebracht, so entfällt das Abstimmungsverfahren. Die auf diesem Wahlvorschlag angeführten Bewerber gelten als zu Mitgliedern und Ersatzmitgliedern des Jagdverwaltungsbeirates gewählt."},{"lvl":0,"sym":"(1b)","t":"Die Wahlen sind mit Stimmzetteln durchzuführen. Die Leitung der Wahl obliegt dem Bürgermeister. Die näheren Bestimmungen über das Wahlverfahren hat die Landesregierung entsprechend den Bestimmungen der Gemeinderats- und Bürgermeisterwahlordnung 2002, LGBl Nr 32/2002, durch Verordnung zu treffen, wobei die Ausschreibung der Wahl durch den Bürgermeister zu erfolgen hat und die Fristen, mit Ausnahme der Auflagefrist für das Wählerverzeichnis, den Erfordernissen entsprechend auch kürzer festgelegt werden dürfen, als sie in der Gemeinderats- und Bürgermeisterwahlordnung 2002 vorgesehen sind."},{"lvl":0,"sym":"(1c)","t":"Ein Mitglied des Jagdverwaltungsbeirates ist befangen und darf an der Beratung und Beschlussfassung in Sachen, in denen es selbst oder ein Angehöriger (Abs. 1d) beteiligt ist, oder wenn sonstige wichtige Gründe vorliegen, die geeignet sind, die volle Unbefangenheit des Mitgliedes in Zweifel zu ziehen, nicht teilnehmen. Dies gilt im Falle einer Beratung und Beschlussfassung über eine Verpachtung des Jagdausübungsrechtes in einer Gemeinde aus freier Hand gemäß § 33 Abs. 2 an eine Jagdgesellschaft nur in Bezug auf deren Obmann und deren Vorstandsmitglieder. Über die etwaige Befangenheit eines Mitgliedes hat der Jagdverwaltungsbeirat zu beschließen. Für die Dauer der Befangenheit sind befangene Mitglieder durch Ersatzmitglieder zu ersetzen. Abs. 1e letzter Satz gilt sinngemäß."},{"lvl":0,"sym":"(1d)","t":"Angehörige im Sinne des Abs. 1c erster Satz sind"},{"lvl":1,"sym":"1.","t":"der Ehegatte,"},{"lvl":1,"sym":"2.","t":"die Verwandten in gerader Linie und die Verwandten zweiten Grades in der Seitenlinie,"},{"lvl":1,"sym":"3.","t":"die Verschwägerten in gerader Linie und die Verschwägerten zweiten Grades in der Seitenlinie,"},{"lvl":1,"sym":"4.","t":"die Wahleltern und Wahlkinder und die Pflegeeltern und Pflegekinder,"},{"lvl":1,"sym":"5.","t":"Personen, die miteinander in Lebensgemeinschaft leben, sowie Kinder und Enkel einer dieser Personen im Verhältnis zur anderen Person und"},{"lvl":1,"sym":"6.","t":"der eingetragene Partner."},{"lvl":0,"sym":"(1e)","t":"Wenn ein gewähltes Mitglied des Jagdverwaltungsbeirates die Voraussetzungen nach Abs. 1 zweiter Satz nicht mehr erfüllt oder seine Mitgliedschaft vorzeitig endet, tritt ein Ersatzmitglied an seine Stelle. Ist die Liste der Ersatzmitglieder erschöpft, hat der Gemeinderat aus der Mitte der Eigentümer der die Gemeindejagd bildenden Grundstücke mit einfacher Mehrheit der abgegebenen Stimmen Ersatzmitglieder zu wählen."},{"lvl":0,"sym":"(2)","t":"Der Jagdverwaltungsbeirat ist vom Vorsitzenden einzuberufen; der Vorsitzende hat den Jagdverwaltungsbeirat einzuberufen, wenn dies mehr als die Hälfte seiner Mitglieder unter Angabe einer Tagesordnung schriftlich verlangt. Der Jagdverwaltungsbeirat ist beschlußfähig, wenn außer dem Vorsitzenden mehr als die Hälfte seiner Mitglieder anwesend ist. Für einen Beschluß ist die Mehrheit der abgegebenen Stimmen erforderlich. Der Vorsitzende hat kein Stimmrecht."},{"lvl":0,"sym":"(3)","t":"Die Mitgliedschaft zum Jagdverwaltungsbeirat ist ein Ehrenamt. Die Mitglieder haben jedoch Anspruch auf Ersatz der durch die Ausübung ihres Amtes entstandenen Kosten."}]}]},{"nr":12,"title":"Schlußbestimmungen","paras":[{"id":"95","title":"Jagdkataster","body":[{"lvl":0,"sym":"(1)","t":"Der Landesjägermeister hat einen Jagdkataster mit kartografischer Darstellung der Eigenjagdgebiete und Gemeindejagdgebiete zu führen und laufend jagdstatistische Daten zusammenzustellen, die erforderlichenfalls die Jagdausübungsberechtigten beizubringen haben. Der Jagdkataster ist getrennt für Eigenjagdgebiete und Gemeindejagdgebiete anzulegen und hat für jedes Jagdgebiet insbesondere zu enthalten: den Jagdausübungsberechtigten, das Flächenausmaß, die Pächter, die Höhe des Pachtzinses und allfällige Nebenleistungen, die Dauer der Pachtzeit, Daten über die Genehmigung der Verpachtung, die Jagdschutzorgane und bei Eigenjagdgebieten überdies den Grundeigentümer. Jagdstatistische Daten sind über den festgelegten und tatsächlichen Abschuss, über Rotwildfütterungen, die Jagdkarten, die Jagdprüfungen, über Wildschäden und Wildseuchen, über weitere einschlägige Daten im Zusammenhang mit Wild sowie über zeitliche und örtliche Sperren zusammenzustellen. Die näheren Bestimmungen über die Einrichtung des Jagdkatasters und über die Zusammenstellung der jagdstatistischen Daten hat der Landesvorstand der Kärntner Jägerschaft durch Verordnung zu regeln."},{"lvl":0,"sym":"(2)","t":"Der Landesjägermeister hat der Landesregierung und den Bezirksverwaltungsbehörden auf deren Wunsch alle Daten aus dem Jagdkataster bekannt zu geben."},{"lvl":0,"sym":"(3)","t":"Der Landesjägermeister hat der Landwirtschaftskammer auf deren Verlangen jagdstatistische Daten über festgelegte und tatsächliche Abschusszahlen anonymisiert und aggregiert auf Ebene der Hegeringe zur Verfügung zu stellen."},{"lvl":0,"sym":"(4)","t":"Der Landesjägermeister hat den Jagdschutzorganen (§§ 44 ff.) und Talschaftsreferenten (§ 84 Abs. 7), soweit es für die Wahrnehmung ihrer jeweiligen Aufgaben für das betreffende Zuständigkeitsgebiet erforderlich ist, in die im Jagdkataster enthaltenen Daten gemäß Abs. 1 nach Tunlichkeit in elektronischer Form Einsicht zu gewähren."},{"lvl":0,"sym":"(5)","t":"Soweit Daten gemäß Abs. 1 nicht bei der Kärntner Jägerschaft vorhanden sind, haben die Landesregierung und die Bezirksverwaltungsbehörden diese Daten zum Zweck der Führung und Aktualisierung des Jagdkatasters auf Verlangen dem Landesjägermeister – nach Möglichkeit in elektronischer Form – zur Verfügung zu stellen."}]},{"id":"95a","title":"Verarbeitung personenbezogener Daten durch die Kärntner Jägerschaft","body":[{"lvl":0,"sym":"(1)","t":"Die Kärntner Jägerschaft ist befugt, folgende personenbezogene Daten ihrer Mitglieder zu verarbeiten, soweit dies zur Erfüllung der Aufgaben nach Maßgabe des 10. Abschnittes, ausgenommen nach § 81a, und zur Wahrung der Rechte und Pflichten ihrer Mitglieder (§ 89) erforderlich ist: Namen, Geburtsdatum, allfällige akademische Grade sowie Titel, Erreichbarkeitsdaten, Staatsangehörigkeit, Daten über Disziplinarverfahren und Disziplinarerkenntnisse einschließlich des Datums der Rechtskraft, Angaben zu Beitragszahlungen, Angaben zum Abschluss einer Jagdhaftpflichtversicherung, Daten über die Teilnahme am Hegeringschießen und an sonstigen Veranstaltungen sowie über die Inanspruchnahme von Einrichtungen der Kärntner Jägerschaft, Daten zu allfälligen Funktionen in der Kärntner Jägerschaft sowie Erreichbarkeitsdaten der Funktionäre. Zur Durchführung der Wahlen ihrer Organe hat die Kärntner Jägerschaft ein Wählerverzeichnis zu erstellen und zur allgemeinen Einsichtnahme für die Mitglieder aufzulegen. Daten über Funktionäre der Kärntner Jägerschaft dürfen veröffentlicht werden, soweit dies zur Information der Allgemeinheit erforderlich ist."},{"lvl":0,"sym":"(2)","t":"Darüber hinaus ist die Kärntner Jägerschaft zur Verarbeitung personenbezogener Daten befugt, soweit dies zur Erfüllung der folgenden Aufgaben des übertragenen Wirkungsbereichs erforderlich ist:"},{"lvl":1,"sym":"1.","t":"zur Vollziehung der §§ 37 und 38: Daten über Bewerber um eine Jagdkarte, über die Ausstellung und über die Verweigerung einer Jagdkarte;"},{"lvl":1,"sym":"2.","t":"zur Vollziehung der §§ 57 bis 60: Daten über Jagdausübungsberechtigte in Verbindung mit der Abschussplanung, den Freizonen, der Erlaubnis zum zusätzlichen Abschuss, den Abschussmeldungen, den Abschusslisten, der Wildnachweisung sowie den Abschussnachweisen;"},{"lvl":1,"sym":"3.","t":"zur Vollziehung des § 63 Abs. 5 und 6: Daten über Jagdausübungsberechtigte in Verbindung mit der Errichtung oder Beseitigung von Rehwild-, Muffelwild- oder Rotwildfütterungsanlagen;"},{"lvl":1,"sym":"4.","t":"zur Durchführung von Verfahren gemäß § 68 Abs. 3, 3a und 3f, zu Namen und Anschriften der Besitzer von gekennzeichneten Abzugeisen und zu Kennzahlen nach § 68 Abs. 3b sowie zur Überwachung gemäß § 68 Abs. 3g gegenüber Inhabern von Bewilligungen;"},{"lvl":1,"sym":"5.","t":"die zur Erfüllung der Bekanntgabeverpflichtung nach § 69 Abs. 3 erforderlichen Daten;"},{"lvl":1,"sym":"6.","t":"Daten zur Führung und Zusammenstellung des Jagdkatasters nach Maßgabe des § 95."},{"lvl":0,"sym":"(3)","t":"Als Erreichbarkeitsdaten gelten Wohnsitzdaten und sonstige Adressdaten, die Telefonnummer, elektronische Kontaktdaten (insbesondere die E-Mail-Adresse) sowie Verfügbarkeitsdaten."},{"lvl":0,"sym":"(4)","t":"Daten gemäß Abs. 1 sind zu löschen, wenn sie für die Erfüllung der gesetzlich obliegenden Aufgaben oder zur Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen nicht mehr benötigt werden. Personenbezogene Daten gemäß Abs. 2 Z 1 bis 4 sind längstens sieben Jahre nach Erreichung des jeweiligen Verwendungszwecks zu löschen, soweit sie nicht in anhängigen Verfahren oder zur Erfüllung einer gesetzlich obliegenden Aufgabe weiter benötigt werden."}]},{"id":"96","title":"Eigener Wirkungsbereich","body":[{"lvl":0,"sym":"","t":"Die der Gemeinde nach diesem Gesetz obliegenden Aufgaben, ausgenommen solche nach § 32 Abs. 1 und nach den §§ 77 bis 79, sind solche des eigenen Wirkungsbereiches."}]},{"id":"96a","title":"Verweisung","body":[{"lvl":0,"sym":"(1)","t":"Soweit in diesem Gesetz auf landesgesetzliche Bestimmungen verwiesen wird, sind sie in ihrer jeweils geltenden Fassung anzuwenden."},{"lvl":0,"sym":"(2)","t":"Soweit in diesem Gesetz auf das Allgemeine Verwaltungsverfahrensgesetz verwiesen wird, ist das Allgemeine Verwaltungsverfahrensgesetz 1991, BGBl. Nr. 51, zuletzt in der Fassung BGBl. I Nr. 88/2023, anzuwenden."}]},{"id":"96b","title":"(entfällt)","body":[]},{"id":"96c","title":"Anhörungsverpflichtungen durch das Landesverwaltungsgericht","body":[{"lvl":0,"sym":"(1)","t":"Soweit die Verwaltungsbehörden nach diesem Gesetz verpflichtet sind, vor ihrer Entscheidung bestimmte Stellen anzuhören, gilt diese Verpflichtung in gleicher Weise für das Landesverwaltungsgericht, wenn dieses in der Sache selbst entscheidet."},{"lvl":0,"sym":"(2)","t":"Das Landesverwaltungsgericht hat, bevor es über Beschwerden gegen Bescheide nach § 57 Abs. 2 oder nach § 61a Abs. 4, § 61f oder § 63 Abs. 5 in der Sache selbst entscheidet, den Landesjagdbeirat anzuhören."}]},{"id":"96d","title":"Oberbehörde","body":[{"lvl":0,"sym":"","t":"In den Angelegenheiten nach § 81a, mit denen die Kärntner Jägerschaft nach diesem Gesetz beliehen wurde, ist die Landesregierung die sachlich in Betracht kommende Oberbehörde."}]},{"id":"97","title":"Mitwirkung der Bundespolizei","body":[{"lvl":0,"sym":"","t":"Die Organe des Wachkörpers Bundespolizei haben bei der Vollziehung der Ahndung von Übertretungen der §§ 36 Abs. 1, 2 und 4, 41 Abs. 1, 54a Abs. 1, 68 Abs. 1, ausgenommen Z 8a, 19 und 23, 69 Abs. 1 und 2 und 70 Abs. 2 mitzuwirken durch"},{"lvl":1,"sym":"a)","t":"Vorbeugungsmaßnahmen gegen drohende Verwaltungsübertretungen,"},{"lvl":1,"sym":"b)","t":"Maßnahmen, die für die Einleitung von Verwaltungsstrafverfahren erforderlich sind."}]}]},{"nr":13,"title":"Straf- und Übergangsbestimmungen","paras":[{"id":"98","title":"Strafbestimmungen","body":[{"lvl":0,"sym":"(1)","t":"Eine Verwaltungsübertretung begeht, soweit die Tat nicht den Tatbestand einer in die Zuständigkeit der Gerichte fallenden strafbaren Handlung bildet, wer"},{"lvl":1,"sym":"1.","t":"die Bestimmungen der §§ 3 Abs. 1, 8 Abs. 7, 15 Abs. 4 und 6, 36 Abs. 1 bis 4, 40 Abs. 1, 4 und 5, 41 Abs. 1 bis 4, 43 Abs. 1, 3 und 4, 44 Abs. 2, 45 Abs. 1, 49 Abs. 2 und 4, 51 Abs. 6, 54, 55b Abs. 3 und 4, 57 Abs. 9, 57a Abs. 1 und 3, 58 Abs. 1 und 2, 59 Abs. 1, 3 und 4, 60 Abs. 1, 61 Abs. 1, 61a Abs. 1, 3 und 4, § 61 b bis 61d, 62 Abs. 2, 63 Abs. 7, 66, 67 Abs. 1, 2 und 4, 68 Abs. 1 bis 1b, 69 Abs. 1 bis 3 und 5, 70 Abs. 1, 1b und 2 sowie 73 Abs. 1 und 2 übertritt;"},{"lvl":1,"sym":"2.","t":"die auf Grund der Bestimmungen der §§ 8 Abs. 3, 8 und 10, 40 Abs. 6, 53, 57a Abs. 2, 61a Abs. 2, 63 Abs. 5, 68 Abs. 1b und 4 bis 6, 69 Abs. 4, 71 Abs. 2, 72 Abs. 1 und 72a erlassenen Verordnungen bzw. Anordnungen übertritt;"},{"lvl":1,"sym":"3.","t":"keinen geeigneten Bevollmächtigten namhaft macht (§ 2 Abs. 3);"},{"lvl":1,"sym":"4.","t":"entfällt;"},{"lvl":1,"sym":"5.","t":"Gehege vor Wirksamkeit der Anzeige oder abweichend von der Anzeige anlegt oder betreibt (§ 8 Abs. 3) oder den Verständigungspflichten des § 8 Abs. 8 nicht nachkommt;"},{"lvl":1,"sym":"6.","t":"Gehege gegen benachbarte Grundstücke nicht vollkommen abschließt oder abgeschlossen hält;"},{"lvl":1,"sym":"7.","t":"die Jagd unzulässigerweise ausübt, wo die Jagd ruht (§ 15);"},{"lvl":1,"sym":"8.","t":"Jagdpachtverträge nicht binnen acht Tagen nach ihrem Abschluß der Bezirksverwaltungsbehörde vorlegt (§ 16 Abs. 3);"},{"lvl":1,"sym":"9.","t":"das Jagdausübungsrecht ohne Bewilligung unterverpachtet (§ 20);"},{"lvl":1,"sym":"9a.","t":"eine unrichtige Erklärung nach § 38 Abs. 2 abgibt;"},{"lvl":1,"sym":"10.","t":"entfällt;"},{"lvl":1,"sym":"11.","t":"ohne Genehmigung Jagdgebiete durch gemeinsame Jagdschutzorgane beaufsichtigen läßt (§ 44 Abs. 4);"},{"lvl":1,"sym":"12.","t":"entfällt;"},{"lvl":1,"sym":"13.","t":"als Jagdschutzorgan, als Jagdausübungsberechtigter oder als von diesem Ermächtigter Hunde und Katzen entgegen den Bestimmungen des § 49 Abs. 1 tötet;"},{"lvl":1,"sym":"14.","t":"Maßnahmen nach § 49 Abs. 1 setzt, ohne hiezu berechtigt zu sein;"},{"lvl":1,"sym":"15.","t":"ohne Bewilligung oder entgegen einer Bewilligung Maßnahmen nach § 52 Abs. 2, 3 oder 3a trifft;"},{"lvl":1,"sym":"16.","t":"der Pflicht zum Abschuß sowie zur Anzeige und Vorlage gemäß § 52 Abs. 4 nicht nachkommt;"},{"lvl":1,"sym":"17.","t":"entgegen dem Verbot des § 54a Abs. 1 oder ohne Bewilligung oder abweichend von einer Bewilligung Taggreifvögel oder Eulen hält oder den Meldepflichten des § 54a nicht nachkommt;"},{"lvl":1,"sym":"18.","t":"die gemäß § 56 festgelegten Grundsätze bei der Erfüllung des Abschußplanes nicht einhält;"},{"lvl":1,"sym":"19.","t":"dem Hegeringleiter die Angaben nach § 57 Abs. 1 und 4 nicht rechtzeitig macht;"},{"lvl":1,"sym":"19a.","t":"entgegen § 57 Abs. 10 einem Jagdschutzorgan den Inhalt des Abschussplans nicht zur Kenntnis bringt;"},{"lvl":1,"sym":"20.","t":"Rotwildfütterungsanlagen vor Wirksamkeit der Anzeige oder abweichend von der Anzeige errichtet oder betreibt (§ 63 Abs. 5);"},{"lvl":1,"sym":"21.","t":"in einem Jagdgebiet Einsprünge errichtet oder aufrecht erhält (§ 63 Abs. 1);"},{"lvl":1,"sym":"22.","t":"bei Benützung des Jägernotweges Schußwaffen nicht ungeladen bzw. nicht gebrochen, Hunde nicht an der Leine und Beizvögel nicht gesichert mitführt (§ 64);"},{"lvl":1,"sym":"23.","t":"gegen die Bestimmungen des § 65 über die Wildfolge verstößt;"},{"lvl":1,"sym":"23a.","t":"ohne Bewilligung nach § 68 Abs. 3 oder abweichend von der Bewilligung Abzugeisen verwendet;"},{"lvl":1,"sym":"23b.","t":"Abzugeisen nicht in den frühen Morgenstunden und vor Einbruch der Dämmerung - sind Abzugeisen in Fangbunkern aufgestellt, nicht in den frühen Morgenstunden - kontrolliert (§ 68 Abs. 3a lit. a);"},{"lvl":1,"sym":"23c.","t":"Abzugeisen ohne Kennzahl (§ 68 Abs. 3b) oder nicht funktionierende Abzugeisen verwendet;"},{"lvl":1,"sym":"23d.","t":"den Meldepflichten des § 68 Abs. 3 nicht nachkommt;"},{"lvl":1,"sym":"23e.","t":"entgegen § 68 Abs. 3c die Kennzeichnung unterläßt;"},{"lvl":1,"sym":"24.","t":"den Bestimmungen des § 70 über die Anbringung und Beseitigung der Kennzeichnung des gesperrten Gebietes zuwiderhandelt;"},{"lvl":1,"sym":"25.","t":"das Wild von Kulturen durch freilaufende Hunde oder sonst ungeeignete Maßnahmen abhält (§ 71 Abs. 1);"},{"lvl":1,"sym":"26.","t":"ohne Genehmigung Wild in Gebieten, in denen es nicht heimisch ist, aussetzt (§ 73 Abs. 3)."},{"lvl":0,"sym":"(2)","t":"Wer eine Verwaltungsübertretung begeht, ist - sofern die Tat nicht den Gegenstand einer in die Zuständigkeit der Gerichte fallenden strafbaren Handlung bildet - von der Bezirksverwaltungsbehörde mit Geldstrafe bis zu 1450 Euro zu bestrafen."},{"lvl":0,"sym":"(3)","t":"Bei Vorliegen erschwerender Umstände, insbesondere wenn durch die Übertretung ein erheblicher jagdwirtschaftlicher Nachteil eingetreten oder der Täter schon einmal wegen der gleichen strafbaren Handlung bestraft worden ist, ist der Täter mit einer Geldstrafe bis zu 2180 Euro zu bestrafen."},{"lvl":0,"sym":"(4)","t":"Im Straferkenntnis kann auch auf den Verlust der Fähigkeit zum Besitz einer Jagdkarte auf höchstens fünf Jahre oder auf Verlust der Jagdkarte erkannt werden."},{"lvl":0,"sym":"(5)","t":"Der Versuch ist strafbar."},{"lvl":0,"sym":"(6)","t":"Von jedem rechtskräftigen Straferkenntnis hat die Bezirksverwaltungsbehörde die Kärntner Jägerschaft in Kenntnis zu setzen."}]},{"id":"99","title":"Verfall von Gegenständen","body":[{"lvl":0,"sym":"(1)","t":"Wird Wild widerrechtlich gefangen oder erlegt oder entgegen der Bestimmung des § 54 in Verkehr gebracht oder werden Taggreifvögel und Eulen ohne Bewilligung oder abweichend von einer Bewilligung nach § 54a gehalten, hat die Bezirksverwaltungsbehörde in einem Straferkenntnis auf den Verfall des Wildes oder von Teilen desselben, wie Trophäen u. dgl. zu erkennen. Gleiches gilt hinsichtlich der widerrechtlich angeeigneten oder versendeten Eier des Federwildes."},{"lvl":0,"sym":"(2)","t":"Bei Übertretungen der §§ 65 Abs. 4 lit. d, 68 Abs. 1 Z 1 bis 4, 6, 8, 9 und 10 und 69 Abs. 1 sowie bei Verwaltungsübertretungen nach § 98 Abs. 1 Z 23a bis 23e hat die Bezirksverwaltungsbehörde in einem Straferkenntnis auf den Verfall der verbotenen oder widerrechtlich mitgeführten oder gebrauchten Waffen und Geräte samt Zubehör zu erkennen. Waffenpolizeiliche Bestimmungen des Bundes werden durch diese Regelung nicht berührt."},{"lvl":0,"sym":"(3)","t":"Als verfallen erklärte Schußwaffen, Tiere und Geräte sind im Wege der öffentlichen Feilbietung zu verwerten. Besitzen sie wissenschaftliche oder künstlerische Bedeutung, sind sie an ein Museum abzugeben. Als verfallen erklärtes lebendes Wild ist der Kärntner Jägerschaft zu übergeben. Es ist nach Möglichkeit in die freie Wildbahn zu entlassen; ist dies nicht möglich, ist es an geeignete Einrichtungen zu veräußern; ist auch dieses nicht möglich, ist es schmerzlos zu töten und das Wildbret über den Wildbrethandel zu veräußern. Erlaubte Schußwaffen dürfen nur an befugte Büchsenmacher oder Waffenhändler, Jagdwaffen auch an Inhaber von Jagdkarten veräußert werden. Als verfallen erklärte Trophäen sind der Kärntner Jägerschaft zu Lehrzwecken zur Verfügung zu stellen. Für verfallen erklärte Trophäen sind von der Kärntner Jägerschaft dauerhaft als “verfallen” zu kennzeichnen. Die Verpflichtung der Kärntner Jägerschaft zur Aufbewahrung dieser Trophäen endet nach Ablauf von zwölf Jahren nach Rechtskraft der Verfallserklärung. Als verfallen erklärtes Wildbret ist über den Wildbrethandel zu veräußern."},{"lvl":0,"sym":"(4)","t":"Die Landesregierung kann auf Antrag nach Ablauf von zehn Jahren - in besonders berücksichtigungswürdigen Fällen nach Ablauf von drei Jahren - nach Anhörung der Kärntner Jägerschaft Trophäen dem Erleger des Wildes oder seinen Erben gnadenweise unentgeltlich überlassen, wenn bei der Erlegung des Wildes weder vorsätzlich noch grob fahrlässig Grundsätze der Weidgerechtigkeit verletzt worden sind und der Erleger seither weder vorsätzlich noch grob fahrlässig gegen diese Grundsätze verstoßen hat."}]},{"id":"100","title":"Schadenersatz","body":[{"lvl":0,"sym":"(1)","t":"Im Straferkenntnis ist auf Antrag auch über die Verpflichtung zum Ersatz des durch die strafbare Handlung verursachten Schadens zu erkennen (§ 57 VStG 1950)."},{"lvl":0,"sym":"(2)","t":"Über den Ersatz von Wild- und Jagdschaden darf im Verwaltungsstrafverfahren nicht erkannt werden."}]},{"id":"100a","title":"Umsetzung von Unionsrecht","body":[{"lvl":0,"sym":"","t":"Mit diesem Gesetz werden nachstehende Unionsrechtsakte umgesetzt:"},{"lvl":1,"sym":"1.","t":"Richtlinie 92/43/EWG des Rates vom 21. Mai 1992 zur Erhaltung der natürlichen Lebensräume sowie der wildlebenden Tiere und Pflanzen, ABl. Nr. L 206 vom 27.7.92, S 7, zuletzt in der Fassung der Richtlinie 2013/17/EU des Rates vom 13. Mai 2013, ABl. Nr. L 158 vom 10.6.2013, S 193 (FFH-Richtlinie);"},{"lvl":1,"sym":"2.","t":"Richtlinie 2009/147/EG des Europäischen Parlaments und des Rates vom 30. November 2009 über die Erhaltung der wildlebenden Vogelarten, in der Fassung der Verordnung (EU) 2019/1010 des Europäischen Parlaments und des Rates vom 5. Juni 2019, ABl. Nr. L 170 vom 25.6.2019,S 115 (Vogelschutz-Richtlinie);"},{"lvl":1,"sym":"3.","t":"Richtlinie (EU) 2021/1883 über die Bedingungen für die Einreise und den Aufenthalt von Drittstaatsangehörigen zur Ausübung einer hoch qualifizierten Beschäftigung und zur Aufhebung der Richtlinie 2009/50/EG des Rates, ABl. Nr. L 382 vom 28.10.2021, S 1."}]}]},{"nr":14,"title":"Übergangsrecht","paras":[{"id":"Artikel II","title":"(LGBl Nr 13/2018)","body":[{"lvl":1,"sym":"2.","t":"(1)Soweit in den folgenden Absätzen nicht anderes bestimmt ist, tritt dieses Gesetz an dem der Kundmachung folgenden Monatsersten in Kraft."},{"lvl":0,"sym":"(2)","t":"Rehwild- und Muffelwildfütterungsanlagen, die im Zeitpunkt des Inkrafttretens dieses Gesetzes bestehen und die den Vorgaben gemäß § 63 Abs. 5 Z 1 und 2 K-JG in der Fassung des Art. I Z 47 widersprechen, sind bis spätestens ein Jahr ab dem Zeitpunkt des Inkrafttretens dieses Gesetzes so zu ändern, dass sie diesen Vorgaben nicht mehr widersprechen; ist dies nicht möglich, so sind sie bis zu diesem Zeitpunkt zu beseitigen."},{"lvl":0,"sym":"(3)","t":"Die §§ 74 und 75 K-JG in der Fassung des Art. I Z 55, 57 und 58 sind auf Schäden anzuwenden, die nach dem Zeitpunkt des Inkrafttretens dieses Gesetzes entstanden sind."}]},{"id":"Artikel II","title":"(LGBl Nr 49/2018)","body":[{"lvl":0,"sym":"(1)","t":"§ 23 Abs. 1 Z 2 lit. g K-JG in der Fassung des Gesetzes LGBl. Nr. 13/2018 tritt mit Wirkung vom 1. März 2018 außer Kraft."},{"lvl":0,"sym":"(2)","t":"Die Bezirksverwaltungsbehörde hat die Auflösung eines Jagdpachtvertrages aufgrund des § 23 Abs. 1 Z 2 lit. g K-JG in der Fassung des Gesetzes LGBl. Nr. 13/2018 aufzuheben und die Genehmigung eines wegen der Auflösung aus dem genannten Grund neu abgeschlossenen Jagdpachtvertrages zu widerrufen; dies gilt auch für den Fall gemäß § 16 Abs. 3 letzter Satz K-JG."}]},{"id":"Artikel VII","title":"(LGBl Nr 104/2019) | Inkrafttretens- und Übergangsbestimmungen","body":[{"lvl":0,"sym":"(1)","t":"Dieses Gesetz tritt an dem der Kundmachung folgenden Tag in Kraft."},{"lvl":0,"sym":"(2)","t":"§ 35c K-FG in der Fassung des Art. I Z 1, § 54c K-JG in der Fassung des Art. IV und § 54a | Abs. 1 K-NSG 2002 in der Fassung des Art. VI Z 5 sind nach Maßgabe des Abs. 3 sinngemäß anzuwenden, sofern es sich um Bescheide im Sinne dieser Bestimmungen handelt, die vor dem Tag des Inkrafttretens dieses Gesetzes (Abs. 1) erlassen wurden und die"},{"lvl":1,"sym":"1.","t":"zwischen dem 20. Dezember 2017 und dem Tag des Inkrafttretens dieses Gesetzes in Rechtskraft erwachsen sind oder"},{"lvl":1,"sym":"2.","t":"zwar erlassen, aber noch nicht in Rechtskraft erwachsen waren."},{"lvl":0,"sym":"(3)","t":"Umweltorganisationen, die gemäß § 19 Abs. 7 UVP-G 2000 anerkannt sind und deren Tätigkeitsbereich sich auf das Bundesland Kärnten bezieht, können innerhalb von sechs Wochen nach dem Inkrafttreten dieses Gesetzes verlangen, dass ihnen Bescheide, die ein Verfahren gemäß Abs. 2 Z 1 oder 2 abgeschlossen haben, zugestellt werden. Die Beschwerdefrist an das Landesverwaltungsgericht beginnt mit Zustellung dieser Bescheide. Beschwerden gegen Bescheide gemäß Abs. 2 Z 1 haben keine aufschiebende Wirkung. Die Behörde hat jedoch auf Antrag der beschwerdeführenden Umweltorganisation die aufschiebende Wirkung mit Bescheid zuzuerkennen, wenn nach Abwägung der berührten öffentlichen Interessen und Interessen anderer Parteien mit der Ausübung der durch den angefochtenen Bescheid eingeräumten Berechtigung ein unverhältnismäßiger Nachteil für die Umwelt verbunden wäre. Die Beschwerde gegen einen Bescheid, dem eine aufschiebende Wirkung zuerkannt wurde, hat keine aufschiebende Wirkung."},{"lvl":0,"sym":"(4)","t":"Ein zum Zeitpunkt des Inkrafttretens der Art. I, IV und VI beim Verwaltungsgerichtshof aufgrund der Revision einer nach § 19 Abs. 7 UVP-G 2000 anerkannten Umweltorganisation anhängiges Verfahren ist weiter zu führen, auch wenn der Bescheid, auf den sich die Revision bezieht, vor dem 20. Dezember 2017 in Rechtskraft erwachsen ist."}]},{"id":"Artikel II","title":"(LGBl Nr 70/2020)","body":[{"lvl":0,"sym":"","t":"Art. I tritt mit dem der Kundmachung folgenden Tag mit der Maßgabe in Kraft, dass die erste Veröffentlichung gemäß § 90b Abs. 2 K-JG zu Beginn des Jahres 2021 zu erfolgen hat."}]},{"id":"Artikel III","title":"(LGBl Nr 30/2024) | Inkrafttreten","body":[{"lvl":0,"sym":"","t":"Art. II tritt mit dem Zeitpunkt gemäß Art. I § 10 Abs. 1 in Kraft."},{"lvl":0,"sym":"(1)","t":"Dieses Gesetz tritt an dem auf die Kundmachung folgenden Tag in Kraft, soweit Abs. 2 nicht anderes bestimmt."},{"lvl":0,"sym":"(2)","t":"Art. I Z 42 (betreffend § 58 Abs. 3 und 4 K-JG) ist erst nach Ablauf eines Jahres nach dem in Abs. 1 genannten Zeitpunkt anzuwenden."}]}]}],"knsg":[{"nr":0,"title":"","paras":[{"id":"3","title":"","body":[{"lvl":1,"sym":"c)","t":"Diesem Gesetz unterliegen nicht"},{"lvl":1,"sym":"a)","t":"Maßnahmen zur Abwehr einer unmittelbar drohenden Gefahr für das Leben oder die Gesundheit von Menschen oder zur unmittelbaren Abwehr von Elementarereignissen und Maßnahmen im Zuge von Aufräumungsarbeiten im direkten Zusammenhang mit Elementarereignissen;"},{"lvl":1,"sym":"b)","t":"Maßnahmen im Rahmen von Einsätzen der Organe der öffentlichen Sicherheit und von Rettungsorganisationen einschließlich der Maßnahmen zur Vorbereitung solcher Einsätze sowie Such- und Rettungsmaßnahmen im Sinne des § 135 Luftfahrtgesetz, BGBl Nr 253/1957;"},{"lvl":1,"sym":"c)","t":"Maßnahmen im Zuge eines Einsatzes des Bundesheeres in den Fällen des § 2 Abs. 1 lit. a bis c des Wehrgesetzes 2001, BGBl. I Nr. 146, einschließlich der Maßnahmen zur unmittelbaren Vorbereitung solcher Einsätze sowie der Maßnahmen, die unmittelbar einsatzähnlichen Ausbildungs- und Übungszwecken dienen."}]}]},{"nr":2,"title":"II. Abschnitt | Schutz der Landschaft","paras":[{"id":"4","title":"","body":[{"lvl":0,"sym":"","t":"Folgende Maßnahmen bedürfen im gesamten Landesgebiet einer Bewilligung:"},{"lvl":1,"sym":"a)","t":"die Errichtung von Einbauten, die Verankerung von floßartigen Anlagen sowie von Hausbooten und die Vornahme von Anschüttungen in Seen und Stauseen sowie die Errichtung von baulichen Anlagen, die die Oberfläche solcher Gewässer zumindest zum Teil überragen;"},{"lvl":1,"sym":"b)","t":"die über den Gemeingebrauch und den Eigenbedarf hinausgehende Gewinnung von Steinen, Schotter, Sand oder Lehm und der Abbau von Torf;"},{"lvl":1,"sym":"c)","t":"die Errichtung von Schleppliften und Seilbahnen, soweit diese nicht unter das Güter- und Seilwege-Landesgesetz fallen;"},{"lvl":1,"sym":"d)","t":"der Betrieb von Himmelsstrahlern."}]},{"id":"5","title":"","body":[{"lvl":0,"sym":"(1)","t":"In der freien Landschaft, das ist der Bereich außerhalb von geschlossenen Siedlungen, Gewerbeparks und den zu diesen Bereichen gehörigen besonders gestalteten Flächen, wie Vorgärten, Haus- und Obstgärten und Parkplätzen, bedürfen folgende Maßnahmen einer Bewilligung:"},{"lvl":1,"sym":"a)","t":"die Anlage von Ablagerungsplätzen, Materiallagerplätzen, Lagerplätzen für Autowracks und ähnliches;"},{"lvl":1,"sym":"b)","t":"Abgrabungen und Anschüttungen auf einer Fläche von mehr als 2000 m2, wenn das Niveau überwiegend mehr als einen Meter verändert wird und ähnlich weitreichende Geländeveränderungen;"},{"lvl":1,"sym":"c)","t":"die Errichtung von Anlagen zur Aufbereitung oder Verarbeitung von Lehm, Sand, Schotter, Gestein oder Torf sowie von Anlagen zur Aufbereitung von Mischgut oder Bitumen;"},{"lvl":1,"sym":"d)","t":"die Vornahme von Anschüttungen in Teichen oder sonstigen stehenden Gewässern;"},{"lvl":1,"sym":"e)","t":"Eingriffe in natürliche oder naturnahe Fließgewässer;"},{"lvl":1,"sym":"f)","t":"die Anlage von Schitrassen;"},{"lvl":1,"sym":"g)","t":"die Festlegung von Gelände zur Ausübung von Motorsportarten oder für Modellflugplätze, die Anlage von Start- und Landeflächen für Paragleiten und Drachenfliegen sowie die Anlage von Flugplätzen;"},{"lvl":1,"sym":"h)","t":"die Errichtung von sonstigen Sportanlagen im Grünland auf Flächen ohne gesonderte Festlegung gemäß § 27 Abs. 2 Z 4 Kärntner Raumordnungsgesetz 2021;"},{"lvl":1,"sym":"i)","t":"die Errichtung von Gebäuden, baulichen Anlagen sowie sonstigen Anlagen auf Rädern auf Grundflächen, die im Flächenwidmungsplan als Grünland ausgewiesen sind;"},{"lvl":1,"sym":"k)","t":"die Errichtung, Aufstellung oder Anbringung von Werbeanlagen, Anlagen zur Anbringung von Werbematerial sowie die sonstige Anbringung von Werbung auf ortsfesten und nicht ortsfesten Anlagen;"},{"lvl":1,"sym":"l)","t":"das Aufstellen von Verkaufsständen oder Verkaufswagen."},{"lvl":0,"sym":"(2)","t":"Von den Bestimmungen des Abs. 1 sind ausgenommen:"},{"lvl":1,"sym":"a)","t":"von lit. b und e Maßnahmen im Zuge von Güterweg-, Straßen-, Eisenbahn- sowie Schutz- und Regulierungswasserbauten, wenn in einem Genehmigungsverfahren nach einem anderen Gesetz bereits ein Naturschutzgutachten eingeholt und berücksichtigt wurde;"},{"lvl":1,"sym":"b)","t":"von lit. i"},{"lvl":2,"sym":"1.","t":"Gebäude und sonstige bauliche Anlagen, soweit sie wasserrechtlich bewilligungspflichtig sind;"},{"lvl":2,"sym":"2.","t":"Hochsitze (Hochstände), Wildzäune und Futterstellen im Sinne von § 63 Abs. 1 des Kärntner Jagdgesetzes 2000, sofern sie im Wald, am Waldrand oder im Verband mit Baumgruppen errichtet werden;"},{"lvl":2,"sym":"3.","t":"Gebäude und dazugehörige bauliche Anlagen gemäß § 27 Abs. 2 Z 1 und 2 Kärntner Raumordnungsgesetz 2021, LGBl. Nr. 59, auf den dafür gesondert festgelegten Flächen;"},{"lvl":2,"sym":"4.","t":"Photovoltaikanlagen, soweit sie nach der Kärntner Bauordnung 1996 mitteilungspflichtig sind, und auf als landwirtschaftliche Hofstelle gewidmeten Flächen;"},{"lvl":2,"sym":"5.","t":"Freileitungen mit einer Netzspannung bis 36 kV;"},{"lvl":2,"sym":"6.","t":"Sonstige Anlagen auf Rädern, sofern sie einer zeitgemäßen, auf die naturräumlichen Vorraus-setzungen abgestimmten land- und forstwirtschaftlichen Nutzung zuzurechnen sind."},{"lvl":1,"sym":"c)","t":"von lit. k gewerberechtlich vorgesehene Geschäfts- und Betriebsstättenbezeichnungen und Werbungen im Bereich von Sportstätten;"},{"lvl":1,"sym":"d)","t":"von lit. l die Aufstellung im Rahmen von besonderen Veranstaltungen auf vom Veranstalter zur Verfügung gestellten Flächen."},{"lvl":0,"sym":"","t":"§ 6"},{"lvl":0,"sym":"","t":"Schutz der Alpinregion"},{"lvl":0,"sym":"(1)","t":"In der Region oberhalb der tatsächlichen Grenze des geschlossenen Baumbewuchses im Sinne des § 2 Abs 2 Forstgesetz 1975, BGBl Nr 440 (Alpinregion), sind folgende Maßnahmen bewilligungspflichtig:"},{"lvl":1,"sym":"a)","t":"die Errichtung von Gebäuden und sonstigen baulichen Anlagen;"},{"lvl":1,"sym":"b)","t":"die Errichtung von Freileitungen."},{"lvl":0,"sym":"(2)","t":"In der Alpinregion ist verboten:"},{"lvl":1,"sym":"a)","t":"die Vornahme von geländeverändernden Maßnahmen (Grabungen und Anschüttungen), die Zerstörung der Humusschichte oder die Versiegelung des Bodens durch Asphaltierung, ausgenommen in geringfügigem Ausmaß wie zur Sanierung bestehender Wege, zur Revitalisierung von Almweideflächen (Rückführung von verwaldeten, verbuschten, verstrauchten und verunkrauteten Almflächen in nutzbare Weideflächen durch Roden, Schwenden, Schlägeln oder Mulchen) oder im Zuge von nach Abs 1 bewilligten Maßnahmen."},{"lvl":1,"sym":"b)","t":"die Vornahme von Außenabflügen und Außenlandungen mit motorbetriebenen Luftfahrzeugen, soweit diese nicht im Rahmen der Land- und Forstwirtschaft, der Wildhege, der Ver- und Entsorgung alpiner Schutzhütten oder für Maßnahmen, die nach Abs 1 bewilligt wurden, erforderlich sind."}]},{"id":"7","title":"","body":[{"lvl":0,"sym":"","t":"Im Bereich von Gletschern und ihren Einzugsgebieten ist jede nachhaltige Beeinträchtigung der Landschaft verboten."},{"lvl":0,"sym":"","t":"§ 8"},{"lvl":0,"sym":"","t":"Schutz der Feuchtgebiete"},{"lvl":0,"sym":"(1)","t":"In Moor- und Sumpfflächen, Schilf- und Röhrichtbeständen sowie in Au- und Bruchwäldern ist die Vornahme von Anschüttungen, Entwässerungen, Grabungen und sonstigen den Lebensraum von Tieren und Pflanzen in diesem Bereich nachhaltig gefährdenden Maßnahmen verboten."},{"lvl":0,"sym":"(2)","t":"Für Flächen im Sinne von Abs 1, die bereits seit zehn Jahren als Bauland festgelegt sind und in einem geschlossenen Baugebiet liegen, gelten die Verbote nach Abs 1 nicht."}]},{"id":"9","title":"","body":[{"lvl":0,"sym":"(1)","t":"Bewilligungen im Sinne der §§ 4, 5 Abs. 1 und 6 Abs. 1 dürfen nicht erteilt werden, wenn durch das Vorhaben oder die Maßnahme"},{"lvl":1,"sym":"a)","t":"das Landschaftsbild nachhaltig nachteilig beeinflusst würde,"},{"lvl":1,"sym":"b)","t":"das Gefüge des Haushaltes der Natur im betroffenen Lebensraum nachhaltig beeinträchtigt würde oder"},{"lvl":1,"sym":"c)","t":"der Charakter des betroffenen Landschaftsraumes nachhaltig beeinträchtigt würde."},{"lvl":0,"sym":"(2)","t":"Eine nachhaltige Beeinträchtigung des Gefüges des Haushaltes der Natur liegt vor, wenn durch eine Maßnahme oder ein Vorhaben"},{"lvl":1,"sym":"a)","t":"ein wesentlicher Bestand seltener, gefährdeter oder geschützter Tier- oder Pflanzenarten vernichtet würde,"},{"lvl":1,"sym":"b)","t":"der Lebensraum seltener, gefährdeter oder geschützter Tier- oder Pflanzenarten wesentlich beeinträchtigt oder vernichtet würde oder"},{"lvl":1,"sym":"c)","t":"der Bestand einer seltenen, gefährdeten oder geschützten Biotoptype wesentlich beeinträchtigt oder vernichtet würde."},{"lvl":0,"sym":"(3)","t":"Eine nachhaltige Beeinträchtigung des Charakters des betroffenen Landschaftsraumes ist jedenfalls gegeben, wenn durch eine Maßnahme oder ein Vorhaben"},{"lvl":1,"sym":"a)","t":"eine Zersiedelung eingeleitet oder fortgesetzt würde,"},{"lvl":1,"sym":"b)","t":"eine Verarmung eines durch eine Vielfalt an Elementen gekennzeichneten Landschaftsraumes eintreten würde,"},{"lvl":1,"sym":"c)","t":"der Eindruck der Naturbelassenheit eines Landschaftsraumes wesentlich gestört würde,"},{"lvl":1,"sym":"d)","t":"natürliche Oberflächenformen wie Karstgebilde, Flussterrassen, Flussablagerungen, Gletscherbildungen, Bergstürze, naturnahe Fluss- oder Bachläufe wesentlich geändert würden oder"},{"lvl":1,"sym":"e)","t":"freie Seeflächen durch Einbauten, Anschüttungen und ähnliches wesentlich beeinträchtigt würden oder die Ufervegetation von Gewässern wesentlich aufgesplittert würde."},{"lvl":0,"sym":"(4)","t":"Die Bewilligung von Einbauten oder die Verankerung von floßartigen Anlagen und von Hausbooten in Seen oder Stauseen ist jedenfalls zu versagen, wenn der an die betreffende Gewässerfläche angrenzende Uferbereich nicht als"},{"lvl":2,"sym":"1.","t":"Bauland oder"},{"lvl":2,"sym":"2.","t":"Grünland-Bad, Grünland-Kabinen, Grünland-Liegewiese, Grünland-Bootshafen, Grünland-Schiffsanlegestelle, Grünland-Freizeitanlage oder Grünland-Campingplatz"},{"lvl":0,"sym":"","t":"gewidmet ist. Dies gilt nicht für wasserrechtlich bewilligungspflichtige Änderungen an bestehenden Elektrizitätserzeugungsanlagen an Stauseen."},{"lvl":0,"sym":"(5)","t":"Die Bewilligung des Betriebs von Himmelsstrahlern gemäß § 4 lit. d ist zu versagen, wenn durch diese Tiere erheblich durch Wärme oder Lichteinwirkung gestört oder beeinträchtigt werden können."},{"lvl":0,"sym":"(6)","t":"Die Bewilligung der Anlage einer Schitrasse ist jedenfalls zu versagen, wenn das Gelände auf Grund seiner natürlichen Voraussetzungen für die Ausübung des Schilaufes nicht geeignet ist."},{"lvl":0,"sym":"(6a)","t":"Soweit Hochsitze, Hochstände und Fütterungsanlagen nicht gemäß § 5 Abs. 2 lit. b Z 2 und 3 von der Bewilligungspflicht ausgenommen sind, ist die Bewilligung jedenfalls zu versagen"},{"lvl":1,"sym":"a)","t":"bei Hochsitzen und Hochständen, wenn diese nicht wenigstens an einer Breitseite mindestens zur Hälfte offen sind oder wenn für ihre Errichtung - ausgenommen für die Abdeckung - andere als natürliche Baustoffe, wie Holz, verwendet werden;"},{"lvl":1,"sym":"b)","t":"bei Fütterungsanlagen, soweit es sich nicht um Gebäude handelt, wenn für ihre Errichtung - ausgenommen für die Abdeckung - andere als natürliche Baustoffe, wie Holz, verwendet werden."},{"lvl":0,"sym":"(7)","t":"Eine Versagung einer Bewilligung im Sinne der §§ 4, 5 Abs. 1 und 6 Abs. 1 darf nicht erfolgen, wenn das öffentliche Interesse an den beantragten Maßnahmen unter dem Gesichtspunkt des Gemeinwohles höher zu bewerten ist als das öffentliche Interesse an der Bewahrung der Landschaft vor störenden Eingriffen."},{"lvl":0,"sym":"(8)","t":"Wenn eine Bewilligung auf Grund einer Interessenabwägung nach Abs. 7 erteilt wird, ist durch Auflagen zu bewirken, dass die nachteiligen Wirkungen des Vorhabens möglichst gering gehalten werden. Bei umfangreichen Vorhaben ist zur Sicherung einer fach-, vorschriften- und bewilligungsgemäßen Ausführung eine ökologische Bauaufsicht (§ 47) zu bestellen. Eine nachteilige Beeinflussung des Landschaftsbildes kann durch Vorschreibung einer der umgebenden Landschaft entsprechenden Gestaltung ausgeglichen werden."},{"lvl":0,"sym":"","t":"§ 10"},{"lvl":0,"sym":"","t":"Ausnahmen von den Verboten"},{"lvl":0,"sym":"(1)","t":"Ausnahmen von den Verboten des § 6 Abs 2 dürfen für wissenschaftliche Zwecke oder Erschließungsmaßnahmen bewilligt werden, wenn das öffentliche Interesse an der Maßnahme unter dem Gesichtspunkt des Gemeinwohles höher zu bewerten ist als das öffentliche Interesse an der Bewahrung der Alpinregion vor störenden Eingriffen."},{"lvl":0,"sym":"(2)","t":"Ausnahmen vom Verbot des § 7 dürfen für wissenschaftliche Zwecke, für Zwecke der Trinkwasserversorgung sowie zur Erhaltung oder Erschließung bestehender Anlagen bewilligt werden, wenn das öffentliche Interesse an der Maßnahme unter dem Gesichtspunkt des Gemeinwohles höher zu bewerten ist als das öffentliche Interesse an der Bewahrung der Gletscher und ihrer Einzugsgebiete vor störenden Eingriffen."},{"lvl":0,"sym":"(3)","t":"Ausnahmen von den Verboten des § 8 dürfen bewilligt werden, wenn"},{"lvl":1,"sym":"a)","t":"durch das Vorhaben weder das Landschaftsbild nachteilig beeinflusst würde noch das Gefüge des Haushaltes der Natur im betroffenen Lebensraum oder der Charakter des betroffenen Landschaftsraumes nachhaltig beeinträchtigt würde oder"},{"lvl":1,"sym":"b)","t":"das öffentliche Interesse an der beantragten Maßnahme unter dem Gesichtspunkt des Gemeinwohles höher zu bewerten ist als das öffentliche Interesse an der Bewahrung des Feuchtgebietes vor störenden Eingriffen."},{"lvl":0,"sym":"(4)","t":"§ 9 Abs 8 gilt in jenen Fällen, in denen Bewilligungen im Sinne der Absätze 1, 2 oder 3 lit b erteilt werden, sinngemäß."}]},{"id":"11","title":"","body":[{"lvl":0,"sym":"","t":"Einer Bewilligung bedarf auch jede Änderung nach Art, Lage, Umfang und Verwendungszweck von bewilligungspflichtigen Anlagen im Sinne der §§ 4, 5 Abs. 1 und 6 Abs. 1 sowie von Anlagen, die auf Grund von Ausnahmebewilligungen nach § 10 errichtet wurden. Keiner Bewilligung bedürfen lediglich als geringfügig zu wertende Änderungen."}]},{"id":"12","title":"","body":[{"lvl":0,"sym":"(1)","t":"Wird in Fällen, in denen eine Bewilligung unter Heranziehung des § 9 Abs. 7 oder des § 10 Abs. 1, 2 oder 3 lit. b erteilt wird, durch die bewilligte Maßnahme der Lebensraum seltener, gefährdeter oder geschützter Tier- oder Pflanzenarten wesentlich beeinträchtigt oder vernichtet, so ist dem Antragsteller unter einem die Schaffung eines geeigneten Ersatzlebensraumes vorzuschreiben."},{"lvl":0,"sym":"(2)","t":"Ist eine Vorschreibung nach Abs. 1 nicht möglich oder nicht zumutbar, so hat der Bewilligungswerber einen Geldbetrag zu entrichten, der den Kosten der Schaffung eines geeigneten Ersatzlebensraumes entspricht. Der Geldbetrag ist von der für die Erteilung der Bewilligung zuständigen Behörde unter sinngemäßer Anwendung der Kostenbestimmungen der Verwaltungsverfahrensgesetze vorzuschreiben und einzuheben. Er bildet eine Einnahme des Landes und ist nach Anhörung des Naturschutzbeirates für die Schaffung und Erhaltung von Ersatzlebensräumen zu verwenden. Der Naturschutzbeirat ist überdies berechtigt, derartige Projekte und Maßnahmen vorzuschlagen."},{"lvl":0,"sym":"(3)","t":"Die Landesregierung hat ein Verzeichnis der Ersatzlebensräume zu erstellen und auf dem Laufenden zu halten und dieses in das Naturinventar (§ 45 Abs. 5) aufzunehmen. Dem Verzeichnis sind die Zielarten sowie die zu treffenden Ausführungs- und Pflegemaßnahmen anzuschließen. Die Maßnahmen sind alle fünf Jahre zu überprüfen."},{"lvl":0,"sym":"(4)","t":"Werden aus Mitteln des Landes durch Dritte Liegenschaften für Zwecke des Naturschutzes erworben, so ist vor Zuzählung des Kaufbetrags auf der betroffenen Liegenschaft ein Veräußerungs- und Belastungsverbot sowie ein Vorkaufsrecht zugunsten des Landes einzuverleiben. Dieses wirkt gegen Dritte und bindet auch den Rechtsnachfolger."}]}]},{"nr":3,"title":"III. Abschnitt | Schutz des Erholungsraumes","paras":[{"id":"13","title":"","body":[{"lvl":0,"sym":"","t":"Jede Verunstaltung der freien Landschaft ist verboten. Als Verunstaltung der freien Landschaft gilt insbesondere"},{"lvl":1,"sym":"a)","t":"das Ablagern von Müll, Unrat, Autowracks oder sonstigen Abfällen;"},{"lvl":1,"sym":"b)","t":"entfällt;"},{"lvl":1,"sym":"c)","t":"das Anbringen von Plakaten außerhalb von hiefür vorgesehenen Anlagen, ausgenommen die amtlichen oder die im amtlichen Auftrag vorgenommenen Ankündigungen;"},{"lvl":1,"sym":"d)","t":"das Aufstellen von Zeitungsverkaufsständern oder Zeitungsverkaufsautomaten, ausgenommen im Bereich von Haltestellen öffentlicher Verkehrsmittel."}]},{"id":"14","title":"","body":[{"lvl":0,"sym":"(1)","t":"In der freien Landschaft ist es verboten, mit motorbetriebenen Fahrzeugen außerhalb der für den fließenden oder ruhenden Verkehr bestimmten Flächen zu fahren oder diese dort abzustellen. Das Abstellen von motorbetriebenen Fahrzeugen am Straßenrand ist zulässig. In der Alpinregion (§ 6) umfasst das Verbot des Befahrens auch nicht motorbetriebene Fahrzeuge außerhalb der für diesen Verkehr bestimmten Straßen und Wege."},{"lvl":0,"sym":"(2)","t":"Das Verbot des Abs. 1 gilt nicht"},{"lvl":1,"sym":"a)","t":"für Fahrten von Einsatzfahrzeugen der Bundespolizei, des Bundesheeres und des Feuerlöschdienstes sowie für Fahrten im Rahmen der Gerichtsbarkeit, der Verwaltung und der Seelsorge;"},{"lvl":1,"sym":"b)","t":"für Zwecke des Hilfswesens, des Lawinenwarndienstes und des Wildbach- und Lawinenschutzes;"},{"lvl":1,"sym":"c)","t":"zur Berufsausübung im Rahmen der Land- und Forstwirtschaft;"},{"lvl":1,"sym":"d)","t":"für Zwecke der Hege des Wildes;"},{"lvl":1,"sym":"e)","t":"zur Beförderung von Personen und Sachen zu Betriebsanlagen, Versorgungsanlagen, Wohngebäuden, Wirtschaftsgebäuden, Schutzhütten, Berggasthöfen und Bergstationen, sofern diese nicht anderweitig erreichbar sind;"},{"lvl":1,"sym":"f)","t":"zur Pflege von Pisten und Loipen und zur Organisation von Sportveranstaltungen;"},{"lvl":1,"sym":"g)","t":"für das Abstellen von Kraftfahrzeugen im Zuge von besonderen Veranstaltungen sowie für den befristeten Verkauf von vor Ort geernteten land- und forstwirtschaftlichen Produkten auf den vom Veranstalter oder Verkäufer als Parkraum zur Verfügung gestellten Flächen."},{"lvl":0,"sym":"(3)","t":"Das Verlassen der für den fließenden oder ruhenden Verkehr bestimmten Flächen im Rahmen der Ausnahmebestimmungen des Abs. 2 ist nur im unbedingt erforderlichen Ausmaß zulässig, und es ist dabei darauf zu achten, dass der Erholungswert der Landschaft dadurch möglichst nicht beeinträchtigt wird."}]},{"id":"15","title":"","body":[{"lvl":0,"sym":"(1)","t":"In der freien Landschaft ist es verboten, außerhalb von behördlich bewilligten Campingplätzen und sonstigen im Zusammenhang mit Wohngebäuden stehenden, besonders gestalteten Flächen wie Vorgärten, Haus- und Obstgärten zu zelten oder Wohnwagen abzustellen. Als Wohnwagen gelten auch Wohnmobile."},{"lvl":0,"sym":"(2)","t":"Das Verbot des Abs. 1 gilt nicht für"},{"lvl":1,"sym":"1.","t":"das alpine Biwakieren;"},{"lvl":1,"sym":"2.","t":"die Verwendung eines Wetterschutzes bei der Ausübung der Fischerei unter den Voraussetzungen des Abs. 3;"},{"lvl":1,"sym":"3.","t":"temporäre, nicht mit Ertragsabsicht betriebene Zeltlager im Sinne des Abs. 4;"},{"lvl":1,"sym":"4.","t":"das kurzfristige Abstellen von Wohnwägen auf Flächen, die dem ruhenden Verkehr dienen;"},{"lvl":1,"sym":"5.","t":"Baustelleneinrichtungen."},{"lvl":0,"sym":"(3)","t":"Für Zwecke der Ausübung der Fischerei dürfen die nach den Vorschriften des Kärntner Fischereigesetzes zur Ausübung des Fischfanges im jeweiligen Fischereirevier Berechtigten auf dem Uferstreifen einen Wetterschutz oder einen Schirm in der für die Ausübung der Fischerei notwendigen Art und Ausführung verwenden. Die Landesregierung hat mit Verordnung nähere Bestimmungen über die Beschaffenheit und Abmessungen von Wetterschutz und Schirmen, die vom Verbot des Abs. 1 ausgenommen sind, sowie über eine allfällige Mitbenützung durch Dritte zu erlassen."},{"lvl":0,"sym":"(4)","t":"Als temporäre Zeltlager gelten"},{"lvl":1,"sym":"1.","t":"Zeltlager von gemeinnützigen Jugendorganisationen,"},{"lvl":1,"sym":"2.","t":"Zeltlager im Rahmen der öffentlichen Jugendbetreuung und"},{"lvl":1,"sym":"3.","t":"Zeltlager im Rahmen von öffentlichen, ohne Ertragsabsicht durchgeführten Freiluft-veranstaltungen,"},{"lvl":0,"sym":"","t":"die für nicht länger als drei Tage auf Sportanlagen, Veranstaltungsgeländen oder ähnlichen Zwecken gewidmeten Flächen errichtet werden. Die Errichtung eines temporären Zeltlagers ist mit der Namhaftmachung eines Verantwortlichen gemäß § 9 VStG spätestens eine Woche vor dessen Errichtung dem Bürgermeister und der Bezirksverwaltungsbehörde anzuzeigen. Der Verantwortliche hat dafür zu sorgen, dass den Erfordernissen der Hygiene (Trinkwasser und Waschgelegenheit, schadlose Abwasser- und Müllbeseitigung sowie Aborte) Rechnung getragen wird. Bei Veranstaltungen, bei denen dies auf Grund der zu erwartenden Teilnehmeranzahl erforderlich ist, darf die Bezirksverwaltungsbehörde die zur Sicherstellung der Erfordernisse der Hygiene erforderlichen Auflagen mit Bescheid vorschreiben."}]},{"id":"16","title":"","body":[{"lvl":0,"sym":"","t":"Wenn es zum Schutze von Gebieten, die der Erholung dienen, oder wenn es zum Schutze des Haushaltes der Natur erforderlich ist, hat die Bezirksverwaltungsbehörde mit Verordnung zu bestimmen, wo und in welchem Umfang das freie Baden verboten ist."}]}]},{"nr":4,"title":"IV. Abschnitt | Schutz von Pflanzen und Tieren","paras":[{"id":"17","title":"","body":[{"lvl":0,"sym":"(1)","t":"Wildwachsende Pflanzen dürfen nicht mutwillig beschädigt oder vernichtet werden. Die Bestimmungen für Pflanzen gelten im Rahmen dieses Gesetzes auch für Pilze."},{"lvl":0,"sym":"(2)","t":"Freilebende, nicht als Wild geltende und nicht dem Fischereirecht unterliegende Tiere samt allen ihren Entwicklungsformen dürfen weder mutwillig beunruhigt, verfolgt, gehalten, verletzt oder getötet werden. Der Lebensraum solcher Tiere (Nist-, Brut- und Laichplätze, Einstände) ist von menschlichen Eingriffen möglichst unbeeinträchtigt zu belassen."},{"lvl":0,"sym":"(3)","t":"Insoweit es zur Erhaltung des Lebensraumes der freilebenden Tiere und der wildwachsenden Pflanzen erforderlich ist, hat die Landesregierung die zur Erhaltung erforderlichen Schutzmaßnahmen durch Verordnung näher festzulegen. Dabei sind die Regelungen über den Artenschutz in Art. 12 ff der FFH-Richtlinie (§ 67a Abs. 3 lit. b) und in Art. 5 ff der Vogelschutz-Richtlinie (§ 67a Abs. 3 lit. a) zu berücksichtigen. Es kann auch angeordnet werden, dass bestimmte Maßnahmen zum Schutze des Lebensraumes von Tieren und Pflanzen zu setzen oder zu unterlassen sind, wie insbesondere"},{"lvl":1,"sym":"a)","t":"das Abbrennen, Schlägern, Roden, Beseitigen oder sonstige Zerstören von Buschwerk, Hecken, Röhricht-, Schilf- oder Trockengrasbeständen,"},{"lvl":1,"sym":"b)","t":"das Beseitigen oder Zerstören der Humusdecke,"},{"lvl":1,"sym":"c)","t":"das Beseitigen der Bachbegleit- oder Ufervegetation oder"},{"lvl":1,"sym":"d)","t":"die Vornahme von Düngungen."},{"lvl":0,"sym":"","t":"§ 18"},{"lvl":0,"sym":"","t":"Besonderer Pflanzenartenschutz"},{"lvl":0,"sym":"(1)","t":"Jene Arten wildwachsender Pflanzen, deren Bestand gefährdet oder aus Gründen der Erhaltung eines ausgeglichenen Naturhaushaltes zu sichern ist, können von der Landesregierung durch Verordnung vollkommen oder teilweise geschützt werden. Die im Anhang IV lit b der FFH-Richtlinie eingetragenen Pflanzenarten sind durch Verordnung als vollkommen geschützte Pflanzenarten auszuweisen, wobei sich der Schutz nicht heimischer Arten auf das Verbot des Feilbietens, des Erwerbs und der Weitergabe beschränken darf."},{"lvl":0,"sym":"(2)","t":"Vollkommen geschützte Pflanzen dürfen weder ausgegraben, von ihrem Standort entfernt, beschädigt oder vernichtet, noch in frischem oder getrocknetem Zustand erworben, weitergegeben, befördert oder feilgeboten werden. Auch darf nicht die Bereitschaft zum Erwerb solcher Pflanzen öffentlich angekündigt werden. Der Schutz bezieht sich auf sämtliche unter- und oberirdische Pflanzenteile."},{"lvl":0,"sym":"(3)","t":"Der teilweise Schutz von Pflanzen umfasst das Verbot, unterirdische Teile von ihrem Standort zu entfernen. Für oberirdische Teile ist in der Verordnung nach Abs 1 festzulegen, in welchen Mengen oder unter welchen Bedingungen diese von ihrem Standort entfernt werden dürfen, und inwieweit der Erwerb, die Weitergabe, Beförderung oder das Feilbieten zur Erreichung der Ziele nach Abs 1 Beschränkungen unterliegt."},{"lvl":0,"sym":"(4)","t":"In einer Verordnung nach Abs 1 sind festzulegen:"},{"lvl":1,"sym":"a)","t":"die vollkommen und teilweise geschützten Pflanzenarten;"},{"lvl":1,"sym":"b)","t":"das Gebiet und der Zeitraum, für welche die Pflanzenarten unter Schutz gestellt werden;"},{"lvl":1,"sym":"c)","t":"Maßnahmen, die zum Schutze des Nachwuchses oder der Nachzucht der geschützten Pflanzen zu setzen sind;"},{"lvl":1,"sym":"d)","t":"Maßnahmen, die zum Schutze des Lebensraumes der geschützten Pflanzen zu treffen sind."},{"lvl":0,"sym":"(5)","t":"Maßnahmen im Sinne des Abs 4 lit c und d können von der Landesregierung im Einzelfall durch Bescheid verfügt werden, wenn es zum Schutze von Pflanzenarten im Sinne des Abs 1 erforderlich ist."},{"lvl":0,"sym":"","t":"§ 19"},{"lvl":0,"sym":"","t":"Besonderer Tierartenschutz"},{"lvl":0,"sym":"(1)","t":"Jene Arten freilebender, nicht als Wild geltender und nicht dem Fischereirecht unterliegender Tiere, deren Bestand gefährdet oder aus Gründen der Erhaltung eines ausgeglichenen Naturhaushaltes zu sichern ist, können von der Landesregierung durch Verordnung vollkommen oder teilweise geschützt werden. Die im Anhang IV lit a der FFH-Richtlinie eingetragenen Tierarten sind durch Verordnung als vollkommen geschützte Tierarten auszuweisen, wobei sich der Schutz nicht heimischer Arten auf das Verbot des Feilbietens, des Erwerbs und der Weitergabe beschränken darf."},{"lvl":0,"sym":"(2)","t":"Vollkommen geschützte Tiere dürfen in allen ihren Entwicklungsformen weder verfolgt, beunruhigt, gefangen, befördert, gehalten oder getötet werden. Das Feilbieten sowie der Erwerb und die Weitergabe solcher Tiere oder Teile von solchen Tieren ist ohne Rücksicht auf Zustand, Alter oder Entwicklungsform verboten. Auch darf nicht die Bereitschaft zum Erwerb solcher Tiere öffentlich angekündigt werden."},{"lvl":0,"sym":"(3)","t":"Das Entfernen, Beschädigen oder Zerstören von Brutstätten vollkommen geschützter Tiere ist verboten. In der freien Landschaft ist das Beunruhigen, Zerstören oder Verändern des Lebensraumes (zB Nistplatzes, Einstandes) vollkommen geschützter Tiere verboten."},{"lvl":0,"sym":"(4)","t":"Die Schutzbestimmungen für teilweise geschützte Tierarten sind nach Maßgabe der Bestimmungen in Abs 5 in der Verordnung nach Abs 1 festzulegen."},{"lvl":0,"sym":"(5)","t":"In einer Verordnung nach Abs 1 sind festzulegen:"},{"lvl":1,"sym":"a)","t":"die vollkommen und teilweise geschützten Tierarten;"},{"lvl":1,"sym":"b)","t":"das Gebiet und der Zeitraum, für welche die Tierarten unter Schutz gestellt werden;"},{"lvl":1,"sym":"c)","t":"jene Maßnahmen und Fangmethoden, die zum Zwecke des Schutzes des Bestandes von Tieren verboten sind;"},{"lvl":1,"sym":"d)","t":"Maßnahmen, die zum Schutze des Nachwuchses oder der Nachzucht der geschützten Tiere zu setzen sind und"},{"lvl":1,"sym":"e)","t":"Maßnahmen, die zum Schutze des Lebensraumes der geschützten Tiere zu treffen sind."},{"lvl":0,"sym":"(6)","t":"Maßnahmen im Sinne des Abs 5 lit d und e können von der Landesregierung im Einzelfall durch Bescheid verfügt werden, wenn es zum Schutze von Tierarten im Sinne des Abs 1 erforderlich ist."}]},{"id":"20","title":"","body":[{"lvl":0,"sym":"","t":"Insoweit es zur Sicherung eines nachhaltigen Bestandes jener Pflanzen- und Tierarten, welche nicht vollkommen oder teilweise geschützt sind, erforderlich ist, kann die Landesregierung durch Verordnung das erwerbsmäßige Sammeln, Feilbieten und Handeln sowie die Weitergabe und Beförderung solcher Pflanzen und Tiere verbieten, auf bestimmte Zeit oder mengenmäßig beschränken oder von einer Bewilligung der Landesregierung abhängig machen."}]},{"id":"21","title":"","body":[{"lvl":0,"sym":"(1)","t":"Das Aussetzen oder Aussäen wildwachsender Pflanzen und das Aussetzen freilebender Tiere, die nicht als Wild gelten oder dem Fischereirecht unterliegen, in Gebieten, in denen sie nicht heimisch sind, bedarf der Genehmigung. Eine Genehmigung darf nur erteilt werden, wenn weder die natürlichen Lebensräume in ihrem natürlichen Verbreitungsgebiet noch die einheimischen wildlebenden Tier- und Pflanzenarten geschädigt werden."},{"lvl":0,"sym":"(2)","t":"Abs. 1 gilt unbeschadet der Maßnahmen gemäß der Verordnung (EU) Nr. 1143/2014 über die Prävention und das Management invasiver gebietsfremder Arten."},{"lvl":0,"sym":"","t":"§ 22"},{"lvl":0,"sym":"","t":"Ausnahmen"},{"lvl":0,"sym":"(1)","t":"Maßnahmen, die der zeitgemäßen, auf die naturräumlichen Voraussetzungen abgestimmten land- und forstwirtschaftlichen Nutzung zuzurechnen sind, bleiben von den Bestimmungen des § 20 und den auf Grund dieser Bestimmungen erlassenen Verordnungen unberührt."},{"lvl":0,"sym":"(2)","t":"Von den Bestimmungen der §§ 17 bis 21 und den auf Grund dieser Bestimmungen erlassenen Verordnungen können unter Berücksichtigung der Ausnahmetatbestände des Art. 9 der Vogelschutzrichtlinie und des Art. 16 der FFH-Richtlinie, sofern es keine andere zufriedenstellende Lösung gibt, Ausnahmen genehmigt werden, sofern die Populationen der natürlichen Arten in ihrem natürlichen Verbreitungsgebiet trotzdem in einem günstigen Erhaltungszustand verbleiben."},{"lvl":0,"sym":"","t":"V. Abschnitt"},{"lvl":0,"sym":"","t":"Schutz besonderer Gebiete"},{"lvl":0,"sym":"","t":"§ 23"},{"lvl":0,"sym":"","t":"Naturschutzgebiete"},{"lvl":0,"sym":"(1)","t":"Gebiete,"},{"lvl":1,"sym":"a)","t":"die sich durch völlige oder weitgehende Ursprünglichkeit auszeichnen,"},{"lvl":1,"sym":"b)","t":"die seltene oder gefährdete Tier- oder Pflanzenarten beherbergen,"},{"lvl":1,"sym":"c)","t":"die seltene oder gefährdete Lebensgemeinschaften von Tieren oder Pflanzen aufweisen oder"},{"lvl":1,"sym":"d)","t":"in denen seltene oder wissenschaftlich interessante Mineralien, Fossilien oder Karsterscheinungen vorkommen, können durch Verordnung der Landesregierung zu Naturschutzgebieten erklärt werden."},{"lvl":0,"sym":"(2)","t":"Soweit die Umgebung von Gebieten im Sinne des Abs 1 für deren Erscheinungsbild und deren Erhaltung oder für die Sicherung des Schutzzweckes wesentliche Bedeutung hat, kann sie in das Schutzgebiet einbezogen werden."},{"lvl":0,"sym":"","t":"§ 24"},{"lvl":0,"sym":"","t":"Schutzbestimmungen"},{"lvl":0,"sym":"(1)","t":"In Verordnungen nach § 23 Abs 1 sind Art und Umfang der Schutzbestimmungen, welche für das jeweilige Naturschutzgebiet gelten, festzulegen."},{"lvl":0,"sym":"(2)","t":"Die Schutzbestimmungen sind so zu gestalten, dass jene Umstände, welche für die Erklärung zum Naturschutzgebiet Anlass geben (§ 23 Abs 1), möglichst umfassend gesichert werden. Hiebei kann die Landesregierung, wenn es zur Erreichung des Schutzzweckes erforderlich ist, jeden menschlichen Eingriff in das Schutzgebiet, einschließlich des Betretens, untersagen. Für die zeitgemäße, auf die naturräumlichen Voraussetzungen abgestimmte land- und forstwirtschaftliche Nutzung sowie die rechtmäßige Ausübung der Jagd und der Fischerei sind insoweit Ausnahmebestimmungen vorzusehen, als damit keine nachhaltige Beeinträchtigung des Schutzzweckes verbunden ist."},{"lvl":0,"sym":"(3)","t":"Eingriffe in ein Naturschutzgebiet dürfen nur dann bewilligt werden, wenn das öffentliche Interesse am in Aussicht genommenen Eingriff in das Naturschutzgebiet unter dem Gesichtspunkt des Gemeinwohles höher zu bewerten ist als das öffentliche Interesse an der unversehrten Erhaltung des Naturschutzgebietes und außerdem eine nachhaltige Beeinträchtigung der mit der Unterschutzstellung verfolgten Ziele nicht zu erwarten ist. Die §§ 9 Abs 8 und 11 gelten sinngemäß."}]},{"id":"24a","title":"Europaschutzgebiete","body":[{"lvl":0,"sym":"(1)","t":"Gebiete, die zur Bewahrung, Entwicklung oder Wiederherstellung eines günstigen Erhaltungszustandes"},{"lvl":1,"sym":"a)","t":"der in ihnen vorkommenden natürlichen Lebensraumtypen des Anhanges I oder der Pflanzen- und Tierarten des Anhanges II der FFH-Richtlinie oder"},{"lvl":1,"sym":"b)","t":"der in ihnen vorkommenden Vogelarten des Anhanges I der Vogelschutz-Richtlinie und der regelmäßig auftretenden Zugvogelarten nach Art. 4 Abs. 2 derselben Richtlinie und ihrer Lebensräume geeignet"},{"lvl":0,"sym":"","t":"und im Sinne von Art. 1 lit. k der FFH-Richtlinie von gemeinschaftlicher Bedeutung sind, sind durch Verordnung der Landesregierung als Europaschutzgebiete auszuweisen. Europaschutzgebiete sind besondere Schutzgebiete im Sinne von Art. 1 lit. l der FFH-Richtlinie."},{"lvl":0,"sym":"(1a)","t":"Der Erhaltungszustand von Gebieten, die nach Abs. 1 als Europaschutzgebiete auszuweisen sind, wird dann als günstig erachtet, wenn für die betroffenen natürlichen Lebensräume und die dort vorkommenden Arten die in Art. 1 lit. e und i der FFH-Richtlinie genannten Voraussetzungen erfüllt sind."},{"lvl":0,"sym":"(2)","t":"In Verordnungen nach Abs. 1 sind jedenfalls der die Erhaltungsziele berücksichtigende Schutzzweck sowie die erforderlichen Gebote, Verbote, Bewilligungsvorbehalte und die nötigen Erhaltungsmaßnahmen festzulegen, die sicherstellen, dass eine Verschlechterung der natürlichen Lebensräume und eine erhebliche Störung jener Tier- und Pflanzenarten vermieden wird, für die nach dem Schutzzweck ein günstiger Erhaltungszustand gesichert oder wiederhergestellt werden soll. Dies gilt insbesondere für Arten von gemeinschaftlichem Interesse im Sinne von Art. 1 lit. g der FFH-Richtlinie."},{"lvl":0,"sym":"(3)","t":"Die Festlegung von Geboten, Verboten, Bewilligungsvorbehalten und Erhaltungsmaßnahmen in Verordnungen nach Abs. 1 darf unterbleiben, insoweit durch Verordnungen nach § 23 oder § 25 oder das Kärntner Nationalparkgesetz und die dazu erlassenen Verordnungen ein ausreichender Schutz gewährleistet ist."}]},{"id":"24b","title":"","body":[{"lvl":0,"sym":"(1)","t":"Pläne und Projekte, die sich auf Europaschutzgebiete beziehen und nicht unmittelbar mit deren Verwaltung in Verbindung stehen, die diese aber einzeln oder im Zusammenwirken beeinträchtigen können, sind auf ihre Verträglichkeit mit den für diese Gebiete festgelegten Erhaltungszielen zu überprüfen. Die Umsetzung darf unter Berücksichtigung der Ergebnisse der Verträglichkeitsprüfung nur bewilligt werden, wenn sie das Gebiet als solches nicht erheblich beeinträchtigen und erforderlichenfalls eine öffentliche Anhörung erfolgt ist."},{"lvl":0,"sym":"(1a)","t":"Bei Plänen und Projekten gemäß Abs. 1 erster Satz und Abs. 5, die nicht den Bestimmungen des Kärntner Umweltplanungsgesetzes unterliegen, ist der verfahrenseinleitende Antrag mit den zur Ausübung des Stellungnahmerechts gemäß Abs. 1b erforderlichen Angaben auf der elektronischen Plattform gemäß § 54a Abs. 2 bereitzustellen. Ab dem Tag der Bereitstellung ist den Umwelt-organisationen gemäß § 54a Abs. 1 Einsicht in den Verwaltungsakt zu gewähren. § 54a Abs. 3 letzter Satz ist anzuwenden."},{"lvl":0,"sym":"(1b)","t":"Innerhalb von vier Wochen ab dem Tag der Bereitstellung des verfahrenseinleitenden Antrags gemäß Abs. 1a können Umweltorganisationen gemäß § 54a Abs. 1 eine begründete Stellungnahme zur Verträglichkeit des Vorhabens im Sinne des Abs. 1 erster Satz abgeben. In diesem Rahmen haben sie auch die Möglichkeit, alle als relevant erachteten Informationen in Schriftform vorzulegen oder während einer allfälligen mündlichen Verhandlung vorzutragen. Diese Stellungnahme ist bei der Entscheidung über Anträge in den gemäß Abs. 2 bis 5 genannten Verfahren zu berücksichtigen. Die Erhebung von Einwendungen steht den Beteiligten jedoch nicht zu."},{"lvl":0,"sym":"(1c)","t":"Die Umweltorganisationen gemäß § 54a Abs. 1 können überdies in den in Abs. 1b zweiter Satz genannten Verfahren, die nicht auf der elektronischen Plattform bereitgestellt wurden, eine Stellungnahme dahingehend abgeben, ob ein Vorhaben dem Abs. 1a erster Satz unterliegt. Abs. 1b zweiter Satz ist anzuwenden."},{"lvl":0,"sym":"(2)","t":"Hat die Prüfung von Plänen oder Projekten im Sinne von Abs. 1 eine Unverträglichkeit ergeben und ist ihre Umsetzung auf anderem Weg nicht möglich, so darf eine Bewilligung nur erteilt werden, wenn das öffentliche Interesse an den beantragten Maßnahmen unter dem Gesichtspunkt des Gemeinwohls höher zu bewerten ist als das öffentliche Interesse an der Verfolgung der Erhaltungsziele. Durch Auflagen ist zu bewirken, dass die Verschlechterung möglichst gering gehalten wird und die globale Kohärenz erforderlichenfalls durch Ausgleichsmaßnahmen sichergestellt wird. Die Kommission der Europäischen Union ist über die vorgeschriebenen Auflagen zu unterrichten."},{"lvl":0,"sym":"(3)","t":"Beherbergt ein Europaschutzgebiet prioritäre natürliche Lebensraumtypen oder prioritäre Arten, dürfen bei der Interessenabwägung im Sinne von Abs. 2 nur Erwägungen im Zusammenhang mit der Gesundheit der Menschen und der öffentlichen Sicherheit sowie mit maßgeblichen günstigen Auswirkungen auf die Umwelt berücksichtigt werden. Andere Gründe des überwiegenden öffentlichen Interesses dürfen nur nach Anhörung der Kommission der Europäischen Union geltend gemacht werden."},{"lvl":0,"sym":"(4)","t":"Ab dem Zeitpunkt der Übermittlung von Vorschlägen für Gebiete im Sinne von § 24a Abs. 1 an die Kommission der Europäischen Union dürfen Nutzungsmaßnahmen an davon betroffenen Grundstücken nur so durchgeführt werden, wie sie nach Art und Umfang bisher rechtmäßig vorgenommen werden konnten. Alle weitergehenden Maßnahmen, die eine erhebliche Beeinträchtigung der vom Vorschlag betroffenen natürlichen Lebensräume oder der dort vorkommenden Tier- und Pflanzenarten, für die ein günstiger Erhaltungszustand gesichert oder wiederhergestellt werden soll, zur Folge haben könnten, dürfen nur mit Bewilligung der Bezirksverwaltungsbehörde vorgenommen werden. Die Bewilligung ist zu erteilen, wenn die Maßnahmen keine Verschlechterung der Lebensräume und keine erhebliche Störung der dort vorkommenden Arten bewirken und überdies dem Ziel der Erhaltung oder Schaffung eines günstigen Erhaltungszustandes dieser Lebensräume oder Arten nicht zuwiderlaufen."},{"lvl":0,"sym":"(5)","t":"Sobald die Kommission der Europäischen Union Vorschläge für Gebiete im Sinne von § 24a Abs. 1 in die Liste von Gebieten von gemeinschaftlicher Bedeutung aufgenommen hat, sind Pläne und Projekte, die sich auf diese Gebiete beziehen, im Sinne von Abs. 1 auf ihre Verträglichkeit mit den für diese Gebiete festgelegten Erhaltungszielen zu überprüfen."},{"lvl":0,"sym":"","t":"§ 25"},{"lvl":0,"sym":"","t":"Landschaftsschutzgebiete"},{"lvl":0,"sym":"(1)","t":"Gebiete, die sich durch besondere landschaftliche Schönheit oder Eigenart auszeichnen, die für die Erholung der Bevölkerung oder für den Tourismus besondere Bedeutung haben oder die historisch bedeutsame Landschaftsteile umfassen, können von der Landesregierung durch Verordnung zu Landschaftsschutzgebieten erklärt werden."},{"lvl":0,"sym":"(2)","t":"In einer Verordnung nach Abs 1 ist festzulegen, welche Maßnahmen im jeweiligen Landschaftsschutzgebiet einer Bewilligung bedürfen. Hiebei sind solche Maßnahmen als bewilligungspflichtig festzulegen, die geeignet sind, die besondere landschaftliche Eigenart oder Schönheit, den Erholungswert oder die historische Bedeutung des Gebietes nachhaltig zu beeinträchtigen. Bewilligungen dürfen von der Bezirksverwaltungsbehörde nur dann erteilt werden, wenn eine nachhaltige Beeinträchtigung der mit der Unterschutzstellung verfolgten Ziele nicht zu erwarten ist. § 9 Abs 7 und 8 und § 11 gelten sinngemäß."},{"lvl":0,"sym":"","t":"§ 26"},{"lvl":0,"sym":"","t":"Naturparke"},{"lvl":0,"sym":"(1)","t":"Landschaftsschutz-, Naturschutz- oder Europaschutzgebiete sowie geschlossene Teile davon, die für die Erholung und die Wissensvermittlung über die Natur besonders geeignet und allgemein zugänglich sind, können von der Landesregierung durch Verordnung zum Naturpark erklärt werden, wenn sie günstige Voraussetzungen für eine Begegnung der Menschen mit der Natur bieten und für eine fachliche Information und Betreuung Sorge getragen wird."},{"lvl":0,"sym":"(2)","t":"Die Landesregierung kann in eine Verordnung nach Abs 1 nähere Vorschriften über die Gestaltung, Betreuung und den Besuch des Naturparks sowie die Entwicklung des Naturparks und seines Umfeldes aufnehmen. Die Landesregierung kann das mit einem Naturpark im räumlichen Zusammenhang stehende Umfeld, insoweit es für die Entwicklung des Naturparks Bedeutung hat, in der Verordnung nach Abs 1 zur Naturparkregion erklären."},{"lvl":0,"sym":"(3)","t":"Das Land und die Gemeinden, die Anteil an einem Naturpark oder einer Naturparkregion haben, haben Maßnahmen zur Gestaltung sowie zur Entwicklung eines Naturparks und einer allenfalls festgelegten Naturparkregion zu fördern."},{"lvl":0,"sym":"","t":"§ 27"},{"lvl":0,"sym":"","t":"Begutachtungsverfahren"},{"lvl":0,"sym":"(1)","t":"Vor der Erlassung von Verordnungen nach § 23 Abs 1, 25 Abs 1 und 26 Abs 1 ist der Entwurf solcher Verordnungen samt einer Begründung und einem Übersichtsplan in den berührten Gemeinden durch vier Wochen zur allgemeinen Einsicht aufzulegen. Eigentümer von Grundstücken, die in das geplante Schutzgebiet einbezogen werden sollen, sind von dieser Auflage nach Möglichkeit zu verständigen."},{"lvl":0,"sym":"(2)","t":"Die Auflage des Entwurfes ist in den berührten Gemeinden auf die für allgemein verbindliche Anordnungen übliche Art mit dem Hinweis zu verlautbaren, dass jedermann berechtigt ist, zum Entwurf bis spätestens eine Woche nach Ende der Auflagefrist eine schriftliche Stellungnahme abzugeben. Eingegangene Stellungnahmen sind der Landesregierung vorzulegen."},{"lvl":0,"sym":"(3)","t":"Die Landesregierung hat vor der Erlassung von Verordnungen nach § 23 Abs 1, § 25 Abs 1 und § 26 Abs 1 ein Anhörungsverfahren durchzuführen, in dem jedenfalls dem Naturschutzbeirat, den in Betracht kommenden gesetzlichen Interessenvertretungen und den berührten Gemeinden Gelegenheit zur Abgabe einer Stellungnahme zu geben ist. Die Gemeinden haben damit den Umweltschutzausschuss zu befassen."},{"lvl":0,"sym":"(4)","t":"Die für die Erlassung von Verordnungen im Sinne von Abs 1 festgelegten Verpflichtungen gelten sinngemäß für die Übermittlung von Vorschlägen für Gebiete im Sinne von § 24a Abs 1 an die Kommission der Europäischen Union."},{"lvl":0,"sym":"","t":"VI. Abschnitt"},{"lvl":0,"sym":"","t":"Schutz von Naturdenkmalen"},{"lvl":0,"sym":"","t":"§ 28"},{"lvl":0,"sym":"","t":"Naturdenkmale"},{"lvl":0,"sym":"(1)","t":"Zu Naturdenkmalen können durch Bescheid der Bezirksverwaltungsbehörden erklärt werden:"},{"lvl":1,"sym":"a)","t":"Naturgebilde, die wegen ihrer Eigenart, Schönheit, Seltenheit, wegen ihres besonderen Gepräges, das sie der Landschaft verleihen, oder wegen ihrer besonderen wissenschaftlichen oder kulturellen Bedeutung erhaltungswürdig sind, oder"},{"lvl":1,"sym":"b)","t":"kleinräumige Gebiete, die für den Lebenshaushalt der Natur, das Kleinklima oder als Lebensraum bestimmter Tier- und Pflanzenarten besondere Bedeutung haben (Kleinbiotope)."},{"lvl":0,"sym":"(2)","t":"Soweit die Umgebung eines Naturgebildes oder Kleinbiotops für dessen Erscheinungsbild oder dessen Erhaltung mitbestimmende Bedeutung hat, kann diese in den Naturdenkmalschutz einbezogen werden."},{"lvl":0,"sym":"(3)","t":"Wenn es zur sofortigen Hintanhaltung einer drohenden Zerstörung oder schädlicher Eingriffe an einem schutzwürdigen Naturgebilde oder Kleinbiotop erforderlich ist, ist die Erklärung eines Naturdenkmales mittels Mandatsbescheides im Sinne des § 57 AVG zu verfügen."},{"lvl":0,"sym":"","t":"§ 29"},{"lvl":0,"sym":"","t":"Schutzbestimmungen"},{"lvl":0,"sym":"(1)","t":"Niemand darf an Naturdenkmalen Eingriffe oder Veränderungen vornehmen, welche den Bestand oder das Erscheinungsbild, dessen Eigenart, dessen charakteristisches Gepräge oder dessen wissenschaftlichen oder kulturellen Wert beeinträchtigen können."},{"lvl":0,"sym":"(2)","t":"Die Verpflichtung nach Abs 1 bezieht sich auch auf Maßnahmen, die außerhalb des von der Unterschutzstellung betroffenen Bereiches gesetzt werden, soweit von diesen substantielle Veränderungen im Sinne des Abs.1 am Naturdenkmal bewirkt werden."}]},{"id":"30","title":"","body":[{"lvl":0,"sym":"","t":"Die Erklärung eines Naturgebildes oder Kleinbiotops zum Naturdenkmal sowie der Widerruf der Erklärung zum Naturdenkmal (§ 32) sind zur allgemeinen Kenntnis durch vier Wochen an den Amtstafeln der Bezirksverwaltungsbehörden und Gemeinden, in deren Zuständigkeitsbereich das Naturdenkmal liegt, auf die für derartige allgemein verbindliche Anordnungen vorgesehene Art kundzumachen und in der Kärntner Landeszeitung zu verlautbaren."},{"lvl":0,"sym":"","t":"§ 31"},{"lvl":0,"sym":"","t":"Eingriffe in ein Naturdenkmal"},{"lvl":0,"sym":"(1)","t":"Die Bezirksverwaltungsbehörde darf Eingriffe in ein Naturdenkmal nur dann genehmigen, wenn das öffentliche Interesse an der Maßnahme, die den Eingriff erforderlich macht, unter dem Gesichtspunkt des Gemeinwohles höher zu bewerten ist als das öffentliche Interesse an der unversehrten Erhaltung des Naturdenkmales und wenn weiters zu erwarten ist, dass das Naturdenkmal auch nach dem Eingriff ein erhaltungswürdiges Naturgebilde oder Kleinbiotop im Sinne des § 28 bleibt. Durch Auflagen ist sicherzustellen, dass ein solcher Eingriff auf die möglichst schonende Art und Weise mit möglichst geringfügigen Beeinträchtigungen des Naturdenkmales vorgenommen wird."},{"lvl":0,"sym":"(2)","t":"Die über ein Naturdenkmal Verfügungsberechtigten haben jede Veränderung, Gefährdung oder Vernichtung des Naturdenkmales sowie die Veräußerung, Verpachtung oder Vermietung der in Betracht kommenden Grundflächen der
