Personen, die über bestimmte Fachkenntnisse auf Gebieten verfügen, die mit dem Schutz und der Pflege der Natur im Zusammenhang stehen oder sich mit diesen Fragen in einer bestimmten Region des Landes besonders befassen, den Sitzungen mit beratender Stimme beiziehen, wenn sich die Beratungen auf deren Fachbereich oder Region beziehen."},{"lvl":0,"sym":"(4)","t":"entfällt."},{"lvl":0,"sym":"(5)","t":"An den Sitzungen des Naturschutzbeirats hat der Leiter der Geschäftsstelle des Naturschutzbeirats mit beratender Stimme teilzunehmen. Weiters können die Leiter der Organisationseinheiten des Amtes der Landesregierung, die mit der Besorgung der Angelegenheiten des Naturschutzes betraut sind, mit beratender Stimme teilnehmen. Nach Bedarf können weitere, mit Angelegenheiten des Naturschutzes betraute Bedienstete des Amtes der Landesregierung den Sitzungen mit beratender Stimme beigezogen werden."}]},{"id":"63","title":"","body":[{"lvl":0,"sym":"(1)","t":"Der Beirat ist vom Vorsitzenden nach Bedarf unter Bekanntgabe der Tagesordnung einzuberufen. Der Vorsitzende hat den Beirat binnen zweier Wochen einzuberufen, wenn dies zwei der nach § 62 Abs. 1 lit. b bestellten Mitglieder unter Vorschlag einer Tagesordnung verlangen."},{"lvl":0,"sym":"(2)","t":"Der Beirat ist beschlussfähig, wenn der Vorsitzende oder sein Vertreter und wenigstens zwei der nach § 62 Abs. 1 lit. b bestellten Mitglieder anwesend sind. Zu einem Beschluss des Beirates ist die einfache Stimmenmehrheit der anwesenden Mitglieder erforderlich. Der Vorsitzende stimmt zuletzt ab und gibt mit seiner Stimme bei Stimmengleichheit den Ausschlag. Bei Beschlüssen darüber, ob Beschwerde an ein Verwaltungsgericht oder Revision an den Verwaltungsgerichtshof erhoben werden soll, ist für einen Beschluss die Zustimmung der Mehrheit von zwei Dritteln der anwesenden Mitglieder erforderlich, wobei dem Vorsitzenden kein Stimmrecht zukommt."},{"lvl":0,"sym":"(3)","t":"Dem Geschäftsstellenleiter obliegen die Leitung der Kanzleigeschäfte des Naturschutzbeirates, die Koordination der Tätigkeit der einzelnen Mitglieder im Rahmen der Geschäftsordnung sowie die Vor- und Nachbereitung seiner Sitzungen. Die Kanzleigeschäfte des Beirates sind von der nach der Geschäftseinteilung des Amtes der Landesregierung mit den rechtlichen Angelegenheiten des Naturschutzes betrauten Abteilung des Amtes der Landesregierung zu führen. Dem Beirat sind die zur Besorgung seiner Aufgaben erforderlichen personellen, sachlichen und finanziellen Mittel zur Verfügung zu stellen."},{"lvl":0,"sym":"(4)","t":"Der Beirat kann sich eine Geschäftsordnung geben. In der Geschäftsordnung ist neben den Regelungen der inneren Organisation des Beirates auch die Vorgangsweise bei der Einholung von Sachverständigengutachten festzulegen."},{"lvl":0,"sym":"(5)","t":"Der Beirat kann nach Bedarf"},{"lvl":1,"sym":"1.","t":"die Wirtschaftskammer Kärnten,"},{"lvl":1,"sym":"2.","t":"die Landwirtschaftskammer für Kärnten,"},{"lvl":1,"sym":"3.","t":"die Interessenvertretung der Industrie in Kärnten und"},{"lvl":1,"sym":"4.","t":"die mitgliederstärkste Interessenvertretung der Bürgerinitiativen in Kärnten"},{"lvl":0,"sym":"","t":"zu Konsultationen über Angelegenheiten des Naturschutzes, die in die Zuständigkeit des Beirats fallen, einladen. Der Beirat hat innerhalb von zwei Wochen zu solchen Konsultationen einzuladen, wenn dies eine der in Z 1 bis 4 genannten Interessenvertretungen unter Vorschlag einer Tagesordnung, die Angelegenheiten betrifft, die gemäß § 54 in die Zuständigkeit des Beirats fallen, verlangt. Die Einladung zur Sitzung ist den Interessenvertretungen mindestens vier Wochen vor der geplanten Sitzung zuzustellen. Jede der in Z 1 bis 4 genannten Interessenvertretungen kann im Fall des ersten Satzes innerhalb von zwei Wochen nach Zugang der Einladung verlangen, dass in die Tagesordnung der Sitzung auch weitere Angelegenheiten aufgenommen werden, die gemäß § 54 in die Zuständigkeit des Beirats fallen. Die Behandlung der Tagesordnungspunkte darf in der Sitzung nur in einer Weise erfolgen, dass gesetzliche Verpflichtungen zur Geheimhaltung und berechtigte Geheimhaltungsinteressen der Parteien eines allfälligen Verfahrens nicht verletzt werden."},{"lvl":0,"sym":"(6)","t":"Der Naturschutzbeirat hat der Landesregierung jährlich bis zum 30. Juni über das Vorjahr einen Tätigkeitsbericht vorzulegen. Die Landesregierung hat diesen Tätigkeitsbericht dem Landtag zur Kenntnis zu bringen. Nach der Kenntnisnahme durch den Landtag ist der Tätigkeitsbericht vom Geschäftsstellenleiter des Naturschutzbeirats in geeigneter Weise zu veröffentlichen."},{"lvl":0,"sym":"","t":"XIII. Abschnitt"},{"lvl":0,"sym":"","t":"Schlussbestimmungen"},{"lvl":0,"sym":"","t":"§ 64"},{"lvl":0,"sym":"","t":"Schutz von Bezeichnungen"},{"lvl":0,"sym":"","t":"Die Verwendung der Bezeichnungen \"Naturschutzgebiet\", \"Landschaftsschutzgebiet\", \"Europaschutzgebiet\", \"Naturdenkmal\" und \"Geschützte Naturhöhle\" für Gebiete oder Naturgebilde, die nicht auf Grund dieses Gesetzes zu solchen erklärt wurden, ist verboten."}]},{"id":"65","title":"","body":[{"lvl":0,"sym":"(1)","t":"Die Organe des Wachkörpers Bundespolizei haben bei der Vollziehung der Ahndung von Verwaltungsübertretungen gemäß § 67 Abs. 1, soweit es sich um Zuwiderhandlungen gegen § 5 Abs. 1 lit. a, lit. g, soweit dies Festlegung von Gelände zur Ausübung von Motorsportarten betrifft und lit. k, §§ 8, 13 lit. a, 14 Abs. 1 erster und zweiter Satz, 15 Abs. 1 erster Satz, 43 Abs. 1 sowie der aufgrund der §§ 16, 17 Abs. 3, 18 Abs. 1, 3 und 4, 19 und 20 erlassenen Verordnungen mitzuwirken durch"},{"lvl":1,"sym":"a)","t":"Vorbeugungsmaßnahmen gegen drohende Verwaltungsübertretungen,"},{"lvl":1,"sym":"b)","t":"Maßnahmen, die für die Einleitung von Verwaltungsstrafverfahren erforderlich sind."},{"lvl":0,"sym":"(2)","t":"Die in Abs. 1 genannten Organe haben überdies den nach diesem Gesetz zuständigen Behörden und Organen über deren Ersuchen bei der Wahrnehmung der Rechte nach § 60 im Rahmen ihres gesetzlichen Wirkungsbereiches Hilfe zu leisten."},{"lvl":0,"sym":"(3)","t":"Die Zollorgane haben bei der Vollziehung der Ahndung von Verwaltungsübertretungen gemäß § 67 Abs. 1, soweit es sich um Zuwiderhandlungen gegen die nach den §§ 18 Abs. 1, 3 und 4, 19 und 20 erlassenen Verordnungen handelt, mitzuwirken durch"},{"lvl":1,"sym":"a)","t":"Vorbeugungsmaßnahmen gegen drohende Verwaltungsübertretungen sowie"},{"lvl":1,"sym":"b)","t":"Maßnahmen, die für die Einleitung von Verwaltungsstrafverfahren erforderlich sind."},{"lvl":0,"sym":"(4)","t":"Die Forst-, Jagd- und Fischereischutzorgane haben Übertretungen der Bestimmungen dieses Gesetzes und der auf Grund dieses Gesetzes erlassenen Verordnungen, die sie in Ausübung ihrer Aufsichtstätigkeit wahrnehmen, der zuständigen Behörde anzuzeigen."},{"lvl":0,"sym":"","t":"§ 66"},{"lvl":0,"sym":"","t":"Eigener Wirkungsbereich"},{"lvl":0,"sym":"","t":"Die Aufgaben nach § 2 Abs 2, § 2a Abs 1 und § 32a, die Ausübung der Anhörungsrechte und die Befassung des Umweltschutzausschusses nach den §§ 27 Abs 3 und 4, 36 Abs 1 letzter Satz, die Ausübung von Parteirechten nach § 53 sowie die Aufgaben nach § 57 Abs 3 sind von Gemeinden im eigenen Wirkungsbereich zu besorgen."},{"lvl":0,"sym":"","t":"§ 66a"},{"lvl":0,"sym":"","t":"(entfällt)"},{"lvl":0,"sym":"","t":"§ 66b"},{"lvl":0,"sym":"","t":"Rechtmäßiger Bestand"},{"lvl":0,"sym":"","t":"Für Anlagen, die nach diesem Gesetz einer Bewilligung bedürfen und seit mindestens 20 Jahren bestehen und für die eine Bewilligung auch im Zeitpunkt ihrer Errichtung erforderlich war, welche jedoch nicht mehr nachgewiesen werden kann, wird das Vorliegen der Bewilligung vermutet, sofern ihr Fehlen innerhalb dieser Frist behördlich unbeanstandet geblieben ist."}]},{"id":"67","title":"","body":[{"lvl":0,"sym":"(1)","t":"Wer"},{"lvl":1,"sym":"a)","t":"Vorhaben, die nach diesem Gesetz oder auf Grund dieses Gesetzes erlassener Verordnungen bewilligungspflichtig oder verboten sind, ohne Bewilligung oder entgegen dem Verbot ausführt oder ausführen lässt,"},{"lvl":1,"sym":"b)","t":"Vorhaben abweichend von Bewilligungen, die auf Grund dieses Gesetzes oder auf Grund dieses Gesetzes erlassener Verordnungen erteilt worden sind, ausführt oder ausführen lässt,"},{"lvl":1,"sym":"c)","t":"Vorhaben, die auf Grund einer Anzeige nach dem vereinfachten Verfahren nach § 51a ausgeführt werden dürfen, abweichend von den eingereichten Unterlagen ausführt oder ausführen lässt,"},{"lvl":1,"sym":"d)","t":"die in den Verordnungen, die auf Grund dieses Gesetzes erlassen worden sind, enthaltenen Gebote und Verbote nicht befolgt,"},{"lvl":1,"sym":"e)","t":"die in Entscheidungen, die auf Grund dieses Gesetzes oder der auf Grund dieses Gesetzes erlassenen Verordnungen ergangen sind, enthaltenen Verfügungen nicht befolgt,"},{"lvl":1,"sym":"f)","t":"den Bestimmungen der §§ 13, 14 Abs. 1 und 3, 15 Abs. 1, 3 und 4, 17 Abs. 1 und 2, 18 Abs. 2 und 3, 19 Abs. 2 und 3, 31 Abs. 1 und 3, 32a Abs. 3, 34 Abs. 3, 38 Abs. 1 und 3, 39 Abs. 6, 40 Abs. 1, 42, 44 und 64 zuwiderhandelt,"},{"lvl":1,"sym":"g)","t":"ein Organ der ökologischen Bauaufsicht (§ 47) an der Ausübung seiner Tätigkeit behindert oder dessen Anordnungen missachtet,"},{"lvl":1,"sym":"h)","t":"eine (vorläufige) Arbeitseinstellung nach § 56 oder Aufträge nach § 57 missachtet,"},{"lvl":1,"sym":"i)","t":"einer Verpflichtung nach § 60 Abs. 3 nicht nachkommt oder den Zutritt im Sinne von § 60 Abs. 1 verweigert oder"},{"lvl":1,"sym":"j)","t":"eine Kennzeichnung im Sinne von § 59 Abs. 1 nicht anbringen lässt, beschädigt, entfernt, fälscht, verfälscht oder missbräuchlich verwendet oder"},{"lvl":1,"sym":"k)","t":"nicht oder nicht unverzüglich die nach § 57e Abs. 2 oder § 57f Abs. 1 lit. a vorgeschriebene Verständigung der Behörde vornimmt, oder"},{"lvl":1,"sym":"l)","t":"die ihn gemäß §§ 57e Abs. 5, 57f Abs. 4 oder 57g Abs. 4 treffenden Duldungspflichten verletzt,"},{"lvl":0,"sym":"","t":"begeht eine Verwaltungsübertretung, die von der Bezirksverwaltungsbehörde mit einer Geldstrafe bis zu 3630 Euro, bei Vorliegen erschwerender Umstände und im Wiederholungsfalle bis zu 7260 Euro, zu bestrafen ist. Zuwiderhandlungen gegen § 43 Abs. 1 werden mit einer Geldstrafe bis 7260 Euro, bei Vorliegen erschwerender Umstände und im Wiederholungsfalle bis zu 14.000 Euro bestraft."},{"lvl":0,"sym":"(1a)","t":"Wer die in § 57e Abs. 3 oder § 57f Abs.2 geregelten Auskünfte nicht oder nicht unverzüglich erteilt oder die dort vorgesehenen Kontrollen und Ermittlungen behindert, begeht eine Verwaltungsübertretung und ist mit einer Geldstrafe bis zu 15.000 Euro zu bestrafen."},{"lvl":0,"sym":"(1b)","t":"Wer"},{"lvl":1,"sym":"a)","t":"nicht die nach § 57e Abs. 1 erforderlichen Vermeidungsmaßnahmen unverzüglich ergreift,"},{"lvl":1,"sym":"b)","t":"nicht die nach § 57f Abs. 1 lit. b gebotenen Vorkehrungen unverzüglich trifft,"},{"lvl":1,"sym":"c)","t":"nicht die nach § 57f Abs. 1 lit. c und § 57g Abs. 1 gebotenen Sanierungsmaßnahmen unverzüglich ermittelt und der Behörde anzeigt,"},{"lvl":1,"sym":"d)","t":"nicht die nach § 57f Abs. 1 lit. c erforderlichen Sanierungsmaßnahmen gemäß § 57g ergreift,"},{"lvl":0,"sym":"","t":"begeht eine Verwaltungsübertretung und ist mit einer Geldstrafe bis zu 35.000 Euro zu bestrafen."},{"lvl":0,"sym":"(2)","t":"Der Versuch ist strafbar."},{"lvl":0,"sym":"(3)","t":"Eine Übertretung des § 60 Abs. 3 liegt nicht vor, wenn sich ein zur Auskunft Verpflichteter der Auskunft entschlägt, um sich nicht selbst zu beschuldigen oder nahe Angehörige der Gefahr einer Verfolgung auszusetzen."},{"lvl":0,"sym":"(4)","t":"Bildet die unzulässige Herstellung einer Anlage oder die unzulässige Durchführung einer sonstigen Maßnahme den Gegenstand einer Verwaltungsübertretung, so endet das strafbare Verhalten erst mit der Beseitigung der Anlage bzw. der Behebung der Maßnahme oder mit der Rechtskraft der nachträglich erteilten Bewilligung."},{"lvl":0,"sym":"(5)","t":"Mit einem Straferkenntnis kann auf den Verfall der zur Begehung der Übertretung bestimmten Werkzeuge, Geräte oder Waffen sowie der entgegen den Vorschriften dieses Gesetzes gewonnenen Gegenstände erkannt werden. Als verfallen erklärte lebende Tiere sind sogleich in geeigneter Weise in Freiheit zu setzen oder, wenn sie hiedurch dem Zugrundegehen preisgegeben wären, Tiergärten, Tierschutzvereinen oder tierfreundlichen Personen zu übergeben. Ist dies unmöglich, sind sie schmerzlos zu töten."},{"lvl":0,"sym":"(6)","t":"In einem Straferkenntnis kann neben einer Geldstrafe auch der Entzug von Bewilligungen nach diesem Gesetz ausgesprochen werden, wenn diese die Begehung der Verwaltungsübertretung erleichtert haben oder künftiger Missbrauch der Bewilligung zu erwarten ist."},{"lvl":0,"sym":"(7)","t":"Unbeschadet der Strafbestimmungen des Kärntner Abgabenorganisationsgesetzes begeht eine Verwaltungsübertretung, wer seinen Verpflichtungen nach § 50d Abs. 1 bis 3 nicht nachkommt. Diese Verwaltungsübertretungen sind von der Bezirksverwaltungsbehörde mit Geldstrafe bis zu 15.000,- Euro zu bestrafen. Ersatzfreiheitsstrafen dürfen nicht verhängt werden."}]},{"id":"67a","title":"","body":[{"lvl":0,"sym":"(1)","t":"Soweit in diesem Gesetz auf Landesgesetze verwiesen wird, sind diese in der jeweils geltenden Fassung anzuwenden."},{"lvl":0,"sym":"(2)","t":"Soweit in diesem Gesetz auf Bundesgesetze verwiesen wird, sind diese in der nachstehenden Fassung anzuwenden:"},{"lvl":1,"sym":"1.","t":"Abfallwirtschaftsgesetz 2002 – AWG 2002, BGBl. I Nr. 102, zuletzt geändert durch BGBl. I Nr. 73/2018;"},{"lvl":1,"sym":"2.","t":"(entfällt)"},{"lvl":1,"sym":"3.","t":"Atomhaftungsgesetz 1999 – AtomHG 1999, BGBl. I Nr. 170/1998, zuletzt geändert durch BGBl. I Nr. 33/2003;"},{"lvl":1,"sym":"4.","t":"(entfällt)"},{"lvl":1,"sym":"5.","t":"Bundes-Verfassungsgesetz (B-VG), BGBl. Nr. 1/1930, zuletzt geändert durch BGBl. I Nr. 14/2019;"},{"lvl":1,"sym":"6.","t":"Chemikaliengesetz 1996 – ChemG 1996, BGBl. I Nr. 53/1997, zuletzt geändert durch BGBl. I Nr. 44/2018;"},{"lvl":1,"sym":"7.","t":"Eisenbahn-Enteignungsentschädigungsgesetz – EisbEG, BGBl. Nr. 71/1954, zuletzt geändert durch BGBl. I Nr. 111/2010;"},{"lvl":1,"sym":"8.","t":"Emissionsschutzgesetz für Kesselanlagen – EG-K 2013, BGBl. I Nr. 127/2013, zuletzt geändert durch BGBl. I Nr. 81/2015;"},{"lvl":1,"sym":"9.","t":"Finanz-Verfassungsgesetz 1948 – F-VG 1948, BGBl. Nr. 45, zuletzt geändert durch BGBl. I Nr. 61/2012;"},{"lvl":1,"sym":"10.","t":"Gefahrgutbeförderungsgesetz – GGBG, BGBl. I Nr. 145/1998, zuletzt geändert durch BGBl. I Nr. 47/2018;"},{"lvl":1,"sym":"11.","t":"Gentechnikgesetz – GTG, BGBl. Nr. 540/1994, zuletzt geändert durch BGBl. I Nr. 59/2018;"},{"lvl":1,"sym":"12.","t":"Gewerbeordnung 1994 – GewO 1994, BGBl. Nr. 194, zuletzt geändert durch BGBl. I Nr. 112/2018;"},{"lvl":1,"sym":"13.","t":"Forstgesetz 1975, BGBl. Nr. 440, zuletzt geändert durch BGBl. I Nr. 56/2016;"},{"lvl":1,"sym":"14.","t":"Luftfahrtgesetz – LFG, BGBl. Nr. 253/1957, zuletzt geändert durch BGBl. I Nr. 92/2017;"},{"lvl":1,"sym":"15.","t":"Mineralrohstoffgesetz – MinroG, BGBl. I Nr. 38/1999, zuletzt geändert durch BGBl.I Nr. 95/2016;"},{"lvl":1,"sym":"16.","t":"(entfällt)"},{"lvl":1,"sym":"17.","t":"Umweltverträglichkeitsprüfungsgesetz 2000 – UVP-G 2000, BGBl. Nr. 697/1993, zuletzt geändert durch BGBl. I Nr. 80/2018;"},{"lvl":1,"sym":"18.","t":"Wasserrechtsgesetz 1959 – WRG 1959, BGBl. Nr. 215, zuletzt geändert durch BGBl. I Nr. 73/2018;"},{"lvl":1,"sym":"19.","t":"Wehrgesetz 2001 – WG 2001, BGBl. I Nr. 146, zuletzt geändert durch BGBl. I Nr. 61/2018."},{"lvl":0,"sym":"(3)","t":"Soweit in diesem Gesetz auf Richtlinien der Europäischen Union verwiesen wird, sind diese in der nachstehenden Fassung anzuwenden:"},{"lvl":1,"sym":"a)","t":"Richtlinie 2009/147/EG des Europäischen Parlaments und des Rates vom 30. November 2009 über die Erhaltung der wildlebenden Vogelarten (kodifizierte Fassung), in der Fassung der Richtlinie 2013/17/EU des Rates vom 13. Mai 2013, ABl. Nr. L 158 vom 10.6.2013, S. 193 (Vogelschutz-Richtlinie);"},{"lvl":1,"sym":"b)","t":"Richtlinie 92/43/EWG des Rates vom 21. Mai 1992 zur Erhaltung der natürlichen Lebensräume sowie der wildlebenden Tiere und Pflanzen, ABl. Nr. L 206 vom 27.7.92, S 7, zuletzt in der Fassung der Richtlinie 2013/17/EU des Rates vom 13. Mai 2013, ABl. Nr. L 158 vom 10.6.2013, S. 193 (FFH-Richtlinie);"},{"lvl":1,"sym":"c)","t":"Richtlinie (EU) 2021/1883 über die Bedingungen für die Einreise und den Aufenthalt von Drittstaatsangehörigen zur Ausübung einer hoch qualifizierten Beschäftigung und zur Aufhebung der Richtlinie 2009/50/EG des Rates, ABl. Nr. L 382 vom 28.10.2021, S 1."},{"lvl":0,"sym":"(4)","t":"Soweit in diesem Gesetz auf die Verordnung (EG) Nr. 338/97 verwiesen wird, ist darunter die Verordnung (EG) Nr. 338/1997 des Rates vom 9. Dezember 1996 über den Schutz von Exemplaren wildlebender Tier- und Pflanzenarten durch Überwachung des Handels, ABl. Nr. L 61 vom 3.3.1997, S 1, derzeit zuletzt geändert durch die Verordnung (EG) Nr. 1320/2014 der Kommission vom 1. Dezember 2014, ABl. Nr. L 361 vom 17.12.2014, S. 1, zu verstehen."},{"lvl":0,"sym":"(5)","t":"Soweit in diesem Gesetz auf die Verordnung (EU) Nr. 1143/2014 über die Prävention und das Management invasiver gebietsfremder Arten verwiesen wird, ist darunter die Verordnung (EU) Nr. 1143/2014 des Europäischen Parlaments und des Rates vom 22. Oktober 2014 über die Prävention und das Management der Einbringung und Ausbreitung invasiver gebietsfremder Arten, ABl. Nr. L 317 vom 4.11.2014, S. 35, zu verstehen."},{"lvl":0,"sym":"","t":"§ 68"},{"lvl":0,"sym":"","t":"Inkrafttreten"},{"lvl":0,"sym":"(1)","t":"Dieses Gesetz tritt mit 1. Jänner 1987 in Kraft."},{"lvl":0,"sym":"(2)","t":"Mit dem Inkrafttreten dieses Gesetzes treten außer Kraft:"},{"lvl":1,"sym":"a)","t":"das Gesetz vom 18. Dezember 1952 über den Schutz und die Pflege der Natur, LGBl Nr 2/1953, in der Fassung der Gesetze LGBl Nr 48/1959, 1/1965, 49/1969 und 52/1982, sowie der Kundmachungen LGBl Nr 35/1966 und 62/1985;"},{"lvl":1,"sym":"b)","t":"das Landschaftsschutzgesetz 1981, LGBl Nr 29;"},{"lvl":1,"sym":"c)","t":"das Naturhöhlengesetz, BGBl Nr 169/1928, soweit es als Landesgesetz in Geltung steht."},{"lvl":0,"sym":"(3)","t":"Verordnungen auf Grund dieses Gesetzes können bereits ab dem der Kundmachung dieses Gesetzes folgenden Tag erlassen werden. Sie dürfen frühestens gleichzeitig mit diesem Gesetz in Kraft gesetzt werden."},{"lvl":0,"sym":"","t":"§ 69"},{"lvl":0,"sym":"","t":"Übergangsbestimmungen"},{"lvl":0,"sym":"(1)","t":"Naturgebilde, welche bis zum 1. Jänner 1987 auf Grund der Bestimmungen des Naturschutzgesetzes zu Naturdenkmalen erklärt sind, gelten als Naturdenkmale im Sinne dieses Gesetzes."},{"lvl":0,"sym":"(2)","t":"Naturhöhlen, welche bis zum 1. Jänner 1987 auf Grund des Naturhöhlengesetzes zu Naturdenkmalen erklärt sind, gelten als besonders geschützte Höhlen im Sinne dieses Gesetzes. Die Griffner Tropfsteinhöhle gilt als Schauhöhle im Sinne dieses Gesetzes. Die im Zusammenhang mit der Erschließung für den Besuch dieser Höhle getroffenen Verfügungen bleiben in Geltung."},{"lvl":0,"sym":"(3)","t":"Verordnungen der Landesregierung auf Grund der §§ 5 bis 8 des Naturschutzgesetzes gelten bis zur Erlassung von Verordnungen auf Grund dieses Gesetzes, mit denen diese Verordnungen ersetzt werden oder mit denen abweichende Regelungen getroffen werden, als landesgesetzliche Regelungen weiter."},{"lvl":0,"sym":"(4)","t":"Verordnungen auf Grund des Naturschutzgesetzes, mit denen Gebiete zu Naturschutzgebieten erklärt wurden, gelten in bezug auf die Gebietsabgrenzung und die Schutzbestimmungen bis zur Erlassung von Verordnungen auf Grund dieses Gesetzes, mit denen diese Verordnungen ersetzt werden oder mit denen abweichende Regelungen getroffen werden, als landesgesetzliche Regelungen weiter. Eingriffe in solche Naturschutzgebiete dürfen nur im Rahmen des § 24 Abs 3 bewilligt werden. Die zeitgemäße, auf die naturräumlichen Voraussetzungen abgestimmte land- und forstwirtschaftliche Nutzung sowie die rechtmäßige Ausübung der Jagd und der Fischerei ist nur insoweit von den Schutzbestimmungen ausgenommen, als damit keine nachhaltige Beeinträchtigung des Schutzzweckes verbunden ist."},{"lvl":0,"sym":"(5)","t":"Verordnungen auf Grund des § 3 des Landschaftsschutzgesetzes 1981 gelten bis zur Erlassung von Verordnungen auf Grund dieses Gesetzes, mit denen diese Verordnungen ersetzt oder abweichende Regelungen getroffen werden, als landesgesetzliche Regelungen weiter. Maßnahmen oder Vorhaben in solchen Landschaftsschutzgebieten dürfen nur bewilligt werden, wenn diese die besondere landschaftliche Eigenart oder Schönheit oder den Erholungswert des Gebietes nicht nachhaltig beeinträchtigen."},{"lvl":0,"sym":"(6)","t":"Zuwiderhandlungen gegen Verordnungen, die in den Abs 3 bis 5 als landesgesetzliche Regelungen weitergeltend festgelegt wurden, sind nach § 67 Abs 1 zu bestrafen."},{"lvl":0,"sym":"(7)","t":"Bewilligungen auf Grund des § 6 des Naturschutzgesetzes, des § 2 des Landschaftsschutzgesetzes 1981 oder des § 7 des Naturhöhlengesetzes und Bewilligungen, die auf Grund der nach § 11 des Naturschutzgesetzes sowie nach § 3 des Landschaftsschutzgesetzes 1981 erlassenen Verordnungen erteilt wurden, bleiben unberührt. Die Bestimmungen dieses Gesetzes finden auf solche Bewilligungen mit der Maßgabe Anwendung, dass die Fristen nach § 55 Abs 1 lit b und c mit 1. Jänner 1987 zu laufen beginnen."},{"lvl":0,"sym":"(8)","t":"Verwaltungsverfahren auf Grund des Naturschutzgesetzes, des Landschaftsschutzgesetzes 1981 und des Naturhöhlengesetzes, die zum 1. Jänner 1987 bereits anhängig sind, sind nach den gesetzlichen Bestimmungen, wie sie vor dem 1. Jänner 1987 in Geltung standen, weiterzuführen."},{"lvl":0,"sym":"(9)","t":"Maßnahmen und Vorhaben, die vor dem 1. Jänner 1987 keiner Bewilligung nach dem Naturschutzgesetz oder dem Landschaftsschutzgesetz 1981 bedurften und bis zum 1. Jänner 1987 bereits in Angriff genommen wurden, sind dann nicht bewilligungspflichtig, wenn sie nach anderen landesrechtlichen Bestimmungen bewilligt wurden."},{"lvl":0,"sym":"(10)","t":"Bestehende Anlagen im Sinne des § 4 lit b, die nicht auf Grund des Landschaftsschutzgesetzes 1981 bewilligt wurden, bedürfen einer Bewilligung nach diesem Gesetz. Solche Anlagen dürfen bis zur Erlassung eines rechtskräftigen Bescheides über einen Bewilligungsantrag ohne Bewilligung weiterbetrieben werden, wenn ein solcher Antrag längstens binnen einem Jahr nach dem 1. Jänner 1987 gestellt wird und in der Folge nicht zurückgezogen wird."},{"lvl":0,"sym":"(11)","t":"Bestehende Einrichtungen im Sinne des § 5 Abs 1 lit l bedürfen einer Bewilligung nach diesem Gesetz. Solche Einrichtungen dürfen bis zur Erlassung eines rechtskräftigen Bescheides über den Bewilligungsantrag ohne Bewilligung weiter belassen oder betrieben werden, wenn ein solcher Antrag längstens binnen sechs Monaten nach dem 1. Jänner 1987 gestellt wird und in der Folge nicht zurückgezogen wird."},{"lvl":0,"sym":"(12)","t":"Die Beseitigung von Bauten und sonstigen baulichen Anlagen, die nach dem V. Abschnitt des Naturschutzgesetzes bewilligungspflichtig waren und in der Zeit vom 15. September 1959 bis zum 1. Jänner 1970 ohne eine solche Bewilligung errichtet wurden, ist gegenüber dem Grundeigentümer zu verfügen, wenn eine Bewilligung nach § 9 oder eine Ausnahmegenehmigung nach § 10 zu versagen wäre."},{"lvl":0,"sym":"(13)","t":"Die Bestimmungen des § 11 gelten für Anlagen auch dann, wenn sie seit dem 1. Jänner 1987 nur mehr auf Grund von Ausnahmebewilligungen im Sinne des § 10 errichtet werden dürften."},{"lvl":0,"sym":"(14)","t":"Kennzeichnungen von Naturdenkmalen und Naturschutzgebieten nach dem Naturschutzgesetz und von Landschaftsschutzgebieten und Badeverboten nach dem Landschaftsschutzgesetz 1981 gelten als Kennzeichnungen nach diesem Gesetz."},{"lvl":0,"sym":"(15)","t":"Durch die Überführung von bereits vor dem 1. Jänner 1987 rechtswirksam festgelegten Naturschutzgebieten oder Naturdenkmalen auf die Grundlage dieses Gesetzes leben Entschädigungsansprüche im Sinne des § 49 nicht auf."},{"lvl":0,"sym":"(16)","t":"Auf Grund des Naturhöhlengesetzes bestellte Höhlenführer gelten als Höhlenführer im Sinne dieses Gesetzes."}]}]},{"nr":13,"title":"Kriterien im Sinne des § 57c Z 1","paras":[]},{"nr":14,"title":"Tätigkeiten im Sinne des § 57b Abs. 1","paras":[]},{"nr":15,"title":"Sanierung von Schäden an geschützten | Arten oder natürlichen Lebensräumen","paras":[]},{"nr":16,"title":"Übergangsrecht | Wiederverlautbarungskundmachung","paras":[]},{"nr":17,"title":"(LGBl Nr 79/2002)","paras":[]},{"nr":18,"title":"Übergangsbestimmungen","paras":[]},{"nr":19,"title":"Übergangsbestimmungen","paras":[]},{"nr":20,"title":"Übergangsbestimmungen","paras":[{"id":"Artikel II","title":"(LGBl Nr 65/2016)","body":[{"lvl":1,"sym":"b)","t":"(1)Dieses Gesetz tritt – soweit in Abs. 2 nicht Abweichendes bestimmt wird – an dem der Kundmachung folgenden Tag in Kraft."},{"lvl":0,"sym":"(2)","t":"Artikel I Z 2 und 3 (§ 50a Abs. 1 vorletzter und letzter Satz, § 50c Abs. 1) treten am 1. Jänner 2017 in Kraft."},{"lvl":0,"sym":"(3)","t":"Als Zeitpunkt der Neufestsetzung der Abgabenhöhe gemäß § 50c Abs. 2 Kärntner Naturschutzgesetz 2002 gilt das Inkrafttreten dieses Gesetzes gemäß Abs. 2."}]},{"id":"Artikel II","title":"(LGBl Nr 57/2017)","body":[{"lvl":0,"sym":"(1)","t":"Dieses Gesetz tritt an dem der Kundmachung folgenden Monatsersten in Kraft."},{"lvl":0,"sym":"(2)","t":"Zum Zeitpunkt des Inkrafttretens dieses Gesetzes betriebene Himmelsstrahler (Art. I Z 4) und Festlegungen von Gelände für Modellflugplätze und Start- und Landeflächen für Paragleiten und Drachenfliegen sowie errichtete Sportanlagen (Art. I Z 6, betreffend § 5 Abs. 1 lit. g und h) gelten als naturschutzrechtlich bewilligt."},{"lvl":0,"sym":"(3)","t":"Art. I Z 7 (betreffend § 5 Abs. 1 lit. m) ist auf Maßnahmen, die zum Zeitpunkt des Inkrafttretens dieses Gesetzes (Abs. 1) naturschutzrechtlich bewilligt sind, nicht anzuwenden."},{"lvl":0,"sym":"(4)","t":"Bei bewilligungspflichtigen Maßnahmen nach Art. I Z 3 (§ 4 lit. a, betreffend Hausboote), die zum Zeitpunkt des Inkrafttretens dieses Gesetzes bestehen und auf die die Voraussetzungen des § 9 Abs. 4, in der Fassung dieses Gesetzes, zutreffen, hat der Inhaber der bewilligungspflichtigen Anlage innerhalb von sechs Monaten nach dem Inkrafttreten dieses Gesetzes um die naturschutzrechtliche Bewilligung anzusuchen."},{"lvl":0,"sym":"(5)","t":"Für zum Zeitpunkt des Inkrafttretens dieses Gesetzes (Abs. 1) bestehende Europaschutzgebiete ist Art. I Z 26 (betreffend § 49 Abs. 2) mit der Maßgabe anzuwenden, dass Ansprüche auf Entschädigung sowohl nach § 49 Abs. 2 Z 1 als auch für zum Zeitpunkt des Inkrafttretens dieses Gesetzes rechtskräftige Bescheide nach § 24b innerhalb eines Jahres nach dem Inkrafttreten dieses Gesetzes geltend zu machen sind. Dies gilt nicht für Europaschutzgebiete, soweit auf sie § 24a Abs. 3 angewendet wurde."},{"lvl":0,"sym":"(6)","t":"Für zum Zeitpunkt des Inkrafttretens dieses Gesetzes (Abs. 1) der Europäischen Kommission gemäß § 24b Abs. 4 übermittelte Gebiete sowie für Gebiete gemäß § 24b Abs. 5 ist Art. I Z 26 (betreffend § 49 Abs. 2 Z 1) mit der Maßgabe anzuwenden, dass Ansprüche auf Entschädigung innerhalb eines Jahres nach dem Inkrafttreten dieses Gesetzes geltend zu machen sind."},{"lvl":0,"sym":"(7)","t":"Art. I Z 27 (betreffend § 54 Abs. 1) ist auf zum Zeitpunkt des Inkrafttretens dieses Gesetzes (Abs. 1) anhängige Verfahren nicht anzuwenden."},{"lvl":0,"sym":"(8)","t":"Die Landesregierung hat den Geschäftsstellenleiter des Naturschutzbeirats (Art. I Z 36) innerhalb von sechs Monaten nach dem Inkrafttreten dieses Gesetzes (Abs. 1) zu bestellen."},{"lvl":0,"sym":"(9)","t":"Die Landesregierung hat innerhalb von sechs Monaten nach dem Inkrafttreten dieses Gesetzes (Abs. 1) die Mitglieder des Naturschutzbeirates neu zu bestellen. Die zum Zeitpunkt des Inkrafttretens dieses Gesetzes bestellten Mitglieder bleiben bis zur Konstituierung des aufgrund der Bestimmungen dieses Gesetzes bestellten Naturschutzbeirates im Amt."},{"lvl":0,"sym":"(1)","t":"Soweit in den folgenden Absätzen nicht Abweichendes bestimmt wird, tritt dieses Gesetz an dem der Kundmachung folgenden Tag in Kraft."},{"lvl":0,"sym":"(2)","t":"Verordnungen aufgrund des Art. I Z 3 (betreffend § 15 Abs. 3 letzter Satz) dürfen auch rückwirkend mit dem Inkrafttreten dieses Gesetzes erlassen werden."},{"lvl":0,"sym":"(3)","t":"Art. I Z 4 dieses Gesetzes (betreffend § 67 Abs. 1 lit. f) tritt an dem der Kundmachung der Verordnung der Landesregierung gemäß Art. I Z 3 über die Beschaffenheit und die Abmessungen von Wetterschutz und Schirmen folgenden Tag in Kraft."},{"lvl":0,"sym":"(1)","t":"Dieses Gesetz tritt an dem der Kundmachung folgenden Tag in Kraft."},{"lvl":0,"sym":"(2)","t":"§ 35c K-FG in der Fassung des Art. I Z 1, § 54c K-JG in der Fassung des Art. IV und § 54a | Abs. 1 K-NSG 2002 in der Fassung des Art. VI Z 5 sind nach Maßgabe des Abs. 3 sinngemäß anzuwenden, sofern es sich um Bescheide im Sinne dieser Bestimmungen handelt, die vor dem Tag des Inkrafttretens dieses Gesetzes (Abs. 1) erlassen wurden und die"},{"lvl":1,"sym":"1.","t":"zwischen dem 20. Dezember 2017 und dem Tag des Inkrafttretens dieses Gesetzes in Rechtskraft erwachsen sind oder"},{"lvl":1,"sym":"2.","t":"zwar erlassen, aber noch nicht in Rechtskraft erwachsen waren."},{"lvl":0,"sym":"(3)","t":"Umweltorganisationen, die gemäß § 19 Abs. 7 UVP-G 2000 anerkannt sind und deren Tätigkeitsbereich sich auf das Bundesland Kärnten bezieht, können innerhalb von sechs Wochen nach dem Inkrafttreten dieses Gesetzes verlangen, dass ihnen Bescheide, die ein Verfahren gemäß Abs. 2 Z 1 oder 2 abgeschlossen haben, zugestellt werden. Die Beschwerdefrist an das Landesverwaltungsgericht beginnt mit Zustellung dieser Bescheide. Beschwerden gegen Bescheide gemäß Abs. 2 Z 1 haben keine aufschiebende Wirkung. Die Behörde hat jedoch auf Antrag der beschwerdeführenden Umweltorganisation die aufschiebende Wirkung mit Bescheid zuzuerkennen, wenn nach Abwägung der berührten öffentlichen Interessen und Interessen anderer Parteien mit der Ausübung der durch den angefochtenen Bescheid eingeräumten Berechtigung ein unverhältnismäßiger Nachteil für die Umwelt verbunden wäre. Die Beschwerde gegen einen Bescheid, dem eine aufschiebende Wirkung zuerkannt wurde, hat keine aufschiebende Wirkung."},{"lvl":0,"sym":"(4)","t":"Ein zum Zeitpunkt des Inkrafttretens der Art. I, IV und VI beim Verwaltungsgerichtshof aufgrund der Revision einer nach § 19 Abs. 7 UVP-G 2000 anerkannten Umweltorganisation anhängiges Verfahren ist weiter zu führen, auch wenn der Bescheid, auf den sich die Revision bezieht, vor dem 20. Dezember 2017 in Rechtskraft erwachsen ist."},{"lvl":0,"sym":"(1)","t":"Dieses Gesetz tritt an dem der Kundmachung folgenden Tag in Kraft."},{"lvl":0,"sym":"(2)","t":"Art. I Z 5 und 10 (§ 9 Abs. 8 zweiter Satz und betreffend § 47 Abs. 1) sind auf zum Zeitpunkt des Inkrafttretens dieses Gesetzes (Abs. 1) anhängige Verfahren nicht anzuwenden."},{"lvl":0,"sym":"(3)","t":"Art. I Z 7 (§ 12 Abs. 4) gilt für zum Zeitpunkt des Inkrafttretens dieses Gesetzes (Abs. 1) bereits erworbene Liegenschaften mit der Maßgabe, dass das Veräußerungs- und Belastungsverbot sowie ein Vorkaufsrecht innerhalb eines Jahres nach Inkrafttreten dieses Gesetzes auf Kosten des Landes einzuverleiben ist."},{"lvl":0,"sym":"(4)","t":"Bis zum Ablauf des 31. Dezember 2021 tritt im § 58 Abs. 2 Z 2 (Art. I Z 12) an die Stelle des Verweises „§ 8 Abs. 2 Kärntner Raumordnungsgesetz 2021“ der Verweis „§ 5 Abs. 2 Kärntner Raumordnungsgesetz“."}]},{"id":"Artikel XV","title":"(LGBl Nr 36/2022) | Inkrafttreten","body":[{"lvl":0,"sym":"(1)","t":"Dieses Gesetz tritt, soweit in Abs. 2 nicht anderes bestimmt wird, mit 1. Jänner 2022 in Kraft."},{"lvl":0,"sym":"(2)","t":"Art. VI Z 4 und 7 sowie Art. XI Z 1 bis 4 treten mit dem der Kundmachung folgenden Tag in Kraft."},{"lvl":0,"sym":"","t":"Art. II bis LV dieses Gesetzes treten mit 1. September 2025 in Kraft."}]}]}],"satzung":[{"nr":1,"title":"Allgemeines","paras":[{"id":"1","title":"Rechtsform","body":[{"lvl":0,"sym":"(1)","t":"Die Kärntner Jägerschaft ist eine Körperschaft öffentlichen Rechts mit dem Sitz in Klagenfurt. Sie ist zur Führung des Kärntner Landeswappens berechtigt."},{"lvl":0,"sym":"(2)","t":"Soweit im Folgenden personenbezogene Bezeichnungen nur in männlicher Form angeführt sind, beziehen sie sich auf Frauen und Männer in gleicher Weise."}]},{"id":"2","title":"Mitgliedschaft","body":[{"lvl":0,"sym":"(1)","t":"Ordentliche Mitglieder der Kärntner Jägerschaft sind alle Inhaber von gültigen Kärntner Jagdkarten."},{"lvl":0,"sym":"(2)","t":"Zu Ehrenmitgliedern können vom Landesausschuss Personen ernannt werden, die sich um die Jagd hervorragende Verdienste erworben haben. Sie sind von der Entrichtung des Mitgliedsbeitrages befreit."},{"lvl":0,"sym":"(3)","t":"Außerordentliche Mitglieder können Personen werden, welche nachweisen, dass sie während der letzten zehn Jahre eine gültige Jagdkarte besessen haben. Über ihre Aufnahme entscheidet der Landesausschuss unter Ausschluss des Rechtsweges."},{"lvl":0,"sym":"(4)","t":"Die Mitgliedschaft der ordentlichen Mitglieder beginnt mit der Ausfolgung der Jagdkarte und endet drei Monate nach Ablauf ihrer Gültigkeit, mit dem Entzug der Jagdkarte oder durch Ausschluss aus der Kärntner Jägerschaft. Die Ehrenmitgliedschaft beginnt mit dem Tag ihrer Verleihung und endet entweder durch Aberkennung aufgrund eines Beschlusses des Landesausschusses oder durch Austritt. Die außerordentliche Mitgliedschaft beginnt mit der Ausfolgung der Mitgliedskarte und endet durch Erwerb der ordentlichen Mitgliedschaft, durch Verleihung der Ehrenmitgliedschaft, durch den Austritt oder durch den Ausschluss aus der Kärntner Jägerschaft."}]},{"id":"3","title":"Gliederung","body":[{"lvl":0,"sym":"(1)","t":"Die Kärntner Jägerschaft gliedert sich in Bezirksgruppen."},{"lvl":0,"sym":"(2)","t":"Jede Bezirksgruppe besteht aus mehreren Hegeringen."}]},{"id":"4","title":"Aufgaben","body":[{"lvl":0,"sym":"(1)","t":"Die Kärntner Jägerschaft hat die Interessen der in Kärnten die Jagd ausübenden Personen und der Jagdschutzorgane zu vertreten, das Weidwerk und die Jagdwirtschaft zu fördern, die Weidgerechtigkeit zu pflegen und die bodenständigen jagdlichen Sitten und Gebräuche zu erhalten und zu fördern. Ferner obliegt ihr unter Berücksichtigung eines ausgeglichenen Naturhaushaltes die Bewahrung und Förderung eines den Erfordernissen der Land- und Forstwirtschaft angepassten artenreichen und gesunden Wildstandes."},{"lvl":0,"sym":"(2)","t":"In Erfüllung ihrer Aufgaben hat die Kärntner Jägerschaft im eigenen Wirkungsbereich insbesondere:"},{"lvl":1,"sym":"a)","t":"für die sachgemäße Ausübung der Jagd in Kärnten zu sorgen,"},{"lvl":1,"sym":"b)","t":"ihre Mitglieder in allen jagdlichen und jagdrechtlichen Fragen zu beraten, sie zu weidgerechten und umweltbewussten Jägern zu erziehen und anzustreben, dass sie nicht gegen die Weidgerechtigkeit und gegen die Standespflichten verstoßen,"},{"lvl":1,"sym":"c)","t":"zu allen die Jagd berührenden Gesetzen und Verordnungen Stellung zu nehmen und diesbezügliche Vorschläge zu unterbreiten, in Fragen der Jagd Gutachten zu erstatten und erfahrene Mitglieder als Jagdsachverständige namhaft zu machen,"},{"lvl":1,"sym":"d)","t":"die jagdliche Eignung der Jagdkartenwerber durch Prüfung festzustellen und die hiefür erforderliche Prüfungskommission zu bestellen,"},{"lvl":1,"sym":"e)","t":"Jagdschutzorgane und ihre Hinterbliebenen fallweise zu unterstützen,"},{"lvl":1,"sym":"f)","t":"Einrichtungen zu schaffen und zu betreiben, die der Jagd, der Jagdwissenschaft, dem jagdlichen Schießwesen, der Aus- und Fortbildung der Jäger und Jagdschutzorgane dienen, ferner Maßnahmen zu treffen, die zur wirksamen Bekämpfung des Wildererunwesens geeignet sind, und die Verhütung von Wildschäden zu fördern,"},{"lvl":1,"sym":"g)","t":"die Jagdhundezucht und Jagdhundeführung zu fördern,"},{"lvl":1,"sym":"h)","t":"Hegeschauen, jagdkulturelle Veranstaltungen, Jägertage, Jagdausstellungen, Jägerschießen u.a. durchzuführen sowie das jagdliche Brauchtum zu pflegen,"},{"lvl":1,"sym":"i)","t":"für die Mitglieder eine ausreichende Jagdhaftpflichtversicherung gegen Personen- und Sachschäden abzuschließen,"},{"lvl":1,"sym":"j)","t":"eine Jagdstatistik zu führen,"},{"lvl":1,"sym":"k)","t":"Personen, die sich um die Jagd in Kärnten besondere Verdienste erworben haben, durch Verleihung der Ehrenmitgliedschaft, von Ehren-Verdienst-Zeichen und Diplomen zu ehren und die Verbandstreue zu würdigen,"},{"lvl":1,"sym":"l)","t":"Jagdkarten auszustellen, die Ausstellung von Jagdkarten zu verweigern und die Jagdkarten zu entziehen sowie Jagdgastkarten, Jagdkartenbeiträge und Jagdgastkartenbeiträge zu verwalten,"},{"lvl":1,"sym":"m)","t":"den Schutz der Natur und damit alle Maßnahmen zu fördern, die geeignet sind, die freilebende Tierwelt als wesentlichen Bestandteil der Natur und ihrer Vielfalt zu bewahren und ihre Lebensgrundlagen zu erhalten oder wiederherzustellen, sowie darauf hinzuwirken, dass bei der Hege und Bejagung des Wildes stets auf die Erfordernisse eines ausgeglichenen Naturhaushaltes, der Land- und Forstwirtschaft und der wildökologischen Raumplanung Bedacht genommen wird."},{"lvl":0,"sym":"(3)","t":"Die Kärntner Jägerschaft kann sich mit den Landesjagdverbänden der übrigen Bundesländer zu einem gemeinsamen Jagdverband vereinen und auch Mitglied der Zentralstelle österreichischer Landesjagdverbände sein."}]},{"id":"4a","title":"","body":[{"lvl":0,"sym":"","t":"Im übrigen besorgt die Kärntner Jägerschaft im übertragenen Wirkungsbereich die ihr durch Landesgesetz übertragenen Aufgaben. Organisation der Kärntner Jägerschaft"}]},{"id":"5","title":"Organe der Kärntner Jägerschaft","body":[{"lvl":0,"sym":"(1)","t":"Die Organe der Kärntner Jägerschaft sind:"},{"lvl":1,"sym":"a)","t":"der Kärntner Landesjägertag (Vollversammlung),"},{"lvl":1,"sym":"b)","t":"der Landesausschuss,"},{"lvl":1,"sym":"c)","t":"der Landesvorstand,"},{"lvl":1,"sym":"d)","t":"der Landesjägermeister,"},{"lvl":1,"sym":"e)","t":"die Rechnungsprüfer,"},{"lvl":1,"sym":"f)","t":"der Disziplinarrat,"},{"lvl":1,"sym":"g)","t":"der Disziplinaranwalt."},{"lvl":0,"sym":"(2)","t":"Die Mitglieder der Kollegialorgane und die Organe der Kärntner Jägerschaft, soweit für sie Stellvertreter zu wählen sind, sowie die Delegierten werden im Fall ihrer Verhinderung oder ihres vorzeitigen Ausscheidens, im letzteren Fall bis zur Nachwahl (§ 36 Abs. 2), jeweils von den gewählten Stellvertretern vertreten. Der Finanzreferent (§ 13 Abs. 1) wird bei Verhinderung von einem anderen Mitglied des Vorstandes, das der Landesjägermeister zu bestimmen hat, vertreten. Die Vorschriften für die Vertretenen gelten für die Dauer der Vertretung auch für die Stellvertreter."},{"lvl":0,"sym":"(3)","t":"Die Rechnungsprüfer (Stellvertreter), der Vorsitzende des Disziplinarrates, seine Stellvertreter und die sonstigen Mitglieder des Disziplinarrates sowie der Disziplinanwalt (Stellvertreter) können nicht gleichzeitig Walter eines anderen Organes oder Mitglied eines anderen Kollegialorganes der Kärntner Jägerschaft sein. Abgesehen von diesen Unvereinbarkeiten können alle sonstigen Funktionen von ein- und demselben Mitglied der Kärntner Jägerschaft auch gleichzeitig wahrgenommen werden. In diesem Fall liegt keine zur Vertretung Anlass gebende Verhinderung des gewählten Mitgliedes mehrerer Kollegialorgane und/oder mehrerer sonstiger Organe der Kärntner Jägerschaft vor; das Mitglied bzw. die Organe haben bei der gleichzeitigen Wahrnehmung mehrerer Funktionen nur ein Stimmrecht in dem jeweiligen Organ der Kärntner Jägerschaft. § 6 Kärntner Landesjägertag (Vollversammlung)"},{"lvl":0,"sym":"(1)","t":"Der Kärntner Landesjägertag besteht aus den Bezirksjägermeistern und den Delegierten der Bezirksgruppen."},{"lvl":0,"sym":"(2)","t":"Jede Bezirksgruppe entsendet für die ersten 100 Mitglieder einen Delegierten und für je 50 weitere Mitglieder einen Delegierten. Besteht nach Errechnung der Delegiertenanzahl ein Mitgliederrest von mehr als 25, so ist ein weiterer Delegierter zu entsenden."},{"lvl":0,"sym":"(3)","t":"Delegierte, die verhindert sind, am Kärntner Landesjägertag teilzunehmen, haben dafür zu sorgen, dass die gewählten Ersatzdelegierten einberufen werden."}]},{"id":"7","title":"Teilnahmeverpflichtung am Kärntner Landesjägertag","body":[{"lvl":0,"sym":"","t":"Die Delegierten, die Mitglieder des Landesausschusses sowie die Rechnungsprüfer sind verpflichtet, an den Kärntner Landesjägertagen teilzunehmen und die ihnen übertragenen Aufgaben zu erfüllen."}]},{"id":"8","title":"Aufgaben des Kärntner Landesjägertages","body":[{"lvl":0,"sym":"","t":"Dem Kärntner Landesjägertag obliegen:"},{"lvl":1,"sym":"a)","t":"die Erlassung einer Satzung,"},{"lvl":1,"sym":"b)","t":"die Beschlussfassung in allen Fragen, die der Landesausschuss zur Entscheidung dem Kärntner Landesjägertag vorlegt,"},{"lvl":1,"sym":"c)","t":"die Entgegennahme und Genehmigung des Tätigkeitsberichtes des Landesausschusses,"},{"lvl":1,"sym":"d)","t":"die Wahl des Landesjägermeisters und der sonstigen Mitglieder des Landesvorstandes, der Referenten (Sachbearbeiter) im Landesausschuss und ihrer Stellvertreter, der Rechnungsprüfer und ihrer Stellvertreter, des Vorsitzenden, seiner Stellvertreter und der erforderlichen weiteren Mitglieder des Disziplinarrates sowie des Disziplinaranwaltes und seines Stellvertreters,"},{"lvl":1,"sym":"e)","t":"die Genehmigung des Rechnungsabschlusses und des Voranschlages sowie die Festsetzung des Mitglieds- beitrages auf Vorschlag des Landesvorstandes,"},{"lvl":1,"sym":"f)","t":"die Festsetzung der Versicherungssummen und Prämien für die Jagdhaftpflichtversicherung der Mitglieder sowie die Genehmigung des Abschlusses allfälliger sonstiger Versicherungen für die Mitglieder auf Vorschlag des Landesvorstandes."}]},{"id":"9","title":"Einberufung des Kärntner Landesjägertages","body":[{"lvl":0,"sym":"(1)","t":"Der Kärntner Landesjägertag wird vom Landesjägermeister einberufen. Der Tagungsort und die Tagungszeit des Kärntner Landesjägertages sind überdies im Mitteilungsblatt der Kärntner Jägerschaft (§ 58) so rechtzeitig zu verlautbaren, dass die Frist für Anträge (§ 35) gewahrt bleibt. Dabei ist darauf hinzuweisen, dass Anträge an den Kärntner Landesjägertag mindestens sechs Wochen vor diesem Termin eingebracht werden (§ 35) und dass die Delegierten und die Mitglieder des Landesausschusses sowie die Rechnungsprüfer noch gesondert schriftlich mindestens vierzehn Tage vorher eingeladen werden müssen."},{"lvl":0,"sym":"(2)","t":"Der ordentliche Kärntner Landesjägertag (ordentliche Vollversammlung) findet alljährlich statt. Auf Verlangen des Landesausschusses oder aufgrund der Beschlüsse von mindestens drei Bezirksgruppen muss ein außerordentlicher Kärntner Landesjägertag (außerordentliche Vollversammlung) einberufen werden, der binnen acht Wochen stattzufinden hat. Für seine Einberufung gilt Abs. 1 sinngemäß. Liegt die achtwöchige Frist zwischen zwei Erscheinungsterminen des Mitteilungsblattes (§ 58), entfällt die zusätzliche Verlautbarung im Mitteilungsblatt."}]},{"id":"10","title":"Landesausschuss","body":[{"lvl":0,"sym":"(1)","t":"Der Landesausschuss besteht aus dem Landesvorstand, den Bezirksjägermeistern und höchstens neun Referenten (Sachbearbeitern), von denen einer die Belange des Jagdrechts wahrzunehmen hat."},{"lvl":0,"sym":"(2)","t":"Der Landesausschuss kann sich eine Geschäftsordnung geben, mit welcher in Übereinstimmung mit den Wahlen durch den Kärntner Landesjägertag einzelnen seiner Mitglieder als Referenten einzelne Belange zur Vorberatung übertragen werden. § 11 Aufgaben des Landesausschusses"},{"lvl":0,"sym":"(1)","t":"Der Landesausschuss hat alle Aufgaben der Kärntner Jägerschaft im eigenen Wirkungsbereich zu verwirklichen, soweit sie durch das Jagdgesetz oder diese Satzung nicht ausdrücklich einem anderen Organ zugewiesen sind oder von ihm wegen der Wichtigkeit, insbesondere ihrer grundsätzlichen Bedeutung (Änderung der Jagd- und Schonzeiten) an den Kärntner Landesjägertag zur Entscheidung überwiesen werden."},{"lvl":0,"sym":"(2)","t":"Der Landesausschuss setzt im ersten Viertel des Geschäftsjahres die im § 39 vorgesehenen Vergütungen und Aufwandsentschädigungen fest."},{"lvl":0,"sym":"(3)","t":"Der Landesausschuss kann bestimmte seiner Aufgaben den Bezirksausschüssen und den Hegeringleitern zur Besorgung übertragen."}]},{"id":"12","title":"Sitzungen des Landesausschusses","body":[{"lvl":0,"sym":"(1)","t":"Die Sitzungen des Landesausschusses werden vom Landesjägermeister einberufen. Sie sind nach Bedarf, wenigstens aber viermal im Kalenderjahr sowie dann anzuberaumen, wenn ein Drittel des Landesausschusses dies unter Angabe der Verhandlungsgegenstände beantragt."},{"lvl":0,"sym":"(2)","t":"Zur Vorberatung einzelner Gegenstände kann der Landesausschuss Fachausschüsse einsetzen. In diese kann jedes fachlich besonders geeignete Mitglied der Kärntner Jägerschaft berufen werden. Jedem Fachausschuss muss jedoch mindestens ein Mitglied des Landesausschusses angehören. Die Vorsitzenden der Fachausschüsse sind, wenn sie dem Landesausschuss nicht angehören, den Sitzungen des Landesausschusses mit beratender Stimme beizuziehen."}]},{"id":"13","title":"Landesvorstand","body":[{"lvl":0,"sym":"(1)","t":"Der Landesvorstand besteht aus dem Landesjägermeister, seinem ersten und zweiten Stellvertreter, dem Finanzreferenten und vier weiteren Mitgliedern, von denen eines ein Vertreter der Jagdschutzorgane und eines ein Vertreter der Land- und Forstwirtschaft sein muss."},{"lvl":0,"sym":"(2)","t":"Dem Landesvorstand gehört auch der Referent für das Jagdrecht im Landesausschuss mit beratender Stimme an. Wenn es sich als zweckmässig erweist, kann der Landesvorstand auf Vorschlag des Landesjägermeisters aus dem Kreis der Mitglieder des Landesvorstandes für besondere Aufgaben und auf bestimmte Zeit einen außer- ordentlichen Landesjägermeister-Stellvertreter wählen."},{"lvl":0,"sym":"(3)","t":"Der Landesvorstand kann sich eine Geschäftsordnung geben."}]},{"id":"14","title":"Aufgaben des Landesvorstandes","body":[{"lvl":0,"sym":"(1)","t":"Der Landesvorstand hat alle Aufgaben der Kärntner Jägerschaft im übertragenen Wirkungsbereich zu verwirklichen, soweit sie durch das K-JG nicht ausdrücklich einem anderen Organ zugewiesen sind. Ferner obliegen dem Landesvorstand neben der Besorgung der ihm durch das K-JG ausdrücklich übertragenen Aufgaben im eigenen Wirkungsbereich alle finanziellen Angelegenheiten der Kärntner Jägerschaft sowie die Verwaltung ihres Sondervermögens, ausgenommen die laufende Geschäftsführung (§ 16 Abs. 1)."},{"lvl":0,"sym":"(2)","t":"Der Landesvorstand hat:"},{"lvl":1,"sym":"a)","t":"den Rechnungsabschluss und den Voranschlag zu erstellen,"},{"lvl":1,"sym":"b)","t":"dem Kärntner Landesjägertag den Mitgliedsbeitrag sowie die Versicherungssummen und die Prämien für die Jagdhaftpflichtversicherung und allfällige sonstige von der Kärntner Jägerschaft für ihre Mitglieder abzuschließende Versicherungen vorzuschlagen,"},{"lvl":1,"sym":"c)","t":"die Senate des Disziplinarrates alljährlich vor Jahresschluss für die Dauer des ganzen folgenden Jahres bleibend zusammenzusetzen und die Reihenfolge zu bestimmen, in der die übrigen Mitglieder bei der Verhinderung eines Senatsmitgliedes als Ersatzmänner in die Senate eintreten,"},{"lvl":1,"sym":"d)","t":"die Prüfungskommission für die Jagdprüfung zu bestellen und die zur ordnungsgemäßen Durchführung von Jagdprüfungen erforderlichen Entscheidungen zu treffen,"},{"lvl":1,"sym":"e)","t":"die Prüfungskommission für die Jagdaufseher gemäß dem K-BJPG zu bestellen,"},{"lvl":1,"sym":"f)","t":"die Prüfungskommission für die Berufsjägerprüfung gemäß dem K-BJPG zu bestellen und die Lehrpläne für die jagdlichen Fachkurse nach den Bestimmungen des K-BJPG zu verordnen,"},{"lvl":1,"sym":"g)","t":"alle zwei Jahre einen Tätigkeitsbericht für den Kärntner Landtag zu erstatten. § 15 Sitzungen des Landesvorstandes Die Sitzungen des Landesvorstandes werden vom Landesjägermeister nach Bedarf einberufen."}]},{"id":"16","title":"Landesjägermeister","body":[{"lvl":0,"sym":"","t":"Der Landesjägermeister vertritt die Kärntner Jägerschaft nach außen und unterzeichnet gemeinsam mit einem weiteren Landesvorstandsmitglied rechtsverbindliche Erklärungen der Kärntner Jägerschaft. Ihm obliegt die Besorgung der ihm durch das Jagdgesetz ausdrücklich übertragenen Aufgaben. Er führt die laufenden Geschäfte, vollzieht die Beschlüsse des Kärntner Landesjägertages, des Landesausschusses und des Landesvorstandes und hat in diesen Organen den Vorsitz inne. Organisation der Bezirksgruppen"}]},{"id":"17","title":"Zuständigkeitsbereich","body":[{"lvl":0,"sym":"(1)","t":"Die Bezirksgruppen umfassen jeweils das Gebiet eines politischen Bezirkes, wobei die Städte Klagenfurt und Villach den politischen Bezirken Klagenfurt-Land bzw. Villach-Land zugeordnet sind. Es bestehen daher folgende Bezirksgruppen: Feldkirchen in Kärnten, Hermagor, Klagenfurt, St. Veit/Glan, Spittal/Drau, Villach, Völkermarkt, Wolfsberg."},{"lvl":0,"sym":"(2)","t":"Wenn es wegen der Größe einer Bezirksgruppe notwendig ist, kann der Bezirksausschuss mit Genehmigung des Landesausschusses jeweils für das Gebiet mehrerer Hegeringe Talschaftsreferenten bestellen. Sie haben für eine reibungslose Verbindung zwischen dem Bezirksausschuss und den Hegeringen zu sorgen. Stellung und Aufgaben der Hegeringleiter werden hiedurch nicht berührt."}]},{"id":"18","title":"Organe","body":[{"lvl":0,"sym":"","t":"Die Organe der Bezirksgruppen sind:"},{"lvl":1,"sym":"a)","t":"der Bezirksjägertag (Bezirksversammlung),"},{"lvl":1,"sym":"b)","t":"der Bezirksausschuss,"},{"lvl":1,"sym":"c)","t":"der Bezirksjägermeister."}]},{"id":"19","title":"Bezirksjägertag (Bezirksversammlung)","body":[{"lvl":0,"sym":"(1)","t":"Der Bezirksjägertag (Bezirksversammlung) besteht aus den Hegeringleitern und den Delegierten der Hegeringe."},{"lvl":0,"sym":"(2)","t":"Jeder Hegering entsendet für die ersten 50 Mitglieder einen Delegierten und für je 25 weitere Mitglieder einen Delegierten. Besteht nach Errechnung der Delegiertenanzahl ein Mitgliederrest von mehr als 12, so ist ein weiterer Delegierter zu entsenden."},{"lvl":0,"sym":"(3)","t":"Delegierte, die verhindert sind, an den Bezirksjägertagen teilzunehmen, haben dafür zu sorgen, dass die Ersatzdelegierten einberufen werden."}]},{"id":"20","title":"Teilnahmeverpflichtung am Bezirksjägertag","body":[{"lvl":0,"sym":"","t":"Die Hegeringleiter, die Delegierten und die Mitglieder des Bezirkssausschusses sind verpflichtet, an den Tagungen des Bezirksjägertages teilzunehmen und die ihnen übertragenen Aufgaben zu erfüllen."}]},{"id":"21","title":"Aufgaben des Bezirksjägertages","body":[{"lvl":0,"sym":"","t":"Dem Bezirksjägertag obliegen:"},{"lvl":1,"sym":"a)","t":"die Entgegennahme und Genehmigung des Tätigkeitsberichtes des Bezirksausschusses,"},{"lvl":1,"sym":"b)","t":"die Wahl des Bezirksjägermeisters und seines Stellvertreters sowie dreier weiterer Mitglieder des Bezirksausschusses und deren Stellvertreter,"},{"lvl":1,"sym":"c)","t":"die Wahl der Delegierten und der gleichen Anzahl von Ersatzdelegierten zum Kärntner Landesjägertag. § 22 Einberufung des Bezirksjägertages"},{"lvl":0,"sym":"(1)","t":"Der Bezirksjägertag wird vom Bezirksjägermeister einberufen. Der Zeitpunkt und der Ort des Bezirksjägertages sind überdies im Mitteilungsblatt der Kärntner Jägerschaft (§ 58) so rechtzeitig zu verlautbaren, dass die Frist für Anträge (§ 35) gewahrt bleibt. Dabei ist darauf hinzuweisen, dass Anträge an den Bezirksjägertag mindestens sechs Wochen vor diesem Termin eingebracht werden (§ 35) und dass die Hegeringleiter, die Delegierten und die Mitglieder des Bezirksausschusses noch gesondert schriftlich wenigstens vierzehn Tage vorher eingeladen werden müssen."},{"lvl":0,"sym":"(2)","t":"Der ordentliche Bezirksjägertag (die ordentliche Bezirksversammlung) findet alljährlich vor dem ordentlichen Kärntner Landesjägertag (der ordentlichen Vollversammlung) statt. Auf Verlangen des Bezirksausschusses oder eines Drittels der Delegierten muss ein außerordentlicher Bezirksjägertag (eine außerordentliche Bezirksversammlung) einberufen werden, der binnen acht Wochen stattzufinden hat. Für seine Einberufung gilt Abs. 1 sinngemäß. Liegt die achtwöchige Frist zwischen zwei Erscheinungsterminen des Mitteilungsblattes (§ 58), entfällt die zusätzliche Verlautbarung im Mitteilungsblatt."}]},{"id":"23","title":"Bezirksausschuss","body":[{"lvl":0,"sym":"(1)","t":"Der Bezirksausschuss besteht aus dem Bezirksjägermeister, seinem Stellvertreter und drei weiteren Mitgliedern, von denen eines ein Vertreter der Jagdschutzorgane und eines ein Vertreter der Land- und Forstwirtschaft sein muss. Für die drei weiteren Mitglieder sind Ersatzmitglieder zu wählen."},{"lvl":0,"sym":"(2)","t":"Wenn es sich als zweckmäßig erweist, kann der Bezirksausschuss aus den Mitgliedern der Bezirksgruppe für bestimmte Sachgebiete Sachbearbeiter wählen, die dem Bezirksausschuss mit beratender Stimme angehören. Der Bezirksausschuss kann mit Genehmigung des Landesausschusses für das Gebiet jeweils mehrerer Hege- ringe oder für jeweils eine Wildregion Talschaftsreferenten (Leiter der Wildregion) bestellen. Die Tal- schaftsreferenten (Leiter der Wildregionen) gehören dem Bezirksausschuss ebenfalls mit beratender Stimme an."},{"lvl":0,"sym":"(3)","t":"Zur Beurteilung der bei den Hegeschauen auszustellenden Geweihe, Gehörne und Unterkiefer (§ 31a) des der Abschussplanung unterliegenden Schalenwildes (Trophäen) hat der Bezirksausschuss die erforderliche Zahl von Bewertern zu wählen."}]},{"id":"24","title":"Aufgaben des Bezirksausschusses","body":[{"lvl":0,"sym":"(1)","t":"Dem Bezirksausschuss obliegen neben der Besorgung der ihm durch das Jagdgesetz ausdrücklich übertragenen Aufgaben die Besorgung der ihm vom Landesausschuss übertragenen Aufgaben, die Festsetzung des Bereiches der Hegeringe, die Koordinierung der Tätigkeit der Hegeringe im Bereich des Bezirkes und die Erstattung von Tätigkeitsberichten an den Bezirksjägertag. Der Bezirksausschuss kann bestimmte seiner Angelegenheiten den Hegeringleitern zur Besorgung übertragen."},{"lvl":0,"sym":"(2)","t":"Der Bezirksausschuss kann verdiente Mitglieder der Bezirksgruppe mit Genehmigung des Landesausschusses auszeichnen."}]},{"id":"25","title":"Sitzungen des Bezirksausschusses","body":[{"lvl":0,"sym":"","t":"Die Sitzungen des Bezirksausschusses werden vom Bezirksjägermeister bei Bedarf einberufen."}]},{"id":"26","title":"Bezirksjägermeister","body":[{"lvl":0,"sym":"","t":"Der Bezirksjägermeister vertritt die Bezirksgruppe nach außen. Ihm obliegt die Besorgung der ihm durch das Jagdgesetz ausdrücklich übertragenen Aufgaben. Er führt die laufenden Geschäfte der Bezirksgruppe. Er hat beim Bezirksjägertag und im Bezirksausschuss den Vorsitz inne und vollzieht deren Beschlüsse sowie die Beschlüsse des Kärntner Landesjägertages, des Landesausschusses und des Landesvorstandes. Organisation der Hegeringe"}]},{"id":"27","title":"Einrichtung und Mitgliedschaft","body":[{"lvl":0,"sym":"(1)","t":"Die Anzahl und die Bereiche der Hegeringe, die sich nicht überschneiden dürfen, werden vom Bezirksaus- schuss festgesetzt. Dabei ist darauf zu achten, dass sich die Grenzen des Hegeringes tunlichst mit den Grenzen einer oder mehrerer Katastralgemeinden decken. Ein Hegering soll mindestens 30 Mitglieder haben."},{"lvl":0,"sym":"(2)","t":"Der Hegering besteht aus den Mitgliedern der Kärntner Jägerschaft, die im Bereich des Hegeringes"},{"lvl":1,"sym":"a)","t":"ihren Hauptwohnsitz haben oder"},{"lvl":1,"sym":"b)","t":"dort das Jagdausübungsrecht besitzen oder"},{"lvl":1,"sym":"c)","t":"dort den Jagdschutz ausüben oder"},{"lvl":1,"sym":"d)","t":"einer Jagdgesellschaft im Bereich des Hegeringes als Mitglied(er) angehören. Mitglieder der Kärntner Jägerschaft, die auf diese Art Mitglieder zweier oder mehrerer Hegeringe sind, haben zu erklären, in welchem Hegering sie ihr Stimmrecht sowie das aktive und passive Wahlrecht in Anspruch nehmen wollen. Wird eine solche Erklärung nicht rechtzeitig abgegeben, ist das Mitglied bei der Landesgeschäftsstelle im Mitglieder- und Wählerverzeichnis für den Hauptwohnsitz-Hegering zu führen und hat dort sein Stimmrecht sowie aktives und passives Wahlrecht."},{"lvl":0,"sym":"(3)","t":"Mitglieder der Kärntner Jägerschaft, für die sich aus Abs. 2 keine Zugehörigkeit zu einem Hegering ergibt, haben zu erklären, im welchem Hegering sie künftig ihre Mitgliedschaft ausüben wollen. Wird eine solche Erklärung nicht rechtzeitig abgegeben, ist das Mitglied bei der Landesgeschäftstelle im Mitglieder- und Wählerverzeichnis für keinen Hegering zu führen und kann in keinem Hegering sein Stimmrecht sowie aktives und passives Wahlrecht ausüben."},{"lvl":0,"sym":"(4)","t":"Die Erklärung nach Abs. 2 oder 3 ist bis 31. Jänner eines Jahres bei der Landesgeschäftsstelle (§ 57) schriftlich abzugeben. Nicht fristgerecht abgegebene Erklärungen gelten erst ab dem nächsten Kalenderjahr. Das sich im Sinn der Abs. 2 oder 3 erklärende Mitglied ist bei der Landesgeschäftsstelle im Mitglieder- und Wählverzeichnis solange für den Hegering zu führen, für welchen sich das Mitglied erklärt hat, bis das Mitglied frist- und formgerecht eine abweichende Erklärung abgibt."}]},{"id":"28","title":"Organe","body":[{"lvl":0,"sym":"","t":"Die Organe des Hegeringes sind:"},{"lvl":1,"sym":"a)","t":"die Hegeringversammlung,"},{"lvl":1,"sym":"b)","t":"der Hegeringleiter."}]},{"id":"29","title":"Hegeringversammlung","body":[{"lvl":0,"sym":"","t":"Die Hegeringversammlung wird von allen Mitgliedern des Hegeringes (§ 27 Abs. 2, 3) gebildet."}]},{"id":"30","title":"Aufgaben der Hegeringversammlung","body":[{"lvl":0,"sym":"","t":"Der Hegeringversammlung obliegen:"},{"lvl":1,"sym":"a)","t":"die Entgegennahme und Genehmigung des Tätigkeitsberichtes des Hegeringleiters,"},{"lvl":1,"sym":"b)","t":"die Wahl des Hegeringleiters und seines Stellvertreters,"},{"lvl":1,"sym":"c)","t":"die Wahl der Delegierten und der gleichen Anzahl von Ersatzdelegierten zum Bezirksjägertag,"},{"lvl":1,"sym":"d)","t":"die Durchführung der jährlichen Hegeschau,"},{"lvl":1,"sym":"e)","t":"die Veranstaltung von mindestens einem jährlichen Hegeringschießen."}]},{"id":"31","title":"Einberufung der Hegeringversammlung","body":[{"lvl":0,"sym":"(1)","t":"Die Hegeringversammlung wird vom Hegeringleiter wenigstens vierzehn Tage vorher durch Einschaltung im Mitteilungsblatt der Kärntner Jägerschaft (§ 58) einberufen."},{"lvl":0,"sym":"(2)","t":"Die ordentliche Hegeringversammlung findet alljährlich vor dem Bezirksjägertag statt. Auf Verlangen eines Drittels der Mitglieder muss eine außerordentliche Hegeringversammlung einberufen werden, die binnen acht Wochen stattzufinden hat."},{"lvl":0,"sym":"(3)","t":"Mit Zustimmung des Bezirksjägermeisters kann die ordentliche Hegeringversammlung von zwei oder mehreren aneinandergrenzenden Hegeringen gemeinsam abgehalten werden. § 31a Hegeschau"},{"lvl":0,"sym":"(1)","t":"Die Hegeschau ist so zu gestalten, dass sie eine Beurteilung der Einhaltung der Grundsätze eines geordneten Jagdbetriebes und der Hegepflicht gemäß § 3 K-JG in den Jagdgebieten des Hegeringes ermöglicht. Die Erfüllung der Abschusspläne im Hegering ist, gegliedert nach Geschlechtern und Klassen, auf geeignete Weise zu veranschaulichen."},{"lvl":0,"sym":"(2)","t":"Die Trophäen des Schalenwildes sind, einschließlich des linken Unterkiefers von Hirschen und Rehböcken, vom Jagdausübungsberechtigten auszustellen. Wenn es der Landesausschuss der Kärntner Jägerschaft beschließt, sind die Jagdausübungsberechtigten verpflichtet, auch die linken Unterkiefer von weiblichem Schalenwild, Kälbern, Kitzen und Lämmern auszustellen."},{"lvl":0,"sym":"(3)","t":"Der Hegeringleiter hat durch hiezu fachlich befähigte Personen aus dem Kreis der Bewerter gemäß § 23 Abs. 3 nach den vorgelegten Trophäen und Unterkiefern die Einhaltung des Abschussplanes der Zahl und der Art nach zu überprüfen und die Trophäen und die Unterkiefer nach der Überprüfung dauerhaft zu kennzeichnen, ohne die Trophäen zu entwerten. Das Ergebnis der Prüfung der Einhaltung des Abschussplanes ist der Bezirksverwaltungsbehörde bekanntzugeben."},{"lvl":0,"sym":"(4)","t":"Anlässlich der Hegeschau sind nach Möglichkeit Fachvorträge, Lehrausstellungen, Filme u.dgl. anzubieten."}]},{"id":"31b","title":"Hegeringschießen","body":[{"lvl":0,"sym":"(1)","t":"Die Mitglieder der Kärntner Jägerschaft sind zum verlässlichen und sachgemäßen Umgang mit ihren Jagdwaffen verpflichtet. Sie haben ihre Jagdwaffe regelmäßig auf ihre Sicherheit und Präzision zu überprüfen und ihre Schießfertigkeit regelmäßig so zu üben, dass sie die Jagd sachgemäß und weidgerecht ausüben können. Sie haben an den Hegeringschießen teilzunehmen."},{"lvl":0,"sym":"(2)","t":"Zur Förderung des sachgemäßen Umgangs mit Jagdwaffen haben die Hegeringe alljährlich mindestens ein Hegeringschießen zu veranstalten und ihren Mitgliedern die Teilnahme auf dem Nachweis über die Einzahlung des Mitgliedsbeitrages zur Kärntner Jägerschaft zu bestätigen."},{"lvl":0,"sym":"(3)","t":"Einem Mitglied, das am Hegeringschießen nicht teilnehmen kann, ist diese Bestätigung im Sinne des Abs. 2 vom Hegeringleiter oder von hiezu vom Landesausschuss der Kärntner Jägerschaft sonst noch autorisierten Personen zu erteilen, wenn es auf einer Schießstätte eine dem Hegeringschießen gleichwertige Überprüfung der Sicherheit und Präzision seiner Jagdwaffe vornimmt und seine Schießfertigkeit übt; auch diese Bestätigung ist auf dem Nachweis über die Einzahlung des Mitgliedsbeitrages zur Kärntner Jägerschaft zu vermerken und gilt bis zum nächstjährigen Hegeringschießen."},{"lvl":0,"sym":"(4)","t":"Jagdausübungsberechtigte und Jagdschutzorgane haben sich davon zu überzeugen, dass ihre Jagdgäste mit Jagdwaffen verlässlich, sachgemäß und weidgerecht umgehen können."}]},{"id":"32","title":"Hegeringleiter","body":[{"lvl":0,"sym":"","t":"Der Hegeringleiter vertritt den Hegering nach außen. Ihm obliegt neben der Besorgung der ihm durch das Jagdgesetz ausdrücklich übertragenen Aufgaben die Besorgung der ihm vom Landesausschuss oder vom Bezirksausschuss übertragenen Aufgaben, die laufende Geschäftsführung des Hegeringes und die Erstattung von Tätigkeitsberichten an die Hegeringversammlung. Er führt in der Hegeringversammlung den Vorsitz. Gemeinsame Bestimmungen für die Organe"}]},{"id":"33","title":"Tagesordnung","body":[{"lvl":0,"sym":"","t":"Bei der Einberufung von Kollegialorganen sind stets der Tagungsort, die Tagungszeit und die Tagesordnung anzugeben."}]},{"id":"34","title":"Beschlüsse","body":[{"lvl":0,"sym":"(1)","t":"Die Beschlüsse werden mit einfacher Mehrheit der abgegebenen Stimmen gefasst. Der Vorsitzende stimmt zuletzt ab und gibt bei Stimmengleichheit mit seiner Stimme den Ausschlag."},{"lvl":0,"sym":"(2)","t":"Die Kollegialorgane der Kärntner Jägerschaft sind beschlussfähig, wenn mehr als die Hälfte der Mitglieder anwesend ist, der Kärntner Landesjägertag und der Bezirksjägertag überdies nur dann, wenn durch die anwesenden Delegierten mindestens die Hälfte der Bezirksgruppen bzw. der Hegeringe vertreten ist."},{"lvl":0,"sym":"(3)","t":"Sind die Voraussetzungen des Abs. 2 beim Kärntner Landesjägertag, beim Bezirksjägertag und der Hegeringversammlung nicht gegeben, so sind diese Organe nach Ablauf einer halben Stunde auch dann beschlussfähig, wenn mindestens 20 vH ihrer wahlberechtigten Mitglieder anwesend ist, der Kärntner Landesjägertag und der Bezirksjägertag überdies nur dann, wenn mindestens 20 vH der Bezirksgruppen bzw. der Hegeringe vertreten ist."}]},{"id":"35","title":"Anträge","body":[{"lvl":0,"sym":"","t":"Jedes Mitglied eines Kollegialorganes ist berechtigt, Anträge zu stellen. Anträge an den Kärntner Landesjägertag und an den Bezirksjägertag sind mindestens sechs Wochen vorher einzubringen. Der Kärntner Landesjägertag beschließt, ob Anträge an den Landesausschuss verwiesen oder beim Kärntner Landesjägertag behandelt werden. Die Reihenfolge, in der vorliegende Anträge zur Behandlung und Abstimmung gelangen, bestimmt der Vorsitzende. Über Anträge zur Geschäftsordnung ist stets sogleich abzustimmen."}]},{"id":"36","title":"Funktionsperiode","body":[{"lvl":0,"sym":"(1)","t":"Die Funktionsperiode der Organe beträgt fünf Jahre."},{"lvl":0,"sym":"(2)","t":"Scheiden Mitglieder vor Ablauf ihrer Funktionsperiode aus, sind für den Rest der Funktionsperiode Nachwahlen vorzunehmen."},{"lvl":0,"sym":"(3)","t":"Erfüllt ein Mitglied eines Kollegialorganes oder ein Einzelorgan die ihm obliegenden Aufgaben nicht oder nur mangelhaft oder ist es ohne sein Verschulden dazu dauernd nicht mehr in der Lage, ist auf Verlangen eines Drittels der jeweils Wahlberechtigten auf die Tagsordnung des nächsten Kärntner Landesjägertages, des nächsten Bezirksjägertages oder der nächsten Hegeringversammlung die Neuwahl in die betreffende Funktion zu setzen. Finanzieller Teil"}]},{"id":"37","title":"Mittel der Kärntner Jägerschaft","body":[{"lvl":0,"sym":"","t":"Die Einnahmen der Kärntner Jägerschaft bestehen aus Mitgliedsbeiträgen, Jagdkartenbeiträgen, Jagdgastkartenbeiträgen, Drucksortenbeiträgen, Abgabenzuweisungen, Verwaltungsbeiträgen, Spenden, Zuwendungen aller Art und den Erträgnissen ihrer Einrichtungen und ihres Vermögens."}]},{"id":"38","title":"Beitrag","body":[{"lvl":0,"sym":"(1)","t":"Die Kärntner Jägerschaft hebt zur Erfüllung ihrer Aufgaben von ihren Mitgliedern Beiträge ein."},{"lvl":0,"sym":"(2)","t":"Die Höhe des Mitgliedsbeitrages wird vom Kärntner Landesjägertag festgesetzt. Die Neufestsetzung der Jagdkartenbeiträge und der Jagdgastkartenbeiträge nach dem Verbraucherpreisindex wird vom Landesvor- stand nach den Bestimmungen des K-JG verordnet."},{"lvl":0,"sym":"(3)","t":"Der Beitrag der Mitglieder, die Prämie für die Jagdhaftpflichtversicherung, der Jagdkartenbeitrag und der Jagdgastkartenbeitrag werden nach den Bestimmungen des K-JG von der Landesgeschäftsstelle (§ 57) eingehoben."}]},{"id":"39","title":"Vergütungen und Aufwandsentschädigungen","body":[{"lvl":0,"sym":"(1)","t":"Die Mitglieder der Organe sowie Personen, denen von Organen der Kärntner Jägerschaft Aufgaben übertragen worden sind, üben ihre Tätigkeit ehrenamtlich aus. Sie haben jedoch Anspruch auf Vergütung der ihnen in Ausübung ihrer Tätigkeit erwachsenden Barauslagen. Die Höhe dieser Vergütung wird auf Vorschlag des Landesvorstandes vom Landesausschuss festgesetzt. Für die Teilnahme am Kärntner Landesjägertag,    an Bezirksjägertagen und Hegeringversammlungen steht deren Mitgliedern ein Auslagenersatz nicht zu."},{"lvl":0,"sym":"(2)","t":"Der Landesjägermeister, seine beiden Stellvertreter, der Finanzreferent und die Bezirksjägermeister haben Anspruch auf eine angemessene Aufwandsentschädigung, deren Höhe vom Landesausschuss festgesetzt wird. § 40 Geschäftsjahr Das Geschäftsjahr ist das Kalenderjahr."}]},{"id":"41","title":"Finanzgebarung","body":[{"lvl":0,"sym":"(1)","t":"Der Landesvorstand erstellt den Voranschlag und legt ihn dem ordentlichen Kärntner Landesjägertag zur Genehmigung vor. Er führt die Gebarung der Kärntner Jägerschaft im Rahmen des genehmigten Voranschlages, ausgenommen die laufende Gebarung."},{"lvl":0,"sym":"(2)","t":"Die laufende Geschäftsgebarung obliegt dem Landesjägermeister. Er ist berechtigt, über Ausgaben, die ein Prozent des jährlich eingehenden Mitgliedsbeitrages nicht übersteigen, selbständig zu verfügen, doch muss er bei der nächsten Sitzung des Landesvorstandes diesen davon in Kenntnis setzen."},{"lvl":0,"sym":"(3)","t":"Der Landesvorstand erstellt am Ende des Geschäftsjahres den Rechnungsabschluss und legt ihn dem ordentlichen Kärntner Landesjägertag zur Genehmigung vor. Die einzelnen Positionen des Rechnungsabschlusses sind den betreffenden Positionen des Voranschlages gegenüberzustellen. Abweichungen sind zu begründen. Überschreitungen der Ansätze des Voranschlages bedürfen der Genehmigung des Landesvorstandes."}]},{"id":"42","title":"","body":[{"lvl":0,"sym":"(1)","t":"Der Landesvorstand beschließt am Beginn jedes Geschäftsjahres die Finanzzuweisungen an die Bezirks- gruppen zur Deckung der laufenden Geschäftsgebarung derselben. Dabei ist nach einem Schlüssel vorzugehen, der die Größe des Gebietes der Bezirksgruppe, die Mitgliederzahl und die besonderen Umstände berücksichtigt, unter denen die Geschäftsstellen jeweils zu arbeiten haben."},{"lvl":0,"sym":"(2)","t":"Der Bezirksjägermeister führt die laufende Geschäftsgebarung der Bezirksgruppe im Rahmen der jährlichen Zuweisungen."},{"lvl":0,"sym":"(3)","t":"Der Bezirksausschuss hat bis 31. März jedes Jahres für das vorangegangene Geschäftsjahr dem Landesvor- stand über die gesamten Einnahmen und Ausgaben der vom Landesvorstand gemäß Abs. 1 den Bezirksgruppen zugewiesenen Mittel Rechnung zu legen."}]},{"id":"43","title":"","body":[{"lvl":0,"sym":"(1)","t":"Der Landesvorstand führt die Verwaltung des Sondervermögens der Kärntner Jägerschaft."},{"lvl":0,"sym":"(2)","t":"Der Landesjägermeister oder das von ihm beauftragte Mitglied des Landesvorstandes hat die Tätigkeit des Personals des Jägerhofes Schloss Mageregg zu überwachen und diesem Anweisungen zu geben. Die Bestellung und Entlassung des Personals des Jägerhofes obliegen dem Landesvorstand."}]},{"id":"44","title":"Rechnungsprüfung","body":[{"lvl":0,"sym":"","t":"Der Rechnungsabschluss der Kärntner Jägerschaft ist alljährlich rechtzeitig vor dem ordentlichen Kärntner Landesjägertag durch die beiden Rechnungsprüfer auf seine ziffernmäßige Richtigkeit sowie die Zweckmäßigkeit und Sparsamkeit der Gebarung zu überprüfen. Dabei sind auch die Abrechnungen der Bezirksgruppen einer solchen Überprüfung zu unterziehen."}]},{"id":"45","title":"Rechte und Pflichten der Mitglieder","body":[{"lvl":0,"sym":"(1)","t":"Die Mitglieder der Kärntner Jägerschaft sind berechtigt, von deren Einrichtungen und Begünstigungen zu den festgesetzten Bedingungen Gebrauch zu machen und Rat und Aufklärung in allen jagdlichen Fragen zu beanspruchen. Sie sind berechtigt, auch an jenen Kärntner Landesjägertagen, Bezirksjägertagen und Hegeringversammlungen, denen sie nicht als Delegierte oder Mitglieder angehören, ohne Stimmrecht teilzunehmen."},{"lvl":0,"sym":"(2)","t":"Die Mitglieder der Kärntner Jägerschaft sind verpflichtet:"},{"lvl":1,"sym":"a)","t":"die Interessen der Kärntner Jägerschaft zu fördern, alles zu tun, was der Erreichung des satzungsmäßigen Zweckes dient, und alles zu unterlassen, was den Interessen und dem Ansehen der Kärntner Jägerschaft abträglich ist,"},{"lvl":1,"sym":"b)","t":"die Organe der Kärntner Jägerschaft bei der Durchführung ihrer Aufgaben zu unterstützen."}]},{"id":"46","title":"Disziplinarrat","body":[{"lvl":0,"sym":"(1)","t":"Vergehen der Mitglieder der Kärntner Jägerschaft gegen die Standespflichten, die nicht länger als fünf Jahre vom Zeitpunkt der ersten Verfolgungshandlung (Ladung, Vernehmung, Ersuchen um Vernehmung) zurückliegen, werden von einem Disziplinarrat der Kärntner Jägerschaft mit dem Sitz in Klagenfurt geahndet. In die Frist von fünf Jahren sind Zeiten von bis zu zehn Jahren nicht einzurechnen, in denen keine Mitgliedschaft zur Kärntner Jägerschaft besteht."},{"lvl":0,"sym":"(2)","t":"Ein Vergehen gegen die Standespflichten liegt vor, wenn ein Mitglied der Kärntner Jägerschaft wiederholt oder gröblich jagdrechtliche Vorschriften übertritt, Grundsätze der Weidgerechtigkeit missachtet oder die Satzung und Interessen der Kärntner Jägerschaft verletzt."},{"lvl":0,"sym":"(3)","t":"Der Verfolgung durch den Disziplinarrat steht der Umstand, dass dieselbe Handlung oder Unterlassung auch von einem Gericht oder einer Verwaltungsbehörde zu bestrafen ist, nicht entgegen."},{"lvl":0,"sym":"(4)","t":"Der Disziplinarrat besteht aus dem Vorsitzenden, seinen Stellvertretern und der erforderlichen Anzahl von Mitgliedern; der Vorsitzende und seine Stellvertreter müssen rechtskundig sein. Er verhandelt und entscheidet in Senaten, die aus einem Senatsvorsitzenden und zwei weiteren Mitgliedern bestehen. Die Senate sind vom Landesvorstand vor Jahresschluss für die Dauer des ganzen folgenden Jahres bleibend zusammenzusetzen. Zugleich ist die Reihenfolge zu bestimmen, in der die übrigen Mitglieder bei der Verhinderung eines Senatsmitgliedes als Ersatzmänner in die Senate eintreten."},{"lvl":0,"sym":"(5)","t":"Disziplinarstrafen sind:"},{"lvl":1,"sym":"a)","t":"der einfache Verweis,"},{"lvl":1,"sym":"b)","t":"der strenge Verweis,"},{"lvl":1,"sym":"c)","t":"der Ausschluss aus der Kärntner Jägerschaft auf bestimmte Zeit,"},{"lvl":1,"sym":"d)","t":"der Ausschluss aus der Kärntner Jägerschaft auf Dauer."}]},{"id":"47","title":"Disziplinarverfahren","body":[{"lvl":0,"sym":"(1)","t":"Der aus dem Kreis der rechtskundigen Mitglieder zu wählende Disziplinaranwalt (Stellvertreter) hat jedes Vergehen gegen die Standespflichten, das ihm zur Kenntnis gelangt, auf die Voraussetzungen für ein Disziplinarverfahren zu prüfen und sodann die Unterlagen mit seinen Anträgen dem Disziplinarrat zu übermitteln."},{"lvl":0,"sym":"(2)","t":"Der Vorsitzende des Senates hat über jeden Antrag des Disziplinaranwaltes das Disziplinarverfahren zu eröffnen, den Sachverhalt zu ermitteln und den Beschuldigten zu eigenen Handen aufzufordern, sich zu dem angelasteten Sachverhalt binnen zwei Wochen schriftlich zu äußern und die seiner Verteidigung dienenden Beweismittel vorzubringen."},{"lvl":0,"sym":"(3)","t":"Nach Abschluss des Ermittlungsverfahrens hat der Senat zu beschließen, ob das Verfahren einzustellen ist (Einstellungsbeschluss) oder ob das Verfahren in nichtöffentlicher mündlicher Verhandlung weiterzuführen ist (Verweisungsbeschluss). Zu dieser sind der Disziplinaranwalt und der Beschuldigte sowie etwaige Zeugen und Sachverständige mindestens zwei Wochen vorher schriftlich, der Beschuldigte zu eigenen Handen, zu laden. Erscheint der Beschuldigte ohne ausreichende Entschuldigung nicht, so kann in seiner Abwesenheit die Verhandlung durchgeführt und das Erkenntnis gefällt werden."},{"lvl":0,"sym":"(4)","t":"Zu Beginn der Verhandlung ist dem Beschuldigten das Ergebnis des Ermittlungsverfahrens vorzuhalten. Sodann ist er in Abwesenheit etwaiger Zeugen über den Sachverhalt zu vernehmen. Hierauf erfolgt die Befragung etwaiger Zeugen und Sachverständiger. Nach Schluss der Beweisaufnahme gebührt dem Beschuldigten oder seinem Verteidiger das Schlusswort. Hierauf entscheidet der Senat in geheimer Beratung."},{"lvl":0,"sym":"(5)","t":"Das Erkenntnis ist im Namen der Kärntner Jägerschaft vom Vorsitzenden sogleich zu verkünden und hat entweder auf Freispruch oder auf Schuldspruch zu lauten. Es hat den Spruch, die Gründe und Rechtsmittelbelehrung zu enthalten. Auf Verlangen ist eine vom Vorsitzenden unterschriebene schriftliche Ausfertigung des Erkenntnisses dem Beschuldigten zu eigenen Handen zuzustellen. Das in Abwesenheit des Beschuldigten gefällte Erkenntnis ist schriftlich auszufertigen und dem Beschuldigten zu eigenen Handen zuzustellen."},{"lvl":0,"sym":"(6)","t":"Über die Verhandlung ist eine Niederschrift aufzunehmen, die den Verlauf und Inhalt der Verhandlung richtig und verständlich wiedergibt. Der Disziplinarrat kann sich für die Abfassung der Niederschrift eines Schallträgers bedienen oder die Niederschrift in Kurzschrift aufnehmen. Solche Aufnahmen oder Niederschriften sind unverzüglich in Vollschrift zu übertragen und dem Disziplinarbeschuldigten auf sein Verlangen zuzustellen."},{"lvl":0,"sym":"(7)","t":"Gegen Entscheidungen des Disziplinarrates sind ordentliche Rechtsmittel ausgeschlossen. Über Berufungen gegen Entscheidungen des Disziplinarrates entscheidet der unabhängige Verwaltungssenat endgültig. Das Berufungsrecht steht auch dem Disziplinaranwalt zu."},{"lvl":0,"sym":"(8)","t":"Im Übrigen gelten für das Verfahren vor dem Disziplinarrat die Bestimmungen des Allgemeinen Verwaltungsverfahrensgesetzes, insbesondere über die Wirkung rechtzeitig eingebrachter Berufungen und den Ausschluss der aufschiebenden Wirkung (§ 64 AVG), die Wiederaufnahme des Verfahrens, (§§ 69, 70 AVG), die Wiedereinsetzung in den vorigen Stand (§§ 71, 72 AVG) und die Kosten (§§ 74 bis 77 AVG)."},{"lvl":0,"sym":"(9)","t":"Die rechtskräftigen Erkenntnisse sind der zuständigen Bezirksverwaltungsbehörde im Wege der Aufsichtsbehörde (§ 91 K-JG) sowie dem zuständigen Bezirksjägermeister bekannt zu geben. Lautet das Erkenntnis auf zeitlichen oder dauernden Ausschluss aus der Kärntner Jägerschaft, so ist es im Mitteilungsblatt der Kärntner Jägerschaft zu veröffentlichen. Lautet das Erkenntnis auf einfachen oder strengen Verweis, so ist es im Mitteilungsblatt der Kärntner Jägerschaft ohne Nennung des Täters und Tatortes zu veröffentlichen. Wahlordnung"}]},{"id":"48","title":"Wahlausschreibung","body":[{"lvl":0,"sym":"(1)","t":"Ort und Zeit der Wahl sind den Mitgliedern des Kärntner Landesjägertages, des Bezirksjägertages und der Hegeringversammlung mindestens vierzehn Tage vorher schriftlich bekannt zu geben."},{"lvl":0,"sym":"(2)","t":"Die Wahlausschreibung hat außerdem zu enthalten:"},{"lvl":1,"sym":"a)","t":"die Mitteilung, welche Organe zu wählen sind,"},{"lvl":1,"sym":"b)","t":"die Anzahl der zu wählenden Personen und ihrer allfälligen Stellvertreter,"},{"lvl":1,"sym":"c)","t":"die Mitteilung, bei wem und bis zu welchem Zeitpunkt Wahlvorschläge eingebracht werden können (§ 50 Abs. 2),"},{"lvl":1,"sym":"d)","t":"den Tag, der als Stichtag für die Voraussetzungen des Wahlrechtes und der Wählbarkeit (§ 49) gilt."},{"lvl":0,"sym":"(3)","t":"Die Wahlausschreibung ist überdies mindestens vierzehn Tage vor dem Wahltermin im Mitteilungsblatt der Kärntner Jägerschaft (§ 58) ins Auge fallend zu verlautbaren."},{"lvl":0,"sym":"(4)","t":"Liegt die achtwöchige Frist des § 9 Abs. 2, des § 22 Abs. 2 oder des § 31 Abs. 2 für die Einberufung eines außerordentlichen Kärntner Landesjägertages, eines außerordentlichen Bezirksjägertages oder einer außerordentlichen Hegeringversammlung zwischen zwei Erscheinungsterminen des Mitteilungsblattes (§ 58), entfällt die zusätzliche Verlautbarung im Mitteilungsblatt. In einem solchen Fall ist die Wahlausschreibung den Wahlberechtigten und Teilnahmeverpflichteten zuzustellen."}]},{"id":"49","title":"Wahlberechtigung und Wählbarkeit","body":[{"lvl":0,"sym":"(1)","t":"Wahlberechtigt sind:"},{"lvl":1,"sym":"a)","t":"beim Kärntner Landesjägertag die Bezirksjägermeister und die Delegierten,"},{"lvl":1,"sym":"b)","t":"beim Bezirksjägertag, die Hegeringleiter und die Delegierten,"},{"lvl":1,"sym":"c)","t":"bei der Hegeringversammlung die Mitglieder des Hegeringes."},{"lvl":0,"sym":"(2)","t":"Wählbar ist jedes ordentliche Mitglied der Kärntner Jägerschaft, das einem Hegering angehört, der im Zuständigkeitsbereich jenes Organs liegt, dessen Mitglieder zu wählen sind."},{"lvl":0,"sym":"(3)","t":"Ob die Voraussetzungen nach Abs. 1 oder 2 zutreffen, ist nach dem bei der Landesgeschäftsstelle (§ 57) geführten Mitglieder- und Wählerverzeichnis für die Hegeringe zum bekannt gegebenen Stichtag (§ 48 Abs. 2 lit. d) zu beurteilen."}]},{"id":"50","title":"Wahlvorschläge","body":[{"lvl":0,"sym":"(1)","t":"Wahlen beim Kärntner Landesjägertag, beim Bezirksjägertag und in der Hegeringversammlung dürfen nur auf Grund von schriftlichen Wahlvorschlägen der Wahlberechtigten durchgeführt werden. Wahlvorschläge müssen bis zum Ablauf des achten Tages vor dem Wahltermin eingebracht werden, sofern nicht ein Fall des § 54 Abs. 3 vorliegt."},{"lvl":0,"sym":"(2)","t":"Wahlvorschläge sind beim Vorsitzenden des für die Wahl zuständigen Organes (§§ 16, 26, 32) einzubringen."},{"lvl":0,"sym":"(3)","t":"Der Wahlvorschlag muss die Zustimmungserklärung jedes Kandidaten zur Aufnahme in den Wahlvorschlag enthalten; hiefür genügt die Beisetzung der Unterschrift."},{"lvl":0,"sym":"(4)","t":"Die Bestimmung des Abs. 3 gilt nicht für Wahlvorschlä
